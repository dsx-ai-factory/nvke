apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "site-workflow-engine"
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  project: "default"
  sources:
    - repoURL: oci://registry.example/nke-charts/site-workflow-engine
      chart: site-workflow-engine
      targetRevision: 0.9.4
      helm:
        valueFiles:
          - $values/029-site-workflow-engine/values.yaml
    - repoURL: 'https://github.com/NVIDIA/nke'
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "site-workflow-engine"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply: enabled uniformly across all generated
      # Applications. Required for charts whose CRDs exceed kubectl's
      # 262144-byte client-side annotation cap (e.g.,
      # kube-prometheus-stack, kai-scheduler) — otherwise Argo's sync
      # retries forever with "metadata.annotations: Too long". The
      # apiserver's structured-merge path has no such cap. Benign on
      # Applications that don't need it (pre-folder Namespaces,
      # post-folder ConfigMaps) — keeping it on every Application avoids
      # per-Application template branching and a confusing mix of sync
      # strategies in a single bundle.
      - ServerSideApply=true
