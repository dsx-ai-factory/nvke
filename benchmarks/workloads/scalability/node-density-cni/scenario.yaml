---
slug: node-density-cni
workload: scalability
description: >-
  Publicly available kube-burner "node-density-cni" workload filling worker nodes
  to a chosen pod density, where each pod becomes Ready only once it can reach a
  webserver through a Service — so the latency measured is time-to-connectivity
  through the CNI and Service layer.

intent:
  goal: >-
    Establish a repeatable measure of how long a pod takes to become usable, not
    merely scheduled, at realistic node density. Readiness here depends on the
    network path being programmed, so the number a reader gets back reflects CNI
    and Service programming under load rather than scheduler and kubelet timing
    alone.
  characterizes:
    - Pod-ready p99 where readiness gates on pod-to-Service-to-pod connectivity
    - Pod scheduling latency at high per-node density
    - Service-ready latency under bulk Service creation
    - API server and etcd CPU and memory headroom
    - etcd disk write latency and database size
    - API Priority and Fairness inflight headroom

topology:
  node_count: 47
  node_type:
    cpu: AMD EPYC 9004 series
    cpu_cores: 128
    memory_gib: 1007
    arch: x86_64
  roles:
    control_plane: 3
    worker: 42
    monitoring: 2

sizing:
  derivation:
    rule: >-
      Iteration count is derived from the cluster rather than fixed. Multiply the
      nodes matching the node selector by the target pods-per-node, subtract the
      pods already resident on those nodes, then halve the result. The halving is
      because each iteration creates two pods — a webserver and a curl client
      whose startup probe gates on reaching the webserver through its Service —
      so the halved count still lands at the requested average pod density. Two inputs
      are easy to get wrong. The subtraction counts every pod already on those
      nodes with no phase or namespace filter, so system DaemonSets count and so
      do completed pods not yet garbage collected; the same command therefore
      yields a different iteration count on a busier cluster. The nodeSelector inputVar sets where pods land;
      count the nodes it matches. A selector that only excludes control-plane
      nodes also takes monitoring or infrastructure nodes. Keep
      pods-per-node below the kubelet max-pods setting with a buffer for
      ephemeral pods arriving during the run.
    inputs:
      - Nodes matching the node selector
      - Target pods per node
      - Pods already resident on those nodes
      - Two pods created per iteration
  observed:
    pods_per_node: 105
    nodes_targeted: 42
    node_selector: node-role.kubernetes.io/worker
    max_pods_per_worker: 110
    existing_pods_at_derivation: 290
    iterations: 2060
    pods_created: 4120
    webserver_deployments_per_iteration: 1
    webserver_replicas: 1
    services_per_iteration: 1
    curl_deployments_per_iteration: 1
    curl_replicas: 1
    pods_per_iteration: 2
    iterations_per_namespace: 1000
    namespaces_created: 3
    qps: 20
    burst: 20
    pod_ready_threshold_s: 60
    peak_pending_pods: 8

stack:
  kubernetes: 1.34.2
  cni:
    name: OVN-Kubernetes
    version: "Helm chart 1.4.0, app 2026-02.0 (OVN core 25.09.1)"
    build: vendor
    dataplane: OVS 3.6.1
  engine:
    name: kube-burner
    version: 2.5.0
    build: upstream
  container_runtime: containerd 1.7.28
  node_os:
    distro: Ubuntu 22.04.4 LTS
    kernel: 5.15.0-113-generic
  etcd: 3.6.5

engine_config: engine/node-density-cni.yml

metrics:
  required:
    - size
    - scenario
    - duration_s
    - pod_ready_p50_ms
    - pod_ready_p95_ms
    - pod_ready_p99_ms
    - pod_scheduled_p99_ms
    - containers_ready_p99_ms
    - svc_ready_p99_ms
  workload_specific:
    - pods_per_node
    - nodes_targeted
    - existing_pods_at_derivation
    - iterations
    - pods_created
    - qps
    - burst
    - pod_ready_threshold_s
    - max_apiserver_cpu_cores
    - max_apiserver_memory_gib
    - max_etcd_cpu_cores
    - max_etcd_memory_mib
    - max_readonly_inflight
    - max_mutating_inflight
    - etcd_db_in_use_mib
    - etcd_wal_fsync_p99_ms
    - etcd_backend_commit_p99_ms
    - peak_pending_pods

slo:
  - metric: pod_ready_p99_ms
    op: lte
    value: 60000
    unit: ms
    severity: error
    source: >-
      The pod-ready p99 bar this scenario runs with, carried as
      `threshold: 1m0s` in the engine config and evaluated once, after the run,
      against the computed p99; it is not a per-pod timeout. Longer than
      node-density's 15 s because readiness waits on a pod-to-Service-to-pod
      probe. Ready-condition timestamps are second-granularity, so the gate
      resolves to about 1 s.
  - metric: etcd_wal_fsync_p99_ms
    op: lte
    value: 10
    unit: ms
    severity: warning
    source: >-
      Conventional etcd health bar, carried as a supporting signal rather than a
      verdict on the workload. On virtualized or shared storage it reports the
      storage layer rather than a control-plane problem.
  - metric: etcd_backend_commit_p99_ms
    op: lte
    value: 30
    unit: ms
    severity: warning
    source: >-
      Conventional etcd health bar, same caveat as WAL fsync: a supporting
      signal, not a judgement on the workload.

dashboard:
  - ../../../dashboards/1.34/worker-nodes.json
  - ../../../dashboards/1.34/control-plane.json
alerts: ../../../alerts/1.34/control-plane.yml

prerequisites:
  node_labels:
    - node-role.kubernetes.io/worker
  baseline_validation:
    - Confirm every targeted node is Ready and schedulable
    - Record the kubelet max-pods setting on each targeted node; it need not be
      uniform across a cluster
    - Record the pod count already resident on the targeted nodes — it feeds the
      derivation directly
    - Set the node selector explicitly and confirm the node count it matches
    - Compute the iteration count and set jobIterations to it
    - Confirm Prometheus is scraping the API servers
    - Confirm no pre-existing objects carry the kube-burner job label for this
      workload — garbage collection selects on that label alone, with no run
      identifier, so it will delete objects belonging to another run

upstream:
  project: https://github.com/kube-burner/kube-burner
  docs: https://kube-burner.github.io/kube-burner/
  engine: kube-burner
  engine_version: 2.5.0
  config: engine/node-density-cni.yml
  argv:
    - "cd engine && PROMETHEUS_URL=<prometheus-url> kube-burner init --uuid=<run-uuid> --config=node-density-cni.yml"
  notes: >-
    Everything needed to run this ships in engine/ -- the resolved job
    configuration, the three object templates and both metrics profiles -- so
    the kube-burner binary that upstream.project names is all a replication
    requires. The webserver image differs from the one the workload this was
    adapted from uses: the cloud-bulldozer image binds [::], which fails on
    pods whose network namespace has IPv6 disabled, so it is replaced with
    upstream nginx (alpine) binding 0.0.0.0:80.
    engine_config is the configuration as the engine rendered it at run time,
    captured from the run rather than reconstructed, so every value in it is
    the value that executed. Two fields are generalised: metricsDirectory,
    which carried the run UUID, and the alerts entry, which carried an absolute
    local path. The Prometheus endpoint comes from PROMETHEUS_URL. Run
    from engine/: kube-burner resolves paths from its working directory.
    jobIterations is this run's derived value: recompute it from
    sizing.derivation for a different cluster rather than reusing it, and change
    the nodeSelector inputVars alongside any change of node selector.
