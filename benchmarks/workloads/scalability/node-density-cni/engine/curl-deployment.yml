kind: Deployment
apiVersion: apps/v1
metadata:
  name: curl-{{.Replica}}-{{.Iteration}}
spec:
  template:
    metadata:
      labels:
        name: curl-{{.Replica}}-{{.Iteration}}
        app: curl
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: curl
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: {{.nodeSelector|toJson}}
      containers:
      - name: curlapp
        image: quay.io/cloud-bulldozer/curl:latest
        command: ["sleep", "inf"]
        resources:
          requests:
            memory: "10Mi"
            cpu: "10m"
        env:
        - name: WEBSERVER_HOSTNAME
          value: webserver-{{.Replica}}-{{.Iteration}}
        - name: WEBSERVER_PORT
          value: "80"
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
        # startupProbe gates the pod's Ready state on the webserver Service
        # being reachable via cluster DNS + the CNI's pod-to-service path.
        # That's what makes node-density-cni a CNI-perf test: each iteration's
        # curl pod won't reach Ready until OVN-K (or whatever CNI) has wired
        # up the path to the matching webserver pod.
        startupProbe:
          exec:
            command:
              - "/bin/sh"
              - "-c"
              - "curl --fail -sS ${WEBSERVER_HOSTNAME}:${WEBSERVER_PORT} -o /dev/null"
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 600
      restartPolicy: Always
  replicas: 1
  selector:
    matchLabels:
      name: curl-{{.Replica}}-{{.Iteration}}
  strategy:
    type: RollingUpdate
