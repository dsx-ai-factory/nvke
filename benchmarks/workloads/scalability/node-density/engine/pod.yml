kind: Pod
apiVersion: v1
metadata:
  labels:
    name: node-density-{{.Iteration}}
    app: pause
  name: {{.JobName}}-{{.Iteration}}
spec:
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: pause
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution: {{.nodeSelector|toJson}}
  containers:
  - image: {{.containerImage}}
    name: node-density
    resources:
      requests:
        memory: "10Mi"
        cpu: "10m"
    imagePullPolicy: IfNotPresent
