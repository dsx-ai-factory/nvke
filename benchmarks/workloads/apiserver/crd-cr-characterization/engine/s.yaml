# Scenario S: 500 CRDs × 100 CRs = 50,000 CRs  |  Simple schema
# This config creates CRDs only. The custom-resource pass is a separate
# invocation per CRD -- see cr-pass.yaml.tmpl.
global: {}

jobs:
  - name: create-crds-s
    jobType: create
    jobIterations: 500
    qps: 20
    burst: 20
    namespacedIterations: false
    waitWhenFinished: true
    verifyObjects: false
    maxWaitTimeout: 10m
    cleanup: false
    objects:
      - objectTemplate: crd-simple.yaml
        replicas: 1
        inputVars:
          ScenarioGroup: s
