# Scenario XS: 100 CRDs × 100 CRs = 10,000 CRs  |  Simple schema
# This config creates CRDs only. The custom-resource pass is a separate
# invocation per CRD -- see cr-pass.yaml.tmpl.
global: {}

jobs:
  - name: create-crds-xs
    jobType: create
    jobIterations: 100
    # qps/burst is 10 here against 20 for the other sizes. Carried from the
    # published run rather than normalised -- changing it would mean the
    # config no longer matches the numbers beside it.
    qps: 10
    burst: 10
    namespacedIterations: false
    waitWhenFinished: true
    verifyObjects: false
    maxWaitTimeout: 5m
    cleanup: false
    objects:
      - objectTemplate: crd-simple.yaml
        replicas: 1
        inputVars:
          ScenarioGroup: xs
