# CRD template — Complex (nested) schema
# Inspired by: servicemonitors.monitoring.coreos.com  (2642-7222 B avg)
#              prometheusrules.monitoring.coreos.com   (2877-6969 B avg)
#              opentelemetrycollectors.opentelemetry.io (7480-11485 B avg)
#              certificates.cert-manager.io            (3495-4464 B avg)
#
# Pattern: nested selectors, arrays of endpoints with TLS + relabeling,
#          alert rule groups with PromQL expressions, and an OTel-style
#          pipeline (receivers → processors → exporters).
#
# kube-burner variables used:
#   {{.Iteration}}     — CRD index (0-based), zero-padded to 5 digits
#   {{.ScenarioGroup}} — passed via inputVars (e.g. "m", "xl")
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: testresources{{printf "%05d" .Iteration}}s.{{.ScenarioGroup}}.burner.io
  labels:
    burner.io/scenario: "{{.ScenarioGroup}}"
    burner.io/iteration: "{{printf "%05d" .Iteration}}"
    burner.io/schema: complex
spec:
  group: {{.ScenarioGroup}}.burner.io
  names:
    kind: TestResource{{printf "%05d" .Iteration}}
    listKind: TestResource{{printf "%05d" .Iteration}}List
    plural: testresources{{printf "%05d" .Iteration}}s
    singular: testresource{{printf "%05d" .Iteration}}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                selector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: [In, NotIn, Exists, DoesNotExist]
                          values:
                            type: array
                            items:
                              type: string
                namespaceSelector:
                  type: object
                  properties:
                    any:
                      type: boolean
                    matchNames:
                      type: array
                      items:
                        type: string
                endpoints:
                  type: array
                  items:
                    type: object
                    properties:
                      port:
                        type: string
                      path:
                        type: string
                      interval:
                        type: string
                      scrapeTimeout:
                        type: string
                      scheme:
                        type: string
                        enum: [http, https]
                      honorLabels:
                        type: boolean
                      tlsConfig:
                        type: object
                        properties:
                          caFile:
                            type: string
                          certFile:
                            type: string
                          keyFile:
                            type: string
                          serverName:
                            type: string
                          insecureSkipVerify:
                            type: boolean
                      relabelings:
                        type: array
                        items:
                          type: object
                          properties:
                            sourceLabels:
                              type: array
                              items:
                                type: string
                            targetLabel:
                              type: string
                            regex:
                              type: string
                            replacement:
                              type: string
                            action:
                              type: string
                              enum: [replace, keep, drop, labelmap, labeldrop, labelkeep]
                      metricRelabelings:
                        type: array
                        items:
                          type: object
                          properties:
                            sourceLabels:
                              type: array
                              items:
                                type: string
                            targetLabel:
                              type: string
                            regex:
                              type: string
                            action:
                              type: string
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      alert:
                        type: string
                      expr:
                        type: string
                      for:
                        type: string
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                      annotations:
                        type: object
                        additionalProperties:
                          type: string
                pipeline:
                  type: object
                  properties:
                    receivers:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          otlp:
                            type: object
                            properties:
                              protocols:
                                type: object
                                properties:
                                  grpc:
                                    type: object
                                    properties:
                                      endpoint:
                                        type: string
                                  http:
                                    type: object
                                    properties:
                                      endpoint:
                                        type: string
                    processors:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          batch:
                            type: object
                            properties:
                              timeout:
                                type: string
                              sendBatchSize:
                                type: integer
                          memoryLimiter:
                            type: object
                            properties:
                              checkInterval:
                                type: string
                              limitMib:
                                type: integer
                    exporters:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          endpoint:
                            type: string
                          headers:
                            type: object
                            additionalProperties:
                              type: string
                          tls:
                            type: object
                            properties:
                              insecure:
                                type: boolean
                              caFile:
                                type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
