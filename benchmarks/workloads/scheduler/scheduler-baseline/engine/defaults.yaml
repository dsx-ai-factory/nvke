# kube-burner user-data for scheduler-baseline.yml, passed with --user-data.
#
# Values shared by every cell. The per-cell values -- NODE_COUNT, QPS and
# BURST -- and PROMETHEUS_URL come from the environment; user-data takes
# precedence over the environment, so they must not be set here. See
# README.md for the sweep.

# --- KWOK node shape -------------------------------------------------------
# NODE_MAX_PODS leaves headroom above PODS_PER_NODE for any broadly tolerated
# DaemonSet; the scheduler-slot extended resource is what enforces the density
# precisely.
NODE_CPU: "8"
NODE_MEMORY: 32Gi
NODE_MAX_PODS: "110"
NODE_CREATE_QPS: 50
NODE_CREATE_BURST: 100
# NODE_READY_TIMEOUT bounds the wait for every node to report Ready; past it
# the job fails. NODE_READY_WAIT is the settle pause after that. Raise the
# timeout if your largest tier takes longer to go Ready.
NODE_READY_TIMEOUT: 2m
NODE_READY_WAIT: 2m

# --- Workload --------------------------------------------------------------
# Total pods submitted is NODE_COUNT * PODS_PER_NODE.
PODS_PER_NODE: 10
CONTAINER_IMAGE: registry.k8s.io/pause:3.10

# --- Completion and settling ----------------------------------------------
# POD_SCHEDULED_THRESHOLD is kube-burner's own P99 gate. It is set high enough
# not to fail cells where the workload deliberately outruns the scheduler --
# those cells are the point of the matrix, not errors.
POD_SCHEDULED_THRESHOLD: 10m
MAX_WAIT_TIMEOUT: 50m
METRICS_SETTLE_WAIT: 1m

# --- Metrics ---------------------------------------------------------------
# Paths resolve from the working directory; run kube-burner from engine/.
# The alert profile is the shared one under benchmarks/alerts/.
METRICS: scheduler-metrics.yml
ALERTS: ../../../../alerts/1.34/scheduler.yml
METRICS_DIRECTORY: collected-metrics
PROM_TOKEN: ""
PROM_SKIP_TLS_VERIFY: false

# Garbage collection is off because the config tears its own objects down at a
# controlled rate. See scheduler-baseline.yml.
GC: false
