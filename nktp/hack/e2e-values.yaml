# Kind sizing and settings for nktp/hack/e2e-validate.sh and the hand-run
# docs/nktp/kind-validation.md, applied over the chart's defaults.
#
# The defaults size NKTP for a multi-node cluster; one Kind node on the e2e
# runner cannot schedule them. Lower replica counts, autoscaler floors and
# requests keep it schedulable while collection behavior and limits stay the
# chart's own.
#
# Two workloads keep their replica counts, because there the count is behavior:
# cluster_events runs an elected reader and a standby, and large_target_metrics
# is a pool the Target Allocator distributes targets across.

# Kind has no other provider of metrics.k8s.io, and the lane asserts the
# autoscalers read it. --kubelet-insecure-tls is Kind-only: Kind's kubelet
# serving certificates are self-signed, so metrics-server cannot verify them.
metrics-server:
  enabled: true
  args: ["--kubelet-insecure-tls"]

watchdog:
  kubernetes:
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

gateway_logs:
  kubernetes:
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

gateway_metrics:
  kubernetes:
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

gateway_traces:
  kubernetes:
    replicas: 1
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 50m

daemonset:
  kubernetes:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
    # Kind keeps its journal in /run. The chart's lists are restated in full,
    # because Helm replaces lists, with that one directory added.
    volumes:
      - {name: pod-logs, hostPath: {path: /var/log/pods, type: Directory}}
      - {name: host-proc, hostPath: {path: /proc, type: Directory}}
      - {name: journalctl, hostPath: {path: /usr/bin/journalctl, type: File}}
      - {name: host-lib, hostPath: {path: /lib, type: Directory}}
      - {name: host-lib64, hostPath: {path: /lib64, type: DirectoryOrCreate}}
      - {name: host-usr-lib, hostPath: {path: /usr/lib, type: Directory}}
      - {name: host-machine-id, hostPath: {path: /etc/machine-id, type: File}}
      - {name: journal-persistent, hostPath: {path: /run/log/journal, type: Directory}}
      - {name: host-logs, hostPath: {path: /var/log, type: Directory}}
    volumeMounts:
      - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      - {name: host-proc, mountPath: /hostfs/proc, readOnly: true}
      - {name: journalctl, mountPath: /hostfs/usr/bin/journalctl, readOnly: true}
      - {name: host-lib, mountPath: /hostfs/lib, readOnly: true}
      - {name: host-lib64, mountPath: /hostfs/lib64, readOnly: true}
      - {name: host-lib64, mountPath: /hostfs/usr/lib64, readOnly: true}
      - {name: host-usr-lib, mountPath: /hostfs/usr/lib, readOnly: true}
      - {name: host-machine-id, mountPath: /hostfs/etc/machine-id, readOnly: true}
      - {name: journal-persistent, mountPath: /hostfs/run/log/journal, readOnly: true}
      - {name: host-logs, mountPath: /hostfs/var/log, readOnly: true}
  otelcol:
    config:
      receivers:
        journald:
          directory: /run/log/journal

cluster_events:
  kubernetes:
    resources:
      requests:
        cpu: 50m

large_target_metrics:
  kubernetes:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi

# Six kube-state-metrics Deployments and the node DaemonSet share this default.
# Each watches a handful of resource types on a cluster that holds almost
# nothing.
kube-state-metrics:
  kubernetes:
    resources:
      requests:
        cpu: 25m
