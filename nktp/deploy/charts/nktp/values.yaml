              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          logs:
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
