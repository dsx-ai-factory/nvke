            exporters: [otlp/watchdog]
          metrics:
            receivers: [prometheus, prometheus/kubelet, otlp]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp/metrics]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource/node, redaction/basic_v1]
            exporters: [otlp/traces]
