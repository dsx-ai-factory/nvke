# Cluster event reader. One elected replica watches Kubernetes Events.
cluster_events:
  kubernetes:
    mode: statefulset # Stable replica identities support per-replica volumes for optional persistent queues.
    replicas: 2 # One active reader and one standby. More replicas do not increase watch throughput.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    env:
      - name: GOMEMLIMIT
        value: 192MiB # Runtime target below the memory limiter soft threshold.
      - name: GOGC
        value: "50" # More frequent GC trades CPU for lower heap growth.
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    podDisruptionBudget:
      maxUnavailable: 25%
    terminationGracePeriodSeconds: 60
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-cluster-events-collector
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-cluster-events-collector
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumes:
      - name: internal-tls-client
        secret:
          secretName: nktp-cluster-events-client-tls
          items:
            - {key: tls.crt, path: tls.crt}
            - {key: tls.key, path: tls.key}
            - {key: ca.crt, path: ca.crt}
    volumeMounts:
      - name: internal-tls-client
        mountPath: /etc/nktp/internal-tls/client
        readOnly: true
  otelcol:
    # Set a custom image for this workload only.
    # image:
    #   registry: ""
    #   repository: otel/opentelemetry-collector-k8s
    #   tag: 0.162.0
    config:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
        k8s_leader_elector:
          auth_type: serviceAccount
          lease_name: nktp-cluster-events
          lease_namespace: ${env:POD_NAMESPACE}
      receivers:
        k8s_events:
          auth_type: serviceAccount
          k8s_leader_elector: k8s_leader_elector
          namespaces: [] # Empty watches all namespaces. Restrict this list for a smaller scope.
      processors:
        transform/event_service:
          log_statements:
            - context: log
              statements:
                - set(resource.attributes["nvidia.telemetry.class"], "k8s.event")
                - set(resource.attributes["service.name"], attributes["k8s.event.reporting_controller"]) where (resource.attributes["service.name"] == nil or resource.attributes["service.name"] == "") and attributes["k8s.event.reporting_controller"] != nil and attributes["k8s.event.reporting_controller"] != ""
                - set(resource.attributes["service.name"], "kube-apiserver") where resource.attributes["service.name"] == nil or resource.attributes["service.name"] == ""
        redaction/basic_v1:
          allow_all_keys: true
          redact_all_types: true
          summary: silent
          blocked_key_patterns:
            - '(?i)(?:(?:^|[._-])(?:password|passwd|secret|token|(?:access|refresh|id|session|auth)[._-]?token|(?:access|secret|private|api)[._-]?key|secret[._-]?access[._-]?key|client[._-]?secret|authorization|(?:set[._-]?)?cookie)|(?-i:[a-z0-9])(?:(?-i:P)(?:assword|asswd|rivate[._-]?key)|(?-i:S)ecret|(?-i:T)oken|(?-i:A)(?:pi[._-]?key|ccess[._-]?key|uthorization)|(?-i:C)ookie))$$'
          blocked_values:
            - '(?i)\bBearer\s+[A-Za-z0-9._~+/-]+=*'
            - '(?i)"?\b(?:[A-Za-z0-9]+[._-])*(?:password|passwd|secret|token|(?:access|refresh|id|session|auth)[._-]?token|(?:access|secret|private|api)[._-]?key|secret[._-]?access[._-]?key|client[._-]?secret|authorization|(?:set[._-]?)?cookie|[A-Za-z0-9]*(?-i:[a-z0-9])(?:(?-i:P)(?:assword|asswd|rivate[._-]?key)|(?-i:S)ecret|(?-i:T)oken|(?-i:A)(?:pi[._-]?key|ccess[._-]?key|uthorization)|(?-i:C)ookie))"?\s*[:=]\s*(?:"(?:\\.|[^"\\])*"|''(?:\\.|[^''\\])*''|(?:(?:Bearer|Basic)\s+)?[^\s,;"]+)'
        memory_limiter:
          check_interval: 500ms # Poll Go heap Alloc. Bursts can allocate between checks.
          limit_percentage: 80 # Hard heap threshold, 409.6Mi. Leaves room below the container cap.
          spike_limit_percentage: 25 # Subtract from hard threshold for soft refusal at 55% (281.6Mi).
      exporters:
        otlp:
          endpoint: nktp-gateway-logs-collector:4317
          tls:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes # Counts serialized bytes. Go heap use can be several times larger.
            queue_size: 16777216 # One 16MiB logs queue, including in-flight payloads.
            num_consumers: 32 # Export concurrency. Idle worker slots hold no batch payload.
            batch:
              sizer: bytes # Batch sizes use serialized bytes, matching queue accounting.
              min_size: 1048576 # Batch at 1MiB to amortize export overhead.
              max_size: 2097152 # Split above 2MiB serialized. Decoded heap can be larger.
              flush_timeout: 1s # Flush partial batches to limit low-volume buffering time.
      service:
        extensions: [health_check, k8s_leader_elector]
        telemetry:
          resource:
            service.name: nktp-cluster-events
            service.instance.id: ${env:POD_NAME}
          metrics:
            readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          logs:
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          traces:
            level: basic
            processors:
              - batch:
                  schedule_delay: 1000 # Milliseconds. Keeps spans of one trace close together for tail sampling.
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
        pipelines:
          logs:
            receivers: [k8s_events]
            processors: [memory_limiter, transform/event_service, redaction/basic_v1]
            exporters: [otlp]
  # Native sidecar for this workload's own telemetry. It buffers through outages,
  # keeps only error and slow traces, and exports over gRPC to nktp-watchdog-collector:4317.
  sidecar:
    kubernetes:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GOMEMLIMIT
          value: 96MiB # Soft Go runtime target at 75% of the container limit.
      startupProbe: # The main Collector starts after this succeeds.
        httpGet:
          path: /
          port: 13134
        periodSeconds: 1
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /
          port: 13134
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: internal-tls-client
          mountPath: /etc/nktp/internal-tls/client
          readOnly: true
    otelcol:
      # Set a custom image for this sidecar only.
      # image:
      #   registry: ""
      #   repository: otel/opentelemetry-collector-k8s
      #   tag: 0.162.0
      config:
        extensions:
          health_check:
            endpoint: 0.0.0.0:13134 # Kubelet probes use the Pod IP.
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 127.0.0.1:4319 # Reachable only from containers in this Pod.
                keepalive:
                  idle_timeout: 5m # Longer than the 60s metric interval, so a reused connection is not closed mid-request.
        processors:
          memory_limiter:
            check_interval: 500ms
            limit_percentage: 80 # Hard heap threshold, 102.4Mi.
            spike_limit_percentage: 25 # Soft refusal at 55% (70.4Mi).
          tail_sampling:
            decision_wait: 5s # Covers the 1s SDK flush interval with margin.
            num_traces: 1000 # Bounds traces held in memory. The oldest are dropped first.
            decision_cache:
              sampled_cache_size: 10000 # Late spans of a kept trace are also kept.
            policies:
              - name: errors
                type: status_code
                status_code:
                  status_codes: [ERROR]
              - name: slow # Any single span longer than 1s. Trace duration includes up to 1s of export batching.
                type: ottl_condition
                ottl_condition:
                  error_mode: ignore
                  span:
                    - end_time_unix_nano - start_time_unix_nano > 1000000000
        exporters:
          otlp:
            endpoint: nktp-watchdog-collector:4317
            tls:
              cert_file: /etc/nktp/internal-tls/client/tls.crt
              key_file: /etc/nktp/internal-tls/client/tls.key
              ca_file: /etc/nktp/internal-tls/client/ca.crt
              reload_interval: 1h
            retry_on_failure:
              max_elapsed_time: 30m
            sending_queue:
              block_on_overflow: false # The SDK cannot wait or retry, so blocking would only move the loss out of view.
              sizer: bytes
              queue_size: 4194304 # 4MiB for each of the 3 signal queues, 12MiB in total. When full, the sidecar refuses new data.
              num_consumers: 2
              batch:
                sizer: bytes
                min_size: 65536
                max_size: 262144
                flush_timeout: 1s
        service:
          extensions: [health_check]
          telemetry:
            resource:
              service.name: nktp-cluster-events-sidecar
              service.instance.id: ${env:POD_NAME}
            # Own metrics and logs go through this sidecar's own buffer.
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            traces:
              level: none # Export failures already show in this sidecar's metrics and logs.
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp]
            logs:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp]
            traces:
              receivers: [otlp]
              processors: [memory_limiter, tail_sampling]
              exporters: [otlp]

# Default in-cluster backend. MUST be disabled for production use.
otel-lgtm:
  enabled: true
  # Additional environment variables for the bundled backend container.
  env: []
  image:
    registry: "" # Empty pulls from the image's default registry (Docker Hub for this repository).
    repository: grafana/otel-lgtm
    tag: 0.38.0
  # Container resource requests/limits and Pod placement.
  resources: {}
  nodeSelector: {}
  tolerations: []
  # Append Kubernetes volumes and mounts, for example for backend ConfigMaps.
  extraVolumes: []
  extraVolumeMounts: []

# Kubernetes object state metrics, partitioned by resource type.
kube-state-metrics:
  enabled: true
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.20.0
  namespaces: [] # All namespaces. Each workload can override this list.
  # Kubernetes labels exposed by KSM, using entries such as pods=[app.kubernetes.io/name].
  metricLabelsAllowlist: []
  # Shared Kubernetes defaults. Each workload can override these fields.
  kubernetes:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsUser: 65534 # The upstream image's nobody user, expressed numerically for runAsNonRoot.
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    nodeSelector:
      kubernetes.io/os: linux
  # Node-local collection. NODE_NAME is supplied through the downward API.
  daemonset:
    enabled: true
    kubernetes:
      # Include tainted nodes so their scheduled Pods are also collected.
      tolerations:
        - operator: Exists
  # Named Deployments. resource_types and namespaces also determine RBAC.
  # Helm supplies shard identities from shards.
  deployments:
    unscheduled-pods:
      enabled: true
      resource_types: [pods]
      track_unscheduled_pods: true # Requires resource_types to be exactly [pods].
      shards: 1
      kubernetes: {}
    workloads:
      enabled: true
      resource_types: [deployments, statefulsets, daemonsets, replicasets, replicationcontrollers, jobs, cronjobs, horizontalpodautoscalers, poddisruptionbudgets]
      track_unscheduled_pods: false
      shards: 1
      kubernetes: {}
    networking:
      enabled: true
      resource_types: [services, endpointslices, ingresses, networkpolicies]
      track_unscheduled_pods: false
      shards: 1
      kubernetes: {}
    storage:
      enabled: true
      resource_types: [persistentvolumes, persistentvolumeclaims, volumeattachments]
      track_unscheduled_pods: false
      shards: 1
      kubernetes: {}
    configuration:
      enabled: true
      # Add secrets to opt in to Secret metrics and list/watch access to Secret contents.
      resource_types: [configmaps]
      track_unscheduled_pods: false
      shards: 1
      kubernetes: {}
    cluster:
      enabled: true
      resource_types: [nodes, namespaces, storageclasses, resourcequotas, limitranges, leases, certificatesigningrequests, mutatingwebhookconfigurations, validatingadmissionpolicies, validatingadmissionpolicybindings, validatingwebhookconfigurations]
      track_unscheduled_pods: false
      shards: 1
      kubernetes: {}

# Configuration below this point is inherited from bundled charts. Each
# chart has an install or enabled flag, and further configuration passes
# through under its key using the chart's own conventions.

# Provides the Operator and native OpenTelemetry and Prometheus CRDs.
opentelemetry-kube-stack:
  crds:
    installOtel: true
    installPrometheus: true
  # Declare Kubernetes control-plane and DNS metrics endpoints. These monitors
  # require a Target Allocator with denyFSAccessThroughSMs disabled; see
  # docs/nktp/components/large-target-metrics.md.
  kubernetesServiceMonitors:
    enabled: true
  kubeApiServer:
    enabled: true
    serviceMonitor:
      additionalLabels:
        nktp.nvidia.io/large-target: "true"
  kubeControllerManager:
    enabled: true
    serviceMonitor:
      additionalLabels:
        nktp.nvidia.io/large-target: "true"
  kubeScheduler:
    enabled: true
    serviceMonitor:
      additionalLabels:
        nktp.nvidia.io/large-target: "true"
  kubeEtcd:
    enabled: true
    serviceMonitor:
      additionalLabels:
        nktp.nvidia.io/large-target: "true"
  coreDns:
    enabled: true
    serviceMonitor:
      additionalLabels:
        nktp.nvidia.io/large-target: "true"
  kubeProxy:
    enabled: true
    serviceMonitor:
      additionalLabels:
        nktp.nvidia.io/large-target: "true"
  kubeDns:
    enabled: false # CoreDNS is the supported cluster DNS metrics source.
  collectors:
    daemon:
      enabled: false
  clusterRole:
    enabled: false
  # Uninstall hook. opentelemetry-kube-stack's default kubectl tag lags upstream security fixes.
  cleanupJob:
    image:
      tag: v1.35.6
  opentelemetry-operator:
    fullnameOverride: nktp-operator
    manager:
      serviceMonitor:
        enabled: false # Watchdog owns the explicit Operator scrape job.
    admissionWebhooks:
      certManager:
        # Use the cluster's cert-manager installation for webhook certificates.
        enabled: true

# Host-level metrics from each node. Runs as a DaemonSet with host networking,
# so it binds port 9100 on every node.
node-exporter:
  enabled: true
  # node_exporter's cpufreq collector hangs on arm64 nodes that use the
  # cppc_cpufreq driver. A read of cpuinfo_avg_freq never returns, so scrapes of
  # the exporter hang and time out (prometheus/node_exporter#3791). The fix,
  # prometheus/procfs#879, is in no node_exporter release yet. Remove this once
  # the chart's node_exporter has it. Without the collector there are no
  # node_cpu_frequency_* or node_cpu_scaling_* series, and nothing in nktp reads
  # them.
  extraArgs:
    - --no-collector.cpufreq
  prometheus:
    monitor:
      # Declares the exporter as a scrape target, ready for a collector to pick up.
      enabled: true

# Resource metrics API, used for autoscaling. Disabled by default because it is installed
# via other mechanisms in many clusters.
metrics-server:
  enabled: false
