          check_interval: 500ms # Poll Go heap Alloc. Bursts can allocate between checks.
          limit_percentage: 80 # Hard heap threshold, 3.2Gi. Leaves room below the container cap.
          spike_limit_percentage: 25 # Subtract from hard threshold for soft refusal at 55% (2.2Gi).
        transform/cluster:
          # Sets k8s.cluster.name from global.clusterName, or "unknown", unless the sender set one.
          # The variable is inside an OTTL string so that names such as 42 or true stay strings.
          error_mode: ignore
          trace_statements:
            - context: resource
              statements:
                - 'set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME:-unknown}") where attributes["k8s.cluster.name"] == nil'
      exporters:
        otlp:
          endpoint: lgtm:4317
          tls:
            insecure: true
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes # Counts serialized bytes. Go heap use can be several times larger.
            # Rough sizing: 12% of 4Gi. Assuming ~4x heap use gives ~48%,
            # leaving a rough allowance for baseline and processing below
            # the memory_limiter's 55% soft limit.
            queue_size: 515396076
            num_consumers: 32 # Export concurrency. Idle worker slots hold no batch payload.
            batch:
              sizer: bytes # Batch sizes use serialized bytes, matching queue accounting.
              min_size: 1048576 # Batch at 1MiB to amortize export overhead.
              max_size: 2097152 # Split above 2MiB serialized. Decoded heap can be larger.
              flush_timeout: 1s # Flush partial batches to limit low-volume buffering time.
      service:
        extensions: [health_check]
        telemetry:
          resource:
            service.name: nktp-gateway-traces
            service.instance.id: ${env:POD_NAME}
          metrics:
            readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          logs:
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          traces:
            level: basic
            processors:
              - batch:
                  schedule_delay: 1000 # Milliseconds. Keeps spans of one trace close together for tail sampling.
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, redaction/basic_v1, transform/cluster]
            exporters: [otlp]
  # Native sidecar for this workload's own telemetry. It buffers through outages,
  # keeps only error and slow traces, and exports over gRPC to nktp-watchdog-collector:4317.
  sidecar:
    kubernetes:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GOMEMLIMIT
          value: 192MiB # Soft Go runtime target at 75% of the container limit.
      startupProbe: # The main Collector starts after this succeeds.
        httpGet:
          path: /
          port: 13134
        periodSeconds: 1
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /
          port: 13134
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: internal-tls-client
          mountPath: /etc/nktp/internal-tls/client
          readOnly: true
    otelcol:
      # Set a custom image for this sidecar only.
      # image:
      #   registry: ""
      #   repository: otel/opentelemetry-collector-k8s
      #   tag: 0.162.0
      config:
        extensions:
          health_check:
            endpoint: 0.0.0.0:13134 # Kubelet probes use the Pod IP.
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 127.0.0.1:4319 # Reachable only from containers in this Pod.
                keepalive:
                  idle_timeout: 5m # Longer than the 60s metric interval, so a reused connection is not closed mid-request.
        processors:
          memory_limiter:
            check_interval: 500ms
            limit_percentage: 80 # Hard heap threshold, 204.8Mi.
            spike_limit_percentage: 25 # Soft refusal at 55% (140.8Mi).
          tail_sampling:
            decision_wait: 5s # Covers the 1s SDK flush interval with margin.
            num_traces: 5000 # Bounds traces held in memory. The oldest are dropped first.
            decision_cache:
              sampled_cache_size: 50000 # Late spans of a kept trace are also kept.
            policies:
              - name: errors
                type: status_code
                status_code:
                  status_codes: [ERROR]
              - name: slow # Any single span longer than 1s. Trace duration includes up to 1s of export batching.
                type: ottl_condition
                ottl_condition:
                  error_mode: ignore
                  span:
                    - end_time_unix_nano - start_time_unix_nano > 1000000000
        exporters:
          otlp:
            endpoint: nktp-watchdog-collector:4317
            tls:
              cert_file: /etc/nktp/internal-tls/client/tls.crt
              key_file: /etc/nktp/internal-tls/client/tls.key
              ca_file: /etc/nktp/internal-tls/client/ca.crt
              reload_interval: 1h
            retry_on_failure:
              max_elapsed_time: 30m
            sending_queue:
              block_on_overflow: false # The SDK cannot wait or retry, so blocking would only move the loss out of view.
              sizer: bytes
              queue_size: 16777216 # 16MiB for each of the 3 signal queues, 48MiB in total. When full, the sidecar refuses new data.
              num_consumers: 2
              batch:
                sizer: bytes
                min_size: 65536
                max_size: 262144
                flush_timeout: 1s
        service:
          extensions: [health_check]
          telemetry:
            resource:
              service.name: nktp-gateway-traces-sidecar
              service.instance.id: ${env:POD_NAME}
            # Own metrics and logs go through this sidecar's own buffer.
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            traces:
              level: none # Export failures already show in this sidecar's metrics and logs.
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp]
            logs:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp]
            traces:
              receivers: [otlp]
              processors: [memory_limiter, tail_sampling]
              exporters: [otlp]

# Node-level collector. Collects local telemetry and forwards received OTLP signals.
daemonset:
  rbac:
    # Create Roles and RoleBindings granting the target allocator read access to
    # Secrets and ConfigMaps in namespaces listed in
    # kubernetes.targetAllocator.prometheusCR.secretNamespaces.
    # No Roles or RoleBindings are created when the list is omitted or empty.
    create: true
  kubernetes:
    mode: daemonset
    # Match KSM node coverage so targets on tainted nodes have a local Collector.
    tolerations:
      - operator: Exists
    targetAllocator:
      enabled: true
      mtls:
        enabled: true # Let cert-manager secure Collector requests to the allocator.
      replicas: 1
      allocationStrategy: per-node # Targets without a matching collector node stay unassigned.
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      env:
        - name: OTEL_SERVICE_NAME
          value: nktp-targetallocator
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.instance.id=$(POD_NAME)
      telemetry:
        metrics:
          readers:
            - periodic:
                interval: 30s
                exporter:
                  otlpGrpc:
                    endpoint: nktp-watchdog-collector:4320
                    tls:
                      insecure: true
                    temporalityPreference: cumulative
      observability:
        metrics:
          enableMetrics: false # Metrics are pushed over OTLP without a ServiceMonitor.
      prometheusCR:
        enabled: true
        denyFSAccessThroughSMs: false # Preserve compatibility with monitors that reference files in the Collector container.
        # Explicit namespaces for chart-managed RBAC and Secret watching.
        # secretNamespaces: [metrics-monitors]
        # Exclude monitoring CRs labeled nktp.nvidia.io/large-target: "true" and common kubelet ServiceMonitors
        serviceMonitorSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: NotIn
              values: ["true"]
            - key: app
              operator: NotIn
              values: [kube-prometheus-stack-kubelet, prometheus-operator-kubelet]
        podMonitorSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: NotIn
              values: ["true"]
        probeSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: NotIn
              values: ["true"]
        scrapeConfigSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: NotIn
              values: ["true"]
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    env:
      - name: GOMEMLIMIT
        value: 768MiB # Runtime target below the memory limiter soft threshold.
      - name: GOGC
        value: "50" # More frequent GC trades CPU for lower heap growth.
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    terminationGracePeriodSeconds: 60
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsUser: 0 # Host pod-log directories and files can be readable only by root.
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
        add: [SYS_CHROOT] # Run the host journalctl with its own libraries.
    volumes:
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      # journalctl and its libraries are supplied by the node. /lib64 can be absent on ARM.
      - name: journalctl
        hostPath:
          path: /usr/bin/journalctl
          type: File
      - name: host-lib
        hostPath:
          path: /lib
          type: Directory
      - name: host-lib64
        hostPath:
          path: /lib64
          type: DirectoryOrCreate
      - name: host-usr-lib
        hostPath:
          path: /usr/lib
          type: Directory
      - name: host-machine-id
        hostPath:
          path: /etc/machine-id
          type: File
      # Mount the parent directory because audit files may be absent on workers.
      - name: host-logs
        hostPath:
          path: /var/log
          type: Directory
      - name: internal-tls-client
        secret:
          secretName: nktp-daemonset-client-tls
          items:
            - {key: tls.crt, path: tls.crt}
            - {key: tls.key, path: tls.key}
            - {key: ca.crt, path: ca.crt}
    volumeMounts:
      - name: pod-logs
        mountPath: /var/log/pods
        readOnly: true
      - name: host-proc
        mountPath: /hostfs/proc
        readOnly: true
      - name: journalctl
        mountPath: /hostfs/usr/bin/journalctl
        readOnly: true
      - name: host-lib
        mountPath: /hostfs/lib
        readOnly: true
      - name: host-lib64
        mountPath: /hostfs/lib64
        readOnly: true
      - name: host-lib64
        mountPath: /hostfs/usr/lib64
        readOnly: true
      - name: host-usr-lib
        mountPath: /hostfs/usr/lib
        readOnly: true
      - name: host-machine-id
        mountPath: /hostfs/etc/machine-id
        readOnly: true
      - name: host-logs
        mountPath: /hostfs/var/log
        readOnly: true
      - name: internal-tls-client
        mountPath: /etc/nktp/internal-tls/client
        readOnly: true
  otelcol:
    # Set a custom image for this workload only.
    # image:
    #   registry: ""
    #   repository: otel/opentelemetry-collector-k8s
    #   tag: 0.162.0
    config:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        journald:
          root_path: /hostfs
          journalctl_path: /usr/bin/journalctl
          directory: /var/log/journal # Relative to root_path. Override for nodes using runtime journals.
          start_at: end
          priority: info
          retry_on_failure:
            enabled: true
            max_elapsed_time: 0
          operators:
            - id: identify-journal-producer
              type: add
              field: resource["service.name"]
              value: journald
            - id: classify-host-auth
              type: add
              if: 'body.SYSLOG_IDENTIFIER == "sshd" || body.SYSLOG_IDENTIFIER == "sudo"'
              field: resource["nvidia.telemetry.class"]
              value: system.auth
        filelog:
          include: [/var/log/pods/*/*/*.log]
          exclude:
            - "/var/log/pods/${env:POD_NAMESPACE}_nktp-*-collector-*_*/*/*.log" # Avoid duplicate logs already exported over OTLP.
            - "/var/log/pods/${env:POD_NAMESPACE}_nktp-*-targetallocator-*_*/ta-container/*.log" # Collected separately by filelog/targetallocator.
            - "/var/log/pods/${env:POD_NAMESPACE}_nktp-operator-*_*/manager/*.log" # Collected separately by filelog/operator.
          start_at: end
          include_file_path: true
          retry_on_failure:
            enabled: true
            max_elapsed_time: 0 # Retry downstream transient failures until recovery. Permanent errors are dropped.
          operators:
            - type: container
            # Classify the existing reader's entries instead of reading the same
            # control plane files a second time.
            - id: classify-control-plane
              type: add
              if: >-
                resource["k8s.namespace.name"] == "kube-system" &&
                ((resource["k8s.container.name"] == "kube-apiserver" && resource["k8s.pod.name"] matches "^kube-apiserver-") ||
                (resource["k8s.container.name"] == "kube-controller-manager" && resource["k8s.pod.name"] matches "^kube-controller-manager-") ||
                (resource["k8s.container.name"] == "kube-scheduler" && resource["k8s.pod.name"] matches "^kube-scheduler-") ||
                (resource["k8s.container.name"] == "etcd" && resource["k8s.pod.name"] matches "^etcd-"))
              field: resource["nvidia.telemetry.class"]
              value: k8s.control_plane
        filelog/host-auth:
          include: [/hostfs/var/log/auth.log, /hostfs/var/log/secure]
          start_at: end
          include_file_path: true
          retry_on_failure: {enabled: true, max_elapsed_time: 0}
          resource:
            nvidia.telemetry.class: system.auth
            service.name: auth
        filelog/host-audit:
          include: [/hostfs/var/log/audit/audit.log]
          start_at: end
          include_file_path: true
          retry_on_failure: {enabled: true, max_elapsed_time: 0}
          resource:
            nvidia.telemetry.class: system.audit
            service.name: auditd
        filelog/kube-api-audit:
          # Must match the API server's audit-log-path on the node.
          include: [/hostfs/var/log/kubernetes/audit/audit.log]
          start_at: end
          include_file_path: true
          retry_on_failure: {enabled: true, max_elapsed_time: 0}
          resource:
            nvidia.telemetry.class: k8s.api.audit
            service.name: kube-apiserver
        filelog/targetallocator:
          include: ["/var/log/pods/${env:POD_NAMESPACE}_nktp-*-targetallocator-*_*/ta-container/*.log"]
          start_at: beginning # Include allocator startup diagnostics.
          include_file_path: true
          retry_on_failure:
            enabled: true
            max_elapsed_time: 0
          operators:
            - type: container
        filelog/operator:
          include: ["/var/log/pods/${env:POD_NAMESPACE}_nktp-operator-*_*/manager/*.log"]
          start_at: beginning # Include operator startup diagnostics.
          include_file_path: true
          retry_on_failure:
            enabled: true
            max_elapsed_time: 0
          operators:
            - type: container
        prometheus:
          config:
            # The Target Allocator supplies scrape jobs and targets from the local node.
            scrape_configs: []
        prometheus/kubelet:
          config:
            scrape_configs:
              - job_name: kubelet
                scrape_interval: 30s
                scrape_timeout: 10s
                scheme: https
                metrics_path: /metrics
                authorization:
                  type: Bearer
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                tls_config:
                  insecure_skip_verify: true
                static_configs:
                  - targets: ["127.0.0.1:10250"] # Replaced with the node IP before scraping.
                    labels:
                      __tmp_kubelet_host: ${env:OTEL_K8S_NODE_IP}
                relabel_configs:
                  - source_labels: [__tmp_kubelet_host]
                    regex: (.+:.*)
                    target_label: __address__
                    replacement: "[$$1]:10250"
                  - source_labels: [__tmp_kubelet_host]
                    regex: ([^:]+)
                    target_label: __address__
                    replacement: "$$1:10250"
                  - target_label: node
                    replacement: ${env:NODE_NAME}
                  - target_label: endpoint
                    replacement: https-metrics
                  - target_label: metrics_path
                    replacement: /metrics
              - job_name: kubelet-cadvisor
                scrape_interval: 30s
                scrape_timeout: 10s
                scheme: https
                metrics_path: /metrics/cadvisor
                authorization:
                  type: Bearer
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                tls_config:
                  insecure_skip_verify: true
                static_configs:
                  - targets: ["127.0.0.1:10250"] # Replaced with the node IP before scraping.
                    labels:
                      __tmp_kubelet_host: ${env:OTEL_K8S_NODE_IP}
                relabel_configs:
                  - source_labels: [__tmp_kubelet_host]
                    regex: (.+:.*)
                    target_label: __address__
                    replacement: "[$$1]:10250"
                  - source_labels: [__tmp_kubelet_host]
                    regex: ([^:]+)
                    target_label: __address__
                    replacement: "$$1:10250"
                  - target_label: node
                    replacement: ${env:NODE_NAME}
                  - target_label: endpoint
                    replacement: https-metrics
                  - target_label: metrics_path
                    replacement: /metrics/cadvisor
                # Copied from kube-prometheus-stack:
                # https://github.com/prometheus-community/helm-charts/blob/4713c624771a48e99f16dec9eb55ec8204f06830/charts/kube-prometheus-stack/values.yaml#L1952
                metric_relabel_configs:
                  # Drop less useful container CPU metrics.
                  - source_labels: [__name__]
                    action: drop
                    regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
                  # Drop less useful / always zero filesystem metrics.
                  - source_labels: [__name__]
                    action: drop
                    regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                  # Drop less useful / always zero container memory metrics.
                  - source_labels: [__name__]
                    action: drop
                    regex: container_memory_(mapped_file|swap)
                  # Drop less useful container process metrics.
                  - source_labels: [__name__]
                    action: drop
                    regex: container_(file_descriptors|tasks_state|threads_max)
                  # Keep only the container scope of container_memory_failures_total.
                  - source_labels: [__name__, scope]
                    action: drop
                    regex: container_memory_failures_total;hierarchy
                  # Drop network metrics for CNI and similar interfaces, which belong to host network containers.
                  - source_labels: [__name__, interface]
                    action: drop
                    regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
                  # Drop container spec metrics that overlap with kube-state-metrics.
                  - source_labels: [__name__]
                    action: drop
                    regex: container_spec.*
                  # Drop cgroup metrics with no pod.
                  - source_labels: [id, pod]
                    action: drop
                    regex: .+;
      processors:
        redaction/basic_v1:
          allow_all_keys: true
          redact_all_types: true
          summary: silent
          blocked_key_patterns:
            - '(?i)(?:(?:^|[._-])(?:password|passwd|secret|token|(?:access|refresh|id|session|auth)[._-]?token|(?:access|secret|private|api)[._-]?key|secret[._-]?access[._-]?key|client[._-]?secret|authorization|(?:set[._-]?)?cookie)|(?-i:[a-z0-9])(?:(?-i:P)(?:assword|asswd|rivate[._-]?key)|(?-i:S)ecret|(?-i:T)oken|(?-i:A)(?:pi[._-]?key|ccess[._-]?key|uthorization)|(?-i:C)ookie))$$'
          blocked_values:
            - '(?i)\bBearer\s+[A-Za-z0-9._~+/-]+=*'
            - '(?i)"?\b(?:[A-Za-z0-9]+[._-])*(?:password|passwd|secret|token|(?:access|refresh|id|session|auth)[._-]?token|(?:access|secret|private|api)[._-]?key|secret[._-]?access[._-]?key|client[._-]?secret|authorization|(?:set[._-]?)?cookie|[A-Za-z0-9]*(?-i:[a-z0-9])(?:(?-i:P)(?:assword|asswd|rivate[._-]?key)|(?-i:S)ecret|(?-i:T)oken|(?-i:A)(?:pi[._-]?key|ccess[._-]?key|uthorization)|(?-i:C)ookie))"?\s*[:=]\s*(?:"(?:\\.|[^"\\])*"|''(?:\\.|[^''\\])*''|(?:(?:Bearer|Basic)\s+)?[^\s,;"]+)'
        memory_limiter:
          check_interval: 500ms # Poll Go heap Alloc. Bursts can allocate between checks.
          limit_percentage: 80 # Hard heap threshold, 1638.4Mi. Leaves room below the container cap.
          spike_limit_percentage: 25 # Subtract from hard threshold for soft refusal at 55% (1126.4Mi).
        resource/node:
          attributes:
            - key: k8s.node.name
              value: ${env:NODE_NAME}
              action: upsert
        transform/targetallocator:
          log_statements:
            - context: resource
              statements:
                - set(attributes["service.instance.id"], attributes["k8s.pod.name"])
                - set(attributes["service.name"], "nktp-targetallocator") where IsMatch(attributes["k8s.pod.name"], "^nktp-daemonset-targetallocator-")
                - set(attributes["service.name"], "nktp-watchdog-targetallocator") where IsMatch(attributes["k8s.pod.name"], "^nktp-watchdog-targetallocator-")
                - set(attributes["service.name"], "nktp-large-target-metrics-targetallocator") where IsMatch(attributes["k8s.pod.name"], "^nktp-large-target-metrics-targetallocator-")
        transform/operator:
          log_statements:
            - context: resource
              statements:
                - set(attributes["service.name"], "nktp-operator")
                - set(attributes["service.instance.id"], attributes["k8s.pod.name"])
      exporters:
        otlp/logs:
          endpoint: nktp-gateway-logs-collector:4317
          tls:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes # Counts serialized bytes. Go heap use can be several times larger.
            queue_size: 67108864 # Logs queue holds 64MiB, including in-flight payloads.
            num_consumers: 32 # Export concurrency. Idle worker slots hold no batch payload.
            batch:
              sizer: bytes # Batch sizes use serialized bytes, matching queue accounting.
              min_size: 1048576 # Batch at 1MiB to amortize export overhead.
              max_size: 2097152 # Split above 2MiB serialized. Decoded heap can be larger.
              flush_timeout: 1s # Flush partial batches to limit low-volume buffering time.
        otlp/metrics:
          endpoint: nktp-gateway-metrics-collector:4317
          tls:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes
            queue_size: 67108864 # 64MiB to absorb scrape bursts and temporary export stalls.
            num_consumers: 32
            batch:
              sizer: bytes
              min_size: 1048576
              max_size: 2097152
              flush_timeout: 1s
        otlp/traces:
          endpoint: nktp-gateway-traces-collector:4317
          tls:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
