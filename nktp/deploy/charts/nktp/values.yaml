# Scrapes monitoring CRs labeled nktp.nvidia.io/large-target: "true".
large_target_metrics:
  kubernetes:
    mode: statefulset # The Target Allocator uses stable Collector identities.
    replicas: 2
    targetAllocator:
      enabled: true
      mtls:
        enabled: true # Let cert-manager secure Collector requests to the allocator.
      replicas: 1
      allocationStrategy: consistent-hashing
      collectorTargetReloadInterval: 10s
      env:
        - name: OTEL_SERVICE_NAME
          value: nktp-large-target-metrics-targetallocator
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.instance.id=$(POD_NAME)
      telemetry:
        metrics:
          readers:
            - periodic:
                interval: 30s
                exporter:
                  otlpGrpc:
                    endpoint: nktp-watchdog-collector:4320
                    tls:
                      insecure: true
                    temporalityPreference: cumulative
      resources:
        requests:
          cpu: 250m
          memory: 1Gi # Discovery cache size depends on Kubernetes objects and target count.
        limits:
          cpu: "1"
          memory: 2Gi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      observability:
        metrics:
          enableMetrics: false # Metrics are pushed over OTLP without a ServiceMonitor.
      prometheusCR:
        enabled: true
        # The bundled Kubernetes component ServiceMonitors reference the Collector's service-account files.
        denyFSAccessThroughSMs: false
        serviceMonitorSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
        podMonitorSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
        probeSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
        scrapeConfigSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
    autoscaler:
      minReplicas: 2
      maxReplicas: 32
      targetCPUUtilization: 75
      targetMemoryUtilization: 100
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 200
              periodSeconds: 15
            - type: Pods
              value: 8
              periodSeconds: 15
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 12Gi
    env:
      - name: GOMEMLIMIT
        value: 7168MiB # 7Gi runtime target below the 7.8Gi soft refusal threshold.
      - name: GOGC
        value: "50" # More frequent GC trades CPU for lower heap growth.
    podDisruptionBudget:
      maxUnavailable: 25%
    terminationGracePeriodSeconds: 60
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-large-target-metrics-collector
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-large-target-metrics-collector
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumes:
      - name: internal-tls-client
        secret:
          secretName: nktp-large-target-metrics-client-tls
          items:
            - {key: tls.crt, path: tls.crt}
            - {key: tls.key, path: tls.key}
            - {key: ca.crt, path: ca.crt}
    volumeMounts:
      - name: internal-tls-client
        mountPath: /etc/nktp/internal-tls/client
        readOnly: true
  otelcol:
    # Set a custom image for this workload only.
    # image:
    #   registry: ""
    #   repository: otel/opentelemetry-collector-k8s
    #   tag: 0.162.0
    config:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      receivers:
        prometheus:
          config:
            global:
              # Defaults for allocator jobs. Monitor-specific limits can override them.
              sample_limit: 1000000 # Samples after metric relabeling, per scrape.
              body_size_limit: 1GiB # Bound the uncompressed response buffer before parsing.
              label_limit: 64 # Bound label-map growth per sample.
              label_name_length_limit: 256 # Bytes per label name.
              label_value_length_limit: 4096 # Bytes per label value.
              external_labels:
                nktp_metrics_pool: large-target # Identifies this pool's scraped metrics.
            # The Target Allocator supplies scrape jobs and assigned targets from monitoring CRs.
            scrape_configs: []
      processors:
        redaction/basic_v1:
          allow_all_keys: true
          redact_all_types: true
          summary: silent
          blocked_key_patterns:
            - '(?i)(?:(?:^|[._-])(?:password|passwd|secret|token|(?:access|refresh|id|session|auth)[._-]?token|(?:access|secret|private|api)[._-]?key|secret[._-]?access[._-]?key|client[._-]?secret|authorization|(?:set[._-]?)?cookie)|(?-i:[a-z0-9])(?:(?-i:P)(?:assword|asswd|rivate[._-]?key)|(?-i:S)ecret|(?-i:T)oken|(?-i:A)(?:pi[._-]?key|ccess[._-]?key|uthorization)|(?-i:C)ookie))$$'
          blocked_values:
            - '(?i)\bBearer\s+[A-Za-z0-9._~+/-]+=*'
            - '(?i)"?\b(?:[A-Za-z0-9]+[._-])*(?:password|passwd|secret|token|(?:access|refresh|id|session|auth)[._-]?token|(?:access|secret|private|api)[._-]?key|secret[._-]?access[._-]?key|client[._-]?secret|authorization|(?:set[._-]?)?cookie|[A-Za-z0-9]*(?-i:[a-z0-9])(?:(?-i:P)(?:assword|asswd|rivate[._-]?key)|(?-i:S)ecret|(?-i:T)oken|(?-i:A)(?:pi[._-]?key|ccess[._-]?key|uthorization)|(?-i:C)ookie))"?\s*[:=]\s*(?:"(?:\\.|[^"\\])*"|''(?:\\.|[^''\\])*''|(?:(?:Bearer|Basic)\s+)?[^\s,;"]+)'
        memory_limiter:
          check_interval: 500ms # Poll Go heap Alloc. Bursts can allocate between checks.
          limit_percentage: 80 # Hard heap threshold is 9.6Gi, leaving 2.4Gi below the container cap.
          spike_limit_percentage: 15 # Reserve 1.8Gi for spikes. Soft refusal threshold is 65% (7.8Gi).
        batch:
          timeout: 0s
          send_batch_size: 8192
          send_batch_max_size: 8192 # Split whole scrapes before admission to the exporter queue.
      exporters:
        otlp:
          endpoint: nktp-gateway-metrics-collector:4317
          tls:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes # Counts serialized bytes. Go heap use can be several times larger.
            queue_size: 134217728 # 128MiB serialized after the batch processor splits each scrape.
            num_consumers: 32 # Bound concurrent exports to gateways during large scrapes.
            batch:
              sizer: bytes # Batch sizes use serialized bytes, matching queue accounting.
              min_size: 1048576 # Batch at 1MiB to amortize export overhead.
              max_size: 2097152 # Split above 2MiB serialized. Decoded heap can be larger.
              flush_timeout: 1s # Flush partial batches to limit low-volume buffering time.
      service:
        extensions: [health_check]
        telemetry:
          resource:
            service.name: nktp-large-target-metrics
            service.instance.id: ${env:POD_NAME}
          metrics:
            readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          logs:
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          traces:
            level: basic
            processors:
              - batch:
                  schedule_delay: 1000 # Milliseconds. Keeps spans of one trace close together for tail sampling.
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
        pipelines:
          metrics:
            receivers: [prometheus]
            processors: [memory_limiter, redaction/basic_v1, batch]
            exporters: [otlp]
