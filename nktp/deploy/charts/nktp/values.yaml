            exporters: [otlp_http/logs]
          logs/targetallocator:
            receivers: [filelog/targetallocator]
            processors: [memory_limiter, resource/node, transform/targetallocator]
            exporters: [otlp_http/watchdog]
          logs/operator:
            receivers: [filelog/operator]
            processors: [memory_limiter, resource/node, transform/operator]
            exporters: [otlp_http/watchdog]
          metrics:
            receivers: [prometheus, prometheus/kubelet, otlp]
            processors: [memory_limiter, resource/node]
            exporters: [otlp_http/metrics]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource/node]
            exporters: [otlp_http/traces]
  # Native sidecar for this workload's own telemetry. It buffers through outages,
  # keeps only error and slow traces, and exports to http://nktp-watchdog-collector:4318.
  sidecar:
    kubernetes:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: GOMEMLIMIT
          value: 96MiB # Soft Go runtime target at 75% of the container limit.
      startupProbe: # The main Collector starts after this succeeds.
        httpGet:
          path: /
          port: 13134
        periodSeconds: 1
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /
          port: 13134
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
    otelcol:
      # Set a custom image for this sidecar only.
      # image:
      #   registry: ""
      #   repository: otel/opentelemetry-collector-k8s
      #   tag: 0.162.0
      config:
        extensions:
          health_check:
            endpoint: 0.0.0.0:13134 # Kubelet probes use the Pod IP.
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 127.0.0.1:4319 # Reachable only from containers in this Pod.
                keepalive:
                  idle_timeout: 5m # Longer than the 60s metric interval, so a reused connection is not closed mid-request.
        processors:
          memory_limiter:
            check_interval: 500ms
            limit_percentage: 80 # Hard heap threshold, 102.4Mi.
            spike_limit_percentage: 25 # Soft refusal at 55% (70.4Mi).
          tail_sampling:
            decision_wait: 5s # Covers the 1s SDK flush interval with margin.
            num_traces: 1000 # Bounds traces held in memory. The oldest are dropped first.
            decision_cache:
              sampled_cache_size: 10000 # Late spans of a kept trace are also kept.
            policies:
              - name: errors
                type: status_code
                status_code:
                  status_codes: [ERROR]
              - name: slow # Any single span longer than 1s. Trace duration includes up to 1s of export batching.
                type: ottl_condition
                ottl_condition:
                  error_mode: ignore
                  span:
                    - end_time_unix_nano - start_time_unix_nano > 1000000000
        exporters:
          otlp_http:
            endpoint: http://nktp-watchdog-collector:4318
            retry_on_failure:
              max_elapsed_time: 30m
            sending_queue:
              block_on_overflow: false # The SDK cannot wait or retry, so blocking would only move the loss out of view.
              sizer: bytes
              queue_size: 4194304 # 4MiB for each of the 3 signal queues, 12MiB in total. When full, the sidecar refuses new data.
              num_consumers: 2
              batch:
                sizer: bytes
                min_size: 65536
                max_size: 262144
                flush_timeout: 1s
        service:
          extensions: [health_check]
          telemetry:
            resource:
              service.name: nktp-daemonset-sidecar
              service.instance.id: ${env:POD_NAME}
              k8s.node.name: ${env:NODE_NAME}
            # Own metrics and logs go through this sidecar's own buffer.
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            traces:
              level: none # Export failures already show in this sidecar's metrics and logs.
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp_http]
            logs:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp_http]
            traces:
              receivers: [otlp]
              processors: [memory_limiter, tail_sampling]
              exporters: [otlp_http]

# Scrapes monitoring CRs labeled nktp.nvidia.io/large-target: "true".
large_target_metrics:
  kubernetes:
    mode: statefulset # The Target Allocator uses stable Collector identities.
    replicas: 2
    targetAllocator:
      enabled: true
      mtls:
        enabled: true # Let cert-manager secure Collector requests to the allocator.
        useCertManager: true
      replicas: 1
      allocationStrategy: consistent-hashing
      env:
        - name: OTEL_SERVICE_NAME
          value: nktp-large-target-metrics-targetallocator
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.instance.id=$(POD_NAME)
      telemetry:
        metrics:
          readers:
            - periodic:
                interval: 30s
                exporter:
                  otlpHttp:
                    endpoint: http://nktp-watchdog-collector:4318
                    temporalityPreference: cumulative
      resources:
        requests:
          cpu: 250m
          memory: 1Gi # Discovery cache size depends on Kubernetes objects and target count.
        limits:
          cpu: "1"
          memory: 2Gi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      observability:
        metrics:
          enableMetrics: false # Metrics are pushed over OTLP without a ServiceMonitor.
      prometheusCR:
        enabled: true
        # The bundled Kubernetes component ServiceMonitors reference the Collector's service-account files.
        denyFSAccessThroughSMs: false
        serviceMonitorSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
        podMonitorSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
        probeSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
        scrapeConfigSelector:
          matchExpressions:
            - key: nktp.nvidia.io/large-target
              operator: In
              values: ["true"]
    autoscaler:
      minReplicas: 2
      maxReplicas: 16
      targetCPUUtilization: 75
      targetMemoryUtilization: 100 # Scale at 8Gi working set. The limiter checks Go heap separately.
    resources:
      requests:
        cpu: "2"
        memory: 8Gi # Reserve memory for parsing and retained scrape data.
      limits:
        cpu: "4"
        memory: 16Gi # Allow headroom for overlapping scrapes and the exporter queue.
    env:
      - name: GOMEMLIMIT
        # Large responses allocate before the memory limiter, while earlier scrapes may remain queued.
        # Use half the container limit as a soft runtime target to leave room for overlapping allocations.
        value: 8GiB
      - name: GOGC
        value: "50" # More frequent GC trades CPU for lower heap growth.
    podDisruptionBudget:
      maxUnavailable: 25%
    terminationGracePeriodSeconds: 60
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-large-target-metrics-collector
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-large-target-metrics-collector
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
  otelcol:
    # Set a custom image for this workload only.
    # image:
    #   registry: ""
    #   repository: otel/opentelemetry-collector-k8s
    #   tag: 0.162.0
    config:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      receivers:
        prometheus:
          config:
            global:
              # Defaults for allocator jobs. Monitor-specific limits can override them.
              sample_limit: 1000000 # Samples after metric relabeling, per scrape.
              body_size_limit: 1GiB # Bound the uncompressed response buffer before parsing.
              label_limit: 64 # Bound label-map growth per sample.
              label_name_length_limit: 256 # Bytes per label name.
              label_value_length_limit: 4096 # Bytes per label value.
              external_labels:
                nktp_metrics_pool: large-target # Identifies this pool's scraped metrics.
            # The Target Allocator supplies scrape jobs and assigned targets from monitoring CRs.
            scrape_configs: []
      processors:
        memory_limiter:
          check_interval: 500ms # Poll Go heap Alloc. Bursts can allocate between checks.
          limit_percentage: 80 # Hard heap threshold, 12.8Gi. The Go runtime target is 8GiB.
          spike_limit_percentage: 25 # Subtract from hard threshold for soft refusal at 55% (8.8Gi).
      exporters:
        otlp_http:
          endpoint: http://nktp-gateway-metrics-collector:4318
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes # Counts serialized bytes. Go heap use can be several times larger.
            queue_size: 2147483648 # 2GiB serialized. Whole scrapes enter before batch splitting.
            num_consumers: 32 # Export concurrency. Idle worker slots hold no batch payload.
            batch:
              sizer: bytes # Batch sizes use serialized bytes, matching queue accounting.
              min_size: 1048576 # Batch at 1MiB to amortize export overhead.
              max_size: 2097152 # Split above 2MiB serialized. Decoded heap can be larger.
              flush_timeout: 1s # Flush partial batches to limit low-volume buffering time.
      service:
        extensions: [health_check]
        telemetry:
          resource:
            service.name: nktp-large-target-metrics
            service.instance.id: ${env:POD_NAME}
          metrics:
            readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          logs:
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          traces:
            level: basic
            processors:
              - batch:
                  schedule_delay: 1000 # Milliseconds. Keeps spans of one trace close together for tail sampling.
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
        pipelines:
          metrics:
            receivers: [prometheus]
            processors: [memory_limiter]
            exporters: [otlp_http]
