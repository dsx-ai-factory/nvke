          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes
            queue_size: 67108864 # 64MiB to buffer traces while gateways scale.
            num_consumers: 32
            batch:
              sizer: bytes
              min_size: 1048576
              max_size: 2097152
              flush_timeout: 1s
        otlp/watchdog:
          endpoint: nktp-watchdog-collector:4317
          tls:
            ca_file: /etc/nktp/internal-tls/client/ca.crt
            cert_file: /etc/nktp/internal-tls/client/tls.crt
            key_file: /etc/nktp/internal-tls/client/tls.key
            reload_interval: 1h
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes
            queue_size: 1048576
            num_consumers: 2
            batch:
              sizer: bytes
              min_size: 65536
              max_size: 262144
              flush_timeout: 1s
      service:
        extensions: [health_check]
        telemetry:
          resource:
            service.name: nktp-daemonset
            service.instance.id: ${env:POD_NAME}
            k8s.node.name: ${env:NODE_NAME}
          metrics:
            readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          logs:
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          traces:
            level: basic
            processors:
              - batch:
                  schedule_delay: 1000 # Milliseconds. Keeps spans of one trace close together for tail sampling.
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
        pipelines:
          logs:
            receivers: [filelog, journald, otlp, filelog/host-auth, filelog/host-audit, filelog/kube-api-audit]
