# Cluster event reader. One elected replica watches Kubernetes Events.
cluster_events:
  kubernetes:
    mode: statefulset # Stable replica identities support per-replica volumes for optional persistent queues.
    replicas: 2 # One active reader and one standby. More replicas do not increase watch throughput.
    resources:
      requests:
        cpu: "1"
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 1Gi # Size for Event rate and the export queue. Startup no longer lists retained Events.
    env:
      - name: GOMEMLIMIT
        value: 896MiB # Soft Go runtime target. Leaves 128Mi nominal headroom below the container limit.
      - name: GOGC
        value: "50" # More frequent GC trades CPU for lower heap growth.
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    podDisruptionBudget:
      maxUnavailable: 25%
    terminationGracePeriodSeconds: 60
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
