global:
  # Override image registry for every image this chart and its dependencies pull.
  #
  # NOTE: metrics-server (disabled by default) and the opentelemetry-operator chart
  # nested in opentelemetry-kube-stack do NOT read global.imageRegistry.
  # Point them at a mirror explicitly instead:
  #   metrics-server:
  #     image:
  #       repository: <mirror>/metrics-server/metrics-server
  #   opentelemetry-kube-stack:
  #     opentelemetry-operator:
  #       manager:
  #         image:
  #           repository: <mirror>/open-telemetry/opentelemetry-operator/opentelemetry-operator
  imageRegistry: ""

# Collector image used by all OTel workloads. global.imageRegistry replaces registry.
otelcol_image:
  registry: "" # Empty pulls from the image's default registry (Docker Hub for this repository).
  repository: otel/opentelemetry-collector-k8s
  tag: 0.162.0

# Target Allocator image used by the watchdog, daemonset, and large_target_metrics
# allocators. global.imageRegistry replaces registry. Keep the tag equal to the
# Operator version from opentelemetry-kube-stack. A workload's
# kubernetes.targetAllocator.image, as a full image string, overrides it.
targetallocator_image:
  registry: ghcr.io
  repository: open-telemetry/opentelemetry-operator/target-allocator
  tag: 0.159.0

# OTel workloads. Each workload uses the same structure:
#   kubernetes:     Standard Kubernetes settings (resources, affinity, selectors, labels, ...).
#   otelcol.image:  Set a custom image for this workload only, as a {registry, repository, tag} map.
#   otelcol.config: Native OTel collector configuration as a YAML map.

# Receives internal telemetry from all NKTP collectors.
# Sends received telemetry and its own telemetry to the default backend.
watchdog:
  kubernetes:
    mode: statefulset # Required by the operator's Target Allocator support.
    replicas: 2
    targetAllocator:
      enabled: true # Assign each explicit scrape target to one watchdog replica.
      mtls:
        enabled: true # Let cert-manager secure Collector requests to the allocator.
        useCertManager: true
      replicas: 1
      allocationStrategy: consistent-hashing
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      env:
        - name: OTEL_SERVICE_NAME
          value: nktp-watchdog-targetallocator
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.instance.id=$(POD_NAME)
      telemetry:
        metrics:
          readers:
            - periodic:
                interval: 30s
                exporter:
                  otlpHttp:
                    endpoint: http://nktp-watchdog-collector:4318
                    temporalityPreference: cumulative
      prometheusCR:
        enabled: false # The future metrics service owns monitor discovery.
      observability:
        metrics:
          enableMetrics: false # Metrics are pushed over OTLP without a ServiceMonitor.
    autoscaler:
      minReplicas: 2
      maxReplicas: 16
      targetCPUUtilization: 75
      targetMemoryUtilization: 100
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 1Gi
    env:
      - name: GOMEMLIMIT
        value: 768MiB # Soft Go runtime target. Leaves 256Mi nominal headroom below the container limit.
      - name: GOGC
        value: "50" # More frequent GC trades CPU for lower heap growth.
    podDisruptionBudget:
      maxUnavailable: 25%
    terminationGracePeriodSeconds: 60
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-watchdog-collector
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-watchdog-collector
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
  otelcol:
    # Set a custom image for this workload only.
    # image:
    #   registry: ""
    #   repository: otel/opentelemetry-collector-k8s
    #   tag: 0.162.0
    config:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
        prometheus:
          config:
            scrape_configs:
              - job_name: nktp-operator
                scrape_interval: 30s
                scheme: https
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                tls_config:
                  insecure_skip_verify: true # Matches upstream scraping of its self-signed metrics certificate.
                kubernetes_sd_configs:
                  - role: endpointslice
                    namespaces:
                      own_namespace: true
                relabel_configs:
                  - source_labels:
                      - __meta_kubernetes_service_name
                      - __meta_kubernetes_endpointslice_port_name
                      - __meta_kubernetes_endpointslice_endpoint_conditions_ready
                      - __meta_kubernetes_endpointslice_address_target_kind
                    regex: nktp-operator;metrics;true;Pod
                    action: keep
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_endpointslice_address_target_name]
                    target_label: pod
      processors:
        memory_limiter:
          check_interval: 500ms # Poll Go heap Alloc. Bursts can allocate between checks.
          limit_percentage: 80 # Hard heap threshold, 819.2Mi. Leaves room below the container cap.
          spike_limit_percentage: 25 # Subtract from hard threshold for soft refusal at 55% (563.2Mi).
      exporters:
        otlp_http:
          endpoint: http://lgtm:4318
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            block_on_overflow: true
            sizer: bytes # Counts serialized bytes. Go heap use can be several times larger.
            queue_size: 8388608 # Per signal. 3 x 8MiB = 24MiB, including in-flight payloads.
            num_consumers: 32 # Export concurrency. Idle worker slots hold no batch payload.
            batch:
              sizer: bytes # Batch sizes use serialized bytes, matching queue accounting.
              min_size: 1048576 # Batch at 1MiB to amortize export overhead.
              max_size: 2097152 # Split above 2MiB serialized. Decoded heap can be larger.
              flush_timeout: 1s # Flush partial batches to limit low-volume buffering time.
      service:
        extensions: [health_check]
        telemetry:
          resource:
            service.name: nktp-watchdog
            service.instance.id: ${env:POD_NAME}
          metrics:
            readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          logs:
            processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
          traces:
            level: basic
            processors:
              - batch:
                  schedule_delay: 1000 # Milliseconds. Keeps spans of one trace close together for tail sampling.
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://127.0.0.1:4319
        pipelines:
          metrics:
            receivers: [otlp, prometheus]
            processors: [memory_limiter]
            exporters: [otlp_http]
          logs:
            receivers: [otlp]
            processors: [memory_limiter]
            exporters: [otlp_http]
          traces:
            receivers: [otlp]
            processors: [memory_limiter]
            exporters: [otlp_http]
  # Native sidecar for this workload's own telemetry. It buffers through outages,
  # keeps only error and slow traces, and exports to http://lgtm:4318.
  sidecar:
    kubernetes:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GOMEMLIMIT
          value: 192MiB # Soft Go runtime target at 75% of the container limit.
      startupProbe: # The main Collector starts after this succeeds.
        httpGet:
          path: /
          port: 13134
        periodSeconds: 1
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /
          port: 13134
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
    otelcol:
      # Set a custom image for this sidecar only.
      # image:
      #   registry: ""
      #   repository: otel/opentelemetry-collector-k8s
      #   tag: 0.162.0
      config:
        extensions:
          health_check:
            endpoint: 0.0.0.0:13134 # Kubelet probes use the Pod IP.
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 127.0.0.1:4319 # Reachable only from containers in this Pod.
                keepalive:
                  idle_timeout: 5m # Longer than the 60s metric interval, so a reused connection is not closed mid-request.
        processors:
          memory_limiter:
            check_interval: 500ms
            limit_percentage: 80 # Hard heap threshold, 204.8Mi.
            spike_limit_percentage: 25 # Soft refusal at 55% (140.8Mi).
          tail_sampling:
            decision_wait: 5s # Covers the 1s SDK flush interval with margin.
            num_traces: 5000 # Bounds traces held in memory. The oldest are dropped first.
            decision_cache:
              sampled_cache_size: 50000 # Late spans of a kept trace are also kept.
            policies:
              - name: errors
                type: status_code
                status_code:
                  status_codes: [ERROR]
              - name: slow # Any single span longer than 1s. Trace duration includes up to 1s of export batching.
                type: ottl_condition
                ottl_condition:
                  error_mode: ignore
                  span:
                    - end_time_unix_nano - start_time_unix_nano > 1000000000
        exporters:
          otlp_http:
            endpoint: http://lgtm:4318
            retry_on_failure:
              max_elapsed_time: 30m
            sending_queue:
              block_on_overflow: false # The SDK cannot wait or retry, so blocking would only move the loss out of view.
              sizer: bytes
              queue_size: 16777216 # 16MiB for each of the 3 signal queues, 48MiB in total. When full, the sidecar refuses new data.
              num_consumers: 2
              batch:
                sizer: bytes
                min_size: 65536
                max_size: 262144
                flush_timeout: 1s
        service:
          extensions: [health_check]
          telemetry:
            resource:
              service.name: nktp-watchdog-sidecar
              service.instance.id: ${env:POD_NAME}
            # Own metrics and logs go through this sidecar's own buffer.
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: http/protobuf
                        endpoint: http://127.0.0.1:4319
            traces:
              level: none # Export failures already show in this sidecar's metrics and logs.
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp_http]
            logs:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [otlp_http]
            traces:
              receivers: [otlp]
              processors: [memory_limiter, tail_sampling]
              exporters: [otlp_http]

