{{- $allocator := .Values.daemonset.kubernetes.targetAllocator | default dict -}}
{{- if not (and (kindIs "map" $allocator) (deepEqual $allocator.enabled true)) -}}
{{- fail "daemonset.kubernetes.targetAllocator.enabled must be true to assign scrape targets to Collectors on the same node" -}}
{{- end -}}
{{- if not (kindIs "map" .Values.daemonset.otelcol.config) -}}
{{- fail "daemonset.otelcol.config must be a native Collector YAML map" -}}
{{- end -}}
{{- $workload := include "nktp.withSidecar" (dict "name" "daemonset" "values" .Values.daemonset "root" $ "sidecarEnv" (list (dict "name" "NODE_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "spec.nodeName"))))) | fromYaml -}}
{{- $env := $workload.env | default list -}}
{{- range $name, $field := dict "NODE_NAME" "spec.nodeName" "OTEL_K8S_NODE_IP" "status.hostIP" "POD_NAMESPACE" "metadata.namespace" -}}
  {{- $found := false -}}
  {{- range $env -}}
    {{- if eq .name $name -}}{{- $found = true -}}{{- end -}}
  {{- end -}}
  {{- if not $found -}}
    {{- $env = append $env (dict "name" $name "valueFrom" (dict "fieldRef" (dict "fieldPath" $field))) -}}
  {{- end -}}
{{- end -}}
{{- $_ := set $workload "env" $env -}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: nktp-daemonset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* The upstream pre-delete Job selects this label to delete the Collector before the Operator. */}}
    helm.sh/chart: {{ include "opentelemetry-kube-stack.chart" (index .Subcharts "opentelemetry-kube-stack") }}
spec:
  {{- $collector := dict "image" (include "nktp.image" (dict "imageRegistry" .Values.global.imageRegistry "image" (.Values.daemonset.otelcol.image | default .Values.otelcol_image))) }}
  {{- /* Kubernetes workload values override defaults. The resolved Collector image overrides any workload image. */}}
  {{- mustMergeOverwrite (dict "mode" "daemonset" "managementState" "managed" "upgradeStrategy" "automatic" "targetAllocator" (dict "mtls" (dict "useCertManager" .Values.certManager.targetAllocators.enabled) "image" (include "nktp.image" (dict "imageRegistry" .Values.global.imageRegistry "image" .Values.targetallocator_image)))) (omit $workload "config") $collector | toYaml | nindent 2 }}
  config:
    {{- .Values.daemonset.otelcol.config | toYaml | nindent 4 }}
