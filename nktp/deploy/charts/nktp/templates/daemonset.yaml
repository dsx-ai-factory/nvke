{{- $allocator := .Values.daemonset.kubernetes.targetAllocator | default dict -}}
{{- if not (and (kindIs "map" $allocator) (deepEqual $allocator.enabled true)) -}}
{{- fail "daemonset.kubernetes.targetAllocator.enabled must be true to assign scrape targets to Collectors on the same node" -}}
{{- end -}}
{{- if not (kindIs "map" .Values.daemonset.otelcol.config) -}}
{{- fail "daemonset.otelcol.config must be a native Collector YAML map" -}}
{{- end -}}
{{- $config := deepCopy .Values.daemonset.otelcol.config -}}
{{- /* TODO: REMOVE this temporary monitoring pipeline after an aligned Operator, Target Allocator and CRD upgrade to v0.157.0 or newer. Replace scraping with native Target Allocator OTLP metrics push to watchdog. */ -}}
{{- $monitoring := `receivers:
  prometheus/targetallocator:
    config:
      scrape_configs:
        - job_name: nktp-targetallocator
          scrape_interval: 30s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: ["${env:POD_NAMESPACE}"]
              selectors:
                - role: pod
                  label: app.kubernetes.io/name=nktp-daemonset-targetallocator,app.kubernetes.io/component=opentelemetry-targetallocator
                  field: spec.nodeName=${env:NODE_NAME}
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: http
              action: keep
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: instance
processors:
  memory_limiter/targetallocator:
    check_interval: 500ms
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/targetallocator:
    attributes:
      - key: k8s.node.name
        value: ${env:NODE_NAME}
        action: upsert
exporters:
  otlp_http/watchdog:
    endpoint: http://nktp-watchdog-collector:4318
    retry_on_failure:
      max_elapsed_time: 30m
    sending_queue:
      block_on_overflow: true
      sizer: bytes
      queue_size: 1048576
      num_consumers: 2
      batch:
        sizer: bytes
        min_size: 65536
        max_size: 262144
        flush_timeout: 1s
service:
  pipelines:
    metrics/targetallocator:
      receivers: [prometheus/targetallocator]
      processors: [memory_limiter/targetallocator, resource/targetallocator]
      exporters: [otlp_http/watchdog]
` | fromYaml -}}
{{- range $section := list "receivers" "processors" "exporters" -}}
  {{- range $name, $_ := index $monitoring $section -}}
    {{- if hasKey (index $config $section | default dict) $name -}}
      {{- fail (printf "daemonset.otelcol.config.%s[%s] is reserved for chart-generated Target Allocator monitoring" $section $name) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if hasKey (($config.service | default dict).pipelines | default dict) "metrics/targetallocator" -}}
  {{- fail "daemonset.otelcol.config.service.pipelines[metrics/targetallocator] is reserved for chart-generated Target Allocator monitoring" -}}
{{- end -}}
{{- $config = mustMergeOverwrite $config $monitoring -}}
{{- $workload := deepCopy .Values.daemonset.kubernetes -}}
{{- $kubelet := .Values.daemonset.kubelet | default dict -}}
{{- $cadvisor := $kubelet.cadvisor | default dict -}}
{{- $probes := $kubelet.probes | default dict -}}
{{- $resource := $kubelet.resource | default dict -}}
{{- $kubeletCA := dig "tls" "ca" "configMap" dict $kubelet -}}
{{- $optionalKubeletScrapes := list
      (dict "enabled" ($cadvisor.enabled | default false) "jobName" "kubelet-cadvisor" "metricsPath" "/metrics/cadvisor")
      (dict "enabled" ($probes.enabled | default false) "jobName" "kubelet-probes" "metricsPath" "/metrics/probes")
      (dict "enabled" ($resource.enabled | default false) "jobName" "kubelet-resource" "metricsPath" "/metrics/resource") -}}
{{- $hasOptionalKubeletScrapes := false -}}
{{- range $optional := $optionalKubeletScrapes -}}
  {{- if $optional.enabled -}}{{- $hasOptionalKubeletScrapes = true -}}{{- end -}}
{{- end -}}
{{- if or $kubeletCA.name $hasOptionalKubeletScrapes -}}
  {{- $kubeletReceiverConfig := dig "receivers" "prometheus/kubelet" "config" dict $config -}}
  {{- $kubeletScrapeConfigs := $kubeletReceiverConfig.scrape_configs | default list -}}
  {{- $kubeletJob := dict -}}
  {{- range $scrapeConfig := $kubeletScrapeConfigs -}}
    {{- if eq ($scrapeConfig.job_name | default "") "kubelet" -}}
      {{- $kubeletJob = $scrapeConfig -}}
    {{- end -}}
  {{- end -}}
  {{- if eq (len $kubeletJob) 0 -}}
    {{- fail "daemonset.otelcol.config.receivers[prometheus/kubelet].config.scrape_configs must contain a kubelet job when kubelet TLS or optional scrapes are configured" -}}
  {{- end -}}
  {{- if $kubeletCA.name -}}
    {{- $tlsConfig := $kubeletJob.tls_config | default dict -}}
    {{- $_ := set $tlsConfig "ca_file" "/etc/nktp/kubelet-serving-ca/ca.crt" -}}
    {{- $_ := set $tlsConfig "insecure_skip_verify" false -}}
    {{- $_ := set $kubeletJob "tls_config" $tlsConfig -}}
    {{- if not $kubeletCA.key -}}
      {{- fail "daemonset.kubelet.tls.ca.configMap.key must be set when daemonset.kubelet.tls.ca.configMap.name is set" -}}
    {{- end -}}
    {{- $caVolume := dict "name" "kubelet-serving-ca" "configMap" (dict "name" $kubeletCA.name "items" (list (dict "key" $kubeletCA.key "path" "ca.crt"))) -}}
    {{- $caMount := dict "name" "kubelet-serving-ca" "mountPath" "/etc/nktp/kubelet-serving-ca" "readOnly" true -}}
    {{- $_ := set $workload "volumes" (append ($workload.volumes | default list) $caVolume) -}}
    {{- $_ := set $workload "volumeMounts" (append ($workload.volumeMounts | default list) $caMount) -}}
  {{- end -}}
  {{- range $optional := $optionalKubeletScrapes -}}
    {{- if $optional.enabled -}}
      {{- range $scrapeConfig := $kubeletScrapeConfigs -}}
        {{- if eq ($scrapeConfig.job_name | default "") $optional.jobName -}}
          {{- fail (printf "daemonset.otelcol.config.receivers[prometheus/kubelet].config.scrape_configs already contains job %s; disable daemonset.kubelet.%s.enabled or remove the manual job" $optional.jobName (trimPrefix "kubelet-" $optional.jobName)) -}}
        {{- end -}}
      {{- end -}}
      {{- $optionalJob := deepCopy $kubeletJob -}}
      {{- $_ := set $optionalJob "job_name" $optional.jobName -}}
      {{- $_ := set $optionalJob "metrics_path" $optional.metricsPath -}}
      {{- if eq $optional.jobName "kubelet-cadvisor" -}}
        {{- $metricRelabelConfigs := list -}}
        {{- range $metricRelabeling := ($cadvisor.metricRelabelings | default list) -}}
          {{- $metricRelabelConfig := deepCopy $metricRelabeling -}}
          {{- if hasKey $metricRelabelConfig "sourceLabels" -}}
            {{- $_ := set $metricRelabelConfig "source_labels" $metricRelabelConfig.sourceLabels -}}
            {{- $_ := unset $metricRelabelConfig "sourceLabels" -}}
          {{- end -}}
          {{- if hasKey $metricRelabelConfig "targetLabel" -}}
            {{- $_ := set $metricRelabelConfig "target_label" $metricRelabelConfig.targetLabel -}}
            {{- $_ := unset $metricRelabelConfig "targetLabel" -}}
          {{- end -}}
          {{- $metricRelabelConfigs = append $metricRelabelConfigs $metricRelabelConfig -}}
        {{- end -}}
        {{- $_ := set $optionalJob "metric_relabel_configs" $metricRelabelConfigs -}}
      {{- end -}}
      {{- range $relabelConfig := ($optionalJob.relabel_configs | default list) -}}
        {{- if eq ($relabelConfig.target_label | default "") "metrics_path" -}}
          {{- $_ := set $relabelConfig "replacement" $optional.metricsPath -}}
        {{- end -}}
      {{- end -}}
      {{- $kubeletScrapeConfigs = append $kubeletScrapeConfigs $optionalJob -}}
    {{- end -}}
  {{- end -}}
  {{- $_ := set $kubeletReceiverConfig "scrape_configs" $kubeletScrapeConfigs -}}
{{- end -}}
{{- $env := $workload.env | default list -}}
{{- range $name, $field := dict "NODE_NAME" "spec.nodeName" "OTEL_K8S_NODE_IP" "status.hostIP" "POD_NAMESPACE" "metadata.namespace" -}}
  {{- $found := false -}}
  {{- range $env -}}
    {{- if eq .name $name -}}{{- $found = true -}}{{- end -}}
  {{- end -}}
  {{- if not $found -}}
    {{- $env = append $env (dict "name" $name "valueFrom" (dict "fieldRef" (dict "fieldPath" $field))) -}}
  {{- end -}}
{{- end -}}
{{- $_ := set $workload "env" $env -}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: nktp-daemonset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /* The upstream pre-delete Job selects this label to delete the Collector before the Operator. */}}
    helm.sh/chart: {{ include "opentelemetry-kube-stack.chart" (index .Subcharts "opentelemetry-kube-stack") }}
spec:
  {{- $collector := dict "image" (include "nktp.image" (dict "imageRegistry" .Values.global.imageRegistry "image" (.Values.daemonset.otelcol.image | default .Values.otelcol_image))) }}
  {{- /* Kubernetes workload values override defaults. The resolved Collector image overrides any workload image. */}}
  {{- mustMergeOverwrite (dict "mode" "daemonset" "managementState" "managed" "upgradeStrategy" "automatic") (omit $workload "config") $collector | toYaml | nindent 2 }}
  config:
    {{- $config | toYaml | nindent 4 }}
