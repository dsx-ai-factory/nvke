apiVersion: v2
name: nktp
description: A scalable, OpenTelemetry pipeline for collecting, processing, and exporting Kubernetes metrics, logs, and traces.
type: application
# A placeholder for local `helm lint` / `helm template`. CI sets the real
# version at package time from the nktp/vX.Y.Z tag (--version X.Y.Z), as
# chart-publish-nvcr.yml does for the controller chart.
# See .github/workflows/nktp-chart-publish.yml.
version: 0.0.0
home: https://github.com/dsx-ai-factory/nvke/tree/main/nktp
sources:
  - https://github.com/dsx-ai-factory/nvke

dependencies:
  - name: opentelemetry-kube-stack
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.25.1
  - name: prometheus-node-exporter
    alias: node-exporter
    repository: https://prometheus-community.github.io/helm-charts
    version: 4.56.1
    condition: node-exporter.enabled
  - name: metrics-server
    repository: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.13.1
    condition: metrics-server.enabled
