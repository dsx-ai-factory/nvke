apiVersion: v2
name: nico-prereqs
description: What NICo expects to find already in place — its database, its credentials, its certificate issuer
type: application
version: 0.1.0
appVersion: "v2025.12.30-rc1"
keywords:
  - nvke
  - nico
home: https://github.com/dsx-ai-factory/nvke
sources:
  - https://github.com/dsx-ai-factory/nvke

# INSTALL THIS BEFORE ../nico, AND WAIT FOR IT.
#
# Not a subchart of it, and not for tidiness. The NICo chart runs its config
# ConfigMap and its schema migration Job as pre-install,pre-upgrade hooks, and
# helm applies hooks before every regular manifest in the same release. So
# anything those hooks read has to be in an EARLIER release:
#
#   the namespace          the hooks are namespaced
#   the database           the migration Job connects to it
#   the credentials Secret the migration Job reads DATASTORE_USER and
#                          DATASTORE_PASSWORD from it
#
# All three live here. Put any of them in the NICo release and the hooks run
# before they exist.

dependencies:
  # NICo's database. Turn it off to point NICo at one something else manages —
  # a PostgreSQL operator, or a managed service — and set database.host.
  - name: postgresql
    version: "18.5.15"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled

  # NICo's Temporal, which is NOT the NVKE controller's. Off by default. Its
  # chart has no namespaceOverride, so it lands in this release's namespace,
  # which is NICo's — the ticket's "its own namespace, since NICo and CWE both
  # default to temporal".
  - name: temporal
    version: "0.74.0"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
