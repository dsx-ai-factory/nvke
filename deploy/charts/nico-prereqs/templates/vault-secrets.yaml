SPDX-License-Identifier: Apache-2.0

The two Secrets NICo's services mount to reach Vault. They are mounted whether
or not a Vault exists, so on a cluster with no Vault they still have to be
present — empty values are enough for that. NICo only fails when it actually
calls Vault.
*/ -}}
{{- if .Values.vault.createSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vault.approleSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  VAULT_ROLE_ID: {{ .Values.vault.roleID | quote }}
  VAULT_SECRET_ID: {{ .Values.vault.secretID | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vault.tokenSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  VAULT_TOKEN: {{ .Values.vault.token | quote }}
{{- end }}
