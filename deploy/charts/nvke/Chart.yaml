apiVersion: v2
name: nvke
description: The NVKE management plane — the NVKE controller with the PostgreSQL and Temporal it runs on
type: application
version: 0.1.0
appVersion: "0.2.0"
keywords:
  - nvke
  - cluster-api
  - bare-metal
home: https://github.com/dsx-ai-factory/nvke
sources:
  - https://github.com/dsx-ai-factory/nvke

dependencies:
  # From this checkout, not a registry. The chart is in the same repository as
  # the controller it installs, so the two cannot drift. Installing a published
  # chart instead is a one-line change to `repository` here.
  - name: nvke-controller
    version: "0.0.0"
    repository: "file://../../../controller/deploy/charts/controller"
    condition: nvke-controller.enabled

  # The Bitnami chart, which is what a real cluster runs. Turn it off to point
  # the controller and Temporal at a database something else manages — a
  # PostgreSQL operator, or a managed service.
  - name: postgresql
    version: "18.5.15"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled

  # Temporal has NO namespaceOverride — its templates follow .Release.Namespace
  # — so it lands in whichever namespace this chart is released into. That is
  # why the README asks for `--namespace nvke-system`.
  - name: temporal
    version: "0.74.0"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
