SPDX-License-Identifier: Apache-2.0

The node login the controller renders into every tenant's cloud-init.

Creating it is not enough: the controller chart injects the two variables only
when nvke-controller.secrets.dgxcTenantCredSecretName names this Secret. Set
both or neither — NOTES.txt reports the mismatch.
*/ -}}
{{- if .Values.tenantCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tenantCredentials.name }}
  namespace: {{ .Values.namespaces.controller }}
type: Opaque
stringData:
  user: {{ required "tenantCredentials.user is required when tenantCredentials.create is true" .Values.tenantCredentials.user | quote }}
  password: {{ required "tenantCredentials.password is required when tenantCredentials.create is true" .Values.tenantCredentials.password | quote }}
{{- end }}
