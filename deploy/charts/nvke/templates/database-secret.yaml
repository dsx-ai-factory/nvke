{{- /*
SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
SPDX-License-Identifier: Apache-2.0

One password, three readers, three namespaces. Each key is the name its reader
looks for: the Bitnami chart's admin password, Temporal's existingSecret key,
and the NVKE controller's connection string.

Skipped entirely when database.existingSecret is set — then that Secret must
already exist in each of the same namespaces, with the same three keys.
*/ -}}
{{- if not .Values.database.existingSecret }}
{{- $keys := .Values.database.keys }}
{{- $password := include "nvke.database.password" . }}
{{- $connection := include "nvke.database.connectionString" . }}
{{- range $ns := (include "nvke.database.namespaces" . | fromJsonArray) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.database.name }}
  namespace: {{ $ns }}
type: Opaque
stringData:
  {{ $keys.adminPassword }}: {{ $password | quote }}
  {{ $keys.password }}: {{ $password | quote }}
  {{ $keys.connectionString }}: {{ $connection | quote }}
{{- end }}
{{- end }}
