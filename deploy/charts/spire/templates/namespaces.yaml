{{- if .Values.namespaces.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.server }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.system }}
  labels:
    # spire-agent and the SPIFFE CSI driver need hostNetwork, hostPID and
    # privileged containers, all of which restricted rejects.
    pod-security.kubernetes.io/enforce: privileged
{{- end }}
