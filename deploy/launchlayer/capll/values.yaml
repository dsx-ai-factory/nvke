# The SPIFFE JWT exec-auth plugin and the workload API socket, the same as
# controller/deploy/k8s/capi-spiffe-exec-auth gives the CAPI controllers. With
# nvkeOIDCAuth on, the <cluster>-kubeconfig Secret CAPLL reads to set each
# Node's providerID runs the plugin, which reads the socket path from the
# kubeconfig. The CSI volume needs the csi.spiffe.io driver the spire item
# installs, so this item follows spire.
manager:
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
    # Containerd only supports directory subpaths for image volumes, so the
    # init container stages the plugin into an emptyDir.
    - name: spiffe-exec-plugin
      image:
        reference: ghcr.io/spiffe/k8s-spiffe-workload-jwt-exec-auth:1.0.0@sha256:e30e90774e5951f84eb6dfb36f972fead08b64c3bfdc0912c5b15f988e79de3a
        pullPolicy: IfNotPresent
    - name: spiffe-exec-bin
      emptyDir: {}
  initContainers:
    - name: install-spiffe-exec-plugin
      image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      imagePullPolicy: IfNotPresent
      command:
        - /bin/cp
        - /plugin/cmd
        - /opt/spiffe/bin/k8s-spiffe-workload-jwt-exec-auth
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
        - name: spiffe-exec-plugin
          mountPath: /plugin
          subPath: ko-app
          readOnly: true
        - name: spiffe-exec-bin
          mountPath: /opt/spiffe/bin
  volumeMounts:
    - name: spiffe-workload-api
      mountPath: /spiffe-workload-api
      readOnly: true
    - name: spiffe-exec-bin
      mountPath: /opt/spiffe/bin
      readOnly: true
