# CAPLL from its published chart, which deploys the image released with it
# (ghcr.io/dsx-ai-factory/cluster-api-provider-launchlayer/controller:v<version>).
# Pulling either needs a `helm registry login ghcr.io` and an image pull
# credential until both packages are public; README.md says how.
#
# The release name sets the manager's ServiceAccount,
# capi-provider-launchlayer-controller-manager, which
# nvke-base-config/25-capll-secret-reader.yaml binds. The manager args come
# from the stack config, as site values.
chart:
  name: capi-provider-launchlayer
  version: "0.1.0-rc.15"
  repository: oci://ghcr.io/dsx-ai-factory/cluster-api-provider-launchlayer/charts
release:
  name: capi-provider-launchlayer
  namespace: capll-system
values:
  - values.yaml
