# Read back from a live management cluster's release, which is the
# configuration that provisioned a real tenant.
#
# No password here: the render names the nvke-database Secret in
# auth.existingSecret, and both of Temporal's datastores read the same one.
# A hand install sets the SAME value on all three, or the Temporal schema
# job crash-loops with "password authentication failed".
auth:
  username: postgres
  database: postgres

primary:
  # primary.persistence, NOT a top-level persistence: the Bitnami chart nests
  # it here, and helm does not reject unknown values, so a top-level
  # persistence.enabled=true is accepted and silently ignored. That is how the
  # that run ended up running Postgres on an emptyDir.
  persistence:
    enabled: true
    size: 40Gi
    # A live site binds this to local-path. Left empty here so it takes whatever the
    # site made default -- which provisioner is right is a property of the
    # hardware, and there must BE a default or the PVC sits Pending forever.
    storageClass: ""
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
  # The databases the controller and Temporal expect to exist. Nothing else creates them.
  initdb:
    scripts:
      init-cwe.sql: |
        CREATE DATABASE "nvke-controller";
      init-temporal.sql: |
        CREATE DATABASE temporal;
        CREATE DATABASE temporal_visibility;

# PINNED BY DIGEST -- the one image on this path that the chart does not pin
# for us.
#
# Bitnami's chart defaults every image to `tag: latest`, and bitnami/postgresql
# on Docker Hub no longer publishes version tags at all: the only human-readable
# tags are `latest` and `latest-metadata`, the versioned images having moved to
# bitnamilegacy/postgresql. So there is no version to pin to -- a digest is the
# only durable reference.
#
# Without this the SBOM cannot say which database it installs. Two installs a
# week apart get different binaries with nothing in the tree to show it, which
# for the component holding all controller state is the worst place for it.
#
# This digest is what `latest` resolved to on a live management cluster, read
# back from the running pod's imageID. The chart's own appVersion claims 18.3.0;
# that is chart metadata and not what was pulled.
image:
  digest: "sha256:b74b23f091dcc87041bcae557d840c36458af46b955279cb13aedec4c32d7f71"
