# Deploy path for an NVKE management cluster whose tenant clusters run on
# LaunchLayer, through CAPLL. It is deploy/nico with CAPNICo swapped for CAPLL,
# installed from its chart, and nvke-base-config rendering CAPLL's credentials
# instead of NICo's. capll follows spire rather than taking capnico's place:
# its manager mounts the csi.spiffe.io driver the spire item installs. Read
# deploy/nico/nvke-deploy.yaml for why the rest of the order is what it is, and
# README.md here for what this path needs that deploy/nico does not.
items:
  - {name: nvke-base-config, type: template}
  - {name: spire-tpm-pubhashes, type: manifest}
  - {name: spire-server-nodeport, type: manifest}
  - {name: spire-oidc-provider-nodeport, type: manifest}
  - {name: nktp, type: helm}
  - {name: postgresql, type: helm}
  - {name: spire-crds, type: helm}
  - {name: temporal, type: helm}
  - {name: spire, type: helm}
  - {name: capll, type: helm}
  - {name: controller, type: helm}
