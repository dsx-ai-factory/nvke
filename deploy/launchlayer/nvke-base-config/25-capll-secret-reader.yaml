# CAPLL reads each Machine's bootstrap Secret, which NVKE writes beside the
# CAPI objects in its management namespace, nvke-system. CAPLL's chart grants
# Secret get only in its own namespace and leaves every workload namespace to
# the administrator (docs/authentication.md, "Secret access"), so without this
# every LaunchLayerMachine stops at a Forbidden Secret read. get only: CAPLL
# reads Secrets by name and never lists or watches them. The ServiceAccount is
# the one the capll item's chart creates for its release.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capll-secret-reader
  namespace: nvke-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capll-secret-reader
  namespace: nvke-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capll-secret-reader
subjects:
  - kind: ServiceAccount
    name: capi-provider-launchlayer-controller-manager
    namespace: capll-system
