# CAPLL reads each Machine's bootstrap Secret in nvke-system; its chart grants
# Secret get only in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capll-secret-reader
  namespace: nvke-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capll-secret-reader
  namespace: nvke-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capll-secret-reader
subjects:
  - kind: ServiceAccount
    name: capi-provider-launchlayer-controller-manager
    namespace: capll-system
