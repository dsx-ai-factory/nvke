# The controller. Last, because it blocks on "no identity issued" until
# SPIRE has issued its SVID, and it reads both Postgres and Temporal.
#
# path, not repository: the lanes build the controller at HEAD and install
# the chart from this checkout. A release that carries controller-chart is
# installed from it by digest instead.
chart:
  name: nvke-controller
  # No version: the chart at path carries its own, and a release that
  # carries the chart decides.
  path: ../../controller/deploy/charts/controller
  # NVKR artifact names. The chart artifact defaults to the item name; it
  # differs here. The two images must be in the release; the render writes
  # their repository and digest into release-images.yaml.
  artifact: controller-chart
  imageArtifact: cwe
  profilesArtifact: controller-profiles
release:
  name: nvke-controller
  namespace: nvke-controller
values:
  - values.yaml
  - overlay.yaml
