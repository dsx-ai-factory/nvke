# Settings shared with deploy/nico match deploy/nico/controller/overlay.yaml;
# see it for why each is set.
apiAuth:
  enabled: false
  permissive: false

# LaunchLayer only: no CAPNICo or NICo CRDs are installed.
supportedInfraProviders: launchLayer
capi:
  rbac:
    create: true
    nico: false
controllers:
  nico:
    enabled: false

tenantAccess:
  enabled: true

nvkeOIDCAuth:
  enabled: false
  issuerURL: "https://nke.site-controller.internal"
  caBundleSecret:
    namespace: spire-server
    name: oidc-provider-upstream-ca
    key: ca.crt

cni:
  installAfterInit: true

fullnameOverride: nvke-controller
namespaceOverride: nvke-controller
nameOverride: nvke-controller
serviceAccount:
  name: nvke-controller

nvkeSystemNamespace:
  create: false

image:
  repository: ghcr.io/dsx-ai-factory/nvke/nvke-controller
  tag: v0.3.0-rc.1
  pullPolicy: IfNotPresent

imagePullSecrets: []

metrics:
  networkPolicy:
    enabled: true
    additionalNamespaces:
      - nktp
serviceMonitor:
  enabled: true
  name: nvke-controller-metrics
tracing:
  enabled: true
  serviceName: nvke-controller
  endpoint: nktp-daemonset-collector.nktp.svc.cluster.local:4317
  insecure: true

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: nvke-controller
  postgresUser: postgres
  sslMode: disable

env:
  - name: NODE_AGENT_PORT
    value: "15005"

service:
  port: 8080
  nodePort: 30080

secrets:
  dgxcTenantCredSecretName: dgxc-tenant-credentials

nodeAgent:
  # LaunchLayer nodes attest only through DSX IMDS; operatorTenant is a site value.
  spireAttestationMethod: dsxImds

temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233
  cloudWorkflow:
    namespace: nvke-controller
    queue: nvke-controller-tasks

profiles:
  path: /profiles
  image:
    enabled: true

spiffe:
  enabled: true
  endpointSocket: unix:///spiffe-workload-api/spire-agent.sock
  spire:
    serverNamespace: spire-server
    className: spire-mgmt-spire
    tpmPubhashesConfigMapName: tpm-pubhashes
    serverPort: "30440"

identity:
  fieldManagerName: nvke-controller
  fieldManagerRebootMachineName: nvke-controller-reboot-machine
  fieldManagerMachineHealthIssueName: nvke-controller-machine-health-issue
  managedByLabelValue: nvke-controller
teleport:
  managedByLabelValue: nvke-controller
  tokenNamePrefix: nvke-controller-
