# NVKE management-plane components for AICR. Chart repository and version are
# release-derived: `deploy.sh` fills @REPOSITORY@ and @VERSION:<chart>@ from the
# NVKR Release into a copy of this tree. The component name is the Helm release name.
apiVersion: aicr.run/v1beta1
kind: ComponentRegistry
components:
  - name: postgres
    displayName: PostgreSQL
    class: core
    valueOverrideKeys: [postgres]
    helm:
      defaultRepository: "@REPOSITORY@"
      defaultChart: postgresql
      defaultVersion: "@VERSION:postgresql@"
      defaultNamespace: postgres
  - name: temporal
    displayName: Temporal
    class: core
    valueOverrideKeys: [temporal]
    helm:
      defaultRepository: "@REPOSITORY@"
      defaultChart: temporal
      defaultVersion: "@VERSION:temporal@"
      defaultNamespace: temporal
  - name: nke-controller
    displayName: NKE controller
    class: core
    valueOverrideKeys: [nkecontroller]
    helm:
      defaultRepository: "@REPOSITORY@"
      defaultChart: nvke-controller
      defaultVersion: "@VERSION:controller-chart@"
      defaultNamespace: nke-controller
  - name: nktp
    displayName: NKTP telemetry pipeline
    class: core
    valueOverrideKeys: [nktp]
    helm:
      defaultRepository: "@REPOSITORY@"
      defaultChart: nktp
      defaultVersion: "@VERSION:nktp@"
      defaultNamespace: nktp
  - name: spire-crds
    displayName: SPIRE CRDs
    class: core
    valueOverrideKeys: [spirecrds]
    helm:
      defaultRepository: "@REPOSITORY@"
      defaultChart: spire-crds
      defaultVersion: "@VERSION:spire-crds@"
      defaultNamespace: spire-server
  - name: spire
    displayName: SPIRE
    class: core
    valueOverrideKeys: [spire]
    helm:
      defaultRepository: "@REPOSITORY@"
      defaultChart: spire
      defaultVersion: "@VERSION:spire@"
      defaultNamespace: spire-server
  # Manifest-only: objects that carry no chart. The manifests name their own namespaces.
  - name: nvke-base-config
    displayName: NVKE base configuration
    class: core
    helm:
      defaultRepository: ""
      defaultNamespace: nke-controller
  - name: capnico
    displayName: CAPNICo
    class: core
    helm:
      defaultRepository: ""
      defaultNamespace: capnico-system
  - name: nvke-bootstrap-config
    displayName: NVKE bootstrap NodePorts
    class: core
    helm:
      defaultRepository: ""
      defaultNamespace: nke-controller
