# The same management plane as nvke-bootstrap, from charts CI can reach without Docker or NVKR: SPIRE and
# Temporal from their upstream repositories at the bootstrap manifest pins, Postgres and the controller packaged
# from this checkout. The values are the built-in bootstrap deploy's.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: nvke-bootstrap-ci
spec:
  base: base
  criteria:
    service: nvke-bootstrap-ci
  componentRefs:
    - {name: postgres, type: Helm, valuesFile: components/postgres/ci-values.yaml}
    - {name: spire-crds, type: Helm}
    - {name: temporal, type: Helm, valuesFile: components/temporal/ci-values.yaml, dependencyRefs: [postgres]}
    - {name: spire, type: Helm, valuesFile: components/spire/bootstrap-values.yaml, dependencyRefs: [spire-crds]}
    - {name: nvke-bootstrap-config, type: Helm, manifestFiles: [components/nvke-bootstrap-config/manifests/spire-server-external.yaml, components/nvke-bootstrap-config/manifests/nke-controller-external.yaml], dependencyRefs: [spire]}
    - {name: nke-controller, type: Helm, valuesFile: components/nke-controller/ci-values.yaml, dependencyRefs: [postgres, temporal, spire]}
