kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: nvke-kind
spec:
  base: base
  criteria:
    service: nvke-kind
  componentRefs:
    - {name: cert-manager, type: Helm, valuesFile: components/cert-manager/values.yaml}
    - {name: nvke-base-config, type: Helm, manifestFiles: [components/nvke-base-config/manifests/40-oidc-upstream-ca.yaml, components/nvke-base-config/manifests/41-oidc-upstream-ca-certificate.yaml, components/nvke-base-config/manifests/nktp-cluster.yaml, components/nvke-base-config/manifests/spire-oidc-provider-nodeport.yaml, components/nvke-base-config/manifests/spire-server-nodeport.yaml, components/nvke-base-config/manifests/spire-tpm-pubhashes.yaml], dependencyRefs: [cert-manager]}
    - {name: capnico, type: Helm, manifestFiles: [components/capnico/manifests/capnico.yaml], dependencyRefs: [cert-manager]}
    - {name: nktp, type: Helm, valuesFile: components/nktp/values.yaml, dependencyRefs: [nvke-base-config]}
    - {name: postgres, type: Helm, valuesFile: components/postgres/nvkr-values.yaml, dependencyRefs: [nktp]}
    - {name: spire-crds, type: Helm, dependencyRefs: [nktp]}
    - {name: temporal, type: Helm, valuesFile: components/temporal/nvkr-values.yaml, dependencyRefs: [postgres, spire-crds]}
    - {name: spire, type: Helm, valuesFile: components/spire/kind-values.yaml, dependencyRefs: [nvke-base-config, spire-crds]}
    - {name: nke-controller, type: Helm, valuesFile: components/nke-controller/nvkr-values.yaml, dependencyRefs: [postgres, temporal, spire]}
