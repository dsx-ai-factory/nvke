# Adapted from deploy/nico/postgresql/values.yaml for a kind cluster.
auth:
  username: postgres
  database: postgres
  existingSecret: nvke-database
primary:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    limits: {memory: 512Mi}
    requests: {memory: 256Mi}
  initdb:
    scripts:
      init-cwe.sql: |
        CREATE DATABASE "nke-controller";
      init-temporal.sql: |
        CREATE DATABASE temporal;
        CREATE DATABASE temporal_visibility;
