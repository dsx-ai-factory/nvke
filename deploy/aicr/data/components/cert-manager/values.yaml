# cert-manager replaces what `clusterctl init` installed first. The CRDs ship with the chart, and the
# ServiceMonitor stays off: this component installs before nktp, which owns the monitoring CRDs.
fullnameOverride: cert-manager
crds:
  enabled: true
prometheus:
  servicemonitor:
    enabled: false
