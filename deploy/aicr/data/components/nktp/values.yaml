          memory: 1Gi
  otelcol:
    config:
      exporters:
        otlp:
          sending_queue:
            queue_size: 67108864
      receivers:
        prometheus:
          config:
            global:
              body_size_limit: 64MiB
kube-state-metrics:
  kubernetes:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  deployments:
    workloads:
      enabled: false
    networking:
      enabled: false
    storage:
      enabled: false
    configuration:
      enabled: false
    cluster:
      enabled: false
    objects:
      enabled: true
      shards: 1
      track_unscheduled_pods: false
      kubernetes: {}
      resource_types:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - replicationcontrollers
      - jobs
      - cronjobs
      - horizontalpodautoscalers
      - poddisruptionbudgets
      - services
      - endpointslices
      - ingresses
      - networkpolicies
      - persistentvolumes
      - persistentvolumeclaims
      - volumeattachments
      - configmaps
      - nodes
      - namespaces
      - storageclasses
      - resourcequotas
      - limitranges
      - leases
      - certificatesigningrequests
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - validatingwebhookconfigurations
daemonset:
  kubernetes:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
    - name: GOMEMLIMIT
      value: 448MiB
    - name: GOGC
      value: '50'
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    targetAllocator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
  otelcol:
    config:
      exporters:
        otlp/metrics:
          sending_queue:
            queue_size: 8388608
      receivers:
        filelog/kube-api-audit:
          include:
          - /hostfs/var/log/kubernetes_audit/audit.log
