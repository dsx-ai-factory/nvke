# Derived from deploy/nico/nktp (comments stripped).
metrics-server:
  enabled: true
  # kind only: its kubelet serving certificates carry no IP SANs, so metrics-server never becomes ready.
  args:
  - --kubelet-insecure-tls
node-exporter:
  extraArgs:
  - --no-collector.cpufreq
opentelemetry-kube-stack:
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false
  opentelemetry-operator:
    extraObjects:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: '{{ include "opentelemetry-operator.fullname" . }}-deployment-finalizers'
        namespace: '{{ include "opentelemetry-operator.namespace" . }}'
      rules:
      - apiGroups:
        - apps
        resources:
        - deployments/finalizers
        resourceNames:
        - '{{ include "opentelemetry-operator.fullname" . }}'
        verbs:
        - update
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: '{{ include "opentelemetry-operator.fullname" . }}-deployment-finalizers'
        namespace: '{{ include "opentelemetry-operator.namespace" . }}'
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: '{{ include "opentelemetry-operator.fullname" . }}-deployment-finalizers'
      subjects:
      - kind: ServiceAccount
        name: '{{ include "opentelemetry-operator.serviceAccountName" . }}'
        namespace: '{{ include "opentelemetry-operator.namespace" . }}'
watchdog:
  kubernetes:
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    targetAllocator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
    env:
    - name: GOMEMLIMIT
      value: 448MiB
    - name: GOGC
      value: '50'
    - name: K8S_CLUSTER_NAME
      valueFrom:
        configMapKeyRef:
          name: nktp-cluster
          key: name
  sidecar:
    kubernetes:
      env:
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: GOMEMLIMIT
        value: 192MiB
      - name: K8S_CLUSTER_NAME
        valueFrom:
          configMapKeyRef:
            name: nktp-cluster
            key: name
gateway_logs:
  kubernetes:
    autoscaler:
      minReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 1Gi
    env:
    - name: GOMEMLIMIT
      value: 384MiB
    - name: GOGC
      value: '50'
    - name: K8S_CLUSTER_NAME
      valueFrom:
        configMapKeyRef:
          name: nktp-cluster
          key: name
  otelcol:
    config:
      exporters:
        otlp:
          sending_queue:
            queue_size: 128849018
