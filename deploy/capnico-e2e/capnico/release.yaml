# The infrastructure provider: it turns a NicoMachine into an instance, so CWE
# cannot provision a tenant without it.
#
# NOT INSTALLABLE BY COORDINATES, for the same reason spire is not. This lane
# builds CAPNICo from source at the ref controller/go.mod pins, with a locally
# built image, so the suite tests the provider the controller actually compiles
# against rather than whatever was last published. The version below records
# which ref that is; the installer materialises the chart and passes
# --chart-override capnico=<source>/chart.
#
# The released alternative is a chart on NGC
# (helm.ngc.nvidia.com/.../components-dev), which is what a real site installs
# and what capnico-forge will name instead.
chart:
  name: capnico
  version: "v0.0.45"
release:
  name: capnico
  namespace: capnico-system
values:
  - values.yaml
