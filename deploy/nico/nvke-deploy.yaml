# Deploy path for an NVKE management cluster on NICo-managed hardware.
#
# The order is not designed from first principles. It was derived from a
# provisioning run that stood a management cluster up on bare metal and had it
# provision a tenant cluster, whose install script is this file in script form.
# That order in turn follows the management-software phases:
#
#   untaint -> storage class -> cert-manager -> CAPI core -> CAPNICo
#            -> NKTP -> Postgres -> Temporal -> controller
#
# Outside this deploy path, and before it:
#   untaint        a bootstrap cluster is all control-plane. Nothing schedules
#                  while the NoSchedule taint is on the nodes, and clusterctl
#                  init times out on cert-manager with no hint why. nvkectl
#                  bootstrap site removes the taint; check before going on,
#                  and remove it by hand if the bootstrap reported it could not.
#   clusterctl init  brings cert-manager AND CAPI core AND the kubeadm
#                  providers. cert-manager first because CAPI's own manifests
#                  embed an Issuer and a Certificate.
#   image staging  the node IS the cluster, so images imported into its
#                  containerd resolve with imagePullPolicy: IfNotPresent. This
#                  is why a site needs no registry credential; CAPNICo's image
#                  is public on GHCR or comes from the release by digest.
#   a default StorageClass  a bare site ships none, so every PVC sits Pending.
#                  Deliberately not an item: which provisioner is right is a
#                  property of the hardware, not of NVKE. That run installed
#                  rancher local-path because its instance type has a single
#                  NVMe with root on it, which also means the documented
#                  prerequisite of a spare unpartitioned device cannot be met
#                  there. A site with real storage should use it instead.
#
# AFTER this deploy path, one more step: apply-capi-spiffe-exec-auth.sh, which
# gives the CAPI controllers a csi.spiffe.io volume and the SPIFFE JWT
# exec-auth plugin. After, not before -- the script only waits for the rollout
# once csi.spiffe.io is registered, and that CSIDriver arrives with the spire
# item. See README.md.
#
# DIFFERENT FROM capnico-e2e in four ways, each of which that run hit:
#   capnico        a manifest item, not a helm item installed from source:
#                  there is no provider checkout on a site, and the published
#                  chart is not reachable without credentials this path does
#                  not assume. The public release asset is.
#   persistence    the e2e lane runs Postgres on emptyDir because it is
#                  disposable. A site must not.
#   secrets        two carry real credentials, so one template item renders
#                  them from the site spec rather than committing them.
#
# The nktp item installs the monitoring CRDs, so it has
# to precede every item that creates a monitor: temporal, spire and controller
# each switch on their own in their overlays. The chart itself monitors the API
# server, etcd and CoreDNS. Components that ship no monitor of their own are
# not scraped; their monitors belong with them, not in this path.
#
# SPIRE IS IN, deliberately. That run used --disable-mtls end to end, but its
# own notes record that os-image/SPEC.md lists that as NOT a supported
# production mode, and the reference image ships mTLS on. The flag is a property
# of bootstrapping the management cluster's own node -- at that moment the only
# SPIRE server alive is the one in the throwaway kind cluster -- and nothing
# drives that node afterwards, so it does not constrain this path.
items:
  - {name: nvke-base-config, type: template}
  - {name: spire-tpm-pubhashes, type: manifest}
  - {name: spire-server-nodeport, type: manifest}
  - {name: spire-oidc-provider-nodeport, type: manifest}
  - {name: capnico, type: manifest}
  - {name: nktp, type: helm}
  - {name: postgresql, type: helm}
  - {name: spire-crds, type: helm}
  - {name: temporal, type: helm}
  - {name: spire, type: helm}
  - {name: controller, type: helm}
