# This e2e suite is its own Go module, so it carries its own golangci-lint
# config rather than being covered by the parent cloud-workflow-engine
# `make lint`. It mirrors the parent's conventions and additionally allows the
# Ginkgo/Gomega dot-imports that the spec mandates for the test files.

version: "2"

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/NVIDIA/nke/controller
    gofumpt:
      extra-rules: true

run:
  timeout: 5m
  allow-parallel-runners: true
  concurrency: 8
  go: ""
  modules-download-mode: readonly

output:
  print-issued-lines: false
  print-linter-name: true
  sort-results: true

linters:
  default: none
  disable:
    - nlreturn
    - testpackage
    - wrapcheck
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecksumtype
    - goconst
    - gocritic
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
    - zerologlint

  settings:
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        - github.com/NVIDIA/nke/controller/api
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/pkg/errors
              desc: "use stdlib instead"
    funlen:
      lines: 500
      statements: -1
      ignore-comments: true
    goconst:
      min-len: 2
    gocritic:
      enable-all: true
      disabled-checks:
        - rangeValCopy
        - hugeParam
        - exitAfterDefer
        - unnamedResult
        - paramTypeCombine
    godox:
      keywords:
        - TODO
    goheader:
      template: |-
        SPDX-FileCopyrightText: Copyright (c) {{MOD_YEAR-RANGE}} NVIDIA CORPORATION & AFFILIATES. All rights reserved.
        SPDX-License-Identifier: Apache-2.0
    goimports:
      local-prefixes:
        - github.com/NVIDIA/nke/controller
    govet:
      enable-all: true
      disable:
        - fieldalignment
    grouper:
      const-require-grouping: true
      import-require-grouping: true
      var-require-grouping: false
      var-require-single-var: true
    misspell:
      locale: US
    revive:
      ignore-generated-header: true
    varnamelen:
      min-name-length: 1
    exhaustruct:
      exclude:
        - '.*'

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Ginkgo/Gomega dot-imports are the mandated idiom for the suite files.
      - path: '(.+)_test\.go'
        linters:
          - revive
        text: 'dot-imports'
      - path: '(.+)_test\.go'
        linters:
          - gochecknoglobals
          - grouper
          - gosec
          - wrapcheck
          - wsl
          - goconst
          - forcetypeassert
          - gocyclo
          - maintidx
    paths:
      - third_party$
      - builtin$
      - examples$
