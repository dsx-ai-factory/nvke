# GB200 on self-managed Kubernetes, which AICR's embedded catalog has no leaf
# for: its GB200 Ubuntu leaves are all managed services (EKS, OKE). Selected
# with --service generic --accelerator gb200 --os ubuntu --intent training
# and --data pointing at this directory. The deployment checks come from the
# embedded gb200-any overlay, which matches on accelerator alone.
#
# Narrower than gb300-generic-ubuntu-training, which it is modelled on:
#   - No network-operator. The lane's tenant has one GPU worker and no RDMA
#     checks, so the fabric stack would be installed for nothing.
#   - No nodewright-customizations. Its tuning runs nvidia-tuned with
#     interrupt: reboot, and a tenant node reboot is not something this lane
#     has qualified; the GPU checks do not depend on the tuning.
# Without either, gpu-operator keeps base's dependencies: nfd, cert-manager
# and kube-prometheus-stack.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-generic-ubuntu-training

spec:
  base: base

  criteria:
    service: generic
    accelerator: gb200
    os: ubuntu
    intent: training

  mixins:
    - os-ubuntu

  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs: []
