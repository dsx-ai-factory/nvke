  # Section 5 on the site cluster, where every workload is Kubernetes' own or
  # NVKE's. Each reason names what the site scan's audits found.
  - id: "5.1.1"
    title: cluster-admin bindings (5.1)
    scope: &site
      clusters: [site]
    reason: >-
      The site's cluster-admin bindings are kubeadm's own kubeadm:cluster-admins,
      which the admin kubeconfig kubeadm writes on each control-plane node uses,
      and nvke:breakglass, the operator's break-glass kubeconfig
      (cli/internal/bootstrap/sitecluster/kubeconfig.go).
    approver: ""
    reviewBy: "2027-05-04"
  - id: "5.1.3"
    title: Wildcards in roles (5.1)
    scope: *site
    reason: >-
      Only roles Kubernetes creates use wildcards on the site: cluster-admin and
      the built-in system:controller and system:kube-controller-manager roles. NVKE
      adds none.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "5.1.5"
    title: Default service accounts (5.1)
    scope: *site
    reason: >-
      Kubernetes creates each namespace's default service account with token
      mounting unset, and NVKE leaves them as created.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "5.1.6"
    title: Service account token mounts (5.1)
    scope: *site
    reason: &site-system-pods >-
      The pods flagged are the control-plane static pods (etcd, the API server,
      the controller manager and the scheduler) and kube-vip, which kubeadm and
      NVKE run on the host network with no service account, and CoreDNS and
      OVN-Kubernetes, which read the API with their tokens and program the node's
      network.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "5.2.2"
    title: Privileged containers (5.2)
    scope: *site
    reason: >-
      The only privileged container is OVN-Kubernetes' ovnkube-controller in
      ovnkube-node, which programs the node's network.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "5.2.5"
    title: Host network pods (5.2)
    scope: *site
    reason: *site-system-pods
    approver: ""
    reviewBy: "2027-05-04"
  - id: "5.1.7"
    title: RBAC and service accounts (5.1)
    scope: *site
    reason: &site-manual >-
      kube-bench leaves this check to a person. On the site cluster every
      workload is Kubernetes' own or NVKE's; hardening NVKE's management-plane
      components against section 5 is a follow-up.
    approver: ""
    reviewBy: "2027-05-04"
