#
# The kube-bench findings the CI scan accepts, each with its reason. README.md
# says how to add, review and retire an entry. Reasons are in our own words;
# where NVKE meets a check by means kube-bench does not inspect, the reason
# points at the evidence. An entry with an empty approver is awaiting sign-off.
#
# scope.clusters takes site and tenant; scope.roles takes control-plane and
# worker. An omitted list means every value.
exceptions:
  - id: "1.1.9"
    title: CNI configuration file permissions
    reason: &cni-files >-
      kube-bench finds the CNI configuration through the kubelet's --cni-conf-dir
      flag, which current kubelets no longer have, so its audit finds no files to
      check.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "1.1.10"
    title: CNI configuration file ownership
    reason: *cni-files
    approver: ""
    reviewBy: "2027-05-04"
  - id: "1.1.12"
    title: etcd data directory ownership
    scope:
      roles: [control-plane]
    reason: >-
      Production nodes own /var/lib/etcd as etcd:etcd, created by the production
      node image (os-image/packer/scripts/provision.sh). The CI node images are
      built on kindest/node and leave the directory to kubeadm, which makes it
      root:root. etcd runs as root in its static pod either way, so the owner
      does not change what it can access.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "1.2.1"
    title: Anonymous requests to the API server
    scope:
      roles: [control-plane]
    reason: >-
      The API server's authentication configuration admits anonymous requests
      only to the health and version endpoints and to the public cluster-info
      ConfigMap kubeadm joins read (anonymousProbeAuthConfig in
      controller/internal/kubeadmconfig/oidc.go, #975). kube-bench reads only the
      --anonymous-auth flag, so it cannot see that configuration.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "1.2.9"
    title: Event rate limiting admission
    scope:
      roles: [control-plane]
    reason: >-
      EventRateLimit is not enabled. Client libraries already filter and
      aggregate repeated events, API Priority and Fairness bounds any one
      client's share of the API server, and events expire after an hour. The
      plugin's configuration API is still v1alpha1, and limits loose enough not
      to throttle customer workloads would rarely act.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "1.2.20"
    title: API server request timeout
    scope:
      roles: [control-plane]
    reason: >-
      NVKE keeps the API server's default request timeout of 60 seconds
      (controller/internal/kubeadmconfig renders no --request-timeout). Whether a
      timeout suits a cluster is a judgement kube-bench leaves to a person.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "1.2.11"
    title: Pulling every image on every start
    scope:
      roles: [control-plane]
    reason: >-
      Pulling every image on every container start defeats the images
      pre-loaded on nodes and air-gapped installs, and multiplies registry load
      for large GPU images.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "3.1.1"
    title: Client certificates for people
    scope:
      roles: [control-plane]
    reason: &user-auth >-
      Every cluster keeps a client-certificate administrator kubeconfig, which
      NVKE issues to the customer; people can also sign in through OIDC
      (docs/workload-clusters/oidc.md). Service account and bootstrap tokens
      authenticate components and kubeadm joins, not people.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "3.1.2"
    title: Service account tokens for people
    scope:
      roles: [control-plane]
    reason: *user-auth
    approver: ""
    reviewBy: "2027-05-04"
  - id: "3.1.3"
    title: Bootstrap tokens for people
    scope:
      roles: [control-plane]
    reason: *user-auth
    approver: ""
    reviewBy: "2027-05-04"
  - id: "3.2.2"
    title: Audit policy coverage
    scope:
      roles: [control-plane]
    reason: >-
      NVKE's audit policy is controller/internal/kubeadmconfig/audit_policy.yaml.
      kube-bench cannot judge what a policy covers, so it reports the check for a
      person to review.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "4.1.3"
    title: kube-proxy kubeconfig file permissions
    reason: &no-kube-proxy >-
      There is no kube-proxy to check. OVN-Kubernetes replaces it, and NVKE skips
      kubeadm's kube-proxy addon on OVN-Kubernetes clusters (SkipKubeProxy in
      controller/internal/temporal/activities/kubeadm_init.go). 4.3.1's audit
      command fails when no kube-proxy process exists.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "4.1.4"
    title: kube-proxy kubeconfig file ownership
    reason: *no-kube-proxy
    approver: ""
    reviewBy: "2027-05-04"
  - id: "4.3.1"
    title: kube-proxy metrics address
    reason: *no-kube-proxy
    approver: ""
    reviewBy: "2027-05-04"
  - id: "4.2.9"
    title: Kubelet serving certificate
    reason: >-
      Kubelets get their serving certificates through serverTLSBootstrap and
      approved certificate signing requests (controller/internal/kubeadmconfig/render.go),
      not the certificate and key file flags the check reads.
    approver: ""
    reviewBy: "2027-05-04"
  - id: "4.2.7"
    title: Kubelet hostname override
    scope:
      clusters: [site]
    reason: >-
      NVKE registers each site node under its own node name (node.Name in the
      kubeadm init and join configurations, controller/internal/temporal/activities/kubeadm_init.go
      and kubeadm_join.go), and kubeadm passes --hostname-override to the kubelet
      when that name differs from the host's hostname. The kubelet's serving
      certificate is issued for the registered name through serverTLSBootstrap
      (controller/internal/kubeadmconfig/render.go).
    approver: ""
    reviewBy: "2027-05-04"
  - id: "4.2.12"
    title: Kubelet TLS cipher suites
    reason: >-
      kubeletTLSCipherSuites in controller/internal/kubeadmconfig/render.go
      restricts the kubelet's serving endpoint to AEAD cipher suites with forward
      secrecy, and names the ChaCha20 suites by their IANA names, ending in
      _SHA256. The cis-2.0 check's allowlist spells those two suites only
      without the suffix, so it reports a warning for suites it means to allow.
      kube-bench's own API server check (1.2.29) accepts both spellings, which is
      why the API server's identical list passes.
    approver: ""
    reviewBy: "2027-05-04"

  # Section 5: policy for the workloads a tenant cluster runs.
  - id: "5.1.1"
    title: RBAC and service accounts (5.1)
    scope: &tenant
      clusters: [tenant]
    reason: &workload-policy >-
      This is policy for the workloads a cluster runs. A tenant cluster belongs to
      the customer, and what runs in it, under which policy, is theirs to decide.
      NVKE's own components in it are hardened in a follow-up.
    approver: ""
    reviewBy: "2027-05-04"
