# Real DSX infrastructure the nico backend runs against, selected with
# `-e2e.environment dsx`.
#
# No identifiers. Every ${...} below is read from the process environment at
# load time; CI supplies them from repository variables, the same route the
# Teleport proxy and the jump host already take. What stays here is the part
# that is engineering rather than account: which datahalls exist, which
# machines they offer, and what those machines provide.
#
# Credentials are not here. A datahall's SSA client comes from
# DSX_<DATAHALL>_SSA_CLIENT_ID and _SECRET, whose names are derived from the
# key the site is filed under --- so a credential scoped to one datahall cannot
# be picked up by a run against another, and none of it belongs in a file.
#
# This file changes when the hardware does. A run needing a different Kubernetes
# or a different OS image touches nothing here: neither is an infrastructure
# input.

provider: dsx

# Opaque to the loader. Every key below is DSX's vocabulary, decoded by the dsx
# provider alone, so a second provider describes its infrastructure in its own
# terms without a shared schema to satisfy.
infrastructure:
  org:
    # A name, not a number. Forge orgs are numeric ids; this is the literal
    # string every request carries in its path.
    id: "${DSX_ORG_ID:-ncx}"

  sites:
    # THE KEY IS THE DATAHALL, and it is also the API host: a request goes to
    # carbide-rest-api-<key>.dev.dsx.nvidia.com, so there is no GET /site
    # lookup the way Forge needs one.
    #
    # Every identifier below belongs to this datahall and only this one.
    # az51-dev2-dh2 and az51-dev3-dh1 hold completely disjoint UUIDs for the
    # same kinds of object, and nothing in an API response says which one an id
    # came from. The az51 run log is itself named for dh1 while recording a dh2
    # run, which is how close that mistake sits.
    az51-dev2-dh2:
      id: "${DSX_AZ51_DEV2_DH2_SITE_ID:-}"
      tenantID: "${DSX_AZ51_DEV2_DH2_TENANT_ID:-}"
      vpcID: "${DSX_AZ51_DEV2_DH2_VPC_ID:-}"

      # A prefix, never a subnet: this fabric is FNN, which exposes prefixes
      # only. Each instance takes a /31 and lands on the odd address, so the
      # /29 behind this id holds four nodes --- and leaves no spare address for
      # a control-plane VIP, which is why a site controller here takes none.
      vpcPrefixID: "${DSX_AZ51_DEV2_DH2_VPC_PREFIX_ID:-}"

      # Governs Serial-over-LAN console access, not the OS account's
      # authorized_keys, so this grants no shell on a node. One group per
      # datahall, created when the datahall was stood up and associated with
      # the site afterwards --- an unassociated group is rejected at create.
      sshKeyGroupID: "${DSX_AZ51_DEV2_DH2_SSH_KEY_GROUP_ID:-}"

      # The account the image bakes, which is the login every session uses.
      # Empty, so it falls through to the os-image default the same way Forge
      # does -- the lane boots the OSS os-image release for both providers, and
      # os-image/packer/nke-node-non-fde.pkr.hcl bakes `ubuntu`.
      #
      # This defaulted to dgxc-admin, which is what the manual az51 procedure
      # uses because that boots an internal-pipeline image. The lane does not:
      # it resolves its image from the release registry. The mismatch writes
      # authorized_keys for an account that does not exist on the booted image,
      # and the run spends its whole ReachTimeout being refused on publickey
      # with nothing saying why -- the dial is what failed, so there is no
      # session to collect cloud-init diagnostics over.
      #
      # Set the variable only for a datahall that genuinely bakes something
      # else, and only alongside the image that bakes it.
      nodeUser: "${DSX_AZ51_DEV2_DH2_NODE_USER:-}"

      # How the lane reaches the machines it provisions: they sit behind this
      # jump host and are not Teleport-enrolled themselves. Named outright
      # rather than derived from the key --- the naming happens to be regular
      # today and that is not a property worth depending on.
      jumpHost: "${DSX_AZ51_DEV2_DH2_JUMP_HOST:-}"
      teleportLogin: "${DSX_AZ51_DEV2_DH2_TELEPORT_LOGIN:-}"

      # No machines declared, so the create carries an instanceTypeId and the
      # datahall picks a host that is free and healthy -- the same way Forge
      # does, and what a lane needs.
      #
      # Pinning one is still supported, and is what a hand bring-up wants:
      # declare `machines:` with a name, an id and `provides: {arch: ...}` and
      # it wins over the type below. It needs the tenant's
      # targetedInstanceCreation capability, which an instance type does not.
      #
      # It was pinned, to DSX_AZ51_DEV2_DH2_CP_MACHINE_ID, because that is what
      # the manual az51 procedure does. In a lane it is a liability: on
      # 2026-10-12 one pinned machine sat held by a teardown that would not
      # finish, and every run failed on `409 ... is assigned to an Instance`
      # while six other machines in the datahall were free and idle.

      # Where BOTH halves of a run are placed: the site controller, created by
      # the suite with no machine pinned above, and the tenant nodes, which the
      # site controller's own CWE places --- a node pool names an instance type
      # and has no machine field, so it has no other option.
      #
      # An instance type here is not abstract sizing --- it is a named
      # allowlist of specific machines, bound one at a time. A datahall can
      # ship none at all, so an id here states that someone has already created
      # the type and bound hosts to it.
      #
      # It held two on 2026-10-12: J701L6EG and J701L43T. That is enough for a
      # provision run, which takes one. A full run needs three at once --- a
      # site controller, a tenant control plane and a tenant worker --- so more
      # have to be bound to this type before one can pass, however many free
      # machines the datahall shows.
      instanceTypes:
        - name: az51-dev2-dh2-nke-tenant
          id: "${DSX_AZ51_DEV2_DH2_INSTANCE_TYPE_ID:-}"
          provides: {machineType: cpu, arch: amd64}
