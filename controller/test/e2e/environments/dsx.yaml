# Real DSX infrastructure the nico backend runs against, selected with
# `-e2e.environment dsx`.
#
# No identifiers. Every ${...} below is read from the process environment at
# load time; CI supplies them from repository variables, the same route the
# Teleport proxy and the jump host already take. What stays here is the part
# that is engineering rather than account: which datahalls exist, which
# machines they offer, and what those machines provide.
#
# Credentials are not here. A datahall's SSA client comes from
# DSX_<DATAHALL>_SSA_CLIENT_ID and _SECRET, whose names are derived from the
# key the site is filed under --- so a credential scoped to one datahall cannot
# be picked up by a run against another, and none of it belongs in a file.
#
# This file changes when the hardware does. A run needing a different Kubernetes
# or a different OS image touches nothing here: neither is an infrastructure
# input.

provider: dsx

# Opaque to the loader. Every key below is DSX's vocabulary, decoded by the dsx
# provider alone, so a second provider describes its infrastructure in its own
# terms without a shared schema to satisfy.
infrastructure:
  org:
    # A name, not a number. Forge orgs are numeric ids; this is the literal
    # string every request carries in its path.
    id: "${DSX_ORG_ID:-ncx}"

  sites:
    # THE KEY IS THE DATAHALL, and it is also the API host: a request goes to
    # carbide-rest-api-<key>.dev.dsx.nvidia.com, so there is no GET /site
    # lookup the way Forge needs one.
    #
    # Every identifier below belongs to one datahall and only that one. Two
    # datahalls at one site hold completely disjoint UUIDs for the same kinds of
    # object, and nothing in an API response says which one an id came from --
    # the az51 run log is itself named for dh1 while recording a dh2 run, which
    # is how close that mistake sits. A second datahall is a second key here,
    # and the resolver picks between them on capabilities.
    #
    # Every machine redstone-dev1-dh2 owns is aarch64 --- the VR NVL72 trays
    # and both CPU boxes alike --- which is why the stream it answers is arm64.
    # A datahall offering amd64 would be a second key beside this one, with its
    # own disjoint UUIDs and its own API host; nothing here is shared.
    redstone-dev1-dh2:
      id: "${DSX_REDSTONE_DEV1_DH2_SITE_ID:-}"
      tenantID: "${DSX_REDSTONE_DEV1_DH2_TENANT_ID:-}"
      vpcID: "${DSX_REDSTONE_DEV1_DH2_VPC_ID:-}"

      # FNN here too, so a prefix. The one filed under this key is a /29 ---
      # four nodes at a /31 each, which is a site controller plus a tenant
      # control plane and worker with one to spare, and no address left over
      # for a control-plane VIP.
      vpcPrefixID: "${DSX_REDSTONE_DEV1_DH2_VPC_PREFIX_ID:-}"

      # SOL console only, as at az51-dev2-dh2. The group this datahall uses
      # was created with the datahall and is already associated with the site.
      sshKeyGroupID: "${DSX_REDSTONE_DEV1_DH2_SSH_KEY_GROUP_ID:-}"

      # Empty, falling through to the os-image default, for the same reason it
      # is empty above: the lane boots the OSS release, which bakes `ubuntu`.
      # The hand procedure for this datahall uses dgxc-admin because it boots
      # an internal-pipeline image --- do not copy that here.
      nodeUser: "${DSX_REDSTONE_DEV1_DH2_NODE_USER:-}"

      # rel-eng-redstone-jump-host, enrolled 2026-10-13. The nodes this lane
      # creates are not Teleport-enrolled and sit behind it.
      jumpHost: "${DSX_REDSTONE_DEV1_DH2_JUMP_HOST:-}"
      teleportLogin: "${DSX_REDSTONE_DEV1_DH2_TELEPORT_LOGIN:-}"

      # No machines declared, deliberately, for the reason recorded above: a
      # pinned machine is what a hand bring-up wants and what wedges a lane.
      #
      # THE ID BELOW DOES NOT EXIST YET. As of 2026-10-13 this datahall has
      # exactly one instance type, and it binds three VR NVL72 trays; both CPU
      # machines --- a Super Server and an ARS-221GL-FNB-NC24B, each Ready and
      # unbound --- belong to no type at all. An instance type is a named
      # allowlist someone creates and binds hosts to, so until that is done for
      # the CPU machines this variable has nothing to hold and the site stays
      # skipped. Binding the trays instead would place a site controller on a
      # GPU tray, which is what the GB200 streams are for.
      instanceTypes:
        - name: redstone-dev1-dh2-nvke-tenant
          id: "${DSX_REDSTONE_DEV1_DH2_INSTANCE_TYPE_ID:-}"
          provides: {machineType: cpu, arch: arm64}
