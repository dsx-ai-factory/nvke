# Real Forge infrastructure the nico-forge backend runs against, selected with
# `-e2e.environment forge`. Identifiers only: the Forge API key and the Teleport
# join are workflow secrets and are deliberately absent here.
#
# This is az61 (Frankfurt), in the Forge-Tenant-RelEng org. It is the site two
# recorded provisioning exercises actually used: one on 2026-09-14/15 that
# brought up a site controller and the tenant cluster tenant-1, and one on
# 2026-09-19/20 that installed the management plane from deploy/capnico-forge
# and brought up tenant-2 and tenant-3. All three tenants reached CoreDNS
# Ready, which is the signal that matters — CoreDNS cannot schedule until the
# CNI is working on a node NKE provisioned itself.
#
# An earlier version of this file carried a different site, taken from
# controller/hack/create-forge-nico-cluster.sh. That script's defaults arrived
# with the original cloud-workflow-engine import (7ce92b69) and have never
# changed; nothing records a cluster ever being created there. The site is real
# — its instance-type list was read once — but it is not ours and it is not
# proven, so it is gone.
#
# One value this schema has nowhere to put yet, recorded so it is not lost: the
# org's human-facing name is Forge-Tenant-RelEng. SADD 3.5.2 declares a field
# for it; it lands when something reads it, rather than being silently dropped
# by a decoder that ignores unknown keys.
#
# This file changes when the hardware does. A run needing a different Kubernetes
# or a different OS image touches nothing here: neither is an infrastructure
# input.

provider: forge

# Opaque to the loader. Every key below is Forge's vocabulary, decoded by the
# forge provider alone, so a second provider describes its infrastructure in its
# own terms without a shared schema to satisfy.
infrastructure:
  org:
    id: "0996499333036436"

  sites:
    az61:
      id: 7aecd73d-ac9a-4148-a7ad-f3d031a79665
      vpcID: e1c4cb64-7d77-4532-89bc-6f7c32ece209

      # az61 is ETHERNET_VIRTUALIZER, so an interface attaches by subnet. The
      # other RelEng site, ytl, is FNN and attaches by VPC prefix instead —
      # which is why this schema will need a prefix alternative before ytl can
      # be declared. Note also that both sites have a VPC named rel-eng-tests
      # and they are different VPCs: names are unique per site, not per org.
      subnetID: 9354ab14-b7f3-412c-9070-2d16f7a60c83

      # Attached to the nodes Forge creates. A key group governs
      # Serial-over-LAN console access, not authorized_keys, so this grants no
      # shell on a node.
      sshKeyGroupID: b4a78ea3-9bc9-4702-889f-7a66472420c0
      # Only the two types below have actually carried a tenant here: the CPU
      # one ran tenant-2 and the GPU one ran tenant-3, both to CoreDNS Ready.
      # az61 offers more, but a Forge instance-type list caps at twenty rows
      # and ignores every filter, so enumerating the rest means reading them by
      # id. Declared cheapest first: where several types satisfy a request the
      # first listed wins.
      #
      # `provides` is matched against the capabilities a run asks for, so
      # requesting {machineType: cpu} cannot be answered by a GPU machine. Both
      # types here are amd64, which is why the site boots an x86_64 image.
      #
      # Note for qualification: az61 offers no GB200, so a stream asking for
      # {gpu: gb200} has nothing here to run on and will fail rather than fall
      # back to an L40. ytl is where the GB200 capacity is — its instance-type
      # list is dominated by gpu.gb200.* — so a GB200 stream needs ytl
      # declared, and that needs the VPC-prefix support noted above.
      #
      # cpu.himem.t1 has a single 894 GB NVMe with root on it and no spare
      # unpartitioned device, so the documented local-storage prerequisite is
      # unmet. It does not block bootstrap: both exercises built their site
      # controller on this type. It means a storage provisioner goes on before
      # anything asks for a volume.
      instanceTypes:
        - name: cpu.himem.t1
          id: 9040815f-c04d-4254-bc6f-02180780eb4d
          provides: {machineType: cpu, arch: amd64}
        - name: gpu.l40sx8
          id: a3d6f067-270f-43e5-91cb-f0bf910b20ec
          provides: {machineType: gpu, arch: amd64, gpu: l40}
