# Layered over Mokka's NVSentinel guide values (nvsentinelGuideValues in
# nvsentinel_test.go): MongoDB keeps its data in an emptyDir, so the cluster
# needs no StorageClass.
mongodb-store:
  psmdb-db:
    replsets:
      rs0:
        volumeSpec:
          emptyDir: {}
          pvc: null
