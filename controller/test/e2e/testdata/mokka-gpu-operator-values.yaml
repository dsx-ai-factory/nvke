#
# GPU Operator values for nodes whose driver is Mokka's nvml-mock, from Mokka's
# GPU Operator guide (https://nvidia.github.io/k8s-test-infra/guides/gpu-operator/),
# with dcgm-exporter off since nothing reads it. Mokka is the driver and runtime,
# so the driver and toolkit are off and CDI carries the devices. The CUDA validator
# launches no kernel: Mokka does not simulate CUDA.
driver:
  enabled: false
toolkit:
  enabled: false
dcgm:
  enabled: false
mig:
  strategy: none
migManager:
  enabled: false
nodeStatusExporter:
  enabled: false

cdi:
  enabled: true
  default: true

devicePlugin:
  enabled: true
  config:
    name: ""

gfd:
  enabled: true
  env:
    - name: GFD_MACHINE_TYPE_FILE
      value: "/etc/nvml-mock/machine-type"

dcgmExporter:
  enabled: false

validator:
  driver:
    env:
      - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
        value: "true"
  toolkit:
    env:
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
