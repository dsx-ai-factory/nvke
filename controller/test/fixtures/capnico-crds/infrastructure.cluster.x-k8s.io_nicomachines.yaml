---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nicomachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: NicoMachine
    listKind: NicoMachineList
    plural: nicomachines
    shortNames:
    - nicom
    singular: nicomachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current machine infrastructure availability
      jsonPath: .status.conditions[?(@.type=='Available')].status
      name: Available
      type: string
    - description: Machine infrastructure reconciled
      jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: Synced
      type: string
    - description: Initial machine infrastructure provisioning completed
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: NICo instance
      jsonPath: .status.instanceID
      name: Instance
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NicoMachine is the Schema for the nicomachines API. Once ProviderID is
          assigned, the spec is immutable because the controller does not reconcile
          these create-time settings onto an existing instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NicoMachineSpec defines the desired state of NicoMachine.
            properties:
              allowUnhealthyMachine:
                description: AllowUnhealthyMachine allows targeted instance creation
                  on a machine in Error status.
                type: boolean
              cloudInitInjectHostname:
                description: CloudInitInjectHostname prepends hostname directives
                  to the bootstrap cloud-config.
                type: boolean
              infinibandInterfaces:
                description: |-
                  InfinibandInterfaces requests that one or more InfiniBand Partitions be attached
                  to the instance.
                items:
                  description: NicoMachineInfiniBandInterface defines one NICo InfiniBand
                    interface attachment request.
                  properties:
                    device:
                      description: Device is the name of the InfiniBand device to
                        use.
                      type: string
                    deviceInstance:
                      description: DeviceInstance is the index of the device, used
                        to identify which interface card to attach the Partition to.
                      format: int32
                      type: integer
                    isPhysical:
                      description: IsPhysical specifies whether this Partition should
                        be attached to the Instance over physical interface.
                      type: boolean
                    partitionID:
                      description: PartitionID is the ID of the Partition the Interface
                        should attach to.
                      minLength: 1
                      type: string
                    vendor:
                      description: Vendor is the name of the InfiniBand device vendor,
                        optional.
                      type: string
                    virtualFunctionID:
                      description: VirtualFunctionID must be specified if isPhysical
                        is false.
                      format: int32
                      type: integer
                  required:
                  - partitionID
                  type: object
                type: array
              infinibandPartitionID:
                description: |-
                  InfinibandPartitionID requests that the partition be attached to every active
                  InfiniBand device exposed by InstanceTypeID.
                  Set this instead of InfinibandInterfaces when every device should use the same partition.
                minLength: 1
                type: string
              instanceTypeID:
                description: |-
                  InstanceTypeID is the instance type ID to provision.
                  Exactly one of InstanceTypeID or MachineID must be set.
                minLength: 1
                type: string
              interfaces:
                description: |-
                  Interfaces are the interface attachment requests for the instance.
                  Use subnet-based attachments for Ethernet network virtualization and VPC prefix-based attachments for next-generation networking.
                items:
                  description: NicoMachineInterface defines one NICo interface attachment
                    request.
                  properties:
                    device:
                      description: Device is the device name to use for this attachment.
                      type: string
                    deviceInstance:
                      description: DeviceInstance is the device instance index to
                        use for this attachment.
                      format: int32
                      type: integer
                    ipAddress:
                      description: |-
                        IPAddress is the explicitly requested IP address for this interface.
                        This is only supported for VPCPrefixID-based interfaces. NICo requires the least-significant host bit to be 1.
                      type: string
                    physical:
                      description: Physical requests this attachment over a physical
                        interface.
                      type: boolean
                    subnetID:
                      description: |-
                        SubnetID is the subnet ID for this attachment.
                        Use SubnetID for Ethernet network virtualization.
                        Exactly one of SubnetID or VPCPrefixID must be set.
                      minLength: 1
                      type: string
                    vpcPrefixID:
                      description: |-
                        VPCPrefixID is the VPC prefix ID for this attachment.
                        Use VPCPrefixID for next-generation networking.
                        Exactly one of SubnetID or VPCPrefixID must be set.
                      minLength: 1
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of subnetID or vpcPrefixID must be set
                    rule: has(self.subnetID) != has(self.vpcPrefixID)
                  - message: ipAddress is only supported with vpcPrefixID interfaces
                    rule: '!(has(self.ipAddress) && has(self.subnetID))'
                minItems: 1
                type: array
              ipxeScript:
                description: IpxeScript is the iPXE script used to boot this instance.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels are applied to the instance.
                type: object
              machineID:
                description: |-
                  MachineID is the machine ID for targeted instance creation.
                  Exactly one of InstanceTypeID or MachineID must be set.
                minLength: 1
                type: string
              nvLinkInterfaces:
                description: |-
                  NVLinkInterfaces requests that one or more NVLink Logical Partitions be attached
                  to the instance.
                items:
                  description: NicoMachineNVLinkInterface defines one NICo NVLink
                    interface attachment request.
                  properties:
                    deviceInstance:
                      description: DeviceInstance is the GPU index for this NVLink
                        interface. Must be non-negative, unique within the request,
                        and within the GPU count exposed by the selected Machine or
                        Instance Type.
                      format: int32
                      type: integer
                    nvLinkLogicalPartitionID:
                      description: NVLinkLogicalPartitionID is the ID of the NVLink
                        Logical Partition the Interface should attach to.
                      minLength: 1
                      type: string
                  required:
                  - nvLinkLogicalPartitionID
                  type: object
                type: array
              nvLinkLogicalPartitionID:
                description: |-
                  NVLinkLogicalPartitionID requests that the logical partition be attached to
                  every active NVLink device exposed by InstanceTypeID.
                  Set this instead of NVLinkInterfaces when every device should use the same logical partition.
                minLength: 1
                type: string
              providerID:
                description: ProviderID is set to `nico://<instance-id>` after the
                  NICo instance is created.
                maxLength: 512
                minLength: 1
                type: string
              sshKeyGroupIDs:
                description: SSHKeyGroupIDs are the allowed SSH key group IDs for
                  Serial over LAN access.
                items:
                  type: string
                type: array
              vpcID:
                description: VPCID is the VPC where this provider should create the
                  instance.
                minLength: 1
                type: string
            required:
            - interfaces
            - vpcID
            type: object
            x-kubernetes-validations:
            - message: exactly one of instanceTypeID or machineID must be set
              rule: has(self.instanceTypeID) != has(self.machineID)
            - message: infinibandPartitionID and infinibandInterfaces are mutually
                exclusive
              rule: '!(has(self.infinibandPartitionID) && has(self.infinibandInterfaces))'
            - message: infinibandPartitionID requires instanceTypeID
              rule: '!has(self.infinibandPartitionID) || has(self.instanceTypeID)'
            - message: nvLinkLogicalPartitionID and nvLinkInterfaces are mutually
                exclusive
              rule: '!(has(self.nvLinkLogicalPartitionID) && has(self.nvLinkInterfaces))'
            - message: nvLinkLogicalPartitionID requires instanceTypeID
              rule: '!has(self.nvLinkLogicalPartitionID) || has(self.instanceTypeID)'
          status:
            description: NicoMachineStatus defines the observed state of NicoMachine.
            properties:
              addresses:
                description: Addresses contains addresses observed on the backing
                  instance.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions describes the current machine state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: Initialization provides provisioning observations for
                  the backing instance.
                minProperties: 1
                properties:
                  provisioned:
                    description: Provisioned is true once the backing instance has
                      been created.
                    type: boolean
                type: object
              instanceID:
                description: InstanceID is the instance identifier backing this machine.
                type: string
              machineID:
                description: MachineID is the machine ID for this machine.
                type: string
              ready:
                description: Ready is true once the backing instance reaches Ready.
                type: boolean
              siteID:
                description: SiteID is the observed Forge/Carbide site ID for this
                  machine.
                type: string
              siteName:
                description: SiteName is the observed Forge/Carbide site name for
                  this machine.
                type: string
              tpmEkPubHash:
                description: TpmEkPubHash is the TPM EK public hash for this machine.
                type: string
              vpcID:
                description: VPCID is the observed Forge/Carbide VPC ID for this machine.
                type: string
              vpcName:
                description: VPCName is the observed Forge/Carbide VPC name for this
                  machine.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: spec.vpcID is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || self.spec.vpcID == oldSelf.spec.vpcID'
        - message: spec.instanceTypeID is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.instanceTypeID) ==
            has(oldSelf.spec.instanceTypeID) && (!has(self.spec.instanceTypeID) ||
            self.spec.instanceTypeID == oldSelf.spec.instanceTypeID))'
        - message: spec.interfaces is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || self.spec.interfaces == oldSelf.spec.interfaces'
        - message: spec.infinibandInterfaces is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.infinibandInterfaces)
            == has(oldSelf.spec.infinibandInterfaces) && (!has(self.spec.infinibandInterfaces)
            || self.spec.infinibandInterfaces == oldSelf.spec.infinibandInterfaces))'
        - message: spec.infinibandPartitionID is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.infinibandPartitionID)
            == has(oldSelf.spec.infinibandPartitionID) && (!has(self.spec.infinibandPartitionID)
            || self.spec.infinibandPartitionID == oldSelf.spec.infinibandPartitionID))'
        - message: spec.nvLinkInterfaces is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.nvLinkInterfaces)
            == has(oldSelf.spec.nvLinkInterfaces) && (!has(self.spec.nvLinkInterfaces)
            || self.spec.nvLinkInterfaces == oldSelf.spec.nvLinkInterfaces))'
        - message: spec.nvLinkLogicalPartitionID is immutable after providerID is
            set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.nvLinkLogicalPartitionID)
            == has(oldSelf.spec.nvLinkLogicalPartitionID) && (!has(self.spec.nvLinkLogicalPartitionID)
            || self.spec.nvLinkLogicalPartitionID == oldSelf.spec.nvLinkLogicalPartitionID))'
        - message: spec.sshKeyGroupIDs is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.sshKeyGroupIDs) ==
            has(oldSelf.spec.sshKeyGroupIDs) && (!has(self.spec.sshKeyGroupIDs) ||
            self.spec.sshKeyGroupIDs == oldSelf.spec.sshKeyGroupIDs))'
        - message: spec.ipxeScript is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.ipxeScript) == has(oldSelf.spec.ipxeScript)
            && (!has(self.spec.ipxeScript) || self.spec.ipxeScript == oldSelf.spec.ipxeScript))'
        - message: spec.cloudInitInjectHostname is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.cloudInitInjectHostname)
            == has(oldSelf.spec.cloudInitInjectHostname) && (!has(self.spec.cloudInitInjectHostname)
            || self.spec.cloudInitInjectHostname == oldSelf.spec.cloudInitInjectHostname))'
        - message: spec.labels is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.labels) == has(oldSelf.spec.labels)
            && (!has(self.spec.labels) || self.spec.labels == oldSelf.spec.labels))'
        - message: spec.machineID is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.machineID) == has(oldSelf.spec.machineID)
            && (!has(self.spec.machineID) || self.spec.machineID == oldSelf.spec.machineID))'
        - message: spec.allowUnhealthyMachine is immutable after providerID is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.allowUnhealthyMachine)
            == has(oldSelf.spec.allowUnhealthyMachine) && (!has(self.spec.allowUnhealthyMachine)
            || self.spec.allowUnhealthyMachine == oldSelf.spec.allowUnhealthyMachine))'
        - message: spec.providerID is immutable after it is set
          rule: '!has(oldSelf.spec.providerID) || (has(self.spec.providerID) && self.spec.providerID
            == oldSelf.spec.providerID)'
    served: true
    storage: true
    subresources:
      status: {}
