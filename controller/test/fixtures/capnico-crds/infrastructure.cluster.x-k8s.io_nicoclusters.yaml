---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nicoclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: NicoCluster
    listKind: NicoClusterList
    plural: nicoclusters
    shortNames:
    - nicoc
    singular: nicocluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current cluster infrastructure availability
      jsonPath: .status.conditions[?(@.type=='Available')].status
      name: Available
      type: string
    - description: Cluster infrastructure reconciled
      jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: Synced
      type: string
    - description: Initial cluster infrastructure provisioning completed
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: NICo site
      jsonPath: .spec.siteID
      name: Site
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NicoCluster is the Schema for the nicoclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NicoClusterSpec defines the desired state of NicoCluster.
            properties:
              failureDomainLabelKey:
                description: |-
                  FailureDomainLabelKey is the NICo Machine label key that carries the failure
                  domain name. It is read to publish status.failureDomains and sent as the
                  machine label selector key when placing an instance. Leaving it unset
                  disables failure domain support for this cluster: no domains are published,
                  and a Machine that requests one fails rather than being placed anywhere.
                  Sites that follow the NICo convention set it to "failure_domain".
                maxLength: 255
                minLength: 1
                type: string
              identityRef:
                description: |-
                  IdentityRef points to the Secret with NICo endpoint and authentication settings.
                  When unset, the controller falls back to the provider-level credentials Secret
                  in the manager namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              siteID:
                description: SiteID is the site where this provider should create
                  and look up instances.
                type: string
            required:
            - siteID
            type: object
          status:
            description: NicoClusterStatus defines the observed state of NicoCluster.
            properties:
              conditions:
                description: Conditions describes the current cluster state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomains:
                description: FailureDomains are the placement domains NICo exposes
                  for this cluster's site.
                items:
                  description: |-
                    FailureDomain is the Schema for Cluster API failure domains.
                    It allows controllers to understand how many failure domains a cluster can optionally span across.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: attributes is a free form map of attributes an
                        infrastructure provider might use or require.
                      type: object
                    controlPlane:
                      description: controlPlane determines if this failure domain
                        is suitable for use by control plane machines.
                      type: boolean
                    name:
                      description: name is the name of the failure domain.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              initialization:
                description: Initialization provides provisioning observations for
                  this NICo-backed cluster.
                minProperties: 1
                properties:
                  provisioned:
                    description: Provisioned is true once the provider has validated
                      NICo access for this cluster.
                    type: boolean
                type: object
              ready:
                description: Ready is true once the provider can reach NICo and resolve
                  tenant context for this cluster.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
