apiVersion: internal.nke.nvidia.com/v1
kind: ClusterRelease
metadata:
  name: nvke-local-dev-kindest-arm64
  annotations:
    internal.nke.nvidia.com/machine-init-kubernetes-version: "1.34.2"
    internal.nke.nvidia.com/machine-init-kubernetes-version-injected: "false"
spec:
  machineImageRef:
    name: nvke-local-dev-kindest-arm64
  machineInit:
    userDataTemplate: |
      #cloud-config
      write_files:
        - path: /etc/sysctl.d/60-custom.conf
          owner: root:root
          permissions: '0755'
          content: |
            net.ipv6.conf.all.disable_ipv6 = 1
            net.ipv6.conf.default.disable_ipv6 = 1
            net.ipv6.conf.lo.disable_ipv6 = 1
        - path: /etc/spire-agent/agent.conf
          owner: root:root
          permissions: '0644'
          content: |
            agent {
                data_dir = "/var/lib/spire-agent"
                log_level = "DEBUG"

                server_address = "{{ .SpireServerAddress }}"
                server_port = "{{ .SpireServerPort }}"

                trust_domain = "{{ .TrustDomain }}"
                trust_bundle_path = "/etc/spire-agent/initial-trust-bundle.pem"
            }

            plugins {
                KeyManager "disk" {
                    plugin_data {
                        directory = "/var/lib/spire-agent"
                    }
                }

                NodeAttestor "tpm" {
                    plugin_cmd = "/usr/local/lib/spire-agent/tpm_attestor_agent"
                    plugin_checksum = "${TPM_PLUGIN_CHECKSUM}"
                    plugin_data {}
                }

                WorkloadAttestor "unix" {
                    plugin_data {}
                }
            }
        - path: /etc/spire-agent/initial-trust-bundle.pem
          owner: root:root
          permissions: '0644'
          content: |
      {{ indent 6 .TrustBundle }}
      {{- range .Files }}
        - path: {{ quote .Path }}
          owner: {{ quote .Owner }}
          permissions: {{ quote .Permissions }}
      {{- if .Encoding }}
          encoding: {{ quote .Encoding }}
      {{- end }}
          content: {{ quote .Content }}
      {{- end }}

      runcmd:
        - systemctl restart spire-agent.service
        - sysctl --system
        - systemctl restart procps
        - mkdir -p /run/cluster-api
        - echo success > /run/cluster-api/bootstrap-success.complete
        - sh -c 'nohup sh -c "for i in \$(seq 1 90); do [ -S /tmp/spire-agent/public/api.sock ] && systemctl restart nvke-agent.service && exit 0; sleep 1; done; exit 1" >/var/log/nvke-agent-spire-wait.log 2>&1 &'
  lifecycle:
    deprecated: false
    hidden: false
