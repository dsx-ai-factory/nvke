#
# Mirror of the active releases in nke-site-deploy/cwe-profiles/releases.
# TestNicoVMSOSProfileMatrix reads it to check that every entry in
# nicoVMSOSProfileExclusions still names an active release, and that every
# release that is not excluded is one nico-vms can boot.
#
# Only some fields are true: each active NodePoolRelease's name, Kubernetes
# version annotations and image reference, and each MachineImage's
# architecture. The rest are placeholders that satisfy the CRDs; nothing reads
# them. Deprecated releases are left out, because the matrix covers active
# ones.
#
# The nvke-nico-vms-* entries are the suite's own releases rather than fleet
# ones, and the matrix needs them here because it reads this index on both
# architectures.
#
# Refresh this when releases are added or retired upstream. A stale copy still
# runs the matrix, but stops catching a release retired in nke-site-deploy.
