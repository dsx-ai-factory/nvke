# Sanitized fixture index for CWE tests / gofail e2e.
# Fleet metadata lives in nke-site-deploy/cwe-profiles.

profiles:
  test-fixture-amd64:
    kubernetes_version: "1.31.0"
    kubernetes_version_injected: true
    architecture: amd64
    build_date: "2026-01-01"
    ubuntu_version: "24.04"
  # Used by e2e/gofail SeedCWEGofailDB node pool/set rows. The generated
  # releases in ../../releases need a release of this name for those rows to resolve.
  test:
    kubernetes_version: "1.30.0"
    architecture: amd64
    build_date: "2026-01-01"
    ubuntu_version: "24.04"
  # The nico-vms backend's OS profile, copied from the fleet profiles so the
  # nico-vms E2E specs can run against this fixture.
  # Unlike the other entries, its ipxeScript names real, public image URLs.
  # See README.md in the parent directory.
  nke-nico-vms-24.04-amd64-fde:
    kubernetes_version: ""
    kubernetes_version_injected: true
    architecture: amd64
    build_date: "2026-03-23"
    ubuntu_version: "24.04"
  # The arm64 twin. Same userData; its ipxeScript differs only in the two
  # artifact URLs and the kernel parameters, which are x86-only on the amd64
  # entry. No arm64 lane requests it yet.
  nke-nico-vms-24.04-arm64-fde:
    kubernetes_version: ""
    kubernetes_version_injected: true
    architecture: arm64
    build_date: "2026-03-23"
    ubuntu_version: "24.04"
  # The local-dev profile create-forge-cluster.sh selects. Its ipxeScript is a
  # placeholder; it exists so the generated releases include one of this name.
  nke-local-dev-kindest-arm64:
    kubernetes_version: "1.34.2"
    architecture: arm64
    build_date: "2026-01-01"
    ubuntu_version: "24.04"
