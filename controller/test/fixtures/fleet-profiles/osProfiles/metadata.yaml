#
# Mirror of the active OS profile index from nke-site-deploy/cwe-profiles.
# TestNicoVMSOSProfileMatrix reads it to check that every entry in
# nicoVMSOSProfileExclusions still names an active profile, and that every
# profile that is not excluded is one nico-vms can boot.
#
# Only the three fields the matrix reads are copied. build_date, ubuntu_version
# and variant are deliberately left out.
#
# Refresh this when profiles are added or retired upstream. A stale copy still
# runs the matrix, but stops catching a profile retired in nke-site-deploy.

