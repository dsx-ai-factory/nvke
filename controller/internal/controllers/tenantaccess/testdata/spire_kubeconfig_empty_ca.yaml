apiVersion: v1
clusters:
- cluster:
    server: https://5.6.7.8:6443
  name: cluster
contexts:
- context:
    cluster: cluster
    user: spiffe-user
  name: spiffe
current-context: spiffe
kind: Config
users:
- name: spiffe-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      args: null
      command: /opt/spiffe/bin/k8s-spiffe-workload-jwt-exec-auth
      env:
      - name: SPIFFE_ENDPOINT_SOCKET
        value: unix:///var/run/spire/agent/sockets/public/api.sock
      - name: SPIFFE_JWT_AUDIENCE
        value: beta
      interactiveMode: Never
      provideClusterInfo: false
