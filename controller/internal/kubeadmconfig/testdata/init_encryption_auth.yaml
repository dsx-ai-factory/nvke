apiVersion: kubeadm.k8s.io/v1beta3
bootstrapTokens:
- groups:
  - system:bootstrappers:kubeadm:default-node-token
  token: abcdef.0123456789abcdef
  ttl: 24h0m0s
  usages:
  - signing
  - authentication
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 192.168.1.10
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/containerd/containerd.sock
  imagePullPolicy: IfNotPresent
  kubeletExtraArgs:
    node-ip: 192.168.1.10
  name: node1
  taints: null
patches:
  directory: /etc/kubernetes/patches
---
apiServer:
  extraArgs:
    audit-log-maxage: "30"
    audit-log-maxbackup: "10"
    audit-log-maxsize: "100"
    audit-log-path: /var/log/kubernetes_audit/audit.log
    audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
    authentication-config: /etc/kubernetes/oidc/auth-config.yaml
    bind-address: 0.0.0.0
    enable-admission-plugins: NodeRestriction,DenyServiceExternalIPs,OwnerReferencesPermissionEnforcement,PodNodeSelector,PodTolerationRestriction
    encryption-provider-config: /etc/kubernetes/kube-api-encryption/encryption-config.yaml
    encryption-provider-config-automatic-reload: "true"
    feature-gates: ImageVolume=true
    kubelet-certificate-authority: /etc/kubernetes/pki/ca.crt
    profiling: "false"
    service-account-extend-token-expiration: "false"
    shutdown-delay-duration: 10s
    shutdown-send-retry-after: "true"
    shutdown-watch-termination-grace-period: 20s
    tls-cipher-suites: TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  extraVolumes:
  - hostPath: /var/log/kubernetes_audit
    mountPath: /var/log/kubernetes_audit
    name: audit-logs
    pathType: DirectoryOrCreate
  - hostPath: /etc/kubernetes/policies
    mountPath: /etc/kubernetes/policies
    name: audit-policies
    pathType: DirectoryOrCreate
    readOnly: true
  - hostPath: /etc/kubernetes/kube-api-encryption
    mountPath: /etc/kubernetes/kube-api-encryption
    name: enc
    pathType: DirectoryOrCreate
    readOnly: true
  - hostPath: /etc/kubernetes/oidc
    mountPath: /etc/kubernetes/oidc
    name: oidc-auth-config
    pathType: DirectoryOrCreate
    readOnly: true
  timeoutForControlPlane: 4m0s
apiVersion: kubeadm.k8s.io/v1beta3
certificatesDir: /etc/kubernetes/pki
clusterName: kubernetes
controlPlaneEndpoint: cluster.local:6443
controllerManager:
  extraArgs:
    bind-address: 127.0.0.1
    large-cluster-size-threshold: "50"
    profiling: "false"
    secondary-node-eviction-rate: "0"
dns: {}
etcd:
  local:
    dataDir: /var/lib/etcd
    extraArgs:
      auto-compaction-retention: "1"
      listen-metrics-urls: http://0.0.0.0:2381
      quota-backend-bytes: "17179869184"
imageRepository: registry.k8s.io
kind: ClusterConfiguration
kubernetesVersion: v1.34.2
networking:
  dnsDomain: cluster.local
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
scheduler:
  extraArgs:
    bind-address: 127.0.0.1
    profiling: "false"
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
metricsBindAddress: 0.0.0.0:10249
---
apiVersion: kubelet.config.k8s.io/v1beta1
featureGates:
  ImageVolume: true
kind: KubeletConfiguration
kubeReserved:
  cpu: 1000m
  ephemeral-storage: 1Gi
  memory: 2Gi
maxParallelImagePulls: 4
podPidsLimit: 16384
seccompDefault: true
serializeImagePulls: false
serverTLSBootstrap: true
systemReserved:
  memory: 16Gi
tlsCipherSuites:
- TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
- TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
- TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
- TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
- TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
- TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
