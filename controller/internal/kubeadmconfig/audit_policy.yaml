# The API server applies the first rule a request matches, so the rules that
# must log a request whoever makes it come first, ahead of the rules that drop
# routine system traffic. A resource listed without a group matches only the
# core API group, so every other resource names its group.

apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - "RequestReceived"
rules:
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
    - group: "rbac.authorization.k8s.io"
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    - group: "admissionregistration.k8s.io"
    - group: "certificates.k8s.io"
      resources: ["certificatesigningrequests/approval", "certificatesigningrequests/status"]

  - level: Metadata
    resources:
    - group: ""
      resources: ["secrets"]

  - level: Metadata
    resources:
    - group: ""
      resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/proxy", "pods/ephemeralcontainers", "services/proxy", "nodes/proxy"]

  - level: None
    userGroups:
    - system:serviceaccounts:kube-system
    - system:nodes

  - level: None
    users:
    - system:apiserver
    - system:kube-scheduler
    - system:volume-scheduler
    - system:kube-controller-manager
    - system:node

  - level: None
    nonResourceURLs:
    - /healthz*
    - /livez*
    - /readyz*
    - /version
    - /swagger*

  - level: None
    resources:
    - group: "admissionregistration.k8s.io"
    - group: "coordination.k8s.io"

  # Reads of other groups' resources, RBAC included, fall through to the
  # catch-all and are logged.
  - level: None
    verbs: ["list", "get", "watch"]
    resources:
    - group: ""
      resources: ["configmaps", "limitranges", "namespaces", "nodes", "serviceaccounts", "resourcequotas"]

  - level: Metadata
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
    - group: ""
      resources: ["configmaps"]

  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
    - group: ""
      resources: ["limitranges", "namespaces", "nodes", "serviceaccounts", "resourcequotas"]
    - group: "apps"
      resources: ["daemonsets"]
    - group: "certificates.k8s.io"
      resources: ["certificatesigningrequests"]
    - group: "networking.k8s.io"
      resources: ["networkpolicies"]
    - group: "crd.projectcalico.org"
      resources: ["globalnetworkpolicies", "networkpolicies", "globalnetworksets", "networksets", "tiers"]
    - group: "projectcalico.org"
      resources: ["globalnetworkpolicies", "networkpolicies", "globalnetworksets", "networksets", "tiers"]
    - group: "kubevirt.io"
      resources: ["virtualmachineinstances", "virtualmachines", "kubevirts"]

  # Token reviews and service account token requests carry tokens, so they fall
  # through to this rule and are never logged with bodies.
  - level: Metadata
