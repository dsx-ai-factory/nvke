#
# Accepted breaking changes to openapi.yaml.
#
# `make -C controller api-compat-check` compares openapi.yaml against the newest
# published controller/api version tag and fails on every breaking change. This
# file is the only way past it, and each entry is a decision someone signed for.
#
# Empty is the normal state. An entry here says "this break is going out, and
# here is who decided and why" -- not "this finding is noise".
#
# Before adding one, read the "Compatibility" section of README.md. Prefer the
# compatible shape: add a new optional property instead of changing an existing
# one, add a new endpoint instead of repurposing one, and deprecate before you
# remove.
#
# A removed OPERATION usually belongs nowhere near this file. Mark it
# `deprecated: true` with an `x-sunset` date at least 180 days out, ship that,
# and remove it once the date has passed -- the gate lets that through with no
# entry here, because the notice was given and has run out. A waiver for a
# removal is the record of a promise that was not kept.
#
# Each waiver matches exactly one change, on all three of:
#
#   change    the engine's change kind, e.g. property_removed, object_removed
#   path      the JSONPath the engine reported, e.g.
#             $.paths['/clusters'].post.requestBody
#   property  the property the change is about; "" when the change names none
#
# and must also carry:
#
#   reason    why the break is acceptable, and what a consumer has to do
#   owner     a person, not a team -- someone to ask in six months
#   review    YYYY-MM-DD, when this entry is next looked at
#
# The failure message prints a ready-made stub for every unwaived change, so
# the three matching fields do not have to be worked out by hand.
#
# A waiver that matches nothing fails the gate. Once the baseline tag has moved
# past the release that carried the break, the entry has done its job and must
# be deleted; it cannot sit here outliving its reason.
waivers:
  - change: property_removed
    path: "$.components.schemas['CreateClusterRequest']"
    property: required
    reason: >
      Create requests may omit cniPlugin. The server selects ovn-kubernetes
      1.4.0, and an explicit calico or ovn-kubernetes value is unchanged.
      Clients that still send the field keep working; clients that treated it
      as required can stop sending it.
    owner: Alex Greene
    review: "2027-04-08"
