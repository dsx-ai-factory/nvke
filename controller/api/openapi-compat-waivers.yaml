#
# Accepted breaking changes to openapi.yaml.
#
# `make -C controller api-compat-check` compares openapi.yaml against the newest
# published controller/api version tag and fails on every breaking change. This
# file is the only way past it, and each entry is a decision someone signed for.
#
# Empty is the normal state. An entry here says "this break is going out, and
# here is who decided and why" -- not "this finding is noise".
#
# Before adding one, read the "Compatibility" section of README.md. Prefer the
# compatible shape: add a new optional property instead of changing an existing
# one, add a new endpoint instead of repurposing one, and deprecate before you
# remove.
#
# A removed OPERATION usually belongs nowhere near this file. Mark it
# `deprecated: true` with an `x-sunset` date at least 180 days out, ship that,
# and remove it once the date has passed -- the gate lets that through with no
# entry here, because the notice was given and has run out. A waiver for a
# removal is the record of a promise that was not kept.
#
# Each waiver matches exactly one change, on all three of:
#
#   change    the engine's change kind, e.g. property_removed, object_removed
#   path      the JSONPath the engine reported, e.g.
#             $.paths['/clusters'].post.requestBody
#   property  the property the change is about; "" when the change names none
#
# and must also carry:
#
#   reason    why the break is acceptable, and what a consumer has to do
#   owner     a person, not a team -- someone to ask in six months
#   review    YYYY-MM-DD, when this entry is next looked at
#
# The failure message prints a ready-made stub for every unwaived change, so
# the three matching fields do not have to be worked out by hand.
#
# A waiver that matches nothing fails the gate. Once the baseline tag has moved
# past the release that carried the break, the entry has done its job and must
# be deleted; it cannot sit here outliving its reason.
waivers:
  - change: "object_added"
    path: "$.components.schemas['ControlPlaneConfig'].properties['nodeLabels']"
    property: "additionalProperties"
    reason: "(pre-alpha) nodeLabels is now a map of key to value. Clients must read control-plane labels as an object, not as an array of key=value strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_removed"
    path: "$.components.schemas['ControlPlaneConfig'].properties['nodeLabels']"
    property: "items"
    reason: "(pre-alpha) The array item schema is gone because control-plane nodeLabels is an object. Clients must stop decoding it as a list of strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "modified"
    path: "$.components.schemas['ControlPlaneConfig'].properties['nodeLabels']"
    property: "type"
    reason: "(pre-alpha) control-plane nodeLabels changed from array to object. Clients must send and read a map. Stored labels were never applied to nodes."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_added"
    path: "$.components.schemas['CreateClusterControlPlaneConfig'].properties['nodeLabels']"
    property: "additionalProperties"
    reason: "(pre-alpha) Create-time control-plane nodeLabels is now a map of key to value. Clients must send an object, not an array of key=value strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_removed"
    path: "$.components.schemas['CreateClusterControlPlaneConfig'].properties['nodeLabels']"
    property: "items"
    reason: "(pre-alpha) The array item schema is gone because create-time control-plane nodeLabels is an object. Clients must stop sending a list of strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "modified"
    path: "$.components.schemas['CreateClusterControlPlaneConfig'].properties['nodeLabels']"
    property: "type"
    reason: "(pre-alpha) Create-time control-plane nodeLabels changed from array to object. Clients must send a map. Stored labels were never applied to nodes."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "property_added"
    path: "$.components.schemas['NodePool']"
    property: "required"
    reason: "(pre-alpha) nodeTaints is required on a node pool read. Clients that validate the response must accept nodeTaints. An omitted set is an empty array."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_added"
    path: "$.components.schemas['NodePool'].properties['nodeLabels']"
    property: "additionalProperties"
    reason: "(pre-alpha) Node pool nodeLabels is now a map of key to value. Clients must read it as an object, not as an array of key=value strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_removed"
    path: "$.components.schemas['NodePool'].properties['nodeLabels']"
    property: "items"
    reason: "(pre-alpha) The array item schema is gone because node pool nodeLabels is an object. Clients must stop decoding it as a list of strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "modified"
    path: "$.components.schemas['NodePool'].properties['nodeLabels']"
    property: "type"
    reason: "(pre-alpha) Node pool nodeLabels changed from array to object. Clients must read a map. Stored labels were never applied to nodes."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_added"
    path: "$.components.schemas['NodePoolCreateConfig'].properties['nodeLabels']"
    property: "additionalProperties"
    reason: "(pre-alpha) Create-time node pool nodeLabels is now a map of key to value. Clients must send an object, not an array of key=value strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_removed"
    path: "$.components.schemas['NodePoolCreateConfig'].properties['nodeLabels']"
    property: "items"
    reason: "(pre-alpha) The array item schema is gone because create-time node pool nodeLabels is an object. Clients must stop sending a list of strings."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "modified"
    path: "$.components.schemas['NodePoolCreateConfig'].properties['nodeLabels']"
    property: "type"
    reason: "(pre-alpha) Create-time node pool nodeLabels changed from array to object. Clients must send a map. Stored labels were never applied to nodes."
    owner: pbikki-nv
    review: "2026-10-15"
  - change: "object_removed"
    path: "$.components.schemas['UpdateClusterControlPlaneConfig']"
    property: "properties"
