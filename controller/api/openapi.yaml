            not reconciled after provisioning. Keys under nke.nvidia.com, nke.io,
            nvke.nvidia.com, kubernetes.io, k8s.io, cluster.x-k8s.io and their
            subdomains require an explicit deployment allowlist entry for this
            metadata type.
          x-go-type-skip-optional-pointer: true
        machineLabels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Labels applied to control-plane CAPI Machines at creation, including
