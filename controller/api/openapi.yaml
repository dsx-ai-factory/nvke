            not reconciled after provisioning. Keys under nke.nvidia.com, nke.io,
            nvke.nvidia.com, kubernetes.io, k8s.io, cluster.x-k8s.io and their
            subdomains require an explicit deployment allowlist entry for this
            metadata type.
          x-go-type-skip-optional-pointer: true
        nodeLabels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Labels applied to control-plane nodes at creation, as a map of keys to values.
            Keys under nvke.nvidia.com, nke.nvidia.com (legacy), nke.io (legacy), kubernetes.io, k8s.io and their subdomains are
            reserved, unless the deployment allows specific Kubernetes keys.
          x-go-type-skip-optional-pointer: true
        teleportEnabled:
