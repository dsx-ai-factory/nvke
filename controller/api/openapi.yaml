          description: A list of labels for the nodes in the pool
          x-order: 13
        desiredNodeCount:
          type: integer
          minimum: 0
          description: The desired number of nodes in the pool
          x-order: 14
        description:
          type: string
          description: An optional description for the node pool.
          x-order: 15
        autoProvisionDisabled:
          type: boolean
          default: false
          description: Whether the node pool is disabled for auto-provisioning.
          x-order: 16
        autoModeDisabled:
          type: boolean
          default: false
          description: Whether the node pool is disabled for auto-mode (automatic node recycling).
          x-order: 17
        provisioningMonitorDisabled:
          type: boolean
          default: false
          description: Whether the timeout-based provisioning monitor is paused for this node pool. When true, nodes stuck in provisioning past the configured timeout will not be recycled by the system; an operator must investigate manually.
          x-order: 18
        recycleBudget:
          type: integer
          minimum: 0
