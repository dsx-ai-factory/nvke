openapi: 3.0.3
info:
  title: CWE API
  version: "0.0.1"
  description: NKE Cloud Workflow Engine API
servers:
  - url: /api

# Declared once rather than per operation, so a new operation requires a token by
# default. The endpoints that need no token are not in this file at all;
# internal/server registers them and internal/auth/routes.go is the list.
security:
  - bearerAuth: []

paths:
  /cniPlugins:
    get:
      summary: List CNI Plugins
      operationId: listCNIPlugins
      responses:
        "200":
          description: A list of CNI plugins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCNIPluginsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /infraProviders:
    get:
      summary: List Infrastructure Providers
      operationId: listInfraProviders
      description: Returns the provider payload keys this deployment advertises for CreateClusterRequest cluster specs.
      responses:
        "200":
          description: A list of infrastructure provider payload keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInfraProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clusters:
    get:
      summary: List Clusters
      operationId: listClusters
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter clusters by name (exact match)
      responses:
        "200":
          description: A list of clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClustersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create Cluster
      operationId: createCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClusterRequest"
      responses:
        "201":
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clusters/{clusterID}:
    parameters:
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a Cluster
      operationId: getCluster
      responses:
        "200":
          description: Returns the requested cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "404":
          description: Cluster not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Update a Cluster
      operationId: updateCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClusterRequest"
      responses:
        "200":
          description: Cluster updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "404":
          description: Cluster not found
        "409":
          description: |
            Another mutually-exclusive cluster operation is already in progress.
            The response body includes the operation type (etcd_encryption,
            k8s_upgrade, cp_nodes_recycling, oidc_enable) currently running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Delete a Cluster
      operationId: deleteCluster
      responses:
        "202":
          description: Cluster deletion initiated
        "404":
          description: Cluster not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clusters/{clusterID}/control-plane:
    parameters:
      - name: clusterID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a Cluster's Control Plane
      description: |
        Read-only view of the cluster control plane: the persisted control-plane
        configuration plus an aggregate runtime status (node counts, current
        Kubernetes version, and the control-plane upgrade/recycling conditions).
      operationId: getClusterControlPlane
      responses:
        "200":
          description: Returns the cluster's control-plane configuration and status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterControlPlane"
        "404":
          description: Cluster not found

  /nodePools:
    get:
      summary: List Node Pools
      operationId: listNodePools
      parameters:
        - name: clusterID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter node pools by cluster ID
        - name: clusterName
          in: query
          required: false
          schema:
            type: string
          description: Filter node pools by cluster name (exact match)
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter node pools by name (exact match)
      responses:
        "200":
          description: A list of node pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodePoolsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create Node Pool
      operationId: createNodePool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodePoolRequest"
      responses:
        "201":
          description: Node Pool created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePool"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "409":
          description: Cannot create node pool when parent cluster is deleting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodePools/{nodePoolID}:
    parameters:
      - name: nodePoolID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a Node Pool
      operationId: getNodePool
      responses:
        "200":
          description: Returns the requested node pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePool"
        "404":
          description: Node Pool not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Update Node Pool
      operationId: updateNodePool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodePoolRequest"
      responses:
        "200":
          description: Node Pool updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePool"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "404":
          description: Node Pool not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Delete a Node Pool
      description: |
        Delete a node pool from a still-running cluster.

        Live deletion must leave at least one joined control-plane node.
        Deleting the last control-plane node pool is rejected; use DELETE /clusters/{id} instead.
      operationId: deleteNodePool
      responses:
        "202":
          description: Node Pool deletion initiated
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "404":
          description: Node Pool not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodePools/{nodePoolID}/configHistory:
    parameters:
      - name: nodePoolID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get Node Pool Config History
      operationId: getNodePoolConfigHistory
      description: Returns the config change history for a node pool, derived from its NodeSet snapshots. Each entry represents a config change and shows which fields changed relative to the previous snapshot.
      responses:
        "200":
          description: Returns the node pool config history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePoolConfigHistory"
        "404":
          description: Node Pool not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodeSets:
    get:
      summary: List Node Sets
      operationId: listNodeSets
      parameters:
        - name: nodePoolID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter node sets by node pool ID
      responses:
        "200":
          description: A list of node sets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodeSetsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodeSets/{nodeSetID}:
    parameters:
      - name: nodeSetID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a Node Set
      operationId: getNodeSet
      responses:
        "200":
          description: Returns the requested node set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSet"
        "404":
          description: Node Set not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodes:
    get:
      summary: List Nodes
      operationId: listNodes
      parameters:
        - name: clusterID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter nodes by cluster ID
        - name: nodePoolID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter nodes by node pool ID
        - name: clusterName
          in: query
          required: false
          schema:
            type: string
          description: Filter nodes by cluster name
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter nodes by node name
        - name: controlPlane
          in: query
          required: false
          schema:
            type: boolean
          description: Filter nodes by control-plane membership (true returns only control-plane nodes, false only workers)
      responses:
        "200":
          description: A list of nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodes/{nodeID}:
    parameters:
      - name: nodeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a Single Node
      operationId: getNode
      responses:
        "200":
          description: Returns the requested node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "404":
          description: Node not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Delete a Single Node
      description: |
        Delete a single node from a still-running cluster.
        The MachineHealthIssue payload may be optionally provided, which will cause the node to be flagged for repair to the Forge team.

        Live deletion must leave at least one joined control-plane node.
        Deleting the last joined control-plane node is rejected; use DELETE /clusters/{id} instead.
      operationId: deleteNode
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteNodeRequest"
      responses:
        "202":
          description: Node deletion initiated
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "404":
          description: Node not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodes/{nodeID}/history:
    parameters:
      - name: nodeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get Node Workflow History
      operationId: getNodeHistory
      description: Returns Temporal workflow execution history for a node, including per-activity timing for provisioning, rebooting, and teardown operations.
      responses:
        "200":
          description: Returns the node workflow history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeHistory"
        "404":
          description: Node not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /osProfiles:
    get:
      summary: List OS Profiles
      operationId: listOSProfiles
      responses:
        "200":
          description: A list of OS profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOSProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configProfiles:
    get:
      summary: List Config Profiles
      operationId: listConfigProfiles
      responses:
        "200":
          description: A list of config profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConfigProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  responses:
    # Both come from the authentication middleware, which runs before routing, so
    # every operation can answer them.
    Unauthorized:
      description: No valid bearer token was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericError"
    Forbidden:
      description: The token verified, but its subject matches no admission rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericError"

  securitySchemes:
    # Any JWT signed by a trusted issuer. Which issuers, and which subjects they
    # admit, is operator configuration; see internal/auth and the README.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    #--------------------------------
    #  Cluster
    #--------------------------------
    CreateClusterRequest:
      type: object
      required:
        - name
        - controlPlaneKubernetesVersion
        - cniPlugin
        - etcdEncrypted
      # A cluster picks its provider at creation, so exactly one provider payload is
      # required. Rejecting "both or neither" leaves exactly one.
      not:
        anyOf:
          - required: [nico, infra]
          - allOf:
              - not:
                  required: [nico]
              - not:
                  required: [infra]
      description: |
        Exactly one provider payload is required: supply either `nico` or `infra`.
        A request carrying both, or neither, is rejected with 400.
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          minLength: 1
          maxLength: 55
          example: "my-cluster"
          description: The name of the cluster. Must be a lowercase DNS label, because CWE derives the names of the cluster's CAPI resources and its node names from it.
          x-order: 1
        # controlPlaneKubernetesVersion: validated by pattern (semver version core only, no leading "v").
        # Pattern is the version-core part of the regex from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
        # We disallow leading "v" because provisioning templates add "v" when building URLs (e.g. kubeadm_v{{ .KubernetesVersion }}).
        controlPlaneKubernetesVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          example: "1.29.7"
          description: |
            The version of Kubernetes to use for the cluster.
            Must be a valid semver version core (X.Y.Z only, e.g. 1.29.7).
            Must not include a leading "v".
            The pattern is the version-core part of the regex from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
          x-order: 5
        cniPlugin:
          type: string
          example: "calico"
          description: The CNI plugin to use for the cluster
          x-order: 6
        cniVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          example: "3.30.1"
          description: |
            The CNI package/chart stream to use for the selected CNI plugin.
            Optional for backwards compatibility; when omitted, the server defaults by cniPlugin.
            Must be a valid semver version core (X.Y.Z only) and must not include a leading "v".
          x-order: 7
        etcdEncrypted:
          type: boolean
          example: false
          description: Enable or disable etcd encryption for the cluster
          x-order: 8
        controlPlaneVIP:
          type: string
          format: ipv4
          description: |
            Optional kube-vip control-plane VIP desired state. When provided,
            CWE stores this address on the cluster and configures kube-vip
            during provisioning. When omitted, CWE stores no control-plane VIP,
            skips kube-vip configuration, and kubeadm uses the first control-plane
            node IP as the API server endpoint. Callers are responsible for
            choosing a non-conflicting VIP. Omit this field to skip kube-vip;
            an explicit empty string is rejected.
          x-go-type-skip-optional-pointer: true
          x-order: 9
        teleportEnabled:
          type: boolean
          description: Enable Teleport SSH enrollment for nodes in this cluster. When omitted, the server-side default for the site is applied.
          x-order: 10
        network:
          $ref: "#/components/schemas/ClusterNetworkCreateConfig"
          description: Immutable pod and service network configuration. When omitted, the server-side defaults are materialized on the cluster.
          x-order: 11
        nodePools:
          type: array
          items:
            $ref: "#/components/schemas/NodePoolCreateConfig"
          description: The initial set of node pools to create for the cluster
          example:
            - namePrefix: "cp"
              nico:
                subnetIDs:
                  - "123e4567-e89b-12d3-a456-426614174000"
                instanceTypeID: "123e4567-e89b-12d3-a456-426614174001"
              desiredNodeCount: 1
              controlPlane: true
          x-order: 12
        controlPlaneConfig:
          $ref: "#/components/schemas/CreateClusterControlPlaneConfig"
          description: |
            Cluster-level control plane configuration.
          x-order: 13
        nico:
          $ref: "#/components/schemas/NicoClusterProvider"
          description: Provider Nico identity fields.
          x-go-type-skip-optional-pointer: true
        infra:
          $ref: "#/components/schemas/InfraClusterProvider"
          description: Ifra provider fields.
          x-go-type-skip-optional-pointer: true
    ControlPlaneConfig:
      type: object
      additionalProperties: false
      description: |
        Cluster-level control plane configuration.
      properties:
        configurationId:
          type: string
          format: uuid
          readOnly: true
          description: The ID of the current control plane configuration snapshot revision.
          x-go-type-skip-optional-pointer: true
        desiredCount:
          type: integer
          minimum: 1
          description: The desired number of cluster-level control plane nodes.
          x-go-type-skip-optional-pointer: true
        maxSurge:
          type: integer
          minimum: 0
          description: |
            Cluster-level surge capacity for control plane nodes during upgrades.
        provisioningMonitorDisabled:
          type: boolean
          description: |
            When true, the timeout-based provisioning monitor is paused for cluster-level
            control plane nodes.
        systemReservedMemory:
          type: string
          description: The amount of memory to reserve for system processes on control plane nodes (e.g., "16Gi").
          x-go-type-skip-optional-pointer: true
        nodeLabels:
          type: array
          items:
            type: string
          description: A list of labels applied to control plane nodes.
          x-go-type-skip-optional-pointer: true
        teleportEnabled:
          type: boolean
          default: true
          description: Whether Teleport SSH enrollment is enabled for control plane nodes.
        nico:
          $ref: "#/components/schemas/NicoControlPlaneProvider"
          description: Provider Nico control plane fields.
          x-go-type-skip-optional-pointer: true
        infra:
          $ref: "#/components/schemas/InfraControlPlaneProvider"
          description: Infra provider control plane fields.
          x-go-type-skip-optional-pointer: true

    ClusterControlPlane:
      type: object
      additionalProperties: false
      description: |
        Read-only view of a cluster's control plane: its persisted configuration
        plus an aggregate runtime status.
      required:
        - config
        - status
      properties:
        config:
          $ref: "#/components/schemas/ControlPlaneConfig"
          description: The cluster-level control plane configuration.
          x-order: 1
        status:
          $ref: "#/components/schemas/ControlPlaneStatus"
          description: Aggregate runtime status of the control plane.
          x-order: 2

    ControlPlaneStatus:
      type: object
      additionalProperties: false
      description: Aggregate runtime status of a cluster's control plane.
      required:
        - nodeCount
        - readyNodeCount
        - kubernetesVersion
        - controlPlaneUpgrading
        - cpNodesRecycling
      properties:
        nodeCount:
          type: integer
          description: Total number of control-plane nodes for the cluster.
          x-go-type-skip-optional-pointer: true
          x-order: 1
        readyNodeCount:
          type: integer
          description: Number of control-plane nodes currently reporting Kubernetes-ready.
          x-go-type-skip-optional-pointer: true
          x-order: 2
        kubernetesVersion:
          type: string
          description: The current control-plane Kubernetes version.
          x-go-type-skip-optional-pointer: true
          x-order: 3
        controlPlaneUpgrading:
          $ref: "#/components/schemas/Condition"
          description: The condition indicating whether the control plane is currently being upgraded.
          x-order: 4
        cpNodesRecycling:
          $ref: "#/components/schemas/Condition"
          description: The condition indicating whether the control-plane nodes are currently being recycled.
          x-order: 5

    CreateClusterControlPlaneConfig:
      type: object
      additionalProperties: false
      required:
        - desiredCount
      # The control plane follows its cluster's provider, so exactly one provider
      # payload is required whenever this object is supplied.
      not:
        anyOf:
          - required: [nico, infra]
          - allOf:
              - not:
                  required: [nico]
              - not:
                  required: [infra]
      description: |
        Writable cluster-level control plane configuration supplied at cluster creation.
        Exactly one provider payload is required: supply either `nico` or `infra`.
        A request carrying both, or neither, is rejected with 400.
      properties:
        desiredCount:
          type: integer
          minimum: 1
          description: The desired number of cluster-level control plane nodes. Must be at least 1.
          x-go-type-skip-optional-pointer: true
        maxSurge:
          type: integer
          minimum: 0
          description: Cluster-level surge capacity for control plane nodes during upgrades (max 1).
        provisioningMonitorDisabled:
          type: boolean
          default: false
          description: When true, the timeout-based provisioning monitor is paused for control plane nodes.
        systemReservedMemory:
          type: string
          default: "16Gi"
          description: The amount of memory to reserve for system processes on control plane nodes (e.g., "16Gi").
          x-go-type-skip-optional-pointer: true
        nodeLabels:
          type: array
          items:
            type: string
          description: A list of labels to apply to control plane nodes.
          x-go-type-skip-optional-pointer: true
        teleportEnabled:
          type: boolean
          description: Whether Teleport SSH enrollment is enabled for control plane nodes. When omitted, the server-side default for the site is applied.
        nico:
          $ref: "#/components/schemas/NicoControlPlaneProviderCreate"
          description: Provider Nico control plane fields.
          x-go-type-skip-optional-pointer: true
        infra:
          $ref: "#/components/schemas/InfraControlPlaneProvider"
          description: Infra provider control plane fields.
          x-go-type-skip-optional-pointer: true
    UpdateClusterControlPlaneConfig:
      type: object
      additionalProperties: false
      not:
        required: [nico, infra]
      description: |
        `nico` and `infra` are mutually exclusive: supply at most one of them (both
        may be omitted). A request carrying both is rejected with 400, as is a
        provider payload that does not match the cluster.
      properties:
        desiredCount:
