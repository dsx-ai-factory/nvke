        provisioningMonitorDisabled:
          type: boolean
          description: Pause or resume the provisioning monitor for cluster-level control plane nodes.
        systemReservedMemory:
          type: string
          description: Set the reserved system memory for control plane nodes (e.g., "16Gi").
        nodeLabels:
