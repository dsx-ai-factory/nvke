        - state
        - forced
        - startedAt
      properties:
        cycleID:
          type: string
          description: The Temporal workflow ID that owns this certificate-renewal cycle.
          x-order: 1
        state:
          type: string
          enum:
            - accepted
            - succeeded
            - failed
          description: The lifecycle state of the most recent certificate-renewal cycle.
          x-order: 2
        outcome:
          type: string
          enum:
            - unchanged
            - renewed
          description: Whether a successful cycle renewed certificates or found no certificates due.
          x-order: 3
        forced:
          type: boolean
          description: Whether the workflow was explicitly forced by an operator.
          x-order: 4
        scheduledFor:
          type: string
          format: date-time
          description: The scheduled due time associated with this cycle, when applicable.
          x-order: 5
        startedAt:
          type: string
          format: date-time
          description: >-
            When the workflow accepted the cycle and acquired the cluster mutation lock.
            Refused cycles record startedAt without holding the lock.
          x-order: 6
        completedAt:
          type: string
          format: date-time
          description: When the cycle succeeded or failed.
          x-order: 7
        failedNodeID:
          type: string
          format: uuid
          description: The control-plane node being processed when the cycle failed, when applicable.
          x-order: 8
        phase:
          type: string
          description: The workflow phase that failed, when applicable.
          x-order: 9
        message:
          type: string
          maxLength: 1024
          description: A bounded operator-facing failure summary.
          x-order: 10

    UpdateInProgress:
      type: object
      required:
