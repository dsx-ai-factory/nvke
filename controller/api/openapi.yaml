  /nodes:
    get:
      tags: [Nodes]
      summary: List nodes
      operationId: listNodes
      description: Returns all nodes, filtered by the query parameters. All filters are exact match.
      parameters:
        - name: clusterID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by cluster ID
        - name: nodePoolID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by node pool ID
        - name: clusterName
          in: query
          required: false
          schema:
            type: string
          description: Filter by cluster name (exact match)
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by node name (exact match)
        - name: controlPlane
          in: query
          required: false
          schema:
            type: boolean
          description: '`true` returns only control-plane nodes; `false` only workers'
      responses:
        "200":
          description: A list of nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodes/{nodeID}:
    parameters:
      - name: nodeID
        in: path
        required: true
        description: Node ID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Nodes]
      summary: Get a node
      operationId: getNode
      description: |
        Returns one node. Control-plane nodes do not belong to a node pool, so
        their `nodePoolID` and `nodeSetID` are the nil UUID. `nico` is omitted
        when none of its fields are set.
      responses:
        "200":
          description: The requested node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "404":
          description: Node not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Nodes]
      summary: Delete a node
      description: |
        Deletes a single node from a running cluster. Include a
        `machineHealthIssue` to flag the underlying machine for repair.

        For control-plane nodes, a delete sets `deleteRequested`; NVKE then
        starts teardowns one node at a time. `forceUnreachable` is applied
        automatically when the node is unhealthy.

        Also returns 202, with no further effect, if the node, pool or cluster
        is already being deleted or a delete is already requested.

        Returns 400 when deletion would leave no joined control-plane node or
        `machineHealthIssue` is invalid. Delete the cluster to remove its last
        joined control-plane node.
        Deleting a control-plane node requires controlPlaneVIP because the controller
        replaces it, unless allowControlPlaneWithoutVIP is enabled for development.
        Worker node deletion is unaffected.

        Returns 409 for a control-plane node while etcd encryption, etcd key
        rotation or certificate renewal holds the control-plane mutation lock.
        Retry once the operation has finished. A failed certificate renewal can
        retain the lock until an operator clears it; see the retained-lock
        recovery procedure in controller/docs/certificate-renewal.md.
        A rotation that fails after `prepare` keeps the `etcd_key_rotation` lock
        until its workflow is reset and completes; see
        controller/docs/etcd-encryption-key-rotation.md#phase-aware-recovery.
      operationId: deleteNode
      requestBody:
        required: false
        description: Optional. Flags the machine for repair, or tolerates an unreachable node.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteNodeRequest"
            example:
              machineHealthIssue:
                category: Hardware
                summary: Node only has 7 GPUs
                details: The node reboot completed at 12:51Z and it started reporting XID 79 at 14:09Z
              forceUnreachable: true
      responses:
        "202":
          description: Deletion started or, for control-plane nodes, recorded
        "400":
          description: The request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
              example:
                message: 'cannot delete control-plane node "tenant-a-prod-cp-0002": only 2 joined control-plane node(s) would remain, below the minimum of 3 needed for etcd to survive another failure. Raise the control-plane desired count first so a replacement joins before this node is removed, or delete the cluster instead'
        "404":
          description: Node not found. No body is returned.
        "409":
          description: |
            A control-plane node cannot be deleted while etcd encryption, etcd key
            rotation or certificate renewal holds the control-plane mutation lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
              example:
                message: control-plane changes are rejected while etcd encryption, etcd key rotation or certificate renewal holds the cluster mutation lock; retry after the operation completes, or, if a failed certificate renewal retained the lock, after an operator clears it (see controller/docs/certificate-renewal.md); a rotation that fails after prepare keeps the etcd_key_rotation lock until its workflow is reset and completes (see controller/docs/etcd-encryption-key-rotation.md#phase-aware-recovery)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /releases:
    get:
      x-fern-ignore: true
      tags: [Catalog]
      summary: List releases
      operationId: listReleases
      description: Lists the releases available to the management plane.
      responses:
        "200":
          description: A list of releases
          content:
            application/json:
              schema:
