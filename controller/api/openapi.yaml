          x-order: 19
        teleportEnabled:
          type: boolean
          description: Whether Teleport SSH enrollment is enabled for nodes in this pool. When omitted, the server-side default for the site is applied based on pool role.
          x-order: 20
        nico:
          $ref: "#/components/schemas/NicoNodePoolProvider"
          description: Provider Nico node pool fields.
          x-go-type-skip-optional-pointer: true
        infra:
