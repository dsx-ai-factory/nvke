              x-order: 0
        - $ref: "#/components/schemas/NodePoolCreateConfig"

    NodeNamePrefix:
      type: string
      minLength: 1
      description: |
        Prefix for generated node names: <cluster name>-<nodeNamePrefix>-<suffix>.
        CWE assigns suffix as a 4-digit decimal number (0000–9999).
        Generated names must fit within 63 characters (Kubernetes Node name limit).
        Maximum prefix length depends on cluster name length.

    NodePoolCreateConfig:
      type: object
      description: |
        A node pool follows its cluster's provider, so exactly one provider payload is
        required: supply either `nico` or `infra`. A request carrying both, or neither,
        is rejected with 400.
      required:
        - name
        - desiredNodeCount
        - nodeNamePrefix
      # See CreateClusterRequest for why this is spelled with `not` instead of `oneOf`.
      not:
        anyOf:
          - required: [nico, infra]
          - allOf:
              - not:
                  required: [nico]
              - not:
                  required: [infra]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
          minLength: 1
          maxLength: 253
          description: The name of the node pool (must conform to Kubernetes resource naming standards)
          example: "worker"
          x-order: 1
        nodeNamePrefix:
          $ref: "#/components/schemas/NodeNamePrefix"
          x-order: 2
        systemReservedMemory:
          type: string
          description: The amount of memory to reserve for system processes (e.g., "16Gi", "128Gi")
          default: "16Gi"
          x-go-type-skip-optional-pointer: true
          x-order: 10
        kubeReservedMemory:
          type: string
          description: The amount of memory to reserve for Kubernetes processes (e.g., "2Gi", "250Mi"). When unset, the kubelet configuration patch uses its default (2Gi).
          x-go-type-skip-optional-pointer: true
          x-order: 11
        controlPlane:
          type: boolean
          default: false
          description: Whether the nodes in this pool should be added as Kubernetes control plane nodes
