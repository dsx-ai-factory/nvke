    UpdateClusterControlPlaneConfig:
      type: object
      additionalProperties: false
      not:
        anyOf:
          - required: [nico, infra]
          - required: [nico, launchLayer]
          - required: [infra, launchLayer]
      description: |
        Changes to `release` or the Kubernetes version start a control-plane
