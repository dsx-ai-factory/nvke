      summary: List config profiles
      operationId: listConfigProfiles
      description: Lists the config profiles available to the management plane.
      responses:
        "200":
          description: A list of config profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConfigProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  responses:
    # Both come from the authentication middleware, which runs before routing, so
    # every operation can answer them.
    Unauthorized:
      description: No valid bearer token was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericError"
    Forbidden:
      description: The token verified, but its subject matches no admission rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericError"

  securitySchemes:
    # Any JWT signed by a trusted issuer. Which issuers, and which subjects they
    # admit, is operator configuration; see auth/authn and the README.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT from an issuer the Operator has configured, carried as `Authorization:
        Bearer <token>`.

  schemas:
    #--------------------------------
    #  Cluster
    #--------------------------------
    CreateClusterRequest:
      type: object
      required:
        - name
        - controlPlaneKubernetesVersion
        - etcdEncrypted
      # A cluster picks its provider at creation, so exactly one provider payload is
      # required. Rejecting every pair, plus "none", leaves exactly one.
      not:
        anyOf:
          - required: [nico, infra]
          - required: [nico, launchLayer]
          - required: [infra, launchLayer]
          - allOf:
              - not:
                  required: [nico]
              - not:
                  required: [infra]
              - not:
                  required: [launchLayer]
      description: |
        A cluster and, optionally, its initial node pools. The provider payload is
        fixed at creation.
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          minLength: 1
          maxLength: 55
          example: "my-cluster"
          description: Cluster name. Lowercase DNS label, unique per management plane. Node names are derived from it.
          x-order: 1
        # controlPlaneKubernetesVersion: validated by pattern (semver version core only, no leading "v").
        # Pattern is the version-core part of the regex from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
        # We disallow leading "v" because provisioning templates add "v" when building URLs (e.g. kubeadm_v{{ .KubernetesVersion }}).
        controlPlaneKubernetesVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          example: "1.33.4"
          description: Kubernetes version for the cluster, as X.Y.Z with no leading "v".
          x-order: 5
        cniPlugin:
          x-fern-ignore: true
          type: string
          enum: [calico, ovn-kubernetes]
          example: "ovn-kubernetes"
          description: CNI plugin. Defaults to ovn-kubernetes when omitted. calico is a disabled-by-default legacy override.
          x-go-type-skip-optional-pointer: true
          x-order: 6
        cniVersion:
          x-fern-ignore: true
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          example: "2.4.2"
          description: CNI version, as X.Y.Z. Defaults to 3.30.1 for legacy calico or 2.4.2 for ovn-kubernetes.
          x-order: 7
        etcdEncrypted:
          type: boolean
          example: true
          description: Encrypt etcd at rest. Can be turned on later with `enableEtcdEncryption`; cannot be turned off.
          x-order: 8
        controlPlaneVIP:
          type: string
          format: ipv4
          description: |
            Virtual IP for the API server through kube-vip. Omit to skip kube-vip and
            use the first control-plane node's IP as the API server endpoint. Must not
            fall inside the pod or service CIDR. An explicit empty string is rejected.
            By default, a cluster without a VIP must have exactly one desired
            control-plane node. Scale-up above one node, upgrades and node replacement
            require a VIP unless the controller deployment enables the development-only
            allowControlPlaneWithoutVIP setting. That override keeps the initializing
            node's IP as the endpoint; replacing that node can break API access.
            Quorum, health and deletion protections still apply.
          x-go-type-skip-optional-pointer: true
          x-order: 9
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Enable Teleport SSH enrollment for nodes in this cluster. When omitted, the server-side default for the site is applied.
          x-order: 10
        network:
          $ref: "#/components/schemas/ClusterNetworkCreateConfig"
        nodePools:
          type: array
          items:
            $ref: "#/components/schemas/NodePoolCreateConfig"
          description: Initial worker node pools.
          example:
            - name: "gpu-workers"
              nodeNamePrefix: "w"
              desiredNodeCount: 2
              nico:
                subnetIDs:
                  - "123e4567-e89b-12d3-a456-426614174000"
                instanceTypeID: "123e4567-e89b-12d3-a456-426614174001"
          x-order: 12
        controlPlaneConfig:
          $ref: "#/components/schemas/CreateClusterControlPlaneConfig"
        nico:
          $ref: "#/components/schemas/NicoClusterProvider"
        launchLayer:
          $ref: "#/components/schemas/LaunchLayerClusterProvider"
        infra:
          x-fern-ignore: true
          $ref: "#/components/schemas/InfraClusterProvider"
    NodeAgentConfig:
      description: Desired control-plane node-agent configuration.
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: Exact agent release version. An empty value disables agent convergence.
    NodeAgentUpgradeStatus:
      description: The active agent upgrade and latest retry error.
      type: object
      required: [nodeId, targetVersion, method, phase, errorMessage]
      properties:
        nodeId:
          description: ID of the selected control-plane node.
          type: string
          format: uuid
        targetVersion:
          description: Exact version accepted for this upgrade.
          type: string
        method:
          description: Installation method from the controller configuration.
          type: string
        phase:
          description: Pending before installation starts. Running includes retries.
          type: string
          enum: [Pending, Running]
        errorMessage:
          description: Latest failure message while retries continue.
          type: string
    ControlPlaneConfig:
      type: object
      additionalProperties: false
      description: The control-plane configuration in effect, including the desired node-agent version.
      properties:
        configurationId:
          type: string
          format: uuid
          readOnly: true
          description: ID of the current configuration snapshot.
          x-go-type-skip-optional-pointer: true
        desiredCount:
          type: integer
          minimum: 1
          description: The desired number of cluster-level control plane nodes. Creating a cluster with or increasing this count above 1 requires controlPlaneVIP on the cluster unless the development-only allowControlPlaneWithoutVIP setting is enabled.
          x-go-type-skip-optional-pointer: true
        maxSurge:
          type: integer
          minimum: 0
          description: Extra control-plane nodes allowed during a rollout (0 or 1).
        autoScaleDownDisabled:
          type: boolean
          description: When true, automatic control-plane scale-down is disabled, so decreasing desiredCount leaves the surplus nodes in place. When scale-down is enabled it never reduces the control plane below the fault-tolerant floor of three nodes.
        provisioningMonitorDisabled:
          type: boolean
          description: When true, nodes stuck in provisioning past the timeout are not replaced automatically.
        systemReservedMemory:
          type: string
          description: Memory reserved for system daemons. Nodes reserve 16Gi when omitted.
          x-go-type-skip-optional-pointer: true
        machineAnnotations:
          type: object
          additionalProperties:
            type: string
          description: >-
            Annotations applied to control-plane CAPI Machines at creation, including
            scale-out and replacement Machines. Fixed at cluster creation and
            not reconciled after provisioning. Keys under nke.nvidia.com, nke.io,
            nvke.nvidia.com, kubernetes.io, k8s.io, cluster.x-k8s.io and their
            subdomains require an explicit deployment allowlist entry for this
            metadata type.
          x-go-type-skip-optional-pointer: true
        machineLabels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Labels applied to control-plane CAPI Machines at creation, including
            scale-out and replacement Machines. Fixed at cluster creation and
            not reconciled after provisioning. Keys under nke.nvidia.com, nke.io,
            nvke.nvidia.com, kubernetes.io, k8s.io, cluster.x-k8s.io and their
            subdomains require an explicit deployment allowlist entry for this
            metadata type.
          x-go-type-skip-optional-pointer: true
        nodeLabels:
          type: object
          additionalProperties:
            type: string
          description: Labels applied to control-plane nodes, as a map of keys to values. Set at creation.
          x-go-type-skip-optional-pointer: true
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Whether Teleport SSH enrollment is enabled for control plane nodes.
        nico:
          allOf:
            - $ref: "#/components/schemas/NicoControlPlaneProvider"
          description: NICo settings for control-plane nodes.
        launchLayer:
          allOf:
            - $ref: "#/components/schemas/LaunchLayerControlPlaneProvider"
          description: LaunchLayer settings for control-plane nodes.
        infra:
          x-fern-ignore: true
          allOf:
            - $ref: "#/components/schemas/InfraControlPlaneProvider"
          description: Infra provider control plane fields.
        nodeAgentConfig:
          $ref: "#/components/schemas/NodeAgentConfig"
    ClusterControlPlane:
      type: object
      additionalProperties: false
      description: |
        Read-only view of a cluster's control plane: its persisted configuration
        plus an aggregate runtime status.
      required:
        - config
        - status
      properties:
        config:
          allOf:
            - $ref: "#/components/schemas/ControlPlaneConfig"
          description: The persisted control-plane configuration.
        status:
          allOf:
            - $ref: "#/components/schemas/ControlPlaneStatus"
          description: Aggregate runtime status.

    ControlPlaneStatus:
      type: object
      additionalProperties: false
      description: Aggregate runtime status of a cluster's control plane.
      required:
        - nodeCount
        - readyNodeCount
        - kubernetesVersion
        - controlPlaneUpgrading
        - cpNodesRecycling
        - deletingNodeCount
        - deleteRequestedNodeCount
      properties:
        nodeCount:
          type: integer
          description: Total control-plane nodes, including surge nodes.
          x-go-type-skip-optional-pointer: true
          x-order: 1
        readyNodeCount:
          type: integer
          description: Control-plane nodes reporting Kubernetes Ready.
          x-go-type-skip-optional-pointer: true
          x-order: 2
        kubernetesVersion:
          type: string
          description: Current running control-plane Kubernetes version.
          x-go-type-skip-optional-pointer: true
          x-order: 3
        controlPlaneUpgrading:
          allOf:
            - $ref: "#/components/schemas/Condition"
          description: The control plane is being upgraded.
        cpNodesRecycling:
          allOf:
            - $ref: "#/components/schemas/Condition"
          description: Control-plane nodes are being replaced.
        rollout:
          allOf:
            - $ref: "#/components/schemas/ControlPlaneRolloutSummary"
          description: Rollout progress.
        deletingNodeCount:
          type: integer
          description: Control-plane nodes being torn down. Deletes are serialized, so this is at most 1.
          x-go-type-skip-optional-pointer: true
          x-order: 7
        deleteRequestedNodeCount:
          type: integer
          description: Control-plane nodes with an accepted delete that has not started.
          x-go-type-skip-optional-pointer: true
          x-order: 8

    CreateClusterControlPlaneConfig:
      type: object
      additionalProperties: false
      required:
        - desiredCount
      # The control plane follows its cluster's provider, so exactly one provider
      # payload is required whenever this object is supplied.
      not:
        anyOf:
          - required: [nico, infra]
          - required: [nico, launchLayer]
          - required: [infra, launchLayer]
          - allOf:
              - not:
                  required: [nico]
