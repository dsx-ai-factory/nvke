    EtcdKeyRotationStatus:
      type: object
      description: Durable status and retained ownership of an etcd data-encryption-key rotation.
      required: [workflowID, state, phase, startedAt, lastProgressAt]
      properties:
        workflowID:
          type: string
          description: The Temporal workflow ID owning rotation and recovery. Never use as a metric label.
        state:
          description: Whether the owned rotation is running, succeeded, or failed.
          type: string
          enum: [running, succeeded, failed]
        phase:
          type: string
          enum: [prepare, add_secondary, promote_primary, rewrite, remove_old_keys, finalize]
          description: The last entered phase, which a failure retains. A `prepare` failure releases the mutation lock, so start a new rotation workflow after fixing it; a failure in a later phase keeps the lock for recovery of the owning workflow.
        startedAt:
          description: When rotation ownership was accepted by the controller.
          type: string
          format: date-time
        lastProgressAt:
          type: string
          format: date-time
          description: When a phase was entered or a terminal state was recorded. Polling does not advance it.
        completedAt:
          description: When the terminal success or failure was recorded.
          type: string
          format: date-time
        failureReason:
          type: string
          enum: [operation_failed, canceled]
          description: A bounded reason without keys, arbitrary error strings, or secret identifiers.

    CertificateRenewalStatus:
      type: object
      description: The recorded lifecycle state and outcome of a certificate-renewal cycle.
