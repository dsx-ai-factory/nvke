    UpdateClusterRequest:
      type: object
      additionalProperties: false
      properties:
        enableCPNodeRecycling:
          type: boolean
          description: Enable or disable control plane node recycling during version upgrades.
        # Same pattern and rationale as CreateClusterRequest.controlPlaneKubernetesVersion (semver.org version core; no leading "v").
        controlPlaneKubernetesVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          description: |
            Target Kubernetes version for control plane upgrade (must be greater than current version).
            Must be a valid semver version core (X.Y.Z only, e.g. 1.29.7).
            Must not include a leading "v".
            The pattern is the version-core part of the regex from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
        teleportEnabled:
          type: boolean
          description: Enable or disable Teleport SSH enrollment for nodes in this cluster.
        enableEtcdEncryption:
          type: boolean
          description: |
            Set to true to start one-way etcd encryption enablement on a provisioned cluster.
            false is rejected because disabling etcd encryption is not supported.
            If the cluster is already encrypted, true is treated as an idempotent no-op.
            While the operation is running, subsequent UpdateCluster mutations return 409.
        enableOidc:
          type: boolean
          description: |
            Set to true to start one-way OIDC authentication enablement on a provisioned cluster.
            false is rejected because disabling OIDC authentication is not supported.
            If OIDC is already enabled, true is treated as an idempotent no-op.
            Cannot be combined with a control-plane Kubernetes upgrade or etcd encryption
            enablement in the same request. While the operation is running, subsequent
            UpdateCluster mutations return 409.
        controlPlaneConfig:
          $ref: "#/components/schemas/UpdateClusterControlPlaneConfig"
        network:
          allOf:
            - $ref: "#/components/schemas/ClusterNetworkCreateConfig"
          readOnly: true
          description: Immutable cluster network configuration. Any value supplied on update is rejected.

    ClusterNetworkCreateConfig:
      type: object
      additionalProperties: false
      description: Non-default pod or service CIDRs are supported only with the ovn-kubernetes CNI plugin.
      properties:
        podCIDR:
          type: string
          example: "10.240.0.0/16,10.241.0.0/16"
          description: |
            Comma-separated IPv4 pod network CIDRs. Each CIDR must be a private range with a prefix
            length between /12 and /23 and must not overlap another pod CIDR or the serviceCIDR.
            NKE allocates a /24 block to each node. The ranges together must provide enough blocks for all
            desired nodes plus configured surge capacity, or at least one spare block when surge is
            zero. The same capacity rule applies when node pools are created or scaled.
            Defaults to 192.168.0.0/16; a non-default value requires the ovn-kubernetes CNI plugin.
          x-go-type-skip-optional-pointer: true
        serviceCIDR:
          type: string
          example: "10.233.0.0/18"
          description: IPv4 service network CIDR. Must be a private range with a prefix length between /12 and /24. Defaults to 10.96.0.0/12; a non-default value requires the ovn-kubernetes CNI plugin.
          x-go-type-skip-optional-pointer: true

    ClusterNetwork:
      type: object
      additionalProperties: false
      required:
        - podCIDR
        - serviceCIDR
      properties:
        podCIDR:
          type: string
          description: Canonical comma-separated IPv4 pod network CIDRs applied to the cluster.
        serviceCIDR:
          type: string
          description: Canonical IPv4 service network CIDR applied to the cluster.

    InfraProvider:
      type: string
      enum:
