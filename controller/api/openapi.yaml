    UpdateNodePoolRequest:
      type: object
      additionalProperties: false
      not:
        required: [nico, infra]
      description: |
        `nico` and `infra` are mutually exclusive: supply at most one of them (both
        may be omitted). A request carrying both is rejected with 400, as is a
        provider payload that does not match the node pool's cluster.
      # No required fields since all fields are optional
      properties:
        autoProvisionDisabled:
          type: boolean
          description: Whether the node pool is disabled for auto-provisioning.
        autoModeDisabled:
          type: boolean
          description: Whether the node pool is disabled for auto-mode (automatic node recycling).
        provisioningMonitorDisabled:
          type: boolean
          description: Whether the timeout-based provisioning monitor is paused for this node pool.
        systemReservedMemory:
          type: string
          description: The amount of memory to reserve for system processes (e.g., "16Gi", "128Gi")
        kubeReservedMemory:
          type: string
          description: The amount of memory to reserve for Kubernetes processes (e.g., "2Gi", "250Mi"). Set an empty value to restore the kubelet configuration patch default (2Gi).
        description:
          type: string
          description: An optional description for the node pool.
        desiredNodeCount:
          type: integer
          minimum: 0
