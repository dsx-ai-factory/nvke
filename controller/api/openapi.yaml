          type: integer
          minimum: 0
          description: Extra control-plane nodes allowed during a rollout (0 or 1).
        autoScaleDownDisabled:
          type: boolean
          description: When true, automatic control-plane scale-down is disabled, so decreasing desiredCount leaves the surplus nodes in place. When scale-down is enabled it never reduces the control plane below the fault-tolerant floor of three nodes.
        provisioningMonitorDisabled:
          type: boolean
          description: When true, nodes stuck in provisioning past the timeout are not replaced automatically.
        systemReservedMemory:
          type: string
          description: Memory reserved for system daemons.
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Enable or disable Teleport SSH enrollment for control plane nodes.
        nico:
          $ref: "#/components/schemas/NicoControlPlaneProviderUpdate"
        launchLayer:
          $ref: "#/components/schemas/LaunchLayerControlPlaneProviderUpdate"
        infra:
          x-fern-ignore: true
          $ref: "#/components/schemas/InfraControlPlaneProviderUpdate"
        nodeAgentConfig:
          $ref: "#/components/schemas/NodeAgentConfig"
    Cluster:
      description: |
