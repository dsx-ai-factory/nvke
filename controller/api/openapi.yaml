openapi: 3.0.3
info:
  title: NVIDIA Kubernetes Engine (NKE) API
  version: "0.1.0-alpha"
  description: |
    The NKE REST API manages Kubernetes clusters, control planes, node pools and
    nodes on NVIDIA Infra Controller (NICo) infrastructure. It is used by
    Operators who run NKE on their own infrastructure, by their automation, and
    by the `nkectl` CLI.

    **Release:** Alpha (public preview). Examples are illustrative: IDs,
    timestamps and names are placeholders.

    ## Conventions

    **Base URL and content type.** All operations are served under `/api`.
    Request and response bodies are `application/json`.

    **Authentication.** Every operation requires an HTTP bearer token (JWT) in
    the `Authorization` header. The Operator configures which token issuers the
    management plane trusts and which identities are admitted. Tokens must be
    signed with an asymmetric algorithm by a configured issuer, carry `exp` and
    `sub`, and match a configured audience. Admission rules are defined per
    issuer and match either Kubernetes service accounts or SPIFFE IDs.

    | Status | Returned when |
    |---|---|
    | 401 | No token, unknown issuer, invalid signature, expired token, or wrong audience. The response includes a `WWW-Authenticate: Bearer` header. |
    | 403 | The token is valid but its subject matches no admission rule. |

    `nkectl` obtains a short-lived token automatically when run against a
    management cluster.

    **Errors.** Error responses use a single body shape:
    `{ "message": "A cluster already exists with the name \"tenant-a-prod\"" }`

    | Status | Meaning |
    |---|---|
    | 400 | The request failed validation. This includes malformed path or query parameters (for example, a non-UUID ID), duplicate names, and the rule violations listed under each operation. |
    | 401 / 403 | Authentication or admission failure, see above. |
    | 404 | The resource does not exist. No body is returned. |
    | 409 | The request conflicts with an operation already in progress, or with the parent resource's state. |
    | 500 | Unexpected server error. The body carries a message. |

    **Asynchronous operations.** Create operations return 201 with the persisted
    object immediately; provisioning continues in the background. Delete
    operations return 202 and set the resource's `deleting` condition. Track
    progress by polling the resource and reading its conditions. There is no
    separate operation resource or callback.

    **Update (PATCH) semantics.** PATCH operations use a field-level merge. They
    do not follow RFC 7386 JSON Merge Patch.

    | Value sent | Effect |
    |---|---|
    | Field omitted | Unchanged. |
    | `null` | Rejected with 400. No field is nullable, and `null` does not clear a value. |
    | `""` (empty string) | Stored as empty for `description` and `systemReservedMemory`. For `kubeReservedMemory`, restores the default. Rejected for `nico.osProfile`. |
    | `[]` (empty array) | Clears the list. UUID arrays are de-duplicated. |
    | `nico` sub-object | Merged field by field, not replaced. |

    Unknown fields in a PATCH body are rejected with 400.

    **Lists.** List operations return all matching results in a single response.
    Pagination and ordering are not supported in this release. Filters are exact
    match. Unrecognized query parameters are ignored.

    ## Unauthenticated endpoints

    The following are served without a token and are outside the `/api`
    resource model.

    | Path | Purpose |
    |---|---|
    | `GET /openapi.yaml` | The OpenAPI 3.0 specification for this API. |
    | `GET /api/docs/` | Interactive API documentation (Swagger UI). |
    | `GET /healthz` | Liveness. Returns `{"status":"ok"}`. |
    | `GET /readyz` | Readiness, including dependency checks. Returns 503 when a dependency is unavailable. |

    ## Identity

    Every resource has a server-assigned UUID `id`, which is used in paths.
    Cluster names are unique per management plane; node pool names are unique
    within a cluster. Cluster kubeconfigs are retrieved with `nkectl`, not
    through this API.
servers:
  # The embedded Swagger UI and the request validator use the relative URL:
  # the API is served under /api on whichever host runs the controller.
  - url: /api
    x-fern-ignore: true
  # Fern and Redoc need an absolute URL to render request examples. Replace
  # the host with your management plane's.
  - url: https://nke.acme.example/api
    description: Your management plane
    x-fern-server-name: Management plane

# Declared once rather than per operation, so a new operation requires a token by
# default. The endpoints that need no token are not in this file at all;
# internal/server registers them and internal/auth/routes.go is the list.
security:
  - bearerAuth: []

tags:
  - name: Clusters
    description: |
      A Kubernetes cluster. Holds the Kubernetes version, network, CNI, etcd
      encryption, control-plane configuration and conditions.

      **Infrastructure provider.** Clusters in this release run on NVIDIA Infra
      Controller (NICo) bare-metal infrastructure. Each cluster, control plane
      and node pool carries a `nico` object with the NICo identifiers it uses:
      organization, site and VPC at the cluster level; instance type,
      networking, SSH key groups and OS profile at the control-plane and node
      pool level. A cluster's provider is fixed at creation.

      **Kubernetes versions.** Versions are semantic-version cores (X.Y.Z) with
      no leading `v`. Control-plane upgrades move forward one minor version at a
      time; downgrades and major-version changes are rejected. Worker node pools
      may trail the control plane by at most 3 minor versions. A new node pool
      starts at the cluster's Kubernetes version. `controlPlaneKubernetesVersion`
      and a pool's `kubernetesVersion` are desired versions; the control plane's
      current running version is reported in `ControlPlaneStatus.kubernetesVersion`.

      **Networking.** Supported CNI plugins are calico (default version 3.30.1)
      and ovn-kubernetes (default version 1.4.0). Pod and service CIDRs are IPv4,
      private, and immutable after
      creation; the defaults are 192.168.0.0/16 for pods and 10.96.0.0/12 for
      services. NKE allocates a /24 from the pod CIDR to each node, so the pod
      CIDR must have room for every desired node plus surge, or one spare block
      when surge is 0. This is checked when clusters and node pools are created
      or scaled. Set `controlPlaneVIP` to use a virtual IP (kube-vip) as the API
      server endpoint; when omitted, the first control-plane node's IP is the
      endpoint. The VIP must not fall inside the pod or service CIDR.
  - name: Control plane
    description: |
      NKE manages each cluster's control plane through a dedicated control-plane
      controller. You declare the control plane once, in `controlPlaneConfig`,
      and NKE provisions, upgrades and replaces control-plane nodes to match it.
      Node pools always contain worker nodes.

      - **Size.** `controlPlaneConfig.desiredCount` sets the number of
        control-plane nodes. It is required when you create a cluster.
      - **Rollouts.** When the control-plane configuration changes (OS profile
        or Kubernetes version), NKE compares each control-plane node with the
        desired configuration and replaces drifted nodes. `maxSurge` (0 or 1)
        controls whether a replacement node is added before the old one is
        removed. Progress is reported in `ControlPlaneStatus.rollout` and, per
        node, in `Node.controlPlaneRollout`.
      - **Recycling gate.** When `enableCPNodeRecycling` is false, drifted nodes
        are detected and reported as pending but are not replaced until an
        operator acts.
      - **Deletes.** Control-plane node deletes are serialized. A delete request
        is recorded first (`deleteRequested`) and NKE starts teardowns one at a
        time. A delete is rejected if it would leave fewer than 3 healthy, joined
        control-plane nodes.

      The control plane is read at `GET /clusters/{clusterID}/control-plane` and
      changed through `PATCH /clusters/{clusterID}`. Its configuration history is
      an ordered list of snapshots of control-plane configuration changes.

      **OS profiles (`osProfile`).** The OS and first-boot configuration for
      every node come from an OS profile the Operator supplies to the management
      plane, optionally together with a config profile for the node's role.
      Control-plane and node pool requests select them by name in
      `nico.osProfile` and `nico.configProfile`. Changing `osProfile` on a node pool or on the control
      plane triggers a rollout of the affected nodes to the new profile.
  - name: Node pools
    description: |
      A group of worker nodes sharing an instance type, OS profile and
      Kubernetes version. Node pool names are unique within a cluster. The
      configuration history of a node pool is an ordered list of snapshots of
      its configuration changes.
  - name: Node sets
    description: |
      A read-only, immutable snapshot of a node pool's configuration at a point
      in time. `NodePool.currentNodeSetID` identifies the active one.
  - name: Nodes
    description: |
      A single machine in a cluster, in a node pool or in the control plane,
      with lifecycle and health conditions.
  - name: Catalog
    description: Profile catalogs.

paths:
  /clusters:
    get:
      tags: [Clusters]
      summary: List clusters
      operationId: listClusters
      description: Returns all clusters, or the cluster whose name matches `name`.
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter clusters by name (exact match)
      responses:
        "200":
          description: A list of clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClustersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Clusters]
      summary: Create a cluster
      operationId: createCluster
      description: |
        Creates a cluster and starts provisioning. The cluster is returned before
        provisioning completes.

        Returns 400 for, among others: a duplicate cluster name; missing
        `nico.orgID`, `siteID` or `vpcID`; an unsupported `cniPlugin`; a
        missing `controlPlaneConfig.nico.osProfile`; a
        control-plane `maxSurge` greater than 1; a pod CIDR too small for the
        requested nodes plus surge; a `controlPlaneVIP` inside the pod or
        service CIDR.
      requestBody:
        required: true
        description: The cluster to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClusterRequest"
            example:
              name: tenant-a-prod
              controlPlaneKubernetesVersion: 1.33.4
              cniPlugin: ovn-kubernetes
              etcdEncrypted: true
              network:
                podCIDR: 192.168.0.0/16
                serviceCIDR: 10.96.0.0/12
              nico:
                orgID: dipfedrcvjiw
                siteID: 4f6a8c2e-1b3d-4e5f-a7b9-c1d3e5f7a9b1
                vpcID: 6a8c0e4f-3d5b-4f7a-b9c1-e3f5a7b9c1d3
              controlPlaneConfig:
                desiredCount: 3
                maxSurge: 1
                systemReservedMemory: 16Gi
                nico:
                  instanceTypePreference: [1c3e5a7f-9b1d-4f3e-a5c7-e9b1d3f5a7c9]
                  vpcPrefixIDs: [2d4f6b8a-0c2e-4a4f-b6d8-f0c2e4a6b8d0]
                  sshKeyGroupIDs: [3e5a7c9b-1d3f-4b5a-c7e9-a1d3f5b7c9e1]
                  osProfile: example-ubuntu-24.04-amd64
                  configProfile: example-control-plane
              nodePools:
                - name: gpu-workers
                  nodeNamePrefix: w
                  desiredNodeCount: 2
                  systemReservedMemory: 16Gi
                  nodeLabels: [nvidia.com/gpu.present=true]
                  recycleBudget: 1
                  nico:
                    instanceTypeID: 0d2f4a6c-8e0b-4d2f-9a4c-6e8b0d2f4a6c
                    vpcPrefixIDs: [2d4f6b8a-0c2e-4a4f-b6d8-f0c2e4a6b8d0]
                    sshKeyGroupIDs: [3e5a7c9b-1d3f-4b5a-c7e9-a1d3f5b7c9e1]
                    osProfile: example-ubuntu-24.04-amd64
                    configProfile: example-worker
      responses:
        "201":
          description: Cluster created; provisioning has started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "400":
          description: The request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clusters/{clusterID}:
    parameters:
      - name: clusterID
        in: path
        required: true
        description: Cluster ID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Clusters]
      summary: Get a cluster
      operationId: getCluster
      description: |
        Returns one cluster. Once provisioning finishes, `conditions.provisioning`
        is False and `conditions.provisioned` is True.
      responses:
        "200":
          description: The requested cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "404":
          description: Cluster not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Clusters]
      summary: Update a cluster
      operationId: updateCluster
      description: |
        All fields are optional. See the API description for merge rules.

        Returns 400 for, among others: a Kubernetes downgrade, major-version
        change, or a jump of more than one minor version; an upgrade that would
        leave a worker pool more than 3 minor versions behind;
        `enableEtcdEncryption: false` or `enableOidc: false`; combining OIDC or
        etcd enablement with a version upgrade; etcd or OIDC enablement on a
        cluster that is not provisioned or is deleting; any `network` value;
        a control-plane `maxSurge` greater than 1.

        Returns 409 when another mutually exclusive cluster operation is in
        progress (`etcd_encryption`, `k8s_upgrade`, `cp_nodes_recycling`,
        `oidc_enable`), or the control plane is upgrading or recycling nodes.
      requestBody:
        required: true
        description: The fields to change. All are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClusterRequest"
            examples:
              controlPlaneUpgrade:
                summary: Control-plane upgrade
                value:
                  controlPlaneKubernetesVersion: 1.34.2
                  enableCPNodeRecycling: true
              enableOidc:
                summary: Enable OIDC authentication (one-way)
                value:
                  enableOidc: true
              controlPlaneChange:
                summary: Resize the control plane and move it to a new OS profile
                value:
                  controlPlaneConfig:
                    desiredCount: 5
                    nico:
                      osProfile: example-ubuntu-24.04-amd64-r2
      responses:
        "200":
          description: Update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "400":
          description: The request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "404":
          description: Cluster not found. No body is returned.
        "409":
          description: |
            Another mutually exclusive cluster operation is in progress. The
            message names the operation (etcd_encryption, k8s_upgrade,
            cp_nodes_recycling, oidc_enable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
              example:
                message: 'cluster update rejected: k8s_upgrade in progress since 2026-09-24T09:00:00Z'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Clusters]
      summary: Delete a cluster
      operationId: deleteCluster
      description: |
        Starts deletion and sets `conditions.deleting` to `True`. A cluster can
        be deleted in any state, including while it is provisioning or
        upgrading.
      responses:
        "202":
          description: Deletion started
        "404":
          description: Cluster not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clusters/{clusterID}/control-plane:
    parameters:
      - name: clusterID
        in: path
        required: true
        description: Cluster ID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Control plane]
      summary: Get a cluster's control plane
      description: |
        Read-only view of the control plane: the persisted configuration plus
        aggregate runtime status (node counts, current Kubernetes version,
        rollout progress, and upgrade and recycling conditions). Change the
        control plane through `PATCH /clusters/{clusterID}`.
      operationId: getClusterControlPlane
      responses:
        "200":
          description: Control-plane configuration and status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterControlPlane"
        "404":
          description: Cluster not found. No body is returned.

  /clusters/{clusterID}/control-plane/configHistory:
    parameters:
      - name: clusterID
        in: path
        required: true
        description: Cluster ID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Control plane]
      summary: Get control-plane config history
      operationId: getClusterControlPlaneConfigHistory
      description: |
        Returns the control-plane configuration change history, oldest first.
        Each entry shows which rollout-relevant fields changed relative to the
        previous snapshot. Use it to resolve the `pinnedConfigurationID` on each
        control-plane node and the cluster's desired `configurationId`.
      responses:
        "200":
          description: The control-plane config history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneConfigHistory"
        "404":
          description: Cluster not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodePools:
    get:
      tags: [Node pools]
      summary: List node pools
      operationId: listNodePools
      description: Returns all node pools, filtered by the query parameters.
      parameters:
        - name: clusterID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by cluster ID
        - name: clusterName
          in: query
          required: false
          schema:
            type: string
          description: Filter by cluster name (exact match)
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by node pool name (exact match)
      responses:
        "200":
          description: A list of node pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodePoolsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Node pools]
      summary: Create a node pool
      operationId: createNodePool
      description: |
        Creates a worker node pool and starts provisioning. The pool takes the
        cluster's Kubernetes version.

        Returns 400 for, among others: parent cluster not found; a duplicate
        pool name in the cluster; missing `nico.instanceTypeID`
        or `nico.osProfile`; not exactly one of
        `subnetIDs` and `vpcPrefixIDs`; a pod CIDR too small for the requested
        nodes.
      requestBody:
        required: true
        description: The node pool to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodePoolRequest"
            example:
              clusterID: 9b1d4e2a-3c5f-4a7b-8e9d-0f1a2b3c4d5e
              name: gpu-workers-b300
              nodeNamePrefix: wb
              desiredNodeCount: 4
              systemReservedMemory: 32Gi
              kubeReservedMemory: 4Gi
              nodeLabels: [nvidia.com/gpu.product=B300]
              description: Reserved for team-b training jobs
              recycleBudget: 1
              nico:
                instanceTypeID: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                vpcPrefixIDs: [2d4f6b8a-0c2e-4a4f-b6d8-f0c2e4a6b8d0]
                sshKeyGroupIDs: [3e5a7c9b-1d3f-4b5a-c7e9-a1d3f5b7c9e1]
                osProfile: example-ubuntu-24.04-amd64
                configProfile: example-worker
                diskSelectionStrategy: largest
      responses:
        "201":
          description: Node pool created; provisioning has started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePool"
        "400":
          description: The request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "409":
          description: The parent cluster is being deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
              example:
                message: Cannot create node pool when parent cluster is deleting
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodePools/{nodePoolID}:
    parameters:
      - name: nodePoolID
        in: path
        required: true
        description: Node pool ID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Node pools]
      summary: Get a node pool
      operationId: getNodePool
      description: Returns one node pool.
      responses:
        "200":
          description: The requested node pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePool"
        "404":
          description: Node pool not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Node pools]
      summary: Update a node pool
      operationId: updateNodePool
      description: |
        All fields are optional. Changes to the Kubernetes version, OS profile
        or other node configuration create a new NodeSet and roll the pool's
        nodes to it.

        Returns 400 for, among others: sending a field that is fixed at
        creation (for example `instanceTypeID`); `nico.osProfile: ""`.
      requestBody:
        required: true
        description: The fields to change. All are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodePoolRequest"
            examples:
              scale:
                summary: Scale
                value:
                  desiredNodeCount: 6
              upgrade:
                summary: Kubernetes upgrade with surge
                value:
                  kubernetesVersion: 1.34.2
                  maxSurge: 2
                  recycleBudget: 2
              newRelease:
                summary: Move to a new OS profile and restore the default kube-reserved memory
                value:
                  nico:
                    osProfile: example-ubuntu-24.04-amd64-r2
                  kubeReservedMemory: ''
      responses:
        "200":
          description: Update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePool"
        "400":
          description: The request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "404":
          description: Node pool not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Node pools]
      summary: Delete a node pool
      # Legacy control-plane node pools: deleting the last one is rejected; the
      # cluster is deleted with DELETE /clusters/{clusterID} instead.
      description: |
        Deletes a node pool from a running cluster. Also returns 202, with no
        further effect, if the pool or its cluster is already being deleted.
      operationId: deleteNodePool
      responses:
        "202":
          description: Deletion started
        "400":
          description: The request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        "404":
          description: Node pool not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodeSets:
    get:
      tags: [Node sets]
      summary: List node sets
      operationId: listNodeSets
      description: Returns all node sets, or those of one node pool.
      parameters:
        - name: nodePoolID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by node pool ID
      responses:
        "200":
          description: A list of node sets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodeSetsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodeSets/{nodeSetID}:
    parameters:
      - name: nodeSetID
        in: path
        required: true
        description: Node set ID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Node sets]
      summary: Get a node set
      operationId: getNodeSet
      description: Returns one node set.
      responses:
        "200":
          description: The requested node set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSet"
        "404":
          description: Node set not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodes:
    get:
      tags: [Nodes]
      summary: List nodes
      operationId: listNodes
      description: Returns all nodes, filtered by the query parameters. All filters are exact match.
      parameters:
        - name: clusterID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by cluster ID
        - name: nodePoolID
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by node pool ID
        - name: clusterName
          in: query
          required: false
          schema:
            type: string
          description: Filter by cluster name (exact match)
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by node name (exact match)
        - name: controlPlane
          in: query
          required: false
          schema:
            type: boolean
          description: '`true` returns only control-plane nodes; `false` only workers'
      responses:
        "200":
          description: A list of nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /nodes/{nodeID}:
    parameters:
      - name: nodeID
        in: path
        required: true
        description: Node ID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Nodes]
      summary: Get a node
      operationId: getNode
      description: |
        Returns one node. Control-plane nodes do not belong to a node pool, so
        their `nodePoolID` and `nodeSetID` are the nil UUID. `nico` is omitted
        when none of its fields are set.
      responses:
        "200":
          description: The requested node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "404":
          description: Node not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Nodes]
      summary: Delete a node
      description: |
        Deletes a single node from a running cluster. Include a
        `machineHealthIssue` to flag the underlying machine for repair.

        For control-plane nodes, a delete sets `deleteRequested`; NKE then
        starts teardowns one node at a time. `forceUnreachable` is applied
        automatically when the node is unhealthy.

        Also returns 202, with no further effect, if the node, pool or cluster
        is already being deleted or a delete is already requested.

        Returns 400 when deletion would leave no joined control-plane node or
        `machineHealthIssue` is invalid. Delete the cluster to remove its last
        joined control-plane node.
        Deleting a control-plane node requires controlPlaneVIP because the controller
        replaces it. Worker node deletion is unaffected.
      operationId: deleteNode
      requestBody:
        required: false
        description: Optional. Flags the machine for repair, or tolerates an unreachable node.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteNodeRequest"
            example:
              machineHealthIssue:
                category: Hardware
                summary: Node only has 7 GPUs
                details: The node reboot completed at 12:51Z and it started reporting XID 79 at 14:09Z
              forceUnreachable: true
      responses:
        "202":
          description: Deletion started or, for control-plane nodes, recorded
        "400":
          description: The request failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
              example:
                message: 'cannot delete control-plane node "tenant-a-prod-cp-0002": only 2 joined control-plane node(s) would remain, below the minimum of 3 needed for etcd to survive another failure. Raise the control-plane desired count first so a replacement joins before this node is removed, or delete the cluster instead'
        "404":
          description: Node not found. No body is returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /osProfiles:
    get:
      x-fern-ignore: true
      tags: [Catalog]
      summary: List OS profiles
      operationId: listOSProfiles
      description: Lists the OS profiles available to the management plane.
      responses:
        "200":
          description: A list of OS profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOSProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configProfiles:
    get:
      x-fern-ignore: true
      tags: [Catalog]
      summary: List config profiles
      operationId: listConfigProfiles
      description: Lists the config profiles available to the management plane.
      responses:
        "200":
          description: A list of config profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConfigProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  responses:
    # Both come from the authentication middleware, which runs before routing, so
    # every operation can answer them.
    Unauthorized:
      description: No valid bearer token was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericError"
    Forbidden:
      description: The token verified, but its subject matches no admission rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericError"

  securitySchemes:
    # Any JWT signed by a trusted issuer. Which issuers, and which subjects they
    # admit, is operator configuration; see internal/auth and the README.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT from an issuer the Operator has configured, carried as `Authorization:
        Bearer <token>`.

  schemas:
    #--------------------------------
    #  Cluster
    #--------------------------------
    CreateClusterRequest:
      type: object
      required:
        - name
        - controlPlaneKubernetesVersion
        - etcdEncrypted
      # A cluster picks its provider at creation, so exactly one provider payload is
      # required. Rejecting "both or neither" leaves exactly one.
      not:
        anyOf:
          - required: [nico, infra]
          - allOf:
              - not:
                  required: [nico]
              - not:
                  required: [infra]
      description: |
        A cluster and, optionally, its initial node pools. The provider payload is
        fixed at creation.
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          minLength: 1
          maxLength: 55
          example: "my-cluster"
          description: Cluster name. Lowercase DNS label, unique per management plane. Node names are derived from it.
          x-order: 1
        # controlPlaneKubernetesVersion: validated by pattern (semver version core only, no leading "v").
        # Pattern is the version-core part of the regex from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
        # We disallow leading "v" because provisioning templates add "v" when building URLs (e.g. kubeadm_v{{ .KubernetesVersion }}).
        controlPlaneKubernetesVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          example: "1.33.4"
          description: Kubernetes version for the cluster, as X.Y.Z with no leading "v".
          x-order: 5
        cniPlugin:
          type: string
          enum: [calico, ovn-kubernetes]
          example: "ovn-kubernetes"
          description: CNI plugin. Defaults to ovn-kubernetes when omitted. calico is an explicit override.
          x-go-type-skip-optional-pointer: true
          x-order: 6
        cniVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          example: "1.4.0"
          description: CNI version, as X.Y.Z. Defaults to 3.30.1 for calico or 1.4.0 for ovn-kubernetes.
          x-order: 7
        etcdEncrypted:
          type: boolean
          example: true
          description: Encrypt etcd at rest. Can be turned on later with `enableEtcdEncryption`; cannot be turned off.
          x-order: 8
        controlPlaneVIP:
          type: string
          format: ipv4
          description: |
            Virtual IP for the API server through kube-vip. Omit to skip kube-vip and
            use the first control-plane node's IP as the API server endpoint. Must not
            fall inside the pod or service CIDR. An explicit empty string is rejected.
            Without a VIP, a new cluster must have exactly one desired control-plane
            node. Control-plane scale-up above one node, upgrades, and configuration
            changes that replace control-plane nodes require a VIP. Recreate a no-VIP
            cluster with controlPlaneVIP to make those operations available.
          x-go-type-skip-optional-pointer: true
          x-order: 9
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Enable Teleport SSH enrollment for nodes in this cluster. When omitted, the server-side default for the site is applied.
          x-order: 10
        network:
          $ref: "#/components/schemas/ClusterNetworkCreateConfig"
        nodePools:
          type: array
          items:
            $ref: "#/components/schemas/NodePoolCreateConfig"
          description: Initial worker node pools.
          example:
            - name: "gpu-workers"
              nodeNamePrefix: "w"
              desiredNodeCount: 2
              nico:
                subnetIDs:
                  - "123e4567-e89b-12d3-a456-426614174000"
                instanceTypeID: "123e4567-e89b-12d3-a456-426614174001"
          x-order: 12
        controlPlaneConfig:
          $ref: "#/components/schemas/CreateClusterControlPlaneConfig"
        nico:
          $ref: "#/components/schemas/NicoClusterProvider"
        infra:
          x-fern-ignore: true
          $ref: "#/components/schemas/InfraClusterProvider"
    ControlPlaneConfig:
      type: object
      additionalProperties: false
      description: The control-plane configuration in effect.
      properties:
        configurationId:
          type: string
          format: uuid
          readOnly: true
          description: ID of the current configuration snapshot.
          x-go-type-skip-optional-pointer: true
        desiredCount:
          type: integer
          minimum: 1
          description: The desired number of cluster-level control plane nodes. Creating a cluster with or increasing this count above 1 requires controlPlaneVIP on the cluster.
          x-go-type-skip-optional-pointer: true
        maxSurge:
          type: integer
          minimum: 0
          description: Extra control-plane nodes allowed during a rollout (0 or 1).
        provisioningMonitorDisabled:
          type: boolean
          description: When true, nodes stuck in provisioning past the timeout are not replaced automatically.
        systemReservedMemory:
          type: string
          description: Memory reserved for system daemons. Nodes reserve 16Gi when omitted.
          x-go-type-skip-optional-pointer: true
        nodeLabels:
          type: array
          items:
            type: string
          description: Labels applied to control-plane nodes, as key=value.
          x-go-type-skip-optional-pointer: true
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Whether Teleport SSH enrollment is enabled for control plane nodes.
        nico:
          allOf:
            - $ref: "#/components/schemas/NicoControlPlaneProvider"
          description: NICo settings for control-plane nodes.
        infra:
          x-fern-ignore: true
          allOf:
            - $ref: "#/components/schemas/InfraControlPlaneProvider"
          description: Infra provider control plane fields.

    ClusterControlPlane:
      type: object
      additionalProperties: false
      description: |
        Read-only view of a cluster's control plane: its persisted configuration
        plus an aggregate runtime status.
      required:
        - config
        - status
      properties:
        config:
          allOf:
            - $ref: "#/components/schemas/ControlPlaneConfig"
          description: The persisted control-plane configuration.
        status:
          allOf:
            - $ref: "#/components/schemas/ControlPlaneStatus"
          description: Aggregate runtime status.

    ControlPlaneStatus:
      type: object
      additionalProperties: false
      description: Aggregate runtime status of a cluster's control plane.
      required:
        - nodeCount
        - readyNodeCount
        - kubernetesVersion
        - controlPlaneUpgrading
        - cpNodesRecycling
        - deletingNodeCount
        - deleteRequestedNodeCount
      properties:
        nodeCount:
          type: integer
          description: Total control-plane nodes, including surge nodes.
          x-go-type-skip-optional-pointer: true
          x-order: 1
        readyNodeCount:
          type: integer
          description: Control-plane nodes reporting Kubernetes Ready.
          x-go-type-skip-optional-pointer: true
          x-order: 2
        kubernetesVersion:
          type: string
          description: Current running control-plane Kubernetes version.
          x-go-type-skip-optional-pointer: true
          x-order: 3
        controlPlaneUpgrading:
          allOf:
            - $ref: "#/components/schemas/Condition"
          description: The control plane is being upgraded.
        cpNodesRecycling:
          allOf:
            - $ref: "#/components/schemas/Condition"
          description: Control-plane nodes are being replaced.
        rollout:
          allOf:
            - $ref: "#/components/schemas/ControlPlaneRolloutSummary"
          description: Rollout progress.
        deletingNodeCount:
          type: integer
          description: Control-plane nodes being torn down. Deletes are serialized, so this is at most 1.
          x-go-type-skip-optional-pointer: true
          x-order: 7
        deleteRequestedNodeCount:
          type: integer
          description: Control-plane nodes with an accepted delete that has not started.
          x-go-type-skip-optional-pointer: true
          x-order: 8

    CreateClusterControlPlaneConfig:
      type: object
      additionalProperties: false
      required:
        - desiredCount
      # The control plane follows its cluster's provider, so exactly one provider
      # payload is required whenever this object is supplied.
      not:
        anyOf:
          - required: [nico, infra]
          - allOf:
              - not:
                  required: [nico]
              - not:
                  required: [infra]
      description: |
        Writable cluster-level control plane configuration supplied at cluster creation.
        Required when you create a cluster.
        `nico` carries the NICo settings for the control-plane nodes; it is required
        for a NICo cluster.
      properties:
        desiredCount:
          type: integer
          minimum: 1
          description: The desired number of cluster-level control plane nodes. Must be at least 1. Values above 1 require controlPlaneVIP on the cluster.
          x-go-type-skip-optional-pointer: true
        maxSurge:
          type: integer
          minimum: 0
          description: Extra control-plane nodes allowed during a rollout (0 or 1).
        provisioningMonitorDisabled:
          type: boolean
          default: false
          description: When true, nodes stuck in provisioning past the timeout are not replaced automatically.
        systemReservedMemory:
          type: string
          default: "16Gi"
          description: Memory reserved for system daemons. Nodes reserve 16Gi when omitted.
          x-go-type-skip-optional-pointer: true
        nodeLabels:
          type: array
          items:
            type: string
          description: Labels applied to control-plane nodes, as key=value.
          x-go-type-skip-optional-pointer: true
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Whether Teleport SSH enrollment is enabled for control plane nodes. When omitted, the server-side default for the site is applied.
        nico:
          $ref: "#/components/schemas/NicoControlPlaneProviderCreate"
        infra:
          x-fern-ignore: true
          $ref: "#/components/schemas/InfraControlPlaneProvider"
    UpdateClusterControlPlaneConfig:
      type: object
      additionalProperties: false
      not:
        required: [nico, infra]
      description: |
        Changes to `osProfile` or the Kubernetes version start a control-plane
        rollout. All fields are optional. A provider payload that does not match the
        cluster's provider is rejected with 400.
        Rollout-triggering changes require controlPlaneVIP. maxSurge alone does not
        trigger a rollout and remains mutable without a VIP.
      properties:
        desiredCount:
          type: integer
          minimum: 1
          description: |
            The desired number of cluster-level control plane nodes. Must be at least 1.
            Increasing the count above 1 requires controlPlaneVIP on the cluster.
        maxSurge:
          type: integer
          minimum: 0
          description: Extra control-plane nodes allowed during a rollout (0 or 1).
        provisioningMonitorDisabled:
          type: boolean
          description: When true, nodes stuck in provisioning past the timeout are not replaced automatically.
        systemReservedMemory:
          type: string
          description: Memory reserved for system daemons.
        nodeLabels:
          type: array
          items:
            type: string
          description: Replaces the existing labels.
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Enable or disable Teleport SSH enrollment for control plane nodes.
        nico:
          $ref: "#/components/schemas/NicoControlPlaneProviderUpdate"
        infra:
          x-fern-ignore: true
          $ref: "#/components/schemas/InfraControlPlaneProviderUpdate"
    Cluster:
      description: |
        A Kubernetes cluster. Holds the Kubernetes version, network, CNI, etcd
        encryption, control-plane configuration and conditions.
      type: object
      required:
        - id
        - name
        - controlPlaneKubernetesVersion
        - cniPlugin
        - cniVersion
        - etcdEncrypted
        - network
        - createdAt
        - conditions
      properties:
        id:
          type: string
          format: uuid
          description: Cluster ID.
          x-order: 1
        name:
          type: string
          description: Cluster name.
          x-order: 2
        controlPlaneKubernetesVersion:
          type: string
          description: Desired control-plane Kubernetes version. The running version is in ControlPlaneStatus.
          x-order: 6
        cniPlugin:
          type: string
          description: CNI plugin.
          x-order: 7
        cniVersion:
          type: string
          description: CNI version.
          x-order: 8
        etcdEncrypted:
          type: boolean
          example: true
          description: Whether etcd is encrypted at rest.
          x-order: 9
        controlPlaneVIP:
          type: string
          format: ipv4
          description: API server VIP, if configured.
          x-order: 10
        enableCPNodeRecycling:
          type: boolean
          default: false
          description: |
            When true, control-plane upgrades and configuration changes replace nodes
            automatically. When false, nodes needing replacement are reported as pending and
            wait for an operator.
          x-order: 11
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          default: false
          description: Whether Teleport SSH enrollment is enabled for nodes in this cluster.
          x-order: 12
        controlPlaneConfig:
          allOf:
            - $ref: "#/components/schemas/ControlPlaneConfig"
          description: Current control-plane configuration.
        network:
          allOf:
            - $ref: "#/components/schemas/ClusterNetwork"
          description: Pod and service network.
        createdAt:
          type: string
          format: date-time
          description: Creation time.
          x-order: 15
        conditions:
          allOf:
            - $ref: "#/components/schemas/ClusterConditions"
          description: Lifecycle conditions.
        nico:
          allOf:
            - $ref: "#/components/schemas/NicoClusterProvider"
          description: NICo identifiers.
        infra:
          x-fern-ignore: true
          allOf:
            - $ref: "#/components/schemas/InfraClusterProvider"
          description: Infra provider fields.
    UpdateClusterRequest:
      description: Changes to a cluster. All fields are optional; unknown fields are rejected.
      type: object
      additionalProperties: false
      properties:
        enableCPNodeRecycling:
          type: boolean
          description: Turn automatic control-plane node replacement on or off.
        # Same pattern and rationale as CreateClusterRequest.controlPlaneKubernetesVersion (semver.org version core; no leading "v").
        controlPlaneKubernetesVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          description: |
            Target control-plane version, as X.Y.Z with no leading "v". Must be newer than
            the current version by at most one minor version and keep every worker pool
            within 3 minor versions.
            The cluster must have controlPlaneVIP configured.
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Enable or disable Teleport SSH enrollment for nodes in this cluster.
        enableEtcdEncryption:
          type: boolean
          description: |
            `true` starts one-way etcd encryption on a provisioned cluster. `false` is
            rejected. `true` on an already-encrypted cluster does nothing. Other updates
            return 409 while it runs.
        enableOidc:
          type: boolean
          description: |
            `true` starts one-way OIDC authentication enablement. `false` is rejected.
            Cannot be combined with a control-plane upgrade or etcd enablement. Other
            updates return 409 while it runs.
        controlPlaneConfig:
          $ref: "#/components/schemas/UpdateClusterControlPlaneConfig"
        network:
          allOf:
            - $ref: "#/components/schemas/ClusterNetworkCreateConfig"
          readOnly: true
          description: |
            The cluster network cannot be changed after creation; any network value in an
            update is rejected.

    ClusterNetworkCreateConfig:
      type: object
      additionalProperties: false
      description: Pod and service network. Immutable after creation. Defaults apply when omitted.
      properties:
        podCIDR:
          type: string
          example: "192.168.0.0/16"
          description: |
            Comma-separated IPv4 pod CIDRs. Each must be private, with a prefix length from
            /12 to /23, and must not overlap the others or the service CIDR. Must have room
            for a /24 per desired node plus surge. Default 192.168.0.0/16.
          x-go-type-skip-optional-pointer: true
        serviceCIDR:
          type: string
          example: "10.96.0.0/12"
          description: IPv4 service CIDR, private, /12 to /24. Default 10.96.0.0/12.
          x-go-type-skip-optional-pointer: true

    ClusterNetwork:
      description: Pod and service network in effect. Both fields are always present.
      type: object
      additionalProperties: false
      required:
        - podCIDR
        - serviceCIDR
      properties:
        podCIDR:
          type: string
          description: Comma-separated IPv4 pod CIDRs in effect.
        serviceCIDR:
          type: string
          description: IPv4 service CIDR in effect.

    ListClustersResponse:
      description: A list of clusters.
      type: object
      required:
        - clusters
      properties:
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
          description: Clusters.

    #--------------------------------
    # Node Pool
    #--------------------------------
    CloudInitFile:
      x-fern-ignore: true
      description: A file written by cloud-init on CAPI-backed nodes.
      type: object
      required:
        - path
        - content
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: Full path on disk where the file should be written.
        owner:
          type: string
          minLength: 1
          maxLength: 256
          description: File ownership, for example `root:root`.
        permissions:
          type: string
          minLength: 1
          maxLength: 16
          description: File permissions, for example `0644`.
        content:
          type: string
          minLength: 1
          maxLength: 10240
          description: File contents written by cloud-init.

    CreateNodePoolRequest:
      description: |
        A node pool to create: the parent cluster plus a NodePoolCreateConfig.
      allOf:
        - type: object
          required:
            - clusterID
          properties:
            clusterID:
              type: string
              format: uuid
              description: Parent cluster.
              x-order: 0
        - $ref: "#/components/schemas/NodePoolCreateConfig"

    NodeNamePrefix:
      type: string
      minLength: 1
      description: |
        Prefix for generated node names: `<cluster name>-<nodeNamePrefix>-<suffix>`.
        CWE assigns suffix as a 4-digit decimal number (0000–9999).
        Generated names must fit within 63 characters (Kubernetes Node name limit).
        Maximum prefix length depends on cluster name length.

    NodePoolCreateConfig:
      type: object
      description: |
        A node pool and its provider settings. The provider follows the cluster's
        and is fixed at creation.
      required:
        - name
        - desiredNodeCount
        - nodeNamePrefix
      # See CreateClusterRequest for why this is spelled with `not` instead of `oneOf`.
      not:
        anyOf:
          - required: [nico, infra]
          - allOf:
              - not:
                  required: [nico]
              - not:
                  required: [infra]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
          minLength: 1
          maxLength: 253
          description: Unique within the cluster. Immutable.
          example: "gpu-workers"
          x-order: 1
        nodeNamePrefix:
          $ref: "#/components/schemas/NodeNamePrefix"
        systemReservedMemory:
          type: string
          description: Memory reserved for system daemons. Nodes reserve 16Gi when omitted.
          default: "16Gi"
          x-go-type-skip-optional-pointer: true
          x-order: 10
        kubeReservedMemory:
          type: string
          description: Memory reserved for Kubernetes components. Default 2Gi.
          x-go-type-skip-optional-pointer: true
          x-order: 11
        controlPlane:
          x-fern-ignore: true
          type: boolean
          default: false
          description: Whether the nodes in this pool should be added as Kubernetes control plane nodes
          x-go-type-skip-optional-pointer: true
          x-order: 12
        nodeLabels:
          type: array
          items:
            type: string
          description: Labels applied to the pool's nodes, as key=value. Set at creation.
          x-order: 13
        desiredNodeCount:
          type: integer
          minimum: 0
          description: The desired number of nodes in the pool. For control-plane pools, aggregate capacity above 1 requires controlPlaneVIP on the cluster.
          x-order: 14
        description:
          type: string
          description: Free-text description.
          x-order: 15
        autoProvisionDisabled:
          type: boolean
          default: false
          description: Disables automatic provisioning for the pool.
          x-order: 16
        autoModeDisabled:
          type: boolean
          default: false
          description: Disables auto-mode (automatic node recycling).
          x-order: 17
        provisioningMonitorDisabled:
          type: boolean
          default: false
          description: When true, nodes stuck in provisioning past the timeout are not recycled automatically.
          x-order: 18
        recycleBudget:
          type: integer
          minimum: 0
          default: 0
          description: Maximum number of nodes recycled at once.
          x-order: 19
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Whether Teleport SSH enrollment is enabled for nodes in this pool. When omitted, the server-side default for the site is applied based on pool role.
          x-order: 20
        nico:
          $ref: "#/components/schemas/NicoNodePoolProvider"
        infra:
          x-fern-ignore: true
          $ref: "#/components/schemas/InfraNodePoolProvider"
    UpdateNodePoolRequest:
      type: object
      additionalProperties: false
      not:
        required: [nico, infra]
      description: |
        All fields are optional. A provider payload that does not match the node pool's
        cluster is rejected with 400.
        Updating a control-plane pool in a way that creates a replacement node set
        requires controlPlaneVIP. maxSurge alone does not create a replacement
        and remains mutable without a VIP.
      # No required fields since all fields are optional
      properties:
        autoProvisionDisabled:
          type: boolean
          description: Disables automatic provisioning for the pool.
        autoModeDisabled:
          type: boolean
          description: Disables auto-mode (automatic node recycling).
        provisioningMonitorDisabled:
          type: boolean
          description: When true, nodes stuck in provisioning past the timeout are not recycled automatically.
        systemReservedMemory:
          type: string
          description: Memory reserved for system daemons. Nodes reserve 16Gi when omitted.
        kubeReservedMemory:
          type: string
          description: Memory reserved for Kubernetes components. An empty string restores the 2Gi default.
        description:
          type: string
          description: Free-text description.
        desiredNodeCount:
          type: integer
          minimum: 0
          description: The desired number of nodes in the pool. Increasing aggregate control-plane capacity above 1 requires controlPlaneVIP on the cluster.
        recycleBudget:
          type: integer
          minimum: 0
          description: Maximum number of nodes recycled at once.
        maxSurge:
          type: integer
          minimum: 0
          description: |
            Nodes allowed above desiredNodeCount during a rollout. 0 means sequential: each
            node is torn down before its replacement is provisioned.
          default: 0
        teleportEnabled:
          x-fern-ignore: true
          type: boolean
          description: Enable or disable Teleport SSH enrollment for nodes in this pool.
        # Same pattern and rationale as UpdateClusterRequest.controlPlaneKubernetesVersion (semver.org version core; no leading "v").
        kubernetesVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          description: |
            Desired Kubernetes version for the pool's nodes, as X.Y.Z with no leading "v".
            Must be newer than the current version.
        nico:
          $ref: "#/components/schemas/NicoNodePoolProviderUpdate"
        infra:
          x-fern-ignore: true
          $ref: "#/components/schemas/InfraNodePoolProviderUpdate"
