# Example CreateClusterRequest for a local CAPD (Docker-backed CAPI) cluster.
# Field names match the CWE API exactly — see /api/docs on your site controller.
#
# Usage: nkectl create cluster examples/capd-cluster.yaml
#
# Prerequisites:
#   - tilt up running with CAPD enabled
#   - nkectl config set-site --url http://localhost:8080

name: my-cluster
controlPlaneKubernetesVersion: 1.34.2
cniPlugin: calico
etcdEncrypted: false
disableKubeVip: true

nodePools:
  - name: control-plane
    nodeNamePrefix: cp
    desiredNodeCount: 1
    controlPlane: true
    systemReservedMemory: "1Gi"
    capiSpireAttestationMethod: joinToken
    capiPreKubeadmCommands:
      - "mkdir -p /run/cluster-api"
      - "echo success > /run/cluster-api/bootstrap-success.complete"
    capiInfraMachineTemplate:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DockerMachineTemplate
      spec:
        template:
          spec:
            customImage: cwe-capd-kindest-node:local
            extraMounts:
              - containerPath: /var/run/docker.sock
                hostPath: /var/run/docker.sock

capiInfraCluster:
  apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
  kind: DockerCluster
  metadata:
    name: my-cluster
  spec: {}
