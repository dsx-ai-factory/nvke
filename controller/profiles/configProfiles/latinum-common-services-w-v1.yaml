# Latinum (DSX software stack) common-services worker nodes.
# CPU-only; runs the common-services and datahall control-plane workloads.
# Owner: nke-scale team — reach out with questions or change requests.

hooks:
  beforeJoinNode:
    - runbook:
        name: disable-ipv6-grub
    - runbook:
        name: disable-ipv6-sysctl
    - runbook:
        name: configure-inotify
    - runbook:
        name: enable-ipv4-forward
    - runbook:
        name: disable-swap
    - runbook:
        name: install-chrony
    - runbook:
        name: lvextend
preJoinNodeReboot: true
labels:
  - node-role.kubernetes.io/worker=
  - nodeGroup=worker
  - node.kubernetes.io/instance-type=cpu
  - nodeType=cpu
