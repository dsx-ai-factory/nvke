hooks:
  beforeJoinNode:
    - runbook:
        name: disable-ipv6-grub
    - runbook:
        name: disable-ipv6-sysctl
    - runbook:
        name: enable-ipv4-forward
    - runbook:
        name: disable-swap
    - runbook:
        name: install-chrony
    - runbook:
        name: lvextend
    - runbook:
        name: lustre-install
     # ToDo: change to ensure-gpu-display-mode when available in SWE as an optimization
    - runbook:
        name: configure-gpu-display-mode
        env:
          GPU_DISPLAY_MODE: graphics
    # Ideally we should reboot here and only if gpu display mode was changed, but SWE cannot yet correctly wait for the reboot.
    # Until that is fixed, we will need to manually reboot every new node after its in the cluster.
    # - runbook:
    #     name: reboot
    # Note: this runbook needs to be executed about 1 hour after node joins
    # Until we have a way to wait for the runbook to complete successfully, we will need to execute it manually
    # - runbook:
    #     name: lustre-lnet-fix          
labels:
  - node-role.kubernetes.io/gpu-worker=
  - nodeGroup=gpu
  - nodeType=gpu