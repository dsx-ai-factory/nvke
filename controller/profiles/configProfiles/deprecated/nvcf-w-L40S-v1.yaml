hooks:
  beforeJoinNode:
    - runbook:
        name: disable-ipv6-grub
    - runbook:
        name: disable-ipv6-sysctl
  afterJoinNode:
    - runbook:
        name: enable-ipv4-forward
    - runbook:
        name: disable-swap
    - runbook:
        name: install-chrony
    - runbook:
        name: lvextend
    - runbook:
        name: kube-reserved-resources
        env:
          SYSTEM_RESERVED_MEM: 128Gi
    - runbook:
        name: configure-inotify
    - runbook:
        name: gpu-protect
    - runbook:
        name: gpu-protect-service
    - runbook:
        name: configure-gpu-display-mode
        env:
          GPU_DISPLAY_MODE: physical_display_enabled_8GB_bar1
labels:
  - nodeGroup=gpu
  - nodeType=gpu
  - nvca.nvcf.nvidia.io/schedule=true
  - nvidia.com/gpu.workload.config=vm-passthrough
  - nvidia.com/gxcache-client-inject=true