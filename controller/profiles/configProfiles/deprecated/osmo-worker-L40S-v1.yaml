hooks:
  beforeJoinNode:
    - runbook:
        name: configure-gpu-display-mode
        env:
          GPU_DISPLAY_MODE: physical_display_enabled_8GB_bar1
    - runbook:
        name: disable-ipv6-grub
    - runbook:
        name: disable-ipv6-sysctl
    - runbook:
        name: enable-ipv4-forward
    - runbook:
        name: disable-swap
    - runbook:                        # already in user data
        name: install-chrony
    - runbook:                        # alrady in user data
        name: lvextend
    - runbook:
        name: kube-reserved-resources
    - runbook:
        name: lustre-install
  afterJoinNode:
    - runbook:
        name: lustre-lnet-fix          # this needs to run about 1 hour after node joins
labels:
  - node-role.kubernetes.io/gpu-worker=
  - nodeGroup=gpu
  - nodeType=gpu