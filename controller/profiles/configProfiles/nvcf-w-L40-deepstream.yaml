hooks:
  beforeJoinNode:
    - runbook:
        name: disable-ipv6-grub
    - runbook:
        name: disable-ipv6-sysctl
    - runbook:
        name: lvextend
    - runbook:
        name: disable-swap
    - runbook:
        name: enable-ipv4-forward
    - runbook:
        name: install-chrony
    - runbook:
        name: configure-inotify
    - runbook:
        name: configure-deepstream-sysctl
    - runbook:
        name: configure-gpu-display-mode
        env:
          GPU_DISPLAY_MODE: graphics
    - runbook:
        name: gpu-protect
    - runbook:
        name: gpu-protect-service
    # Ideally we should reboot here, but SWE cannot yet correctly wait for the reboot.
    # Until that is fixed, we will need to manually reboot every new node after its in the cluster.
    # - runbook:
    #     name: reboot
preJoinNodeReboot: true
labels:
  - node-role.kubernetes.io/gpu-worker=
  - nodeGroup=gpu
  - nodeType=gpu
  - nvca.nvcf.nvidia.io/schedule=true
  - nvidia.com/gpu.workload.config=vm-passthrough
  - nvidia.com/gxcache-client-inject=true
