#cloud-config
autoinstall:
  version: 1
  storage:
      selection:
        smallest_disk:
          search_criteria:
            type: disk
            removable: false
          sort: size
          reverse: false
      layout:
        name: lvm
        match:
          id: smallest_disk

  identity:
    hostname: spiffe-test-node
    username: test-admin
    password: $6$testsalt12345678$testHashTestHashTestHashTestHashTestHashTestHashTestHashTestHashTestHashTestHashABCD56
  packages:
    - chrony
  ntp:
    enabled: true
    ntp_client: chrony
    servers:
      - 129.6.15.32
  keyboard:
    layout: us
    toggle: null
    variant: ""
  locale: en_US
  ssh:
    allow-pw: true
    authorized-keys: []
    install-server: true

  late-commands:
    - curtin in-target --target=/target -- sed -i 's|^GRUB_CMDLINE_LINUX=.*|GRUB_CMDLINE_LINUX="ipv6.disable=1 console=ttyS1,115200"|' /etc/default/grub
    - curtin in-target --target=/target -- update-grub

  user-data:
    write_files:
      - path: /etc/sysctl.d/60-custom.conf
        owner: root:root
        permissions: '0755'
        content: |
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1
      - path: /etc/teleport.yaml
        owner: root:root
        permissions: '0600'
        content: |
          # Managed by NKE Cloud Workflow Engine — do not edit manually.
          version: v3
          teleport:
            nodename: spiffe-test-node
            data_dir: /var/lib/teleport
            join_params:
              token_name: nke-cwe-abcdef12-3456-7890-abcd-ef1234567890
              method: tpm
            proxy_server: nv-prd-dgxc.teleport.sh:443
            log:
              output: stderr
              severity: INFO
              format:
                output: json
            diag_addr: 127.0.0.1:3000
          ssh_service:
            enabled: "yes"
            labels:
              cluster: test-cluster-id
              cluster-name: test-cluster
              environment: staging
              managed-by: nke-cloud-workflow-engine
              node-id: abcdef12-3456-7890-abcd-ef1234567890
              node-pool: test-nodepool-id
              resource-group: nke
              site: test-site-id

          auth_service:
            enabled: "no"
          proxy_service:
            enabled: "no"
      - path: /etc/spire-agent/agent.conf
        owner: root:root
        permissions: '0644'
        content: |
          agent {
              data_dir = "/var/lib/spire-agent"
              log_level = "DEBUG"

              server_address = "spire-server.example.com"
              server_port = "9091"

              trust_domain = "example.com"
              trust_bundle_path = "/etc/spire-agent/initial-trust-bundle.pem"
          }

          plugins {
              KeyManager "disk" {
                  plugin_data {
                      directory = "/var/lib/spire-agent"
                  }
              }

              NodeAttestor "tpm" {
                  plugin_cmd = "/usr/local/lib/spire-agent/tpm_attestor_agent"
                  plugin_checksum = "${TPM_PLUGIN_CHECKSUM}"
                  plugin_data {}
              }

              WorkloadAttestor "unix" {
                  plugin_data {}
              }
          }
      - path: /etc/spire-agent/initial-trust-bundle.pem
        owner: root:root
        permissions: '0644'
        content: |
          -----BEGIN FAKE TEST-ONLY CERTIFICATE-----
          MIICDzCCAbigAwIBAgIUTestCert1234567890ABCDEFGHIJK0wDQYJKoZIhvcNAQEL
          BQAwRTELMAkGA1UEBhMCVVMxEzARBgNVBAgMClRlc3QgU3RhdGUxDTALBgNVBAoM
          BFRFU1QxEjAQBgNVBAMMCVRFU1QgT05MWTAeFw0yNTAxMDEwMDAwMDBaFw0yNjAx
          MDEwMDAwMDBaMEUxCzAJBgNVBAYTAlVTMRMwEQYDVQQIDApUZXN0IFN0YXRlMQ0w
          CwYDVQQKDARURVNUMRIwEAYDVQQDDAlURVNUIE9OTFkwXDANBgkqhkiG9w0BAQEF
          AANLADBIAkEAm5Hta1234567890testdatafakecert1234567890ABCDEF123456
          78901234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890QIDAQABMA0GCSqG
          SIb3DQEBCwUAA0EATestSignature1234567890FakeDataNotRealCertificate123
          -----END FAKE TEST-ONLY CERTIFICATE-----
          -----BEGIN FAKE TEST-ONLY CERTIFICATE-----
          MIICDzCCAbigAwIBAgIUTestCert0987654321ZYXWVUTSRQPONMLK0wDQYJKoZIhvcNAQEL
          BQAwRTELMAkGA1UEBhMCVVMxEzARBgNVBAgMClRlc3QgU3RhdGUxDTALBgNVBAoM
          BFRFU1QxEjAQBgNVBAMMCVRFU1QgT05MWTAeFw0yNTAxMDIwMDAwMDBaFw0yNjAx
          MDIwMDAwMDBaMEUxCzAJBgNVBAYTAlVTMRMwEQYDVQQIDApUZXN0IFN0YXRlMQ0w
          CwYDVQQKDARURVNUMRIwEAYDVQQDDAlURVNUIE9OTFkwXDANBgkqhkiG9w0BAQEF
          AANLADBIAkEAp8Jtb0987654321testdatafakecert0987654321ZYXWVUT987
          65432109876543210ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321QIDAQABMA0GCSqG
          SIb3DQEBCwUAA0EATestSignature0987654321FakeDataNotRealCertificate987
          -----END FAKE TEST-ONLY CERTIFICATE-----

    runcmd:
      # Wait (up to 300s) for default IPv4 route to avoid early network race (bluefield DPU Race Condition).
      - |
          timeout 300s sh -c '
            iface=""
            until [ -n "$iface" ] && ip -4 -o addr show dev "$iface" | grep -q "inet "; do
              iface=$(ip -4 route list default 2>/dev/null | head -n 1 | tr -s " " | cut -d" " -f5)
              echo "waiting for IPv4 default route"
              sleep 5
            done
            echo "IPv4 detected on $iface"
          '
      - lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv
      - resize2fs /dev/ubuntu-vg/ubuntu-lv
      - mkdir -m 755 /etc/apt/keyrings
      - sysctl --system
      - [sh, -c, "echo 'Starting Teleport installation at '$(date) >> /var/log/cloud-init-teleport.log"]
      - /usr/local/bin/fetch-and-install-bundle.sh https://d3mq564cn7sth7.cloudfront.net/nke_bundles/Ubuntu_22.04/x86_64/teleport_ent_v18.6.4-2_x86_64.tgz ./install.sh
      - [sh, -c, "command -v teleport || { echo 'Teleport binary not found' >> /var/log/cloud-init-teleport.log; exit 1; }"]
      - [sh, -c, "systemctl enable --now teleport >> /var/log/cloud-init-teleport.log 2>&1"]
      - [sh, -c, "systemctl is-active --quiet teleport && echo 'Teleport service started successfully' >> /var/log/cloud-init-teleport.log || { echo 'Teleport service failed to start' >> /var/log/cloud-init-teleport.log; systemctl status teleport --no-pager >> /var/log/cloud-init-teleport.log; exit 1; }"]
      - [sh, -c, "echo 'Teleport installation completed at '$(date) >> /var/log/cloud-init-teleport.log"]
      - /usr/local/bin/fetch-and-install-bundle.sh https://d3mq564cn7sth7.cloudfront.net/nke_bundles/Ubuntu_22.04/x86_64/kubeadm_v1.31.9-5_x86_64.tgz ./kubeadm-install.py
      - /usr/local/bin/fetch-and-install-bundle.sh https://d3mq564cn7sth7.cloudfront.net/nke_bundles/Ubuntu_22.04/x86_64/node-agent_v0.1.7_x86_64.tgz ./agent-installer.sh
      - [ /usr/local/bin/fetch-and-install-bundle.sh, "https://d3mq564cn7sth7.cloudfront.net/nke_bundles/Ubuntu_22.04/x86_64/ovn_1.4.0-2_x86_64.tgz", "./install.sh -i" ]
      - /usr/local/bin/fetch-and-install-bundle.sh https://d3mq564cn7sth7.cloudfront.net/nke_bundles/Ubuntu_22.04/x86_64/spire_agent_v1.14.1_tpm_attestor_v1.9.0_x86_64.tgz ./install.sh
      - printf 'AGENT_ARGS="--enable-spiffe --secure-server-port 15005"\n' > /etc/default/nke-agent
      - systemctl daemon-reload
      - systemctl restart nke-agent
      - systemctl restart procps
