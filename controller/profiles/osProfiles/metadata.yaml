# OSProfile Metadata Index
# This file tracks metadata for each OSProfile including Kubernetes version and architecture.
#
# Supported fields:
#   kubernetes_version: K8s version (required, e.g., "1.31.9")
#   kubernetes_version_injected: Whether the Kubernetes version is injected at provisioning time (optional, default: false)
#   architecture: CPU architecture (required, e.g., "amd64", "arm64")
#   build_date: Build date in YYYY-MM-DD format (required, e.g., "2025-10-29")
#   ubuntu_version: Ubuntu version (defaults to "22.04" if not specified, e.g., "22.04", "24.04")
#   variant: Profile variant (optional, e.g., "ovn", "ytl")
#   image_base_url: OS image base URL (defaults to S3 if not specified)
#   bundle_url: Bundle artifact URL (optional)
#
# Default image_base_url format:
#   https://nke-dev.s3.us-west-2.amazonaws.com/BaseOS-images/nke/v<VERSION>/<DATE>/forge_nke-<DATE>
#

