# Written by hand: this repository carries no controller-gen. Keep it in step
# with preprovisioned/api/v1alpha1/preprovisionedmachine_types.go.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: preprovisionedmachines.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/provider: infrastructure-preprovisioned
    # Cluster API reads this label to resolve the contract version of the kind.
    cluster.x-k8s.io/v1beta2: v1alpha1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
      - cluster-api
    kind: PreprovisionedMachine
    listKind: PreprovisionedMachineList
    plural: preprovisionedmachines
    shortNames:
      - ppm
    singular: preprovisionedmachine
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provisioned
          type: boolean
          jsonPath: .status.initialization.provisioned
        - name: Host
          type: string
          jsonPath: .status.hostName
        - name: ProviderID
          type: string
          jsonPath: .spec.providerID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: PreprovisionedMachine is the Schema for the preprovisionedmachines API.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: PreprovisionedMachineSpec defines the desired state of PreprovisionedMachine.
              type: object
              properties:
                providerID:
                  description: |
                    ProviderID binds this machine to one host of the inventory, in
                    the form preprovisioned://<cluster-name>/<host-name>. The
                    provider sets it once and never changes it. It is the record of
                    the allocation.
                  type: string
                  minLength: 1
                  maxLength: 512
                hostSelector:
                  description: |
                    HostSelector limits which hosts this machine can use. The
                    provider only uses a host whose labels contain every entry.
                  type: object
                  additionalProperties:
                    type: string
            status:
              description: PreprovisionedMachineStatus defines the observed state of PreprovisionedMachine.
              type: object
              properties:
                initialization:
                  description: |
                    Initialization reports the state that the Cluster API contract
                    requires.
                  type: object
                  minProperties: 1
                  properties:
                    provisioned:
                      description: Provisioned is true when the machine holds a host.
                      type: boolean
                hostName:
                  description: HostName is the name of the host that this machine holds.
                  type: string
                addresses:
                  description: |
                    Addresses are the addresses of that host, copied from the
                    inventory. Cluster API copies them to the Machine.
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    required:
                      - type
                      - address
                    properties:
                      type:
                        description: One of Hostname, ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                        type: string
                      address:
                        type: string
                        minLength: 1
                        maxLength: 256
                conditions:
                  description: Conditions describes the current state.
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
