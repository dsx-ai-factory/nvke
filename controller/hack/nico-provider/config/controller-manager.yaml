apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: capnico-system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --leader-elect
            - --reboot-annotation=nvke.nvidia.com/reboot
            - --repair-annotation=nvke.nvidia.com/machine-health-issue
