# The values an install that predates the nvke rename sets to keep the names it
# already runs. hack/chart-identity-assertions.py renders the chart with this
# file and asserts every name comes out as it did before the rename.
#
# This is a worked example for the test, not a site's values: the trust domain
# is a placeholder. Every key here is one the chart lets an install pin, and the
# comment says what moving it would break.

# The Deployment's spec.selector.matchLabels carries app.kubernetes.io/name,
# which comes from here. spec.selector is immutable, so an upgrade that changes
# it fails rather than renames. The container, ServiceAccount, Service and every
# <fullname>-prefixed object derive from the same value.
nameOverride: "cloud-workflow-engine"
fullnameOverride: ""

# The management namespace holds the tenant-access Secrets and the nke-rbac
# objects. The old namespace is not also read, so a controller that addresses
# another one publishes where it has no grant.
nvkeSystemNamespace:
  name: "nke-system"

# Renaming the ConfigMap orphans the live object.
controllerConfig:
  name: "nke-controller-config"

# The controller reads only the name set here, so renaming the ConfigMap leaves
# the live manifest unread and every tenant cluster without the RBAC the
# management plane authenticates against.
rbacConfigMap:
  name: "nke-rbac"

# Same again for the authentication ConfigMap, which the chart mounts whether
# or not it created it. An install that supplies its own (configMap.create
# false) must keep naming the one it supplies.
apiAuth:
  configMap:
    name: "nke-auth-config"

# The ClusterSPIFFEID issues spiffe://<trustDomain>/nke-service/<serviceAccount>.
# The default RBAC subjects must name the same segment.
spiffe:
  trustDomain: "example.test"
  servicePathSegment: "nke-service"

# Teleport compares the managed-by value on the resources it already owns, so a
# controller that stamps another one stops recognising them.
teleport:
  managedByLabelValue: "nke-cloud-workflow-engine"
  tokenNamePrefix: "nke-cwe-"
  resourceGroupLabelValue: "nke"
