# nvke-controller-config for host-local runs: make run, make run-local,
# make run-remote, make debug, and the gofail e2e worker. A deployment gets the
# same file from the chart instead. Every key is required, because
# internal/controllerconfig has no defaults; TestLocalControllerConfig checks
# that this file still loads and sets them all.
#
# To change a setting for your own runs, copy this file under .local/ and point
# CONTROLLER_CONFIG_PATH at the copy.
agentReadiness:
  workers: 8
  timeout: 30s
  interval: 2m
  jitter: 0.1
fieldManager:
  name: cloud-workflow-engine
  rebootMachineName: cloud-workflow-engine-reboot-machine
  machineHealthIssueName: cloud-workflow-engine-machine-health-issue
managedByLabelValue: cloud-workflow-engine
# The shared management-plane namespace. Tilt creates it (deploy/k8s/nvke-system-namespace.yaml).
managementNamespace: nvke-system
metricsListenAddress: 127.0.0.1:9090
supportedInfraProviders:
  - nico
nodeMetadataAllowlistedLabelKeys: []
machineMetadataAllowlistedLabelKeys: []
machineMetadataAllowlistedAnnotationKeys: []
tracing:
  enabled: false
  endpoint: ""
  insecure: true
  serviceName: cloud-workflow-engine
certRenewal:
  controllerEnabled: true
  interval: 12h
  thresholdDays: 30
credentialMonitoring:
  enabled: true
  inspectionInterval: 1h
  observationMaxAge: 3h
  warningDays: 45
kubeadmImageRepository: registry.k8s.io
cniImageRegistry: ""
installCNIAfterInit: false
allowLegacyCalicoClusterCreation: false
allowControlPlaneWithoutVIP: false
nicoControllersEnabled: false
profilesDir: test/fixtures/profiles
runbooksDir: test/fixtures/runbooks
tenantAccessEnabled: false
nodeAgent:
  updateMethod: ""
  spireAttestationMethod: tpm
  dsxImds:
    endpoint: http://169.254.169.254
    pluginChecksum: ""
    operatorTenant: ""
  tlsJWT:
    enabled: false
    issuer: ""
    jwksURI: ""
    algorithms: []
    subjectTrustDomain: ""
    dsxIdentityExchangeURL: ""
    subjectTenant: ""
    subjectService: ""
  externalMTLSEnabled: false
oidc:
  managementOIDCAuth:
    enabled: false
    issuerURL: ""
    discoveryURL: ""
    caBundleSecretRef:
      namespace: ""
      name: ""
      key: ""
  providers: []
temporal:
  hostPort: localhost:7233
  namespace: cloud-workflow-engine
  taskQueue: cloud-workflow-engine-tasks
  tls:
    caCert: ""
    clientCert: ""
    clientKey: ""
    serverName: ""
spire:
  spiffeEnabled: false
  spiffeEndpointSocket: unix:///tmp/spire-agent/agent.sock
  spiffeJWTExchangeEndpoint: ""
  serverNamespace: spire-server
  className: spire-mgmt-spire
  tpmPubhashesConfigMapName: tpm-pubhashes
  serverPort: "9091"
  joinTokenTTL: 1h
teleport:
  enabled: false
  identityFile: ""
  proxyAddress: ""
  environment: non-prod
  managedByLabelValue: nvke-controller
  acceptedManagedByLabelValues: []
  tokenNamePrefix: nvke-controller-
  resourceGroupLabelValue: nvke
# Off for host-local runs, as it was before the section existed. To run with
# authentication, set enabled and give audiences and issuers the shape the
# chart's apiAuth.config takes.
apiAuth:
  enabled: false
  audiences: []
  issuers: []
  permissive: false
