apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsx-imds-attestation-mock
  namespace: spire-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsx-imds-attestation-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsx-imds-attestation-mock
    spec:
      # Local NodePorts preserve the caller IP used to identify the mock host.
      nodeSelector:
        kubernetes.io/hostname: __MANAGEMENT_NODE__
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: imds
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: dsx-imds-attestation-mock
  namespace: spire-server
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: dsx-imds-attestation-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30445
