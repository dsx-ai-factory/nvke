name: cwe-tracing-poc
services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: cwe_tracing_poc
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cwe_tracing_poc"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:17233:7233"
      - "127.0.0.1:18233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 3s
      retries: 30
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.10.0
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:16686:16686"
