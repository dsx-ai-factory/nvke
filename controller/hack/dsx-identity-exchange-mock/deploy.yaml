apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsx-identity-exchange-mock
  namespace: spire-server
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dsx-identity-exchange-mock
  namespace: spire-server
spec:
  secretName: dsx-identity-exchange-mock-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  __SAN_KIND__:
    - __SITE_ADDRESS__
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: nvke-oidc-upstream-ca
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: dsx-identity-exchange-mock
spec:
  className: spire-mgmt-spire
  spiffeIDTemplate: "spiffe://{{.TrustDomain}}/test/dsx-identity-exchange-mock"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: spire-server
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dsx-identity-exchange-mock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsx-identity-exchange-mock
  namespace: spire-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsx-identity-exchange-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsx-identity-exchange-mock
    spec:
      serviceAccountName: dsx-identity-exchange-mock
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: exchange
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --issuer=https://capd.dsx.nvid.id
            - --jwks-url=https://__SITE_ADDRESS__:30444/.well-known/jwks.json
            - --region=capd
            - --partition=nvid.id
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: tls
              mountPath: /run/tls
              readOnly: true
      volumes:
        - name: workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: tls
          secret:
            secretName: dsx-identity-exchange-mock-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dsx-identity-exchange-mock
  namespace: spire-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dsx-identity-exchange-mock
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30444
