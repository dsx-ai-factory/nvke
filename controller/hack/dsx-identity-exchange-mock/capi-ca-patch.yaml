spec:
  template:
    spec:
      volumes:
        - name: dsx-identity-exchange-ca
          configMap:
            name: dsx-identity-exchange-ca
      containers:
        - name: manager
          env:
            - name: SSL_CERT_FILE
              value: /etc/nke/dsx-identity/ca.crt
          volumeMounts:
            - name: dsx-identity-exchange-ca
              mountPath: /etc/nke/dsx-identity/ca.crt
              subPath: ca.crt
              readOnly: true
