kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# The capi-spiffe-exec-auth overlay mounts the SPIRE exec-auth plugin as an OCI
# image volume. ImageVolume is beta but off by default through k8s 1.34, so
# enable it explicitly rather than depending on the kind binary's default node
# image (kind v0.32 defaults to 1.36, which NKE does not support yet).
featureGates:
  ImageVolume: true
networking:
  ipFamily: dual
nodes:
- role: control-plane
  # Pinned to the KINDEST_NODE_TAG used by hack/capd-kindest-node/Dockerfile so
  # the management and CAPD workload nodes share one version. Ships containerd
  # 2.3.1, past the 2.1 floor image volumes require.
  image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  extraMounts:
    - hostPath: /var/run/docker.sock
      containerPath: /var/run/docker.sock
