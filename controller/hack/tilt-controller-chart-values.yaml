fullnameOverride: nvke-controller
namespaceOverride: nvke-controller
nameOverride: nvke-controller

serviceAccount:
  name: nvke-controller

nvkeSystemNamespace:
  create: false

image:
  repository: docker.local/cwe
  tag: tilt
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Tilt runs the controller as root on a writable root filesystem, unlike every
# deploy path. live_update syncs bin/controller into /usr/local/bin in the
# running container (Tiltfile), which the chart's default uid 65532 and
# read-only root would refuse, turning each edit into a full image rebuild.
podSecurityContext: null
securityContext:
  readOnlyRootFilesystem: false

metrics:
  networkPolicy:
    enabled: false
serviceMonitor:
  enabled: false

livenessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: nvke-controller
  postgresUser: postgres
  # postgresPassword is supplied by the Tiltfile from CNPG_SUPERUSER_PASSWORD —
  # do not hardcode it here.
  sslMode: disable

secrets:
  dgxcTenantCredSecretName: ""

temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233
  cloudWorkflow:
    namespace: nvke-controller
    queue: nvke-controller-tasks

identity:
  fieldManagerName: nvke-controller
  fieldManagerRebootMachineName: nvke-controller-reboot-machine
  fieldManagerMachineHealthIssueName: nvke-controller-machine-health-issue
  managedByLabelValue: nvke-controller

teleport:
  managedByLabelValue: nvke-controller
  tokenNamePrefix: nvke-controller-

profiles:
  path: /profiles
  # Exercise the fleet profiles.image materialize path. Tilt builds
  # docker.local/cwe-profiles:tilt from the sibling nke-site-deploy tree.
  image:
    enabled: true
    repository: docker.local/cwe-profiles
    tag: tilt

# apiAuth is not set here. The Tiltfile drives it from NKE_AUTH_ENABLED and
# NKE_PERMISSIVE_MODE, with the configuration in
# hack/tilt-controller-api-auth-values.yaml.

spiffe:
  enabled: true
  endpointSocket: unix:///spiffe-workload-api/spire-agent.sock
  spire:
    serverNamespace: spire-server
    className: spire-mgmt-spire
    tpmPubhashesConfigMapName: tpm-pubhashes
    serverAddress: host.docker.internal
    serverPort: "30440"
