fullnameOverride: cloud-workflow-engine
namespaceOverride: cloud-workflow-engine

nkeSystemNamespace:
  create: false

image:
  repository: docker.local/cwe
  tag: tilt
  pullPolicy: IfNotPresent
imagePullSecrets: []

podSecurityContext: null
securityContext:
  readOnlyRootFilesystem: false

metrics:
  networkPolicy:
    enabled: false
serviceMonitor:
  enabled: false

livenessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: cloud-workflow
  postgresUser: postgres
  postgresPassword: postgres
  sslMode: disable

secrets:
  forgeSecret:
    enabled: false
  dgxcTenantCredSecretName: ""

temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233

profiles:
  path: /profiles

spiffe:
  enabled: true
  endpointSocket: unix:///spiffe-workload-api/spire-agent.sock
  spire:
    serverNamespace: spire-server
    className: spire-mgmt-spire
    tpmPubhashesConfigMapName: tpm-pubhashes
    serverAddress: host.docker.internal
    serverPort: "30440"
