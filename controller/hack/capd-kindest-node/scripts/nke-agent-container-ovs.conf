# Container nodes use the kernel Open vSwitch datapath. The host /lib/modules
# tree is mounted into the container, and Geneve leaves through the kernel
# route on the management interface. br-ex stays a dummy gateway so OVN does
# not adopt Docker's eth0.
[Service]
Environment=NKE_OVS_DATAPATH_TYPE=system
