[Service]
# Preserve veth checksum metadata before starting the userspace datapath.
ExecStartPre=/usr/bin/ovs-vsctl --no-wait init -- set Open_vSwitch . other_config:userspace-tso-enable=true
ExecStart=
ExecStart=/usr/sbin/ovs-vswitchd unix:/run/openvswitch/db.sock --pidfile --detach --log-file
ExecReload=
ExecReload=/bin/kill -HUP $MAINPID
