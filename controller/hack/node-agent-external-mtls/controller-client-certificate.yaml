# Tilt-only external-mTLS client identity for the controller to present to the NVKE node agent. The CA
# and private keys are generated by cert-manager inside the Kind cluster.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dsx-controller-client-bootstrap
  namespace: nvke-controller
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dsx-controller-client-ca
  namespace: nvke-controller
spec:
  isCA: true
  commonName: DSX Tilt Controller Client CA
  secretName: dsx-controller-client-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: dsx-controller-client-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dsx-controller-client-ca
  namespace: nvke-controller
spec:
  ca:
    secretName: dsx-controller-client-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dsx-controller-client
  namespace: nvke-controller
spec:
  secretName: dsx-controller-client
  privateKey:
    algorithm: ECDSA
    size: 256
  uris:
    - urn:nvidia:nke:controller
  usages:
    - client auth
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: dsx-controller-client-ca
