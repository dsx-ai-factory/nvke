# Copy/paste these YAML snippets into the CWE UI for a CAPD-backed cluster.
# Paste the DockerCluster manifest into the cluster infrastructure manifest field.
# Paste the DockerMachineTemplate manifest into a node pool infrastructure machine template field.
# Paste the pre-kubeadm commands into the node pool pre-kubeadm commands field.

apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerCluster
spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
spec:
  template:
    spec:
      customImage: cwe-capd-kindest-node:local
      extraMounts:
        - containerPath: /var/run/docker.sock
          hostPath: /var/run/docker.sock
---
# Pre-kubeadm commands (hack to make CAPD work)
- mkdir -p /run/cluster-api
- echo success > /run/cluster-api/bootstrap-success.complete
