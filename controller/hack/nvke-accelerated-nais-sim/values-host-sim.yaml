# Layer after values-images.yaml and values-vmaas-nooverlay-dpu-host.yaml.
# These addresses are offline rendering fixtures, not a live cluster config.
k8sAPIServer: https://192.0.2.10:6443
podNetwork: 10.234.64.0/18/24
serviceNetwork: 10.234.0.0/18
global:
  skipCallToK8s: true
  simulateDpu: true
  gatewayOptions: "--ephemeral-port-range=40000-60999 --gateway-interface=eth0-0"
  vmUplinkInterfaceName: eth0-3
ovnPrimaryNADAnnotations:
  k8s.v1.cni.cncf.io/resourceName: dpusim.io/vf
ovnkube-control-plane:
  replicas: 1
ovnkube-node-dpu-host:
  mgmtPortVFResourceName: dpusim.io/mgmtvf
  mgmtPortVFsCount: 2
