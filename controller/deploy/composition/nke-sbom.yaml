# Delivery, not composition: which SBOMs are cut from the nke-stack chart, and
# for whom. nke-stack.yaml says what the chart contains; this says who gets it
# and in what form, which is a different question with a different lifecycle.
#
# Each target generates generated/<sbom>/<target>/ as a deploy path in the
# format docs/site-bootstrap/deploy-repository.md defines -- nke-deploy.yaml
# listing items in install order, one directory per item, with what an item IS
# living in its directory rather than in the list.
apiVersion: nke.nvidia.com/v1alpha1
kind: SBOMSet

metadata:
  name: nke-controller-artifacts
  description: Artifact sets cut from the nke-stack composition

spec:
  # Every target resolves to the SAME nke-stack version. Two versions would mean
  # the lanes validate something the published artifact does not ship, so the
  # generator rejects it rather than producing both.
  #
  # publish decides whether the push target will touch a tree, and false is not a
  # default to be overridden on the command line: the e2e trees must never reach
  # a registry, because the lanes that build them run on mirror branches that
  # deliberately hold no registry credentials.
  #
  # stack is how the umbrella arrives on the cluster:
  #   helm    the executor installs it, one release per phase. The only option
  #           where no ArgoCD exists -- both e2e lanes, and the ephemeral kind
  #           cluster the bootstrap throws away.
  #   argocd  Applications, for a site that outlives its installation and
  #           therefore wants drift correction, pruning and one-field upgrades.
  #
  # provider names what the capi phase installs, and is the axis a second one
  # (caplaunchlayer, for DSX) extends without touching anything else here.
  # `provisioned` adopts a host that already exists rather than creating one,
  # which is what the bootstrap needs: the machine being provisioned is the one
  # running kind.
  sboms:
    - name: nke-sbom-e2e
      publish: false
      targets:
        - name: capnico-e2e
          provider: capnico
          overlay: overlays/capnico-e2e.yaml
          stack: helm
          # nico-credentials points at the simulator rather than Forge -- same
          # Secret, same four keys, a different endpoint. Images are still
          # loaded, so no pull secret.
          baseConfig: [nico-credentials, dgxc-tenant-credentials, oidc-upstream-ca]

    - name: nke-sbom
      publish: true
      # Where an emitted Application resolves the chart from -- the repoURL of
      # its helm source, in OCI-Helm form, which carries no scheme and no chart
      # name. This is where chart-publish.yml pushes.
      #
      # Only an argocd target needs it: a helm target is handed a chart by
      # whoever runs the install, which is why nke-sbom-e2e above sets none.
      registry: ghcr.io/dsx-ai-factory/nke/charts
      targets:
        - name: capnico-forge
          provider: capnico
          overlay: overlays/capnico-forge.yaml
          stack: argocd
          # A real site pulls its images and talks to Forge, so it carries all
          # four. The pull secret must exist before the capnico item, whose
          # manifest names it.
          # No oidc-upstream-ca: that CA signs the OIDC discovery provider's
          # leaf, the provider is a subchart of spire, and this target disables
          # spire. The chart's requires gate names `before: spire`, so nothing
          # waits on it either.
          baseConfig: [image-pull-secret, nico-credentials, dgxc-tenant-credentials]
          # A bootstrapped cluster ships no StorageClass, so Postgres would sit
          # Pending; and CAPNICo is what turns a NicoMachine into a Forge
          # instance. Both are vendored upstream manifests with their edits
          # baked in, so each item is a plain apply.
          manifests: [local-path, capnico]

        # The name is the environment, not the provider: this is the bootstrap
        # cluster kind runs in, and its provider is `provisioned` because the
        # host is already there. stack stays helm for the same reason -- there
        # is no ArgoCD on a cluster that exists for the length of one bootstrap.
        - name: docker-bootstrap
          provider: provisioned
          overlay: overlays/docker-bootstrap.yaml
          stack: helm
          # The bootstrap cluster has no pull secret by design: every image is
          # loaded into it. It provisions no tenants either, so no tenant
          # credentials.
          baseConfig: [oidc-upstream-ca]
