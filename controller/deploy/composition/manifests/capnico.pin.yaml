# The CAPNICo release the capnico deploy-path item installs.
#
# The manifest is vendored beside this file rather than fetched, so generation
# needs no network and the bytes are reviewable in the pull request that bumps
# them. 63 KB, one Deployment and four CRDs; CAPI core is the one that cannot be
# vendored, at ~25k lines with placeholders clusterctl resolves.
#
# The asset is PUBLIC: dsx-ai-factory/cluster-api-provider-nico publishes
# infrastructure-components.yaml with its image already on ghcr.io, so neither
# GitLab nor an NGC org is needed. The internal pipeline repoints the image at
# nvcr.io only because sites hold that org's credentials.
#
# To bump: download the asset and checksums.txt from the release, verify the
# sha256 below matches, replace the vendored file, and run `make composition`.
# The deploy-path item this becomes.
item: capnico

version: v0.0.45
file: capnico-v0.0.45.yaml
sha256: "58c07abc10cc24f4a9be0c2751cf4b9222ebed8cbbd4e34ab707be40559bb135"

# Applied to the controller-manager Deployment when the item is generated, so
# the emitted manifest is a plain apply with nothing to patch afterwards.
#
# args REPLACE the container's own list, so --leader-elect is restated or it is
# lost. The two annotation keys are the ones CWE actually writes: left at
# CAPNICo's nico.nvidia.com/* defaults, every reboot and repair request is
# ignored silently.
patch:
  args:
    - --leader-elect
    - --reboot-annotation=nke.nvidia.com/reboot
    - --repair-annotation=nke.nvidia.com/machine-health-issue
  # The manifest carries none: the image is on ghcr.io, which needs a token for
  # a private repository. nke-base-config creates this Secret in the same
  # namespace, before this item runs.
  imagePullSecrets:
    - name: ghcr-imagepull
