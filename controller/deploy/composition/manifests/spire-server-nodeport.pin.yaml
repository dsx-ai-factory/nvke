# Exposes spire-server's gRPC port on 30440, for node agents attesting from outside the cluster.
#
# A copy of controller/deploy/k8s/spire-server-nodeport.yaml with ONE change: the
# app.kubernetes.io/instance line is removed from the selector. That label is the
# Helm release name, so the original only matches when spire is installed as a
# release literally called "spire" -- which is why the CAPD lane sed-rewrites it
# under the umbrella. Selecting on app.kubernetes.io/name alone matches the same
# pods under any release name, because components/spire.yaml pins spire to the
# spire-server namespace and exactly one install owns it.
#
# No version: this is our own file, not a vendored upstream release. The sha256
# still applies -- it catches an edit made here rather than at the source.
item: spire-server-nodeport
file: spire-server-nodeport.yaml
