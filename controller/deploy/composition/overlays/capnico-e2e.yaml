# NICo e2e overlay for nke-stack.
#
# The same lane shape as capd-e2e: a single-node kind management cluster that is
# destroyed after the run. It differs in one thing that matters -- the
# infrastructure provider CWE writes objects for -- and in how the CNI arrives.
#
# The NICo endpoint is NOT here. nico-sim and a real Forge differ by a URL, and
# that URL reaches CWE through the nico-credentials Secret rather than through
# chart values, which is what lets this lane be a genuine pre-check for the
# capnico-forge target instead of a separate claim.
#
# Everything that varies per run -- the management VIP, the trust domain derived
# from the kind cluster name, the locally built image, the generated database
# password -- is passed as --set by the lane, which is the only place that knows
# them.

# Monitoring is off for the same reason as capd-e2e: kube-prometheus-stack wants
# 500m CPU and 1Gi for Prometheus alone on a node that is already tight, and the
# suite asserts nothing about metrics.
#
# Both keys, not one: global.monitoring.enabled left true with the stack off
# renders ServiceMonitors against CRDs that no longer exist, which fails the
# install rather than degrading it.
global:
  monitoring:
    enabled: false
prometheus-operator-crds:
  enabled: false
kube-prometheus-stack:
  enabled: false

controller:
  # NicoCluster and NicoMachineTemplate rather than the pre-provisioned pair.
  # Without this CWE expects hosts that already exist and never asks CAPNICo for
  # any.
  supportedInfraProviders: nico

  # The suite mints its own token and presents it on every call, so the ordinary
  # specs exercise the shipping authentication path rather than bypassing it.
  apiAuth:
    enabled: true
    permissive: false

  # CWE reconciles CAPI objects, so it needs the RBAC for them. The chart
  # default is false, and without it every provisioning write is forbidden while
  # the controllers themselves start normally.
  capi:
    rbac:
      create: true

  tenantAccess:
    enabled: true

  nkeOIDCAuth:
    enabled: true
    # Logical issuer, string-compared against the JWT's iss claim; it does not
    # have to resolve. discoveryURL does, and is VIP-derived, so it is passed in.
    issuerURL: "https://nke.site-controller.internal"
    # The CA the OIDC provider's leaf is signed by, published by the chain in
    # controller/deploy/k8s/oidc-upstream-ca.yaml.
    caBundleSecret:
      namespace: spire-server
      name: oidc-provider-upstream-ca
      key: ca.crt

  # Unlike CAPD, whose nodes are containers the provider wires up during cluster
  # creation, a NICo node joins and then has its CNI installed by the agent.
  cni:
    installAfterInit: true

  # Empty on this path: none of the optional variables the Tiltfile forwards are
  # set by the lane.
  env: []
