# Install CRDs as part of the chart so we can apply our own Issuer/Certificate
# resources right away. Single replica is plenty for tilt.
crds:
  enabled: true

replicaCount: 1
webhook:
  replicaCount: 1
cainjector:
  replicaCount: 1
