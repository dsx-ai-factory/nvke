# Note: example.org values, the TPM attestor checksum, and the OIDC leaf cert
# IP SANs are replaced in the Tiltfile via --set-string overrides.

global:
  spire:
    trustDomain: example.org
    # Logical OIDC issuer per Story 1 / OQ-3. String-compared against the JWT's
    # iss claim — does not need to resolve anywhere.
    jwtIssuer: "https://nke.site-controller.internal"
  installAndUpgradeHooks:
    enabled: false
  deleteHooks:
    enabled: false

spire-agent:
  workloadAttestors:
    k8s:
      # Already the chart default at 0.30.1, restated so an upstream change of
      # heart cannot remove Kubernetes workload attestation silently.
      enabled: true
      # Mirrors deploy/nico, which needs this because its control-plane nodes run
      # Kata and container-scoped selectors cannot resolve inside the VM. Tilt
      # runs on kind under runc and would work either way, but attesting
      # differently from the path on real hardware means a ClusterSPIFFEID
      # that depends on container selectors passes locally and fails on a site.
      disableContainerSelectors: true

spire-server:
  adminIDs:
    - spiffe://example.org/nvke-service/nvke-controller
  controllerManager:
    className: spire-mgmt-spire
    identities:
      clusterSPIFFEIDs:
        default:
          # Controller workloads use the dedicated nvke-service identity deployed by
          # Tilt. Keep the fallback from racing it during pod reconciliation.
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - nvke-controller
  nodeAttestor:
    tpmDirect:
      enabled: true
  # Mount the Tilt-managed tpm-pubhashes ConfigMap into the SPIRE server so
  # the TPM attestor can look up controller-populated EK public-key hashes at runtime.
  extraVolumes:
    - name: tpm-pubhashes
      configMap:
        name: tpm-pubhashes
        optional: true
  extraVolumeMounts:
    - name: tpm-pubhashes
      mountPath: /run/spire/data/tpm-direct/hashes
      readOnly: true

spiffe-oidc-discovery-provider:
  enabled: true
  replicaCount: 2
  tls:
    spire:
      enabled: false
    certManager:
      enabled: true
      issuer:
        # We own the Issuer (see deploy/k8s/oidc-upstream-ca-issuer.yaml).
        create: false
      certificate:
        duration: 2160h               # 90d
        privateKey:
          algorithm: ECDSA
          size: 256                   # P-256 — fast/small, ample for a 90d leaf
        dnsNames:
          - nke.site-controller.internal
          - localhost
        # IP SANs (kind host + nico-vms bridge gateway) are injected by the
        # Tiltfile via --set-string overrides; cert-manager merges them in.
        issuerRef:
          group: cert-manager.io
          kind: Issuer
          name: nvke-oidc-upstream-ca
  config:
    # The provider rejects requests whose Host header is not in this list.
    # Every value that will appear in a request URL must be present — including
    # the literal IPs tenants hit (kube-apiserver fetches the discovery URL by
    # IP, not by the logical issuer host). The kind host IP and the nico-vms
    # bridge gateway are computed in the Tiltfile and appended via
    # --set-string overrides.
    additionalDomains:
      - "nke.site-controller.internal"
      - "localhost"
      - "127.0.0.1"
