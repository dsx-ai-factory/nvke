# Implemented as an override because the upstream SPIRE charts don't support explicitly setting the node port
# Copy of nke-site-deploy/overrides/spire/templates/nodeport-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: spire-server-np 
  namespace: spire-server
spec:
  type: NodePort
  ports:
  - name: grpc
    nodePort: 30440
    port: 443
    protocol: TCP
    targetPort: grpc
  selector:
    app.kubernetes.io/instance: spire
    app.kubernetes.io/name: server