# Local-development scaffolding for NKE API authentication. Development only. A
# real deployment needs just the JWKS discovery ClusterRoleBinding, which the
# chart renders from apiAuth.clusterIssuerDiscovery.
#
# Two client identities, so the negative cases can be exercised by hand:
#
#   nke-clients/nke-client     admitted   -> 200
#   nke-outsiders/nke-outsider unadmitted -> 403
#
#   kubectl create token nke-client -n nke-clients \
#     --audience=https://nke.tilt.local --duration=10m
#
# A third identity, nke-system/nke-cli, exists only because deploy/authz/
# roles.json (the production policy bundle this environment also deploys,
# see nke-authz-dev) grants Cedar role "reader" to
# NKE::Principal "system:serviceaccount:nke-system:nke-cli" by name -- the
# authz e2e suite's "the reader role" spec (test/e2e/authz_test.go) needs a
# real, mintable ServiceAccount for that exact principal to exercise a real
# allow decision in this environment. It is admitted below the same as
# nke-client.
#
# roles.json also names nke-clients/nke-client itself, granting it
# operator+nodeOperator: that is authn's own default admitted identity (see
# above), the one essentially every e2e spec that isn't authz-specific
# authenticates as, so it needs real write access now that authz actually
# enforces here.
#
# A fourth identity, nke-clients/nke-claim-subject, exists only for
# authz_claims_test.go's claim-based-role spec -- see its own comment below,
# next to the roles.serviceAccounts rule that grants it "reader".
#
# nkectl mints that same admitted identity from a management-cluster kubeconfig
# (nkectl config set-site --kubeconfig). The token-minter RoleBindings below
# are for the nke-e2e ServiceAccount the e2e suite uses, not for a human
# operator. A cluster-admin kubeconfig, including Tilt's kind user, can mint
# without them.
#
# See hack/nke-auth-demo.sh.
---
# Tilt owns the release namespace rather than Helm's --create-namespace: this
# file is applied before the release runs. Same as nke-system-namespace.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: cloud-workflow-engine
---
apiVersion: v1
kind: Namespace
metadata:
  name: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nke-client
  namespace: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
# The unadmitted counterpart: its tokens authenticate and then fail admission, so
# a 403 rather than a 401.
apiVersion: v1
kind: Namespace
metadata:
  name: nke-outsiders
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nke-outsider
  namespace: nke-outsiders
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
# The e2e suite mints its own tokens through the TokenRequest API. Each Role
# below is pinned by resourceNames to a single service account, so neither grants
# token minting across the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nke-e2e
  namespace: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nke-client-token-minter
  namespace: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["nke-client"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nke-client-token-minter
  namespace: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nke-client-token-minter
subjects:
  - kind: ServiceAccount
    name: nke-e2e
    namespace: nke-clients
---
# The unadmitted counterpart, so the negative specs prove a real 403.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nke-outsider-token-minter
  namespace: nke-outsiders
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["nke-outsider"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nke-outsider-token-minter
  namespace: nke-outsiders
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nke-outsider-token-minter
subjects:
  - kind: ServiceAccount
    name: nke-e2e
    namespace: nke-clients
---
# The reader-role principal deploy/authz/roles.json names by identity:
# system:serviceaccount:nke-system:nke-cli. Lives in nke-system rather than
# nke-clients because that is the namespace the shipped bundle actually
# grants -- Tilt's nke-system-namespace resource owns creating this
# namespace, hence nke-auth-dev's added resource_deps on it (Tiltfile).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nke-cli
  namespace: nke-system
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nke-cli-token-minter
  namespace: nke-system
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["nke-cli"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nke-cli-token-minter
  namespace: nke-system
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nke-cli-token-minter
subjects:
  - kind: ServiceAccount
    name: nke-e2e
    namespace: nke-clients
---
# A fourth identity, dedicated to authz_claims_test.go's "grants a role by
# (namespace, service account) match" spec. It exists so that spec has a
# claim-based grant to exercise without sharing an identity with anything
# else this environment admits: nke-client (below) is authn's own default
# admitted identity -- nke.NewClient's authtoken.Discover fallback, which
# essentially every non-authz e2e spec authenticates as, including core
# cluster lifecycle -- and giving it a claim rule with a narrow role used to
# make that collide (the shared identity got downgraded to whatever the
# narrow rule granted). nke-cli already carries a *static* roles.json role,
# which the spec explicitly excludes as "not proof of the claim path". This
# identity carries neither: nothing else mints a token for it, and
# roles.json names it not at all, so the only role it ever holds is the one
# roles.serviceAccounts below grants it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nke-claim-subject
  namespace: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nke-claim-subject-token-minter
  namespace: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["nke-claim-subject"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nke-claim-subject-token-minter
  namespace: nke-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nke-claim-subject-token-minter
subjects:
  - kind: ServiceAccount
    name: nke-e2e
    namespace: nke-clients
---
# The authentication configuration, mounted at /etc/nke/auth/auth.yaml by the
# chart. See internal/auth and the README for the schema. Only
# auth.nke.nvidia.com/v1alpha1 is accepted: the apiserver's own
# AuthenticationConfiguration shares the kind but not the group.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nke-auth-config
  namespace: cloud-workflow-engine
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
data:
  auth.yaml: |
    apiVersion: auth.nke.nvidia.com/v1alpha1
    kind: AuthenticationConfiguration
    audiences: ["https://nke.tilt.local"]
    issuers:
      - name: local-kubernetes
        issuer: "https://kubernetes.default.svc.cluster.local"
        # Every issuer is fetched the same way, as a JWKS over HTTPS. The
        # cluster's own endpoint is not anonymous, hence the bearer token and
        # the issuer-discovery ClusterRole.
        jwks:
          uri: "https://kubernetes.default.svc/openid/v1/jwks"
          caBundlePath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearerTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
        algorithms: [RS256, ES256]
        admit:
          serviceAccounts:
            # Omitting `name` would widen the rule to every service account in
            # the namespace, nke-e2e above included.
            - namespace: nke-clients
              name: nke-client
            - namespace: nke-system
              name: nke-cli
            - namespace: nke-clients
              name: nke-claim-subject
        # nke-clients/nke-client's operator+nodeOperator grant lives in
        # roles.json (deploy/authz), a static entry, not a rule here -- it is
        # authn's own default admitted identity (authtoken.DefaultNamespace/
        # DefaultServiceAccount), which essentially every non-authz e2e spec
        # authenticates as via nke.NewClient's authtoken.Discover fallback,
        # including core cluster lifecycle (create/delete cluster, scale node
        # pools). It needs the same real write access the rest of the suite
        # has always assumed it has, now that authz genuinely enforces in this
        # environment; a claim-based rule here would only be exercising the
        # same mechanism authz_claims_test.go already tests in isolation
        # below, for no reason, on the suite's one load-bearing identity.
        #
        # Grants nke-clients/nke-claim-subject the reader role by (namespace,
        # service account) match -- so authz_claims_test.go's "grants a role
        # by (namespace, service account) match" spec has a real claim-based
        # rule to exercise. This identity is minted only for that spec (see
        # its ServiceAccount above): nothing else in this environment
        # authenticates as it, so granting it a narrow, read-only role here
        # can never take write access away from anything that depends on it.
        roles:
          serviceAccounts:
            - namespace: nke-clients
              name: nke-claim-subject
              role: reader
      # SPIRE is omitted because it is not reachable yet, and an unreachable
      # issuer is a startup failure in enforcing mode. Two things are missing: the
      # discovery provider's serving certificate does not carry the in-cluster
      # service name, which does not resolve from the pod network anyway, and
      # caBundlePath needs secret oidc-provider-upstream-ca copied over from the
      # spire-server namespace. Every value below was read off this cluster:
      #
      #   - name: spire
      #     issuer: "https://nke.site-controller.internal"
      #     jwks:
      #       uri: "https://nke.site-controller.internal:30443/keys"
      #       caBundlePath: /etc/nke/spire-ca/ca.crt
      #     algorithms: [RS256]
      #     admit:
      #       spiffe:
      #         trustDomain: cwe-capi.nke.local
      #         pathPrefixes: ["/nke-e2e/"]
