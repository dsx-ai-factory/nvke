apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: nvke-service
spec:
  className: spire-mgmt-spire
  spiffeIDTemplate: "spiffe://{{.TrustDomain}}/nvke-service/{{.PodSpec.ServiceAccountName}}"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - nvke-controller
      - capi-system
      - capi-kubeadm-control-plane-system
      - capi-kubeadm-bootstrap-system
      - capd-system
