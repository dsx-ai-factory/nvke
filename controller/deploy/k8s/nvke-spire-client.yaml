# The SPIRE-attested client identity for NVKE API authentication, and the probe it
# runs. The Workload API issues a JWT-SVID only to an attested process, so this
# needs a real pod; test/e2e/authn_spire_test.go creates it.
#
#   cd test/e2e && KUBECONFIG="$HOME/.kube/config" \
#     go test . -count=1 -args -ginkgo.label-filter=authn-spire
#
# The matching NVKE configuration is the `spire` issuer in apiAuth.config
# (hack/tilt-controller-api-auth-values.yaml): its admit.spiffe.pathPrefixes must agree with
# the spiffeIDTemplate below and its trustDomain with the cluster's. Development
# only; the grant is wide, see the ClusterSPIFFEID.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nke-spire-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
# The admitted identity: spiffe://<trust domain>/nke-e2e/nke-spire-client.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nke-spire-client
  namespace: nke-spire-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
---
# What makes SPIRE issue this workload an SVID.
#
# The path segment is /nke-e2e/ rather than NVKE's own /nvke-service/, so the probe
# does not share NVKE's prefix and admit.spiffe's prefix check is actually
# exercised. className must match the SPIRE controller manager's (Tilt's chart
# values set spiffe.spire.className); a wrong value is ignored silently and shows up as a pod
# that never gets an SVID.
#
# Any pod matching both selectors below gets full NVKE API access. Dev clusters
# only.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: nke-spire-client
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
spec:
  className: spire-mgmt-spire
  spiffeIDTemplate: "spiffe://{{.TrustDomain}}/nke-e2e/{{.PodSpec.ServiceAccountName}}"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - nke-spire-clients
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: cloud-workflow-engine
      nke.nvidia.com/purpose: nke-auth-dev
---
# The probe fetches JWT-SVIDs over the Workload API socket, calls NVKE's Service
# with them, and writes one line to the termination message for the spec to
# assert on.
#
# It tests two cases because a 200 alone would also come from an NVKE with the
# middleware out of the chain. The second SVID differs only in "aud" and must be
# rejected with a 401.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nke-spire-probe
  namespace: nke-spire-clients
  labels:
    app.kubernetes.io/name: cloud-workflow-engine
    app.kubernetes.io/component: api-auth-dev
    app.kubernetes.io/part-of: cloud-workflow-engine
    nke.nvidia.com/purpose: nke-auth-dev
data:
  probe.sh: |
    #!/usr/bin/env bash
    # Reports one line, to stdout and to the termination message:
    #
    #   spiffe_id=<sub of the SVID> admitted=<status> wrong_audience=<status>
    #
    # or, if no SVID could be fetched: error=<what failed>
    set -uo pipefail

    SOCKET="${SPIFFE_ENDPOINT_SOCKET:-unix:///spiffe-workload-api/spire-agent.sock}"
    EXEC_AUTH="${SPIFFE_JWT_EXEC_AUTH:-/opt/spiffe/bin/k8s-spiffe-workload-jwt-exec-auth}"
    NKE_URL="${NKE_URL:-http://nvke-controller.nvke-controller.svc:8080}"
    PROBE_PATH="${PROBE_PATH:-/api/clusters}"
    AUDIENCE="${NKE_AUDIENCE:-https://nke.tilt.local}"
    WRONG_AUDIENCE="${NKE_WRONG_AUDIENCE:-https://nke.wrong.invalid}"
    # Generous: neither attestation nor entry propagation has happened when the
    # container starts.
    SVID_TIMEOUT="${SVID_TIMEOUT:-90s}"
    REPORT="${REPORT:-/dev/termination-log}"

    report() { printf '%s\n' "$*"; printf '%s\n' "$*" >"${REPORT}"; }
    fail() { report "error=$*"; exit 1; }

    [[ -x "${EXEC_AUTH}" ]] || fail "no JWT-SVID fetcher at ${EXEC_AUTH}"

    # One JWT-SVID for the requested audience, or the empty string.
    svid() {
      SPIFFE_ENDPOINT_SOCKET="${SOCKET}" SPIFFE_JWT_AUDIENCE="$1" \
        "${EXEC_AUTH}" -timeout "${SVID_TIMEOUT}" 2>/dev/null \
        | awk '$1 == "token:" { print $2; exit }'
    }

    # The "sub", which for an SVID is the full SPIFFE ID. Decoded rather than
    # assumed, so the spec asserts on the identity actually presented. The token
    # itself is a live credential and never leaves.
    claim_sub() {
      local payload="${1#*.}"
      payload="${payload%%.*}"
      payload="${payload//-/+}"
      payload="${payload//_//}"
      case $(( ${#payload} % 4 )) in
        2) payload="${payload}==" ;;
        3) payload="${payload}=" ;;
      esac
      printf '%s' "${payload}" | base64 -d 2>/dev/null \
        | sed -n 's/.*"sub":"\([^"]*\)".*/\1/p'
    }

    probe() {
      curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
        -H "Authorization: Bearer $1" "${NKE_URL}${PROBE_PATH}"
    }

    admitted_token="$(svid "${AUDIENCE}")"
    [[ -n "${admitted_token}" ]] \
      || fail "no JWT-SVID for audience ${AUDIENCE} from ${SOCKET} within ${SVID_TIMEOUT}"

    wrong_token="$(svid "${WRONG_AUDIENCE}")"
    [[ -n "${wrong_token}" ]] \
      || fail "no JWT-SVID for audience ${WRONG_AUDIENCE} from ${SOCKET} within ${SVID_TIMEOUT}"

    spiffe_id="$(claim_sub "${admitted_token}")"
    [[ -n "${spiffe_id}" ]] || fail "the JWT-SVID carries no sub claim"

    report "spiffe_id=${spiffe_id} admitted=$(probe "${admitted_token}") wrong_audience=$(probe "${wrong_token}")"
