# What this target changes about spire, applied over values.yaml.

# The hostnames the OIDC discovery provider will answer to, minus the two this
# run computes. A tenant kube-apiserver fetches the discovery document by IP,
# and the provider rejects any request whose Host header is not on this list.
#
# Stated here, not just in components/spire.yaml, so the deploy path describes
# its own deployment: the chart is not part of the generated tree, so a reader
# of capnico-e2e/ alone could not otherwise see them. deploy-sbom.sh reads this
# list and appends MANAGEMENT_VIP and the kind bridge gateway, because a values
# file replaces a list rather than appending to it.
spiffe-oidc-discovery-provider:
  config:
    additionalDomains:
      - "nke.site-controller.internal"
      - "localhost"
      - "127.0.0.1"
