# Temporal's schema jobs connect to Postgres to create and migrate the temporal
# and temporal_visibility databases, which is why postgresql precedes it.
#
# No namespaceOverride exists in this chart -- its core templates follow
# .Release.Namespace -- so the release namespace IS where it lands.
chart:
  name: temporal
  version: "0.74.0"
  repository: https://go.temporal.io/helm-charts
release:
  name: temporal
  namespace: temporal
values:
  - values.yaml
  - overlay.yaml
