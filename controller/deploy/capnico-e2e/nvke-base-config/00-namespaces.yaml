# Namespaces for target "capd-e2e", derived from the registry's defaultNamespace fields.
# The chart emits none of its own: a consumer creates them, and
# helm --create-namespace makes only the release namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: nvke-controller
---
apiVersion: v1
kind: Namespace
metadata:
  name: nvke-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: v1
kind: Namespace
metadata:
  name: spire-server
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: spire-system
  labels:
    # spire-agent and spiffe-csi-driver need hostNetwork,
    # hostPID and privileged containers.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: temporal
---
# CAPNICo's controller. The provider is installed outside this deploy path, by
# install-capnico.sh, but the namespace is created here because
# nico-credentials two files along lands in it and the executor does not pass
# --create-namespace.
#
# No Helm ownership metadata: install-capnico.sh's adopt_namespace() applies its
# own, for release capi-provider-nico, so that its chart can adopt the namespace
# it templates. Claiming it for a different release here would fight that.
apiVersion: v1
kind: Namespace
metadata:
  name: capnico-system
