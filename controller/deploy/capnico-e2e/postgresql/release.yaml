# The development datastore: one pod, ephemeral, wrapping the official postgres
# image pinned by digest. Not Bitnami's chart -- helm resolves dependencies at
# package time over plain HTTPS, and Docker Hub's anonymous rate limit killed
# two consecutive runs before the deploy had started.
#
# path, not repository: this chart lives in this repository and has no
# dependencies, so helm installs it straight from the directory. Relative to
# this deploy path.
chart:
  name: postgresql
  path: ../charts/postgresql
release:
  name: postgresql
  namespace: postgres
values:
  - values.yaml
