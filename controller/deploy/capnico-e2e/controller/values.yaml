# cloud-workflow-engine values for the nke-stack composition. Merged under the `cloud-workflow-engine` key of the
# generated chart's values.yaml -- the top-level key is added by the generator,
# so it is deliberately absent here.

# ─── cloud-workflow-engine ───────────────────────────────────────────────────
# image.repository/tag are left at the chart's own defaults. The nvcr-published
# chart already carries nvcr.io/j7sbcjl3qgta/nvke-controller and the
# svc-nke-ngc-imagepull secret -- chart-publish-nvcr.yml rewrites both at
# package time -- so pulling the chart from nvcr gets a matching image without
# any override here.
#
# An installer can still repoint them, which the CAPD e2e depends on: it builds
# the controller at HEAD and loads it into kind, so it overrides repository and
# tag and never pulls from a registry. Keeping cloud-workflow-engine a subchart
# with live values is what makes that possible.
namespaceOverride: nvke-controller
