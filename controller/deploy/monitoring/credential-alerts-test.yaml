{
  "rule_files": [
    "../charts/controller/files/credential-alerts.yaml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "expiry crosses warning threshold well before expiration and resolves after renewal",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_certificate_warning_window_seconds",
          "values": "3888000x40"
        },
        {
          "series": "nvke_controller_certificate_not_after_timestamp_seconds{tenant_cluster=\"tenant\",node=\"cp\",credential=\"apiserver\"}",
          "values": "3888300x20 7776000x20"
        },
        {
          "series": "nvke_controller_certificate_observation_available{tenant_cluster=\"tenant\",node=\"cp\",credential=\"apiserver\"}",
          "values": "1x41"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "5m",
          "alertname": "NVKECertificateExpiring",
          "exp_alerts": []
        },
        {
          "eval_time": "10m",
          "alertname": "NVKECertificateExpiring",
          "exp_alerts": []
        },
        {
          "eval_time": "11m",
          "alertname": "NVKECertificateExpiring",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "node": "cp",
                "credential": "apiserver",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "A supported node certificate is approaching expiration",
                "description": "Check the certificate monitoring guide and renewal outcome; CA expiration requires a separate operator procedure.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "22m",
          "alertname": "NVKECertificateExpiring",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "optional super-admin absence and stale expiry do not cause missing or expiry alerts",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_certificate_warning_window_seconds",
          "values": "3888000x30"
        },
        {
          "series": "nvke_controller_certificate_not_after_timestamp_seconds{tenant_cluster=\"tenant\",node=\"cp\",credential=\"super-admin\"}",
          "values": "100x30"
        },
        {
          "series": "nvke_controller_certificate_observation_available{tenant_cluster=\"tenant\",node=\"cp\",credential=\"super-admin\"}",
          "values": "0x30"
        },
        {
          "series": "nvke_controller_certificate_required{tenant_cluster=\"tenant\",node=\"cp\",credential=\"super-admin\"}",
          "values": "0x30"
        },
        {
          "series": "nvke_controller_certificate_inspection_available{tenant_cluster=\"tenant\",node=\"cp\"}",
          "values": "1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20m",
          "alertname": "NVKECertificateExpiring",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
          "alertname": "NVKECertificateMissingOrInvalid",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKECertificateInspectionUnavailable holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_certificate_inspection_available{tenant_cluster=\"tenant\",node=\"cp\"}",
          "values": "0x20 1x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "NVKECertificateInspectionUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "15m",
          "alertname": "NVKECertificateInspectionUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "node": "cp",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Node certificate expiration cannot be confirmed",
                "description": "Check node-agent connectivity, inspection capability and observation freshness. Upgrade older agents; never infer certificate health from the renewal schedule.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "22m",
          "alertname": "NVKECertificateInspectionUnavailable",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKECertificateMissingOrInvalid holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_certificate_observation_available{tenant_cluster=\"tenant\",node=\"cp\",credential=\"apiserver\"}",
          "values": "0x20 1x20"
        },
        {
          "series": "nvke_controller_certificate_required{tenant_cluster=\"tenant\",node=\"cp\",credential=\"apiserver\"}",
          "values": "1x41"
        },
        {
          "series": "nvke_controller_certificate_inspection_available{tenant_cluster=\"tenant\",node=\"cp\"}",
          "values": "1x41"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "NVKECertificateMissingOrInvalid",
          "exp_alerts": []
        },
        {
          "eval_time": "15m",
          "alertname": "NVKECertificateMissingOrInvalid",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "node": "cp",
                "credential": "apiserver",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "A required credential is absent or unreadable",
                "description": "Verify the supported kubeadm layout and kubelet bootstrap state. Do not create certificates or approve CSRs without validating node identity.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "22m",
          "alertname": "NVKECertificateMissingOrInvalid",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKECertificateRenewalFailed holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_renewal_state{tenant_cluster=\"tenant\",state=\"failed\"}",
          "values": "1x10 0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "NVKECertificateRenewalFailed",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "NVKECertificateRenewalFailed",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "state": "failed",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "A certificate renewal cycle failed",
                "description": "Inspect persisted renewal status and node health. A retained mutation lock requires confirmation that the node operation terminated before recovery.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "NVKECertificateRenewalFailed",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKECertificateRenewalOverdue holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_renewal_overdue_seconds{tenant_cluster=\"tenant\"}",
          "values": "3601x20 0x20"
        },
        {
          "series": "nvke_controller_renewal_automation_enabled",
          "values": "1x41"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "NVKECertificateRenewalOverdue",
          "exp_alerts": []
        },
        {
          "eval_time": "15m",
          "alertname": "NVKECertificateRenewalOverdue",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "An automated renewal check remains overdue",
                "description": "Check Temporal availability, cluster readiness, active maintenance ownership and renewal failure before starting another cycle.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "22m",
          "alertname": "NVKECertificateRenewalOverdue",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKECertificateRenewalStuck holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_renewal_active_seconds{tenant_cluster=\"tenant\"}",
          "values": "7201x20 0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "NVKECertificateRenewalStuck",
          "exp_alerts": []
        },
        {
          "eval_time": "15m",
          "alertname": "NVKECertificateRenewalStuck",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "An accepted renewal cycle has not completed within two hours",
                "description": "Inspect the workflow and agent operation. Confirm restoration and termination before releasing ownership or retrying.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "22m",
          "alertname": "NVKECertificateRenewalStuck",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKEKubeletServingCSRStale holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_serving_csr_oldest_pending_age_seconds{tenant_cluster=\"tenant\"}",
          "values": "901x10 0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "NVKEKubeletServingCSRStale",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "NVKEKubeletServingCSRStale",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "A kubelet-serving CSR has not received a certificate",
                "description": "Check node identity validation, approver logs and signer health; an approved but unissued CSR also counts as pending.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "NVKEKubeletServingCSRStale",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKEKubeletServingCSRFailed holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_serving_csr_count{tenant_cluster=\"tenant\",state=\"failed\"}",
          "values": "1x10 0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "NVKEKubeletServingCSRFailed",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "NVKEKubeletServingCSRFailed",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "state": "failed",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "The kubelet-serving CSR inventory contains failed or denied requests",
                "description": "Inspect tenant CSR conditions and validate requester identity; never blindly approve denied requests.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "NVKEKubeletServingCSRFailed",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKEKubeletServingCSRObservationUnavailable holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_serving_csr_observation_age_seconds{tenant_cluster=\"tenant\"}",
          "values": "-1x10 0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "NVKEKubeletServingCSRObservationUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "NVKEKubeletServingCSRObservationUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Kubelet-serving CSR health cannot be confirmed",
                "description": "Check tenant access, kubeconfig refresh and tenant-manager availability. Missing inventory is not a healthy CSR count.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "NVKEKubeletServingCSRObservationUnavailable",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKEEtcdKeyRotationFailed holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_etcd_key_rotation_state{tenant_cluster=\"tenant\",state=\"failed\"}",
          "values": "1x10 0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "NVKEEtcdKeyRotationFailed",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "NVKEEtcdKeyRotationFailed",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "state": "failed",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "An etcd data-encryption-key rotation failed",
                "description": "Follow phase-specific recovery. Prepare failures release ownership; later failures retain the original workflow's lock. Never remove keys before rewrite verification.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "NVKEEtcdKeyRotationFailed",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKEEtcdKeyRotationStuck holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_etcd_key_rotation_progress_age_seconds{tenant_cluster=\"tenant\"}",
          "values": "7201x20 0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "NVKEEtcdKeyRotationStuck",
          "exp_alerts": []
        },
        {
          "eval_time": "15m",
          "alertname": "NVKEEtcdKeyRotationStuck",
          "exp_alerts": [
            {
              "exp_labels": {
                "tenant_cluster": "tenant",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "An etcd data-key rotation phase has made no progress for two hours",
                "description": "Inspect the owning workflow and current phase. A long rewrite needs investigation before restart or key removal.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "22m",
          "alertname": "NVKEEtcdKeyRotationStuck",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "NVKECredentialMetricsCollectionFailed holds, fires and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_credential_metrics_collection_success",
          "values": "0x10 1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "NVKECredentialMetricsCollectionFailed",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "NVKECredentialMetricsCollectionFailed",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Controller credential inventory metrics cannot be collected",
                "description": "Check controller database connectivity and scrape errors. The absence of per-cluster metrics does not establish credential health.",
                "runbook_url": "https://github.com/dsx-ai-factory/nvke/blob/main/controller/docs/credential-monitoring.md#alert-responses"
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "NVKECredentialMetricsCollectionFailed",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "disabled renewal automation suppresses overdue alert",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_renewal_overdue_seconds{tenant_cluster=\"tenant\"}",
          "values": "7200x30"
        },
        {
          "series": "nvke_controller_renewal_automation_enabled",
          "values": "0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20m",
          "alertname": "NVKECertificateRenewalOverdue",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "warning and automation configuration stay scoped to each scrape target",
      "interval": "1m",
      "input_series": [
        {
          "series": "nvke_controller_certificate_warning_window_seconds{job=\"site-a\"}",
          "values": "3888000x30"
        },
        {
          "series": "nvke_controller_certificate_warning_window_seconds{job=\"site-b\"}",
          "values": "7776000x30"
        },
        {
          "series": "nvke_controller_certificate_not_after_timestamp_seconds{job=\"site-a\",tenant_cluster=\"tenant\",node=\"cp\",credential=\"apiserver\"}",
          "values": "5000000x30"
        },
        {
          "series": "nvke_controller_certificate_observation_available{job=\"site-a\",tenant_cluster=\"tenant\",node=\"cp\",credential=\"apiserver\"}",
          "values": "1x30"
        },
        {
          "series": "nvke_controller_renewal_overdue_seconds{job=\"site-a\",tenant_cluster=\"tenant\"}",
          "values": "7200x30"
        },
        {
          "series": "nvke_controller_renewal_automation_enabled{job=\"site-a\"}",
          "values": "0x30"
        },
        {
          "series": "nvke_controller_renewal_automation_enabled{job=\"site-b\"}",
          "values": "1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20m",
          "alertname": "NVKECertificateExpiring",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
          "alertname": "NVKECertificateRenewalOverdue",
          "exp_alerts": []
        }
      ]
    }
  ]
}
