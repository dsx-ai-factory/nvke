# Release-wide values the umbrella used to supply. spire is itself a chart of
# subcharts -- spire-server, spire-agent, spiffe-csi-driver,
# spiffe-oidc-discovery-provider -- and helm merges `global` into every one of
# them, so this still propagates exactly as it did when nke-stack was the parent.
global:
  spire:
    # recommendations is required for the two-namespace layout: without it a
    # subchart carrying no namespaceOverride falls through to the RELEASE
    # namespace rather than spire-system.
    recommendations:
      enabled: true
      # The suite uses trustDomain example.org, which strict mode rejects.
      strictMode: false
    trustDomain: example.org
    jwtIssuer: "https://nke.site-controller.internal"
  installAndUpgradeHooks:
    enabled: false
  deleteHooks:
    enabled: false

# spire values for the nke-stack composition. Merged under the `spire` key of the
# generated chart's values.yaml -- the top-level key is added by the generator,
# so it is deliberately absent here.

# ─── spire ───────────────────────────────────────────────────────────────────
# Site identity (clusterName, trustDomain, jwtIssuer), the TPM attestor
# checksum, and the OIDC leaf's IP SANs are all deployment-specific and are
# supplied at install time, exactly as controller/Tiltfile passes them.
# Each spire subchart resolves its namespace as: its own namespaceOverride,
# else the global.spire.namespaces.* layout (only consulted when
# global.spire.recommendations.enabled is true), else the release namespace.
# controller/Tiltfile installs spire with `--namespace spire-server`, so every
# resource lands there; the overrides below reproduce that from inside a
# release whose namespace is temporal. The namespace must already exist --
# helm's --create-namespace only creates the release namespace.
# spire-agent and spiffe-csi-driver deliberately carry NO namespaceOverride:
# they fall through to spire-system under the recommended layout. Both need
# hostNetwork/hostPID and privileged, which the restricted PodSecurity label
# on spire-server rejects outright. Pinning them to spire-server is what
# an earlier chart did, and had to undo after the DaemonSets failed to
# create.
spiffe-csi-driver: {}
spire-agent:
  serviceAccount:
    # Pin the ServiceAccount name. The chart derives it as
    # "<Release.Name>-agent" unless this is set -- fullnameOverride does NOT
    # affect it -- and the server's PSAT allowlist has to name it exactly.
    # Pinning here keeps the allowlist correct whether this chart is installed
    # standalone or nested under another release; nke-spire hardcodes
    # nke-site-controller-agent instead, which holds for one release name only.
    name: spire-agent
  server:
    # Where the agent dials the server, which is a separate key from where
    # the agent's own resources land. Without it the agent derives
    # "<release>-server.<release namespace>" and dials into temporal, where
    # no server Service exists -- the agent then fails attestation with
    # "no children to pick from" and the DaemonSet never becomes Available.
    namespaceOverride: spire-server
  workloadAttestors:
    k8s:
      # Already the chart default at 0.30.1, restated so an upstream change of
      # heart cannot remove Kubernetes workload attestation silently.
      enabled: true
      # Mirrors deploy/nico, which needs this because its control-plane nodes run
      # Kata and container-scoped selectors cannot resolve inside the VM. This
      # lane runs runc and would work either way, but attesting differently
      # from the path on real hardware means a ClusterSPIFFEID that depends on
      # container selectors passes here and fails on a site.
      disableContainerSelectors: true
spire-server:
  namespaceOverride: spire-server
  # The bundle ConfigMap the agent mounts must land where the agent runs, or
  # the agent sits at Init:0/2 forever.
  bundlePublisher:
    k8sConfigMap:
      namespace: spire-system
  adminIDs:
    - spiffe://example.org/nvke-service/nvke-controller
  controllerManager:
    # The chart applies its ClusterSPIFFEID objects as part of the same release
    # that creates the controller manager serving the webhook that validates
    # them, so on a fresh install the API server calls a webhook that is not
    # listening yet. With the chart's default failurePolicy of Fail that is a
    # hard error and the whole install rolls back:
    #
    #   failed calling webhook "vclusterspiffeid.kb.io": ... connection refused
    #
    # It is a race, so it passes on a warm machine and fails on a cold CI
    # runner, which is the worst way for it to behave. Dropping the four SPIKE
    # ClusterSPIFFEIDs at 0.30.1 shortened the apply sequence enough to tip it:
    # both e2e lanes then failed on a DIFFERENT object per architecture, which
    # is the signature of a race rather than a bad manifest.
    #
    # The chart's own answer is a pair of helm hooks that flip this to Ignore
    # for the duration of an install and back afterwards -- which is why they
    # are only rendered when failurePolicy is Fail, and why disabling
    # global.installAndUpgradeHooks above removes the protection. Setting
    # Ignore outright reaches the same place with no hook Jobs, RBAC or extra
    # image. The webhook still validates once it is up; it just no longer
    # blocks admission while it is starting.
    #
    # cli/internal/bootstrap/controllerdeploy/manifests/spire-values.yaml sets the same thing
    # for the same reason.
    validatingWebhookConfiguration:
      failurePolicy: Ignore
    className: spire-mgmt-spire
    identities:
      clusterSPIFFEIDs:
        default:
          # nvke-controller workloads use a dedicated nvke-service
          # identity. Keep the fallback from racing it during reconciliation.
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - nvke-controller

        # The identity NVKE's own services present. This was a loose manifest in
        # controller/deploy/k8s, which the CAPD lane had to apply between two
        # install phases because a ClusterSPIFFEID needs a CRD the datastore
        # phase installs. Declared here it is rendered by the spire release
        # itself, so the CRD is present by construction and the ordering problem
        # does not arise.
        #
        # type: raw is required, not cosmetic. Every other type makes the chart
        # append its own expression to namespaceSelector and merge a podSelector
        # in; raw is the one branch that passes these through verbatim.
        #
        # The emitted CR is named <release namespace>-<release>-nvke-service
        # rather than nvke-service -- the chart derives it. Nothing reads it by
        # name on this path; what matters is the SPIFFE ID below, which has to
        # keep matching spire-server.adminIDs above and the prefixes
        # agent/cmd/agent/main.go admits.
        nvke-service:
          type: raw
          spiffeIDTemplate: "spiffe://{{.TrustDomain}}/nvke-service/{{.PodSpec.ServiceAccountName}}"
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - nvke-controller
                  - capi-system
                  - capi-kubeadm-control-plane-system
                  - capi-kubeadm-bootstrap-system
                  - capd-system
  nodeAttestor:
    k8sPSAT:
      # The agent moved to spire-system, so the server must accept it from
      # there: the default allowlist is empty and attestation fails with
      # "is not an allowed service account". Stable because spire-agent's
      # fullnameOverride pins the ServiceAccount name (an earlier chart hit
      # this and pinned the release name instead).
      serviceAccountAllowList: ["spire-system:spire-agent"]
    tpmDirect:
      enabled: true
  extraVolumes:
    - name: tpm-pubhashes
      configMap:
        name: tpm-pubhashes
        optional: true
  extraVolumeMounts:
    - name: tpm-pubhashes
      mountPath: /run/spire/data/tpm-direct/hashes
      readOnly: true
spiffe-oidc-discovery-provider:
  enabled: true
  namespaceOverride: spire-server
  replicaCount: 2
  tls:
    spire:
      enabled: false
    certManager:
      enabled: true
      issuer:
        # The composition's consumer owns the Issuer
        # (controller/deploy/k8s/oidc-upstream-ca.yaml).
        create: false
      certificate:
        duration: 2160h
        privateKey:
          algorithm: ECDSA
          size: 256
        dnsNames:
          - nke.site-controller.internal
          - localhost
        issuerRef:
          group: cert-manager.io
          kind: Issuer
          name: nvke-oidc-upstream-ca
  config:
    # The provider rejects requests whose Host header is absent here. Literal
    # IPs tenants hit are appended at install time -- kube-apiserver fetches
    # the discovery URL by IP, not by the logical issuer host.
    additionalDomains:
      - "nke.site-controller.internal"
      - "localhost"
      - "127.0.0.1"

# ─── cloud-workflow-engine ───────────────────────────────────────────────────
# image.repository/tag are left at the chart's own defaults. The nvcr-published
# chart already carries nvcr.io/j7sbcjl3qgta/nvke-controller and the
# svc-nke-ngc-imagepull secret -- chart-publish-nvcr.yml rewrites both at
# package time -- so pulling the chart from nvcr gets a matching image without
# any override here.
#
# An installer can still repoint them, which the CAPD e2e depends on: it builds
# the controller at HEAD and loads it into kind, so it overrides repository and
# tag and never pulls from a registry. Keeping cloud-workflow-engine a subchart
# with live values is what makes that possible.
