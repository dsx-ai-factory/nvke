# nke-auth-dev, copied from this repository per manifests/nke-auth-dev.pin.yaml,
# without its nvke-auth-config ConfigMap: the controller chart renders that from
# apiAuth.config in controller/overlay.yaml, and Helm will not adopt one kubectl
# created. Applied with kubectl apply --server-side.
---
apiVersion: v1
kind: Namespace
metadata:
    name: nvke-controller
---
apiVersion: v1
kind: Namespace
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-clients
---
apiVersion: v1
kind: ServiceAccount
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-client
    namespace: nke-clients
---
apiVersion: v1
kind: Namespace
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-outsiders
---
apiVersion: v1
kind: ServiceAccount
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-outsider
    namespace: nke-outsiders
---
apiVersion: v1
kind: ServiceAccount
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-e2e
    namespace: nke-clients
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-client-token-minter
    namespace: nke-clients
rules:
    - apiGroups:
        - ""
      resourceNames:
        - nke-client
      resources:
        - serviceaccounts/token
      verbs:
        - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-client-token-minter
    namespace: nke-clients
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: nke-client-token-minter
subjects:
    - kind: ServiceAccount
      name: nke-e2e
      namespace: nke-clients
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-outsider-token-minter
    namespace: nke-outsiders
rules:
    - apiGroups:
        - ""
      resourceNames:
        - nke-outsider
      resources:
        - serviceaccounts/token
      verbs:
        - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        app.kubernetes.io/component: api-auth-dev
        app.kubernetes.io/name: cloud-workflow-engine
        app.kubernetes.io/part-of: cloud-workflow-engine
        nke.nvidia.com/purpose: nke-auth-dev
    name: nke-outsider-token-minter
    namespace: nke-outsiders
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: nke-outsider-token-minter
subjects:
    - kind: ServiceAccount
      name: nke-e2e
      namespace: nke-clients
