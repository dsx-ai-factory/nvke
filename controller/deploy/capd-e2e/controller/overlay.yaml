# What this target changes about controller, applied over values.yaml.

# The suite mints its own token and presents it on every call, so the ordinary
# specs exercise the shipping authentication path rather than bypassing it.
# backend-e2e.sh fails rather than skips when authentication is not enforced.
apiAuth:
  enabled: true
  permissive: false

# The controller reconciles CAPI objects, so it needs the RBAC for them.
# The controller accepts only the API provider blocks named here, and the chart defaults
# to nico. This lane submits Infra blocks against CAPD, so without it every
# create is rejected with "infra provider is not supported by this
# deployment" -- which is what the first real run of this deploy path hit.
# controller/Tiltfile:129 appends the same value for the capd provider.
supportedInfraProviders: infra
capi:
  rbac:
    create: true

tenantAccess:
  enabled: true

nvkeOIDCAuth:
  enabled: true
  # Logical issuer, string-compared against the JWT's iss claim; it does not
  # have to resolve. discoveryURL does, and is VIP-derived, so it is passed in.
  issuerURL: "https://nke.site-controller.internal"
  # The CA the OIDC provider's leaf is signed by, published by the chain in
  # controller/deploy/k8s/oidc-upstream-ca.yaml.
  caBundleSecret:
    namespace: spire-server
    name: oidc-provider-upstream-ca
    key: ca.crt

# The default container lane installs the legacy OVN bundle during init.
cni:
  installAfterInit: false

# Of the variables the Tiltfile forwards, backend-e2e.sh sets only this one.
# A container node cannot reboot in-guest, so the reboot goes out of band
# through the CAPI Machine annotation instead.
env:
  - name: NODE_REBOOT_SOFT_REBOOT_ENABLED
    value: "false"

# ---------------------------------------------------------------------------
# Moved here from controller/hack/tilt-controller-chart-values.yaml, which the lane
# used to read off disk and pass as a second --values file. It is static
# configuration -- the same on every run -- so it belongs in the overlay: a
# deploy path that does not carry it under-describes the deployment, and a
# reader of the generated tree could not tell how the controller was configured.
#
# The Tiltfile still reads that file (controller/Tiltfile:1018,1197), so this
# is a second copy and the two can drift. Verified equivalent at the time of
# the move by rendering the controller chart from each and diffing: identical.
#
# Two things deliberately NOT copied, because the run supplies them:
# image.repository/tag (the locally built controller) and
# spiffe.spire.serverAddress (the kind VIP). image.pullPolicy IS kept -- the
# image is side-loaded into kind, so it must not be re-pulled.
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0

fullnameOverride: nvke-controller
namespaceOverride: nvke-controller
# The chart pins nameOverride (the pod name label) and serviceAccount.name
# (which the SPIRE admin ID and the controller's SPIFFE ID name) instead of
# deriving them from the fullname, so both are set alongside it.
nameOverride: nvke-controller
serviceAccount:
  name: nvke-controller

nvkeSystemNamespace:
  create: false

image:
  # repository and tag are per-run: the lane --sets the tag it just built.
  pullPolicy: IfNotPresent
imagePullSecrets: []

metrics:
  networkPolicy:
    enabled: false
serviceMonitor:
  enabled: false

livenessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: nvke-controller
  postgresUser: postgres
  # postgresPassword is supplied by the Tiltfile from CNPG_SUPERUSER_PASSWORD —
  # do not hardcode it here.
  sslMode: disable

secrets:
  dgxcTenantCredSecretName: ""

temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233
  cloudWorkflow:
    namespace: nvke-controller
    queue: nvke-controller-tasks

profiles:
  path: /profiles
  # Exercise the fleet profiles.image materialize path. Tilt builds
  # docker.local/cwe-profiles:tilt, built outside this repository.
  image:
    enabled: true
    repository: docker.local/cwe-profiles
    tag: tilt

# apiAuth is not set here. The Tiltfile drives it from NKE_AUTH_ENABLED and
# NKE_PERMISSIVE_MODE, and the chart's default ConfigMap name already matches
# the one deploy/k8s/nvke-auth-dev.yaml applies.

spiffe:
  enabled: true
  endpointSocket: unix:///spiffe-workload-api/spire-agent.sock
  spire:
    serverNamespace: spire-server
    className: spire-mgmt-spire
    tpmPubhashesConfigMapName: tpm-pubhashes
    serverPort: "30440"

# The greenfield site profile, which the chart's legacy defaults do not carry.
identity:
  fieldManagerName: nvke-controller
  fieldManagerRebootMachineName: nvke-controller-reboot-machine
  fieldManagerMachineHealthIssueName: nvke-controller-machine-health-issue
  managedByLabelValue: nvke-controller
teleport:
  managedByLabelValue: nvke-controller
  tokenNamePrefix: nvke-controller-
