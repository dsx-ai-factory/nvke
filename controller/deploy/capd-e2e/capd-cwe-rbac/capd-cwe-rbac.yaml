# capd-cwe-rbac, copied from this repository per manifests/capd-cwe-rbac.pin.yaml. Applied with kubectl apply --server-side.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: nvke-controller-capd
rules:
    - apiGroups:
        - infrastructure.cluster.x-k8s.io
      resources:
        - dockerclusters
        - dockerclustertemplates
        - dockermachines
        - dockermachinetemplates
        - dockermachinepools
        - dockermachinepooltemplates
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - watch
    - apiGroups:
        - apiextensions.k8s.io
      resourceNames:
        - dockerclusters.infrastructure.cluster.x-k8s.io
        - dockerclustertemplates.infrastructure.cluster.x-k8s.io
        - dockermachines.infrastructure.cluster.x-k8s.io
        - dockermachinetemplates.infrastructure.cluster.x-k8s.io
        - dockermachinepools.infrastructure.cluster.x-k8s.io
        - dockermachinepooltemplates.infrastructure.cluster.x-k8s.io
      resources:
        - customresourcedefinitions
      verbs:
        - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: nvke-controller-capd
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: nvke-controller-capd
subjects:
    - kind: ServiceAccount
      name: nvke-controller
      namespace: nvke-controller
