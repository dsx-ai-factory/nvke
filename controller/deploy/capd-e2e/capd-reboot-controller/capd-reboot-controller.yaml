# capd-reboot-controller, copied from this repository per manifests/capd-reboot-controller.pin.yaml. Applied with kubectl apply --server-side.
---
apiVersion: v1
kind: Namespace
metadata:
    name: capd-reboot-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: capd-reboot-controller
    namespace: capd-reboot-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: capd-reboot-controller
rules:
    - apiGroups:
        - infrastructure.cluster.x-k8s.io
      resources:
        - dockermachines
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - cluster.x-k8s.io
      resources:
        - machines
      verbs:
        - get
        - list
        - watch
        - patch
        - update
    - apiGroups:
        - cluster.x-k8s.io
      resources:
        - machines/status
      verbs:
        - get
        - patch
        - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: capd-reboot-controller
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: capd-reboot-controller
subjects:
    - kind: ServiceAccount
      name: capd-reboot-controller
      namespace: capd-reboot-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/name: capd-reboot-controller
        app.kubernetes.io/version: dev
    name: capd-reboot-controller
    namespace: capd-reboot-system
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: capd-reboot-controller
    template:
        metadata:
            labels:
                app.kubernetes.io/name: capd-reboot-controller
                app.kubernetes.io/version: dev
        spec:
            containers:
                - envFrom:
                    - configMapRef:
                        name: capd-reboot-controller-config
                  image: ko.local/capd-reboot-controller
                  imagePullPolicy: IfNotPresent
                  name: capd-reboot-controller
                  resources:
                    limits:
                        cpu: 50m
                        memory: 64Mi
                    requests:
                        cpu: 10m
                        memory: 16Mi
            serviceAccountName: capd-reboot-controller
---
apiVersion: v1
data:
    CAPD_REBOOT_CONTROLLER_SLEEP_DURATION: 10s
kind: ConfigMap
metadata:
    name: capd-reboot-controller-config
    namespace: capd-reboot-system
