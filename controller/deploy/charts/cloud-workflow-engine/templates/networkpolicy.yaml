{{- if .Values.metrics.networkPolicy.enabled }}
# Restrict ingress on the Prometheus metrics port to known scraper namespaces
# (kube-prometheus-stack in "monitoring", Grafana Alloy in "dgxc-alloy").
# Addresses Argus finding 9593c0b7 (CWE-306).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-workflow-engine.fullname" . }}-metrics
  namespace: {{ include "cloud-workflow-engine.namespace" . }}
  labels:
    {{- include "cloud-workflow-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-workflow-engine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dgxc-alloy
        {{- range .Values.metrics.networkPolicy.additionalNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- end }}
