apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-%s" (include "cloud-workflow-engine.fullname" .) "db")  .Values.secrets.dbSecretName}}
  namespace: {{ include "cloud-workflow-engine.namespace" . }}
type: Opaque
data:
  {{ default "database-connection-string" .Values.secrets.dbSecretKey }}: {{ (include "app-db.connectionString" .) | b64enc }}
{{- end }}