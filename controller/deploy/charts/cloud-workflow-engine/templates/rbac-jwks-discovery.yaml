{{- if and .Values.apiAuth.enabled .Values.apiAuth.clusterIssuerDiscovery }}
# Grants NKE read access to the cluster's own JWKS at /openid/v1/jwks, which an
# issuer using `keys: {kubernetes: {}}` verifies tokens against. The endpoint is
# not anonymous: without this binding the fetch returns 403 and NKE will not
# start when enforcing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloud-workflow-engine.fullname" . }}-service-account-issuer-discovery
  labels:
    {{- include "cloud-workflow-engine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-workflow-engine.serviceAccountName" . }}
    namespace: {{ include "cloud-workflow-engine.namespace" . }}
{{- end }}
