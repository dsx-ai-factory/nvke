# The AuthenticationConfiguration, in the file format NVKE reads at
# AUTH_CONFIG_PATH. The controller reads the same values from apiAuth in its
# settings ConfigMap (controllerConfig.name); this copy stays for nvkectl, which
# discovers the audience here, and to carry extraFiles into the mounted directory.
#
# apiAuth.config is rendered verbatim; only apiVersion and kind are supplied
# here. The chart checks that the two top-level keys are present and that
# apiAuth.config carries no apiVersion, kind or enabled; it applies none of
# auth/authn/config.go's other rules, which are strict and whose errors name
# the field at fault, and restating them in Helm would leave two schemas to keep
# in step. An issuer that gains a new key needs no change to this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "apiAuth.configMap.name is required when apiAuth.enabled=true" .Values.apiAuth.configMap.name }}
  namespace: {{ include "controller.namespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
data:
  # The key is fixed by the chart, which mounts this ConfigMap at
  # apiAuth.mountPath so extraFiles and nvkectl find it beside the configuration.
  {{ include "controller.apiAuth.configFile" . }}: |
    # NVKE reads this configuration from apiAuth in ConfigMap {{ include "controller.controllerConfig.name" . }}. This copy is for nvkectl and the files beside it; editing it changes nothing NVKE enforces.
    apiVersion: auth.nke.nvidia.com/v1alpha1
    kind: AuthenticationConfiguration
    {{- toYaml .Values.apiAuth.config | nindent 4 }}
  {{- /*
  Anything else the configuration refers to by path. The volume mount carries no
  items selector, so every key here becomes a file in apiAuth.mountPath, which is
  what a jwks.caBundlePath can point at. Content, not a reference: an issuer's CA
  bundle is a public certificate, and pulling one from a Secret would need a
  second volume to land in the same directory.
  */}}
  {{- range $name, $content := .Values.apiAuth.configMap.extraFiles }}
  {{ $name }}: |
    {{- toString $content | nindent 4 }}
  {{- end }}
{{- end }}
