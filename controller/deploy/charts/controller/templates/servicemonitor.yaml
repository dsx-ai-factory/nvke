{{- if and .Values.serviceMonitor.enabled (dig "monitoring" "enabled" true (.Values.global | default dict)) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.serviceMonitor.name }}
  namespace: {{ include "controller.namespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - path: /metrics
      port: metrics
  namespaceSelector:
    matchNames:
      - {{ include "controller.namespace" . }}
  selector:
    {{- /*
      Merged into one map rather than emitted as two blocks. Emitting both
      produced a duplicate app.kubernetes.io/name key whenever a value here
      repeated one of the selector labels -- which the shipped default did.
      Helm never parses its own output, so `helm lint` and `helm template`
      both passed while the manifest was invalid.
    */}}
    {{- $labels := fromYaml (include "controller.selectorLabels" .) }}
    {{- $labels = merge (deepCopy (.Values.serviceMonitor.matchLabels | default dict)) $labels }}
    matchLabels:
      {{- toYaml $labels | nindent 6 }}
{{- end }}
