{{- include "controller.apiAuth.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controller.fullname" . }}
  namespace: {{ include "controller.namespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
  {{- $reloadSecrets := list }}
  {{- $reloadConfigMaps := list }}
  {{- if and .Values.secrets.forgeSecret.enabled (not (hasKey (default dict .Values.deploymentAnnotations) "secret.reloader.stakater.com/reload")) }}
  {{- $reloadSecrets = append $reloadSecrets (default (printf "%s-%s" (include "controller.fullname" .) "forge-creds") .Values.secrets.forgeSecretName) }}
  {{- end }}
  {{- if and .Values.secrets.dgxcTenantCredSecretName (not (hasKey (default dict .Values.deploymentAnnotations) "secret.reloader.stakater.com/reload")) }}
  {{- $reloadSecrets = append $reloadSecrets .Values.secrets.dgxcTenantCredSecretName }}
  {{- end }}
  {{- if and .Values.secrets.cnpgDbPasswordsSecretName (not (hasKey (default dict .Values.deploymentAnnotations) "secret.reloader.stakater.com/reload")) }}
  {{- $reloadSecrets = append $reloadSecrets .Values.secrets.cnpgDbPasswordsSecretName }}
  {{- end }}
  {{- if and .Values.apiAuth.enabled (not (hasKey (default dict .Values.deploymentAnnotations) "configmap.reloader.stakater.com/reload")) }}
  {{- $reloadConfigMaps = append $reloadConfigMaps .Values.apiAuth.configMap.name }}
  {{- end }}
  {{- if or .Values.deploymentAnnotations $reloadSecrets $reloadConfigMaps }}
  annotations:
    {{- with .Values.deploymentAnnotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
    {{- if $reloadSecrets }}
    secret.reloader.stakater.com/reload: {{ join "," $reloadSecrets | quote }}
    {{- end }}
    {{- if $reloadConfigMaps }}
    configmap.reloader.stakater.com/reload: {{ join "," $reloadConfigMaps | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "controller.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      {{- $podAnnotations := dict }}
      {{- with .Values.podAnnotations }}
      {{- $podAnnotations = . | deepCopy }}
      {{- end }}
      {{- if and .Values.tracing.enabled .Values.tracing.operatorInject.enabled }}
      {{- with .Values.tracing.operatorInject.injectSdk }}
      {{- $_ := set $podAnnotations "instrumentation.opentelemetry.io/inject-sdk" . }}
      {{- end }}
      {{- with .Values.tracing.operatorInject.injectSidecar }}
      {{- $_ := set $podAnnotations "sidecar.opentelemetry.io/inject" . }}
      {{- end }}
      {{- end }}
      {{- if $podAnnotations }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "controller.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "controller.serviceAccountName" . }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- $profilesImage := "" }}
      {{- if .Values.profiles.image.enabled }}
      {{- if not .Values.profiles.path }}
      {{- fail "profiles.path is required when profiles.image.enabled=true" }}
      {{- end }}
      {{- $profilesImage = required "profiles.image.repository is required when profiles.image.enabled=true" .Values.profiles.image.repository }}
      {{- if .Values.profiles.image.digest }}
      {{- $profilesImage = printf "%s@%s" $profilesImage .Values.profiles.image.digest }}
      {{- else if .Values.profiles.image.tag }}
      {{- $profilesImage = printf "%s:%s" $profilesImage .Values.profiles.image.tag }}
      {{- else }}
      {{- fail "profiles.image.digest or profiles.image.tag is required when profiles.image.enabled=true" }}
      {{- end }}
      {{- end }}
      {{- if or .Values.profiles.image.enabled .Values.additionalInitContainers }}
      initContainers:
        {{- if .Values.profiles.image.enabled }}
        - name: materialize-profiles
          image: {{ $profilesImage | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Image content is at /profiles. Mount emptyDir elsewhere so we
              # do not hide the source tree, then copy into the shared volume.
              # The app container mounts the same volume at profiles.path.
              cp -a /profiles/. /profiles-out/
          volumeMounts:
            - name: profiles
              mountPath: /profiles-out
        {{- end }}
        {{- with .Values.additionalInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        {{- /* The name helper, not .Chart.Name: the chart is named `controller`
        for its OCI path, and a bare .Chart.Name would rename this container on
        upgrade, breaking every `kubectl logs -c` and log/metric selector keyed
        on it. */}}
        - name: {{ include "controller.name" . }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.apiAuth.enabled }}
            - name: nke-auth-config
              mountPath: {{ include "controller.apiAuth.mountPath" . | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.profiles.image.enabled }}
            - name: profiles
              mountPath: {{ .Values.profiles.path | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.spiffe.enabled }}
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            {{- end }}
            {{- if .Values.temporal.mtls.enabled }}
            - name: temporal-client-certs
              mountPath: {{ .Values.temporal.mtls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.teleport.enabled }}
            - name: teleport-identity
              mountPath: /var/run/teleport
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Metrics server listen address
            - name: METRICS_LISTEN_ADDRESS
              value: {{ .Values.metrics.listenAddress | quote }}
            {{- if .Values.tracing.enabled }}
            - name: OTEL_TRACING_ENABLED
              value: "true"
            {{- /* When operatorInject is enabled, leave OTEL_EXPORTER_OTLP_* unset (no tracing.endpoint) so inject-sdk supplies localhost sidecar values. */}}
            {{- if .Values.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.tracing.insecure | quote }}
            {{- if .Values.tracing.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CERT_RENEWAL_CONTROLLER_ENABLED
              value: {{ .Values.scheduledMaintenance.certRenewal.enabled | quote }}
            - name: CERT_RENEWAL_INTERVAL
              value: {{ .Values.scheduledMaintenance.certRenewal.interval | quote }}
            - name: CERT_RENEWAL_THRESHOLD_DAYS
              value: {{ .Values.scheduledMaintenance.certRenewal.thresholdDays | quote }}
            - name: KUBEADM_IMAGE_REPOSITORY
              value: {{ .Values.kubeadm.imageRepository | quote }}
            {{- if .Values.cni.imageRegistry }}
            - name: CNI_IMAGE_REGISTRY
              value: {{ .Values.cni.imageRegistry | quote }}
            {{- end }}
            - name: INSTALL_CNI_AFTER_INIT
              value: {{ .Values.cni.installAfterInit | quote }}
            - name: TENANT_ACCESS_ENABLED
              value: {{ .Values.tenantAccess.enabled | quote }}
            - name: NKE_OIDC_AUTH_ENABLED
              value: {{ .Values.nkeOIDCAuth.enabled | quote }}
            {{- if .Values.nkeOIDCAuth.issuerURL }}
            - name: NKE_OIDC_AUTH_ISSUER_URL
              value: {{ .Values.nkeOIDCAuth.issuerURL | quote }}
            {{- end }}
            {{- if .Values.nkeOIDCAuth.discoveryURL }}
            - name: NKE_OIDC_AUTH_DISCOVERY_URL
              value: {{ .Values.nkeOIDCAuth.discoveryURL | quote }}
            {{- end }}
            {{- if .Values.nkeOIDCAuth.caBundleSecret.namespace }}
            - name: NKE_OIDC_AUTH_CA_BUNDLE_SECRET_NAMESPACE
              value: {{ .Values.nkeOIDCAuth.caBundleSecret.namespace | quote }}
            {{- end }}
            {{- if .Values.nkeOIDCAuth.caBundleSecret.name }}
            - name: NKE_OIDC_AUTH_CA_BUNDLE_SECRET_NAME
              value: {{ .Values.nkeOIDCAuth.caBundleSecret.name | quote }}
            {{- end }}
            {{- if .Values.nkeOIDCAuth.caBundleSecret.key }}
            - name: NKE_OIDC_AUTH_CA_BUNDLE_SECRET_KEY
              value: {{ .Values.nkeOIDCAuth.caBundleSecret.key | quote }}
            {{- end }}
            # DB
            {{- if or .Values.secrets.createDbSecret .Values.secrets.dbSecretName }}
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-%s" (include "controller.fullname" .) "db")  .Values.secrets.dbSecretName}}
                  key:  {{ default "database-connection-string" .Values.secrets.dbSecretKey }}
            {{- else }}
            - name: DB_CONNECTION_STRING
              value: {{ printf "postgres://%s:%s@%s/%s?sslmode=%s" .Values.appDb.postgresUser (default "placeholder" .Values.appDb.postgresPassword) .Values.appDb.url .Values.appDb.dbName (default "disable" .Values.appDb.sslMode) | quote }}
            {{- end }}
            # forge apikey
            {{- if .Values.secrets.forgeSecret.enabled }}
            - name: FWE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-%s" (include "controller.fullname" .) "forge-creds") .Values.secrets.forgeSecretName }}
                  key: {{ default "forge-api-key" .Values.secrets.forgeSecretKey }}
            {{- end }}
            # Temporal config
            - name: TEMPORAL_HOST_PORT
              value: "{{ .Values.temporal.host }}:{{ .Values.temporal.port }}"
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.cloudWorkflow.namespace }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.cloudWorkflow.queue }}
            {{- if .Values.temporal.mtls.enabled }}
            - name: TEMPORAL_MTLS_CA_CERT
              value: {{ printf "%s/%s" .Values.temporal.mtls.mountPath .Values.temporal.mtls.caCertFile | quote }}
            - name: TEMPORAL_MTLS_CLIENT_CERT
              value: {{ printf "%s/%s" .Values.temporal.mtls.mountPath .Values.temporal.mtls.clientCertFile | quote }}
            - name: TEMPORAL_MTLS_CLIENT_KEY
              value: {{ printf "%s/%s" .Values.temporal.mtls.mountPath .Values.temporal.mtls.clientKeyFile | quote }}
            - name: TEMPORAL_MTLS_SERVER_NAME
              value: {{ .Values.temporal.mtls.serverName | quote }}
            {{- end }}
            - name: PROFILES_DIR
              value: {{ .Values.profiles.path | quote }}
            - name: NICO_CONTROLLERS_ENABLED
              value: {{ .Values.controllers.nico.enabled | quote }}
            {{- if .Values.profiles.image.enabled }}
            - name: RUNBOOKS_DIR
              value: {{ printf "%s/runbooks" .Values.profiles.path | quote }}
            {{- end }}
            # SPIFFE/SPIRE config
            - name: SPIFFE_ENABLED
              value: {{ .Values.spiffe.enabled | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: {{ .Values.spiffe.endpointSocket | quote }}
            {{- with .Values.spiffe.jwtExchangeEndpoint }}
            - name: SPIFFE_JWT_EXCHANGE_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: SPIRE_SERVER_NAMESPACE
              value: {{ .Values.spiffe.spire.serverNamespace | quote }}
            - name: SPIRE_CLASS_NAME
              value: {{ .Values.spiffe.spire.className | quote }}
            - name: SPIRE_TPM_PUBHASHES_CONFIG_MAP_NAME
              value: {{ .Values.spiffe.spire.tpmPubhashesConfigMapName | quote }}
            - name: SPIRE_SERVER_ADDRESS
              {{- if .Values.spiffe.spire.serverAddress }}
              value: {{ .Values.spiffe.spire.serverAddress | quote }}
              {{- else if .Values.spiffe.spire.serverAddressFrom }}
              valueFrom:
                {{- toYaml .Values.spiffe.spire.serverAddressFrom | nindent 16 }}
              {{- else }}
              {{- fail "Either spiffe.spire.serverAddress or spiffe.spire.serverAddressFrom must be set" }}
              {{- end }}
            - name: SPIRE_SERVER_PORT
              value: {{ .Values.spiffe.spire.serverPort | quote }}
            - name: SPIRE_JOIN_TOKEN_TTL
              value: {{ .Values.spiffe.spire.joinTokenTTL | quote }}
            # Teleport config
            {{- if .Values.teleport.enabled }}
            - name: TELEPORT_ENABLED
              value: "true"
            - name: TELEPORT_IDENTITY_FILE
              value: {{ .Values.teleport.identityFile | quote }}
            - name: TELEPORT_PROXY_ADDRESS
              value: {{ .Values.teleport.proxyAddress | quote }}
            - name: TELEPORT_ENVIRONMENT
              value: {{ .Values.teleport.environment | quote }}
            {{- end }}
            {{- if .Values.secrets.dgxcTenantCredSecretName }}
            - name: DGXC_TENANT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dgxcTenantCredSecretName }}
                  key: user
                  optional: true
            - name: DGXC_TENANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dgxcTenantCredSecretName }}
                  key: password
                  optional: true
            {{- end }}
            {{- if .Values.secrets.cnpgDbPasswordsSecretName }}
            # CNPG database passwords. Required (optional=false): CWE fails
            # closed at startup if these are unset (see
            # cloud-workflow-engine!772 Validate()), so a missing key here
            # should surface as a clear Kubernetes secretKeyRef error rather
            # than a silently-empty env var and a confusing app-level failure.
            - name: CNPG_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cnpgDbPasswordsSecretName }}
                  key: CNPG_SUPERUSER_PASSWORD
                  optional: false
            - name: CNPG_CLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cnpgDbPasswordsSecretName }}
                  key: CNPG_CLOUD_PASSWORD
                  optional: false
            - name: CNPG_TEMPORAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cnpgDbPasswordsSecretName }}
                  key: CNPG_TEMPORAL_PASSWORD
                  optional: false
            {{- end }}
            {{- if .Values.apiAuth.enabled }}
            # Omitted when disabled, never set empty: NKE reads an empty value as
            # unset, so the deployment would look configured and authenticate nobody.
            - name: AUTH_CONFIG_PATH
              value: {{ printf "%s/%s" (include "controller.apiAuth.mountPath" .) (include "controller.apiAuth.configFile" .) | quote }}
            - name: PERMISSIVE_MODE
              value: {{ .Values.apiAuth.permissive | quote }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
      volumes:
        {{- if .Values.profiles.image.enabled }}
        - name: profiles
          emptyDir: {}
        {{- end }}
        {{- if .Values.spiffe.enabled }}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        {{- end }}
        {{- if .Values.temporal.mtls.enabled }}
        - name: temporal-client-certs
          secret:
            secretName: {{ required "temporal.mtls.secretName is required when temporal.mtls.enabled=true" .Values.temporal.mtls.secretName }}
        {{- end }}
        {{- if .Values.teleport.enabled }}
        - name: teleport-identity
          secret:
            secretName: {{ .Values.teleport.identitySecretName }}
        {{- end }}
        {{- if .Values.apiAuth.enabled }}
        # Not optional: a missing ConfigMap holds the pod in ContainerCreating
        # with the name in its events, rather than starting it unconfigured.
        - name: nke-auth-config
          configMap:
            name: {{ required "apiAuth.configMap.name is required when apiAuth.enabled=true" .Values.apiAuth.configMap.name }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
