apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-%s" (include "controller.fullname" .) "db")  .Values.secrets.dbSecretName}}
  namespace: {{ include "controller.namespace" . }}
type: Opaque
data:
  {{ default "database-connection-string" .Values.secrets.dbSecretKey }}: {{ (include "app-db.connectionString" .) | b64enc }}
{{- end }}