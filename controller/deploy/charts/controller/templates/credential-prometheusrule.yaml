{{- if and .Values.credentialMonitoring.alerts.enabled (dig "monitoring" "enabled" true (.Values.global | default dict)) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "controller.fullname" . }}-credentials
  namespace: {{ include "controller.namespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
    {{- with .Values.credentialMonitoring.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/credential-alerts.yaml" | nindent 2 }}
{{- end }}
