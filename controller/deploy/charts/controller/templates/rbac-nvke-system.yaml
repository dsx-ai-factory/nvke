{{- /*
  Management-namespace grants (nvkeSystemNamespace.name) for CAPI bootstrap
  Secrets, tenant-access publish/repair/teardown, and tenant manager Secret
  reconciliation.

  Always rendered: the namespace exists unconditionally. Persisted-OIDC clusters
  keep publishing from OIDCAuthEnabled after live nvkeOIDCAuth.enabled is
  flipped off, so ConfigMap get on rbacConfigMap.name is not gated on that flag.
  Teardown must still delete owned Secrets.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "controller.fullname" . }}-{{ include "controller.rbacConfigMap.name" . }}
  namespace: {{ include "controller.managementNamespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
rules:
  # applyRBAC reads this ConfigMap for persisted-OIDC clusters even when the
  # live Helm flag is off (the ConfigMap is rendered whenever
  # spiffe.trustDomain is set, not gated on nvkeOIDCAuth.enabled).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      # Quoted: a name YAML would otherwise read as a scalar of another type
      # (y, n, true, off) must stay the string the ConfigMap is named.
      - {{ include "controller.rbacConfigMap.name" . | quote }}
    verbs: ["get"]
  # Publish, rotate, and clean up Secrets owned by the controller.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "controller.fullname" . }}-{{ include "controller.rbacConfigMap.name" . }}
  namespace: {{ include "controller.managementNamespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "controller.fullname" . }}-{{ include "controller.rbacConfigMap.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "controller.serviceAccountName" . }}
    namespace: {{ include "controller.namespace" . }}
