{{- if and .Values.apiAuth.enabled .Values.apiAuth.clusterIssuerDiscovery }}
# Lets NKE read the cluster's JWKS at /openid/v1/jwks. An issuer that points
# jwks.uri at that endpoint verifies tokens against those keys.
#
# The endpoint requires authentication. Kubernetes already grants this role to
# the system:serviceaccounts group, so a stock cluster needs nothing. This
# binding is for clusters that removed or narrowed that default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controller.fullname" . }}-service-account-issuer-discovery
  labels:
    {{- include "controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "controller.serviceAccountName" . }}
    namespace: {{ include "controller.namespace" . }}
{{- end }}
