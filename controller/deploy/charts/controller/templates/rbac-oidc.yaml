{{- /*
  nke-system grants for tenant-access publish/repair/teardown and tenant
  manager Secret reconciliation.

  Always rendered: nke-system exists unconditionally. Persisted-OIDC clusters
  keep publishing from OIDCAuthEnabled after live nkeOIDCAuth.enabled is
  flipped off, so ConfigMap get on nke-rbac is not gated on that flag.
  Teardown must still delete owned Secrets.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "controller.fullname" . }}-nke-rbac
  namespace: nke-system
  labels:
    {{- include "controller.labels" . | nindent 4 }}
rules:
  # applyRBAC reads this ConfigMap for persisted-OIDC clusters even when the
  # live Helm flag is off (the ConfigMap is rendered whenever
  # spiffe.trustDomain is set, not gated on nkeOIDCAuth.enabled).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - nke-rbac
    verbs: ["get"]
  # Publish + rotate + clean up the per-cluster tenant-access Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "controller.fullname" . }}-nke-rbac
  namespace: nke-system
  labels:
    {{- include "controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "controller.fullname" . }}-nke-rbac
subjects:
  - kind: ServiceAccount
    name: {{ include "controller.serviceAccountName" . }}
    namespace: {{ include "controller.namespace" . }}
{{- with .Values.nkeOIDCAuth.caBundleSecret }}
{{- if and $.Values.nkeOIDCAuth.enabled .namespace .name }}
---
# CWE reads the OIDC discovery provider's upstream CA at kubeadm-render time
# (readOIDCCABundle) and embeds it into the tenant apiserver AuthenticationConfiguration.
# resourceName-scoped `get` on the single CA Secret, in whatever namespace the CA lives
# (spire-server for Forge). Wired to the same caBundleSecret values CWE reads, so the
# grant can't drift from the target.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "controller.fullname" $ }}-oidc-ca-read
  namespace: {{ .namespace }}
  labels:
    {{- include "controller.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .name }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "controller.fullname" $ }}-oidc-ca-read
  namespace: {{ .namespace }}
  labels:
    {{- include "controller.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "controller.fullname" $ }}-oidc-ca-read
subjects:
  - kind: ServiceAccount
    name: {{ include "controller.serviceAccountName" $ }}
    namespace: {{ include "controller.namespace" $ }}
{{- end }}
{{- end }}
