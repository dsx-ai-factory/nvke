{{- if and .Values.capi.rbac.create .Values.capi.rbac.launchLayer }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controller.fullname" . }}-launchlayer
  labels:
    {{- include "controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - infrastructure.cluster.x-k8s.io
    resources:
      - launchlayerclusters
      - launchlayermachines
      - launchlayermachinetemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - launchlayerclusters.infrastructure.cluster.x-k8s.io
      - launchlayermachines.infrastructure.cluster.x-k8s.io
      - launchlayermachinetemplates.infrastructure.cluster.x-k8s.io
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controller.fullname" . }}-launchlayer
  labels:
    {{- include "controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "controller.fullname" . }}-launchlayer
subjects:
  - kind: ServiceAccount
    name: {{ include "controller.serviceAccountName" . }}
    namespace: {{ include "controller.namespace" . }}
{{- end }}
