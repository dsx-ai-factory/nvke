# Shared nke-system namespace and tenant RBAC ConfigMap.
#
# The nke-system namespace is created unconditionally (Prune=false): the CWE
# controller that reconciles tenant access publishes per-cluster Secrets
# (<cluster>-kubeconfig, <cluster>-cluster-trust-bundle) into it for every reconciled
# cluster, so it must exist whenever that controller runs, independent of
# tenantAccess.enabled and nkeOIDCAuth.enabled. Keeping it unconditional also means
# a site that has published Secrets and is then disabled keeps them addressable.
#
# The nke-rbac ConfigMap (key manifest.yaml) is rendered whenever
# spiffe.trustDomain is set, not when the live nkeOIDCAuth flag is on.
# TenantAccess reads it and Server-Side-Applies the manifest into each
# persisted-OIDC tenant cluster. Flipping nkeOIDCAuth.enabled off must not
# drop the document. It defines the SPIFFE identities allowed to call each
# tenant API surface (nke:cwe).
{{- if .Values.nkeSystemNamespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: nke-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
{{- end }}
{{- if .Values.nkeOIDCAuth.enabled }}
{{- /*
  spiffe.trustDomain builds the nke-service principals below. It must equal the
  SPIRE server's trust domain (the spire chart's global.spire.trustDomain) so these
  RBAC subjects match the SPIFFE IDs the tenant apiserver actually sees; the deploy
  layer stamps both from one ${ENV_NAME}.
*/}}
{{- if not .Values.spiffe.trustDomain }}
{{- fail "spiffe.trustDomain must be set when nkeOIDCAuth.enabled is true (it must equal the SPIRE server's trust domain so nke-rbac principals match issued identities)" }}
{{- end }}
{{- /*
  The tenant-access controller is the only thing that applies this ConfigMap into
  tenant clusters and publishes the SPIRE exec-auth kubeconfig. With it disabled,
  OIDC-enabled clusters would trust SPIRE JWTs while NKE holds neither RBAC nor a
  kubeconfig there — dark, and silent. Fail the render instead.
*/}}
{{- if not .Values.tenantAccess.enabled }}
{{- fail "tenantAccess.enabled must be true when nkeOIDCAuth.enabled is true (the tenant-access controller applies nke-rbac into tenant clusters and publishes their kubeconfig; without it OIDC auth is configured but unusable)" }}
{{- end }}
{{- end }}
{{- if .Values.spiffe.trustDomain }}
{{- $td := .Values.spiffe.trustDomain }}
{{- /*
  The nke:cwe bindings name whatever subject the tenant apiserver will see in the
  token's sub claim (username maps from sub with an empty prefix). That is this
  controller's own SPIFFE ID by default. It is NOT the same string once
  spiffe.jwtExchangeEndpoint is set: an RFC 8693 exchange re-issues the token under
  its own trust domain and rewrites the path, so the exchanged subject cannot be
  derived from spiffe.trustDomain and has to be given whole via spiffe.cweSubject.
  Set the two together or the controller authenticates and is then denied everything.
*/}}
{{- if and .Values.spiffe.jwtExchangeEndpoint (not .Values.spiffe.cweSubject) }}
{{- fail "spiffe.cweSubject must be set when spiffe.jwtExchangeEndpoint is set: the exchange re-issues the token under its own trust domain and rewrites sub, so the default subject (this controller's SPIFFE ID) would match nothing and every call into a tenant cluster would authenticate and then be denied" }}
{{- end }}
{{- if and .Values.spiffe.jwtExchangeEndpoint (not .Values.spiffe.capiManagerSubject) }}
{{- fail "spiffe.capiManagerSubject must be set when spiffe.jwtExchangeEndpoint is set: the exchange may rewrite capi-manager's sub claim, so the default subject would not authorize CAPI against tenant clusters" }}
{{- end }}
{{- $cweSubject := .Values.spiffe.cweSubject | default (printf "spiffe://%s/nke-service/cloud-workflow-engine" $td) }}
{{- $capiManagerSubject := .Values.spiffe.capiManagerSubject | default (printf "spiffe://%s/nke-service/capi-manager" $td) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nke-rbac
  namespace: nke-system
  labels:
    {{- include "controller.labels" . | nindent 4 }}
data:
  manifest.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: nke:cwe
    rules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list", "watch", "patch", "update", "delete"]
      # nodes/status is a separate subresource, so "patch" on nodes does not
      # cover it. ApplyNodeCondition patches node conditions through it. patch
      # only: it is the controller's one status write and never updates.
      - apiGroups: [""]
        resources: ["nodes/status"]
        verbs: ["patch"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["list", "delete"]
      - apiGroups: [""]
        resources: ["pods/eviction"]
        verbs: ["create"]
      - apiGroups: ["certificates.k8s.io"]
        resources: ["certificatesigningrequests"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["certificates.k8s.io"]
        resources: ["certificatesigningrequests/approval"]
        verbs: ["update"]
      - apiGroups: ["certificates.k8s.io"]
        resources: ["signers"]
        resourceNames: ["kubernetes.io/kubelet-serving"]
        verbs: ["approve"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: nke:cwe
      namespace: kube-system
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch", "patch"]
      # node-local-dns install (InstallKubeLocalDNS) server-side-applies
      # a ServiceAccount, Services (including kube-dns-metrics), a ConfigMap, and a
      # DaemonSet into kube-system as the SPIFFE tenant client; SSA is a PATCH on
      # objects that may not pre-exist, so create + patch (with update/get for the
      # apply round-trip) are required. The same activity also patches kubeadm-managed
      # CoreDNS (Deployment or DaemonSet), running CoreDNS pod labels, and the
      # kube-dns Service. The install path never enumerates Services/ConfigMaps/
      # DaemonSets/Deployments, so list/watch are omitted there. The broad
      # configmaps verbs here subsume the former kubeadm-config resourceName update
      # rule. Pods are listed so existing CoreDNS pods can be labeled before the
      # kube-dns selector is rewritten.
      - apiGroups: [""]
        resources: ["serviceaccounts", "services", "configmaps"]
        verbs: ["get", "create", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["daemonsets", "deployments"]
        verbs: ["get", "create", "patch", "update"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: nke:cwe
      namespace: kube-node-lease
    rules:
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        verbs: ["get"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: nke:cwe
    subjects:
      - kind: User
        name: {{ $cweSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: nke:cwe
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: nke:cwe
      namespace: kube-system
    subjects:
      - kind: User
        name: {{ $cweSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: Role
      name: nke:cwe
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: nke:cwe
      namespace: kube-node-lease
    subjects:
      - kind: User
        name: {{ $cweSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: Role
      name: nke:cwe
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: nke:capi-cluster-admin
    subjects:
      - kind: User
        name: {{ $capiManagerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
      - kind: User
        name: spiffe://{{ $td }}/nke-service/capi-kubeadm-control-plane-manager
        apiGroup: rbac.authorization.k8s.io
      - kind: User
        name: spiffe://{{ $td }}/nke-service/capd-manager
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: cluster-admin
      apiGroup: rbac.authorization.k8s.io
{{- end }}
