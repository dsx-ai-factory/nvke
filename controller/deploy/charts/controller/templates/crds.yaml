{{- /*
files/crds.yaml is generated by `make chart-crds` from the CRDs in
management-engine; see controller/deploy/release-crds. Failing here, rather than
rendering nothing, keeps a chart without its CRDs from installing.
*/ -}}
{{- $crds := .Files.Get "files/crds.yaml" }}
{{- if not $crds }}
{{- fail "files/crds.yaml is missing or empty; run make chart-crds" }}
{{- end }}
{{ $crds }}
