{{- if .Values.tenantAccess.additionalRBAC }}
{{- if not .Values.spiffe.trustDomain }}
{{- fail "spiffe.trustDomain must be set when tenantAccess.additionalRBAC is non-empty" }}
{{- end }}
{{- if not .Values.tenantAccess.enabled }}
{{- fail "tenantAccess.enabled must be true when tenantAccess.additionalRBAC is non-empty" }}
{{- end }}
{{- end }}
# Shared management-plane namespace (nvkeSystemNamespace.name, nvke-system by
# default) and tenant RBAC ConfigMap.
#
# The Namespace is rendered when nvkeSystemNamespace.create is true
# (the default), irrespective of whether tenantAccess.enabled or nvkeOIDCAuth.enabled is true.
# controller publishes per-cluster Secrets (<cluster>-kubeconfig,
# <cluster>-cluster-trust-bundle) into it, so the Namespace must stay even if
# those flags are later turned off. Two annotations are set unconditionally
# rather than left to values, because they are invariants and not preferences:
# helm.sh/resource-policy: keep skips Helm uninstall, and
# argocd.argoproj.io/sync-options: Prune=false,Delete=false survives an Argo
# prune or Application delete. Neither stops a kubectl delete of the Namespace;
# only an admission policy does. Further annotations come from
# nvkeSystemNamespace.annotations.
#
# The RBAC ConfigMap (rbacConfigMap.name, key manifest.yaml) is rendered whenever
# spiffe.trustDomain is set, not when the live nvkeOIDCAuth flag is on.
# TenantAccess reads it and Server-Side-Applies the manifest into each
# persisted-OIDC tenant cluster. Flipping nvkeOIDCAuth.enabled off must not
# drop the document. It defines the SPIFFE identities allowed to call each
# tenant API surface (nvke:cwe).
{{- if .Values.nvkeSystemNamespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "controller.managementNamespace" . }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- with .Values.nvkeSystemNamespace.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.nvkeOIDCAuth.enabled }}
{{- /*
  spiffe.trustDomain builds the principals below, under spiffe.servicePathSegment. It must equal the
  SPIRE server's trust domain (the spire chart's global.spire.trustDomain) so these
  RBAC subjects match the SPIFFE IDs the tenant apiserver actually sees; the deploy
  layer stamps both from one ${ENV_NAME}.
*/}}
{{- if not .Values.spiffe.trustDomain }}
{{- fail "spiffe.trustDomain must be set when nvkeOIDCAuth.enabled is true (it must equal the SPIRE server's trust domain so the RBAC manifest principals match issued identities)" }}
{{- end }}
{{- /*
  The tenant-access controller is the only thing that applies this ConfigMap into
  tenant clusters and publishes the SPIRE exec-auth kubeconfig. With it disabled,
  OIDC-enabled clusters would trust SPIRE JWTs while NVKE holds neither RBAC nor a
  kubeconfig there — dark, and silent. Fail the render instead.
*/}}
{{- if not .Values.tenantAccess.enabled }}
{{- fail "tenantAccess.enabled must be true when nvkeOIDCAuth.enabled is true (the tenant-access controller applies the RBAC manifest into tenant clusters and publishes their kubeconfig; without it OIDC auth is configured but unusable)" }}
{{- end }}
{{- end }}
{{- $oidcProviders := (.Values.oidc | default dict).providers | default list }}
{{- if and .Values.spiffe.enabled (gt (len $oidcProviders) 0) (not .Values.spiffe.trustDomain) }}
{{- fail "spiffe.trustDomain must be set when spiffe.enabled is true and oidc.providers is non-empty" }}
{{- end }}
{{- if .Values.spiffe.trustDomain }}
{{- $td := .Values.spiffe.trustDomain }}
{{- /*
  The nvke:cwe bindings name whatever subject the tenant apiserver will see in the
  token's sub claim (username maps from sub with an empty prefix). That is this
  controller's own SPIFFE ID by default. It is NOT the same string once
  spiffe.jwtExchangeEndpoint is set: an RFC 8693 exchange re-issues the token under
  its own trust domain and rewrites the path, so the exchanged subject cannot be
  derived from spiffe.trustDomain and has to be given whole via spiffe.controllerSubject.
  Set the two together or the controller authenticates and is then denied everything.
  spiffe.cweSubject is the older name for the same value and is still read; when
  both are set, spiffe.controllerSubject wins.
*/}}
{{- if and .Values.spiffe.jwtExchangeEndpoint (not (or .Values.spiffe.controllerSubject .Values.spiffe.cweSubject)) }}
{{- fail "spiffe.controllerSubject (or the older spiffe.cweSubject) must be set when spiffe.jwtExchangeEndpoint is set: the exchange re-issues the token under its own trust domain and rewrites sub, so the default subject (this controller's SPIFFE ID) would match nothing and every call into a tenant cluster would authenticate and then be denied" }}
{{- end }}
{{- if and .Values.spiffe.jwtExchangeEndpoint (not .Values.spiffe.capiManagerSubject) }}
{{- fail "spiffe.capiManagerSubject must be set when spiffe.jwtExchangeEndpoint is set: the exchange may rewrite capi-manager's sub claim, so the default subject would not authorize CAPI against tenant clusters" }}
{{- end }}
{{- if and .Values.spiffe.jwtExchangeEndpoint (not .Values.spiffe.capiKubeadmControlPlaneManagerSubject) }}
{{- fail "spiffe.capiKubeadmControlPlaneManagerSubject must be set when spiffe.jwtExchangeEndpoint is set: the exchange may rewrite the kubeadm control-plane manager's sub claim, so the default subject would not authorize it against tenant clusters" }}
{{- end }}
{{- if and .Values.spiffe.jwtExchangeEndpoint (not .Values.spiffe.capiKubeadmBootstrapManagerSubject) }}
{{- fail "spiffe.capiKubeadmBootstrapManagerSubject must be set when spiffe.jwtExchangeEndpoint is set: the exchange may rewrite the kubeadm bootstrap manager's sub claim, so the default subject would not authorize it against tenant clusters" }}
{{- end }}
{{- if and .Values.spiffe.jwtExchangeEndpoint (not .Values.spiffe.capdManagerSubject) }}
{{- fail "spiffe.capdManagerSubject must be set when spiffe.jwtExchangeEndpoint is set: the exchange may rewrite capd-manager's sub claim, so the default subject would not authorize CAPD against tenant clusters" }}
{{- end }}
{{- /*
  Derived from the effective service account name, not a hardcoded literal:
  this is exactly what the ClusterSPIFFEID template issues
  (spiffe://{{.TrustDomain}}/<servicePathSegment>/{{.PodSpec.ServiceAccountName}}, see
  deploy/k8s/spire-nvke-services-spiffe-id.yaml), so the default always
  matches the real SPIFFE ID SPIRE hands this controller's pod -- a renamed
  serviceAccount.name (or a nameOverride/fullnameOverride change that moves
  the effective SA name) never has to be reconciled by hand against this
  value, and jwtExchangeEndpoint remains the only case that does.
*/}}
{{- $seg := required "spiffe.servicePathSegment must not be empty" .Values.spiffe.servicePathSegment }}
{{- $controllerSubject := .Values.spiffe.controllerSubject | default .Values.spiffe.cweSubject | default (printf "spiffe://%s/%s/%s" $td $seg (include "controller.serviceAccountName" .)) }}
{{- $capiManagerSubject := .Values.spiffe.capiManagerSubject | default (printf "spiffe://%s/%s/capi-manager" $td $seg) }}
{{- $capiKubeadmControlPlaneManagerSubject := .Values.spiffe.capiKubeadmControlPlaneManagerSubject | default (printf "spiffe://%s/%s/capi-kubeadm-control-plane-manager" $td $seg) }}
{{- $capiKubeadmBootstrapManagerSubject := .Values.spiffe.capiKubeadmBootstrapManagerSubject | default (printf "spiffe://%s/%s/capi-kubeadm-bootstrap-manager" $td $seg) }}
{{- $capdManagerSubject := .Values.spiffe.capdManagerSubject | default (printf "spiffe://%s/%s/capd-manager" $td $seg) }}
{{- $tenantRbacName := .Values.nvkeOIDCAuth.tenantRbacName }}
{{- $rbacIdentities := dict }}
{{- range $kind := list "ClusterRole" "ClusterRoleBinding" }}
{{- $_ := set $rbacIdentities (printf "%s//%s" $kind $tenantRbacName) true }}
{{- end }}
{{- range $kind := list "Role" "RoleBinding" }}
{{- range $namespace := list "kube-system" "kube-node-lease" }}
{{- $_ := set $rbacIdentities (printf "%s/%s/%s" $kind $namespace $tenantRbacName) true }}
{{- end }}
{{- end }}
{{- $_ := set $rbacIdentities "ClusterRoleBinding//nvke:capi-cluster-admin" true }}
{{- range $index, $object := .Values.tenantAccess.additionalRBAC }}
{{- if not (has ($object.kind | default "") (list "Role" "RoleBinding" "ClusterRole" "ClusterRoleBinding")) }}
{{- fail (printf "tenantAccess.additionalRBAC[%d]: kind must be Role, RoleBinding, ClusterRole, or ClusterRoleBinding" $index) }}
{{- end }}
{{- if ne ($object.apiVersion | default "") "rbac.authorization.k8s.io/v1" }}
{{- fail (printf "tenantAccess.additionalRBAC[%d]: apiVersion must be rbac.authorization.k8s.io/v1" $index) }}
{{- end }}
{{- $namespace := $object.metadata.namespace | default "" }}
{{- if and $namespace (has $object.kind (list "ClusterRole" "ClusterRoleBinding")) }}
{{- fail (printf "tenantAccess.additionalRBAC[%d]: %s must not set metadata.namespace" $index $object.kind) }}
{{- end }}
{{- if and (not $namespace) (has $object.kind (list "Role" "RoleBinding")) }}
{{- fail (printf "tenantAccess.additionalRBAC[%d]: %s must set metadata.namespace" $index $object.kind) }}
{{- end }}
{{- $identity := printf "%s/%s/%s" $object.kind $namespace $object.metadata.name }}
{{- if hasKey $rbacIdentities $identity }}
{{- fail (printf "tenantAccess.additionalRBAC[%d]: duplicate RBAC object %s (conflicts with built-in RBAC or an earlier additional entry)" $index $identity) }}
{{- end }}
{{- $_ := set $rbacIdentities $identity true }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "controller.rbacConfigMap.name" . | quote }}
  namespace: {{ include "controller.managementNamespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
data:
  manifest.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: {{ $tenantRbacName }}
    rules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list", "watch", "patch", "update", "delete"]
      # nodes/status is a separate subresource, so "patch" on nodes does not
      # cover it. ApplyNodeCondition patches node conditions through it. patch
      # only: it is the controller's one status write and never updates.
      - apiGroups: [""]
        resources: ["nodes/status"]
        verbs: ["patch"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["list", "delete"]
      - apiGroups: [""]
        resources: ["pods/eviction"]
        verbs: ["create"]
      # LabelSystemNamespacesForPSA gets and patches these specific cluster-scoped
      # Namespace objects to label them privileged for Pod Security
      # Admission; resourceNames keeps it from reading or writing any other
      # namespace. Add a rule here for a new CNI's namespace once
      # cniNamespacesForPlugin starts labeling it.
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "patch"]
        resourceNames: ["kube-system"]
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "patch"]
        resourceNames: ["tigera-operator"]
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "patch"]
        resourceNames: ["ovn-kubernetes"]
      - apiGroups: ["certificates.k8s.io"]
        resources: ["certificatesigningrequests"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["certificates.k8s.io"]
        resources: ["certificatesigningrequests/approval"]
        verbs: ["update"]
      - apiGroups: ["certificates.k8s.io"]
        resources: ["signers"]
        resourceNames: ["kubernetes.io/kubelet-serving"]
        verbs: ["approve"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: {{ $tenantRbacName }}
      namespace: kube-system
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch", "patch"]
      # node-local-dns install (InstallKubeLocalDNS) server-side-applies
      # a ServiceAccount, Services (including kube-dns-metrics), a ConfigMap, and a
      # DaemonSet into kube-system as the SPIFFE tenant client; SSA is a PATCH on
      # objects that may not pre-exist, so create + patch (with update/get for the
      # apply round-trip) are required. The same activity also patches kubeadm-managed
      # CoreDNS (Deployment or DaemonSet), running CoreDNS pod labels, and the
      # kube-dns Service. The install path never enumerates Services/ConfigMaps/
      # DaemonSets/Deployments, so list/watch are omitted there. The broad
      # configmaps verbs here subsume the former kubeadm-config resourceName update
      # rule. Pods are listed so existing CoreDNS pods can be labeled before the
      # kube-dns selector is rewritten.
      - apiGroups: [""]
        resources: ["serviceaccounts", "services", "configmaps"]
        verbs: ["get", "create", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["daemonsets", "deployments"]
        verbs: ["get", "create", "patch", "update"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: {{ $tenantRbacName }}
      namespace: kube-node-lease
    rules:
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        verbs: ["get"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: {{ $tenantRbacName }}
    subjects:
      - kind: User
        name: {{ $controllerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: {{ $tenantRbacName }}
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ $tenantRbacName }}
      namespace: kube-system
    subjects:
      - kind: User
        name: {{ $controllerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: Role
      name: {{ $tenantRbacName }}
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ $tenantRbacName }}
      namespace: kube-node-lease
    subjects:
      - kind: User
        name: {{ $controllerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: Role
      name: {{ $tenantRbacName }}
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: nvke:capi-cluster-admin
    subjects:
      - kind: User
        name: {{ $capiManagerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
      - kind: User
        name: {{ $capiKubeadmControlPlaneManagerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
      - kind: User
        name: {{ $capiKubeadmBootstrapManagerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
      - kind: User
        name: {{ $capdManagerSubject | quote }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: cluster-admin
      apiGroup: rbac.authorization.k8s.io
    {{- range .Values.tenantAccess.additionalRBAC }}
    ---
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
