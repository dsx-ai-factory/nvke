# SPDX-License-Identifier: Apache-2.0

# The keys are the file names the controller reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "apiAuthz.configMap.name is required when apiAuthz.enabled=true" .Values.apiAuthz.configMap.name }}
  namespace: {{ include "controller.namespace" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
data:
  policies.cedar: |
    {{- .Values.apiAuthz.policies | nindent 4 }}
  roles.json: |
    {{- .Values.apiAuthz.roles | nindent 4 }}
  authorization.yaml: |
    apiVersion: auth.nvke.nvidia.com/v1alpha1
    kind: AuthorizationConfiguration
    {{- toYaml .Values.apiAuthz.config | nindent 4 }}
{{- end }}
