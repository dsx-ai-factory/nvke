FIELD_MANAGER_REBOOT_MACHINE_NAME: fieldManager.rebootMachineName
FIELD_MANAGER_MACHINE_HEALTH_ISSUE_NAME: fieldManager.machineHealthIssueName
MANAGED_BY_LABEL_VALUE: managedByLabelValue
