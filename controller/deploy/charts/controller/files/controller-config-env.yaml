# Every environment variable whose setting moved into nke-controller-config,
# mapped to its config.yaml key. The controller no longer reads them. The chart
# refuses an env entry that names one (templates/_helpers.tpl), and the drift
# tests in internal/controllerconfig check this list against config.Config,
# controllerconfig.Config, ApplyTo and deployment.yaml.
