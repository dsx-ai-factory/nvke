# Host Promtail config -- ships forge-vms and VM console logs to Loki in K8s.
# Runs as a Docker container; Loki is reachable via port-forward on localhost:3100.
server:
  disable: true

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: nke-dev
    static_configs:
      - targets:
          - localhost
        labels:
          job: nke-dev
          __path__: /var/log/nke/*.log
    pipeline_stages:
      - match:
          selector: '{job="nke-dev"}'
          stages:
            - regex:
                source: filename
                expression: '/var/log/nke/(?P<service>[a-z-]+)\.log'
            - labels:
                service:
            - json:
                expressions:
                  level: level
                  msg: msg
                  logger: logger
            - labels:
                level:

  - job_name: vm-console
    file_sd_configs:
      - files:
          - /etc/promtail/forge-vms-targets.json
        refresh_interval: 15s
