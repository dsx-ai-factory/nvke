# Loki -- monolithic single-binary mode for local development.
# No auth, filesystem storage, minimal resources.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# Run a single replica of the monolithic binary.
singleBinary:
  replicas: 1
  persistence:
    size: 2Gi

# Disable all other deployment modes.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable optional components not needed for dev.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
