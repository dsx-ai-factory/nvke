# Baseline lint config for the forge-vms module. Kept intentionally narrow:
# only linters that pass cleanly today are enabled. Tighten incrementally —
# see the parent .golangci.yml at the repo root for the full target set.

version: "2"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/NVIDIA/nke/controller
        - gitlab-master.nvidia.com
    gofumpt:
      extra-rules: true

run:
  timeout: 5m
  allow-parallel-runners: true
  concurrency: 8
  modules-download-mode: readonly

output:
  print-issued-lines: false
  print-linter-name: true
  sort-results: true

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - goheader
    - govet
    - staticcheck
  settings:
    goheader:
      template: |-
        SPDX-FileCopyrightText: Copyright (c) {{MOD_YEAR-RANGE}} NVIDIA CORPORATION & AFFILIATES. All rights reserved.
        SPDX-License-Identifier: LicenseRef-NvidiaProprietary

        NVIDIA CORPORATION, its affiliates and licensors retain all intellectual
        property and proprietary rights in and to this material, related
        documentation and any modifications thereto. Any use, reproduction,
        disclosure or distribution of this material and related documentation
        without an express license agreement from NVIDIA CORPORATION or
        its affiliates is strictly prohibited.
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Mirror the parent .golangci.yml: shadow declarations of err/ctx are a
      # common idiom across the codebase and not worth flagging.
      - text: 'shadow: declaration of "(err|ctx|ip)" shadows declaration at'
        linters:
          - govet
    paths:
      - third_party$
      - builtin$
      - examples$
