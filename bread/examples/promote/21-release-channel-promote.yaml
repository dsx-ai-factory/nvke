#
# Step 2 of the promotion story: the same channel as examples/20-release-channel.yaml, now offering
# v1.34.2-cr2.1.0. Applying it (on the internal group) promotes the channel: the controller appends
# {v1.34.2-cr2.1.0, now} to status.history, every following NKECluster with no spec.release.name
# moves to the new head, and every pinned one stays where it is and reports ReleaseCurrent
# False/UpgradeAvailable (examples/promote/31-nkecluster-pin.yaml). status.release.available on
# those clusters becomes [v1.34.2-cr2.1.0, v1.34.1-cr2.1.0].
apiVersion: nke/v1
kind: ReleaseChannel
metadata:
  name: stable
spec:
  releaseName: v1.34.2-cr2.1.0
# status: written by the controller; shown for reference.
# status:
