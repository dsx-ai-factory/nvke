#
# Step 5 of the promotion story: the operator hides v1.34.1-cr2.1.0 (UC-002, "hide without affecting
# clusters pinned to it"). Same object as 12-release-deprecate.yaml with spec.hidden flipped. Applied
# on the internal group.
#
# Effect: hidden means "not on the menu", not "does not exist". The Release leaves `kubectl get
# releases` and every cluster's status.release.available, and a new pin to it is refused (422;
# examples/invalid/nkecluster-hidden-release.yaml). `kubectl get release v1.34.1-cr2.1.0` by name
# still works, with HIDDEN true. Clusters holding it are unaffected: status.release.current keeps
# naming it and they stay Running.
apiVersion: nke/v1
kind: Release
metadata:
  name: v1.34.1-cr2.1.0
spec:
  kubernetes:
    version: v1.34.1
  coreRuntime:
    version: 2.1.0
    components:
    - name: dns
      version: 1.11.3
    - name: nke-agent
      version: 0.9.1
    - name: spire-agent
      version: 1.9.0
    - name: cni
      version: 1.16.2
    - name: cri
      version: 2.0.1
    - name: csi
      version: 2.4.0
  deprecated: true
  hidden: true                             # off the menu: omitted from list and available, 422 as a new pin; get by name still succeeds
