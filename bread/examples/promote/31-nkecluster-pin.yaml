#
# Step 3 of the promotion story: the tenant pins NKECluster demo to v1.34.1-cr2.1.0. Applied through
# nke-apiserver as org-demo's admin, before or after the channel is promoted.
#
# Hold vs upgrade: spec.release.name selects within the channel (docs/PROPOSAL-API-FIELDS.md, "The
# version model"). Set behind the head it is a hold: after 21-release-channel-promote.yaml the
# cluster stays on v1.34.1-cr2.1.0 while the head is v1.34.2-cr2.1.0 and reports ReleaseCurrent
# False/UpgradeAvailable. Set ahead of status.release.current (change it to v1.34.2-cr2.1.0) it is
# the tenant-initiated upgrade. Removing it returns the cluster to following the head.
#
# Admission: the pin must be in status.release.available, the head plus the channel's prior offered
# Releases that are neither deprecated nor hidden (else 422; examples/invalid/
# nkecluster-pin-not-available.yaml). An existing pin keeps resolving when its Release is later
# deprecated (12-release-deprecate.yaml) or hidden (13-release-hide.yaml); only new pins are refused.
#
# networking is repeated because it is immutable and may not be dropped by an apply.
apiVersion: nke/v1
kind: NKECluster
metadata:
  name: demo
  namespace: org-demo
spec:
  release:
    channel: stable
    name: v1.34.1-cr2.1.0                  # hold: the Release the cluster keeps running while the channel head moves on
  networking:
    podCIDR: 192.168.0.0/16
    serviceCIDR: 10.96.0.0/12
  apiServerAccess:
    authorizedNetworks:                    # shape; future writer: the machine-provider adapter
    - 10.20.0.0/16
  acceleratedRuntime:                      # shape; future writer: the tenant, acted on by the accelerated-runtime controller
    name: gpu-runtime-3.2.0
    version: 3.2.0
# status: written by the controller; shown for reference, after the channel has been promoted.
# status:
#   kubernetesVersion: v1.34.1
#   release:
#     channel: stable
#     current: v1.34.1-cr2.1.0             # held
#     offered: v1.34.2-cr2.1.0             # the head
#     available:
#     - v1.34.2-cr2.1.0
#     - v1.34.1-cr2.1.0
#   conditions:
#   - type: ReleaseCurrent
#     status: "False"
#     reason: UpgradeAvailable             # UpgradeRequired once v1.34.1-cr2.1.0 is deprecated
#     message: holding v1.34.1-cr2.1.0; channel stable offers v1.34.2-cr2.1.0
#     lastTransitionTime: "2026-09-10T10:00:05Z"
