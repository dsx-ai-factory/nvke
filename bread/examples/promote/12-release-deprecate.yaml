#
# Step 4 of the promotion story: the operator deprecates v1.34.1-cr2.1.0 (UC-002). Same object as
# examples/10-release.yaml with spec.deprecated flipped; kubernetes and coreRuntime are repeated
# unchanged because they are immutable. Applied on the internal group.
#
# Effect: deprecated never blocks. Clusters holding this Release (31-nkecluster-pin.yaml) keep
# running it and report ReleaseCurrent False/UpgradeRequired: status says move. The Release leaves
# status.release.available for new pins (an existing pin still resolves), the DEPRECATED column
# shows true, and a channel still offering it reports Ready True/Deprecated.
apiVersion: nke/v1
kind: Release
metadata:
  name: v1.34.1-cr2.1.0
spec:
  kubernetes:
    version: v1.34.1
  coreRuntime:
    version: 2.1.0
    components:
    - name: dns
      version: 1.11.3
    - name: nke-agent
      version: 0.9.1
    - name: spire-agent
      version: 1.9.0
    - name: cni
      version: 1.16.2
    - name: cri
      version: 2.0.1
    - name: csi
      version: 2.4.0
  deprecated: true                         # still usable; held clusters report ReleaseCurrent False/UpgradeRequired
  hidden: false
