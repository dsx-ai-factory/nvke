#
# Step 1 of the promotion story: the operator publishes a second Release.
# Kubernetes moves to v1.34.2; the core-runtime recipe stays at 2.1.0, so the name is
# v1.34.2-cr2.1.0. A Release is never edited into a new version (spec.kubernetes and
# spec.coreRuntime are immutable): this is a new object beside examples/10-release.yaml. Kept out of
# the flat examples/ directory so `kubectl apply -f examples/` leaves the channel on v1.34.1-cr2.1.0.
# Applied on the internal group like 10-release.yaml. Field notes are in 10-release.yaml.
apiVersion: nke/v1
kind: Release
metadata:
  name: v1.34.2-cr2.1.0
spec:
  kubernetes:
    version: v1.34.2
  coreRuntime:
    version: 2.1.0
    components:
    - name: dns
      version: 1.11.3
    - name: nke-agent
      version: 0.9.1
    - name: spire-agent
      version: 1.9.0
    - name: cni
      version: 1.16.2
    - name: cri
      version: 2.0.1
    - name: csi
      version: 2.4.0
  deprecated: false
  hidden: false
