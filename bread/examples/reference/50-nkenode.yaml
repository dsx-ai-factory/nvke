# REFERENCE ONLY. NOT APPLYABLE BY TENANTS.
#
# NKENode gpu-a-0003: one worker machine of NodePool gpu-a as the controller creates it (one per
# machine, owned by the pool on the internal group) and as its tenant sees it. Tenants never create
# or delete one (create is 405, examples/invalid/nkenode-create.yaml); the pool reconciler creates
# it when a machine is provisioned and deletes it once the machine is released. Tenants write spec
# (the two verbs retire and acceptRepair) and read status. To view the real ones:
#
#   kubectl --kubeconfig tenant-a.kubeconfig get nkenodes -n org-demo
#   kubectl --kubeconfig tenant-a.kubeconfig get nkenodes -n org-demo --field-selector status.nodePoolName=gpu-a
#
# The tenant verbs are patches, not applies:
#   kubectl --kubeconfig tenant-a.kubeconfig patch nkenode gpu-a-0003 -n org-demo --type merge -p '{"spec":{"retire":{"reason":"GPU 3 Xid 79 recurring"}}}'
#   kubectl --kubeconfig tenant-a.kubeconfig patch nkenode gpu-a-0003 -n org-demo --type merge -p '{"spec":{"acceptRepair":true}}'
#
# Kind NKENode, not Node, so `kubectl get nodes` keeps meaning the workload cluster's nodes.
apiVersion: nke/v1
kind: NKENode
metadata:
  name: gpu-a-0003                         # controller-chosen: <pool>-<ordinal>
  namespace: org-demo
spec:
  retire:                                  # the tenant-initiated return of this machine (UC-010, UC-015); immutable once set (CEL). NKE cordons, drains under the applicable PodDisruptionBudget, detaches and returns it (NKE-DS9-001); the pool's desired count is unchanged, so a replacement is provisioned and this object is deleted once Retiring completes. No drain or cordon knobs: those are what NKE does, not tenant toggles
    reason: GPU 3 Xid 79 recurring         # optional, at most 1024 characters, for the operator's record
  acceptRepair: false                      # default false. true = standing acceptance of any status.repairRequest on this node (acceptedBy Tenant), the per-node form of the pool's repairAcceptance Automatic; a request opened, withdrawn and reopened is accepted again without a new write. Never a one-shot verb and never "only the current request". Ignored while no request is open
# status: written by the controller; shown for reference. status.repairRequest is written by the
# operator on nkenodes/status on the internal group; the tenant reads it and answers with
# spec.acceptRepair.
# status:
#   observedGeneration: 2
#   clusterName: demo                      # denormalised from the owning pool; a selectable field
#   nodePoolName: gpu-a                    # the POOL column; a selectable field
#   kubernetesVersion: v1.34.1             # this node's kubelet; lags the pool's during a rollout
#   labels:                                # observed on the workload cluster's node (the pool template applied); at most 64
#     nvidia.com/gpu.product: gb200
#   taints:                                # observed on the workload cluster's node; at most 64
#   - key: nvidia.com/gpu
#     value: present
#     effect: NoSchedule
#   repairRequest:                         # the operator's open request to take the machine (UC-010; the GCE upcomingMaintenance shape). Lifecycle: open, then accepted (acceptedBy, acceptedAt), then Retiring, then deleted; or withdrawn, when the operator clears the whole block, the one defined cancel
#     requestedAt: "2026-09-10T08:00:00Z"  # required within the block
#     reason: DIMM errors on host          # at most 1024 characters
#     acceptBy: "2026-09-13T08:00:00Z"     # the operator's deadline (the SRD's "X days"): after it the request proceeds and acceptedBy records Deadline
#     acceptedBy: Tenant                   # Tenant | Policy | Deadline once accepted; unset while open
#     acceptedAt: "2026-09-10T09:15:00Z"   # unset while open
#   conditions:
#   - type: Ready                          # the node is Ready in the workload cluster
#     status: "True"
#     reason: NodeReady
#     message: kubelet v1.34.1 posting ready status
#     lastTransitionTime: "2026-09-10T08:12:40Z"
#   - type: Healthy                        # the HEALTHY column: the machine provider reports the machine healthy
#     status: "False"
#     reason: ProviderUnhealthy
#     message: machine provider reports DIMM errors on host
#     lastTransitionTime: "2026-09-10T07:58:12Z"
#   - type: RepairRequested                # True while a request is open: AwaitingTenant | Accepted. False: None | Withdrawn | DeadlinePassed
#     status: "True"
#     reason: Accepted
#     message: repair request of 2026-09-10T08:00:00Z accepted by Tenant at 2026-09-10T09:15:00Z
#     lastTransitionTime: "2026-09-10T09:15:00Z"
#   - type: Retiring                       # True from acceptance of a retire or repair until the machine is released and this object deleted
#     status: "True"
#     reason: Draining                     # message names the blocking PodDisruptionBudget when a drain is held; NKE never forces a drain
#     message: cordoned; draining under PodDisruptionBudget training/ddp-workers
#     lastTransitionTime: "2026-09-10T09:15:00Z"
#   - type: Validated                      # shape: the VALIDATED column, per-node readiness aggregate (NKE-DS9-012); future writer: the reconciler, from the adapter's observedValidation. Absent in the PoC, so the column renders blank
#     status: "True"
#     reason: Passed                       # Pending | Running | Passed | Failed
#     message: basic, east-west-network, gpu, nvlink, infiniband passed
#     lastTransitionTime: "2026-09-10T08:12:40Z"
#   - type: NetworkValidated               # shape: east-west network; future writer: the reconciler
#     status: "True"
#     reason: Passed
#     message: east-west-network passed
#     lastTransitionTime: "2026-09-10T08:12:40Z"
#   - type: AcceleratorValidated           # shape: GPU, NVLink and InfiniBand; future writer: the reconciler
#     status: "True"
#     reason: Passed
#     message: gpu, nvlink, infiniband passed
#     lastTransitionTime: "2026-09-10T08:12:40Z"
#   The STATUS column is derived by nke-apiserver from the conditions and is not a stored field.
#   later (NKE-DS9-017..020, P1): topology: {faultDomain: fd-b, nvlinkDomain: nvl-07, rack: r12}, mirrored to node labels
#   later (unnumbered): addresses: [{type: InternalIP, address: 10.20.4.17}]
#   later (unnumbered): replacedBy: gpu-a-0007
#   later (UC-002, NKE-DS9-005): platform: GB200, osProfile: {name: gb200-ubuntu-24.04, version: "2026.09"}
#   later (UC-021; machine-provider req 16, P1): no Sanitized condition. Sanitization is the provider's guarantee after return and this object is deleted before it runs; if recorded it is a hidden sanitizationRecord on the operator path
#   instanceType is immutable on the pool and is not duplicated here.
