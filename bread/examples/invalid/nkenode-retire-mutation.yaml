#
# Rejected by nke-apiserver at admission (422 Unprocessable Entity, Invalid on spec.retire).
# Rule: spec.retire is immutable once set (CEL on spec: !has(oldSelf.retire) || (has(self.retire)
# && self.retire == oldSelf.retire)). A retire cannot be changed or withdrawn: NKE is already
# cordoning and draining the machine, and the pool has started its replacement.
#
# Two writes on one object cannot be applied at once, so this is shown as patches against a real
# node of pool gpu-a (`kubectl get nkenodes -n org-demo` for a name). The first succeeds:
#
#   kubectl --kubeconfig tenant-a.kubeconfig patch nkenode gpu-a-0003 -n org-demo --type merge -p '{"spec":{"retire":{"reason":"GPU 3 Xid 79 recurring"}}}'
#
# The second, changing the reason, fails with the rule above:
#
#   kubectl --kubeconfig tenant-a.kubeconfig patch nkenode gpu-a-0003 -n org-demo --type merge -p '{"spec":{"retire":{"reason":"changed my mind"}}}'
#
# So does clearing it:
#
#   kubectl --kubeconfig tenant-a.kubeconfig patch nkenode gpu-a-0003 -n org-demo --type json -p '[{"op":"remove","path":"/spec/retire"}]'
#
# The document below is the state the second patch asks for; applied after the first patch it is
# refused by the same rule. Applied to a node that is not yet retiring it would succeed and retire
# it, and applied to a name that does not exist it is a create (405, nkenode-create.yaml).
apiVersion: nke/v1
kind: NKENode
metadata:
  name: gpu-a-0003
  namespace: org-demo
spec:
  retire:
    reason: changed my mind
