# Rejected by nke-apiserver at admission (422 Unprocessable Entity, Invalid on
# spec.template.spec.taints).
# Rule: taint keys under nke.nvidia.com (and its subdomains) are reserved for the platform's own
# health taints (CEL on taints). Label keys under nke.nvidia.com, kubernetes.io and k8s.io (and
# their subdomains) are reserved the same way. Nothing is stored.
apiVersion: nke/v1
kind: NodePool
metadata:
  name: bad-taint
  namespace: org-demo
spec:
  clusterName: demo
  instanceType: gb200-nvl72
  replicas: 1
  template:
    spec:
      taints:
      - key: nke.nvidia.com/unhealthy
        effect: NoSchedule
