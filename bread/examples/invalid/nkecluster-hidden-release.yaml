# Rejected by nke-apiserver at admission (422 Unprocessable Entity, Invalid on spec.release.name).
# Rule: a hidden Release is refused as a new reference (UC-002; docs/PROPOSAL-API-FIELDS.md, "Hidden
# means not on the menu"). Apply after examples/promote/13-release-hide.yaml has hidden
# v1.34.1-cr2.1.0: it is gone from `kubectl get releases` and from status.release.available, so this
# new cluster cannot pin it. `kubectl get release v1.34.1-cr2.1.0` by name still works, and the
# cluster demo, pinned to it before it was hidden, keeps running it.
apiVersion: nke/v1
kind: NKECluster
metadata:
  name: demo-hidden
  namespace: org-demo
spec:
  release:
    channel: stable
    name: v1.34.1-cr2.1.0
