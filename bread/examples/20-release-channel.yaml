#
# ReleaseChannel stable: offers one Release (its head) to every NKECluster whose spec.release.channel
# names it (docs/PROPOSAL-API-FIELDS.md, "The version model"). The channel decides which Releases
# exist for its clusters and whether they move automatically; a cluster that sets
# spec.release.name selects within it. Promotion is the operator changing spec.releaseName
# (examples/promote/21-release-channel-promote.yaml); every promotion is appended to
# status.history, which is where a following cluster's status.release.available comes from.
#
# Cluster-scoped and operator-written on the internal group (see examples/10-release.yaml).
apiVersion: nke/v1
kind: ReleaseChannel
metadata:
  name: stable
spec:
  releaseName: v1.34.1-cr2.1.0            # the head; must be an existing Release, else Ready False/ReleaseNotFound. Clusters following move to it unless pinned
  # later (UC-016, workers P1): rollout: {cohorts: [{name: canary, maxClusters: 10, soakMinutes: 60}]}
# status: written by the controller; shown for reference.
# status:
#   observedGeneration: 1
#   history:                               # every Release the channel has offered, oldest first
#   - releaseName: v1.34.1-cr2.1.0
#     promotedAt: "2026-09-10T08:00:00Z"
#   conditions:
#   - type: Ready                          # the READY column
#     status: "True"
#     reason: ReleaseFound                 # Deprecated when the offered Release exists but is deprecated; False with ReleaseNotFound when it does not exist
#     message: Release v1.34.1-cr2.1.0 exists
#     lastTransitionTime: "2026-09-10T08:00:00Z"
