# NodePool gpu-fixed: the fixed-size sibling of examples/40-nodepool.yaml in the same cluster,
# sized with spec.replicas instead of spec.autoscaling and with repairAcceptance Automatic, so an
# operator repair request on one of its nodes is accepted at once (acceptedBy: Policy) without a
# tenant write. `kubectl scale nodepool gpu-fixed --replicas=3` works on this pool (nodepools/scale);
# it is refused on an autoscaled one. Field notes are in 40-nodepool.yaml.
apiVersion: nke/v1
kind: NodePool
metadata:
  name: gpu-fixed
  namespace: org-demo
spec:
  clusterName: demo
  instanceType: gb200-nvl72
  osProfile:                               # shape: OS family and build; future writer: the tenant, resolved by the OS-profile controller
    name: gb200-ubuntu-24.04               # version omitted: the family's latest supported build
  replicas: 2                              # fixed count; exactly one of replicas and autoscaling
  # kubernetesVersion: v1.34.1             # optional worker pin within skew; omitted = follow the cluster
  template:
    metadata:
      labels:
        workload: batch
    spec:
      taints:
      - key: workload
        value: batch
        effect: NoSchedule
      kubelet:
        maxPods: 110
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  repairAcceptance: Automatic              # operator repair requests on this pool's nodes are accepted without acceptRepair; the node records acceptedBy Policy
  # later (NKE-DS9-018/019, P1): placement: {strategy: Spread, faultDomains: [fd-a, fd-b]}
# status: written by the controller; shown for reference (the full shape is in 40-nodepool.yaml).
# status:
#   observedGeneration: 1
#   desiredReplicas: 2
#   replicas: 2
#   readyReplicas: 2
#   upToDateReplicas: 2
#   kubernetesVersion: v1.34.1
#   conditions:
#   - {type: Ready, status: "True", reason: AllNodesReady, message: "2 of 2 nodes Ready", lastTransitionTime: "2026-09-10T08:12:40Z"}
#   - {type: AtDesiredSize, status: "True", reason: AtDesiredSize, message: "2 nodes, desired 2", lastTransitionTime: "2026-09-10T08:12:40Z"}
#   - {type: RollingOut, status: "False", reason: Idle, message: "no rollout in progress", lastTransitionTime: "2026-09-10T08:12:40Z"}
#   - {type: VersionSkewWithinTolerance, status: "True", reason: FollowsCluster, message: "nodes follow the cluster at v1.34.1", lastTransitionTime: "2026-09-10T08:12:40Z"}
#   - {type: RepairsPending, status: "False", reason: None, message: "no repair requests open", lastTransitionTime: "2026-09-10T08:12:40Z"}
