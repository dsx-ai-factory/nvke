# The custom domain is declared, not served yet: docs.nvidia.com/nvke needs a
# reverse proxy to Fern's origin (header x-fern-host) and Fern's subpath setup.
instances:
  - url: nvidia-nvke.docs.buildwithfern.com/nvke
    custom-domain: docs.nvidia.com/nvke
    multi-source: true

redirects:
  - source: /nvke/index.html
    destination: /nvke
  - source: /nvke/documentation/install-nvke/get-nvke-artifacts-from-nvkr-and-write-release-manifests
    destination: /nvke/documentation/install-nvke/get-the-nvke-artifacts

title: NVIDIA Kubernetes Engine

global-theme: nvidia

logo:
  href: /nvke
  right-text: NVKE

navbar-links:
  - type: github
    value: https://github.com/dsx-ai-factory/nvke

check:
  rules:
    broken-links: error

products:
  - display-name: NVIDIA Kubernetes Engine
    path: ../docs/index.yml
    slug: /
    # Product level, not top level: the nvidia global theme owns the top-level
    # announcement and overwrites it on publish. Readers can dismiss the banner;
    # it reappears when the message changes. Keep the text in step with the
    # blockquote at the top of docs/overview/what-is-nvke.md.
    announcement:
      message: '<strong>Preview:</strong> NVKE is available as a preview. APIs, configuration and behavior can change between releases, and we do not recommend NVKE for production workloads. See <a href="/nvke/documentation/overview/preview-status-and-known-limitations">Preview status and known limitations</a>.'
