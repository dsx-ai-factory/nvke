# The custom domain is declared, not served yet: docs.nvidia.com/nvke needs a
# reverse proxy to Fern's origin (header x-fern-host) and Fern's subpath setup.
instances:
  - url: nvidia-nvke.docs.buildwithfern.com/nvke
    custom-domain: docs.nvidia.com/nvke
    multi-source: true

redirects:
  - source: /nvke/index.html
    destination: /nvke

title: NVIDIA Kubernetes Engine

global-theme: nvidia

logo:
  href: /nvke
  right-text: NVKE

navbar-links:
  - type: github
    value: https://github.com/dsx-ai-factory/nvke

check:
  rules:
    broken-links: error

products:
  - display-name: NVIDIA Kubernetes Engine
    path: ../docs/index.yml
    slug: /
