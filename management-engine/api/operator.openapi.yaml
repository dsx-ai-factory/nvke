components:
  responses:
    "400":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 'The request is malformed: invalid JSON, an unknown or read-only
        field, or an unsupported query parameter.'
    "401":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Namespace resolution or datastore authentication failed.
    "403":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The resolved namespace or datastore operation is not permitted.
    "404":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The resource was not found.
    "408":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The request body was not received in time.
    "409":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The resource already exists, or the write conflicts with fields
        another writer owns.
    "410":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The page key has expired. Start the list again without it.
    "412":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The resource has changed since the version supplied in If-Match.
    "413":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The request body exceeds the size limit.
    "415":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The request body is not application/json.
    "422":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The desired state fails validation. May include diagnostics identifying
        invalid public fields.
    "428":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The If-Match header is missing.
    "500":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The request could not be completed.
    "503":
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The datastore could not complete the request, or a catalog source
        collection exceeds its read limit.
    Problem:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Request failure with HTTP status, stable error code and public
        field diagnostics.
  schemas:
    ClusterRelease:
      additionalProperties: false
      description: The public representation of a ClusterRelease resource.
      properties:
        metadata:
          additionalProperties: false
          description: The resource's identity and server-assigned metadata.
          properties:
            creation_timestamp:
              description: When the resource was created.
              format: date-time
              readOnly: true
              type: string
            deletion_timestamp:
              description: When deletion was requested. Present until cleanup finishes.
              format: date-time
              readOnly: true
              type: string
            name:
              $ref: '#/components/schemas/ResourceName'
            uid:
              description: Distinguishes this resource from an earlier resource with
                the same name.
              readOnly: true
              type: string
          required:
          - name
          type: object
        spec:
          $ref: '#/components/schemas/ClusterReleaseSpec'
      required:
      - metadata
      - spec
      type: object
    ClusterReleaseChannel:
      additionalProperties: false
      description: The public representation of a ClusterReleaseChannel resource.
      properties:
        metadata:
          additionalProperties: false
          description: The resource's identity and server-assigned metadata.
          properties:
            creation_timestamp:
              description: When the resource was created.
              format: date-time
              readOnly: true
