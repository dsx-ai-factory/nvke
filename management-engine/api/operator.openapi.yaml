      properties:
        has_more:
          description: Whether another page follows.
          type: boolean
        items:
          description: The resources on this page.
          items:
            $ref: '#/components/schemas/ClusterRelease'
          type: array
        page_key:
          description: Continuation for the next page. Empty on the last page.
          type: string
      required:
      - has_more
      - items
      - page_key
      type: object
    ClusterReleaseSpec:
      additionalProperties: false
      description: |-
        ClusterReleaseSpec is the published content of a control-plane release: the
        machine image its nodes boot and the initialization applied to them.
      properties:
        kubernetes:
          additionalProperties: false
          description: |-
            ClusterReleaseKubernetes describes the Kubernetes the release boots.

            - kubernetes is immutable
          properties:
