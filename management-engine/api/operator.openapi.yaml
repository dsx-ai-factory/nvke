      properties:
        metadata:
          additionalProperties: false
          description: The name of the resource to create.
          properties:
            name:
              $ref: '#/components/schemas/ResourceName'
            uid:
              description: Omit or leave empty. A nonempty UID on create is rejected.
              maxLength: 0
              nullable: true
              type: string
          required:
          - name
          type: object
        spec:
          $ref: '#/components/schemas/ClusterReleaseChannelSpec'
      required:
      - metadata
      - spec
      type: object
    ClusterReleaseChannelList:
      additionalProperties: false
      description: One page of ClusterReleaseChannel resources.
      properties:
        has_more:
          description: Whether another page follows.
          type: boolean
        items:
          description: The resources on this page.
          items:
            $ref: '#/components/schemas/ClusterReleaseChannel'
          type: array
        page_key:
          description: Continuation for the next page. Empty on the last page.
          type: string
      required:
      - has_more
      - items
      - page_key
      type: object
    ClusterReleaseChannelSpec:
      additionalProperties: false
      description: ClusterReleaseChannelSpec lists the releases available through
        a channel.
      properties:
        lifecycle:
          additionalProperties: false
          default: {}
          description: Lifecycle controls catalog discovery and communicates support.
          nullable: true
          properties:
            deprecated:
              default: false
              description: |-
                Deprecated allows resources already depending on the Release to keep
                using it, but rejects new cluster or node pool creation referencing it.
              nullable: true
              type: boolean
            hidden:
              default: false
              description: Hidden omits an offering from catalog lists and channel
                choices. Explicit references remain available.
              nullable: true
              type: boolean
            supported_until:
              description: SupportedUntil is the time at which support for this release
                ends.
              format: date-time
              nullable: true
              type: string
          type: object
        releases:
          additionalProperties:
            description: |-
              ClusterReleaseReferences lists alternatives for one version selector in operator preference order.

              - Entries must have unique combinations of these keys: name.
            items:
              additionalProperties: false
              description: ClusterReleaseReference names a cluster-scoped ClusterRelease.
              properties:
                minimum_upgrade_age:
                  description: |-
                    MinimumUpgradeAge is the minimum time since this release was created before it is eligible for automatic adoption.

                    - minimum_upgrade_age must be a nonnegative duration
                  maxLength: 32
                  type: string
                name:
                  description: ResourceName is a Kubernetes DNS subdomain name, not
                    a provider identifier.
                  maxLength: 253
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
              required:
              - minimum_upgrade_age
              - name
              type: object
            minItems: 1
            nullable: true
            type: array
            x-kubernetes-list-map-keys:
            - name
            x-kubernetes-list-type: map
          description: |-
            Releases maps Kubernetes version selectors to named ClusterRelease candidates.
            A major.minor selector permits patch upgrades within that minor.
            A major.minor.patch selector fixes the Kubernetes version and may include an opaque suffix.
            A suffixed selector names an exact published choice. Its spelling does not imply upgrade order.
            References under any selector are alternatives in operator preference order.
            The selector bound keeps validation within Kubernetes' CEL cost budget.

            - release keys must be major.minor or major.minor.patch with an optional build suffix and at most 128 characters
          maxProperties: 65536
          minProperties: 1
          type: object
      required:
      - releases
      type: object
    ClusterReleaseChannelUpdate:
      additionalProperties: false
      description: The body of a request to update a ClusterReleaseChannel resource.
      properties:
        metadata:
          additionalProperties: false
          description: The name of the resource to update.
          properties:
