apiVersion: internal.nke.nvidia.com/v1
kind: NKECluster
metadata:
  generateName: cwe-integration-
  namespace: cwe-integration
spec:
  apiServerAccess:
    publicAccessEnabled: false
  clusterNetwork:
    pods:
      cidrBlocks: [192.168.0.0/16]
    services:
      cidrBlocks: [10.96.0.0/12]
    serviceDomain: cluster.local
  release:
    channel:
      name: stable
  controlPlaneClass: local
