# Define the public protobuf module and checks that keep its contract consistent.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Return the shared Cluster resource from the create, get, and replace RPCs.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
