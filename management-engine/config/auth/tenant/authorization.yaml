apiVersion: auth.nvke.nvidia.com/v1alpha1
kind: AuthorizationConfiguration
operatorTenant: operator-org
issuers:
  issuer:
    tenant: {claim: organization}
    claims:
      - {name: groups, value: viewers, grants: [cluster-viewer]}
      - {name: groups, value: editors, grants: [cluster-editor]}
      - {name: groups, value: admins, grants: [cluster-admin]}
