apiVersion: auth.nvke.nvidia.com/v1alpha1
kind: AuthorizationConfiguration
operatorTenant: operator-org
issuers:
  issuer:
    tenant: {claim: organization}
    operators: true
    claims:
      - {name: groups, value: catalog-readers, grants: [catalog-reader]}
      - {name: groups, value: catalog-admins, grants: [catalog-admin]}
