apiVersion: auth.nvke.nvidia.com/v1alpha1
kind: AuthenticationConfiguration
audiences: [operator.nke.nvidia.com]
issuers:
  - name: issuer
    issuer: https://operator-issuer.example.com
    jwks:
      uri: https://operator-issuer.example.com/keys
    algorithms: [RS256]
    admit:
      groups: [catalog-readers, catalog-admins]
