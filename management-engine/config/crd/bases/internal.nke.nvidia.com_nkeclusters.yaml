---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nkeclusters.internal.nke.nvidia.com
spec:
  group: internal.nke.nvidia.com
  names:
    kind: NKECluster
    listKind: NKEClusterList
    plural: nkeclusters
    singular: nkecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: NKECluster manages a Kubernetes control plane and its node pools
          as one cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NKEClusterSpec configures a cluster's control plane and node
              pools.
            properties:
              acceleratedRuntime:
                description: AcceleratedRuntime selects an accelerated runtime bundle;
                  name "none" opts out.
                properties:
                  name:
                    description: ResourceName is a Kubernetes DNS subdomain name,
                      not a provider identifier.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  version:
                    description: Version is an OCI tag; it need not be a semantic
                      version.
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: version is required for a runtime release and must be omitted
                    for none
                  rule: 'self.name == ''none'' ? !has(self.version) : has(self.version)'
              apiServerAccess:
                description: APIServerAccess controls access to the cluster's Kubernetes
                  API server from outside the VPC.
                properties:
                  publicAccessCidrs:
                    description: PublicAccessCIDRs lists the source networks allowed
                      to use public API server access.
                    items:
                      description: PublicAccessCIDR is an allowed source network and
                        optional description.
                      properties:
                        cidr:
                          description: CIDR is an IPv4 or IPv6 source network in CIDR
                            notation.
                          maxLength: 49
                          type: string
                          x-kubernetes-validations:
                          - message: must be an IPv4 or IPv6 CIDR
                            rule: isCIDR(self)
                        description:
                          description: Description is an optional label for the source
                            network.
                          maxLength: 256
                          type: string
                      required:
                      - cidr
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - cidr
                    x-kubernetes-list-type: map
                  publicAccessEnabled:
                    description: PublicAccessEnabled enables public access to the
                      Kubernetes API server.
                    type: boolean
                required:
                - publicAccessEnabled
                type: object
              authentication:
                description: |-
                  Authentication configures additional JWT issuers for cluster access.
                  It can only be set when creating the cluster.
                properties:
                  jwt:
                    items:
                      description: JWTAuthenticator maps a trusted issuer's claims
                        to Kubernetes identities.
                      properties:
                        claimMappings:
                          description: JWTClaimMappings maps the token's username
                            and optional groups claims.
                          properties:
                            groups:
                              description: |-
                                ClaimMapping selects a claim and optionally specifies its identity prefix.
                                An empty prefix is meaningful and must remain distinct from an omitted prefix.
                              properties:
                                claim:
                                  maxLength: 256
                                  minLength: 1
                                  type: string
                                prefix:
                                  maxLength: 256
                                  type: string
                              required:
                              - claim
                              type: object
                            username:
                              description: |-
                                ClaimMapping selects a claim and optionally specifies its identity prefix.
                                An empty prefix is meaningful and must remain distinct from an omitted prefix.
                              properties:
                                claim:
                                  maxLength: 256
                                  minLength: 1
                                  type: string
                                prefix:
                                  maxLength: 256
                                  type: string
                              required:
                              - claim
                              type: object
                          required:
                          - username
                          type: object
                        claimValidationRules:
                          items:
                            description: ClaimValidationRule requires a claim to equal
                              a configured string.
                            properties:
                              claim:
                                maxLength: 256
                                minLength: 1
                                type: string
                              requiredValue:
                                maxLength: 256
                                type: string
                            required:
                            - claim
                            - requiredValue
                            type: object
                          maxItems: 32
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                        issuer:
                          description: JWTIssuer identifies an HTTPS issuer and the
                            audiences accepted from it.
                          properties:
                            audiences:
                              items:
                                description: Audience is a nonempty JWT audience identifier.
                                maxLength: 256
                                minLength: 1
                                type: string
                              maxItems: 16
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: set
                            url:
                              maxLength: 2048
                              pattern: ^https://[^/?#]+[^#]*$
                              type: string
                          required:
                          - audiences
                          - url
                          type: object
                      required:
                      - claimMappings
                      - issuer
                      type: object
                    maxItems: 60
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: issuer URLs must be unique
                      rule: self.all(x, self.filter(y, y.issuer.url == x.issuer.url).size()
                        == 1)
                type: object
              clusterNetwork:
                description: ClusterNetwork describes the pod/service networks and
                  cluster DNS domain.
                properties:
                  pods:
                    description: Pods specifies the address ranges used by pods.
                    properties:
                      cidrBlocks:
                        description: |-
                          CIDRBlocks contains one address range, or one IPv4 and one IPv6 range for dual-stack.
                          The first range selects the default IP family.
                        items:
                          description: NetworkCIDR is an IPv4 or IPv6 network in CIDR
                            notation.
                          maxLength: 49
                          type: string
                          x-kubernetes-validations:
                          - message: must be an IPv4 or IPv6 CIDR
                            rule: isCIDR(self)
                        maxItems: 2
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: CIDRs must be distinct
                          rule: self.size() < 2 || self[0] != self[1]
                        - message: CIDRs must be of different IP families
                          rule: self.size() < 2 || cidr(self[0]).ip().family() !=
                            cidr(self[1]).ip().family()
                    required:
                    - cidrBlocks
                    type: object
                  serviceDomain:
                    description: ServiceDomain is the DNS domain used by cluster services.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  services:
                    description: Services specifies the address ranges used by cluster
                      services.
                    properties:
                      cidrBlocks:
                        description: |-
                          CIDRBlocks contains one address range, or one IPv4 and one IPv6 range for dual-stack.
                          The first range selects the default IP family.
                        items:
                          description: NetworkCIDR is an IPv4 or IPv6 network in CIDR
                            notation.
                          maxLength: 49
                          type: string
                          x-kubernetes-validations:
                          - message: must be an IPv4 or IPv6 CIDR
                            rule: isCIDR(self)
                        maxItems: 2
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: CIDRs must be distinct
                          rule: self.size() < 2 || self[0] != self[1]
                        - message: CIDRs must be of different IP families
                          rule: self.size() < 2 || cidr(self[0]).ip().family() !=
                            cidr(self[1]).ip().family()
