                    name:
                      description: Name uniquely identifies this pool within the cluster,
                        including across updates.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    nodeProfile:
                      description: NodeProfile selects the machine image and startup
                        configuration as <profile>:<tag>.
                      maxLength: 382
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$
                      type: string
                      x-kubernetes-validations:
                      - message: profile name must be at most 253 characters
                        rule: self.split(':')[0].size() <= 253
                    replicas:
                      description: Replicas is the required number of nodes requested
                        for this pool. Zero requests no nodes.
                      format: int32
                      minimum: 0
                      type: integer
                    rollout:
                      description: Rollout configures node replacement when the node
                        profile changes.
                      properties:
                        strategy:
                          description: RolloutStrategy selects the replacement method
                            and disruption limits.
                          properties:
                            disruption:
                              description: Disruption limits how many nodes may be
                                disrupted during replacement.
                              properties:
                                budgets:
                                  description: Budgets apply the smallest active limit.
                                    Percentages round up to whole nodes.
                                  items:
                                    description: DisruptionBudget limits disruption
                                      continuously or during a scheduled window.
                                    properties:
                                      duration:
                                        description: Duration is the active window
                                          length, expressed in hours, minutes or seconds,
                                          such as 8h or 30m.
                                        maxLength: 32
                                        minLength: 1
                                        pattern: ^([0-9]+h)?([0-9]+m)?([0-9]+s)?$
                                        type: string
                                        x-kubernetes-validations:
                                        - message: duration must be positive
                                          rule: duration(self) > duration('0s')
                                      nodes:
                                        description: Nodes is a nonnegative count
                                          or a percentage from 0% to 100%. Zero blocks
                                          disruption.
                                        maxLength: 10
                                        pattern: ^((0|[1-9][0-9]*)|([0-9]|[1-9][0-9]|100)%)$
                                        type: string
                                        x-kubernetes-validations:
                                        - message: node count must not exceed 2147483647
                                          rule: self.endsWith('%') || int(self) <=
                                            2147483647
                                      schedule:
                                        description: |-
                                          Schedule starts each active window using five-field cron or a standard alias such as @daily.
                                          Omit for a continuous budget.
                                        maxLength: 256
                                        minLength: 1
                                        pattern: ^[[:space:]]*(@(annually|yearly|monthly|weekly|daily|midnight|hourly)|([^[:space:]]+[[:space:]]+){4}[^[:space:]]+)[[:space:]]*$
                                        type: string
                                    required:
                                    - nodes
                                    type: object
                                    x-kubernetes-validations:
                                    - message: schedule and duration must be set together
                                      rule: has(self.schedule) == has(self.duration)
                                  maxItems: 64
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - budgets
                              type: object
                            type:
                              enum:
                              - RollingUpdate
                              type: string
                          required:
                          - disruption
                          - type
                          type: object
                      required:
                      - strategy
                      type: object
                    userParams:
                      description: UserParams configures labels and taints for the
                        pool's nodes.
                      properties:
                        labels:
                          additionalProperties:
                            description: LabelValue follows Kubernetes label value
                              syntax.
                            maxLength: 63
                            pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                            type: string
                          description: |-
                            Labels specifies node labels. The prefixes nke.nvidia.com, kubernetes.io,
                            k8s.io and their subdomains are reserved.
                          maxProperties: 128
                          type: object
                          x-kubernetes-validations:
                          - message: label keys must be Kubernetes qualified names
                            rule: 'self.all(k, k.size() <= 317 && k.matches(''^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'')
                              && (k.split(''/'').size() == 1 ? k.size() <= 63 : k.split(''/'')[0].size()
                              <= 253 && k.split(''/'')[1].size() <= 63))'
                          - message: platform label prefixes are reserved
                            rule: self.all(k, !k.matches('(^|[.])(nke[.]nvidia[.]com|kubernetes[.]io|k8s[.]io)/'))
                        taints:
                          description: Taints specifies node taints that control which
                            pods can be scheduled on these nodes.
                          items:
                            description: NodeTaint uses Kubernetes label and scheduling
                              conventions.
                            properties:
                              effect:
                                enum:
                                - NoSchedule
                                - PreferNoSchedule
                                - NoExecute
                                type: string
                              key:
                                description: QualifiedName is a Kubernetes label or
                                  taint key, with an optional DNS prefix.
                                maxLength: 317
                                minLength: 1
                                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$
                                type: string
                                x-kubernetes-validations:
                                - message: key name must be at most 63 characters
                                    and its DNS prefix at most 253
                                  rule: 'self.split(''/'').size() == 1 ? self.size()
                                    <= 63 : self.split(''/'')[0].size() <= 253 &&
                                    self.split(''/'')[1].size() <= 63'
                              value:
                                description: LabelValue follows Kubernetes label value
                                  syntax.
                                maxLength: 63
                                pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                                type: string
                            required:
                            - effect
                            - key
                            type: object
                          maxItems: 64
                          type: array
                          x-kubernetes-list-map-keys:
                          - key
                          - effect
                          x-kubernetes-list-type: map
                      type: object
                    vpcSubnetID:
                      description: VPCSubnetID identifies an existing subnet within
                        spec.network.vpcID for this pool's nodes.
                      format: uuid
                      maxLength: 36
                      type: string
                  required:
                  - instanceType
                  - name
                  - nodeProfile
                  - replicas
                  - vpcSubnetID
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              release:
                description: ReleaseSelection selects the release channel used for
                  the control plane.
                properties:
                  channel:
                    description: ReleaseChannelReference selects a release channel
                      and an optional version within it.
                    properties:
                      name:
                        description: Name identifies the release channel.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      version:
                        description: Version optionally selects a version within the
                          release channel.
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - channel
                type: object
            required:
            - apiServerAccess
            - clusterNetwork
            - controlPlaneClass
            - release
            type: object
            x-kubernetes-validations:
            - message: authentication is only configurable at cluster creation
              rule: has(self.authentication) == has(oldSelf.authentication) && (!has(self.authentication)
                || self.authentication == oldSelf.authentication)
            - message: network is required when nodePools are configured
              rule: '!has(self.nodePools) || self.nodePools.size() == 0 || has(self.network)'
          status:
            description: NKEClusterStatus reports the observed state of the control
              plane and node pools.
            properties:
              conditions:
                description: |-
                  Conditions report readiness and progress, with details in reason and message.
                  A missing condition means its state is unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodePools:
                description: NodePools reports the observed state of each pool, identified
                  by its name in spec.nodePools.
                items:
                  description: NodePoolStatus reports the observed state of a cluster's
                    node pool.
                  properties:
                    conditions:
                      description: Conditions report pool readiness and progress,
                        with details in reason and message.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      maxItems: 32
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    name:
                      description: Name identifies the corresponding pool in spec.nodePools.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    observedGeneration:
                      description: ObservedGeneration refers to the enclosing NKECluster's
                        generation.
                      format: int64
                      minimum: 0
                      type: integer
                    readyReplicas:
                      description: ReadyReplicas is the number of nodes that are ready.
                        Omitted means unknown.
                      format: int32
                      minimum: 0
                      type: integer
                    replicas:
                      description: Replicas is the observed number of nodes in the
                        pool. Omitted means unknown.
                      format: int32
                      minimum: 0
                      type: integer
                    updatedReplicas:
                      description: |-
                        UpdatedReplicas is the number of nodes matching the requested pool configuration.
                        Omitted means unknown.
                      format: int32
                      minimum: 0
                      type: integer
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration identifies the cluster generation
                  reflected in this status.
                format: int64
                minimum: 0
                type: integer
              resolvedRelease:
                description: ResolvedRelease identifies the control-plane release
                  selected for this cluster.
                properties:
                  name:
                    description: ResourceName is a Kubernetes DNS subdomain name,
                      not a provider identifier.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  version:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - version
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
