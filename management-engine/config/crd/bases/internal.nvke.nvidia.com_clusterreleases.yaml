---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterreleases.internal.nvke.nvidia.com
spec:
  group: internal.nvke.nvidia.com
  names:
    kind: ClusterRelease
    listKind: ClusterReleaseList
    plural: clusterreleases
    singular: clusterrelease
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.machineImageRef.name
      name: Image
      type: string
    - jsonPath: .spec.lifecycle.deprecated
      name: Deprecated
      type: boolean
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterRelease is what an operator publishes to make a control-plane release
          available to the engine, and how that release is managed once published.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterReleaseSpec is the published content of a control-plane release: the
              machine image its nodes boot and the initialization applied to them.
            properties:
              lifecycle:
                default: {}
                description: |-
                  ReleaseLifecycle is how an operator manages an already-published Release
                  without altering what that Release provisions.
                properties:
                  deprecated:
                    default: false
                    description: |-
                      Deprecated allows resources already depending on the Release to keep
                      using it, but rejects new cluster or node pool creation referencing it.
                    type: boolean
                  hidden:
                    default: false
                    description: Hidden defines if the release is visible in a given
                      channel
                    type: boolean
                  supportedUntil:
                    description: SupportedUntil is the time at which support for this
                      release ends.
                    format: date-time
                    type: string
                type: object
              machineImageRef:
                description: |-
                  MachineImageReference names a cluster-scoped MachineImage. Only the name is
                  selectable
                properties:
                  name:
                    description: ResourceName is a Kubernetes DNS subdomain name,
                      not a provider identifier.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: machineImageRef is immutable
                  rule: self == oldSelf
              machineInit:
                description: |-
                  MachineInit is the first-boot configuration a Release pairs with its image.
                  It lives on the Release rather than the MachineImage so one image can back
                  several Releases whose initialization differs.
                properties:
                  infra:
                    description: Infra supplies concrete bootstrap additions for the
                      generic infra provider.
                    properties:
                      bootstrapFiles:
                        items:
                          description: BootstrapFile describes a cloud-init write_files
                            entry supported by the generic infra API.
                          properties:
                            content:
                              maxLength: 10240
                              minLength: 1
                              type: string
                            owner:
                              maxLength: 256
                              minLength: 1
                              type: string
                            path:
                              maxLength: 512
                              minLength: 1
                              type: string
                            permissions:
                              maxLength: 16
                              minLength: 1
                              type: string
                          required:
                          - content
                          - path
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      preKubeadmCommands:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  userDataTemplate:
                    description: |-
                      UserDataTemplate is rendered with machine-specific values, such as the
                      hostname and the selected Kubernetes version, and the result is stored in
                      the machine's CAPI bootstrap Secret. It must begin with a cloud-init
                      header.
                    maxLength: 65536
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: userDataTemplate must not be blank
                      rule: self.trim() != ''
                    - message: userDataTemplate must begin with a cloud-init header
                      rule: self.startsWith('#cloud-config\n') || self.startsWith('#cloud-config\r\n')
                        || self.startsWith('#!') || self.startsWith('#include') ||
                        self.startsWith('#cloud-boothook') || self.startsWith('#part-handler')
                        || self.startsWith('#cloud-config-archive') || self.startsWith('Content-Type:')
                    - message: userDataTemplate has unbalanced Go template delimiters
                      rule: self.split('{{').size() == self.split('}}').size()
                required:
                - userDataTemplate
                type: object
                x-kubernetes-validations:
                - message: machineInit is immutable
                  rule: self == oldSelf
            required:
            - machineImageRef
            - machineInit
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
