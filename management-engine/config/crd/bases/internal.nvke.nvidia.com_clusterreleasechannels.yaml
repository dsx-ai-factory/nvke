    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterreleasechannels.internal.nvke.nvidia.com
spec:
  group: internal.nvke.nvidia.com
  names:
    kind: ClusterReleaseChannel
    listKind: ClusterReleaseChannelList
    plural: clusterreleasechannels
    singular: clusterreleasechannel
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: ClusterReleaseChannel is an operator-managed catalog of control-plane
          releases.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterReleaseChannelSpec lists the releases available through
              a channel.
            properties:
              lifecycle:
                default: {}
                description: Lifecycle controls catalog discovery and communicates
                  support.
                properties:
                  deprecated:
                    default: false
                    description: |-
                      Deprecated allows resources already depending on the Release to keep
                      using it, but rejects new cluster or node pool creation referencing it.
                    type: boolean
                  hidden:
                    default: false
                    description: Hidden omits an offering from catalog lists and channel
                      choices. Explicit references remain available.
                    type: boolean
                  supportedUntil:
                    description: SupportedUntil is the time at which support for this
                      release ends.
                    format: date-time
                    type: string
                type: object
              releases:
                additionalProperties:
                  description: ClusterReleaseReferences lists alternatives for one
                    version selector in operator preference order.
                  items:
                    description: ClusterReleaseReference names a cluster-scoped ClusterRelease.
                    properties:
                      minimumUpgradeAge:
                        description: MinimumUpgradeAge is the minimum time since this
                          release was created before it is eligible for automatic
                          adoption.
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: minimumUpgradeAge must be a nonnegative duration
