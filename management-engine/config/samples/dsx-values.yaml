# DSX combined installation: replace endpoint, registry and tenant inputs for the site.
manager:
  image:
    repository: registry.example.invalid/platform/management-engine
    tag: REVIEWED_IMAGE_TAG
  infrastructureTemplateConfigMap: infra-templates
  nvkeController:
    endpoint: https://nvke-controller.example.invalid/api
    tokenSecret:
      name: cluster-service-nvke-controller
      key: bearer-token
metrics:
  enabled: false
prometheus:
  enabled: false
