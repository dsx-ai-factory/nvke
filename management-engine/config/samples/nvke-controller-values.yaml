# Optional NVKE controller connection: replace the endpoint and supply the referenced Secret.
manager:
  args:
    - --leader-elect
    - --leader-election-namespace=$(STATE_NAMESPACE)
    - --namespace=project-a
    - --nvke-controller-endpoint=https://controller.example.com/api
    - --nvke-controller-token-file=/etc/nvke-controller/auth/token
  extraVolumeMounts:
    - name: nvke-controller-token
      mountPath: /etc/nvke-controller/auth
      readOnly: true
  extraVolumes:
    - name: nvke-controller-token
      secret:
        secretName: management-nvke-controller-token
