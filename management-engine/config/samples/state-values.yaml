# Standalone datastore: install the catalog APIs here. Set false when the NVKE
# controller or a dedicated catalog release already owns them on this cluster.
nvke-crds:
  enabled: true

controller:
  enabled: false
state:
  rbac:
    subjects:
      - kind: ServiceAccount
        name: management-engine-controller-manager
        namespace: management-engine-system
      # External identities are Kubernetes User subjects after authentication.
      - kind: User
        apiGroup: rbac.authorization.k8s.io
        name: spiffe://example.org/management-engine
    tenantAPIBindings:
      - namespace: tenant-a
        subjects:
          - kind: User
            apiGroup: rbac.authorization.k8s.io
            name: spiffe://example.org/tenant-api
    operatorAPISubjects:
      - kind: User
        apiGroup: rbac.authorization.k8s.io
        name: spiffe://example.org/operator-api
