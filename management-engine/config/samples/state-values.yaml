controller:
  enabled: false
state:
  # Standalone datastore: install MachineImage, ClusterRelease and NodePoolRelease
  # here. Leave this false when the NVKE controller chart already owns them on
  # this cluster.
  crds:
    releases:
      install: true
  rbac:
    subjects:
      - kind: ServiceAccount
        name: cluster-service-controller-manager
        namespace: cluster-service-system
      # External identities are Kubernetes User subjects after authentication.
      - kind: User
        apiGroup: rbac.authorization.k8s.io
        name: spiffe://example.org/cluster-service
    tenantAPIBindings:
      - namespace: tenant-a
        subjects:
          - kind: User
            apiGroup: rbac.authorization.k8s.io
            name: spiffe://example.org/tenant-api
    operatorAPISubjects:
      - kind: User
        apiGroup: rbac.authorization.k8s.io
        name: spiffe://example.org/operator-api
