# Replace the example boot URL with your site's configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-templates
data:
  clusterTmpl: |
    {
      "cluster": {
        "apiVersion": "infrastructure.cluster.x-k8s.io/v1alpha1",
        "kind": "NicoCluster",
        "spec": {
          "identityRef": {"name": "nico-credentials"},
          "siteID": "00000000-0000-0000-0000-000000000000"
        }
      }
    }
  nodepoolTmpl: |
    {
      "machineTemplate": {
        "apiVersion": "infrastructure.cluster.x-k8s.io/v1alpha1",
        "kind": "NicoMachineTemplate",
        "metadata": {
          "name": "nico-nodepool-template"
        },
        "spec": {
          "template": {
            "spec": {
              "instanceTypeID": "{{ .InstanceType }}",
              "vpcID": "{{ .VPCID }}",
              "cloudInitInjectHostname": true,
              "ipxeScript": "#!ipxe\nchain https://images.example.com/nvke/boot.ipxe\n",
              "interfaces": [
                {"subnetID": "00000000-0000-0000-0000-000000000000"}
              ]
            }
          }
        }
      }
    }
