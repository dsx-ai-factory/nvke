# Optional NVKE controller connection: replace the endpoint and supply the referenced ConfigMap and Secret.
manager:
  args:
    - --leader-elect
    - --leader-election-namespace=$(STATE_NAMESPACE)
    - --kubeconfig=/etc/management-api/kubeconfig
    - --namespace=project-a
    - --nvke-controller-endpoint=https://controller.example.com/api
    - --nvke-controller-bindings=/etc/controller/bindings/bindings.json
    - --nvke-controller-token-file=/etc/controller/auth/token
  extraVolumeMounts:
    - name: controller-bindings
      mountPath: /etc/controller/bindings
      readOnly: true
    - name: controller-token
      mountPath: /etc/controller/auth
      readOnly: true
  extraVolumes:
    - name: controller-bindings
      configMap:
        name: management-controller-bindings
    - name: controller-token
      secret:
        secretName: management-controller-token
