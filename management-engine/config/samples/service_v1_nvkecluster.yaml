apiVersion: service.nvke.nvidia.com/v1
kind: NVKECluster
metadata:
  name: prod-us-west
spec:
  # Public API access policy is deferred.
  # apiServerAccess:
  #   publicAccessEnabled: false
  # Replace with an operator-assigned IPv4 address outside pod and service CIDRs.
  # Required for multiple control-plane nodes and upgrades. Immutable after creation.
  apiServerEndpoint:
    address: 10.0.0.10
  clusterNetwork:
    pods:
      cidrBlocks: [10.244.0.0/16]
    services:
      cidrBlocks: [10.96.0.0/12]
    # Custom service domains are deferred. The domain is fixed to cluster.local.
    # serviceDomain: cluster.local
  release:
    channel:
      name: stable
      version: "1.34"
  controlPlaneClass: standard
  # Existing VPC shared by node pools. Replace with your VPC ID.
  network:
    vpcID: 147ca92b-a90f-4094-92cd-7a0b3f10c30d
  nodePools:
    - name: gpu-pool
      # Resolving instance-type names to downstream IDs is not implemented yet.
      instanceType: gb200-nvl72
      replicas: 8
      # Existing subnet in the shared VPC. Replace with this pool's subnet ID.
      vpcSubnetID: b91c0605-17aa-4ade-aa2c-6a5eb1601dcd
      nodeProfile: ubuntu-24.04:1.38.1.X
      # Labels and taints are applied during node provisioning.
      # Updates after pool creation are not supported.
      userParams:
        labels:
          workload: pretraining
        taints:
          - key: workload
            value: gpu
            effect: NoSchedule
      # Budgets limit new recycle selections.
      rollout:
        strategy:
          type: RollingUpdate
          disruption:
            budgets:
              - nodes: 10%
              # - schedule: "0 9 * * mon-fri"
              #   duration: 8h
              #   nodes: "0"

  # Accelerated runtime selection is deferred.
  # All pools must match the bundle's accelerator family and OS. Core runtime follows the cluster release.
  # acceleratedRuntime:
  #   name: gb200-ubuntu # Bundle name. Use "none" to opt out.
  #   version: "x.y.z" # Explicit OCI tag. Version defaulting is not implemented yet.
