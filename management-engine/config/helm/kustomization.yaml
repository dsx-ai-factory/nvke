apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
# The Helm plugin appends extraVolumes/extraVolumeMounts to source lists.
# Start those lists empty so Helm values provide the remote credential mount.
patches:
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/volumes
      value: []
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts
      value: []
