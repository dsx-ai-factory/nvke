apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-engine-tenant-api
  namespace: management-engine-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: management-engine-tenant-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: management-engine-tenant-api
    spec:
      # Workload datastore access only - caller authentication remains deferred.
      # tenant-test is temporary until namespace comes from the authenticated caller.
      serviceAccountName: management-engine-tenant-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: management-engine:dev
        command: [/tenant-api]
        args:
        - --namespace=tenant-test
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
