apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  labels:
    app.kubernetes.io/name: management-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: management-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: management-engine
    spec:
      serviceAccountName: controller-manager
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: management-engine:dev
        command: [/manager]
        args:
        - --leader-elect
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --infra-template-configmap=management-engine-infra-templates
        - --nvke-controller-endpoint=http://nvke-controller.nvke-controller.svc.cluster.local:8080/api
        - --nvke-controller-token-file=/var/run/secrets/nvke-controller/token
        - --zap-log-level=debug
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        ports:
        - name: https
          containerPort: 8443
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: nvke-controller-token
          mountPath: /var/run/secrets/nvke-controller
          readOnly: true
      volumes:
      - name: nvke-controller-token
        projected:
          sources:
          - serviceAccountToken:
              audience: https://nke.tilt.local
              expirationSeconds: 3600
              path: token
