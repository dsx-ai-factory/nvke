apiVersion: v1
kind: ServiceAccount
metadata:
  name: management-engine-tenant-api
  namespace: management-engine-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: management-engine-tenant-api
  namespace: tenant-test
rules:
- apiGroups: [internal.nvke.nvidia.com]
  resources: [nvkeclusters]
  # Server-side apply also authorizes create when the object does not exist.
  verbs: [create, get, list, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: management-engine-tenant-api
  namespace: tenant-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: management-engine-tenant-api
subjects:
- kind: ServiceAccount
  name: management-engine-tenant-api
  namespace: management-engine-system
