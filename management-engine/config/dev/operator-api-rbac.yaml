apiVersion: v1
kind: ServiceAccount
metadata:
  name: management-engine-operator-api
  namespace: management-engine-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: management-engine-operator-api
rules:
- apiGroups: [internal.nvke.nvidia.com]
  resources: [clusterreleases, machineimages]
  # Server-side apply also authorizes create when the object does not exist.
  verbs: [create, get, list, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: management-engine-operator-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: management-engine-operator-api
subjects:
- kind: ServiceAccount
  name: management-engine-operator-api
  namespace: management-engine-system
