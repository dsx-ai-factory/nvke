certManager:
  enabled: false
controller:
  enabled: true
manager:
  affinity: {}
  args:
  - --leader-elect
  enabled: true
  env: []
  envOverrides: {}
  extraVolumeMounts: []
  extraVolumes: []
  image:
    pullPolicy: IfNotPresent
    repository: management-engine
    tag: dev
  infrastructureTemplateConfigMap: ""
  nodeSelector: {}
  nvkeController:
    endpoint: ""
    tokenSecret:
      key: token
      name: ""
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
  stateAccess:
    kubeconfigSecret:
      key: kubeconfig
      name: ""
    mode: inCluster
  stateNamespace: ""
  terminationGracePeriodSeconds: 35
  tolerations: []
metrics:
  enabled: true
  port: 8443
  secure: true
networkPolicy:
  enabled: false
nvke-crds:
  enabled: false
operatorAPI:
  affinity: {}
  args: []
  enabled: false
  extraVolumeMounts: []
  extraVolumes: []
