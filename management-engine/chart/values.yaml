      path: /healthz
      port: http
  nodeSelector: {}
  pod:
    annotations: {}
    labels: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    timeoutSeconds: 5
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
  service:
    port: 8080
  serviceAccount:
    create: true
    name: ""
  stateAccess:
    context: ""
    kubeconfigSecret:
      key: kubeconfig
      name: ""
    mode: inCluster
  tolerations: []
