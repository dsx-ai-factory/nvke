---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - internal.nvke.nvidia.com
  resources:
  - clusterreleasechannels
  - clusterreleases
  - controlplaneclasses
  - machineimages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - internal.nvke.nvidia.com
  resources:
  - nvkeclusters
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - internal.nvke.nvidia.com
  resources:
  - nvkeclusters/status
  verbs:
  - patch
  - update
