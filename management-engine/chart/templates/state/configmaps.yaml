{{- if .Values.state.enabled }}
{{- range .Values.state.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name | quote }}
  namespace: {{ .namespace | quote }}
data:
  {{- toYaml .data | nindent 2 }}
{{- end }}
{{- end }}
