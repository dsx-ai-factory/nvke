{{- if .Values.state.enabled }}
{{- range $name, $data := .Values.state.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name | quote }}
  namespace: {{ default $.Release.Namespace $.Values.state.namespace }}
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
