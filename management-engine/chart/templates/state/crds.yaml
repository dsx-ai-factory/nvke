{{- if and .Values.state.enabled .Values.state.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/internal.nvke.nvidia.com_*.yaml" }}
{{- $crd := fromYaml ($.Files.Get $path) }}
{{- $retention := dict "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-wave" "-2" "argocd.argoproj.io/sync-options" "Prune=false" }}
{{- $_ := set $crd.metadata "annotations" (merge $retention (default dict $crd.metadata.annotations)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
