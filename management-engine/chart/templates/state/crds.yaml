{{- if and .Values.state.enabled .Values.state.crds.install }}
{{- range $document := splitList "\n---\n" (.Files.Get "files/crds.yaml") }}
{{- $crd := fromYaml $document }}
{{- if $crd.kind }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") (default dict $crd.metadata.annotations)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
{{- end }}
