{{- if and .Values.controller.enabled .Values.manager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "management-engine.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "management-engine.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "management-engine.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "management-engine.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ eq .Values.manager.stateAccess.mode "inCluster" }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:8081
        - --leader-election-namespace=$(STATE_NAMESPACE)
        - {{ printf "--nvke-controller-endpoint=%s" .Values.manager.nvkeController.endpoint | quote }}
        {{- if .Values.manager.nvkeController.tokenSecret.name }}
        - --nvke-controller-token-file=/etc/nvke-controller/auth/token
        {{- end }}
        {{- if eq .Values.manager.stateAccess.mode "remote" }}
        - --kubeconfig=/etc/management-api/kubeconfig
        {{- end }}
        {{- if .Values.manager.infrastructureTemplateConfigMap }}
        - {{ printf "--infra-template-configmap=%s" .Values.manager.infrastructureTemplateConfigMap | quote }}
        {{- end }}
        {{- range .Values.manager.args }}
        - {{ . | quote }}
        {{- end }}
        command:
        - /manager
        env:
        - name: STATE_NAMESPACE
          value: {{ include "management-engine.stateNamespace" . | quote }}
        {{- range .Values.manager.env }}
        {{- if ne .name "STATE_NAMESPACE" }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
        {{- range $k, $v := .Values.manager.envOverrides }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        image: "{{ .Values.manager.image.repository }}{{- if not (contains "@" .Values.manager.image.repository) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        {{- if or .Values.manager.extraVolumeMounts (eq .Values.manager.stateAccess.mode "remote") .Values.manager.nvkeController.tokenSecret.name }}
        volumeMounts:
          {{- if .Values.manager.extraVolumeMounts }}
          {{- toYaml .Values.manager.extraVolumeMounts | nindent 8 }}
          {{- end }}
        {{- if eq .Values.manager.stateAccess.mode "remote" }}
        - mountPath: /etc/management-api
          name: management-api
          readOnly: true
        {{- end }}
        {{- if .Values.manager.nvkeController.tokenSecret.name }}
        - mountPath: /etc/nvke-controller/auth
          name: nvke-controller-token
          readOnly: true
        {{- end }}
        {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "management-engine.serviceAccountName" . }}
      {{- if and (hasKey .Values.manager "terminationGracePeriodSeconds") (ne .Values.manager.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if or .Values.manager.extraVolumes (eq .Values.manager.stateAccess.mode "remote") .Values.manager.nvkeController.tokenSecret.name }}
      volumes:
        {{- if .Values.manager.extraVolumes }}
        {{- toYaml .Values.manager.extraVolumes | nindent 6 }}
        {{- end }}
      {{- if eq .Values.manager.stateAccess.mode "remote" }}
      - name: management-api
        secret:
          defaultMode: 292
          secretName: {{ .Values.manager.stateAccess.kubeconfigSecret.name | quote }}
          items:
          - key: {{ .Values.manager.stateAccess.kubeconfigSecret.key | quote }}
            path: kubeconfig
      {{- end }}
      {{- if .Values.manager.nvkeController.tokenSecret.name }}
      - name: nvke-controller-token
        secret:
          secretName: {{ .Values.manager.nvkeController.tokenSecret.name | quote }}
          defaultMode: 292
          items:
          - key: {{ .Values.manager.nvkeController.tokenSecret.key | quote }}
            path: token
      {{- end }}
      {{- end }}
{{- end }}
