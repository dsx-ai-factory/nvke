# ubuntu-gpu-2026-11 exists. Profiles may share its profile or its tag but not both; its name gets already-exists.
- method: POST
  path: /v1/node-profiles
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: ubuntu-gpu-2026-11-copy
    spec:
      machine_image_ref:
        name: img-ubuntu
      machine_init:
        user_data_template: |
          #cloud-config
      profile: ubuntu-gpu
      tag: "2026.11"
- method: POST
  path: /v1/node-profiles
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: ubuntu-cpu-2026-11
    spec:
      machine_image_ref:
        name: img-ubuntu
      machine_init:
