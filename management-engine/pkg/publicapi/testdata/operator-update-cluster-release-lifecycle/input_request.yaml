method: PUT
path: /v1/cluster-releases/control-plane-v1
headers:
  Content-Type: [application/json]
  If-Match: ['{{ etag }}']
body:
  metadata:
    name: control-plane-v1
  spec:
    kubernetes:
      version: "1.36.3"
    machine_image_ref:
      name: ubuntu-2404-amd64
    machine_init:
      user_data_template: |
        #cloud-config
        hostname: nvke-control-plane
    lifecycle:
      deprecated: true
