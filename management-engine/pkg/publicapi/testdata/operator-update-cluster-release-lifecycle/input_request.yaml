# SPDX-License-Identifier: Apache-2.0

method: PUT
path: /v1/cluster-releases/control-plane-v1
headers:
  Content-Type: [application/json]
  If-Match: ['{{ etag }}']
body:
  metadata:
    name: control-plane-v1
  spec:
    kubernetes:
      version: "1.36.3"
    machine_image_ref:
      name: ubuntu-2404-amd64
    machine_init:
      bootstrap:
        bootstrap_files:
          - path: /etc/nvke/release
            owner: root:root
            permissions: "0644"
            content: control-plane-v1
        pre_bootstrap_commands:
          - hostnamectl set-hostname nvke-control-plane
    lifecycle:
      deprecated: true
