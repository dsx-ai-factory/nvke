- method: POST
  path: /v1/machine-images
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: ubuntu-2404-amd64
    spec:
      operating_system:
        family: ubuntu
        version: "24.04"
      architecture: amd64
      build_date: "2026-01-01"
      nico:
        ipxe_script: |
          #!ipxe
          echo NVKE test image
- method: POST
  path: /v1/cluster-releases
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: control-plane-v1
    spec:
      kubernetes:
        version: "1.36.3"
      machine_image_ref:
        name: ubuntu-2404-amd64
      machine_init:
        bootstrap:
          bootstrap_files:
            - path: /etc/nvke/release
              owner: root:root
              permissions: "0644"
              content: control-plane-v1
          pre_bootstrap_commands:
            - hostnamectl set-hostname nvke-control-plane
