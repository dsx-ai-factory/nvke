- method: POST
  path: "/v1/clusters"
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: "example-cluster"
    spec:
      clusterNetwork:
        pods:
          cidrBlocks: ["10.244.0.0/16"]
        services:
          cidrBlocks: ["10.96.0.0/12"]
      release:
        channel:
          name: "stable"
      controlPlaneClass: "standard"
