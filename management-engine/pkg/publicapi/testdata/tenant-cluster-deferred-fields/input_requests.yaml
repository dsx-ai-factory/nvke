- method: POST
  path: "/v1/clusters"
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: "example-cluster"
    spec:
      cluster_network:
        pods:
          cidr_blocks: ["10.244.0.0/16"]
        services:
          cidr_blocks: ["10.96.0.0/12"]
      release:
        channel:
          name: "stable"
      control_plane_class: "standard"
