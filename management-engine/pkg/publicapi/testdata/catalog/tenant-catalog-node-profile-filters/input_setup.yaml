- method: POST
  path: /v1/machine-images
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: img-ubuntu
    spec:
      architecture: amd64
      build_date: "2026-11-01"
      nico:
        ipxe_script: |
          #!ipxe
          exit
      operating_system:
        family: ubuntu
        version: "24.04"
- method: POST
  path: /v1/node-profiles
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: np-a-hidden
    spec:
      lifecycle:
        hidden: true
      machine_image_ref:
        name: img-ubuntu
      machine_init:
        user_data_template: |
          #cloud-config
          {}
      profile: ubuntu-gpu
      tag: "2026.09"
- method: POST
  path: /v1/node-profiles
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: np-b-other
    spec:
      machine_image_ref:
        name: img-ubuntu
      machine_init:
        user_data_template: |
          #cloud-config
          {}
      profile: other
      tag: "2026.11"
- method: POST
  path: /v1/node-profiles
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: np-c-old
    spec:
      lifecycle:
        deprecated: true
      machine_image_ref:
        name: img-ubuntu
      machine_init:
        user_data_template: |
          #cloud-config
          {}
      profile: ubuntu-gpu
      tag: "2026.10"
- method: POST
  path: /v1/node-profiles
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: np-d-current
    spec:
      machine_image_ref:
        name: img-ubuntu
      machine_init:
        user_data_template: |
          #cloud-config
          {}
      profile: ubuntu-gpu
      tag: "2026.11"
