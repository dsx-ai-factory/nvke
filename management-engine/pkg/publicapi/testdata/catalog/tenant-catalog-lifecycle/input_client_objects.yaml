# Release version annotations are not writable through the operator API.
---
apiVersion: service.nvke.nvidia.com/v1
kind: ClusterRelease
metadata:
  name: cr-active
spec:
  kubernetes:
    version: "1.35.2"
  machineImageRef:
    name: img-ubuntu
  machineInit:
    userDataTemplate: |
      #cloud-config
      {}
---
apiVersion: service.nvke.nvidia.com/v1
kind: ClusterRelease
metadata:
  name: cr-deprecated
spec:
  kubernetes:
    version: "1.35.2"
  lifecycle:
    deprecated: true
  machineImageRef:
    name: img-ubuntu
  machineInit:
    userDataTemplate: |
      #cloud-config
      {}
---
apiVersion: service.nvke.nvidia.com/v1
kind: ClusterRelease
metadata:
  name: cr-hidden
spec:
  kubernetes:
    version: "1.35.2"
  lifecycle:
    hidden: true
  machineImageRef:
    name: img-ubuntu
  machineInit:
    userDataTemplate: |
      #cloud-config
      {}
