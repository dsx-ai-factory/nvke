- method: POST
  path: /v1/machine-images
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: img-ubuntu
    spec:
      architecture: amd64
      build_date: "2026-11-01"
      nico:
        ipxe_script: |
          #!ipxe
          exit
      operating_system:
        family: ubuntu
        version: "24.04"
- method: POST
  path: /v1/cluster-release-channels
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: hidden-channel
    spec:
      lifecycle:
        hidden: true
      releases:
        "1.35":
        - minimum_upgrade_age: 0s
          name: cr-active
- method: POST
  path: /v1/cluster-release-channels
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: deprecated-channel
    spec:
      lifecycle:
        deprecated: true
      releases:
        "1.35":
        - minimum_upgrade_age: 0s
          name: cr-active
        "1.35.2":
        - minimum_upgrade_age: 0s
          name: cr-active
- method: POST
  path: /v1/cluster-release-channels
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: empty-channel
    spec:
      releases:
        "1.35":
        - minimum_upgrade_age: 0s
          name: cr-deprecated
        - minimum_upgrade_age: 0s
          name: cr-hidden
- method: POST
  path: /v1/control-plane-classes
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: hidden-class
    spec:
      control_plane:
        instance_type_preferences:
        - standard
        replicas: 3
        system_reserved_memory: "0"
      lifecycle:
        hidden: true
      rollout:
        strategy:
          rolling_update:
            max_surge: 1
          type: RollingUpdate
- method: POST
  path: /v1/control-plane-classes
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: deprecated-class
    spec:
      control_plane:
        instance_type_preferences:
        - standard
        replicas: 3
        system_reserved_memory: "0"
      lifecycle:
        deprecated: true
        supported_until: "2027-06-30T00:00:00Z"
      rollout:
        strategy:
          rolling_update:
            max_surge: 1
          type: RollingUpdate
- method: POST
  path: /v1/node-profiles
  headers:
    Content-Type: [application/json]
  body:
    metadata:
      name: hidden-profile
    spec:
      lifecycle:
        hidden: true
      machine_image_ref:
        name: img-ubuntu
      machine_init:
        user_data_template: |
          #cloud-config
          {}
      profile: ubuntu-gpu
      tag: "2026.11"
