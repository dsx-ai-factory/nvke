apiVersion: service.nvke.nvidia.com/v1
kind: NVKECluster
metadata:
  name: cluster-1
  namespace: default
spec:
  apiServerAccess:
    publicAccessEnabled: false
  clusterNetwork:
    pods:
      cidrBlocks: [10.244.0.0/16]
    services:
      cidrBlocks: [10.96.0.0/12]
    serviceDomain: cluster.local
  release:
    channel:
      name: stable
  controlPlaneClass: standard
  network:
    vpcID: 22222222-2222-4222-8222-222222222222
  nodePools:
    - name: workers
      instanceType: 33333333-3333-4333-8333-333333333333
      replicas: 13
      vpcSubnetID: 44444444-4444-4444-8444-444444444444
      nodeProfile: "example:1.36.1"
      rollout:
        strategy:
          type: RollingUpdate
          disruption:
            budgets:
              - nodes: "25%"
              - nodes: "3"
    - name: workers-max
      instanceType: 33333333-3333-4333-8333-333333333333
      replicas: 2147483647
      vpcSubnetID: 44444444-4444-4444-8444-444444444444
      nodeProfile: "example:1.36.1"
      rollout:
        strategy:
          type: RollingUpdate
          disruption:
            budgets:
              - nodes: "2147483647"
              - nodes: "100%"
    - name: workers-zero
      instanceType: 33333333-3333-4333-8333-333333333333
      replicas: 0
      vpcSubnetID: 44444444-4444-4444-8444-444444444444
      nodeProfile: "example:1.36.1"
      rollout:
        strategy:
          type: RollingUpdate
          disruption:
            budgets:
              - nodes: "10%"
