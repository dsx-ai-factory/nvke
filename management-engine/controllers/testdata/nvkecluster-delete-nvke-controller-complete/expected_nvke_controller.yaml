clusters: []
nodePools: []
requests:
- createNodePool:
    clusterID: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
    desiredNodeCount: 1
    infra:
      machineTemplate:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachineTemplate
        spec:
          template:
            metadata:
              annotations:
                cluster.x-k8s.io/paused: "true"
              labels:
                instance-type: 33333333-3333-4333-8333-333333333333
                vpc-id: 22222222-2222-4222-8222-222222222222
            spec: {}
    name: workers
    nodeNamePrefix: workers
    provisioningMonitorDisabled: true
    systemReservedMemory: 1Gi
  method: POST
  path: /api/nodePools
- method: DELETE
  path: /api/clusters/aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
