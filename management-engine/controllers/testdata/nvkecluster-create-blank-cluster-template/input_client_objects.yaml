apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-template
  namespace: default
data:
  clusterTmpl: " \t\n"
  nodepoolTmpl: "{}"
  controlplaneTmpl: "{}"
---
apiVersion: internal.nvke.nvidia.com/v1
kind: NVKECluster
metadata:
  name: cluster-1
  namespace: default
spec:
  apiServerAccess:
    publicAccessEnabled: false
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  release:
    channel:
      name: stable
  controlPlaneClass: standard
