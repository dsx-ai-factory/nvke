apiVersion: internal.nvke.nvidia.com/v1
kind: ClusterReleaseChannel
metadata:
  name: stable
spec:
  releases:
    "1.34":
      - name: latest-release
        minimumUpgradeAge: 0s
      - name: pinned-release
        minimumUpgradeAge: 0s
---
apiVersion: internal.nvke.nvidia.com/v1
kind: NVKECluster
metadata:
  name: cluster-1
  namespace: default
spec:
  apiServerAccess:
    publicAccessEnabled: false
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  release:
    channel:
      name: stable
      version: "1.34"
  controlPlaneClass: standard
  network:
    vpcID: 22222222-2222-4222-8222-222222222222
  nodePools:
    - name: workers
      instanceType: 33333333-3333-4333-8333-333333333333
      replicas: 1
      vpcSubnetID: 44444444-4444-4444-8444-444444444444
      nodeProfile: "example:1.34.8"
