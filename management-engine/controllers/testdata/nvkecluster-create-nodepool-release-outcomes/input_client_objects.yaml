apiVersion: internal.nvke.nvidia.com/v1
kind: MachineImage
metadata:
  name: test-image
spec:
  operatingSystem:
    family: ubuntu
    version: "24.04"
  architecture: amd64
  buildDate: "2026-10-01"
  nico:
    ipxeScript: |
      #!ipxe
      chain https://images.example.com/nvke/boot.ipxe
---
apiVersion: internal.nvke.nvidia.com/v1
kind: ClusterReleaseChannel
metadata:
  name: stable
spec:
  releases:
    "1.36":
      - name: test-release
        minimumUpgradeAge: 0s
---
apiVersion: internal.nvke.nvidia.com/v1
kind: ClusterReleaseChannel
metadata:
  name: preview
spec:
  releases:
    "1.36":
      - name: preview-release
        minimumUpgradeAge: 0s
---
apiVersion: internal.nvke.nvidia.com/v1
kind: ClusterRelease
metadata:
  name: test-release
  annotations:
    internal.nvke.nvidia.com/machine-init-kubernetes-version: "1.36.1"
spec:
  machineImageRef:
    name: test-image
  machineInit:
    userDataTemplate: |
      #cloud-config
    infra:
      bootstrapFiles:
        - path: /etc/nvke-release
          content: control-plane-release
      preKubeadmCommands:
        - echo control-plane-release
---
apiVersion: internal.nvke.nvidia.com/v1
kind: ClusterRelease
