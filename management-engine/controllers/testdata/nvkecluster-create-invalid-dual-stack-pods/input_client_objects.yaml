apiVersion: internal.nvke.nvidia.com/v1
kind: MachineImage
metadata:
  name: test-image
spec:
  operatingSystem:
    family: ubuntu
    version: "24.04"
  architecture: amd64
  buildDate: "2026-10-01"
  nico:
    ipxeScript: |
      #!ipxe
      chain https://images.example.com/nvke/boot.ipxe
---
apiVersion: internal.nvke.nvidia.com/v1
kind: ClusterReleaseChannel
metadata:
  name: stable
spec:
  releases:
    "1.36":
      - name: test-release
        minimumUpgradeAge: 0s
---
apiVersion: internal.nvke.nvidia.com/v1
kind: ClusterRelease
metadata:
  name: test-release
  annotations:
    internal.nvke.nvidia.com/machine-init-kubernetes-version: "1.36.1"
spec:
  machineImageRef:
    name: test-image
  machineInit:
    userDataTemplate: |
      #cloud-config
    infra:
      bootstrapFiles: []
      preKubeadmCommands: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-template
  namespace: default
data:
  clusterTmpl: |
    {
      "cluster": {
        "apiVersion": "infrastructure.cluster.x-k8s.io/v1alpha1",
        "kind": "NicoCluster",
        "metadata": {
          "labels": {
            "vpc-id": "{{ .VPCID }}"
          }
        },
        "spec": {"siteID": "11111111-1111-4111-8111-111111111111"}
      }
    }
  nodepoolTmpl: &machineTemplate |
    {
      "bootstrapFiles": {{ .BootstrapFilesJSON }},
      "preKubeadmCommands": {{ .PreKubeadmCommandsJSON }},
      "machineTemplate": {
        "apiVersion": "infrastructure.cluster.x-k8s.io/v1alpha1",
        "kind": "NicoMachineTemplate",
        "spec": {
          "template": {
            "metadata": {
              "annotations": {
                "cluster.x-k8s.io/paused": "true"
              },
              "labels": {
                "vpc-id": "{{ .VPCID }}",
                "instance-type": "{{ .InstanceType }}"
              }
            },
            "spec": {
              "vpcID": "{{ .VPCID }}",
              "instanceTypeID": "{{ .InstanceType }}",
              "interfaces": [{"subnetID": "44444444-4444-4444-8444-444444444444"}],
              "ipxeScript": {{ .IPXEScript }}
            }
          }
        }
      }
    }
  controlplaneTmpl: *machineTemplate
---
apiVersion: internal.nvke.nvidia.com/v1
kind: NVKECluster
metadata:
  name: cluster-1
  namespace: default
spec:
  apiServerAccess:
    publicAccessEnabled: false
  clusterNetwork:
    pods:
      cidrBlocks: [10.244.0.0/16, "fd00::/48"]
    services:
      cidrBlocks: [10.96.0.0/12]
    serviceDomain: cluster.local
  release:
    channel:
      name: stable
  controlPlaneClass: standard
  network:
    vpcID: 22222222-2222-4222-8222-222222222222
  nodePools:
    - name: workers
      instanceType: 33333333-3333-4333-8333-333333333333
      replicas: 1
      vpcSubnetID: 44444444-4444-4444-8444-444444444444
      nodeProfile: "example:1.36.1"
