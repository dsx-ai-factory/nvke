{{- range $surface, $api := dict "tenant" .Values.tenantAPI "operator" .Values.operatorAPI }}
{{- if $api.enabled }}
{{- $name := include "management-engine.resourceName" (dict "suffix" (printf "%s-api" $surface) "context" $) }}
{{- if $api.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "management-engine.apiServiceAccount" (dict "root" $ "api" $api "surface" $surface) }}
  namespace: {{ $.Release.Namespace | quote }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ include "management-engine.name" $ | quote }}
    app.kubernetes.io/component: {{ printf "%s-api" $surface | quote }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "management-engine.name" $ | quote }}
    app.kubernetes.io/component: {{ printf "%s-api" $surface | quote }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  ports:
  - name: http
    port: {{ $api.service.port }}
    targetPort: http
    protocol: TCP
{{- end }}
{{- end }}
