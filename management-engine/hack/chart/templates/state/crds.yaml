{{- if and .Values.state.enabled .Values.state.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/service.nvke.nvidia.com_*.yaml" }}
{{- $crd := fromYaml ($.Files.Get $path) }}
{{- $retention := dict "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-wave" "-2" "argocd.argoproj.io/sync-options" "Prune=false" }}
{{- $_ := set $crd.metadata "annotations" (merge $retention (default dict $crd.metadata.annotations)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- /* Admission policies enforce rules the CRD schemas cannot express, so they share the CRDs' lifecycle. */}}
{{- range $path, $_ := .Files.Glob "files/admission/validatingadmissionpolicy*.yaml" }}
{{- $policy := fromYaml ($.Files.Get $path) }}
{{- $retention := dict "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-wave" "-1" "argocd.argoproj.io/sync-options" "Prune=false" }}
{{- $_ := set $policy.metadata "annotations" (merge $retention (default dict $policy.metadata.annotations)) }}
---
{{ toYaml $policy }}
{{- end }}
{{- end }}
