name: nvke-agent
arch: "${ARCH}"
platform: linux
version: "${DEB_VERSION}"
version_schema: none
section: base
priority: optional
maintainer: Nvidia NVKE
description: NVKE Node Agent and Attestation Service
mtime: "2026-01-01T00:00:00Z"
depends:
  - libc6
replaces:
  - nke-agent
conflicts:
  - nke-agent
provides:
  - nke-agent

scripts:
  postinstall: postinst
  preremove: prerm
  postremove: postrm

contents:
  - src: "${AGENT_DIR}/scripts/migrate-agent-paths.sh"
    dst: /usr/local/lib/nvke-agent/migrate-agent-paths.sh
    expand: true
    file_info: { mode: 0755 }
  # Compatibility with controllers that still invoke the old binary name.
  - src: /usr/local/bin/nvke-agent
    dst: /usr/local/bin/nke-agent
    type: symlink
  - src: "${AGENT_DIR}/bin/linux_${ARCH}/nvke-agent"
    dst: /usr/local/bin/nvke-agent
    expand: true
    file_info: { mode: 0755 }
  - src: "${AGENT_DIR}/bin/linux_${ARCH}/nvke-agent-updater"
    dst: /usr/local/bin/nvke-agent-updater
    expand: true
    file_info: { mode: 0755 }
  - src: "${AGENT_DIR}/scripts/nvke-agent.service"
    dst: /etc/systemd/system/nvke-agent.service
    expand: true
    file_info: { mode: 0644 }
  - src: "${AGENT_DIR}/scripts/nvke-agent-updater@.service"
    dst: /etc/systemd/system/nvke-agent-updater@.service
    expand: true
    file_info: { mode: 0644 }

deb:
  compression: gzip
