// APT owns the v1 Pre-Install-Pkgs protocol: stdin contains the actual .deb
// paths about to reach dpkg. Preserve those bytes before apt cleans its cache.
// GNU xargs consumes APT's newline protocol without shell-interpreting paths.
// Numbered backups retain repeated filenames instead of overwriting bytes.
// The recorder checks bounded archive sizes and deduplicates by exact digest.
DPkg::Pre-Install-Pkgs::nvke-capture "set -eu; umask 077; mkdir -p /var/lib/nke/apt-acquisitions/packages; xargs -r -d '\n' cp --backup=numbered -t /var/lib/nke/apt-acquisitions/packages --";
