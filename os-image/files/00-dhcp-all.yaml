# Configure ALL e* NICs so cloud-init does not select a disconnected NIC for fallback DHCP.
network:
  version: 2
  renderer: networkd
  ethernets:
    all-en:
      match:
        name: "e*"
      dhcp4: true
      # Do we need ip6? commenting out for now
      # dhcp6: true
      optional: true
