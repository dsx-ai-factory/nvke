#
# Installed by the nvke-node-sysconfig package as
# /usr/lib/tmpfiles.d/50-nvke-etcd.conf.
#
# Own the etcd data directory as etcd:etcd, mode 0700 (CIS 1.1.12). kubeadm
# creates /var/lib/etcd as root:root during `kubeadm init` and exposes no knob
# for its ownership, so the only way to influence it is to have the directory
# already exist: kubeadm reuses one it finds rather than creating its own, and
# leaves the ownership alone. Having it in the image also means it is in place
# before any control-plane node is ever provisioned.
#
# `d` creates the directory when it is missing and corrects the owner and mode
# of one that exists, at install and at every boot, never touching what is
# inside. A node that got a root:root directory from an earlier kubeadm init
# therefore converges on the same state as a new image.
d /var/lib/etcd 0700 etcd etcd -
