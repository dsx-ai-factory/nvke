#
# Installed by the NVKE reference image as
# /etc/sysctl.d/10-nke-conntrack-timeouts.conf. See os-image/SPEC.md.
#
# How long conntrack keeps a closed TCP connection's entry in TIME_WAIT. The
# kernel default is 120s; 60s matches the TIME_WAIT Linux itself keeps for a
# closed TCP socket, so entries left by short Connection: close traffic free
# up twice as fast and leave room in the table.
#
# The trade-off: conntrack restarts the 60s on every packet, so an entry is
# dropped only after 60s with no packets. If the last ACK of a close is lost
# and the other end retransmits its FIN more than 60s after the previous
# packet, which takes enough lost packets in a row to back its retransmission
# timer off past 60s, the FIN matches no entry. conntrack marks it INVALID (a
# bare ACK would start a new entry instead), so it gets none of the
# connection's NAT and, for a Service, is not translated back. The data has
# been delivered by then; the other end stays in LAST-ACK until it gives up.
# A Linux endpoint restarts its own 60s TIME_WAIT on each retransmitted FIN,
# so it has dropped its socket by then too and would only have answered with
# a reset.
#
# It applies to the host network namespace, where OVS and kube-proxy track
# connections. The 10- prefix sorts this file before the ones operators
# normally add, so to use another value, set it in a later-sorting file such
# as 99-local.conf.
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 60
