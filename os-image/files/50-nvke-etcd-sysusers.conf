#
# Installed by the nvke-node-sysconfig package as
# /usr/lib/sysusers.d/50-nvke-etcd.conf.
#
# The system user that owns the etcd data directory (CIS 1.1.12). There is no
# etcd user on a node otherwise: etcd runs from registry.k8s.io/etcd as a static
# pod, as root, mounting the directory as a hostPath. Root bypasses directory
# permissions, so an etcd-owned 0700 directory stays writable by it; this
# changes what the node reports, not what etcd can do. Mirrors how the SPIRE
# agent's own user is created (packages/spire-agent/packaging/postinst).
#
# No home directory is created, as with `useradd -r` without -m. See
# 50-nvke-etcd-tmpfiles.conf for the directory.
u etcd - "etcd" /var/lib/etcd /bin/false
