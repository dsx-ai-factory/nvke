  - tab: api
    layout:
      - api: REST API Reference
        # Render each tag's description from controller/api/openapi.yaml as the
        # section intro, so the concept text ships with the reference.
        tag-description-pages: true
        # The tab already carries the title, so do not nest a second
        # "REST API Reference" level (and path segment) under it.
        flattened: true
        # The tab already contributes "rest-api-reference" to the path; without
        # this the URL repeats it.
        skip-slug: true
        # Sections in reading order rather than in order of first appearance
        # in openapi.yaml, which would put Catalog first.
        layout:
          - clusters
          - controlPlane
          - nodePools
          - nodeSets
          - nodes
          - catalog
