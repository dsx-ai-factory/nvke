# Disable Collector-to-gateway and Collector-to-watchdog mTLS.
# Internal traffic becomes plaintext, without client-certificate authentication.
# Target Allocator mTLS, admission webhook certificates, and backend TLS are
# unchanged: this example does NOT remove the dependency on cert-manager.
#
# From the repository root, preview with:
# helm template nktp nktp/deploy/charts/nktp --namespace nktp -f docs/nktp/examples/disable-internal-mtls.values.yaml
#
# These overrides assume chart defaults. Helm replaces lists in full: preserve
# any custom host mounts (including Kind journal mounts) or backend TLS volumes
# and mounts when combining this example with other values files.
# Apply configuration and mount changes together. Connections may fail while
# senders and receivers roll out during a TLS-to-plaintext migration.
certManager:
  internalTLS:
    enabled: false

watchdog:
  kubernetes:
    volumes: []
    volumeMounts: []
  otelcol:
    config:
      receivers:
        # Keep the key because the default pipelines reference it. Without TLS,
        # it serves plaintext gRPC on 4317 despite its name. Allocators keep 4320.
        otlp/secure:
          protocols:
            grpc:
              tls: null

# Receivers become plaintext; sidecars continue sending to watchdog on 4317.
# Null removes inherited certificate settings. Setting insecure alone would
# leave file references behind; insecure_skip_verify would still use TLS.
gateway_logs:
  kubernetes:
    volumes: []
    volumeMounts: []
  otelcol:
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              tls: null
  sidecar:
    kubernetes:
      volumeMounts: []
    otelcol:
      config:
        exporters:
          otlp:
            tls:
              insecure: true
              ca_file: null
              cert_file: null
              key_file: null
              reload_interval: null

