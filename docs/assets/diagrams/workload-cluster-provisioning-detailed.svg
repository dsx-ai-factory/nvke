<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 1050" role="img" aria-labelledby="workload-cluster-provisioning-detailed-title workload-cluster-provisioning-detailed-desc">
  <title id="workload-cluster-provisioning-detailed-title">Workload cluster provisioning, detailed</title>
  <desc id="workload-cluster-provisioning-detailed-desc">Sequence, left to right, across the operator, the NVKE controller, Temporal, Cluster API and CAPNICo, and the SPIRE server on the management cluster, then NICo, a workload node running nvke-agent, and the customer. The operator sends POST /api/clusters; the controller stores the cluster and queues the work in one transaction and returns 201 with status Provisioning, then starts the ProvisionCluster workflow. The workflow applies the Cluster and NicoCluster objects. For each node, the controller starts a ProvisionNode workflow, which writes a NicoMachine and Machine with user data; CAPNICo asks NICo for an instance and NICo boots it from the node OS image. The node's SPIRE agent attests with its TPM. The workflow dials nvke-agent over gRPC with SPIFFE mTLS for preflight checks, runs kubeadm init and installs the CNI on the first control-plane node, and marks the cluster Provisioned; the other nodes run kubeadm join. The controller fetches the admin kubeconfig through nvke-agent and stores it as a Secret on the management cluster. The operator reads it with nvkectl get kubeconfig and gives it to the customer, who uses kubectl.</desc>
