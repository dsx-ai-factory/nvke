<!-- Structure is kept in sync with management-plane-topology.mmd. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 584" role="img" aria-labelledby="management-plane-topology-title management-plane-topology-desc">
  <title id="management-plane-topology-title">NVKE management plane topology</title>
  <desc id="management-plane-topology-desc">Three trust boundaries and NICo. In the operator environment, the operator calls the NVKE API with nvkectl or another client; an optional identity provider issues the JWTs the API checks. On the management cluster, the NVKE controller runs the API, the Temporal worker and the reconcilers. It uses Temporal and PostgreSQL, registers node identities with the SPIRE server, and writes Cluster API objects that Cluster API and CAPNICo reconcile. CAPNICo calls the NICo API. NVKE observability runs alongside. The controller dials nvke-agent on each workload cluster node over gRPC with SPIFFE mTLS; the node's SPIRE agent attests to the SPIRE server with its TPM. Numbered badges show the install step that put each part there: 1, nvkectl bootstrap site forms the cluster; 2, clusterctl init installs Cluster API and cert-manager; 3, nvke-deploy.sh installs the rest.</desc>
