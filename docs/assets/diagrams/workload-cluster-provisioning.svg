<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 648" role="img" aria-labelledby="workload-cluster-provisioning-title workload-cluster-provisioning-desc">
  <title id="workload-cluster-provisioning-title">Workload cluster provisioning</title>
  <desc id="workload-cluster-provisioning-desc">Sequence, left to right. 1, the operator creates a cluster through the NVKE API and the management plane answers with status Provisioning. 2, the management plane requests machines from NICo through CAPNICo. 3, NICo boots each machine from the node OS image. 4, each node attests with its TPM to the management cluster's SPIRE server. 5, the management plane calls nvke-agent on the first control-plane node over SPIFFE mTLS to run kubeadm init and install the CNI. 6, the cluster is Provisioned. 7, the other nodes join through nvke-agent. 8, the operator gets the kubeconfig with nvkectl. 9, the operator gives it to the customer. 10, the customer uses kubectl.</desc>
