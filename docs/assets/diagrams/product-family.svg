    .k-nvke-o { fill: #FFFFFF; stroke: #3F8500; stroke-width: 1.5; }
    .k-nvkr-o { fill: #FFFFFF; stroke: #952FC6; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .g { fill: none; stroke: #757575; stroke-width: 1.5; }
    .e { fill: none; stroke: #4B4B4B; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .ah { fill: #4B4B4B; }
    .ko { fill: #FFFFFF; }
    .ll { stroke: #A7A7A7; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .band { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 5 4; }
