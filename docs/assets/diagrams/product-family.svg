      .g { stroke: #757575; }
      .e { stroke: #A7A7A7; }
      .ah { fill: #A7A7A7; }
      .ko { fill: #1A1A1A; }
      .ll { stroke: #757575; }
      .num { fill: #1A1A1A; stroke: #A7A7A7; }
    }
  </style>
