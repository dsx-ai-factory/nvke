<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 624" role="img" aria-labelledby="product-family-title product-family-desc">
  <title id="product-family-title">NVKE product family</title>
  <desc id="product-family-desc">Layered view, bottom to top. NICo provisions NVIDIA GPU machines, and those machines become the Kubernetes nodes of each workload cluster, each running nvke-agent, under the cluster's Kubernetes control plane. The accelerated runtime that AICR produces and NVKE observability are optional in workload clusters, installed by the operator. The operator installs the management cluster's components from the registry. The management cluster runs the NVKE management plane, CAPNICo and NVKE observability. The management plane requests machines through CAPNICo, which asks NICo for instances, and drives each workload cluster. On the left, the operator builds artifacts with NVKR, which publishes Releases to a registry holding the charts and images for the management cluster and the node OS image that NICo provisions machines from. The operator uses nvkectl or the NVKE API; the customer uses kubectl against the workload cluster's control plane.</desc>
