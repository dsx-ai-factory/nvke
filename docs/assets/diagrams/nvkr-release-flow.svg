<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 520" role="img" aria-labelledby="nvkr-release-flow-title nvkr-release-flow-desc">
  <title id="nvkr-release-flow-title">NVKR release flow</title>
  <desc id="nvkr-release-flow-desc">Left to right. Authored inputs, the Catalog, Definition and Environment, are compiled into a Plan. The Plan runs as a hosted Run in GitHub Actions, which signs its outputs, or as a local Run on your own host, which is unsigned. A hosted Run publishes a Release to the registry the Environment names. The operator verifies the Release against their Verification Policy and exports its release description. The management cluster install reads the release description and pulls charts and images by digest from the registry; it can instead read a local Run directory. NICo provisions workload cluster nodes from the node OS image in the Release. Release qualification is planned.</desc>
