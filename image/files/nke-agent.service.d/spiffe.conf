#
# Overlay on the unit shipped by the nke-agent .deb. Do not replace that unit:
# the package owns it. These drop-ins add SPIRE ordering the stock unit lacks.

[Unit]
After=spire-agent.service
Wants=spire-agent.service

[Service]
ExecStartPre=/usr/lib/nke/wait-spiffe-socket.sh
ExecStartPost=/usr/bin/touch /var/lib/spire-agent/.nke-attested
