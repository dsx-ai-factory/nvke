#
# actionlint fails on any runs-on label it does not know. Without this file it
# reports every workflow that uses a self-hosted runner as broken, which is all
# of them except release.yml, and that makes it useless locally.

self-hosted-runner:
  labels:
    - linux-amd64-cpu4
    - linux-amd64-cpu8
    - linux-amd64-cpu16
    - linux-arm64-cpu16
    - linux-amd64-gpu-l4-latest-1
    # Scale sets on the self-hosted fleet; the name is the size.
    - nke-arm64-8c16g
    - nke-arm64-4c32g
    - nke-arm64-16c64g
    # Scale sets on the RelEng EKS cluster (dgxc-eks-use1-rel-prd1).
    # Both amd64 sizes share one node pool; the two KVM sizes share the
    # bare-metal pool, which is the only one with /dev/kvm.
    - arc-amd64-cpu8
    - arc-amd64-cpu16
    - arc-arm64-cpu16
    - arc-arm64-kvm
    - arc-arm64-kvm-8c16g
