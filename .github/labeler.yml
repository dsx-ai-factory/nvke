#
# Path rules for actions/labeler, consumed by workflows/labeler.yml.
#
# `all-globs-to-any-file` where a negation appears. Inside
# `any-glob-to-any-file` a negation is satisfied by any file outside the
# excluded path, so the label would fire on nearly every pull request.

area/controller:
  - changed-files:
      - all-globs-to-any-file:
          - "controller/**"
          - "!controller/deploy/**"
          - "!controller/docs/**"
          - "!controller/hack/chart-*-assertions.*"
      - any-glob-to-any-file:
          - "cluster-api-provider-provisioned/**"

area/agent:
  - changed-files:
      - any-glob-to-any-file:
          - "agent/**"

area/cli:
  - changed-files:
      - any-glob-to-any-file:
          - "cli/**"

area/chart:
  - changed-files:
      - any-glob-to-any-file:
          - "controller/deploy/**"
          - "controller/hack/chart-*-assertions.*"
          - "deploy/**"
          - "nktp/deploy/**"

area/os-image:
  - changed-files:
      - any-glob-to-any-file:
          - "os-image/**"

area/ci-build:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "Makefile"
          - "make/**"
          - "hack/**"
          - "build/**"
          - ".flox/**"
          - ".*"
          - "*.toml"
          - "*.yaml"

area/docs:
  # Root prose only: "*.md" does not cross a "/", so a module README stays with
  # its module. Matching "**/*.md" adds 47 rider firings and routes nothing new.
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "fern/**"
          - "*.md"
          - "LICENSE"
          - "NOTICE"
      - all-globs-to-any-file:
          - "**/docs/**"

area/deps:
  - changed-files:
      - any-glob-to-any-file:
          - "go.work"
          - "go.work.sum"
          - "**/go.mod"
          - "**/go.sum"
          - ".github/dependabot.yml"

area/generated:
  - changed-files:
      - any-glob-to-any-file:
          - "generated/**"

area/nktp:
  - changed-files:
      - any-glob-to-any-file:
          - "nktp/**"
          - ".github/workflows/nktp-*.yml"
