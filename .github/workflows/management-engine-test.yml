name: Management Engine Tests

on:
  push:
    branches: [main]
    paths:
      - 'management-engine/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/management-engine-test.yml'
  workflow_call:
  workflow_dispatch: {}

permissions: {}

concurrency:
  # Literal name. Inside a called workflow ${{ github.workflow }} is the caller's.
  group: Management Engine Tests-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests (management-engine)
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ runner.arch }}-1.37.0
          restore-keys: |
            envtest-${{ runner.os }}-${{ runner.arch }}-

      - name: Test API and runtime
        env:
          CGO_ENABLED: "1"
          GO_TEST_FLAGS: -race
        run: make -C management-engine test test-integration
