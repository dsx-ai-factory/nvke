#
# Builds an NKE site controller on real Forge hardware and runs a tenant
# against it: `site_controller_test.go`, label `site-controller`.
#
# Unlike every other e2e lane in this repository, nothing under test runs on
# the runner. The runner builds the inputs, then drives a bare-metal Forge
# instance through the site's jump host: stage nkectl, stage the checkout,
# import the images, `nkectl bootstrap site`, install the deploy path, create
# a tenant, tear it all down.
#
# It runs on the ARC fleet because that is the sanctioned fleet for this
# repository's hardware lanes, not because it has to. Measured by
# `forge-connectivity-probe.yml` on 2026-09-23: the Forge API answers, and so
# does the Teleport proxy, which is Teleport Cloud and therefore public. A
# GitHub-hosted runner would reach both. What no runner reaches is the jump
# host directly -- see the `password` note below.
#
# EITHER ROUTE TO THE JUMP HOST, chosen by the `jump-auth` input:
#
#   teleport  The default. tbot joins with this repository's GitHub OIDC
#             identity, so there is no stored credential, and `tsh` relays.
#   password  For a jump host that is not Teleport-enrolled. Logs in with an
#             account password from secrets and asks its sshd to forward.
#             KNOWN NOT TO WORK FOR az61: the probe found no route from the
#             ARC fleet to rel-eng-az61-jump-host:22 on 2026-09-23, so this
#             host is reachable only through the Teleport proxy. Kept for a
#             future site whose jump host is not enrolled; re-run the probe
#             against that host before choosing it.
#
# Nothing else differs: either way the jump host only relays bytes, and the
# SSH session to the node beyond it is negotiated on the runner. Switching is
# changing one input, not any code.
#
# MANUAL ONLY, deliberately, on three separate grounds:
#
#   Capacity.  az61's cpu.himem.t1 pool went from 8 allocated / 7 in use to
#   8/8 after a single site controller, which forced that run's tenant onto
#   the GPU pool. A lane that takes a machine for an hour cannot run on a
#   schedule until there is a capacity plan, and it must never run per-pull-
#   request. See the site-controller plan's "Capacity is a hard constraint".
#
#   Secrets.  A fork pull request cannot reach FORGE_API_KEY or the jump host
#   credential, so a `pull_request` trigger would fail for every contributor.
#
#   Cost of a leak.  Teardown is the suite's, from a defer. If the job is
#   cancelled or hits `timeout-minutes`, the runner dies before teardown and
#   a bare-metal instance stays allocated with nothing left to delete it.
#   `cancel-in-progress: false` and the go-test timeout below both exist for
#   that reason, and a cancelled run still needs someone to check Forge.
#
# NO NODE PASSWORD, on either route. The image's baked `dgxc-admin` account
# is how a person reaches these nodes, and how the manual procedure does it.
# The harness does not: `forge.go` generates an ed25519 key per run,
# cloud-init writes the public half to `authorized_keys`, and the dialer
# authenticates with the private half, which never leaves the runner.
# FORGE_JUMP_HOST_PASSWORD is the jump host's, and only the jump host's.
name: Forge site controller e2e

on:
  workflow_dispatch:
    inputs:
      stage:
        description: How far to go. provision stops at a booted node, bootstrap adds vanilla Kubernetes, full adds the deploy path and a tenant.
        type: choice
        required: true
        default: provision
        options:
          - provision
          - bootstrap
          - full
      controller-version:
        description: Controller version under qualification, e.g. v0.1.1-rc.8. Tags the CWE image staged onto the node.
        type: string
        required: true
      os-image-bootloader:
        description: HTTPS URL of the qcow-imager EFI. Must be plain HTTPS -- iPXE cannot pull an OCI artifact.
        type: string
        required: true
      os-image:
        description: HTTPS URL of the NKE qcow2.
        type: string
        required: true
      jump-auth:
        description: How to reach the jump host. teleport joins as the ARC bot; password is the interim route for a jump host that is not enrolled.
        type: choice
        required: true
        default: teleport
        options:
          - teleport
          - password
      keep-site:
        description: Keep the node after the run, for debugging. Remember to delete it by hand.
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  # One at a time across the whole repository, and never cancelled. Two
  # concurrent runs would exhaust az61, and cancelling one mid-flight leaks
  # its instance. Not keyed on ref: the constraint is the hardware, which is
  # shared by every branch.
  group: Forge site controller e2e
  cancel-in-progress: false

jobs:
  site:
    name: site controller (${{ inputs.stage }})
    # The ARC fleet on the RelEng EKS cluster: 16 vCPU / 64 GiB with dind, on
    # a runner image built to stand in for ubuntu-latest. In the corpnet VPC,
    # which is what makes the jump host reachable at all. Capped at two
    # runners for the whole class, another reason this lane is manual.
    runs-on: arc-amd64-cpu16
    if: github.repository == 'dsx-ai-factory/nke'
    # Measured phases from the az61 SBOM run: ~17 min to create the instance,
    # ~10 to stage assets, ~5 to bootstrap, ~8 to install the management
    # plane, ~20 per tenant. Call it 60 for `full`, doubled for a cold run and
    # for bootstrap's 30-45 minute worst case -- the missing-kubeadm failure
    # runs its full 30 minutes before failing on NodePreflight.
    #
    # The go-test timeout below is 15 minutes shorter on purpose. Ginkgo
    # unwinds and tears the node down when it fires; `timeout-minutes` kills
    # the runner and leaks the instance. The gap is teardown's budget.
    timeout-minutes: 180
    permissions:
      contents: read
      # The Teleport join, and only that. Granted unconditionally because
      # permissions cannot be keyed on an input; the password route simply
      # does not mint a token. The join token's allow rules are what actually
      # bound this -- see the auth step.
      id-token: write
    env:
      # Where `make site-inputs` writes nkectl and the three image archives.
      # Left at the Makefile default so the paths in the config below match
      # e2e-config-example.yaml verbatim.
      SITE_INPUTS: ${{ github.workspace }}/.site-inputs
      # The proxy for the auth step. It also exports TELEPORT_PROXY and
      # TELEPORT_IDENTITY_FILE for tsh, which is how the dialer is configured
      # -- config.go leaves teleportIdentityFile empty and tsh reads the
      # environment, which is what a bot has instead of a login session.
      FORGE_TELEPORT_PROXY: ${{ vars.FORGE_TELEPORT_PROXY }}
      # Not checked in: the jump host names internal topology. Repository
      # variables rather than secrets, because a hostname, a login and a
      # public key's fingerprint are not credentials -- the credential is the
      # Teleport identity or FORGE_JUMP_HOST_PASSWORD.
      FORGE_JUMP_HOST: ${{ vars.FORGE_JUMP_HOST }}
      FORGE_JUMP_HOST_USER: ${{ vars.FORGE_JUMP_HOST_USER }}
      # `ssh-keyscan -t ed25519 <jump host> | ssh-keygen -lf -`, the SHA256:
      # field. Unset still runs, and warns on every dial that it accepted the
      # key unchecked -- which on a password route means the password was
      # offered to whatever answered.
      FORGE_JUMP_HOST_KEY_FINGERPRINT: ${{ vars.FORGE_JUMP_HOST_KEY_FINGERPRINT }}
    steps:
      # persist-credentials: true, against the convention in the other lanes.
      # `make site-inputs` runs `git fetch --no-tags origin refs/pull/812/head`
      # to get the deploy path, and this repository is private, so the fetch
      # needs the token left in the remote. Delete both this comment and the
      # `with:` block when #812 merges: the deploy path is then on main and
      # SITE_DEPLOY_PATH_FETCH has nothing to fetch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # Three `docker save` archives of multi-hundred-megabyte images, written
      # to the workspace and read back by dind. Reported rather than freed:
      # the ubuntu-latest trick of deleting /usr/share/dotnet and friends has
      # nothing to delete in a runner container, and the space that matters
      # is the pod's, not the node's. This is here so a run that fails on
      # space says so in its first thirty seconds.
      - name: Report disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h "${GITHUB_WORKSPACE}" /tmp
          docker system df || true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # tsh is the relay: `teleport.Dialer` shells out to it to open a byte
      # stream to the node's sshd through the jump host. Pinned, and checked,
      # because an unpinned client against a pinned cluster is a failure mode
      # that surfaces as an unexplained relay error deep in a 40-minute run.
      # Matched to nv-prd-dgxc's server version rather than merely within the
      # supported skew.
      # tbot as well as tsh. The harness only ever runs tsh, but
      # teleport-actions/auth below ships no binary of its own: it shells out
      # to tbot, and fails with "Unable to locate executable file" if one is
      # not already on PATH. Both come out of the same tarball, so the version
      # pin covers the join as well as the relay.
      - name: Install tsh and tbot
        if: inputs.jump-auth == 'teleport'
        shell: bash
        env:
          TELEPORT_VERSION: "18.11.0"
        run: |
          set -Eeuo pipefail
          curl -fsSL --connect-timeout 20 --max-time 300 \
            -o /tmp/teleport.tar.gz \
            "https://cdn.teleport.dev/teleport-v${TELEPORT_VERSION}-linux-amd64-bin.tar.gz"
          tar -C /tmp -xzf /tmp/teleport.tar.gz teleport/tsh teleport/tbot
          sudo install -m 0755 /tmp/teleport/tsh /usr/local/bin/tsh
          sudo install -m 0755 /tmp/teleport/tbot /usr/local/bin/tbot
          tsh version

      # The join token allows two refs per repository, refs/heads/main and
      # refs/pull/*/merge, so a workflow_dispatch from any other branch mints
      # nothing. Checked here because the join failure names neither the ref
      # nor the rule, and this lane is dispatched by hand from a branch
      # picker that offers every branch.
      - name: Check the dispatch ref
        if: inputs.jump-auth == 'teleport'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          case "${REF}" in
            refs/heads/main | refs/pull/*/merge) ;;
            *)
              echo "::error::dispatched from ${REF}; the Teleport join token allows only" \
                   "refs/heads/main and refs/pull/*/merge. Dispatch from main, or use jump-auth=password."
              exit 1
              ;;
          esac

      # No stored identity: tbot joins with the repository's OIDC token
      # against rg-nke-arc-runners-github-join, whose bot holds
      # rg-k8aas-bot-ssh-root -- root on the four jump hosts labelled
      # tbot-root-allowed=true, one of which is the az61 one this lane uses.
      # The action exports TELEPORT_PROXY and TELEPORT_IDENTITY_FILE, which
      # is exactly what the dialer's tsh relay reads.
      #
      # certificate-ttl is requested, not granted: Teleport issues the
      # shortest max_session_ttl across the bot's roles, and rg-nke-ssh-sudo
      # caps that at 2h today -- a role that matches no node and is carried
      # only for parity with the GitLab bot. A `full` run can outlast it, so
      # until that role is dropped from the bot or given an explicit TTL,
      # expect relay failures past the two-hour mark. Teardown itself is a
      # Forge API call and does not go through here, so the machine is still
      # released.
      - name: Authenticate to Teleport
        if: inputs.jump-auth == 'teleport'
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: ${{ env.FORGE_TELEPORT_PROXY }}
          token: rg-nke-arc-runners-github-join
          certificate-ttl: 4h

      # Fails here rather than 20 minutes in, after a node has been created
      # and can no longer be reached to be torn down. Only the presence of
      # the password is checked -- whether it is the right one is the jump
      # host's answer, on the first dial.
      - name: Check the jump host credential
        if: inputs.jump-auth == 'password'
        shell: bash
        env:
          JUMP_HOST_PASSWORD: ${{ secrets.FORGE_JUMP_HOST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "${JUMP_HOST_PASSWORD}" || {
            echo "::error::FORGE_JUMP_HOST_PASSWORD is empty; the run cannot reach the jump host"
            exit 1
          }
          # No fallback on this route: teleportLogin is left empty below,
          # because root is the Teleport bot's login and not necessarily an
          # account the jump host accepts a password for.
          test -n "${FORGE_JUMP_HOST_USER}" || {
            echo "::error::the FORGE_JUMP_HOST_USER repository variable is unset; the password has no account to go with"
            exit 1
          }
          test -n "${FORGE_JUMP_HOST_KEY_FINGERPRINT}" || echo "::warning::\
          the FORGE_JUMP_HOST_KEY_FINGERPRINT repository variable is unset, so the jump host's \
          key is accepted unchecked and the password is offered to whatever answers on port 22. \
          Set it from \`ssh-keyscan -t ed25519 \${FORGE_JUMP_HOST} | ssh-keygen -lf -\`."

      # site-inputs pulls the controller and capi-provisioned images, both
      # private. The suite's own GHCR credential is separate and passed as
      # environment below -- it is what the *node* pulls CAPNICo with, through
      # the ghcr-imagepull Secret the deploy path renders.
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

      # nkectl for the node's architecture, the three image archives, and the
      # deploy path fetched from #812. The node has no access to this
      # repository, so everything it runs has to be built here and staged.
      - name: Build the site inputs
        shell: bash
        env:
          SITE_CONTROLLER_VERSION: ${{ inputs.controller-version }}
        run: |
          set -Eeuo pipefail
          make -C controller/test/e2e site-inputs \
            SITE_CONTROLLER_VERSION="${SITE_CONTROLLER_VERSION}" \
            SITE_INPUTS="${SITE_INPUTS}"

      # Identifiers and paths only. Every secret is read from the environment
      # by the suite itself and never reaches this file -- see the const block
      # at the top of site_controller_test.go.
      - name: Write the e2e config
        shell: bash
        env:
          SITE_CONTROLLER_VERSION: ${{ inputs.controller-version }}
          TELEPORT_LOGIN: ${{ inputs.jump-auth == 'teleport' && 'root' || '' }}
        run: |
          set -Eeuo pipefail
          test -n "${FORGE_JUMP_HOST}" || {
            echo "::error::the FORGE_JUMP_HOST repository variable is unset; the suite has no way to reach the node"
            exit 1
          }
          cat > controller/test/e2e/e2e-config.yaml <<EOF
          # Generated by .github/workflows/forge-site-controller-e2e.yml.
          site:
            jumpHost: "${FORGE_JUMP_HOST}"
            # root because that is the only login rg-k8aas-bot-ssh-root
            # grants; empty on the password route, where the account comes
            # from jumpHostUser instead.
            teleportLogin: "${TELEPORT_LOGIN}"
            # Both ignored on the Teleport route, which takes its login from
            # the identity and its host key from the cluster CA.
            jumpHostUser: "${FORGE_JUMP_HOST_USER}"
            jumpHostKeyFingerprint: "${FORGE_JUMP_HOST_KEY_FINGERPRINT}"
            images:
              - ${SITE_INPUTS}/controller.tar
              - ${SITE_INPUTS}/capi-provisioned.tar
              - ${SITE_INPUTS}/profiles.tar
            bootstrapEnv:
              NKECTL_CWE_IMAGE: ghcr.io/dsx-ai-factory/nke/nke-controller:${SITE_CONTROLLER_VERSION}
              NKECTL_CAPI_PROVISIONED_IMAGE: ghcr.io/dsx-ai-factory/nke/cluster-api-provider-provisioned:v0.1.0-rc.1
            profilesImage: nke-e2e-profiles:local
          EOF
          echo "--- e2e-config.yaml ---"
          cat controller/test/e2e/e2e-config.yaml

      # Three nested timeouts, shortest first, because only the shortest one
      # tears the node down:
      #
      #   -ginkgo.timeout 150m  fails the suite and runs its cleanup, which
      #                         is what releases the Forge instance.
      #   -timeout        165m  go's own backstop. It panics rather than
      #                         unwinding, so deferred teardown does NOT run
      #                         and the instance leaks -- reaching this means
      #                         Ginkgo itself is wedged.
      #   timeout-minutes 180   the runner is killed. Same leak, no log.
      #
      # A fourth clock is not ours: on the Teleport route the bot certificate
      # expires after the shortest max_session_ttl among its roles, 2h today.
      # It is shorter than the Ginkgo timeout, so a long `full` run can lose
      # the relay before it finishes. See the auth step.
      #
      # environments/forge.yaml declares one site (az61), so the suite
      # resolves it without being told which.
      - name: Run the site controller lane
        shell: bash
        working-directory: controller/test/e2e
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # Presence is the switch: the suite relays over plain SSH when this
          # is set and over tsh when it is not, so the Teleport route is an
          # empty value here rather than a second code path.
          JUMP_HOST_PASSWORD: ${{ inputs.jump-auth == 'password' && secrets.FORGE_JUMP_HOST_PASSWORD || '' }}
          SITE_STAGE: ${{ inputs.stage }}
          SITE_CONTROLLER_VERSION: ${{ inputs.controller-version }}
          OS_IMAGE_BOOTLOADER: ${{ inputs.os-image-bootloader }}
          OS_IMAGE: ${{ inputs.os-image }}
          KEEP_SITE: ${{ inputs.keep-site }}
        run: |
          set -Eeuo pipefail
          keep=()
          if [ "${KEEP_SITE}" = "true" ]; then
            keep=(-e2e.keep-site)
            echo "::warning::-e2e.keep-site is set; the Forge instance survives this run and must be deleted by hand"
          fi
          go test -timeout 165m . -args \
            -ginkgo.label-filter=site-controller \
            -ginkgo.timeout=150m \
            -ginkgo.v \
            -e2e.config=e2e-config.yaml \
            -e2e.environment=forge \
            -e2e.site-stage="${SITE_STAGE}" \
            -e2e.versions="controller=${SITE_CONTROLLER_VERSION},os-image-bootloader=${OS_IMAGE_BOOTLOADER},os-image=${OS_IMAGE}" \
            "${keep[@]}" 2>&1 | tee site-e2e.log

      # The Ginkgo log, which is the whole diagnostic record: the suite writes
      # its forwarded kubeconfig to a temp directory and nothing else to disk,
      # so every phase boundary, remote command and failure lives in stdout.
      # An hour-long run is worth more than a scroll-back in the job view, and
      # a green one is the reference for diagnosing the next red one.
      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-site-${{ inputs.stage }}-${{ github.run_id }}
          path: controller/test/e2e/site-e2e.log
          if-no-files-found: warn
          retention-days: 7

      # The runner is ephemeral, so this is belt and braces -- but an identity
      # good for hours, sitting where a later step could read it, is not worth
      # the saving. The auth action chooses the path; hence the indirection.
      - name: Remove the Teleport identity
        if: always() && inputs.jump-auth == 'teleport'
        shell: bash
        run: rm -f -- "${TELEPORT_IDENTITY_FILE:-}"
