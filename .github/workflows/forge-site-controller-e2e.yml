#
# Builds an NKE site controller on real Forge hardware and runs a tenant
# against it: `site_controller_test.go`, label `site-controller`.
#
# Unlike every other e2e lane in this repository, nothing under test runs on
# the runner. The runner builds the inputs, then drives a bare-metal Forge
# instance through the site's jump host: stage nkectl, stage the checkout,
# import the images, `nkectl bootstrap site`, install the deploy path, create
# a tenant, tear it all down.
#
# It runs on the ARC fleet because that is the sanctioned fleet for this
# repository's hardware lanes, not because it has to. Measured by
# `forge-connectivity-probe.yml` on 2026-09-23: the Forge API answers, and so
# does the Teleport proxy, which is Teleport Cloud and therefore public. A
# GitHub-hosted runner would reach both.
#
# TELEPORT IS THE ONLY ROUTE TO THE JUMP HOST. tbot joins with this
# repository's GitHub OIDC identity, so there is no stored credential, and
# `tsh` relays bytes to the node's sshd. The jump host itself does nothing
# else: the SSH session beyond it is negotiated on the runner.
#
# There was a second route, a plain-SSH login with an account password. The
# same probe found no route at all from the ARC fleet to
# rel-eng-az61-jump-host:22, so it could never have worked here, and it is
# gone from this file. `teleport.SSHJumpHost` stays in the harness, with its
# tests, for a future site whose jump host is not Teleport-enrolled; giving
# the suite a JUMP_HOST_PASSWORD is still what selects it.
#
# NEVER AUTOMATIC. A run takes a bare-metal machine for up to an hour, so it
# starts only when a person asks: a workflow_dispatch, or the `forge-e2e`
# label on a pull request from this repository. Three reasons it is not on a
# schedule and not on every push:
#
#   Capacity.  az61's cpu.himem.t1 pool went from 8 allocated / 7 in use to
#   8/8 after a single site controller, which forced that run's tenant onto
#   the GPU pool. See the site-controller plan's "Capacity is a hard
#   constraint".
#
#   Secrets.  A fork pull request cannot reach FORGE_API_KEY, and the
#   Teleport join token deliberately does not cover forks either. The label
#   gate below requires the head repository to be this one, so a fork PR
#   carrying the label still does not run.
#
#   Cost of a leak.  Teardown is the suite's, from a defer. If the job is
#   cancelled or hits `timeout-minutes`, the runner dies before teardown and
#   a bare-metal instance stays allocated with nothing left to delete it.
#   `cancel-in-progress: false` and the go-test timeout below both exist for
#   that reason, and a cancelled run still needs someone to check Forge.
#
# NO NODE PASSWORD. The image's baked `dgxc-admin` account is how a person
# reaches these nodes, and how the manual procedure does it. The harness does
# not: `forge.go` generates an ed25519 key per run, cloud-init writes the
# public half to `authorized_keys`, and the dialer authenticates with the
# private half, which never leaves the runner.
name: Forge site controller e2e

on:
  workflow_dispatch:
    inputs:
      stage:
        description: How far to go. provision stops at a booted node, bootstrap adds vanilla Kubernetes, full adds the deploy path and a tenant.
        type: choice
        required: true
        default: provision
        options:
          - provision
          - bootstrap
          - full
      controller-version:
        description: Published CWE tag to qualify, e.g. v0.1.1-rc.8. Leave empty to build the CWE from this checkout, which is the only pairing that currently works -- see the resolve step.
        type: string
        required: false
      os-image-bootloader:
        description: HTTPS URL of the qcow-imager EFI. Must be plain HTTPS -- iPXE cannot pull an OCI artifact.
        type: string
        required: true
      os-image:
        description: HTTPS URL of the NKE qcow2.
        type: string
        required: true
      keep-site:
        description: Keep the node after the run, for debugging. Remember to delete it by hand.
        type: boolean
        required: false
        default: false
  # The only way to run this lane against a change before that change is on
  # main, and for now the only way to run it at all: workflow_dispatch reads
  # its definition from the default branch, so this file is not dispatchable
  # until it merges. A pull_request run also carries refs/pull/<n>/merge,
  # which is one of the two refs the Teleport join token accepts.
  #
  # `labeled` and nothing else. Adding `forge-e2e` is the request to run;
  # `synchronize` is deliberately absent so that pushing to a labelled PR
  # does not quietly take another machine. To run again, remove the label and
  # add it back, or use the re-run button.
  #
  # A pull_request event has no `inputs`, so the four dispatch inputs fall
  # back to FORGE_E2E_* repository variables. See the job env below.
  pull_request:
    types: [labeled]
    branches: [main]

permissions: {}

concurrency:
  # One at a time across the whole repository, and never cancelled. Two
  # concurrent runs would exhaust az61, and cancelling one mid-flight leaks
  # its instance. Not keyed on ref: the constraint is the hardware, which is
  # shared by every branch.
  group: Forge site controller e2e
  cancel-in-progress: false

jobs:
  site:
    name: site controller (${{ inputs.stage || vars.FORGE_E2E_STAGE || 'provision' }})
    # The ARC fleet on the RelEng EKS cluster: 16 vCPU / 64 GiB with dind, on
    # a runner image built to stand in for ubuntu-latest. In the corpnet VPC,
    # which is what makes the jump host reachable at all. Capped at two
    # runners for the whole class, another reason this lane is manual.
    runs-on: arc-amd64-cpu16
    # A dispatch is already a deliberate act. A pull_request run has to be
    # asked for with the `forge-e2e` label, and has to come from a branch in
    # this repository -- a fork PR reaches neither the secrets nor the join
    # token, so it would burn a runner to fail.
    if: >-
      github.repository == 'dsx-ai-factory/nke' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'forge-e2e')))
    # Measured phases from the az61 SBOM run: ~17 min to create the instance,
    # ~10 to stage assets, ~5 to bootstrap, ~8 to install the management
    # plane, ~20 per tenant. Call it 60 for `full`, doubled for a cold run and
    # for bootstrap's 30-45 minute worst case -- the missing-kubeadm failure
    # runs its full 30 minutes before failing on NodePreflight.
    #
    # The go-test timeout below is 15 minutes shorter on purpose. Ginkgo
    # unwinds and tears the node down when it fires; `timeout-minutes` kills
    # the runner and leaks the instance. The gap is teardown's budget.
    timeout-minutes: 180
    permissions:
      contents: read
      # Both GHCR pulls: the runner's, and the node's through the
      # imagePullSecret the deploy path renders. No PAT, matching every other
      # workflow here -- github.actor with GITHUB_TOKEN. The token dies with
      # the job, which is shorter than any credential we could store.
      packages: read
      # The Teleport join, and only that. The join token's allow rules are
      # what actually bound it -- see the daemon step.
      id-token: write
    env:
      # Every knob, resolved once. A workflow_dispatch fills `inputs`; a
      # pull_request run has none, so it takes the FORGE_E2E_* repository
      # variables instead. The guard step checks the result rather than
      # letting an empty image URL surface twenty minutes into a run.
      SITE_STAGE: ${{ inputs.stage || vars.FORGE_E2E_STAGE || 'provision' }}
      # Empty asks for a build from this checkout; the resolve step fills it
      # in. Every use of it downstream -- the image site-inputs stages, the
      # NKECTL_CWE_IMAGE the bootstrap runs, and the tag the SBOM deploys --
      # reads this one value, which is what keeps them the same image.
      SITE_CONTROLLER_VERSION: ${{ inputs.controller-version || vars.FORGE_E2E_CONTROLLER_VERSION }}
      OS_IMAGE_BOOTLOADER: ${{ inputs.os-image-bootloader || vars.FORGE_E2E_OS_IMAGE_BOOTLOADER }}
      OS_IMAGE: ${{ inputs.os-image || vars.FORGE_E2E_OS_IMAGE }}
      # A label cannot carry a boolean, so a PR run never keeps its node.
      KEEP_SITE: ${{ inputs.keep-site || false }}
      # Where `make site-inputs` writes nkectl and the three image archives.
      # Left at the Makefile default so the paths in the config below match
      # e2e-config-example.yaml verbatim.
      SITE_INPUTS: ${{ github.workspace }}/.site-inputs
      # The proxy for the auth step. It also exports TELEPORT_PROXY and
      # TELEPORT_IDENTITY_FILE for tsh, which is how the dialer is configured
      # -- config.go leaves teleportIdentityFile empty and tsh reads the
      # environment, which is what a bot has instead of a login session.
      FORGE_TELEPORT_PROXY: ${{ vars.FORGE_TELEPORT_PROXY }}
      # Not checked in: the jump host names internal topology. A repository
      # variable rather than a secret, because a hostname is not a
      # credential -- the credential is the Teleport identity.
      FORGE_JUMP_HOST: ${{ vars.FORGE_JUMP_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Three `docker save` archives of multi-hundred-megabyte images, written
      # to the workspace and read back by dind. Reported rather than freed:
      # the ubuntu-latest trick of deleting /usr/share/dotnet and friends has
      # nothing to delete in a runner container, and the space that matters
      # is the pod's, not the node's. This is here so a run that fails on
      # space says so in its first thirty seconds.
      - name: Report disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h "${GITHUB_WORKSPACE}" /tmp
          docker system df || true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # tsh is the relay: `teleport.Dialer` shells out to it to open a byte
      # stream to the node's sshd through the jump host. Pinned, and checked,
      # because an unpinned client against a pinned cluster is a failure mode
      # that surfaces as an unexplained relay error deep in a 40-minute run.
      # Matched to nv-prd-dgxc's server version rather than merely within the
      # supported skew.
      # tbot as well as tsh: the harness relays with tsh, and the step below
      # runs tbot as the daemon that keeps the identity fresh. Both come out
      # of the same tarball, so one pin covers the join and the relay.
      - name: Install tsh and tbot
        shell: bash
        env:
          TELEPORT_VERSION: "18.11.0"
        run: |
          set -Eeuo pipefail
          curl -fsSL --connect-timeout 20 --max-time 300 \
            -o /tmp/teleport.tar.gz \
            "https://cdn.teleport.dev/teleport-v${TELEPORT_VERSION}-linux-amd64-bin.tar.gz"
          tar -C /tmp -xzf /tmp/teleport.tar.gz teleport/tsh teleport/tbot
          sudo install -m 0755 /tmp/teleport/tsh /usr/local/bin/tsh
          sudo install -m 0755 /tmp/teleport/tbot /usr/local/bin/tbot
          tsh version

      # nkectl is built from this checkout and is a client of the CWE it
      # bootstraps, so the two have to be one commit. No published tag gives
      # that: GHCR carries release tags only and its newest, v0.1.1-rc.8, is
      # 43 commits before #850, which removed infra.spireAttestationMethod
      # from the cluster API. Run 35999250795 spent forty minutes reaching
      #   400 Bad Request: infra.spireAttestationMethod is required
      # on exactly that pairing.
      #
      # So the default is to build, tagged with the commit under test -- on a
      # pull_request that is the merge commit, which is the thing being
      # qualified. Not `git describe`: the checkout is shallow and carries no
      # tags, so it would report v0.0.0 and silently stop being unique.
      #
      # Naming a version instead pulls that published tag, for qualifying a
      # release once one is cut past #850.
      - name: Resolve the controller version
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${SITE_CONTROLLER_VERSION}" ]; then
            echo "SITE_CONTROLLER_BUILD=0" >> "${GITHUB_ENV}"
            echo "qualifying the published ${SITE_CONTROLLER_VERSION}"
            echo "::warning::pulling a published CWE, ${SITE_CONTROLLER_VERSION}; if it predates #850 the bootstrap fails at \"creating the site cluster\""
            exit 0
          fi
          version="$(git rev-parse --short=12 HEAD)"
          {
            echo "SITE_CONTROLLER_BUILD=1"
            echo "SITE_CONTROLLER_VERSION=${version}"
          } >> "${GITHUB_ENV}"
          echo "building the CWE from ${version}"

      # Two checks that each cost a second and each save a run: the ref the
      # join token will see, and the three values a pull_request event does
      # not supply. Both fail here rather than after a machine exists.
      - name: Check the run is viable
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          # The join token allows refs/heads/main and refs/pull/*/merge and
          # nothing else, so a dispatch from any other branch mints nothing.
          # Checked here because the join failure names neither the ref nor
          # the rule, and the dispatch UI offers every branch.
          case "${REF}" in
            refs/heads/main | refs/pull/*/merge) ;;
            *)
              echo "::error::running from ${REF}; the Teleport join token allows only" \
                   "refs/heads/main and refs/pull/*/merge. Dispatch from main, or label a pull request."
              exit 1
              ;;
          esac

          # Empty on a pull_request run whose FORGE_E2E_* variable is unset.
          # SITE_CONTROLLER_VERSION is not here: the step above resolves it.
          missing=()
          for name in SITE_STAGE OS_IMAGE_BOOTLOADER OS_IMAGE; do
            [ -n "${!name}" ] || missing+=("${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::no value for ${missing[*]}. A dispatch takes these from its inputs;" \
                 "a labelled pull request takes them from the FORGE_E2E_* repository variables."
            exit 1
          fi
          echo "stage=${SITE_STAGE} controller=${SITE_CONTROLLER_VERSION}"

      # No stored identity: tbot joins with the repository's OIDC token
      # against rg-nke-arc-runners-github-join, whose bot holds
      # rg-k8aas-bot-ssh-root -- root on the four jump hosts labelled
      # tbot-root-allowed=true, one of which is the az61 one this lane uses.
      #
      # A DAEMON, NOT teleport-actions/auth. That action mints exactly one
      # certificate and stamps it disallow-reissue, and the cluster caps
      # every certificate at the shortest max_session_ttl across the bot's
      # roles -- 2h, set by rg-nke-ssh-sudo, a role that matches no node and
      # is carried only for parity with the GitLab bot. Asking for 4h
      # measurably returns 1h59m. A `full` run's 150-minute budget outlives
      # that, and the relay would start failing partway through.
      #
      # tbot in daemon mode renews instead, rewriting the same identity file
      # every 20 minutes, so the absolute TTL stops mattering. The dialer
      # starts a fresh `tsh` per dial and reads TELEPORT_IDENTITY_FILE, so it
      # picks the new file up with no coordination; sessions already open are
      # unaffected, since the cluster sets no disconnect_expired_cert.
      #
      # Every element of this config was verified against nv-prd-dgxc 18.11
      # by forge-connectivity-probe.yml before the lane was changed.
      - name: Start the Teleport identity daemon
        shell: bash
        env:
          TBOT_DIR: ${{ runner.temp }}/tbot
        run: |
          set -Eeuo pipefail
          mkdir -p "${TBOT_DIR}"
          cat > "${RUNNER_TEMP}/tbot.yaml" <<EOF
          version: v2
          proxy_server: ${FORGE_TELEPORT_PROXY}
          onboarding:
            join_method: github
            token: rg-nke-arc-runners-github-join
          # Nothing to persist: the bot re-joins with the runner's OIDC token,
          # so there is no state worth keeping and none left on disk.
          storage:
            type: memory
          # 1h is what the cluster grants whatever is asked for. The interval
          # is the part that matters: the file on disk is never within 40
          # minutes of expiring, however long the run lasts.
          credential_lifetime:
            ttl: 1h
            renewal_interval: 20m
          services:
            - type: identity
              destination:
                type: directory
                path: ${TBOT_DIR}
          EOF

          tbot start -c "${RUNNER_TEMP}/tbot.yaml" >"${RUNNER_TEMP}/tbot.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/tbot.pid"

          for _ in $(seq 1 30); do
            [ -s "${TBOT_DIR}/identity" ] && break
            sleep 2
          done
          if [ ! -s "${TBOT_DIR}/identity" ]; then
            echo "::error::tbot wrote no identity in 60s; the run cannot reach the jump host"
            sed 's/^/  /' "${RUNNER_TEMP}/tbot.log"
            exit 1
          fi

          # What teleport-actions/auth used to export, and what both tsh and
          # the dialer read. config.go deliberately leaves the identity path
          # empty so that it comes from here.
          {
            echo "TELEPORT_PROXY=${FORGE_TELEPORT_PROXY}"
            echo "TELEPORT_IDENTITY_FILE=${TBOT_DIR}/identity"
          } >> "${GITHUB_ENV}"
          tsh --proxy "${FORGE_TELEPORT_PROXY}" --identity "${TBOT_DIR}/identity" status

      # site-inputs pulls the controller and capi-provisioned images, both
      # private. The same credential is handed to the suite below, which is
      # what the *node* pulls CAPNICo with, through the ghcr-imagepull Secret
      # the deploy path renders.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # nkectl for the node's architecture, the three image archives, and the
      # deploy path out of the checkout. The node has no access to this
      # repository, so everything it runs has to be built here and staged.
      # SITE_CONTROLLER_BUILD comes from the resolve step and decides whether
      # the CWE archive is built here or pulled.
      - name: Build the site inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C controller/test/e2e site-inputs \
            SITE_CONTROLLER_VERSION="${SITE_CONTROLLER_VERSION}" \
            SITE_CONTROLLER_BUILD="${SITE_CONTROLLER_BUILD}" \
            SITE_INPUTS="${SITE_INPUTS}"

      # Identifiers and paths only. Every secret is read from the environment
      # by the suite itself and never reaches this file -- see the const block
      # at the top of site_controller_test.go.
      - name: Write the e2e config
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${FORGE_JUMP_HOST}" || {
            echo "::error::the FORGE_JUMP_HOST repository variable is unset; the suite has no way to reach the node"
            exit 1
          }
          cat > controller/test/e2e/e2e-config.yaml <<EOF
          # Generated by .github/workflows/forge-site-controller-e2e.yml.
          site:
            jumpHost: "${FORGE_JUMP_HOST}"
            # root because that is the only login rg-k8aas-bot-ssh-root
            # grants, and the probe confirmed the certificate carries it.
            # No jumpHostUser or jumpHostKeyFingerprint: Teleport takes the
            # login from the identity and the host key from the cluster CA.
            teleportLogin: "root"
            images:
              - ${SITE_INPUTS}/controller.tar
              - ${SITE_INPUTS}/capi-provisioned.tar
              - ${SITE_INPUTS}/profiles.tar
            bootstrapEnv:
              NKECTL_CWE_IMAGE: ghcr.io/dsx-ai-factory/nke/nke-controller:${SITE_CONTROLLER_VERSION}
              NKECTL_CAPI_PROVISIONED_IMAGE: ghcr.io/dsx-ai-factory/nke/cluster-api-provider-provisioned:v0.1.0-rc.1
            profilesImage: nke-e2e-profiles:local
          EOF
          echo "--- e2e-config.yaml ---"
          cat controller/test/e2e/e2e-config.yaml

      # Three nested timeouts, shortest first, because only the shortest one
      # tears the node down:
      #
      #   -ginkgo.timeout 150m  fails the suite and runs its cleanup, which
      #                         is what releases the Forge instance.
      #   -timeout        165m  go's own backstop. It panics rather than
      #                         unwinding, so deferred teardown does NOT run
      #                         and the instance leaks -- reaching this means
      #                         Ginkgo itself is wedged.
      #   timeout-minutes 180   the runner is killed. Same leak, no log.
      #
      # There is no fourth clock. The bot certificate expires in an hour, but
      # tbot rewrites it every twenty minutes for as long as the job runs --
      # see the daemon step. Before that it was a real limit on `full`.
      #
      # environments/forge.yaml declares one site (az61), so the suite
      # resolves it without being told which.
      - name: Run the site controller lane
        shell: bash
        working-directory: controller/test/e2e
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          # The suite names the variables, not the credential: locally these
          # are a person's PAT, here they are the job's own token. It lives
          # only as long as the job, so nothing outlives the run it pulled
          # for.
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # JUMP_HOST_PASSWORD is deliberately absent: its presence is what
          # switches the suite off the Teleport relay and onto plain SSH.
        run: |
          set -Eeuo pipefail
          keep=()
          if [ "${KEEP_SITE}" = "true" ]; then
            keep=(-e2e.keep-site)
            echo "::warning::-e2e.keep-site is set; the Forge instance survives this run and must be deleted by hand"
          fi
          go test -timeout 165m . -args \
            -ginkgo.label-filter=site-controller \
            -ginkgo.timeout=150m \
            -ginkgo.v \
            -e2e.config=e2e-config.yaml \
            -e2e.environment=forge \
            -e2e.site-stage="${SITE_STAGE}" \
            -e2e.versions="controller=${SITE_CONTROLLER_VERSION},os-image-bootloader=${OS_IMAGE_BOOTLOADER},os-image=${OS_IMAGE}" \
            "${keep[@]}" 2>&1 | tee site-e2e.log

      # The Ginkgo log, which is the whole diagnostic record: the suite writes
      # its forwarded kubeconfig to a temp directory and nothing else to disk,
      # so every phase boundary, remote command and failure lives in stdout.
      # An hour-long run is worth more than a scroll-back in the job view, and
      # a green one is the reference for diagnosing the next red one.
      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-site-${{ env.SITE_STAGE }}-${{ github.run_id }}
          path: |
            controller/test/e2e/site-e2e.log
            ${{ runner.temp }}/tbot.log
          if-no-files-found: warn
          retention-days: 7

      # Before removing the identity, because a dead daemon would write it
      # straight back. A relay failure late in a long run is a tbot question
      # first, which is why its log is an artifact above.
      - name: Stop the Teleport identity daemon
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -f "${RUNNER_TEMP}/tbot.pid" ] || exit 0
          kill "$(cat "${RUNNER_TEMP}/tbot.pid")" 2>/dev/null || true

      # The runner is ephemeral, so this is belt and braces -- but a live
      # identity sitting where a later step could read it is not worth the
      # saving.
      - name: Remove the Teleport identity
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/tbot"
