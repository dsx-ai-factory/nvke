name: Qualify perf

# Runs the perf scope of Qualify e2e on every vX.Y.Z-rc.N tag while NVKE_RC_PERF is true.
# A workflow of its own because RC promotion starts on runs named Qualify e2e.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions: {}

jobs:
  perf:
    if: github.repository_id == '1323115536' && vars.NVKE_RC_PERF == 'true'
    uses: ./.github/workflows/qualify-e2e.yml
    with:
      scope: perf
    secrets: inherit
    # Grants the union of what the called jobs ask for.
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write
