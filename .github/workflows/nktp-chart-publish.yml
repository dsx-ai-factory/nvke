#
# Releases the NKTP Helm chart on an nktp/vX.Y.Z tag: pushes it to
# oci://ghcr.io/dsx-ai-factory/nvke/charts/nktp and cuts the GitHub Release.
# release.yml skips nktp/ tags, because nktp/ is not a Go module.
#
# The chart version is the tag's, as for the controller chart: Chart.yaml
# carries a 0.0.0 placeholder and `helm package --version` sets the real one.

name: NKTP Chart Publish

on:
  push:
    tags:
      - 'nktp/v*'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: NKTP Chart Publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART: nktp/deploy/charts/nktp

jobs:
  publish:
    name: Publish chart
    if: >-
      github.repository_id == '1323115536' &&
      startsWith(github.ref, 'refs/tags/nktp/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read  # upload-sarif reads the workflow run
      security-events: write  # the malware scan uploads SARIF
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: |
          echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Set up kubeconform
        uses: ./.github/actions/setup-kubeconform

      # The same format rule release.yml enforces on every other tag.
      - name: Take the version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#nktp/v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is neither nktp/vX.Y.Z nor nktp/vX.Y.Z-rc.N. Delete it and push a corrected tag."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check the chart
        run: make nktp-chart-check

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package "${CHART}" --version "${VERSION}" --destination dist

      - name: Malware scan the release artifacts
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'dist'
          category: 'clamav-nktp-release'
          output_file: 'clamav-nktp-release.sarif'

      # A GHCR tag is mutable and `helm package` is not byte-reproducible, so a
      # rerun would replace the published chart with different bytes than the
      # release attests. As image-nvcr.yml does for images: reuse a published
      # version whose contents match, fail on one that does not.
      # NVKE_GITHUB_PUBLISH names the components whose releases go to GitHub;
      # see docs/artifact-publication.md. Unset means every component but os-image.
      - name: Push to GHCR
        if: contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), ',nktp,')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ref=oci://ghcr.io/dsx-ai-factory/nvke/charts/nktp
          archive="dist/nktp-${VERSION}.tgz"
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
          mkdir -p published
          if helm pull "${ref}" --version "${VERSION}" --destination published 2>pull.err; then
            mkdir -p ours theirs
            tar -xzf "${archive}" -C ours
            tar -xzf "published/nktp-${VERSION}.tgz" -C theirs
            if ! diff -r ours theirs; then
              echo "::error::${ref}:${VERSION} is already published with different contents."
              exit 1
            fi
            echo "${ref}:${VERSION} is already published with the same contents; reusing it."
            cp "published/nktp-${VERSION}.tgz" "${archive}"
          elif grep -q 'not found' pull.err; then
            helm push "${archive}" oci://ghcr.io/dsx-ai-factory/nvke/charts
          else
            cat pull.err >&2
            exit 1
          fi
          ( cd dist && sha256sum -- "nktp-${VERSION}.tgz" > checksums.txt )
          cat dist/checksums.txt

      # helm keeps its own registry config rather than writing docker's, so
      # the login in the step above is invisible to crane. record-digest
      # needs a credential it can see; same token, in the usual place.
      - name: Log in to GHCR for crane
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # checksums.txt hashes the local .tgz, which is a different claim from
      # the digest GHCR serves -- and the reuse branch above can publish
      # nothing at all, leaving a checksum of a file that was never pushed.
      # This records what is actually addressable, on both branches.
      - name: Record the published digest
        if: contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), ',nktp,')
        uses: ./.github/actions/record-digest
        with:
          references: ghcr.io/dsx-ai-factory/nvke/charts/nktp:${{ steps.version.outputs.version }}
          component: nktp-chart

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nktp-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 1

  # A separate job so no job holds both packages:write and contents:write.
  release:
    name: Cut the GitHub Release
    needs: publish
    if: contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), ',nktp,')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # creates the GitHub release
      id-token: write         # the OIDC token the attestation is signed against
      attestations: write     # writes the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nktp-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      # The helm push stores the chart archive as-is, so checksums.txt also
      # names the digest of what GHCR serves.
      - name: Attest the release checksums
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" dist/checksums.txt.sigstore.json

      # A draft, so the assets upload before publishing seals the release.
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: nktp ${{ needs.publish.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: false
          generate_release_notes: false
          body: |
            The NKTP Helm chart, version ${{ needs.publish.outputs.version }}.

            ```
            kubectl create namespace nktp
            kubectl label namespace nktp pod-security.kubernetes.io/enforce=privileged
            helm install nktp oci://ghcr.io/dsx-ai-factory/nvke/charts/nktp \
              --version ${{ needs.publish.outputs.version }} --namespace nktp
            ```

            `checksums.txt.sigstore.json` is the build-provenance attestation
            over `checksums.txt`; see [RELEASE.md](RELEASE.md).
          files: |
            dist/nktp-${{ needs.publish.outputs.version }}.tgz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          fail_on_unmatched_files: true

      - name: Verify the release assets
        uses: ./.github/actions/verify-release-assets
        with:
          release-id: ${{ steps.release.outputs.id }}
          checksums: dist/checksums.txt
          expected-count: "3"
          github-token: ${{ github.token }}

      - name: Publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: rel } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });
            if (rel.draft) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, draft: false, make_latest: 'false',
              });
            }
            core.info(`Published ${context.ref.replace('refs/tags/', '')} with ${rel.assets.length} assets.`);
