#
# Releases the NKTP Helm chart on an nktp/vX.Y.Z tag: pushes it to
# oci://ghcr.io/dsx-ai-factory/nke/charts/nktp and cuts the GitHub Release.
# release.yml skips nktp/ tags, because nktp/ is not a Go module.
#
# The version is authored in Chart.yaml, and the tag has to equal it.

name: NKTP Chart Publish

on:
  push:
    tags:
      - 'nktp/v*'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: NKTP Chart Publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART: nktp/deploy/charts/nktp

jobs:
  publish:
    name: Publish chart
    if: >-
      github.repository == 'dsx-ai-factory/nke' &&
      startsWith(github.ref, 'refs/tags/nktp/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write  # the malware scan uploads SARIF
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: |
          echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Set up kubeconform
        uses: ./.github/actions/setup-kubeconform

      # The same rule release.yml enforces on every other tag.
      - name: Check the tag against Chart.yaml
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#nktp/v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is neither nktp/vX.Y.Z nor nktp/vX.Y.Z-rc.N. Delete it and push a corrected tag."
            exit 1
          fi
          chart_version="$(yq '.version' "${CHART}/Chart.yaml")"
          if [[ "${version}" != "${chart_version}" ]]; then
            echo "::error::${GITHUB_REF_NAME} does not match version ${chart_version} in ${CHART}/Chart.yaml."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check the chart
        run: make nktp-chart-check

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package "${CHART}" --destination dist
          ( cd dist && sha256sum -- "nktp-${VERSION}.tgz" > checksums.txt )
          cat dist/checksums.txt

      - name: Malware scan the release artifacts
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'dist'
          category: 'clamav-nktp-release'
          output_file: 'clamav-nktp-release.sarif'

      - name: Push to GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
          helm push "dist/nktp-${VERSION}.tgz" oci://ghcr.io/dsx-ai-factory/nke/charts
          # Read back what the registry now serves.
          helm show chart oci://ghcr.io/dsx-ai-factory/nke/charts/nktp --version "${VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nktp-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 1

  # A separate job so no job holds both packages:write and contents:write.
  release:
    name: Cut the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # creates the GitHub release
      id-token: write         # the OIDC token the attestation is signed against
      attestations: write     # writes the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nktp-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      # The helm push stores the chart archive as-is, so checksums.txt also
      # names the digest of what GHCR serves.
      - name: Attest the release checksums
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" dist/checksums.txt.sigstore.json

      # A draft, so the assets upload before publishing seals the release.
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: nktp ${{ needs.publish.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: false
          generate_release_notes: false
          body: |
            The NKTP Helm chart, version ${{ needs.publish.outputs.version }}.

            ```
            helm install nktp oci://ghcr.io/dsx-ai-factory/nke/charts/nktp \
              --version ${{ needs.publish.outputs.version }} \
              --namespace nktp --create-namespace
            ```

            `checksums.txt.sigstore.json` is the build-provenance attestation
            over `checksums.txt`; see [RELEASE.md](RELEASE.md).
          files: |
            dist/nktp-${{ needs.publish.outputs.version }}.tgz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          fail_on_unmatched_files: true

      - name: Verify the release assets
        uses: ./.github/actions/verify-release-assets
        with:
          release-id: ${{ steps.release.outputs.id }}
          checksums: dist/checksums.txt
          expected-count: "3"
          github-token: ${{ github.token }}

      - name: Publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: rel } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });
            if (rel.draft) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, draft: false, make_latest: 'false',
              });
            }
            core.info(`Published ${context.ref.replace('refs/tags/', '')} with ${rel.assets.length} assets.`);
