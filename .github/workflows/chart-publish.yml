name: Chart Publish

# Packages the controller Helm chart and publishes it under
# ghcr.io/dsx-ai-factory/nvke/charts as an OCI artifact:
#
#   ghcr.io/dsx-ai-factory/nvke/charts/nvke-controller:0.1.0        <- release tag
#   ghcr.io/dsx-ai-factory/nvke/charts/nvke-controller:0.1.0-rc.1   <- release candidate
#
# The last path segment is the chart's `name:`, not anything set here.
# Through controller/v0.1.1-rc.1 the chart was named cloud-workflow-engine,
# and from there through the last release before this rename it was named
# controller; both stay published at their old paths, so anything reaching
# for an older version wants the old path.
#
# Release tags only. The NVCR mirror in chart-publish-nvcr.yml is the one that
# also runs on main.
#
# `charts/` is a reserved path segment: everything else directly under
# ghcr.io/dsx-ai-factory/nvke is a payload you pull by name -- the controller image, the
# agent binaries. Without that split a chart and an image end up in one OCI
# repository, told apart only by whether the tag carries a "v".
#
# Chart version: git describe output with the "controller/" prefix and leading
# "v" stripped (OCI chart tags carry no "v" prefix by convention).
# AppVersion: the same string with the leading "v" kept, which the deployment
# template uses as the default image tag.
#
# The nvcr.io mirror lives in chart-publish-nvcr.yml; this workflow uses only
# the GITHUB_TOKEN and needs no secrets or environments.

# Release tags only, unlike the NVCR mirror which also runs on main.
#
# The chart names the GHCR controller image, and image-nvcr.yml promotes to
# GHCR only for release tags -- NVCR gets every main commit, GHCR does not. A
# chart built from main would therefore carry an appVersion like
# v0.1.0-4-gabcdef and point at ghcr.io/dsx-ai-factory/nvke/nke-controller:v0.1.0-4-gabcdef,
# which does not exist. Publishing only what the image side publishes keeps the
# two in step.
on:
  push:
    tags:
      - "controller/v[0-9]+.[0-9]+.[0-9]+"
      - "controller/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Chart Publish-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

env:
  CHART: controller/deploy/charts/controller

jobs:
  publish:
    name: Publish chart
    runs-on: ubuntu-latest
    # The ref check is not redundant with the `on:` filter above: it also covers
    # workflow_dispatch, which accepts any ref. Dispatched from main this job
    # would package something like 0.1.1-rc.0-2-g068156e and point it at
    # ghcr.io/dsx-ai-factory/nvke/nke-controller:v0.1.1-rc.0-2-g068156e, a tag promotion never
    # creates -- a chart naming an image that does not exist.
    # NVKE_GITHUB_PUBLISH names the components whose releases go to GitHub;
    # see docs/artifact-publication.md. Unset means every component but os-image.
    if: >-
      github.repository_id == '1323115536' &&
      startsWith(github.ref, 'refs/tags/controller/v') &&
      contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), ',controller,')
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Strip "controller/" prefix; keep "v" for appVersion, drop it for
          # the chart version (OCI chart tags are plain semver without v).
          describe="$(git describe --match 'controller/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          describe="${describe#controller/}"   # → v0.1.0 or v0.1.0-4-gabcdef
          version="${describe#v}"              # → 0.1.0 or 0.1.0-4-gabcdef
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${describe}" >> "${GITHUB_OUTPUT}"
          echo "Chart version: ${version}  appVersion: ${describe}"

      # values.yaml already defaults to this image, so the rewrite is normally a
      # no-op. It is here so the packaged chart cannot silently inherit a
      # different default if someone edits values.yaml, and so this job states
      # which registry it publishes for rather than relying on a file it does
      # not own.
      - name: Point the chart at the GHCR image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/dsx-ai-factory/nvke/nke-controller"

          # Anchored at exactly two spaces so this hits image.repository and
          # NOT profiles.image.repository, which is nested one level deeper and
          # names an image nke-site-deploy builds.
          sed -i -e "s#^  repository: .*#  repository: ${image}#" \
            "${CHART}/values.yaml"

          grep -q "^  repository: ${image}\$" "${CHART}/values.yaml" \
            || { echo "::error::image rewrite did not apply"; exit 1; }
          grep -q "^    repository: nvcr.io/.*/cwe-profiles\$" "${CHART}/values.yaml" \
            || { echo "::error::profiles image was rewritten and should not be"; exit 1; }

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          helm package "${CHART}" \
            --version "${VERSION}" \
            --app-version "${APP_VERSION}" \
            --destination "${RUNNER_TEMP}/chart-dist"
          ls -lh "${RUNNER_TEMP}/chart-dist"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # helm keeps its own registry config rather than writing docker's, so
      # the login above is invisible to crane. record-digest below needs a
      # credential it can see; this is the same token, in the place every
      # other tool looks for it.
      - name: Log in to GHCR for crane
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          helm push \
            "${RUNNER_TEMP}/chart-dist/nvke-controller-${VERSION}.tgz" \
            oci://ghcr.io/dsx-ai-factory/nvke/charts
          echo "Pushed ghcr.io/dsx-ai-factory/nvke/charts/nvke-controller:${VERSION}"

      # The chart names the image by version, and the release layer has to
      # pin both by digest. Until this ran, nothing in CI recorded what GHCR
      # actually serves for this tag -- helm push reports success and no
      # identity at all.
      - name: Record the published digest
        uses: ./.github/actions/record-digest
        with:
          references: ghcr.io/dsx-ai-factory/nvke/charts/nvke-controller:${{ steps.meta.outputs.version }}
          component: nke-controller-chart
