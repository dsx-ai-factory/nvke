name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - '*/v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  license-checks:
    name: License checks (gate)
    uses: ./.github/workflows/license.yml

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          # Strip a leading "v". CHANGELOG.md headings carry no prefix, which is
          # the Keep a Changelog convention and what git-cliff emits, so reading
          # the raw ref name would look for "## [v0.2.0]" and match nothing.
          # This does not fail — the fallback below fires — so the release would
          # ship a one-line body instead. cluster-api-provider-nico and
          # cluster-api-addon-provider-syscmp already strip it.
          TAG="${GITHUB_REF_NAME#v}"
          # Extract the section between this version header and the next one
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          # Write to a file to avoid quoting issues
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: false

  publish:
    name: Publish
    needs: [license-checks]
    if: ${{ contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TODO: add component-specific publish steps (NKX-14116)
      - run: echo "Publish placeholder — implement per component as part of NKX-14116"
