name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - '*/v[0-9]*'
  workflow_dispatch:

# Least privilege by default. Only the release job needs contents: write, and
# it is granted there; license-checks and publish read only.
permissions: {}

# Keyed on the ref, so two different tags never share a group and run
# concurrently. This only binds when the same tag is re-pushed or a run is
# re-run, and there it does not cancel: a half-finished release run can leave a
# tag with a partial release.
concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Release-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  license-checks:
    name: License checks (gate)
    uses: ./.github/workflows/license.yml
    permissions:
      contents: read

  # Skipped for tags that a dedicated workflow releases: agent/ (agent-deb-publish.yml),
  # os-image/ (os-image-artifact.yml), nktp/ (nktp-chart-publish.yml; not a Go
  # module, so the go.work check below would reject it), and
  # cluster-api-provider-provisioned/ (image-provisioned-nvcr.yml's promote-ghcr
  # job -- an image push, with no release-worthy asset of its own yet). Those jobs build the real artifacts,
  # create the release, and publish it only after verification. This job would
  # otherwise cut a notes-only release first, and CHANGELOG.md has no section a
  # component tag can match.
  release:
    name: Create GitHub release
    outputs:
      # The three cli publishers below consume these, so a cli/v* tag produces
      # one build rather than four.
      component_dir: ${{ steps.component.outputs.dir }}
      dist_artifact: cli-dist-${{ github.run_id }}-${{ github.run_attempt }}
      beta: ${{ steps.component.outputs.beta }}
    if: ${{ !startsWith(github.ref_name, 'agent/') && !startsWith(github.ref_name, 'os-image/') && !startsWith(github.ref_name, 'nktp/') && !startsWith(github.ref_name, 'cluster-api-provider-provisioned/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [license-checks]
    permissions:
      contents: write         # creates the GitHub release
      actions: read  # upload-sarif reads the workflow run
      security-events: write  # the malware scan uploads SARIF
      id-token: write         # the OIDC token the attestation is signed against
      attestations: write     # writes the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag is <module-directory>/vX.Y.Z, because that is what Go requires of a
      # submodule: github.com/dsx-ai-factory/nvke/cli is tagged cli/vX.Y.Z. So the
      # directory is read back off the tag and nothing below needs to name a
      # component. Move a module and its tag prefix moves with it, because Go
      # makes them the same string; go.work then says whether the directory is
      # real. A bare vX.Y.Z is the whole repository.
      - name: Resolve the component from the tag
        id: component
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ "${TAG}" == */* ]]; then
            DIR="${TAG%/v*}"
            VERSION="v${TAG##*/v}"
            if ! go work edit -json | jq -e --arg d "./${DIR}" \
                 '.Use[]|select(.DiskPath==$d)' >/dev/null; then
              echo "::error::${TAG} names '${DIR}', which is not a module in go.work."
              echo "go.work lists:"; go work edit -json | jq -r '.Use[].DiskPath'
              exit 1
            fi
          else
            DIR=""
            VERSION="${TAG}"
          fi

          # The two forms the root tags are already held to at the top of this
          # file. The component pattern there cannot be that strict, because a
          # glob cannot spell "vX.Y.Z", so the rule is enforced here instead.
          # It fails rather than skips: a tighter glob would let a malformed tag
          # push do nothing at all, and silence reads as success.
          # A bare vX.Y.Z-beta.N is not a release: it only triggers a build of the
          # CLI, with no GitHub release. nvkectl is versioned like any other build of
          # that commit, by the cli/v* describe, not by the beta tag name.
          BETA=false
          if [[ -z "${DIR}" && "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            BETA=true
            VERSION="$(git describe --match 'cli/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
            VERSION="${VERSION#cli/}"
          elif [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::${TAG} carries version '${VERSION}', which is neither vX.Y.Z nor vX.Y.Z-rc.N."
            echo "A release candidate needs the dot: v0.1.0-rc.0, not v0.1.0-rc0."
            echo "Delete the tag, then push a corrected one."
            exit 1
          fi

          {
            echo "beta=${BETA}"
            echo "dir=${DIR}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"
          echo "Releasing ${TAG}: module='${DIR:-<repository>}' version=${VERSION}"

      # NVKE_GITHUB_PUBLISH names the components whose releases go to GitHub;
      # see docs/artifact-publication.md. Unset means every component but os-image.
      - name: Decide whether GitHub gets this release
        id: policy
        shell: bash
        env:
          COMPONENT: ${{ steps.component.outputs.dir || 'root' }}
          PUBLISH: ${{ vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp' }}
          # The same contains() every other publisher uses, so case and
          # spacing behave the same everywhere.
          GITHUB_PUBLISH: ${{ contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), format(',{0},', steps.component.outputs.dir || 'root')) }}
        run: |
          set -euo pipefail
          echo "github=${GITHUB_PUBLISH}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_PUBLISH}" == "true" ]]; then
            echo "GitHub publishing for '${COMPONENT}' is on (NVKE_GITHUB_PUBLISH='${PUBLISH}')"
          else
            echo "::notice::GitHub publishing for '${COMPONENT}' is off (NVKE_GITHUB_PUBLISH='${PUBLISH}'): no GitHub Release for ${GITHUB_REF_NAME}"
          fi

      # go.work, not cli/go.mod, like every other workflow here. setup-go pins
      # GOTOOLCHAIN=local, so the toolchain must satisfy the workspace, which
      # asks for the highest of its members. go.work went to 1.26.6 while
      # cli/go.mod stayed on 1.26.5, and build-cross failed on every cli/v* tag.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read the pinned syft version
        id: versions
        shell: bash
        run: echo "syft_version=$(make --no-print-directory print-SYFT_VERSION)" >> "${GITHUB_OUTPUT}"

      # Installed before the artifacts are built, because the SBOMs are written
      # inside that step: checksums.txt is computed at the end of it, and a
      # document produced afterwards would not be covered by it or by the
      # attestation over it.
      - name: Set up syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ steps.versions.outputs.syft_version }}

      # What each component ships differs, so it is declared rather than guessed.
      # A component with no artifacts still gets a release: the tag and its notes
      # are the point and the files are a bonus.
      - name: Build release artifacts
        id: artifacts
        shell: bash
        env:
          DIR: ${{ steps.component.outputs.dir }}
          BETA: ${{ steps.component.outputs.beta }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ "${BETA}" == true ]]; then
            DIR=cli
          fi

          case "${DIR}" in
            cli)
              make -C cli build-cross DIST="${GITHUB_WORKSPACE}/dist"
              # Shipped beside the binaries because nvkectl is redistributed --
              # which is the reason it carries its own attribution at all.
              cp cli/THIRD_PARTY_NOTICES.md dist/
              ;;
            controller)
              # The controller ships as an image, so a release carries no
              # binary. It does carry the attribution for what is inside that
              # image, which is otherwise only readable by pulling it.
              cp controller/THIRD_PARTY_NOTICES.md dist/
              ;;
            *)
              echo "No artifacts defined for '${DIR:-<repository>}'; releasing notes only."
              ;;
          esac

          # One SPDX document per binary, scanned from the built file rather
          # than from this source tree: syft reads the Go build info the
          # linker embedded, so the document lists the module versions that
          # are actually in the bytes being shipped. A source-tree scan would
          # describe go.mod instead, which is a different claim -- it says what
          # a build should select, not what this one did.
          #
          # Per binary, not one for all four: a consumer downloads one platform
          # and needs the answer for that platform. The four differ, because
          # the dependency graph is GOOS/GOARCH-conditional.
          shopt -s nullglob
          # Both names for one release; build-cross makes the nkectl-* copies.
          for bin in dist/nvkectl-* dist/nkectl-*; do
            case "${bin}" in *.spdx.json) continue ;; esac
            syft scan "file:${bin}" \
              --output "spdx-json=${bin}.spdx.json" \
              --source-name "$(basename "${bin}")"
          done
          shopt -u nullglob

          if find dist -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            ( cd dist && sha256sum -- * > checksums.txt )
            echo "artifacts:"
            find dist -mindepth 1 -maxdepth 1 -printf '  %f\n' | sort
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
            # Counted here so the publish step can assert that everything built
            # actually reached the release, rather than trusting the upload.
            echo "count=$(find dist -mindepth 1 -maxdepth 1 | wc -l)" >> "${GITHUB_OUTPUT}"
          else
            rmdir dist
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
            echo "count=0" >> "${GITHUB_OUTPUT}"
          fi

      # Uploaded so the three cli publishers consume these exact bytes rather
      # than each running build-cross again. checksums.txt beside them then
      # describes what every channel ships, not one of four builds.
      - name: Upload the built binaries for the publishers
        if: steps.component.outputs.dir == 'cli' || steps.component.outputs.beta == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 1

      # build-cross stamps the version from `git describe`, this job takes it
      # from the tag, and nothing tied the two together. The runner is
      # linux/amd64, so the shipped binary can be asked directly.
      - name: Check nvkectl reports the tag version
        if: steps.component.outputs.dir == 'cli' || steps.component.outputs.beta == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.component.outputs.version }}
        run: |
          set -euo pipefail
          BIN="${GITHUB_WORKSPACE}/dist/nvkectl-linux-amd64"

          # 2>&1 and the exit check, so a binary that dies on start fails here
          # rather than printing nothing and matching whatever comes last.
          if ! out="$("${BIN}" version 2>&1)"; then
            echo "::error::${BIN} version exited non-zero: ${out}"
            exit 1
          fi

          # The trailing space is load-bearing: it stops a v0.1.0 tag accepting
          # a v0.1.0-rc.1 binary, or a describe with commits after the tag.
          case "${out}" in
            "nvkectl ${VERSION} "*) echo "nvkectl reports ${VERSION}: ${out}" ;;
            *)
              echo "::error::This release is tagged ${VERSION}, and the binary reports: ${out}"
              exit 1
              ;;
          esac

      # Scans what is about to be published, after checksums are computed and
      # before anything leaves the runner. Scanning earlier would miss
      # checksums.txt; scanning after the upload would mean withdrawing a
      # release rather than never cutting one.
      #
      # Skipped when the component built nothing, because clamscan fails on a
      # path that does not exist and a controller tag legitimately produces no
      # dist/ until the notices step runs.
      - name: Malware scan the release artifacts
        if: steps.artifacts.outputs.has_files == 'true'
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'dist'
          category: 'clamav-release'
          output_file: 'clamav-release.sarif'

      # Provenance over checksums.txt, not over each artifact: that file
      # already names every asset by SHA-256, so one attestation covers all of
      # them and a consumer runs one verify rather than one per download. It
      # also covers the assets a release does not attach -- os-image's four
      # qcow2s ship as OCI artifacts because they are too large, and
      # checksums.txt names them too.
      #
      # This is provenance, not just a signature: the attestation records the
      # workflow, the ref and the commit that produced the bytes. See
      # RELEASE.md, "Verifying a release".
      - name: Attest the release checksums
        id: attest
        if: steps.artifacts.outputs.has_files == 'true' && steps.component.outputs.beta != 'true' && steps.policy.outputs.github == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      # Attached as a release asset as well as stored by GitHub, so a consumer
      # can verify offline with `gh attestation verify --bundle` and never call
      # the API. Added after the count above, which verify-release-assets
      # treats as a minimum -- an extra asset is fine, a missing one is not.
      - name: Attach the attestation bundle
        if: steps.artifacts.outputs.has_files == 'true' && steps.component.outputs.beta != 'true' && steps.policy.outputs.github == 'true'
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE}" dist/checksums.txt.sigstore.json

      - name: Extract changelog section for this tag
        id: changelog
        if: steps.component.outputs.beta != 'true'
        shell: bash
        env:
          # The resolved version, not the raw ref. CHANGELOG.md headings carry
          # neither the "v" nor the module prefix, so `cli/v0.1.0` read raw
          # would look for "## [cli/v0.1.0]" and match
          # nothing. That does not fail -- the fallback fires -- so the release
          # would quietly ship a one-line body.
          VERSION: ${{ steps.component.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${VERSION#v}"
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          # Written to a file to avoid quoting issues
          echo "$NOTES" > /tmp/release-notes.md

      # The release is created as a draft so the assets upload before it is
      # published. If a repository has release immutability turned on, GitHub
      # seals the release when it is published and rejects any asset uploaded
      # after that.
      #
      # The action does not publish a draft, so the step below publishes it.
      # Do not remove that step.
      - name: Create GitHub release
        id: release
        if: steps.component.outputs.beta != 'true' && steps.policy.outputs.github == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # A bare tag releases the product, so its title says so; a module
          # tag keeps the tag as its title, as the module workflows do.
          name: ${{ steps.component.outputs.dir == '' && format('NVKE {0}', steps.component.outputs.version) || github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: false
          # Empty when the component ships nothing, which the action accepts.
          files: ${{ steps.artifacts.outputs.has_files == 'true' && 'dist/*' || '' }}

      # The assets are checked before the release is published, because
      # publishing it is what seals it.
      #
      # This step uses github-script rather than the gh command line tool, to
      # match the three sibling repositories, whose release jobs run on a
      # self-hosted runner where gh may not be installed.
      - name: Verify the release assets
        if: steps.artifacts.outputs.has_files == 'true' && steps.component.outputs.beta != 'true' && steps.policy.outputs.github == 'true'
        uses: ./.github/actions/verify-release-assets
        with:
          release-id: ${{ steps.release.outputs.id }}
          checksums: dist/checksums.txt
          expected-count: ${{ steps.artifacts.outputs.count }}
          github-token: ${{ github.token }}

      # Only after the step above, which fails the job and leaves the draft
      # in place rather than publishing something it could not verify.
      - name: Publish the release
        if: steps.component.outputs.beta != 'true' && steps.policy.outputs.github == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: rel } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });
            if (rel.draft) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, draft: false,
              });
            }
            core.info(`Published ${context.ref.replace('refs/tags/', '')} with ${rel.assets.length} assets.`);

  # A bare vX.Y.Z-beta.N reaches only cli-nvcr and cli-s3, which publish it
  # under the cli/v* describe version; cli-ghcr and the GitHub release are skipped.
  #
  # The three cli channels. They used to trigger on the cli/v* tag themselves,
  # which meant four independent build-cross runs claiming to be one release,
  # and three publish paths that never waited for license-checks. Calling them
  # here fixes both: one build, and everything behind the gate.
  cli-ghcr:
    needs: [release]
    if: ${{ needs.release.outputs.component_dir == 'cli' }}
    uses: ./.github/workflows/cli-artifact.yml
    permissions:
      contents: read
      packages: write
      actions: read  # upload-sarif reads the workflow run
      security-events: write
    with:
      dist_artifact: ${{ needs.release.outputs.dist_artifact }}

  cli-nvcr:
    needs: [release]
    if: ${{ needs.release.outputs.component_dir == 'cli' || needs.release.outputs.beta == 'true' }}
    uses: ./.github/workflows/cli-artifact-nvcr.yml
    permissions:
      contents: read
      actions: read  # upload-sarif reads the workflow run
      security-events: write
    secrets:
      NGC_REGISTRY_TOKEN_NVKE: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      NGC_REGISTRY_TOKEN_DSX: ${{ secrets.NGC_REGISTRY_TOKEN_DSX }}
    with:
      dist_artifact: ${{ needs.release.outputs.dist_artifact }}

  cli-s3:
    needs: [release]
    if: ${{ needs.release.outputs.component_dir == 'cli' || needs.release.outputs.beta == 'true' }}
    uses: ./.github/workflows/cli-s3-publish.yml
    permissions:
      contents: read
      id-token: write
      actions: read  # upload-sarif reads the workflow run
      security-events: write
    with:
      dist_artifact: ${{ needs.release.outputs.dist_artifact }}

  # Still a placeholder, but no longer the only thing a prefixed tag reaches:
  # the release job above now handles every tag, so this is for publishing that
  # is not a GitHub release asset -- registries, apt, and so on.
  publish:
    name: Publish
    needs: [license-checks]
    if: ${{ contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Component publish lives in dedicated workflows so each component can
      # own its runners, secrets and artifact shape. agent/v* .debs go through
      # agent-deb-publish.yml (S3 apt intake + GitHub Release assets); binaries
      # through agent-artifact.yml / agent-artifact-nvcr.yml. os-image/v* qcow2
      # through os-image-artifact.yml (Packer + boot-smoke, then GHCR). This job
      # only records which path fired so a component tag never looks like a
      # no-op release.
      - name: Route component publish
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            agent/v*)
              echo "Agent tag ${GITHUB_REF_NAME}:"
              echo "  - .debs  → Agent Deb Publish (apt-intake S3 + GitHub Release assets)"
              echo "  - binary → Agent Artifact / Agent Artifact NVCR"
              ;;

            os-image/v*)
              echo "OS-image tag ${GITHUB_REF_NAME}:"
              echo "  - qcow2  → OS Image Artifact (Packer + boot-smoke, then NVCR and S3; GHCR version tags only when NVKE_GITHUB_PUBLISH names os-image)"
              echo "  - check  → nvke-os-image-check on S3 and, when NVKE_GITHUB_PUBLISH names os-image, on the GitHub Release"
              ;;

            nktp/v*)
              echo "NKTP tag ${GITHUB_REF_NAME}:"
              echo "  - chart → NKTP Chart Publish"
              ;;

            cluster-api-provider-provisioned/v*)
              echo "Provisioned-provider tag ${GITHUB_REF_NAME}:"
              echo "  - image → Image Provisioned NVCR (promote-ghcr → ghcr.io/dsx-ai-factory/nvke/cluster-api-provider-provisioned)"
              ;;

            cli/v*)
              echo "CLI tag ${GITHUB_REF_NAME}:"
              echo "  - binaries → CLI Artifact GHCR / CLI Artifact NVCR / CLI S3 Publish"
              ;;

            controller/v*)
              echo "Controller tag ${GITHUB_REF_NAME}:"
              echo "  - image → Image NVCR (nvcr.io source, promoted to ghcr.io/dsx-ai-factory/nvke/nvke-controller and DSX NVCR)"
              echo "  - chart → Chart Publish / Chart Publish NVCR"
              ;;

            *)
              echo "::warning::No component publish workflow for '${GITHUB_REF_NAME}' yet."
              ;;
          esac
