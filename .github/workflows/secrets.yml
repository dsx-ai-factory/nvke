# Scans the commits a branch adds, and fails if any of them carries a
# credential.
#
# Scope is the branch, not the whole history. The two bulk import commits
# already carry 79 gitleaks matches — mostly test fixtures, an empty
# SUDO_PASSWORD="" and container digests — so a full-history scan would be red
# from the day it landed, and a check that is always red is ignored within a
# week. Those 79 still need a human verdict, in particular the Teleport join
# tokens under controller/profiles/osProfiles/. That is tracked separately,
# because any real one there means rewriting history in a repository that
# mirrors GitLab, not opening a pull request.
#
# --diff-merges=first-parent is load-bearing, not decoration. `git log -p`
# prints no diff at all for a merge commit, so without it every merge in the
# range is skipped in silence — including the one GitHub's "Update branch"
# button creates, and the one the web conflict editor creates. A secret added
# while resolving a conflict would pass this check unseen.

name: Secrets

# Self-hosted runners do not pick up jobs from pull_request events, so this
# runs on push instead. Every branch but main, because the interesting cases
# are not all the same shape:
#
#   A fork's pull request arrives as the pull-request/<number> branch that
#   copy-pr-bot pushes, which is the only form it has here.
#
#   A dependabot branch is mirrored to neither main nor pull-request/N, so
#   without it a dependency bump gets none of this check -- and a check that
#   cannot report on a pull request cannot be required.
#
#   A branch pushed directly to this repository gets scanned on the push,
#   before anyone opens a pull request for it. Naming the two prefixes above
#   and nothing else meant an in-repo feature branch was never scanned until
#   it was mirrored, which happens after review rather than before it. The
#   check that finds a committed credential is worth the least when it runs
#   last.
#
#   A branch that Actions itself pushes is the one case `branches-ignore`
#   cannot reach. A push authenticated by GITHUB_TOKEN raises no workflow run
#   at all -- GitHub's guard against a workflow triggering itself -- so
#   automation/base-image-digests, which base-image-digests.yml writes with
#   that token, has never been scanned and will not be however this list is
#   written. The evidence is PR #1751: the bump job pushed the branch and
#   opened it, and its head commit carries no gitleaks run. What stands in
#   for the scan there is that job's own guard, which refuses to commit a
#   line that is not `ARG <NAME>=<ref>@sha256:<digest>` in a Dockerfile. Any
#   future Actions-pushed branch needs an answer of that shape; adding a name
#   here is not one.
#
# No main trigger: a range scan needs two ends, and a push to main gives no
# reliable one after a force push.
on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Secrets-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    # Matching the triggers above. The branch test also keeps a manual run on
    # main from failing on an empty range: it skips instead.
    if: >
      github.repository_id == '1323115536' &&
      github.ref != 'refs/heads/main'
    runs-on: linux-amd64-cpu16
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's commits are compared against main, so both ends
          # of the range have to be present.
          fetch-depth: 0
          persist-credentials: false

      # A prebuilt binary with its checksum verified against the pinned release,
      # so a compromised download fails closed. No Go toolchain needed, which
      # keeps this the cheapest job in the repository.
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # One definition, in make/versions.mk.
          GITLEAKS_VERSION="$(make --no-print-directory print-GITLEAKS_VERSION)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"

          # Retry: a CDN 504 must not fail the job on the first response.
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 \
            -o "${tmp}/${tar}" "${base}/${tar}"
          # A committed digest, not the release's checksums.txt -- same host, so
          # the same compromise boundary. make/tool-versions.mk owns it.
          expected="$(make --no-print-directory print-GITLEAKS_SHA256_AMD64)"

          if [ -z "${expected}" ]; then
            echo "::error::no checksum entry for ${tar}"
            exit 1
          fi
          actual="$(sha256sum "${tmp}/${tar}" | awk '{print $1}')"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::checksum mismatch for ${tar}"
            exit 1
          fi

          tar -xzf "${tmp}/${tar}" -C "${tmp}" gitleaks
          # /usr/local/bin is not writable by the runner user on the
          # self-hosted runners, so it goes somewhere that always is.
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${tmp}/gitleaks" "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # --redact so a finding does not republish the secret into the job log,
      # which is readable by anyone who can see the run.
      - name: Scan this branch for committed secrets
        shell: bash
        run: |
          set -euo pipefail

          # gitleaks exits 0 when git log rejects the range, so a missing
          # origin/main would pass in silence and this check would protect
          # nothing. Both ends are resolved first, and an empty range counts as
          # a failure rather than as a clean result.
          git rev-parse --verify --quiet origin/main >/dev/null \
            || { echo "::error::origin/main is missing — cannot work out the range to scan"; exit 1; }
          count="$(git rev-list --count origin/main..HEAD)"
          if [ "${count}" -eq 0 ]; then
            echo "::error::no commits ahead of origin/main — nothing was scanned"
            exit 1
          fi
          echo "  ${count} commit(s) in origin/main..HEAD"

          if ! gitleaks git . --no-banner --redact \
               --log-opts="origin/main..HEAD --diff-merges=first-parent"; then
            echo "::error::gitleaks found a credential on this branch."
            echo
            echo "Remove it from every commit that carries it. Deleting it in a"
            echo "later commit leaves it in the history and it is still leaked:"
            echo "  git rebase -i origin/main"
            echo
            echo "Then rotate it. Treat anything that reached a remote as public."
            exit 1
          fi
