#
# The shared body of every backend E2E lane. capd-e2e.yml and nico-e2e.yml are
# thin callers; everything they had in common lives here once.
#
# What differs between backends is small: the ginkgo label filter, the Tilt
# provider list, and whether the run needs the internal CAPNICo checkout. What
# they share is not: runner setup, inotify tuning, and about 60 lines of
# redaction-gated diagnostics collection. That block was the reason to factor
# this out rather than copy it.
#
# workflow_call only. It carries no triggers of its own, so a caller decides
# when a backend runs.
#
# Self-hosted runners do not receive pull_request events. copy-pr-bot mirrors a
# vetted pull request head to pull-request/<number>; the push of that same
# commit is the security boundary and trigger the callers use.

name: Backend E2E

on:
  workflow_call:
    inputs:
      backend:
        description: Backend name, used for the run id, artifact name and logs.
        required: true
        type: string
      label-filter:
        description: Ginkgo label filter selecting this backend's specs.
        required: true
        type: string
      providers:
        description: >-
          JSON array of Tilt providers, written into tilt_config.json. capi_core
          is required by capd, nico and nico-vm alike; the Tiltfile rejects a
          list that omits it.
        required: true
        type: string
      timeout-minutes:
        description: Job timeout. Backends differ widely, so callers set it.
        required: false
        type: number
        default: 90
      require-authn:
        description: >-
          Fail rather than skip when the deployment is not authenticating. Only
          meaningful for a backend whose label-filter selects the authn specs.
        required: false
        type: boolean
        default: false
      needs-nico-provider:
        description: >-
          Check out NVIDIA/cluster-api-provider-nico next to the monorepo. It is
          an internal repository, so this needs NKE_INTERNAL_RO_TOKEN.
        required: false
        type: boolean
        default: false
    secrets:
      NKE_INTERNAL_RO_TOKEN:
        description: Read-only token for internal NVIDIA repositories.
        required: false

permissions: {}

jobs:
  e2e:
    name: ${{ inputs.backend }}-e2e
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      NKE_E2E_RUN_ID: github-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
      NKE_E2E_DOCKERHUB_MIRROR: dc.local.gha-runners.nvidia.com
      NKE_E2E_LABEL_FILTER: ${{ inputs.label-filter }}
      NKE_E2E_PROVIDERS: ${{ inputs.providers }}
      NKE_E2E_REQUIRE_AUTHN: ${{ inputs.require-authn }}
      KIND_CLUSTER_NAME: cwe-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
      GOPROXY: "off"
      # Empty unless the caller asked for CAPNICo. The script stages the tree
      # into the runner container only when this is set, so every other backend
      # skips that work. This is the HOST path; the container path is a constant
      # in the script, and is what Tilt is told.
      NICO_PROVIDER_SRC: ${{ inputs.needs-nico-provider && format('{0}/.capnico/cluster-api-provider-nico', github.workspace) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Inside the workspace, because actions/checkout refuses a path outside it
      # ("Repository path ... is not under ..."). The directory name still has to
      # be cluster-api-provider-nico: the script tars it by basename and expands
      # it under /workspace in the runner container, where everything after this
      # point executes.
      - name: Checkout the CAPNICo provider
        if: inputs.needs-nico-provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/cluster-api-provider-nico
          token: ${{ secrets.NKE_INTERNAL_RO_TOKEN }}
          path: .capnico/cluster-api-provider-nico
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "helm_version=$(make --no-print-directory print-HELM_VERSION)"
            echo "kind_version=$(make --no-print-directory print-KIND_VERSION)"
            echo "kubectl_version=$(make --no-print-directory print-KUBECTL_VERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Set up Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ steps.versions.outputs.kind_version }}
          kubectl_version: ${{ steps.versions.outputs.kubectl_version }}
          install_only: true

      - name: Show runner tools
        shell: bash
        run: |
          set -euo pipefail
          docker version
          go version
          helm version --short
          kind version
          kubectl version --client

      - name: Configure runner inotify capacity
        shell: bash
        run: |
          set -euo pipefail

          raise_minimum() {
            local key="$1"
            local minimum="$2"
            local current

            current="$(sysctl -n "${key}")"
            echo "${key}=${current} (required minimum ${minimum})"
            if (( current < minimum )); then
              sudo sysctl -w "${key}=${minimum}"
              current="$(sysctl -n "${key}")"
            fi
            if (( current < minimum )); then
              echo "${key} remained below ${minimum}: ${current}" >&2
              exit 1
            fi
          }

          raise_minimum fs.inotify.max_user_instances 1024
          raise_minimum fs.inotify.max_user_watches 1048576

      - name: Run the ${{ inputs.backend }} E2E suite
        run: make test-e2e-backend-ci

      - name: Check whether diagnostics are safe to upload
        id: diagnostics
        if: always()
        shell: bash
        run: |
          marker="controller/.local/backend-e2e/${NKE_E2E_RUN_ID}/SAFE_TO_UPLOAD"
          if [[ -f "${marker}" ]]; then
            echo "safe=true" >> "${GITHUB_OUTPUT}"
          else
            echo "safe=false" >> "${GITHUB_OUTPUT}"
            echo "Diagnostics are absent or were not marked safe to upload."
          fi

      - name: Show redacted failure diagnostics
        if: failure() && steps.diagnostics.outputs.safe == 'true'
        shell: bash
        run: |
          state_dir="controller/.local/backend-e2e/${NKE_E2E_RUN_ID}"
          files=(
            capi-state-timeline.log
            capi-resources.yaml
            capi-describe.txt
            management-events.txt
            management-pods.txt
            capi-controller.log
            capi-kubeadm-bootstrap-controller.log
            capi-kubeadm-control-plane-controller.log
            capd-controller.log
            cwe.log
          )
          for file in "${files[@]}"; do
            [[ -f "${state_dir}/${file}" ]] || continue
            echo "::group::${file} (last 300 lines)"
            tail -n 300 "${state_dir}/${file}"
            echo "::endgroup::"
          done
          for path in \
            "${state_dir}"/nodes/*-console.log \
            "${state_dir}"/nodes/*-systemd.txt \
            "${state_dir}"/nodes/*-journal.log \
            "${state_dir}"/nodes/*-crictl-ps.txt \
            "${state_dir}"/nodes/*-crictl-pods.txt \
            "${state_dir}"/nodes/*-crictl-images.txt \
            "${state_dir}"/nodes/*-crictl-info.json \
            "${state_dir}"/nodes/*-dockerhub-hosts.toml \
            "${state_dir}"/nodes/*-network.txt; do
            [[ -f "${path}" ]] || continue
            file="${path#"${state_dir}/"}"
            echo "::group::${file} (last 300 lines)"
            tail -n 300 "${path}"
            echo "::endgroup::"
          done

      - name: Upload redacted diagnostics
        if: always() && steps.diagnostics.outputs.safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.backend }}-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller/.local/backend-e2e/${{ env.NKE_E2E_RUN_ID }}/
          if-no-files-found: error
          retention-days: 7
