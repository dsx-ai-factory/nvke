#
# The shared body of every backend E2E lane. capd-e2e.yml and nico-e2e.yml are
# thin callers; everything they had in common lives here once.
#
# What differs between backends is small: the ginkgo label filter, the Tilt
# provider list, and whether the run needs the public CAPNICo source checkout. What
# they share is not: runner setup, inotify tuning, and about 60 lines of
# redaction-gated diagnostics collection. That block was the reason to factor
# this out rather than copy it.
#
# workflow_call only. It carries no triggers of its own, so a caller decides
# when a backend runs.
#
# Self-hosted runners do not receive pull_request events. copy-pr-bot mirrors a
# vetted pull request head to pull-request/<number>; the push of that same
# commit is the security boundary and trigger the callers use.

name: Backend E2E

on:
  workflow_call:
    inputs:
      backend:
        description: Backend name, used for the run id, artifact name and logs.
        required: true
        type: string
      arch:
        description: >-
          Short label for the runner architecture, used only for naming and
          disambiguation (job name, run id, artifact name) so two arches of
          the same backend in one workflow run don't collide. Does not
          control scheduling -- see `runner`.
        required: false
        type: string
        default: amd64
      runner:
        description: The runs-on label. Controls which architecture actually runs.
        required: false
        type: string
        default: linux-amd64-cpu16
      label-filter:
        description: Ginkgo label filter selecting this backend's specs.
        required: true
        type: string
      providers:
        description: >-
          JSON array of Tilt providers, written into tilt_config.json. capi_core
          is required by capd and nico alike; the Tiltfile rejects a list that
          omits it.
        required: true
        type: string
      timeout-minutes:
        description: Job timeout. Backends differ widely, so callers set it.
        required: false
        type: number
        default: 90
      require-authn:
        description: >-
          Fail rather than skip when the deployment is not authenticating. Only
          meaningful for a backend whose label-filter selects the authn specs.
        required: false
        type: boolean
        default: false
      require-authz:
        description: >-
          Fail rather than skip when the deployment is not authorizing. Only
          meaningful for a backend whose label-filter selects the authz specs.
        required: false
        type: boolean
        default: false
      install-cni-after-init:
        description: >-
          Have the controller initialize the first control-plane before invoking the node
          agent's stand-alone InstallCNI RPC. This avoids coupling CNI apply to
          the kube-vip startup race in focused CAPD lanes.
        required: false
        type: boolean
        default: false
      nvkectl-smoke:
        description: >-
          Run hack/ci/nvkectl-smoke.sh once the suite passes: drive nvkectl against
          the controller this lane deployed. CAPD only for now.
        required: false
        type: boolean
        default: false
      needs-capnico-source:
        description: >-
          Stage the pinned cluster-api-provider-nico Go module source for the suite.
        required: false
        type: boolean
        default: false
      use-nke-stack:
        description: >-
          Deploy the management plane from the nke-stack umbrella chart instead
          of Tilt. The chart is built from this commit unless stack-chart names
          a published one -- building is the default because subcharts are baked
          into a package, so a published artifact would test the chart templates
          as they were when it was published.
        required: false
        type: boolean
        default: false
      stack-chart:
        description: >-
          OCI reference of an nke-stack umbrella chart. When set, the six
          management-plane charts are installed from it instead of by Tilt, and
          stack-version is required. Empty (the default) keeps the Tilt deploy,
          which also brings up capd-reboot-controller, the BGP wiring and the
          profiles renderer that the umbrella does not cover.
        required: false
        type: string
        default: ''
      stack-version:
        description: Chart version to install. Required when stack-chart is set.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  e2e:
    name: ${{ inputs.backend }}-e2e (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    if: github.repository_id == '1323115536'
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      NKE_E2E_BACKEND: ${{ inputs.backend }}
      NKE_E2E_RUN_ID: github-${{ inputs.backend }}-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      # A public pull-through mirror, not dc.local.gha-runners.nvidia.com:
      # that name only resolves on the self-hosted fleet, so the arm64 leg
      # died on the PostgreSQL chart the moment it moved to ARC. Same
      # reasoning and same host as os-image-artifact.yml, which had to make
      # this change when it moved. Reachable from both fleets, and it serves
      # bitnamicharts anonymously.
      NKE_E2E_DOCKERHUB_MIRROR: mirror.gcr.io
      NKE_E2E_LABEL_FILTER: ${{ inputs.label-filter }}
      NKE_E2E_PROVIDERS: ${{ inputs.providers }}
      NKE_E2E_REQUIRE_AUTHN: ${{ inputs.require-authn }}
      NKE_E2E_REQUIRE_AUTHZ: ${{ inputs.require-authz }}
      NKE_E2E_NVKECTL_SMOKE: ${{ inputs.nvkectl-smoke }}
      INSTALL_CNI_AFTER_INIT: ${{ inputs.install-cni-after-init }}
      # Empty unless the caller selects the umbrella-chart deploy. backend-e2e.sh
      # branches on NKE_E2E_STACK_CHART being non-empty; Tilt stays the default.
      NKE_E2E_USE_STACK: ${{ inputs.use-nke-stack }}
      NKE_E2E_STACK_CHART: ${{ inputs.stack-chart }}
      NKE_E2E_STACK_VERSION: ${{ inputs.stack-version }}
      # These backends only observe a container restart, not a real boot: soft reboot can never
      # show a detectable change, so skip straight to hard.
      NODE_REBOOT_SOFT_REBOOT_ENABLED: false
      KIND_CLUSTER_NAME: cwe-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
      CAPNICO_SOURCE_SRC: ${{ inputs.needs-capnico-source && format('{0}/.capnico/cluster-api-provider-nico', github.workspace) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Stage the pinned CAPNICo module
        if: inputs.needs-capnico-source
        run: |
          set -euo pipefail
          source_dir="$(go mod download -json github.com/dsx-ai-factory/cluster-api-provider-nico | jq -er '.Dir')"
          mkdir -p "${CAPNICO_SOURCE_SRC}"
          cp -R "${source_dir}/." "${CAPNICO_SOURCE_SRC}/"
          chmod -R u+w "${CAPNICO_SOURCE_SRC}"

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "helm_version=$(make --no-print-directory print-HELM_VERSION)"
            echo "kind_version=$(make --no-print-directory print-KIND_VERSION)"
            echo "kubectl_version=$(make --no-print-directory print-KUBECTL_VERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Set up Kind and kubectl
        uses: ./.github/actions/setup-kind
        with:
          kind_version: ${{ steps.versions.outputs.kind_version }}
          kubectl_version: ${{ steps.versions.outputs.kubectl_version }}

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev

      # Kind nodes share this runner's kernel, and OVN's ovs-vswitchd loads
      # openvswitch from it. The module ships in linux-modules-extra, which
      # the ARC arm64 image does not install. Stage the exact host kernel build:
      # uname -r alone cannot distinguish Jammy backports from Noble builds.
      # The suite's privileged Docker preflight loads it:
      # sudo in the ARC runner does not grant CAP_SYS_MODULE, and DinD has its
      # own /lib/modules filesystem (#1515).
      - name: Install the Open vSwitch module files
        run: |
          uname -a
          sudo apt-get install -y -qq kmod
          modules="${RUNNER_TEMP}/nvke-host-kernel-modules"
          sudo bash controller/hack/ci/prepare-host-kernel-modules.sh "${modules}"
          echo "NKE_E2E_HOST_MODULES_DIR=${modules}/lib/modules" >> "${GITHUB_ENV}"

      - name: Show runner tools
        shell: bash
        run: |
          set -euo pipefail
          docker version
          go version
          helm version --short
          kind version
          kubectl version --client

      - name: Configure runner inotify capacity
        shell: bash
        run: |
          set -euo pipefail

          raise_minimum() {
            local key="$1"
            local minimum="$2"
            local current

            current="$(sysctl -n "${key}")"
            echo "${key}=${current} (required minimum ${minimum})"
            if (( current < minimum )); then
              sudo sysctl -w "${key}=${minimum}"
              current="$(sysctl -n "${key}")"
            fi
            if (( current < minimum )); then
              echo "${key} remained below ${minimum}: ${current}" >&2
              exit 1
            fi
          }

          raise_minimum fs.inotify.max_user_instances 1024
          raise_minimum fs.inotify.max_user_watches 1048576

      - name: Run the ${{ inputs.backend }} E2E suite
        run: make test-e2e-backend-ci

      - name: Check whether diagnostics are safe to upload
        id: diagnostics
        if: always()
        shell: bash
        run: |
          marker="controller/.local/backend-e2e/${NKE_E2E_RUN_ID}/SAFE_TO_UPLOAD"
          if [[ -f "${marker}" ]]; then
            echo "safe=true" >> "${GITHUB_OUTPUT}"
          else
            echo "safe=false" >> "${GITHUB_OUTPUT}"
            echo "Diagnostics are absent or were not marked safe to upload."
          fi

      - name: Show redacted failure diagnostics
        if: failure() && steps.diagnostics.outputs.safe == 'true'
        shell: bash
        run: |
          state_dir="controller/.local/backend-e2e/${NKE_E2E_RUN_ID}"
          files=(
            capi-state-timeline.log
            capi-resources.yaml
            capi-describe.txt
            management-events.txt
            management-pods.txt
            capi-controller.log
            capi-kubeadm-bootstrap-controller.log
            capi-kubeadm-control-plane-controller.log
            capd-controller.log
            dsx-identity-exchange.log
            cwe.log
            cwe-follow.log
          )
          for file in "${files[@]}"; do
            [[ -f "${state_dir}/${file}" ]] || continue
            echo "::group::${file} (last 300 lines)"
            tail -n 300 "${state_dir}/${file}"
            echo "::endgroup::"
          done
          for path in \
            "${state_dir}"/nodes/*-console.log \
            "${state_dir}"/nodes/*-systemd.txt \
            "${state_dir}"/nodes/*-journal.log \
            "${state_dir}"/nodes/*-crictl-ps.txt \
            "${state_dir}"/nodes/*-crictl-pods.txt \
            "${state_dir}"/nodes/*-crictl-images.txt \
            "${state_dir}"/nodes/*-crictl-info.json \
            "${state_dir}"/nodes/*-control-plane-containers.log \
            "${state_dir}"/nodes/*-dockerhub-hosts.toml \
            "${state_dir}"/nodes/*-network.txt; do
            [[ -f "${path}" ]] || continue
            file="${path#"${state_dir}/"}"
            echo "::group::${file} (last 300 lines)"
            tail -n 300 "${path}"
            echo "::endgroup::"
          done

      # Runner egress has answered FinalizeArtifact with 403; a lost upload must not fail a passing suite.
      - name: Upload redacted diagnostics
        if: always() && steps.diagnostics.outputs.safe == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.backend }}-${{ inputs.arch }}-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller/.local/backend-e2e/${{ env.NKE_E2E_RUN_ID }}/
          if-no-files-found: error
          retention-days: 7
