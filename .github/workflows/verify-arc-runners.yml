# Verifies the ARC runner fleets on dgxc-eks-use1-rel-prd1.
#
# Two jobs, because the two arm64 classes are deliberately different:
#
#   arc-arm64-cpu16  Graviton EC2 (r6g.4xlarge). No /dev/kvm — EC2 is not
#                    bare metal. Fine for ordinary builds and tests.
#   arc-arm64-kvm    Graviton bare metal (c7g.metal) with a writable
#                    /dev/kvm. This is the fleet os-image-artifact and
#                    kubeadm-bringup-e2e need, and the one the gha-arc-poc
#                    cluster could not host.
#
# The cpu16 job asserts KVM is ABSENT on purpose. If that ever starts
# passing, the two classes have been conflated and jobs may silently land
# on the wrong, more expensive pool.
#
# Manual trigger only, so merging this cannot affect any existing pipeline.

name: verify-arc-runners

on:
  workflow_dispatch:

jobs:
  arm64:
    name: arm64 (no KVM expected)
    runs-on: arc-arm64-cpu16
    timeout-minutes: 15
    steps:
      - name: Architecture is aarch64
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Report the shape
        run: |
          echo "cores:  $(nproc)"
          echo "memory: $(free -g | awk '/^Mem:/ {print $2}') GiB"
          echo "user:   $(id -un) uid=$(id -u)"

      - name: /dev/kvm is absent, as designed
        run: |
          if [ -e /dev/kvm ]; then
            echo "::error::/dev/kvm exists on arc-arm64-cpu16. That fleet runs on"
            echo "::error::EC2 Graviton, which is not bare metal — this should be"
            echo "::error::impossible, and suggests the class landed on the KVM pool."
            exit 1
          fi
          echo "::notice::no /dev/kvm, as expected for an EC2 Graviton runner"

  arm64-kvm:
    name: arm64 with KVM
    runs-on: arc-arm64-kvm
    timeout-minutes: 20
    steps:
      - name: Architecture is aarch64
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Report the shape
        run: |
          echo "cores:  $(nproc)"
          echo "memory: $(free -g | awk '/^Mem:/ {print $2}') GiB"
          echo "disk:   $(df -h / | awk 'NR==2 {print $4}') free"
          echo "user:   $(id -un) uid=$(id -u)"

      - name: /dev/kvm is present and writable
        run: |
          ls -l /dev/kvm
          # Both checks matter. The device can be visible but unusable: the
          # Kubernetes device cgroup blocks it for unprivileged containers
          # whatever the file mode says.
          test -w /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-
          echo "::notice::/dev/kvm opened read-write"

      # Not kvm-ok: cpu-checker looks for x86 vmx/svm flags and misreports here.
      - name: QEMU can use KVM acceleration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          qemu-system-aarch64 -accel help | grep -q kvm
          echo "::notice::QEMU accepts KVM acceleration"

      # The jobs this fleet exists to serve reach only public endpoints, but
      # this cluster sits in the corpnet VPC while the interim EC2 fleet had
      # a public IP. Worth proving before migrating them.
      - name: Egress the NKE jobs depend on
        run: |
          fail=0
          for url in \
            https://github.com \
            https://ghcr.io/v2/ \
            https://releases.hashicorp.com \
            https://proxy.golang.org \
            https://pkgs.k8s.io
          do
            if code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' "$url" 2>&1); then
              echo "ok    $code  $url"
            else
              echo "FAIL        $url  ($code)"
              fail=1
            fi
          done
          exit $fail
