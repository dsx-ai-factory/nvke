name: Image Provisioned NVCR

# Builds the cluster-api-provider-provisioned image for linux/amd64 and
# linux/arm64 and publishes a multi-arch manifest to nvcr.io. image.yml runs
# `docker build --check` on the same Dockerfile, which parses it and never
# builds it; this workflow is the one that pushes.
#
# A sibling of image-nvcr.yml rather than more jobs inside it, matching how
# agent-artifact-nvcr.yml and chart-publish-nvcr.yml are already split: each
# component versions and releases on its own tag, so one workflow per component
# keeps a controller release from republishing this provider and the reverse.
#
# `nkectl bootstrap site` installs this provider onto the ephemeral bootstrap
# cluster and needs the image to exist somewhere it can pull from
# (NKECTL_CAPI_PROVISIONED_IMAGE). Until this workflow, nothing published it and
# every operator had to build it from a checkout.
#
# The destination org is not written here. It comes from the `nvcr`
# environment, so no registry identifier lands in a tracked file of a
# repository that is released publicly. The image is pushed to
# nvcr.io/<NKE_NGC_ORG>/cluster-api-provider-provisioned:
#
#   NKE_NGC_ORG              variable  NGC org id
#   NGC_REGISTRY_TOKEN_NKE   secret    NGC API key with write access on the org
#
# Tagging matches image-nvcr.yml: no `latest`, only `sha-<commit>` (every build)
# and `edge` (main only), plus the resolved version. The make targets used below
# require IMG_REPO to be passed explicitly and have no default, guarded by
# check-img-repo, so this workflow can only ever push to the destination
# resolved here.
#
# A workflow_dispatch from a non-main branch publishes only `sha-*` tags — a
# safe smoke-test mode that never moves `edge`.
#
# No `cluster-api-provider-provisioned/v*` tag exists yet. Until one does,
# `git describe --always` resolves the version to the short commit sha, so the
# version tag is a second immutable per-commit tag rather than a semver one.
#
# The DSX promotion job uses the same protected GitHub environment, but a
# separate NGC token. The source NKE and target DSX repositories both live on
# nvcr.io, and docker auth stores one credential per registry host, so that job
# pulls the source index into an OCI layout with the NKE token and then pushes
# it with the DSX token rather than depending on two simultaneous nvcr.io
# logins.
on:
  push:
    branches:
      - main
    tags:
      - "cluster-api-provider-provisioned/v[0-9]+.[0-9]+.[0-9]+"
      - "cluster-api-provider-provisioned/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own. See
  # image-nvcr.yml for why: without it, back-to-back merges lose CI results,
  # because GitHub allows one running and one pending run per group and cancels
  # the pending one when a third arrives, whatever cancel-in-progress says.
  #
  # A literal name, NOT ${{ github.workflow }}, for the same reason given there.
  group: Image Provisioned NVCR-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'NVIDIA/nke'
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: nvcr
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
          - arch: arm64
            runner: linux-arm64-cpu16
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # git describe needs history and tags
          persist-credentials: false

      # The docker-container driver runs BuildKit in its own container, so it
      # does not inherit the daemon's registry-mirror configuration. NVIDIA
      # runners ship a prepopulated buildkitd.toml pointing at the local mirror;
      # use it when present so base-image pulls are cached and not subject to
      # Docker Hub rate limits.
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      # `$oauthtoken` is NGC's literal username, not a variable reference.
      - name: Log in to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}

      - name: Resolve destination and tags
        id: meta
        shell: bash
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi
          IMAGE="nvcr.io/${NKE_NGC_ORG}/cluster-api-provider-provisioned"

          # Nearest cluster-api-provider-provisioned/v* tag, prefix stripped:
          # v0.1.0 on a release commit, v0.1.0-4-gabcdef between releases, and
          # the short sha while no such tag exists at all.
          version="$(git describe --match 'cluster-api-provider-provisioned/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          version="${version#cluster-api-provider-provisioned/}"

          tags=("sha-${GITHUB_SHA}" "${version}")
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags+=("edge")
          fi

          {
            echo "image=${IMAGE}"
            echo "version=${version}"
            echo "push_tags=${tags[*]}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing to ${IMAGE} as: ${tags[*]}"

      - name: Build and push (${{ matrix.arch }})
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          PUSH_TAGS: ${{ steps.meta.outputs.push_tags }}
        run: |
          set -euo pipefail
          # BUILD_VERSION, not GIT_VERSION: this Dockerfile takes one version
          # ARG and stamps it into main.version. Passing the value resolved
          # above rather than letting the Makefile re-run git describe keeps
          # every job in this workflow on one answer.
          make -C cluster-api-provider-provisioned docker-push-arch \
            ARCH="${ARCH}" \
            IMG_REPO="${IMAGE}" \
            PUSH_TAGS="${PUSH_TAGS}" \
            BUILD_VERSION="${VERSION}" \
            BUILDX_EXTRA_ARGS="--label org.opencontainers.image.revision=${GITHUB_SHA}"

  manifest:
    if: github.repository == 'NVIDIA/nke'
    name: Manifest
    runs-on: linux-amd64-cpu8
    needs: [build]
    environment: nvcr
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # git describe needs history and tags
          persist-credentials: false

      # `$oauthtoken` is NGC's literal username, not a variable reference.
      - name: Log in to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}

      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      - name: Resolve destination and tags
        id: meta
        shell: bash
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi

          version="$(git describe --match 'cluster-api-provider-provisioned/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          version="${version#cluster-api-provider-provisioned/}"

          tags=("sha-${GITHUB_SHA}" "${version}")
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags+=("edge")
          fi

          echo "image=nvcr.io/${NKE_NGC_ORG}/cluster-api-provider-provisioned" >> "${GITHUB_OUTPUT}"
          echo "push_tags=${tags[*]}" >> "${GITHUB_OUTPUT}"

      - name: Create multi-arch manifests
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          PUSH_TAGS: ${{ steps.meta.outputs.push_tags }}
        run: |
          set -euo pipefail
          make -C cluster-api-provider-provisioned docker-manifest \
            IMG_REPO="${IMAGE}" \
            PUSH_TAGS="${PUSH_TAGS}"

      - name: Show published manifest
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"

  # NVCR needs an NGC account to pull from, so this image is not reachable by
  # anyone outside NVIDIA. A release tag copies it to GHCR, which is public once
  # this repository is, so a released version can be pulled by whoever the
  # release is for. That matters more here than for the controller: nkectl is
  # the binary an external operator downloads, and it cannot bootstrap a site
  # without pulling this provider.
  #
  # Tags only. `main` keeps publishing to NVCR alone, so GHCR carries released
  # versions rather than every commit.
  #
  # The destination is ghcr.io/nvidia/nke/cluster-api-provider-provisioned,
  # alongside ghcr.io/nvidia/nke/controller and separate from
  # ghcr.io/nvidia/nke/charts, which is what keeps a chart and an image from
  # sharing one OCI repository.
  promote-ghcr:
    name: Promote to GHCR
    if: startsWith(github.ref, 'refs/tags/cluster-api-provider-provisioned/v')
    runs-on: linux-amd64-cpu8
    needs: [manifest]
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Downloaded, not `go install`ed: a pinned module version can go
      # temporarily unresolvable through an internal Go proxy mirror even when
      # the tag is real, which is what broke this job. See setup-crane/action.yml.
      - name: Set up crane
        uses: ./.github/actions/setup-crane
        with:
          crane_version: v0.21.9

      # crane copies the whole index, so the per-architecture manifests come
      # with it and the digest is preserved. What GHCR serves is the image NVCR
      # already holds, not a rebuild.
      - name: Copy the released image to GHCR
        shell: bash
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
        run: |
          set -euo pipefail

          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi

          version="${GITHUB_REF_NAME#cluster-api-provider-provisioned/}"
          src="nvcr.io/${NKE_NGC_ORG}/cluster-api-provider-provisioned:${version}"
          dst="ghcr.io/${GITHUB_REPOSITORY,,}/cluster-api-provider-provisioned"

          if ! digest="$(crane digest "${src}")"; then
            echo "::error::${src} does not exist. The manifest job should have pushed it."
            exit 1
          fi

          crane copy "${src}" "${dst}:${version}"
          crane tag "${dst}:${version}" "sha-${GITHUB_SHA}"

          {
            echo "- \`${dst}:${version}\` is \`${digest}\`"
            echo "- copied from \`${src}\`, not rebuilt"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote-dsx:
    name: Promote to DSX
    if: github.repository == 'NVIDIA/nke'
    runs-on: linux-amd64-cpu8
    needs: [manifest]
    environment: nvcr
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Downloaded, not `go install`ed: a pinned module version can go
      # temporarily unresolvable through an internal Go proxy mirror even when
      # the tag is real, which is what broke this job. See setup-crane/action.yml.
      - name: Set up crane
        uses: ./.github/actions/setup-crane
        with:
          crane_version: v0.21.9

      - name: Promote image
        shell: bash
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
          DSX_NGC_ORG_TEAM: ${{ vars.DSX_NGC_ORG_TEAM }}
          NKE_NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}
          DSX_NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_DSX }}
        run: |
          set -euo pipefail

          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi
          if [[ -z "${DSX_NGC_ORG_TEAM}" ]]; then
            echo "::error::DSX_NGC_ORG_TEAM is not set in the nvcr environment"
            exit 1
          fi
          if [[ -z "${NKE_NGC_TOKEN}" ]]; then
            echo "::error::NGC_REGISTRY_TOKEN_NKE is not set in the nvcr environment"
            exit 1
          fi
          if [[ -z "${DSX_NGC_TOKEN}" ]]; then
            echo "::error::NGC_REGISTRY_TOKEN_DSX is not set in the nvcr environment"
            exit 1
          fi

          image_version="$(git describe --match 'cluster-api-provider-provisioned/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          image_version="${image_version#cluster-api-provider-provisioned/}"
          src="nvcr.io/${NKE_NGC_ORG}/cluster-api-provider-provisioned:${image_version}"
          dst="nvcr.io/${DSX_NGC_ORG_TEAM}/cluster-api-provider-provisioned"
          layout="${RUNNER_TEMP}/cluster-api-provider-provisioned-image.oci"

          # shellcheck disable=SC2016
          echo "${NKE_NGC_TOKEN}" | crane auth login nvcr.io \
            -u '$oauthtoken' --password-stdin

          if ! source_digest="$(crane digest "${src}")"; then
            echo "::error::${src} does not exist. The manifest job should have pushed it."
            exit 1
          fi

          mkdir -p "${layout}"
          crane pull --format=oci "${src}" "${layout}"

          # shellcheck disable=SC2016
          echo "${DSX_NGC_TOKEN}" | crane auth login nvcr.io \
            -u '$oauthtoken' --password-stdin

          ensure_immutable_tag() {
            local tag="$1"
            local target="${dst}:${tag}"

            if target_digest="$(crane digest "${target}" 2>/dev/null)"; then
              if [[ "${target_digest}" != "${source_digest}" ]]; then
                echo "::error::${target} already exists with digest ${target_digest}, expected ${source_digest}"
                exit 1
              fi
              echo "${target} already exists with matching digest ${target_digest}"
              return
            fi

            # No --index: it wraps the pulled layout in a fresh index, which
            # changes the digest and fails the equality check below. Pushing the
            # layout as-is preserves the source multi-arch index digest.
            crane push "${layout}" "${target}"
            target_digest="$(crane digest "${target}")"
            if [[ "${target_digest}" != "${source_digest}" ]]; then
              echo "::error::${target} pushed with digest ${target_digest}, expected ${source_digest}"
              exit 1
            fi
          }

          ensure_immutable_tag "${image_version}"
          ensure_immutable_tag "sha-${GITHUB_SHA}"

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            crane tag "${dst}:${image_version}" edge
          fi

          crane manifest "${dst}:${image_version}" > "${RUNNER_TEMP}/dsx-provisioned-manifest.json"
          grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"amd64"' "${RUNNER_TEMP}/dsx-provisioned-manifest.json" \
            || { echo "::error::DSX image is missing linux/amd64"; exit 1; }
          grep -Eq '"architecture"[[:space:]]*:[[:space:]]*"arm64"' "${RUNNER_TEMP}/dsx-provisioned-manifest.json" \
            || { echo "::error::DSX image is missing linux/arm64"; exit 1; }

          {
            echo "- \`${dst}:${image_version}\` is \`${source_digest}\`"
            echo "- \`${dst}:sha-${GITHUB_SHA}\` is \`${source_digest}\`"
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
              echo "- \`${dst}:edge\` now points at \`${source_digest}\`"
            fi
            echo "- promoted from \`${src}\`, not rebuilt"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Scans the pushed image rather than attesting at build time. `buildx
  # --sbom=true` would be shorter, but an attestation turns a single-arch push
  # into an OCI index, which breaks the imagetools create in docker-manifest --
  # the same reason --provenance=false is already on docker-push-arch.
  sbom:
    if: github.repository == 'NVIDIA/nke'
    name: SBOM (${{ matrix.arch }})
    runs-on: linux-amd64-cpu8
    needs: [manifest]
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      # `$oauthtoken` is NGC's literal username, not a variable reference.
      - name: Log in to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}

      # Uses the per-arch tags docker-push-arch already pushes, so no digest has
      # to come out of the build job. An arm64 image scans fine on an amd64
      # runner: the scanner reads layers, it does not run them.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: nvcr.io/${{ vars.NKE_NGC_ORG }}/cluster-api-provider-provisioned:sha-${{ github.sha }}-${{ matrix.arch }}
          format: spdx-json
          artifact-name: cluster-api-provider-provisioned-sbom-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: true
          # No release exists to attach to yet. Flip this when one does.
          upload-release-assets: false
