name: Artifact NKTP Chart

# Checks and packages the NKTP Helm chart and publishes it as an OCI artifact:
#
#   ghcr.io/dsx-ai-factory/nvke/charts/nktp:<chart version>   on vX.Y.Z and vX.Y.Z-beta.N
#   nvcr.io/<NVKE_NGC_ORG>/nktp-chart:<chart version>         on vX.Y.Z and vX.Y.Z-beta.N
#   nvcr.io/<DSX_NGC_ORG_TEAM>/nktp-chart:<chart version>     on vX.Y.Z only
#
# <version> is `git describe --tags --always --match 'v*'`. The chart version is <version> without its "v", as OCI chart tags
# carry none. Chart.yaml carries a 0.0.0 placeholder.
#
# A push runs only for a vX.Y.Z or vX.Y.Z-beta.N tag. A dispatch or a call runs
# on any ref, and on any other ref every push step skips itself, so the run
# checks, packages and scans and pushes nothing:
#
#   gh workflow run artifact-nktp-chart.yml --ref pull-request/123
#
# The NVCR package is the same chart named nktp-chart. NVCR cannot take the
# `charts/` path segment GHCR uses (an NGC reference has at most one middle
# segment, and it names a team), and helm push takes the repository's last
# segment from `name:`. Nothing in the chart names a registry of its own, so
# both packages are built here, without credentials, and every registry is
# pushed from them.
#
# A caller of this workflow grants every permission its jobs request:
# contents: read, packages: write, actions: read and security-events: write.
# The NVCR jobs read their NGC org and token from the `nvcr` environment.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch: {}
  workflow_call: {}

permissions: {}

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so two artifact workflows called from one
  # caller would share a group and cancel each other.
  group: Artifact NKTP Chart-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART: nktp/deploy/charts/nktp
  GHCR_CHARTS: ghcr.io/dsx-ai-factory/nvke/charts

jobs:
  resolve:
    if: github.repository_id == '1323115536'
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # git describe needs history and tags
          persist-credentials: false

      # On a vX.Y.Z or vX.Y.Z-beta.N tag this is the tag; between tags, a
      # describe such as v0.24.0-beta.5-3-gabcdef0. With two v* tags on one
      # commit describe names only one, so a tag run that would publish under
      # the other name fails instead. The chart version drops the "v", as OCI
      # chart tags carry none.
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --tags --always --match 'v*' "${GITHUB_SHA}")"
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ && "${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::git describe resolved ${version} for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "chart_version=${version#v}"
          } >> "${GITHUB_OUTPUT}"
          echo "Version ${version}"

  build:
    name: Check and package
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # upload-sarif reads the workflow run
      security-events: write  # the malware scan uploads SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Set up kubeconform
        uses: ./.github/actions/setup-kubeconform

      - name: Check the chart
        run: make nktp-chart-check

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          set -euo pipefail
          helm package "${CHART}" --version "${VERSION}" --destination dist/ghcr

          sed -i -e 's#^name: nktp$#name: nktp-chart#' "${CHART}/Chart.yaml"
          grep -q '^name: nktp-chart$' "${CHART}/Chart.yaml" \
            || { echo "::error::chart rename did not apply"; exit 1; }
          helm package "${CHART}" --version "${VERSION}" --destination dist/nvcr
          ls -lR dist

      - name: Malware scan the chart archives
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'dist'
          category: 'clamav-nktp-release'
          output_file: 'clamav-nktp-release.sarif'

      - name: Upload the charts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nktp-chart
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish-ghcr:
    name: Publish to GHCR
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Download the charts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nktp-chart
          path: dist

      # GHCR takes vX.Y.Z and vX.Y.Z-beta.N tags. Expressions have no regex, so
      # the condition is looser than that: a push is already held to those
      # tags by `on:`, and a dispatch on another v* tag pushes only if the tag
      # has no "-" or carries "-beta.". helm keeps its own registry
      # config rather than writing docker's, so crane, which record-digest
      # uses, needs a docker login as well.
      - name: Push to GHCR
        id: push
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || contains(github.ref_name, '-beta.'))
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          # helm package is not byte-reproducible, so a second run would
          # publish different bytes under a version consumers already resolved.
          if helm show chart "oci://${GHCR_CHARTS}/nktp" --version "${VERSION}" >/dev/null 2>&1; then
            echo "::error::${GHCR_CHARTS}/nktp:${VERSION} is already published"
            exit 1
          fi
          helm push "dist/ghcr/nktp-${VERSION}.tgz" "oci://${GHCR_CHARTS}"

      - name: Record the published digest
        if: steps.push.outcome == 'success'
        uses: ./.github/actions/record-digest
        with:
          references: ${{ env.GHCR_CHARTS }}/nktp:${{ needs.resolve.outputs.chart_version }}
          component: nktp-chart

  publish-nvcr:
    name: Publish to NVCR (${{ matrix.destination }})
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: nvcr
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        destination: [nvke, dsx]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Download the charts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nktp-chart
          path: dist

      # NVKE takes vX.Y.Z and vX.Y.Z-beta.N tags; DSX takes vX.Y.Z only. See the
      # GHCR push for why the condition is looser than that.
      # `$oauthtoken` is NGC's literal username, not a variable reference. The
      # docker login is for crane in record-digest; helm keeps its own.
      - name: Push to NVCR (${{ matrix.destination }})
        id: push
        if: >-
          (matrix.destination == 'nvke' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || contains(github.ref_name, '-beta.'))) ||
          (matrix.destination == 'dsx' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-'))
        shell: bash
        env:
          ORG: ${{ matrix.destination == 'dsx' && vars.DSX_NGC_ORG_TEAM || vars.NVKE_NGC_ORG }}
          ORG_VAR: ${{ matrix.destination == 'dsx' && 'DSX_NGC_ORG_TEAM' || 'NVKE_NGC_ORG' }}
          NGC_TOKEN: ${{ matrix.destination == 'dsx' && secrets.NGC_REGISTRY_TOKEN_DSX || secrets.NGC_REGISTRY_TOKEN_NVKE }}
          VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          set -euo pipefail
          if [[ -z "${ORG}" ]]; then
            echo "::error::${ORG_VAR} is not set in the nvcr environment"
            exit 1
          fi
          repo="nvcr.io/${ORG}"
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | helm registry login nvcr.io --username '$oauthtoken' --password-stdin
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          if helm show chart "oci://${repo}/nktp-chart" --version "${VERSION}" >/dev/null 2>&1; then
            echo "::error::${repo}/nktp-chart:${VERSION} is already published"
            exit 1
          fi
          helm push "dist/nvcr/nktp-chart-${VERSION}.tgz" "oci://${repo}"
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"

      - name: Record the published digest
        if: steps.push.outcome == 'success'
        uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.push.outputs.repo }}/nktp-chart:${{ needs.resolve.outputs.chart_version }}
          component: nktp-chart-${{ matrix.destination }}
