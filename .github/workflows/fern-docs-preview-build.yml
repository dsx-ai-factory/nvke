#
# Workflow 1 of 2 for Fern doc previews (see fern-docs-preview-comment.yml).
#
# Collects fern/ and docs/ sources plus PR metadata and uploads them as an
# artifact. No secrets are used, so this is safe to run on fork PRs.

name: "Preview Fern Docs: Build"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'cli/docs/**'
      - 'controller/docs/**'
      - '.github/workflows/fern-docs-preview-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect Fern sources
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p preview-metadata
          echo "$PR_NUMBER" > preview-metadata/pr_number
          echo "$HEAD_REF" > preview-metadata/head_ref
          git diff --name-only "origin/${BASE_REF}...HEAD" -- '*.md' > preview-metadata/changed_md_files 2>/dev/null || true

      - name: Checkout frozen version content
        run: |
          set -eo pipefail
          for version_file in fern/versions/v*.yml; do
            [ -f "$version_file" ] || continue
            version=$(basename "$version_file" .yml)
            if git show-ref --verify --quiet "refs/tags/${version}"; then
              mkdir -p "fern/versions/${version}-content"
              git archive "refs/tags/${version}" -- docs/ | tar -x --strip-components=1 -C "fern/versions/${version}-content"
              find "fern/versions/${version}-content" -name '*.md' -print0 | while IFS= read -r -d '' f; do
                awk '
                  /^````*/ || /^~~~~*/ { fence = !fence; print; next }
                  fence { print; next }
                  {
                    n = split($0, p, "`")
                    out = ""
                    for (i = 1; i <= n; i++) {
                      if (i % 2 == 1) {
                        gsub(/{/, "\\{", p[i])
                        gsub(/}/, "\\}", p[i])
                        gsub(/</, "\\&lt;", p[i])
                      }
                      out = out p[i]
                      if (i < n) out = out "`"
                    }
                    print out
                  }
                ' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              done
              echo "Extracted docs from $version"
            else
              echo "::error::Tag $version not found — cannot load frozen docs content"
              exit 1
            fi
          done

      - name: Upload Fern sources and metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fern-preview
          # Also the files fern/generators.yml and docs/index.yml read by ../ path.
          path: |
            fern/
            docs/
            cli/docs/
            controller/docs/
            controller/api/openapi.yaml
            preview-metadata/
          retention-days: 1
