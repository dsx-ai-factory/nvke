name: Chart Publish NVCR

# Publishes the controller Helm chart to nvcr.io as an OCI artifact.
# Mirrors chart-publish.yml but targets NVCR for NGC cluster consumers that
# hold NGC pull credentials but not GHCR credentials.
#
# The destination org is not written here. It comes from the `nvcr` environment:
#
#   NKE_NGC_ORG              variable  NGC org id
#   NGC_REGISTRY_TOKEN_NKE   secret    NGC API key with write access on the org
#
# The chart is pushed to nvcr.io/<NKE_NGC_ORG>/charts/controller.
#
# `charts/` is a reserved path segment here for the same reason it is on
# GHCR: the chart is named `controller` and the image it deploys is
# nvcr.io/<NKE_NGC_ORG>/controller, so without the split the two would land
# in one OCI repository, told apart only by whether the tag carries a "v".
#
# Through controller/v0.1.1-rc.1 the chart was named cloud-workflow-engine
# and published at nvcr.io/<NKE_NGC_ORG>/cloud-workflow-engine; those
# versions stay there.

on:
  push:
    branches:
      - main
    tags:
      - "controller/v[0-9]+.[0-9]+.[0-9]+"
      - "controller/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Chart Publish NVCR-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

env:
  CHART: controller/deploy/charts/controller

jobs:
  publish:
    name: Publish chart
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    environment: nvcr
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Resolve version
        id: meta
        shell: bash
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi
          describe="$(git describe --match 'controller/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          describe="${describe#controller/}"
          version="${describe#v}"
          {
            echo "version=${version}"
            echo "app_version=${describe}"
            echo "repo=nvcr.io/${NKE_NGC_ORG}/charts"
          } >> "${GITHUB_OUTPUT}"
          echo "Chart version: ${version}  appVersion: ${describe}  repo: nvcr.io/${NKE_NGC_ORG}/charts"

      # values.yaml defaults to the GHCR image, which is the right default for
      # someone reading the repository. This chart goes to NVCR, so it has to
      # name the NVCR copy instead: GHCR carries release tags only, while NVCR
      # carries every main commit, and this workflow runs on both.
      - name: Point the chart at the NVCR image
        shell: bash
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi

          image="nvcr.io/${NKE_NGC_ORG}/controller"

          # Anchored at exactly two spaces so this hits image.repository and
          # NOT profiles.image.repository, which is nested one level deeper and
          # names an image nke-site-deploy builds. An unanchored `repository:`
          # match would rewrite both.
          sed -i -e "s#^  repository: .*#  repository: ${image}#" \
            "${CHART}/values.yaml"

          # Fail loudly rather than ship a chart naming an image that is not
          # there. A wrong repository here surfaces at install time, to someone
          # who cannot fix it.
          grep -q "^  repository: ${image}\$" "${CHART}/values.yaml" \
            || { echo "::error::image rewrite did not apply"; exit 1; }

          # The pull secret has to move with the registry. values.yaml ships
          # `imagePullSecrets: []` because it defaults to ghcr.io, where an NGC
          # credential is useless; this chart names nvcr.io, so it needs the NGC
          # one back or every pod it creates lands in ImagePullBackOff.
          sed -i -e "s#^imagePullSecrets: \[\]\$#imagePullSecrets:\n  - name: svc-nke-ngc-imagepull#" \
            "${CHART}/values.yaml"
          grep -q "^  - name: svc-nke-ngc-imagepull\$" "${CHART}/values.yaml" \
            || { echo "::error::pull-secret rewrite did not apply"; exit 1; }

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          helm package "${CHART}" \
            --version "${VERSION}" \
            --app-version "${APP_VERSION}" \
            --destination "${RUNNER_TEMP}/chart-dist"
          ls -lh "${RUNNER_TEMP}/chart-dist"

      # $oauthtoken is NGC's literal username, not a shell variable.
      - name: Log in to NVCR
        shell: bash
        env:
          NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | helm registry login nvcr.io \
            --username '$oauthtoken' --password-stdin

      - name: Push chart
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          helm push \
            "${RUNNER_TEMP}/chart-dist/controller-${VERSION}.tgz" \
            "oci://${REPO}"
          echo "Pushed ${REPO}/controller:${VERSION}"
