name: Chart Publish NVCR

# Publishes the controller Helm chart to nvcr.io as an OCI artifact.
# Mirrors chart-publish.yml but targets NVCR for NGC cluster consumers that
# hold NGC pull credentials but not GHCR credentials.
#
# The destination orgs are not written here. They come from the `nvcr`
# environment:
#
#   NVKE_NGC_ORG              variable  NGC org id
#   NGC_REGISTRY_TOKEN_NVKE   secret    NGC API key with write access on the org
#   DSX_NGC_ORG_TEAM         variable  DSX NGC org/team path
#   NGC_REGISTRY_TOKEN_DSX   secret    NGC API key with write access on DSX
#
# The chart is pushed to nvcr.io/<destination>/nvke-controller-chart, so the
# chart is REPACKAGED under the name nvke-controller-chart below. On GHCR the
# same chart publishes as charts/nvke-controller; the NVCR and GHCR paths
# deliberately differ.
#
# NVCR cannot take the `charts/` path segment GHCR uses. An NGC reference is
# nvcr.io/<org>/<repo> or nvcr.io/<org>/<team>/<repo> -- at most one middle
# segment, and it names a TEAM, an access-control object an org owner has to
# create, not a free path component. Pushing to
# nvcr.io/<org>/charts/nvke-controller asks NGC for a team named `charts` that
# does not exist, and the push dies before it reaches the registry:

# A bare vX.Y.Z-beta.N tag only triggers the run. The chart is versioned like any
# other build of that commit: the controller/v* describe version, with the same
# appVersion as the image tag image-nvcr.yml publishes.

# Through controller/v0.1.1-rc.1 the chart was named cloud-workflow-engine and
# published at nvcr.io/<NVKE_NGC_ORG>/cloud-workflow-engine; through the last
# release before this rename it was named controller-chart and published at
# nvcr.io/<NVKE_NGC_ORG>/controller-chart. Both stay where they are.

on:
  push:
    branches:
      - main
    tags:
      - "controller/v[0-9]+.[0-9]+.[0-9]+"
      - "controller/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Chart Publish NVCR-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

env:
  CHART: controller/deploy/charts/controller

jobs:
  publish:
    name: Publish chart (${{ matrix.destination }})
    runs-on: ubuntu-latest
    if: github.repository_id == '1323115536'
    environment: nvcr
    timeout-minutes: 10
    env:
      # A beta is not promoted to DSX, so nothing is published there for one: its
      # chart would name an image that registry never gets. The leg still starts,
      # but every step from the registry login on is skipped.
      SKIP_PUBLISH: ${{ matrix.destination == 'dsx' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: nvke
            org_var: NVKE_NGC_ORG
            # Looked up by name.
            token_secret_var_name: "NGC_REGISTRY_TOKEN_NVKE"
            token_secret_fallback_var_name: "NGC_REGISTRY_TOKEN_NVKE"
            pull_secret: svc-nke-ngc-imagepull
          - destination: dsx
            org_var: DSX_NGC_ORG_TEAM
            token_secret_var_name: "NGC_REGISTRY_TOKEN_DSX"
            token_secret_fallback_var_name: "NGC_REGISTRY_TOKEN_DSX"
            pull_secret: ngc-dsx-registry-creds
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Resolve version
        id: meta
        shell: bash
        env:
          DESTINATION: ${{ matrix.destination }}
          ORG_TEAM: ${{ vars[matrix.org_var] }}
          ORG_VAR: ${{ matrix.org_var }}
        run: |
          set -euo pipefail
          if [[ -z "${ORG_TEAM}" ]]; then
            echo "::error::${ORG_VAR} is not set in the nvcr environment"
            exit 1
          fi

          describe="$(git describe --match 'controller/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          describe="${describe#controller/}"
          version="${describe#v}"
          repo="nvcr.io/${ORG_TEAM}"
          image="${repo}/nvke-controller"

          {
            echo "version=${version}"
            echo "app_version=${describe}"
            echo "repo=${repo}"
            echo "image=${image}"
          } >> "${GITHUB_OUTPUT}"
          echo "${DESTINATION} chart version: ${version}  appVersion: ${describe}  image: ${image}"

      - name: Package chart for NVCR
        id: package
        shell: bash
        env:
          CHART_NAME: nvke-controller-chart
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image }}
          IMAGE_PULL_SECRET: ${{ matrix.pull_secret }}
          CHART_VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          CHART_DIST: ${{ runner.temp }}/chart-dist
        run: |
          set -euo pipefail

          mkdir -p "${CHART_DIST}"

          # helm push takes the destination's last path segment from `name:` in
          # Chart.yaml, not from the push argument. Keep this explicit so image
          # and chart repositories do not accidentally collide in NVCR.
          sed -i -e "s#^name: nvke-controller\$#name: ${CHART_NAME}#" \
            "${CHART}/Chart.yaml"
          grep -q "^name: ${CHART_NAME}\$" "${CHART}/Chart.yaml" \
            || { echo "::error::chart rename did not apply"; exit 1; }

          # Anchored at exactly two spaces so this hits image.repository and not
          # profiles.image.repository, which is nested one level deeper and
          # names an image nke-site-deploy builds.
          sed -i -e "s#^  repository: .*#  repository: ${IMAGE_REPOSITORY}#" \
            "${CHART}/values.yaml"
          grep -q "^  repository: ${IMAGE_REPOSITORY}\$" "${CHART}/values.yaml" \
            || { echo "::error::image rewrite did not apply"; exit 1; }

          sed -i -e "s#^imagePullSecrets: \[\]\$#imagePullSecrets:\n  - name: ${IMAGE_PULL_SECRET}#" \
            "${CHART}/values.yaml"
          grep -q "^  - name: ${IMAGE_PULL_SECRET}\$" "${CHART}/values.yaml" \
            || { echo "::error::pull-secret rewrite did not apply"; exit 1; }

          helm package "${CHART}" \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}" \
            --destination "${CHART_DIST}"

          chart_package="${CHART_DIST}/${CHART_NAME}-${CHART_VERSION}.tgz"
          test -f "${chart_package}" \
            || { echo "::error::${chart_package} was not created"; exit 1; }

          rendered="${CHART_DIST}/${CHART_NAME}-rendered.yaml"
          helm template "${CHART_NAME}" "${chart_package}" > "${rendered}"
          grep -Fq "image: \"${IMAGE_REPOSITORY}:${APP_VERSION}\"" "${rendered}" \
            || { echo "::error::rendered chart does not reference ${IMAGE_REPOSITORY}:${APP_VERSION}"; exit 1; }

          echo "chart_package=${chart_package}" >> "${GITHUB_OUTPUT}"
          ls -lh "${CHART_DIST}"

      # $oauthtoken is NGC's literal username, not a shell variable.
      - name: Log in to NVCR
        if: env.SKIP_PUBLISH != 'true'
        shell: bash
        env:
          NGC_TOKEN: ${{ secrets[matrix.token_secret_var_name] || secrets[matrix.token_secret_fallback_var_name] }}
          TOKEN_SECRET_VAR_NAME: ${{ matrix.token_secret_var_name }}
          TOKEN_SECRET_FALLBACK_VAR_NAME: ${{ matrix.token_secret_fallback_var_name }}
        run: |
          set -euo pipefail
          if [[ -z "${NGC_TOKEN}" ]]; then
            echo "::error::neither ${TOKEN_SECRET_VAR_NAME} nor ${TOKEN_SECRET_FALLBACK_VAR_NAME} is set in the nvcr environment"
            exit 1
          fi
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | helm registry login nvcr.io \
            --username '$oauthtoken' --password-stdin

      # helm keeps its own registry config rather than writing docker's, so
      # the login above is invisible to crane. record-digest below needs a
      # credential it can see; same token, in the place every other tool
      # looks for it. `$oauthtoken` is NGC's literal username.
      - name: Log in to NVCR for crane
        if: env.SKIP_PUBLISH != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets[matrix.token_secret_var_name] || secrets[matrix.token_secret_fallback_var_name] }}

      - name: Push chart
        if: env.SKIP_PUBLISH != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ steps.meta.outputs.repo }}
          CHART_PACKAGE: ${{ steps.package.outputs.chart_package }}
        run: |
          set -euo pipefail
          helm push "${CHART_PACKAGE}" "oci://${REPO}"
          echo "Pushed ${REPO}/nvke-controller-chart:${VERSION}"

      # The chart's whole purpose is to name an image, and both it and the
      # image it names have to be digest-pinned for the candidate to mean
      # anything. helm push reported neither. The component carries the
      # destination: both matrix legs publish the same chart to different
      # orgs and would otherwise collide on the artifact name.
      - name: Record the published digest
        if: env.SKIP_PUBLISH != 'true'
        uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.meta.outputs.repo }}/nvke-controller-chart:${{ steps.meta.outputs.version }}
          component: nvke-controller-chart-${{ matrix.destination }}
