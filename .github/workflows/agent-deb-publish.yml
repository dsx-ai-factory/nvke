#
# Builds the nvke-agent .debs on an agent/v* tag, uploads them to the
# apt-publisher S3 intake, and publishes the same packages to GHCR as an OCI
# artifact (ghcr.io/dsx-ai-factory/nvke/agent-deb) for oras pull. Apt intake is
# tag-only: workflow_dispatch is kept so a failed tag publish can be re-run,
# but branch dispatches never upload. deb.yml exercises the same packaging
# path on every agent change and throws the packages away; this workflow is
# the release side.
#
# Layout written by agent/scripts/upload-s3-apt-intake.sh (consumed by
# nke/packages/apt-publisher):
#
#   <intake>/<project>/releases/<tag>/<distro>/<arch>/<filename>
#   <prefix>/<project>/index.json
#
# The destination is not written here. It comes from the `apt-intake`
# environment, so no bucket name lands in a tracked file of a repository that
# is released publicly:
#
#   APT_INTAKE_S3_URI       variable  e.g. s3://example-bucket/nvke-packages
#   APT_INTAKE_PROJECT      variable  optional; default nvke-agent
#   APT_INTAKE_AWS_ROLE_ARN variable  IAM role assumed via OIDC to write intake
#   APT_INTAKE_AWS_REGION   variable  optional; default us-west-2
#
# Both architectures are built natively (amd64 on ubuntu-24.04, arm64 on
# ubuntu-24.04-arm) for the same reason as deb.yml: cross-compiling flips CGO
# off and produces a static binary that still claims Depends: libc6. A single
# publish job then uploads both packages once so the shared index.json merge
# cannot race with itself. The GHCR and NVCR jobs run in parallel with S3
# publish and do not touch apt intake.
#
# A bare vX.Y.Z-beta.N tag only triggers the run. It builds the commit it names
# and versions the packages like any other build of that commit, by the agent/v*
# describe. They are published to releases/<describe>/ in the apt intake bucket
# (index.json is not updated) and as <describe> tags on NVCR. A beta has no
# GHCR copy.

name: Agent Deb Publish

on:
  push:
    tags:
      - "agent/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: Agent tag or full commit SHA to build
        type: string
        required: true

permissions: {}

env:
  # A beta tag only triggers the run; the source is the commit it names.
  SOURCE_REF: ${{ inputs.ref || (startsWith(github.ref, 'refs/tags/v') && github.sha) || github.ref_name }}

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them.
  group: Agent Deb Publish-${{ inputs.ref || github.ref_name }}
  # Never cancel a publish midway: a half-written index.json leaves apt-publisher
  # with a partial release.
  cancel-in-progress: false

jobs:
  build:
    cache-mode: read
    name: Build the ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    # Tag-only: a branch workflow_dispatch must not produce packages that the
    # publish job (or a later re-enable) could upload into apt intake.
    if: >-
      github.repository_id == '1323115536' &&
      (startsWith(inputs.ref || github.ref_name, 'agent/v') || inputs.ref != '' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    outputs:
      sha: ${{ steps.package.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # upload-sarif reads the workflow run
      security-events: write  # the malware scan uploads SARIF
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Validate source ref
        run: |
          if [[ ! "${SOURCE_REF}" =~ ^(agent/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?|[0-9a-f]{40})$ ]]; then
            echo "::error::ref must be an agent release tag or a full lowercase commit SHA"
            exit 1
          fi
          if [[ "${SOURCE_REF}" == agent/v* && "${GITHUB_REF}" != "refs/tags/${SOURCE_REF}" ]]; then
            echo "::error::Release builds must run from their source tag; select it with --ref"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # DEB_VERSION comes from `git describe --match 'agent/v*'`; a shallow
          # clone would stamp the wrong version into a release package.
          fetch-depth: 0
          persist-credentials: false

      # The one place the version is resolved, for the consumers below. A release
      # tag names it. Anything else is described, the way `make deb` stamps the
      # package: a beta run arrives here with only its commit (see SOURCE_REF).
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SOURCE_REF}" == agent/v* ]]; then
            version="${SOURCE_REF#agent/}"
          else
            version="$(git describe --tags --always --match 'v*' "${GITHUB_SHA}")"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Install the Debian packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev
          dpkg-deb --version | head -1

      - name: Build the package
        working-directory: agent
        run: make deb-${{ matrix.arch }} VERSION=${{ steps.version.outputs.version }}

      - name: Inspect what was produced
        id: package
        working-directory: agent
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bin/*.deb)
          if [ ${#debs[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 package from 'make deb-${{ matrix.arch }}', found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi
          deb="${debs[0]}"

          echo "::group::${deb}"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          echo "::endgroup::"

          pkg=$(dpkg-deb -f "$deb" Package)
          ver=$(dpkg-deb -f "$deb" Version)
          arch=$(dpkg-deb -f "$deb" Architecture)

          [ "$pkg" = "nvke-agent" ] \
            || { echo "::error::${deb}: Package is '${pkg}', expected 'nvke-agent'"; exit 1; }

          case "$ver" in
            [0-9]*) ;;
            *) echo "::error::${deb}: Version '${ver}' does not start with a digit"; exit 1 ;;
          esac

          [ "$arch" = "${{ matrix.arch }}" ] \
            || { echo "::error::${deb}: Architecture is '${arch}', expected '${{ matrix.arch }}'"; exit 1; }

          contents=$(dpkg-deb -c "$deb")
          printf '%s\n' "$contents" | grep -q './usr/local/bin/nvke-agent' \
            || { echo "::error::${deb}: does not contain /usr/local/bin/nvke-agent"; exit 1; }
          printf '%s\n' "$contents" | grep -q './etc/systemd/system/.*\.service' \
            || { echo "::error::${deb}: contains no systemd unit"; exit 1; }

          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/local/bin/nvke-agent > /tmp/nvke-agent
          linkage=$(file -b /tmp/nvke-agent)
          echo "  linkage: ${linkage}"
          case "$linkage" in
            *"dynamically linked"*) ;;
            *) echo "::error::${deb}: the binary is not dynamically linked, so this build was not native and 'Depends: libc6' is wrong for it: ${linkage}"; exit 1 ;;
          esac

          echo "OK  ${deb}  package=${pkg} version=${ver} arch=${arch}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Scanned here rather than in the consumers. Every publish job takes
      # `needs: [build]`, so gating once covers the apt intake and the
      # registries together, and the package cannot reach any of them if it
      # fails.
      - name: Malware scan the package
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'agent/bin'
          # Per architecture: this job is a matrix, and two uploads sharing one
          # category would overwrite each other in the Security tab.
          category: 'clamav-agent-deb-${{ matrix.arch }}'
          output_file: 'clamav-agent-deb.sarif'

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-deb-${{ matrix.arch }}
          path: agent/bin/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to apt intake
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      (startsWith(inputs.ref || github.ref_name, 'agent/v') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-intake
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Resolve intake release
        id: meta
        shell: bash
        env:
          APT_INTAKE_S3_URI: ${{ vars.APT_INTAKE_S3_URI }}
          APT_INTAKE_PROJECT: ${{ vars.APT_INTAKE_PROJECT }}
          APT_INTAKE_AWS_ROLE_ARN: ${{ vars.APT_INTAKE_AWS_ROLE_ARN }}
          APT_INTAKE_AWS_REGION: ${{ vars.APT_INTAKE_AWS_REGION }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_INTAKE_S3_URI}" ]]; then
            echo "::error::APT_INTAKE_S3_URI is not set in the apt-intake environment"
            exit 1
          fi
          if [[ -z "${APT_INTAKE_AWS_ROLE_ARN}" ]]; then
            echo "::error::APT_INTAKE_AWS_ROLE_ARN is not set in the apt-intake environment"
            exit 1
          fi

          project="${APT_INTAKE_PROJECT:-nvke-agent}"
          region="${APT_INTAKE_AWS_REGION:-us-west-2}"

          release="${VERSION}"

          {
            echo "s3_uri=${APT_INTAKE_S3_URI}"
            echo "project=${project}"
            echo "role_arn=${APT_INTAKE_AWS_ROLE_ARN}"
            echo "region=${region}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing ${project} release ${release} to ${APT_INTAKE_S3_URI}"

          echo "::group::packages"
          ls -la agent/bin/*.deb
          echo "::endgroup::"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.meta.outputs.role_arn }}
          aws-region: ${{ steps.meta.outputs.region }}

      - name: Upload to S3 apt intake
        working-directory: agent
        env:
          APT_INTAKE_S3_URI: ${{ steps.meta.outputs.s3_uri }}
          APT_INTAKE_PROJECT: ${{ steps.meta.outputs.project }}
          APT_INTAKE_RELEASE: ${{ steps.meta.outputs.release }}
          # A beta is uploaded under releases/<describe>/ but never enters the index
          # that apt-publisher serves.
          PUBLISH_INDEX_JSON: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')) && 'false' || 'true' }}
          ASSETS_DIR: bin
        run: ./scripts/upload-s3-apt-intake.sh

  publish-dev:
    name: Upload dev packages to S3
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(inputs.ref || github.ref_name, 'agent/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      APT_INTAKE_S3_URI: ${{ vars.AGENT_DEV_S3_URI }}
      APT_INTAKE_PROJECT: nvke-agent
      APT_INTAKE_RELEASE: ${{ needs.build.outputs.sha }}
      DEV_AWS_ROLE_ARN: ${{ vars.AGENT_DEV_AWS_ROLE_ARN }}
    steps:
      - name: Validate dev publication
        run: |
          : "${APT_INTAKE_S3_URI:?Set the AGENT_DEV_S3_URI repository variable}"
          : "${DEV_AWS_ROLE_ARN:?Set the AGENT_DEV_AWS_ROLE_ARN repository variable}"
          if [[ ! "${APT_INTAKE_RELEASE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dev publication requires the full built commit SHA"
            exit 1
          fi

      - name: Checkout uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_DEV_AWS_REGION || 'us-west-2' }}

      - name: Upload dev packages
        working-directory: agent
        env:
          PUBLISH_INDEX_JSON: "false"
          ASSETS_DIR: bin
        run: ./scripts/upload-s3-apt-intake.sh

  # OCI copy of the same two packages the apt intake receives. The Packer
  # reference OS image pulls from here with oras (see os-image/packer/scripts/fetch-artifacts.sh).
  # Filename is always nvke-agent.deb so `oras pull` writes a stable path.
  publish-ghcr:
    name: Publish debs to GHCR
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      startsWith(inputs.ref || github.ref_name, 'agent/v') &&
      contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), ',agent,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: ghcr.io/dsx-ai-factory/nvke/agent-deb
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      # This job publishes downloaded artefacts and otherwise needs no source, so
      # it checks out only the two paths that hold the version pins. Without it
      # there is no Makefile to read and the step below cannot run. It runs
      # before the download: a first checkout deletes the workspace contents.
      - name: Check out the version pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            make
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # --artifact-platform is still marked experimental in the ORAS CLI. It is
      # load-bearing: without it the manifest has no platform in its config and
      # `oras manifest index create` cannot tell the two packages apart.
      - name: Push per-architecture packages
        env:
          VERSION: ${{ env.SOURCE_REF }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi

          for deb in "${debs[@]}"; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            work="$(mktemp -d)"
            cp "$deb" "${work}/nvke-agent.deb"
            ( cd "${work}" && oras push "${REPO}:${version}-${arch}" \
                --artifact-type application/vnd.nvidia.nvke.agent.deb.v1 \
                --artifact-platform "linux/${arch}" \
                --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
                --annotation "org.opencontainers.image.version=${version}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nvke-agent.deb" \
                nvke-agent.deb:application/vnd.debian.binary-package )
            rm -rf "${work}"
          done

          oras manifest index create "${REPO}:${version}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${version}" \
            "${version}-amd64" "${version}-arm64"

      - name: Show published index
        env:
          VERSION: ${{ env.SOURCE_REF }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          oras manifest fetch --pretty "${REPO}:${version}"

  # Mirrors publish-ghcr for NVCR -- same packages, same tags, same index
  # shape, different registry and login.
  publish-nvcr:
    name: Publish debs to NVCR
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      (startsWith(inputs.ref || github.ref_name, 'agent/v') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
    environment: nvcr
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the version pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            make
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Read pinned tool versions
        id: versions
        run: |
          echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Resolve repo
        id: meta
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NVKE_NGC_ORG}" ]]; then
            echo "::error::NVKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi
          echo "repo=nvcr.io/${NVKE_NGC_ORG}/nvke-agent-deb" >> "${GITHUB_OUTPUT}"

      # `$oauthtoken` is NGC's literal username, not a shell variable.
      - name: Log in to NVCR
        env:
          NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | oras login nvcr.io \
            --username '$oauthtoken' --password-stdin

      - name: Push per-architecture packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            exit 1
          fi

          for deb in "${debs[@]}"; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            work="$(mktemp -d)"
            cp "$deb" "${work}/nvke-agent.deb"
            ( cd "${work}" && oras push "${REPO}:${version}-${arch}" \
                --artifact-type application/vnd.nvidia.nvke.agent.deb.v1 \
                --artifact-platform "linux/${arch}" \
                --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
                --annotation "org.opencontainers.image.version=${version}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nvke-agent.deb" \
                nvke-agent.deb:application/vnd.debian.binary-package )
            rm -rf "${work}"
          done

          oras manifest index create "${REPO}:${version}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${version}" \
            "${version}-amd64" "${version}-arm64"

      - name: Show published index
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          oras manifest fetch --pretty "${REPO}:${version}"
