# SPDX-License-Identifier: Apache-2.0
#
# Builds the nke-agent .debs on an agent/v* tag, uploads them to the
# apt-publisher S3 intake, attaches both packages as assets on a GitHub
# Release for that tag, and publishes the same packages to GHCR as an OCI
# artifact (ghcr.io/dsx-ai-factory/nke/agent-deb) for oras pull. Apt intake is
# tag-only: workflow_dispatch is kept so a failed tag publish can be re-run,
# but branch dispatches never upload. deb.yml exercises the same packaging
# path on every agent change and throws the packages away; this workflow is
# the release side.
#
# Layout written by agent/scripts/upload-s3-apt-intake.sh (consumed by
# nke/packages/apt-publisher):
#
#   <intake>/<project>/releases/<tag>/<distro>/<arch>/<filename>
#   <prefix>/<project>/index.json
#
# The destination is not written here. It comes from the `apt-intake`
# environment, so no bucket name lands in a tracked file of a repository that
# is released publicly:
#
#   APT_INTAKE_S3_URI       variable  e.g. s3://example-bucket/nke-packages
#   APT_INTAKE_PROJECT      variable  optional; default nke-agent
#   APT_INTAKE_AWS_ROLE_ARN variable  IAM role assumed via OIDC to write intake
#   APT_INTAKE_AWS_REGION   variable  optional; default us-west-2
#
# Both architectures are built natively (amd64 on ubuntu-24.04, arm64 on
# ubuntu-24.04-arm) for the same reason as deb.yml: cross-compiling flips CGO
# off and produces a static binary that still claims Depends: libc6. A single
# publish job then uploads both packages once so the shared index.json merge
# cannot race with itself. The GitHub Release job and the GHCR job run in
# parallel with S3 publish and do not touch apt intake.

name: Agent Deb Publish

on:
  push:
    tags:
      - "agent/v[0-9]+.[0-9]+.[0-9]+"
      - "agent/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them.
  group: Agent Deb Publish-${{ github.ref }}
  # Never cancel a publish midway: a half-written index.json leaves apt-publisher
  # with a partial release.
  cancel-in-progress: false

jobs:
  build:
    name: Build the ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    # Tag-only: a branch workflow_dispatch must not produce packages that the
    # publish job (or a later re-enable) could upload into apt intake.
    if: >-
      github.repository == 'dsx-ai-factory/nke' &&
      startsWith(github.ref, 'refs/tags/agent/v')
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # the malware scan uploads SARIF
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DEB_VERSION comes from `git describe --match 'agent/v*'`; a shallow
          # clone would stamp the wrong version into a release package.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Install the Debian packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev
          dpkg-deb --version | head -1

      - name: Build the package
        working-directory: agent
        run: make deb-${{ matrix.arch }}

      - name: Inspect what was produced
        working-directory: agent
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bin/*.deb)
          if [ ${#debs[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 package from 'make deb-${{ matrix.arch }}', found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi
          deb="${debs[0]}"

          echo "::group::${deb}"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          echo "::endgroup::"

          pkg=$(dpkg-deb -f "$deb" Package)
          ver=$(dpkg-deb -f "$deb" Version)
          arch=$(dpkg-deb -f "$deb" Architecture)

          [ "$pkg" = "nke-agent" ] \
            || { echo "::error::${deb}: Package is '${pkg}', expected 'nke-agent'"; exit 1; }

          case "$ver" in
            [0-9]*) ;;
            *) echo "::error::${deb}: Version '${ver}' does not start with a digit"; exit 1 ;;
          esac

          [ "$arch" = "${{ matrix.arch }}" ] \
            || { echo "::error::${deb}: Architecture is '${arch}', expected '${{ matrix.arch }}'"; exit 1; }

          contents=$(dpkg-deb -c "$deb")
          printf '%s\n' "$contents" | grep -q './usr/local/bin/nke-agent' \
            || { echo "::error::${deb}: does not contain /usr/local/bin/nke-agent"; exit 1; }
          printf '%s\n' "$contents" | grep -q './etc/systemd/system/.*\.service' \
            || { echo "::error::${deb}: contains no systemd unit"; exit 1; }

          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/local/bin/nke-agent > /tmp/nke-agent
          linkage=$(file -b /tmp/nke-agent)
          echo "  linkage: ${linkage}"
          case "$linkage" in
            *"dynamically linked"*) ;;
            *) echo "::error::${deb}: the binary is not dynamically linked, so this build was not native and 'Depends: libc6' is wrong for it: ${linkage}"; exit 1 ;;
          esac

          echo "OK  ${deb}  package=${pkg} version=${ver} arch=${arch}"

      # Scanned here rather than in the two consumers. `publish` and
      # `github-release` both take `needs: [build]`, so gating once covers the
      # apt intake and the GitHub release together, and the package cannot
      # reach either if it fails.
      - name: Malware scan the package
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'agent/bin'
          # Per architecture: this job is a matrix, and two uploads sharing one
          # category would overwrite each other in the Security tab.
          category: 'clamav-agent-deb-${{ matrix.arch }}'
          output_file: 'clamav-agent-deb.sarif'

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-deb-${{ matrix.arch }}
          path: agent/bin/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to apt intake
    needs: [build]
    # Same tag gate as build: never ingest from a branch (including
    # workflow_dispatch on main). Re-run from the agent/v* tag only.
    if: >-
      github.repository == 'dsx-ai-factory/nke' &&
      startsWith(github.ref, 'refs/tags/agent/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-intake
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Resolve intake release
        id: meta
        shell: bash
        env:
          APT_INTAKE_S3_URI: ${{ vars.APT_INTAKE_S3_URI }}
          APT_INTAKE_PROJECT: ${{ vars.APT_INTAKE_PROJECT }}
          APT_INTAKE_AWS_ROLE_ARN: ${{ vars.APT_INTAKE_AWS_ROLE_ARN }}
          APT_INTAKE_AWS_REGION: ${{ vars.APT_INTAKE_AWS_REGION }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_INTAKE_S3_URI}" ]]; then
            echo "::error::APT_INTAKE_S3_URI is not set in the apt-intake environment"
            exit 1
          fi
          if [[ -z "${APT_INTAKE_AWS_ROLE_ARN}" ]]; then
            echo "::error::APT_INTAKE_AWS_ROLE_ARN is not set in the apt-intake environment"
            exit 1
          fi

          project="${APT_INTAKE_PROJECT:-nke-agent}"
          region="${APT_INTAKE_AWS_REGION:-us-west-2}"

          # Tag refs are agent/vX.Y.Z; the intake release key and apt-publisher
          # expect the unprefixed form (vX.Y.Z), matching DEB_VERSION's source.
          # Job-level if already requires refs/tags/agent/v*; no branch/sha path.
          release="${GITHUB_REF_NAME#agent/}"

          {
            echo "s3_uri=${APT_INTAKE_S3_URI}"
            echo "project=${project}"
            echo "role_arn=${APT_INTAKE_AWS_ROLE_ARN}"
            echo "region=${region}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing ${project} release ${release} to ${APT_INTAKE_S3_URI}"

          echo "::group::packages"
          ls -la agent/bin/*.deb
          echo "::endgroup::"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.meta.outputs.role_arn }}
          aws-region: ${{ steps.meta.outputs.region }}

      - name: Upload to S3 apt intake
        working-directory: agent
        env:
          APT_INTAKE_S3_URI: ${{ steps.meta.outputs.s3_uri }}
          APT_INTAKE_PROJECT: ${{ steps.meta.outputs.project }}
          APT_INTAKE_RELEASE: ${{ steps.meta.outputs.release }}
          ASSETS_DIR: bin
        run: ./scripts/upload-s3-apt-intake.sh

  # OCI copy of the same two packages the GitHub Release attaches. The Packer
  # reference OS image pulls from here with oras (see os-image/packer/scripts/fetch-artifacts.sh).
  # Filename is always nke-agent.deb so `oras pull` writes a stable path.
  publish-ghcr:
    name: Publish debs to GHCR
    needs: [build]
    if: >-
      github.repository == 'dsx-ai-factory/nke' &&
      startsWith(github.ref, 'refs/tags/agent/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: ghcr.io/dsx-ai-factory/nke/agent-deb
    permissions:
      contents: read
      packages: write
    steps:
      # This job publishes downloaded artefacts and otherwise needs no source, so
      # it checks out only the two paths that hold the version pins. Without it
      # there is no Makefile to read and the step below cannot run. It runs
      # before the download: a first checkout deletes the workspace contents.
      - name: Check out the version pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            make
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # --artifact-platform is still marked experimental in the ORAS CLI. It is
      # load-bearing: without it the manifest has no platform in its config and
      # `oras manifest index create` cannot tell the two packages apart.
      - name: Push per-architecture packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi

          for deb in "${debs[@]}"; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            work="$(mktemp -d)"
            cp "$deb" "${work}/nke-agent.deb"
            ( cd "${work}" && oras push "${REPO}:${version}-${arch}" \
                --artifact-type application/vnd.nvidia.nke.agent.deb.v1 \
                --artifact-platform "linux/${arch}" \
                --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.version=${version}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nke-agent.deb" \
                nke-agent.deb:application/vnd.debian.binary-package )
            rm -rf "${work}"
          done

          oras manifest index create "${REPO}:${version}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${version}" \
            "${version}-amd64" "${version}-arm64"

      - name: Show published index
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          oras manifest fetch --pretty "${REPO}:${version}"

  # Mirrors publish-ghcr for NVCR -- same packages, same tags, same index
  # shape, different registry and login.
  publish-nvcr:
    name: Publish debs to NVCR
    needs: [build]
    if: >-
      github.repository == 'dsx-ai-factory/nke' &&
      startsWith(github.ref, 'refs/tags/agent/v')
    runs-on: ubuntu-latest
    environment: nvcr
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the version pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            make
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Read pinned tool versions
        id: versions
        run: |
          echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Resolve repo
        id: meta
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi
          echo "repo=nvcr.io/${NKE_NGC_ORG}/nke-agent-deb" >> "${GITHUB_OUTPUT}"

      # `$oauthtoken` is NGC's literal username, not a shell variable.
      - name: Log in to NVCR
        env:
          NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | oras login nvcr.io \
            --username '$oauthtoken' --password-stdin

      - name: Push per-architecture packages
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            exit 1
          fi

          for deb in "${debs[@]}"; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            work="$(mktemp -d)"
            cp "$deb" "${work}/nke-agent.deb"
            ( cd "${work}" && oras push "${REPO}:${version}-${arch}" \
                --artifact-type application/vnd.nvidia.nke.agent.deb.v1 \
                --artifact-platform "linux/${arch}" \
                --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.version=${version}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nke-agent.deb" \
                nke-agent.deb:application/vnd.debian.binary-package )
            rm -rf "${work}"
          done

          oras manifest index create "${REPO}:${version}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${version}" \
            "${version}-amd64" "${version}-arm64"

      - name: Show published index
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          oras manifest fetch --pretty "${REPO}:${version}"

  # Separate from apt intake so the release job does not need the apt-intake
  # environment or id-token. Runs only on agent/v* tag pushes (not branch
  # workflow_dispatch). make_latest stays false so a component release never
  # becomes the repository "latest" over a bare vX.Y.Z release.
  github-release:
    name: Attach debs to GitHub Release
    needs: [build]
    if: >-
      github.repository == 'dsx-ai-factory/nke' &&
      startsWith(github.ref, 'refs/tags/agent/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only for agent/THIRD_PARTY_NOTICES.md, which is attached below and
      # cannot be produced from the build artifacts. It runs BEFORE the download:
      # a first checkout deletes the workspace contents, which `clean: false`
      # does not prevent.
      - name: Checkout for the notices file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
          sparse-checkout: agent/THIRD_PARTY_NOTICES.md
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Inspect packages
        id: meta
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi
          ls -la "${debs[@]}"

          # Attribution has to be present before the release is built, not
          # discovered missing after it is sealed.
          if [ ! -f agent/THIRD_PARTY_NOTICES.md ]; then
            echo "::error::agent/THIRD_PARTY_NOTICES.md is missing; the checkout step above did not fetch it"
            exit 1
          fi

          # Hash the packages and the notices together, so one file covers
          # everything a consumer downloads. Names are relative because
          # `sha256sum -c` resolves them against the working directory, and a
          # consumer runs it from wherever they unpacked the release.
          ( cd agent/bin && sha256sum -- *.deb > checksums.txt )
          cp agent/THIRD_PARTY_NOTICES.md agent/bin/THIRD_PARTY_NOTICES.md
          ( cd agent/bin && sha256sum -- THIRD_PARTY_NOTICES.md >> checksums.txt )
          echo "checksums.txt:"
          sed 's/^/    /' agent/bin/checksums.txt

          # Tag is agent/vX.Y.Z; title uses "agent vX.Y.Z" to match AGENTS.md.
          version="${GITHUB_REF_NAME#agent/}"
          {
            echo "version=${version}"
            echo "release_name=agent ${version}"
          } >> "${GITHUB_OUTPUT}"

      # The release is created as a draft so the packages upload before it is
      # published. If a repository has release immutability turned on, GitHub
      # seals the release when it is published and rejects any asset uploaded
      # after that.
      #
      # The action does not publish a draft, so the step below publishes it.
      # Do not remove that step.
      - name: Create or update GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: true
          body: |
            nke-agent ${{ steps.meta.outputs.version }} Debian packages (amd64 and arm64).

            Apt install path is the apt-publisher intake from this same workflow; these assets are the same `.deb`s attached for direct download.

            Verify a download with `sha256sum -c checksums.txt`. That proves the
            file arrived intact; it does not prove provenance, because nke does
            not sign release artifacts yet.
          files: |
            agent/bin/*.deb
            agent/bin/checksums.txt
            agent/bin/THIRD_PARTY_NOTICES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: false
          generate_release_notes: false

      # The packages are checked before the release is published, because
      # publishing it is what seals it. An agent/v* tag also runs release.yml,
      # which creates a release for the same tag, so the two workflows can
      # reach the same release object.
      # Counting .deb files proved one arrived, not that it arrived whole: an
      # asset reports 'uploaded' with a non-zero size even when the upload was
      # truncated. The shared action reads every asset back and hashes it
      # against checksums.txt, which is the bar release.yml already held.
      - name: Verify the release assets
        uses: ./.github/actions/verify-release-assets
        with:
          release-id: ${{ steps.release.outputs.id }}
          checksums: agent/bin/checksums.txt
          github-token: ${{ github.token }}

      - name: Publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);

            const { data: rel } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });

            const debs = rel.assets.filter(a => a.name.endsWith('.deb'));
            if (debs.length < 2) {
              core.setFailed(
                `release ${release_id} carries ${debs.length} .deb files, expected 2. ` +
                `It is left as an unpublished draft. Delete it before re-pushing the tag.`);
              return;
            }

            if (rel.draft) {
              // make_latest has to be repeated here. GitHub defaults it to
              // true when a release is published, so leaving it out would give
              // an agent release the repository's "Latest release" badge, which
              // is what make_latest: false on the step above exists to prevent.
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, draft: false, make_latest: 'false',
              });
            }
            core.info(`Published ${context.ref.replace('refs/tags/', '')} with ${debs.length} packages.`);
