# SPDX-License-Identifier: Apache-2.0
#
# Builds the nvke-agent .debs on an agent/v* tag, uploads them to the
# apt-publisher S3 intake, attaches both packages as assets on a GitHub
# Release for that tag, and publishes the same packages to GHCR as an OCI
# artifact (ghcr.io/dsx-ai-factory/nvke/agent-deb) for oras pull. Apt intake is
# tag-only: workflow_dispatch is kept so a failed tag publish can be re-run,
# but branch dispatches never upload. deb.yml exercises the same packaging
# path on every agent change and throws the packages away; this workflow is
# the release side.
#
# Layout written by agent/scripts/upload-s3-apt-intake.sh (consumed by
# nke/packages/apt-publisher):
#
#   <intake>/<project>/releases/<tag>/<distro>/<arch>/<filename>
#   <prefix>/<project>/index.json
#
# The destination is not written here. It comes from the `apt-intake`
# environment, so no bucket name lands in a tracked file of a repository that
# is released publicly:
#
#   APT_INTAKE_S3_URI       variable  e.g. s3://example-bucket/nvke-packages
#   APT_INTAKE_PROJECT      variable  optional; default nvke-agent
#   APT_INTAKE_AWS_ROLE_ARN variable  IAM role assumed via OIDC to write intake
#   APT_INTAKE_AWS_REGION   variable  optional; default us-west-2
#
# Both architectures are built natively (amd64 on ubuntu-24.04, arm64 on
# ubuntu-24.04-arm) for the same reason as deb.yml: cross-compiling flips CGO
# off and produces a static binary that still claims Depends: libc6. A single
# publish job then uploads both packages once so the shared index.json merge
# cannot race with itself. The GitHub Release job and the GHCR job run in
# parallel with S3 publish and do not touch apt intake.
#
# A bare vX.Y.Z-beta.N tag only triggers the run. It builds the commit it names
# and versions the packages like any other build of that commit, by the agent/v*
# describe. They are published to releases/<describe>/ in the apt intake bucket
# (index.json is not updated) and as <describe> tags on NVCR. A beta has no
# GitHub Release and no GHCR copy.

name: Agent Deb Publish

on:
  push:
    tags:
      - "agent/v[0-9]+.[0-9]+.[0-9]+"
      - "agent/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: Agent tag or full commit SHA to build
        type: string
        required: true

permissions: {}

env:
  # A beta tag only triggers the run; the source is the commit it names.
  SOURCE_REF: ${{ inputs.ref || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.') && github.sha) || github.ref_name }}

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them.
  group: Agent Deb Publish-${{ inputs.ref || github.ref_name }}
  # Never cancel a publish midway: a half-written index.json leaves apt-publisher
  # with a partial release.
  cancel-in-progress: false

jobs:
  build:
    cache-mode: read
    name: Build the ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    # Tag-only: a branch workflow_dispatch must not produce packages that the
    # publish job (or a later re-enable) could upload into apt intake.
    if: >-
      github.repository_id == '1323115536' &&
      (startsWith(inputs.ref || github.ref_name, 'agent/v') || inputs.ref != '' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')))
    outputs:
      sha: ${{ steps.package.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # upload-sarif reads the workflow run
      security-events: write  # the malware scan uploads SARIF
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Validate source ref
        run: |
          if [[ ! "${SOURCE_REF}" =~ ^(agent/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?|[0-9a-f]{40})$ ]]; then
            echo "::error::ref must be an agent release tag or a full lowercase commit SHA"
            exit 1
          fi
          if [[ "${SOURCE_REF}" == agent/v* && "${GITHUB_REF}" != "refs/tags/${SOURCE_REF}" ]]; then
            echo "::error::Release builds must run from their source tag; select it with --ref"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # DEB_VERSION comes from `git describe --match 'agent/v*'`; a shallow
          # clone would stamp the wrong version into a release package.
          fetch-depth: 0
          persist-credentials: false

      # The one place the version is resolved, for the consumers below. A release
      # tag names it. Anything else is described, the way `make deb` stamps the
      # package: a beta run arrives here with only its commit (see SOURCE_REF).
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SOURCE_REF}" == agent/v* ]]; then
            version="${SOURCE_REF#agent/}"
          else
            version="$(git describe --match 'agent/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
            version="${version#agent/}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Install the Debian packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev
          dpkg-deb --version | head -1

      - name: Build the package
        working-directory: agent
        run: make deb-${{ matrix.arch }}

      - name: Inspect what was produced
        id: package
        working-directory: agent
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bin/*.deb)
          if [ ${#debs[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 package from 'make deb-${{ matrix.arch }}', found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi
          deb="${debs[0]}"

          echo "::group::${deb}"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          echo "::endgroup::"

          pkg=$(dpkg-deb -f "$deb" Package)
          ver=$(dpkg-deb -f "$deb" Version)
          arch=$(dpkg-deb -f "$deb" Architecture)

          [ "$pkg" = "nvke-agent" ] \
            || { echo "::error::${deb}: Package is '${pkg}', expected 'nvke-agent'"; exit 1; }

          case "$ver" in
            [0-9]*) ;;
            *) echo "::error::${deb}: Version '${ver}' does not start with a digit"; exit 1 ;;
          esac

          [ "$arch" = "${{ matrix.arch }}" ] \
            || { echo "::error::${deb}: Architecture is '${arch}', expected '${{ matrix.arch }}'"; exit 1; }

          contents=$(dpkg-deb -c "$deb")
          printf '%s\n' "$contents" | grep -q './usr/local/bin/nvke-agent' \
            || { echo "::error::${deb}: does not contain /usr/local/bin/nvke-agent"; exit 1; }
          printf '%s\n' "$contents" | grep -q './etc/systemd/system/.*\.service' \
            || { echo "::error::${deb}: contains no systemd unit"; exit 1; }

          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/local/bin/nvke-agent > /tmp/nvke-agent
          linkage=$(file -b /tmp/nvke-agent)
          echo "  linkage: ${linkage}"
          case "$linkage" in
            *"dynamically linked"*) ;;
            *) echo "::error::${deb}: the binary is not dynamically linked, so this build was not native and 'Depends: libc6' is wrong for it: ${linkage}"; exit 1 ;;
          esac

          echo "OK  ${deb}  package=${pkg} version=${ver} arch=${arch}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Scanned here rather than in the two consumers. `publish` and
      # `github-release` both take `needs: [build]`, so gating once covers the
      # apt intake and the GitHub release together, and the package cannot
      # reach either if it fails.
      - name: Malware scan the package
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'agent/bin'
          # Per architecture: this job is a matrix, and two uploads sharing one
          # category would overwrite each other in the Security tab.
          category: 'clamav-agent-deb-${{ matrix.arch }}'
          output_file: 'clamav-agent-deb.sarif'

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-deb-${{ matrix.arch }}
          path: agent/bin/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to apt intake
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      (startsWith(inputs.ref || github.ref_name, 'agent/v') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-intake
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Resolve intake release
        id: meta
        shell: bash
        env:
          APT_INTAKE_S3_URI: ${{ vars.APT_INTAKE_S3_URI }}
          APT_INTAKE_PROJECT: ${{ vars.APT_INTAKE_PROJECT }}
          APT_INTAKE_AWS_ROLE_ARN: ${{ vars.APT_INTAKE_AWS_ROLE_ARN }}
          APT_INTAKE_AWS_REGION: ${{ vars.APT_INTAKE_AWS_REGION }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_INTAKE_S3_URI}" ]]; then
            echo "::error::APT_INTAKE_S3_URI is not set in the apt-intake environment"
            exit 1
          fi
          if [[ -z "${APT_INTAKE_AWS_ROLE_ARN}" ]]; then
            echo "::error::APT_INTAKE_AWS_ROLE_ARN is not set in the apt-intake environment"
            exit 1
          fi

          project="${APT_INTAKE_PROJECT:-nvke-agent}"
          region="${APT_INTAKE_AWS_REGION:-us-west-2}"

          release="${VERSION}"

          {
            echo "s3_uri=${APT_INTAKE_S3_URI}"
            echo "project=${project}"
            echo "role_arn=${APT_INTAKE_AWS_ROLE_ARN}"
            echo "region=${region}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing ${project} release ${release} to ${APT_INTAKE_S3_URI}"

          echo "::group::packages"
          ls -la agent/bin/*.deb
          echo "::endgroup::"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.meta.outputs.role_arn }}
          aws-region: ${{ steps.meta.outputs.region }}

      - name: Upload to S3 apt intake
        working-directory: agent
        env:
          APT_INTAKE_S3_URI: ${{ steps.meta.outputs.s3_uri }}
          APT_INTAKE_PROJECT: ${{ steps.meta.outputs.project }}
          APT_INTAKE_RELEASE: ${{ steps.meta.outputs.release }}
          # A beta is uploaded under releases/<describe>/ but never enters the index
          # that apt-publisher serves.
          PUBLISH_INDEX_JSON: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')) && 'false' || 'true' }}
          ASSETS_DIR: bin
        run: ./scripts/upload-s3-apt-intake.sh

  publish-dev:
    name: Upload dev packages to S3
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(inputs.ref || github.ref_name, 'agent/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      APT_INTAKE_S3_URI: ${{ vars.AGENT_DEV_S3_URI }}
      APT_INTAKE_PROJECT: nvke-agent
      APT_INTAKE_RELEASE: ${{ needs.build.outputs.sha }}
      DEV_AWS_ROLE_ARN: ${{ vars.AGENT_DEV_AWS_ROLE_ARN }}
    steps:
      - name: Validate dev publication
        run: |
          : "${APT_INTAKE_S3_URI:?Set the AGENT_DEV_S3_URI repository variable}"
          : "${DEV_AWS_ROLE_ARN:?Set the AGENT_DEV_AWS_ROLE_ARN repository variable}"
          if [[ ! "${APT_INTAKE_RELEASE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dev publication requires the full built commit SHA"
            exit 1
          fi

      - name: Checkout uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_DEV_AWS_REGION || 'us-west-2' }}

      - name: Upload dev packages
        working-directory: agent
        env:
          PUBLISH_INDEX_JSON: "false"
          ASSETS_DIR: bin
        run: ./scripts/upload-s3-apt-intake.sh

  # OCI copy of the same two packages the GitHub Release attaches. The Packer
  # reference OS image pulls from here with oras (see os-image/packer/scripts/fetch-artifacts.sh).
  # Filename is always nvke-agent.deb so `oras pull` writes a stable path.
  publish-ghcr:
    name: Publish debs to GHCR
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      startsWith(inputs.ref || github.ref_name, 'agent/v') &&
      contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), ',agent,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: ghcr.io/dsx-ai-factory/nvke/agent-deb
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      # This job publishes downloaded artefacts and otherwise needs no source, so
      # it checks out only the two paths that hold the version pins. Without it
      # there is no Makefile to read and the step below cannot run. It runs
      # before the download: a first checkout deletes the workspace contents.
      - name: Check out the version pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            make
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # --artifact-platform is still marked experimental in the ORAS CLI. It is
      # load-bearing: without it the manifest has no platform in its config and
      # `oras manifest index create` cannot tell the two packages apart.
      - name: Push per-architecture packages
        env:
          VERSION: ${{ env.SOURCE_REF }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi

          for deb in "${debs[@]}"; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            work="$(mktemp -d)"
            cp "$deb" "${work}/nvke-agent.deb"
            ( cd "${work}" && oras push "${REPO}:${version}-${arch}" \
                --artifact-type application/vnd.nvidia.nvke.agent.deb.v1 \
                --artifact-platform "linux/${arch}" \
                --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
                --annotation "org.opencontainers.image.version=${version}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nvke-agent.deb" \
                nvke-agent.deb:application/vnd.debian.binary-package )
            rm -rf "${work}"
          done

          oras manifest index create "${REPO}:${version}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${version}" \
            "${version}-amd64" "${version}-arm64"

      - name: Show published index
        env:
          VERSION: ${{ env.SOURCE_REF }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          oras manifest fetch --pretty "${REPO}:${version}"

  # Mirrors publish-ghcr for NVCR -- same packages, same tags, same index
  # shape, different registry and login.
  publish-nvcr:
    name: Publish debs to NVCR
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      (startsWith(inputs.ref || github.ref_name, 'agent/v') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')))
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
    environment: nvcr
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the version pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Makefile
            make
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      - name: Read pinned tool versions
        id: versions
        run: |
          echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Resolve repo
        id: meta
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NVKE_NGC_ORG}" ]]; then
            echo "::error::NVKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi
          echo "repo=nvcr.io/${NVKE_NGC_ORG}/nvke-agent-deb" >> "${GITHUB_OUTPUT}"

      # `$oauthtoken` is NGC's literal username, not a shell variable.
      - name: Log in to NVCR
        env:
          NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | oras login nvcr.io \
            --username '$oauthtoken' --password-stdin

      - name: Push per-architecture packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            exit 1
          fi

          for deb in "${debs[@]}"; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            work="$(mktemp -d)"
            cp "$deb" "${work}/nvke-agent.deb"
            ( cd "${work}" && oras push "${REPO}:${version}-${arch}" \
                --artifact-type application/vnd.nvidia.nvke.agent.deb.v1 \
                --artifact-platform "linux/${arch}" \
                --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
                --annotation "org.opencontainers.image.version=${version}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nvke-agent.deb" \
                nvke-agent.deb:application/vnd.debian.binary-package )
            rm -rf "${work}"
          done

          oras manifest index create "${REPO}:${version}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${version}" \
            "${version}-amd64" "${version}-arm64"

      - name: Show published index
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          version="${VERSION#agent/}"
          oras manifest fetch --pretty "${REPO}:${version}"

  # Separate from apt intake so the release job does not need the apt-intake
  # environment or its credentials -- the id-token below is the Actions OIDC
  # token the attestation is signed against, which is scoped to this workflow
  # and gives no access to anything. Runs only on agent/v* tag pushes (not branch
  # workflow_dispatch). make_latest stays false so a component release never
  # becomes the repository "latest" over a bare vX.Y.Z release.
  github-release:
    name: Attach debs to GitHub Release
    needs: [build]
    if: >-
      github.repository_id == '1323115536' &&
      startsWith(inputs.ref || github.ref_name, 'agent/v') &&
      contains(format(',{0},', vars.NVKE_GITHUB_PUBLISH || 'root,controller,cli,agent,cluster-api-provider-provisioned,nktp'), ',agent,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write       # the OIDC token the attestation is signed against
      attestations: write   # writes the provenance attestation
    steps:
      # For the local verify-release-assets action, for
      # agent/THIRD_PARTY_NOTICES.md, which is attached below and cannot be
      # produced from the build artifacts, and for the make files the syft pin
      # is read from. It runs BEFORE the download: a first checkout deletes the
      # workspace contents, which `clean: false` does not prevent.
      - name: Checkout for the notices file and the tool pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
          ref: ${{ needs.build.outputs.sha }}
          sparse-checkout: |
            agent/THIRD_PARTY_NOTICES.md
            .github/actions/verify-release-assets
            Makefile
            make
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-deb-*
          merge-multiple: true
          path: agent/bin

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read the pinned syft version
        id: versions
        shell: bash
        run: echo "syft_version=$(make --no-print-directory print-SYFT_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ steps.versions.outputs.syft_version }}

      - name: Inspect packages
        id: meta
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(agent/bin/*.deb)
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected exactly 2 packages (amd64 + arm64), found ${#debs[@]}"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi
          ls -la "${debs[@]}"

          # Attribution has to be present before the release is built, not
          # discovered missing after it is sealed.
          if [ ! -f agent/THIRD_PARTY_NOTICES.md ]; then
            echo "::error::agent/THIRD_PARTY_NOTICES.md is missing; the checkout step above did not fetch it"
            exit 1
          fi

          # One SPDX document per package, from the package's own contents.
          #
          # syft reads a .deb directly, but a deb-archive scan yields only the
          # control metadata -- one entry, "nvke-agent <version>", which a
          # consumer already knows from the filename. The question this exists
          # to answer is which components are inside, so the archive is
          # unpacked first and the extracted tree scanned: that reaches the
          # Go build info the linker embedded in the agent binary, and the SBOM
          # lists the module versions actually shipped on every managed node.
          #
          # --source-name binds the document to the package it describes rather
          # than to the throwaway extraction directory, whose name would
          # otherwise be what the SPDX document claims to be about.
          for deb in agent/bin/*.deb; do
            name="$(basename "${deb}" .deb)"
            root="$(mktemp -d)"
            dpkg-deb -R "${deb}" "${root}"
            syft scan "dir:${root}" \
              --output "spdx-json=agent/bin/${name}.spdx.json" \
              --source-name "${name}.deb"
            rm -rf "${root}"
          done

          # Hash the packages, their SBOMs and the notices together, so one file
          # covers everything a consumer downloads. Names are relative because
          # `sha256sum -c` resolves them against the working directory, and a
          # consumer runs it from wherever they unpacked the release.
          ( cd agent/bin && sha256sum -- *.deb > checksums.txt )
          ( cd agent/bin && sha256sum -- *.spdx.json >> checksums.txt )
          cp agent/THIRD_PARTY_NOTICES.md agent/bin/THIRD_PARTY_NOTICES.md
          ( cd agent/bin && sha256sum -- THIRD_PARTY_NOTICES.md >> checksums.txt )
          echo "checksums.txt:"
          sed 's/^/    /' agent/bin/checksums.txt

          # Tag is agent/vX.Y.Z; title uses "agent vX.Y.Z" to match AGENTS.md.
          version="${SOURCE_REF#agent/}"
          {
            echo "version=${version}"
            echo "release_name=agent ${version}"
          } >> "${GITHUB_OUTPUT}"

      # Provenance over checksums.txt, which already names every .deb and the
      # notices file by SHA-256, so one attestation covers all of them.
      - name: Attest the release checksums
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agent/bin/checksums.txt

      # Attached as well as stored by GitHub, so a consumer can verify offline
      # with `gh attestation verify --bundle`.
      - name: Attach the attestation bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" agent/bin/checksums.txt.sigstore.json

      # The release is created as a draft so the packages upload before it is
      # published. If a repository has release immutability turned on, GitHub
      # seals the release when it is published and rejects any asset uploaded
      # after that.
      #
      # The action does not publish a draft, so the step below publishes it.
      # Do not remove that step.
      - name: Create or update GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.SOURCE_REF }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: true
          body: |
            nvke-agent ${{ steps.meta.outputs.version }} Debian packages (amd64 and arm64).

            Apt install path is the apt-publisher intake from this same workflow; these assets are the same `.deb`s attached for direct download.

            Verify `checksums.txt` against its build-provenance attestation,
            then `sha256sum -c checksums.txt`. See [RELEASE.md](RELEASE.md) for
            the commands.
          files: |
            agent/bin/*.deb
            agent/bin/*.spdx.json
            agent/bin/checksums.txt
            agent/bin/checksums.txt.sigstore.json
            agent/bin/THIRD_PARTY_NOTICES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.SOURCE_REF, '-rc.') }}
          make_latest: false
          generate_release_notes: false

      # The packages are checked before the release is published, because
      # publishing it is what seals it. An agent/v* tag also runs release.yml,
      # which creates a release for the same tag, so the two workflows can
      # reach the same release object.
      # Counting .deb files proved one arrived, not that it arrived whole: an
      # asset reports 'uploaded' with a non-zero size even when the upload was
      # truncated. The shared action reads every asset back and hashes it
      # against checksums.txt, which is the bar release.yml already held.
      - name: Verify the release assets
        uses: ./.github/actions/verify-release-assets
        with:
          release-id: ${{ steps.release.outputs.id }}
          checksums: agent/bin/checksums.txt
          github-token: ${{ github.token }}

      - name: Publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);

            const { data: rel } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });

            const debs = rel.assets.filter(a => a.name.endsWith('.deb'));
            if (debs.length < 2) {
              core.setFailed(
                `release ${release_id} carries ${debs.length} .deb files, expected 2. ` +
                `It is left as an unpublished draft. Delete it before re-pushing the tag.`);
              return;
            }

            if (rel.draft) {
              // make_latest has to be repeated here. GitHub defaults it to
              // true when a release is published, so leaving it out would give
              // an agent release the repository's "Latest release" badge, which
              // is what make_latest: false on the step above exists to prevent.
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, draft: false, make_latest: 'false',
              });
            }
            core.info(`Published ${process.env.SOURCE_REF} with ${debs.length} packages.`);
