name: Artifact NVKE Agent

# Builds the nvke-agent binaries and publishes them as OCI artifacts, joined by
# a multi-arch index:
#
#   <repo>:<version>            <- OCI image index
#     |-- <repo>:<version>-amd64   platform linux/amd64   layer: nvke-agent
#     `-- <repo>:<version>-arm64   platform linux/arm64   layer: nvke-agent
#
#   ghcr.io/dsx-ai-factory/nvke/agent              on vX.Y.Z and vX.Y.Z-beta.N
#   nvcr.io/<NVKE_NGC_ORG>/nvke-agent              on vX.Y.Z and vX.Y.Z-beta.N
#   nvcr.io/<DSX_NGC_ORG_TEAM>/nvke-agent          on vX.Y.Z only
#
#   oras pull ghcr.io/dsx-ai-factory/nvke/agent:<version> --platform linux/arm64
#
# <version> is `git describe --tags --always --match 'v*'`. A push runs only
# for a vX.Y.Z or vX.Y.Z-beta.N tag. A dispatch or a call runs on any ref, and
# on any other ref every push step skips itself, so the run builds and pushes
# nothing:
#
#   gh workflow run artifact-nvke-agent.yml --ref pull-request/123
#
# Not a container image. The agent runs on a node as a systemd unit with host
# access, so consumers want the executable itself, selected by platform. The
# artifacts are ordinary OCI image manifests carrying an artifactType and a
# platform-bearing config; --artifact-platform is what puts os/arch in the
# config, and what `oras manifest index create` reads to build the index.
#
# The build job writes the artifacts and the index into one OCI layout, and
# every registry is pushed from that layout, so all of them serve the same
# digests.
#
# A caller of this workflow grants every permission its jobs request:
# contents: read and packages: write. The NVCR jobs read their NGC org and
# token from the `nvcr` environment.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch: {}
  workflow_call: {}

permissions: {}

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so two artifact workflows called from one
  # caller would share a group and cancel each other.
  group: Artifact NVKE Agent-${{ github.ref }}
  # Never cancel a publish midway: a registry left with an index but not its
  # artifacts would disagree with the others.
  cancel-in-progress: false

env:
  GHCR_REPO: ghcr.io/dsx-ai-factory/nvke/agent

jobs:
  resolve:
    if: github.repository_id == '1323115536'
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # git describe needs history and tags
          persist-credentials: false

      # On a vX.Y.Z or vX.Y.Z-beta.N tag this is the tag; between tags, a
      # describe such as v0.24.0-beta.5-3-gabcdef0. With two v* tags on one
      # commit describe names only one, so a tag run that would publish under
      # the other name fails instead.
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --tags --always --match 'v*' "${GITHUB_SHA}")"
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ && "${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::git describe resolved ${version} for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Version ${version}"

  build:
    name: Build
    needs: [resolve]
    # Both architectures are produced by cross-compilation from one runner:
    # the agent is pure Go with CGO disabled, so this needs no arm64 runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.work carries the highest Go version of any member module, so the
      # toolchain it selects satisfies all of them.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          # go.work.sum holds only the hashes NOT already in a member's go.sum,
          # so keyed on it alone a dependency bump would restore a stale cache.
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Read pinned tool versions
        id: versions
        run: echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      # VERSION is passed rather than left to agent/Makefile, whose own
      # describe matches agent/v* tags only. CGO_ENABLED=0 is set rather than
      # left to the toolchain default: the native amd64 build would otherwise
      # link against the runner's libc while the cross-compiled arm64 build
      # would not, and the agent lands on nodes whose libc it never saw.
      - name: Build binaries
        working-directory: agent
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.resolve.outputs.version }}
        run: make build-all VERSION="${VERSION}"

      - name: Verify binaries
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            bin="bin/linux_${arch}/nvke-agent"
            file "${bin}"
            # A binary for the wrong architecture would push and index without
            # complaint, and only fail on a node.
            case "${arch}" in
              amd64) file "${bin}" | grep -q 'ELF 64-bit LSB .*x86-64' ;;
              arm64) file "${bin}" | grep -q 'ELF 64-bit LSB .*ARM aarch64' ;;
            esac
            file "${bin}" | grep -q 'statically linked'
          done

      # --artifact-platform is still marked experimental in the ORAS CLI. It is
      # load-bearing: without it the manifest has no platform in its config and
      # `oras manifest index create` cannot tell the two apart.
      - name: Package the layout
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          layout="${GITHUB_WORKSPACE}/layout"
          for arch in amd64 arm64; do
            # From the binary's own directory so the layer's title is
            # "nvke-agent" and not a path -- that title is the filename
            # `oras pull` writes.
            ( cd "agent/bin/linux_${arch}" && oras push --oci-layout "${layout}:${VERSION}-${arch}" \
                --artifact-type application/vnd.nvidia.nvke.agent.v1 \
                --artifact-platform "linux/${arch}" \
                --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.version=${VERSION}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nvke-agent" \
                nvke-agent:application/octet-stream )
          done
          oras manifest index create --oci-layout "${layout}:${VERSION}" \
            --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            "${VERSION}-amd64" "${VERSION}-arm64"
          oras manifest fetch --oci-layout --pretty "${layout}:${VERSION}"

      - name: Upload the layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nvke-agent-oci
          path: layout
          if-no-files-found: error
          retention-days: 1

  publish-ghcr:
    name: Publish to GHCR
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Download the layout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nvke-agent-oci
          path: layout

      # GHCR takes vX.Y.Z and vX.Y.Z-beta.N tags. Expressions have no regex, so
      # the condition is looser than that: a push is already held to those
      # tags by `on:`, and a dispatch on another v* tag pushes only if the tag
      # has no "-" or carries "-beta.".
      - name: Push to GHCR
        id: push
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || contains(github.ref_name, '-beta.'))
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io --username "${ACTOR}" --password-stdin
          ./scripts/push-oci-layout.sh layout "${GHCR_REPO}" \
            "${VERSION}-amd64" "${VERSION}-arm64" "${VERSION}"

      - name: Record the published digest
        if: steps.push.outcome == 'success'
        uses: ./.github/actions/record-digest
        with:
          references: ${{ env.GHCR_REPO }}:${{ needs.resolve.outputs.version }}
          component: nvke-agent

  publish-nvcr:
    name: Publish to NVCR (${{ matrix.destination }})
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        destination: [nvke, dsx]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Download the layout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nvke-agent-oci
          path: layout

      # NVKE takes vX.Y.Z and vX.Y.Z-beta.N tags; DSX takes vX.Y.Z only. See the
      # GHCR push for why the condition is looser than that.
      # `$oauthtoken` is NGC's literal username, not a variable reference.
      - name: Push to NVCR (${{ matrix.destination }})
        id: push
        if: >-
          (matrix.destination == 'nvke' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || contains(github.ref_name, '-beta.'))) ||
          (matrix.destination == 'dsx' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-'))
        shell: bash
        env:
          ORG: ${{ matrix.destination == 'dsx' && vars.DSX_NGC_ORG_TEAM || vars.NVKE_NGC_ORG }}
          ORG_VAR: ${{ matrix.destination == 'dsx' && 'DSX_NGC_ORG_TEAM' || 'NVKE_NGC_ORG' }}
          NGC_TOKEN: ${{ matrix.destination == 'dsx' && secrets.NGC_REGISTRY_TOKEN_DSX || secrets.NGC_REGISTRY_TOKEN_NVKE }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${ORG}" ]]; then
            echo "::error::${ORG_VAR} is not set in the nvcr environment"
            exit 1
          fi
          repo="nvcr.io/${ORG}/nvke-agent"
          # shellcheck disable=SC2016
          echo "${NGC_TOKEN}" | oras login nvcr.io --username '$oauthtoken' --password-stdin
          ./scripts/push-oci-layout.sh layout "${repo}" \
            "${VERSION}-amd64" "${VERSION}-arm64" "${VERSION}"
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"

      - name: Record the published digest
        if: steps.push.outcome == 'success'
        uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.push.outputs.repo }}:${{ needs.resolve.outputs.version }}
          component: nvke-agent-${{ matrix.destination }}
