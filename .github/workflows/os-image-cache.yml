name: OS Image Cache

# Keeps the Ubuntu installer ISOs os-image-artifact.yml bakes from in the S3
# build cache, so a bake reads them from S3 instead of Ubuntu's mirrors. Four
# ISOs of 2 to 3 GiB do not fit the 10 GiB GitHub cache.
#
# The bake only reads. Its runs are on pull-request/N branches and tags, which
# the cache's write role does not trust: that role trusts only refs/heads/main,
# so this workflow on main is the only writer. Both sides key on the ISO's
# filename, which names the Ubuntu point release and the arch.
#
# Nothing here is trusted on the way back out: prepare-installer-iso.sh checks
# a restored ISO against Ubuntu's SHA256SUMS, as it does a fresh download.
on:
  push:
    branches: [main]
    # The ISO pins live in the packer Makefile.
    paths:
      - os-image/packer/Makefile
      - .github/workflows/os-image-cache.yml
  # The bucket expires objects 30 days after they are written, so a weekly
  # run rewrites anything two weeks old and nothing reaches the expiry.
  schedule:
    - cron: '40 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: OS Image Cache
  cancel-in-progress: false

env:
  # Keep in step with os-image-artifact.yml. The bucket and the write role are
  # repository variables.
  BUILD_CACHE_REGION: us-east-1
  BUILD_CACHE_ISO_PREFIX: nvke/os-image/iso

jobs:
  iso:
    if: github.repository_id == '1323115536'
    name: Cache the installer ISO (${{ matrix.arch }}, ubuntu ${{ matrix.ubuntu_release }})
    runs-on: ubuntu-latest
    # arm64's ISO comes from cdimage.ubuntu.com at a couple of MB/s.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        # Keep in step with the matrix job in os-image-artifact.yml.
        ubuntu_release: [26.04.1, 24.04.5]
    permissions:
      contents: read
      id-token: write  # the build cache's write role
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials for the build cache
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.NVKE_GHA_CACHE_WRITE_ROLE_ARN }}
          aws-region: ${{ env.BUILD_CACHE_REGION }}

      - name: Download, verify and upload
        env:
          BUCKET: ${{ vars.NVKE_GHA_CACHE_BUCKET }}
          ARCH: ${{ matrix.arch }}
          UBUNTU_RELEASE: ${{ matrix.ubuntu_release }}
        run: |
          set -euo pipefail
          # Fail now, not after a multi-GB download, if the variable is unset.
          : "${BUCKET:?NVKE_GHA_CACHE_BUCKET is not set}"
          resolve() {
            make --no-print-directory -C os-image/packer "print-$1" \
              ARCH="${ARCH}" UBUNTU_RELEASE="${UBUNTU_RELEASE}"
          }
          iso_url="$(resolve ISO_URL)"
          iso_checksum="$(resolve ISO_CHECKSUM)"
          name="${iso_url##*/}"
          key="${BUILD_CACHE_ISO_PREFIX}/${name}"

          # Empty on a miss. The write role may not list the bucket, which
          # turns a miss into a 403, so no status is read from this.
          written="$(aws s3api head-object --bucket "${BUCKET}" --key "${key}" \
            --query LastModified --output text 2>/dev/null || true)"
          if [[ -n "${written}" ]] &&
            (( $(date +%s) - $(date -d "${written}" +%s) < 14 * 86400 )); then
            echo "${key} was written ${written}; nothing to do"
            exit 0
          fi

          # sha256:<hex> is the committed pin from make/tool-versions.mk and is
          # what the Makefile defaults to; file:<url> stays supported for an
          # overridden ISO_CHECKSUM naming a SHA256SUMS-style manifest.
          case "${iso_checksum}" in
            sha256:*)
              want="${iso_checksum#sha256:}"
              ;;
            file:*)
              sums_url="${iso_checksum#file:}"
              # To a file, not into awk: the parser exits at the first match, and
              # a curl that is still writing then takes a write error on the
              # closed pipe -- which --retry-all-errors turns into a retry, and
              # pipefail turns into a failed step.
              sums="$(mktemp)"
              trap 'rm -f "${sums}"' EXIT
              curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 \
                -o "${sums}" "${sums_url}"
              want="$(awk -v n="${name}" '$2 == n || $2 == "*" n { print $1; exit }' "${sums}")"
              if [[ -z "${want}" ]]; then
                echo "::error::no checksum for ${name} in ${sums_url}"
                exit 1
              fi
              ;;
            *)
              echo "::error::ISO_CHECKSUM must be sha256:<hex> or file:<url>, got: ${iso_checksum}"
              exit 1
              ;;
          esac
          # curl's own --retry truncates back to where the transfer started, so
          # a reset part way through the 2.9 GB arm64 ISO would start over.
          # Each attempt here resumes from what the last one wrote.
          for attempt in 1 2 3 4 5 6; do
            curl -fL -C - -o "${name}" "${iso_url}" && break
            (( attempt < 6 )) || exit 1
            sleep 5
          done
          echo "${want}  ${name}" | sha256sum -c -
          aws s3 cp "${name}" "s3://${BUCKET}/${key}" --only-show-errors
          echo "::notice::cached ${iso_url} as ${key}"
