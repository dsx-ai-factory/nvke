#
# Answers, in about a minute and with no credentials, the three questions the
# Forge site controller lane is blocked on:
#
#   1. Can an ARC runner reach the Forge API? It is public, but "public" and
#      "reachable from the corpnet VPC" are not the same claim.
#   2. Can it reach the Teleport proxy? Everything about the intended route
#      assumes so, and nothing has tested it.
#   3. Can it reach the jump host's sshd directly, and does that sshd offer
#      password authentication? This decides whether the interim
#      `jump-auth: password` route is possible at all -- the documented
#      procedure only ever reaches that host through `tsh ssh`.
#   4. Does the whole Teleport route work end to end: does the GitHub OIDC
#      join mint a certificate, does that certificate reach the jump host as
#      root, and does the exact relay command the Go dialer runs there
#      actually move bytes? Reaching the proxy answers none of these.
#
# It also prints the jump host's SHA256 host key, which is the value
# `site.jumpHostKeyFingerprint` wants, and the certificate's real expiry,
# which is how to see the shortest-role TTL clamp rather than assume it.
#
# Every check is advisory: the job reports rather than fails, because a red
# result here is the finding, not an error. Delete this workflow once the
# answers are written down.
name: Forge connectivity probe

on:
  workflow_dispatch:
  # SCAFFOLDING -- remove before merge. workflow_dispatch reads its trigger
  # from the default branch, so this cannot be dispatched until it is there,
  # and the whole point of the probe is to answer these questions before
  # anything merges. push reads the workflow from the ref being pushed.
  push:
    branches: [feat/e2e-forge-site-controller]
  # Also scaffolding, and the only way to answer question 4. The join token
  # allows refs/heads/main and refs/pull/*/merge and nothing else, so a push
  # to a feature branch mints no certificate however reachable the proxy is.
  # A pull_request run carries refs/pull/<n>/merge, which the token accepts.
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  # Keyed by event because push and pull_request both fire on the same commit
  # while the scaffolding triggers are in place, and they ask different
  # questions: only the pull_request run has a joinable ref.
  group: Forge connectivity probe ${{ github.event_name }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe from the ARC fleet
    runs-on: arc-amd64-cpu16
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 10
    permissions:
      # The OIDC token the Teleport join consumes. Nothing else is needed:
      # there is no checkout, and no step reads the repository.
      id-token: write
    env:
      # Hostnames, not credentials, and not checked in. Same variables the
      # site controller lane reads.
      FORGE_JUMP_HOST: ${{ vars.FORGE_JUMP_HOST }}
      FORGE_TELEPORT_PROXY: ${{ vars.FORGE_TELEPORT_PROXY }}
      FORGE_API_ENDPOINT: ${{ vars.FORGE_API_ENDPOINT || 'https://api.ngc.nvidia.com' }}
    steps:
      # No checkout: nothing here reads the repository.
      - name: Forge API
        shell: bash
        run: |
          set -Eeuo pipefail
          # Any HTTP status proves TCP and TLS completed, which is the whole
          # question. Unauthenticated, so 401 is a pass.
          code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            "${FORGE_API_ENDPOINT}/v2/org" || echo "000")"
          if [ "${code}" = "000" ]; then
            echo "FAIL ${FORGE_API_ENDPOINT} unreachable"
          else
            echo "OK   ${FORGE_API_ENDPOINT} answered HTTP ${code}"
          fi

      - name: Teleport proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${FORGE_TELEPORT_PROXY}" || {
            echo "SKIP the FORGE_TELEPORT_PROXY repository variable is unset"
            exit 0
          }
          # /webapi/ping needs no credential and reports server_version, which
          # is also how to confirm the tsh pin in the site lane still matches.
          if body="$(curl -sS --connect-timeout 10 --max-time 30 \
              "https://${FORGE_TELEPORT_PROXY%%/*}/webapi/ping")"; then
            echo "OK   ${FORGE_TELEPORT_PROXY} answered:"
            echo "${body}"
          else
            echo "FAIL ${FORGE_TELEPORT_PROXY} unreachable"
          fi

      - name: Jump host sshd
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${FORGE_JUMP_HOST}" || {
            echo "SKIP the FORGE_JUMP_HOST repository variable is unset"
            exit 0
          }

          if ! timeout 10 bash -c "exec 3<>/dev/tcp/${FORGE_JUMP_HOST}/22" 2>/dev/null; then
            echo "FAIL ${FORGE_JUMP_HOST}:22 is not reachable from this runner."
            echo "     The jump-auth=password route is not possible; Teleport is the only way in."
            exit 0
          fi
          echo "OK   ${FORGE_JUMP_HOST}:22 accepted a connection"

          # The value site.jumpHostKeyFingerprint wants.
          if key="$(ssh-keyscan -T 10 -t ed25519 "${FORGE_JUMP_HOST}" 2>/dev/null)" && [ -n "${key}" ]; then
            echo "     host key: $(printf '%s' "${key}" | ssh-keygen -lf - | awk '{print $2}')"
          fi

          # sshd names the methods it will accept when offered none. This is
          # what says whether a password can be used, without trying one.
          methods="$(ssh -o BatchMode=yes \
                         -o StrictHostKeyChecking=no \
                         -o UserKnownHostsFile=/dev/null \
                         -o PreferredAuthentications=none \
                         -o ConnectTimeout=10 \
                         "probe@${FORGE_JUMP_HOST}" true 2>&1 |
                     sed -n 's/.*(\(.*\)).*/\1/p' | head -1)"
          if [ -n "${methods}" ]; then
            echo "     sshd offers: ${methods}"
            case "${methods}" in
              *password* | *keyboard-interactive*)
                echo "     -> jump-auth=password is possible, given an account and its password" ;;
              *)
                echo "     -> sshd accepts no password method; jump-auth=password cannot work" ;;
            esac
          else
            echo "     sshd did not name its authentication methods"
          fi

      # The iPXE chain the node boots from. The node fetches these, not this
      # runner, and the node is on the site network -- so a failure here is
      # not proof the boot fails. What it does prove is that the objects
      # still exist: these URLs are dated 2026-06-25 and are the ones the
      # az61 SBOM run used. CloudFront answers "Request blocked" to egress it
      # does not recognise, which is indistinguishable from a dead URL
      # anywhere outside the VPC.
      - name: OS image URLs
        shell: bash
        env:
          BOOTLOADER: ${{ vars.FORGE_E2E_OS_IMAGE_BOOTLOADER }}
          IMAGE: ${{ vars.FORGE_E2E_OS_IMAGE }}
        run: |
          set -Eeuo pipefail
          for url in "${BOOTLOADER}" "${IMAGE}"; do
            [ -n "${url}" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              -r 0-0 "${url}" || echo "000")"
            case "${code}" in
              200 | 206) echo "OK   ${code} $(basename "${url}")" ;;
              403)       echo "NOTE 403 $(basename "${url}") -- blocked for this egress, object may still be fine" ;;
              *)         echo "FAIL ${code} $(basename "${url}")" ;;
            esac
          done

      # ----------------------------------------------------------------
      # Question 4: the Teleport route, end to end. Everything below is
      # advisory in the same way as the checks above -- the auth step is
      # allowed to fail, and the steps after it read its outcome rather than
      # its success, so one red link still reports the rest.
      # ----------------------------------------------------------------

      - name: Report the ref
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          case "${REF}" in
            refs/heads/main | refs/pull/*/merge)
              echo "OK   ${REF} is a ref the join token accepts" ;;
            *)
              echo "NOTE ${REF} is not one of refs/heads/main or refs/pull/*/merge."
              echo "     The join below will fail, and that is the token's rule, not a network result." ;;
          esac

      # tbot as well as tsh: teleport-actions/auth does not ship a binary, it
      # shells out to tbot and fails with "Unable to locate executable file"
      # if one is not already on PATH. Both come out of the same tarball.
      - name: Install tsh and tbot
        if: env.FORGE_TELEPORT_PROXY != ''
        shell: bash
        env:
          # Matches the pin in forge-site-controller-e2e.yml, and the
          # server_version the proxy reports above.
          TELEPORT_VERSION: "18.11.0"
        run: |
          set -Eeuo pipefail
          curl -fsSL --connect-timeout 20 --max-time 300 \
            -o /tmp/teleport.tar.gz \
            "https://cdn.teleport.dev/teleport-v${TELEPORT_VERSION}-linux-amd64-bin.tar.gz"
          tar -C /tmp -xzf /tmp/teleport.tar.gz teleport/tsh teleport/tbot
          sudo install -m 0755 /tmp/teleport/tsh /usr/local/bin/tsh
          sudo install -m 0755 /tmp/teleport/tbot /usr/local/bin/tbot
          tsh version
          tbot version

      - name: Teleport join
        id: join
        if: env.FORGE_TELEPORT_PROXY != ''
        continue-on-error: true
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: ${{ env.FORGE_TELEPORT_PROXY }}
          token: rg-nke-arc-runners-github-join
          # Deliberately the same 4h the site lane asks for. The point is to
          # see what comes back, not to get a long certificate: Teleport
          # clamps to the shortest max_session_ttl across the bot's roles, and
          # rg-nke-ssh-sudo has the module default of 2h.
          certificate-ttl: 4h

      - name: Teleport identity
        if: steps.join.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "OK   the join minted a certificate"
          # "Valid until" against the 4h asked for is the TTL clamp, measured.
          tsh --proxy "${TELEPORT_PROXY}" --identity "${TELEPORT_IDENTITY_FILE}" status || true

      - name: Teleport nodes
        if: steps.join.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          # What the bot's roles actually let it see. If the jump host is not
          # in this list, no amount of network reachability will help.
          if nodes="$(tsh --proxy "${TELEPORT_PROXY}" --identity "${TELEPORT_IDENTITY_FILE}" \
                ls --format=text 2>&1)"; then
            echo "${nodes}"
            if printf '%s' "${nodes}" | grep -q -- "${FORGE_JUMP_HOST}"; then
              echo "OK   ${FORGE_JUMP_HOST} is visible to this identity"
            else
              echo "FAIL ${FORGE_JUMP_HOST} is not in the node list"
            fi
          else
            echo "FAIL tsh ls: ${nodes}"
          fi

      - name: Relay rehearsal
        if: steps.join.outcome == 'success' && env.FORGE_JUMP_HOST != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          tsh_run() {
            timeout 60 tsh --proxy "${TELEPORT_PROXY}" --identity "${TELEPORT_IDENTITY_FILE}" \
              ssh "root@${FORGE_JUMP_HOST}" "$@"
          }

          if who="$(tsh_run 'id -un; uname -n' 2>&1)"; then
            echo "OK   tsh ssh root@${FORGE_JUMP_HOST} ran a command: $(echo "${who}" | tr '\n' ' ')"
          else
            echo "FAIL tsh ssh root@${FORGE_JUMP_HOST}: ${who}"
            exit 0
          fi

          # The Go dialer prefers nc and falls back to bash's /dev/tcp. Which
          # one it will get is worth knowing before a run depends on it.
          echo "     relay tools: $(tsh_run 'command -v nc || echo "nc absent"' 2>&1 | tr -d '\r')"

          # The relay command's exact shape, bounded so it terminates: open a
          # socket from the jump host and read four bytes. Against the jump
          # host's own sshd that is "SSH-", which is the same proof a real
          # node's :22 would give, without needing a node.
          banner="$(tsh_run 'bash -c '"'"'exec 3<>/dev/tcp/127.0.0.1/22 && head -c 4 <&3'"'"'' 2>&1 || true)"
          case "${banner}" in
            SSH-*)
              echo "OK   the relay command moved bytes: read '${banner}' from a socket opened on the jump host"
              echo "     The Teleport route is proven as far as the jump host; only the last hop to a"
              echo "     Forge node's :22 is untested, and that needs hardware." ;;
            *)
              echo "FAIL the relay command returned: ${banner}" ;;
          esac

      - name: Remove the Teleport identity
        if: always() && steps.join.outcome == 'success'
        shell: bash
        run: rm -f "${TELEPORT_IDENTITY_FILE}"
