#
# Runs the entrypoint a developer runs, `controller/hack/local-backend-e2e.sh`,
# on Linux.
#
# Nothing in CI ran it before. It accumulated a macOS-only guard, a working
# directory it never set, and four ways of disagreeing with the CI entrypoint:
# no site_controller_vip, a node-pool filter that skipped the authentication
# specs, no -ginkgo.fail-on-empty, and a providers list without
# capd-reboot-controller, which made its own reboot spec impossible to pass.
# One run would have caught all of them.
#
# Path-filtered, because that script and its library change rarely: twice in the
# script's life so far. This lane costs nothing between those changes.
#
# Advisory, like every other E2E lane: not a merge-gate member.

name: Local entrypoint E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - controller/hack/local-backend-e2e.sh
      - controller/hack/backend-e2e-lib.sh
      # The entrypoint builds the node image, so this lane owns changes to it.
      - controller/hack/capd-kindest-node/**
      # It reaches the node image, the management cluster and the bundle mirror
      # through these, so a change to any of them changes what this lane runs.
      - controller/Makefile.dev
      - controller/Tiltfile
      - controller/hack/controller-capi-kind.yaml
      - controller/hack/ci/prepare-capd-bundles.sh
      - controller/hack/ci/prepare-host-kernel-modules.sh
      - controller/hack/ci/prepare-ovn-assets.sh
      - controller/hack/ci/assets/ovn-install.sh
      - os-image/packages/cni-ovn/**
      - os-image/packages/cni-common/**
      - .github/workflows/local-entrypoint-e2e.yml
      - .github/workflows/e2e-pr-path-filter.yml
      - hack/e2e-path-filter.py
      # Installs the pinned kind and kubectl the suite runs on.
      - .github/actions/setup-kind/**
  # Also twice a day, so a break the paths above filtered out, or one a flake
  # hid, still surfaces within twelve hours. A schedule ignores those paths, so
  # these runs always exercise the whole suite.
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha keeps main runs apart. Sharing one group, and main never cancels,
  # means a second main run waits out the first. Only the second: GitHub keeps
  # one pending run per group, so a third arrival evicts the queued second.
  group: Local entrypoint E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/e2e-pr-path-filter.yml
    permissions:
      contents: read
      pull-requests: read

  local-entrypoint:
    needs: changes
    name: local-backend-e2e.sh on Linux (${{ matrix.arch }}, post-init CNI ${{ matrix.install_cni_after_init }})
    if: github.repository_id == '1323115536' && needs.changes.outputs.run_e2e == 'true'
    # The L4 pool is one machine, and this lane runs on pull requests, on main,
    # and twice a day. A run on main waited 87 minutes for a runner, longer than
    # the 84 minutes it then took. cpu16 has capacity, and the L4 was never
    # faster: leg 1 took 778s there against 845s on a developer box.
    #
    # Neither architecture needs /dev/kvm, and both need the Docker Hub mirror
    # below, which only resolves inside the NVIDIA fleet.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # The 110-minute suite below plus about 15 minutes of setup.
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        # Cover both CNI installation paths on amd64 and the in-init path on arm64.
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
            install_cni_after_init: false
          - arch: amd64
            runner: linux-amd64-cpu16
            install_cni_after_init: true
          - arch: arm64
            runner: arc-arm64-cpu16
            install_cni_after_init: false
    env:
      INSTALL_CNI_AFTER_INIT: ${{ matrix.install_cni_after_init }}
      # arm64 suites run close to the 100-minute default.
      E2E_SUITE_TIMEOUT_MINUTES: "110"
      # Pull-request mirrors run the same bounded lifecycle as the CAPD lane.
      # Main, scheduled, and manual runs keep the comprehensive CAPD suite.
      # Empty takes E2E_CAPD_SUITE_FILTER, which already excludes
      # tpm-attestation and gpu.
      LOCAL_NKE_E2E_LABEL_FILTER: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'pull-request/') && '(core-docker || health) && !tpm-attestation && !gpu' || '' }}
      # Same override as backend-e2e.yml (capd-e2e, nico-e2e).
      NODE_REBOOT_SOFT_REBOOT_ENABLED: false
      # A public pull-through mirror: dc.local.gha-runners.nvidia.com resolves
      # only on the self-hosted fleet, and the arm64 leg now runs on ARC.
      # Same host as backend-e2e.yml, os-image-artifact.yml and
      # nvkectl-bootstrap-e2e.yml, each of which had to make this change when
      # it moved. helm needs the shim below to honour it for OCI charts,
      # which is how the CI entrypoint does it too.
      NKE_E2E_DOCKERHUB_MIRROR: mirror.gcr.io
      # The Tiltfile refuses to render without these. The CI entrypoint passes
      # the same placeholders; nothing here is a credential.
      DGXC_TENANT_USER: local-e2e
      DGXC_TENANT_PASSWORD: example-password
      CNPG_SUPERUSER_PASSWORD: example-password
      CNPG_CLOUD_PASSWORD: example-password
      CNPG_TEMPORAL_PASSWORD: example-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The node agent version comes from `git describe --match 'agent/v*'`.
          # Without the tags it falls back to the short SHA, and the etcd
          # encryption workflow rejects that as older than its required version.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev

      # Kind nodes share this runner's kernel, and OVN's ovs-vswitchd loads
      # openvswitch from it. The module ships in linux-modules-extra, which
      # the ARC arm64 image does not install. Stage the exact host kernel build:
      # uname -r alone cannot distinguish Jammy backports from Noble builds.
      # The suite's privileged Docker preflight loads it:
      # sudo in the ARC runner does not grant CAP_SYS_MODULE, and DinD has its
      # own /lib/modules filesystem (#1515).
      - name: Install the Open vSwitch module files
        run: |
          uname -a
          sudo apt-get install -y -qq kmod
          modules="${RUNNER_TEMP}/nvke-host-kernel-modules"
          sudo bash controller/hack/ci/prepare-host-kernel-modules.sh "${modules}"
          echo "NKE_E2E_HOST_MODULES_DIR=${modules}/lib/modules" >> "${GITHUB_ENV}"

      # containerd's CRI plugin creates an inotify watcher for the CNI conf dir.
      # Without headroom it fails to load, and kubeadm then reports the CRI v1
      # API as Unimplemented. backend-e2e.yml raises the same two limits.
      - name: Configure runner inotify capacity
        run: |
          raise_minimum() {
            local key="$1" minimum="$2" current
            current="$(sysctl -n "${key}")"
            echo "${key}=${current} (required minimum ${minimum})"
            if (( current < minimum )); then
              sudo sysctl -w "${key}=${minimum}"
              current="$(sysctl -n "${key}")"
            fi
            (( current >= minimum )) || { echo "${key} stayed below ${minimum}" >&2; exit 1; }
          }
          raise_minimum fs.inotify.max_user_instances 1024
          raise_minimum fs.inotify.max_user_watches 1048576

      # Version pins come from make/versions.mk, the same source backend-e2e.yml
      # reads, so the two lanes cannot install different tools.
      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "helm_version=$(make --no-print-directory print-HELM_VERSION)"
            echo "kind_version=$(make --no-print-directory print-KIND_VERSION)"
            echo "kubectl_version=$(make --no-print-directory print-KUBECTL_VERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Set up Kind and kubectl
        uses: ./.github/actions/setup-kind
        with:
          kind_version: ${{ steps.versions.outputs.kind_version }}
          kubectl_version: ${{ steps.versions.outputs.kubectl_version }}

      # helm fetches the Postgres and Temporal charts from Docker Hub over OCI,
      # which these runners cannot reach directly. controller/hack/ci wraps helm
      # to rewrite those references; the CI entrypoint installs the same shim
      # inside its runner container, and this lane runs helm on the host.
      - name: Route helm OCI pulls through the mirror
        run: |
          real="$(command -v helm)"
          sudo mv "${real}" /usr/local/bin/helm-real
          sudo install -m 0755 controller/hack/ci/helm-dockerhub-mirror.sh "${real}"
          helm version --short

      - name: Install Tilt
        # The local entrypoint requires tilt on PATH and does not install it,
        # unlike the CI entrypoint. Pin the version the CI entrypoint pins.
        run: |
          version="$(grep -oE 'TILT_VERSION:=v[0-9.]+' controller/hack/ci/backend-e2e.sh \
            | head -1 | sed 's/.*:=v//')"
          [[ -n "${version}" ]] || { echo "could not read the pinned Tilt version" >&2; exit 1; }
          # Tilt names the 64-bit ARM asset arm64, not aarch64.
          case "$(uname -m)" in
            x86_64) tilt_arch=x86_64 ;;
            aarch64) tilt_arch=arm64 ;;
            *) echo "Tilt publishes no release asset for $(uname -m)" >&2; exit 1 ;;
          esac
          tmp="$(mktemp -d)"
          # Retry: a CDN 504 must not fail the job on the first response.
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 \
            -o "${tmp}/tilt.tgz" \
            "https://github.com/tilt-dev/tilt/releases/download/v${version}/tilt.${version}.linux.${tilt_arch}.tar.gz"
          tar -xzf "${tmp}/tilt.tgz" -C "${tmp}" tilt
          sudo install -m 0755 "${tmp}/tilt" /usr/local/bin/tilt
          tilt version

      - name: Run the local entrypoint
        run: ./hack/local-backend-e2e.sh
        working-directory: controller

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The arch too: GitHub keeps two same-named artifacts.
          name: local-entrypoint-e2e-${{ matrix.arch }}-cni-${{ matrix.install_cni_after_init }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller/.local/backend-e2e/
          if-no-files-found: ignore
          retention-days: 7
