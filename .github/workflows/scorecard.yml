#
# OpenSSF Scorecard. Results go to Security -> Code scanning.
#
# Scorecard grades supply-chain practice from outside: branch protection,
# pinned dependencies, token permissions, signed releases, whether a fuzzer or
# an SAST tool runs, how quickly dependencies are updated. It reads the
# repository and its GitHub settings, so it reports on things no other check
# here can see -- several of the findings are about repository configuration
# rather than about code.
#
# It reports, it does not gate. Nothing here fails a build. The value is a
# tracked list that changes when someone weakens a setting, which is the case
# that goes unnoticed today.
#
# This is the second half of the supply-chain pair. dependency-review.yml
# guards what a single pull request adds; this grades the repository as a
# whole, on a schedule.
#
# Runs on a schedule and on push to main, NOT on pull_request. Scorecard needs
# repository-level metadata and a token with more than a pull request should
# ever carry, and its own documentation says to run it this way.
#
# PUBLIC REPOSITORIES ONLY, which is what the gate job is for. Scorecard reads
# history over the GitHub GraphQL API, and GITHUB_TOKEN may not do that on a
# repository that is not public. It does not degrade, it stops:
#
#   scorecard had an error: internal error: ListCommits:error during
#   graphqlHandler.setup: internal error: githubv4.Query:
#   Resource not accessible by integration
#
# This repository is `internal` today, so the analysis is skipped and the run
# stays green with a note that says why. It starts working by itself on the day
# the repository is made public: the gate reads the live visibility rather than
# a value written down here, so nothing needs editing then.
#
# The alternative is a PAT with repo scope. That is a long-lived credential with
# much more reach than this needs, to grade a repository whose whole purpose is
# to stop being private.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, an hour after the CodeQL sweep so the two do not contend.
    - cron: '0 7 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Scorecard-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Reads the visibility live rather than testing github.event.repository, which
  # is absent on a schedule trigger and would skip every weekly run.
  gate:
    name: Check the repository is public
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - name: Read the repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          vis=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          echo "Repository visibility: ${vis}"
          if [ "${vis}" = "public" ]; then
            echo "public=true" >> "${GITHUB_OUTPUT}"
          else
            echo "public=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### Scorecard skipped"
              echo
              echo "The repository is \`${vis}\`. OpenSSF Scorecard needs the GraphQL"
              echo "API, which \`GITHUB_TOKEN\` cannot use on a repository that is not"
              echo "public, so the analysis would fail rather than report."
              echo
              echo "This runs by itself once the repository is public. No change needed here."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  analysis:
    name: Scorecard analysis
    needs: [gate]
    if: needs.gate.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Upload the findings to the code-scanning dashboard.
      security-events: write
      # Read the workflow run history, which several checks grade.
      actions: read
      contents: read
      # No id-token: that is for publish_results, which is off below.
      #
      # Branch-Protection will score low or unknown as a result. It needs a PAT
      # with admin read, which GITHUB_TOKEN cannot stand in for. Every other
      # check works on the default token, so the rest of the report is real --
      # read a weak Branch-Protection line as "not measured", not as a finding.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing would list the score on the public OpenSSF API and needs
          # a PAT. Off until someone decides the score is ready to be published;
          # the findings are just as useful in the Security tab meanwhile.
          publish_results: false

      # The SARIF file, kept for 5 days. The dashboard shows current findings
      # only, so this is what lets you compare a run against an earlier one
      # while working through them.
      - name: Upload the SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
