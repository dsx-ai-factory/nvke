name: Image

# Self-hosted runners do not pick up jobs from pull_request events, so pull
# requests are tested through the pull-request/<number> branch instead.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read           # upload-sarif reads the workflow run
      security-events: write  # the image scan uploads to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docker-container driver runs BuildKit in its own container, so it
      # does not inherit the daemon's registry-mirror configuration. NVIDIA
      # runners ship a prepopulated buildkitd.toml pointing at the local mirror;
      # use it when present so base-image pulls are cached and not subject to
      # Docker Hub rate limits. Absent, buildx is set up exactly as before.
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      # Enable arm64 cross-compilation on the amd64 runner via QEMU so
      # BuildKit can produce a genuine linux/arm64 layer.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Validates every Dockerfile parses and every FROM resolves against the
      # default BASE_REGISTRY. This is what catches a base image that external
      # contributors cannot pull.
      - name: Check Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          status=0
          check() {
            echo "::group::docker build --check $1"
            docker build --check -f "$1" "$2" || status=1
            echo "::endgroup::"
          }
          # The controller Dockerfile builds from the repository root: the
          # module lives in the root Go workspace and needs go.work + vendor/.
          check controller/Dockerfile                    .
          check controller/hack/nico-mock/Dockerfile     controller/hack/nico-mock
          check agent/Dockerfile.nke-builder             agent

          # These four are checked but never built: capd-kindest-node and
          # cwe.tilt need inputs CI does not have, and Dockerfile.proto is
          # developer tooling.
          check controller/hack/capd-reboot-controller/Dockerfile controller/hack/capd-reboot-controller
          check controller/hack/capd-kindest-node/Dockerfile      controller/hack/capd-kindest-node
          check agent/internal-scripts/docker/Dockerfile.proto    agent/internal-scripts/docker
          # Tiltfile builds cwe.tilt from a temporary directory holding bin/,
          # profiles/ and ui/, so its real context does not exist in the tree.
          # Using controller/ instead fails on CopyIgnoredFile, because
          # controller/.dockerignore excludes **/bin.
          check controller/hack/Dockerfile.cwe.tilt               controller/hack
          exit $status

      # A real end-to-end image build. nico-mock is used because it has no
      # private module dependencies, so it builds from public sources alone —
      # which is exactly the property this check exists to protect.
      - name: Build nico-mock image
        shell: bash
        run: |
          docker buildx build \
            --file controller/hack/nico-mock/Dockerfile \
            --tag nke/nico-mock:ci \
            --load \
            controller/hack/nico-mock

      - name: Show image
        shell: bash
        run: docker image inspect nke/nico-mock:ci --format 'built {{.RepoTags}} {{.Size}} bytes'

      # A real end-to-end controller image build: it compiles the controller
      # inside the build, resolving every dependency from the committed
      # workspace vendor/ tree, so it needs no credentials. The context is the
      # repository root because the controller is a workspace member (it needs
      # go.work, vendor/ and the sibling modules). Verification only — the
      # local tag is never pushed.
      - name: Build controller image (amd64 and arm64)
        shell: bash
        run: |
          docker buildx build \
            --file controller/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag nke/cloud-workflow-engine:ci \
            .

      # --load does not support multi-platform images. Load the amd64 image
      # into the local daemon separately so subsequent steps can inspect and
      # scan it. BuildKit reuses the layers already built above.
      - name: Load controller image (amd64) for scan
        shell: bash
        run: |
          docker buildx build \
            --file controller/Dockerfile \
            --platform linux/amd64 \
            --tag nke/cloud-workflow-engine:ci \
            --load \
            .

      - name: Show controller image
        shell: bash
        run: docker image inspect nke/cloud-workflow-engine:ci --format 'built {{.RepoTags}} {{.Size}} bytes'

      # Scan the image, not the source tree. security-scan.yml runs Grype over
      # `path: "."`, which reads Go dependencies from the repository. It cannot
      # see what is in the image: the Alpine base, its OS packages, or the
      # SPIFFE binary copied in from an external image. Those are what a
      # consumer actually runs.
      #
      # Scanned here rather than in security-scan.yml because the image already
      # exists at this point, loaded into the local daemon. Doing it there would
      # mean building it a second time.
      #
      # fail-build: false, matching security-scan.yml. This reports into the
      # Security tab; it does not gate. Switch it on once the findings are
      # triaged and the count is known.
      - name: Scan the controller image
        id: image-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: nke/cloud-workflow-engine:ci
          severity-cutoff: medium
          output-format: sarif
          fail-build: false

      - name: Summarise the image scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="${{ steps.image-scan.outputs.sarif }}"
          {
            echo "## Grype — controller image, medium and above"
            echo
            if [ ! -s "${f}" ]; then
              echo "No SARIF produced. The scan did not finish."
            else
              echo "$(jq '[.runs[].results[]] | length' "${f}") result(s). Details in **Security -> Code scanning**, category \`grype-image\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the image scan SARIF
        if: always() && steps.image-scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ steps.image-scan.outputs.sarif }}
          category: grype-image

# Not built here: controller/hack/Dockerfile.cwe.tilt — it only copies a
# prebuilt binary, so it has nothing to verify without a preceding build.
#
# Nothing is pushed here. Publishing the controller image to nvcr.io now lives
# in image-nvcr.yml.
