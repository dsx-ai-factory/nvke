name: OS Image Artifact

# Builds and validates the FDE and non-FDE Packer node images on an
# os-image/v* tag (or a manual dispatch), pushes both qcow2s to GHCR as OCI
# artifacts, and on a real tag cuts a GitHub Release carrying
# nke-os-image-check + checksums covering all three files. The GitHub
# Release is created here (not in release.yml) so a failed bake or
# validation never cuts a release.
#
# FDE security note: its build-time LUKS_PASSPHRASE defaults to a shared,
# documented placeholder ("changeit", see
# os-image/docs/full-disk-encryption.md) baked into both a LUKS passphrase
# slot and GRUB's luks.key= kernel parameter until a node's first real boot
# completes a verified TPM bind -- anyone with console/physical access to an
# unbound node can read it and unlock the volume with it. This is a known,
# accepted tradeoff for publishing a build-and-go FDE image without a
# per-node secret-provisioning story: operators deploying this image to real
# hardware are relying on prompt first-boot TPM binding to close that
# window (verify with luks-tpm-verify; see
# os-image/docs/full-disk-encryption.md).
#
# The payload is an OCI artifact, not a container image. Tags are
# arch-suffixed, one per (variant, arch) -- NOT a single multi-platform
# manifest across both arches. That would need a separate index/merge step
# sequenced after every matrix leg finishes; arch-suffixed tags avoid that
# entirely, at the cost of `--platform` being informational (for the layer's
# declared platform metadata) rather than required to disambiguate a pull:
#
#   ghcr.io/dsx-ai-factory/nke/os-image-fde:v0.1.0-amd64
#   ghcr.io/dsx-ai-factory/nke/os-image-non-fde:v0.1.0-amd64
#   ghcr.io/dsx-ai-factory/nke/os-image-non-fde:v0.1.0-arm64
#     `-- platform linux/{amd64,arm64}   layer: nke-node-{fde,non-fde}.qcow2
#
#   oras pull ghcr.io/dsx-ai-factory/nke/os-image-fde:v0.1.0-amd64 --platform linux/amd64
#
# arm64 only builds the non-FDE variant for now (see the matrix below) --
# there is no os-image-fde-arm64 tag yet. The arm64 leg runs natively on the
# org's arm64 runner pool (linux-arm64-cpu16), not under cross-arch emulation. It also only publishes to GHCR, not
# the GitHub Release: the release step runs on the amd64 leg only, unchanged
# from before this matrix existed, since restructuring release-asset
# attachment to fan in across matrix legs is its own separate piece of work.
#
# Distinct from image.yml, which compiles controller Dockerfiles and pushes
# nothing. Distinct from image-nvcr.yml, which publishes the controller
# container.
on:
  push:
    tags:
      - "os-image/v[0-9]+.[0-9]+.[0-9]+"
      - "os-image/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate everything, but skip the GHCR push. The tag trigger always publishes; this only applies to a manual run."
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them.
  group: OS Image Artifact-${{ github.ref }}
  # Never cancel a publish midway: a half-pushed qcow2 would leave a tag
  # pointing at a truncated layer.
  cancel-in-progress: false

env:
  # packer_<version>_linux_{amd64,arm64}.zip from the HashiCorp SHA256SUMS file.
  PACKER_SHA256: "cfefdea4ac580eba7b254ef34d25b756d4961741004e3e701a1476594d13e64a"
  PACKER_SHA256_ARM64: "370002d15b07c0dc47dd0d188cdea8e6746606f6fcc3b4de48d02496d71d74ee"
  REPO_FDE: ghcr.io/dsx-ai-factory/nke/os-image-fde
  REPO_NON_FDE: ghcr.io/dsx-ai-factory/nke/os-image-non-fde

jobs:
  publish:
    if: github.repository == 'dsx-ai-factory/nke'
    name: Build, verify, and release (${{ matrix.arch }})
    # Each leg runs on its own architecture. The arm64 leg used to cross-build
    # on the amd64 runner under QEMU tcg and never finished: both attempts for
    # os-image/v0.1.0-rc.1 spent 2 h reaching 82 min of guest uptime with the
    # live installer still starting snapd and subiquity. On the arm64 pool
    # (linux-arm64-cpu16, where NICo E2E's arm64 leg already runs) the host
    # arch matches the guest, so packer/Makefile picks KVM when /dev/kvm is
    # present and same-arch tcg otherwise -- either is far faster than
    # cross-arch emulation. build_fde is false for arm64: this is a first pass
    # at arm64 support, not full parity -- see the header comment above.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: linux-amd64-gpu-l4-latest-1
            timeout_minutes: 180
            build_fde: true
          - arch: arm64
            runner: linux-arm64-cpu16
            timeout_minutes: 300
            build_fde: false
    # Packer QEMU needs /dev/kvm for the amd64 leg. linux-amd64-cpu16 (a
    # container-based pool) never exposed it, forcing every bake onto QEMU's
    # tcg software emulation — confirmed directly: a full FDE bake took
    # 1h39m under tcg vs a few minutes locally under real KVM, and tcg's much
    # slower, less predictable timing was implicated in several failures (a
    # GRUB boot-menu race, an intermittent overlayfs kernel oops under
    # curtin's install). This label is expected to expose /dev/kvm; "Enable
    # KVM access" below fails the amd64 leg immediately if that assumption
    # turns out wrong, rather than silently falling back to the
    # ~10x-slower emulated path the way this job used to. On the arm64 leg the
    # same step only probes: whether that pool exposes /dev/kvm is not known
    # yet, and same-arch tcg still finishes.
    runs-on: ${{ matrix.runner }}
    # amd64: sized for real KVM (FDE bake + demo-fde.sh + non-FDE bake +
    # boot-smoke, each a few minutes, with real headroom); the KVM gate below
    # fails fast instead of burning the timeout if that ever regresses to
    # tcg. Bumped from 120m to 180m after a real run's amd64 leg still timed
    # out (https://github.com/NVIDIA/nke/actions/runs/34525233526) for a
    # cause not yet root-caused -- see #695 for one confirmed contributor
    # (a bloated golden image) and the self-timeout + console-log dump on
    # the build steps below for diagnosing the next one. arm64: the pool has
    # no /dev/kvm, so the non-FDE bake runs under same-arch tcg at roughly
    # 10x the KVM pace: ~140 min install, ~15 min provisioning, up to 40 min
    # boot-smoke, plus compress -- bumped from 240m to 300m alongside amd64
    # for the same reason; 300m leaves ~1 h of headroom.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: write
      packages: write
    steps:
      # GitHub's own timeout-minutes has no grace period: it kills the whole
      # job process tree at once, so nothing started beforehand (a
      # background "sleep, then cat" included) gets a chance to run once it
      # fires. The build steps below self-impose a shorter timeout, computed
      # from this recorded start time, so they can dump the serial console
      # log and exit cleanly before GitHub's hard kill ever lands. Recorded
      # before Checkout, not after: Checkout does a full-history fetch on
      # this repo, and every second it takes would otherwise silently eat
      # into the 30s diagnostic buffer those self-timeouts leave themselves.
      - name: Record job start time
        id: start_time
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)"
            echo "packer_version=$(make --no-print-directory print-PACKER_VERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Resolve version and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/os-image/* ]]; then
            version="${GITHUB_REF_NAME#os-image/}"
          else
            version="$(git describe --match 'os-image/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
            version="${version#os-image/}"
          fi

          aliases=("sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            aliases+=("${version}")
          fi

          # The agent is built from this same checkout; describe it the way
          # agent/Makefile stamps main.VERSION.
          agent_version="$(git describe --match 'agent/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          agent_version="${agent_version#agent/}"

          {
            echo "version=${version}"
            echo "aliases=${aliases[*]}"
            echo "agent_version=${agent_version}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing ${version} as: ${aliases[*]}"
          echo "Baking nke-agent ${agent_version} from source"

      - name: Build and test nke-os-image-check
        working-directory: os-image
        run: |
          set -euo pipefail
          make test
          make build

      # qemu-system-arm provides qemu-system-aarch64; qemu-efi-aarch64
      # provides the AAVMF firmware the arm64 leg needs (arm64's equivalent
      # of ovmf's OVMF firmware for amd64). Installed on both legs
      # unconditionally rather than branched on matrix.arch: the extra apt
      # cost is negligible and it keeps this step identical across the
      # matrix.
      # dpkg-dev: dpkg-scanpackages indexes the CNI debs fetch-artifacts.sh builds.
      - name: Install QEMU, cloud-localds, swtpm, OVMF/AAVMF, 7z, xorriso, and dpkg-dev
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm qemu-utils cloud-image-utils genisoimage unzip swtpm ovmf qemu-efi-aarch64 p7zip-full xorriso dpkg-dev
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1
          qemu-img --version | head -1
          swtpm --version

      # A gate on the amd64 leg: that runner label is chosen specifically for
      # /dev/kvm (see the comment on runs-on above). A missing device there
      # means something about the runner pool changed and every subsequent
      # step would silently fall back to tcg (packer/Makefile and
      # boot-smoke.sh both probe and fall back on their own) -- better to fail
      # here in seconds than rediscover it 1-2 hours into a tcg bake. Same
      # pattern NVIDIA/OpenShell uses for its own KVM-backed e2e VM tests. On
      # the arm64 leg a missing device is a warning, not a failure: same-arch
      # tcg completes there, just slower.
      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            if [[ "${{ matrix.arch }}" == "amd64" ]]; then
              echo "::error::This runner did not expose /dev/kvm (expected on linux-amd64-gpu-l4-latest-1)"
              lscpu
              grep -m1 -E '^(flags|Features)' /proc/cpuinfo || true
              ls -la /dev
              exit 1
            fi
            echo "::warning::/dev/kvm is missing on this ${{ matrix.arch }} runner; the bake falls back to same-arch tcg"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --settle --name-match=kvm
          ls -l /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-
          echo "::notice::/dev/kvm present and writable; building with hardware acceleration"

      - name: Install Packer
        env:
          PACKER_VERSION: ${{ steps.versions.outputs.packer_version }}
          PACKER_SHA256: ${{ env.PACKER_SHA256 }}
          PACKER_SHA256_ARM64: ${{ env.PACKER_SHA256_ARM64 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          expected="${PACKER_SHA256}"
          [[ "${ARCH}" == "arm64" ]] && expected="${PACKER_SHA256_ARM64}"
          zip="packer_${PACKER_VERSION}_linux_${ARCH}.zip"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${zip}" \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/${zip}"
          actual="$(sha256sum "${tmp}/${zip}" | awk '{print $1}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::checksum mismatch for ${zip}: got ${actual}, expected ${expected}"
            exit 1
          fi
          unzip -d "${tmp}" "${tmp}/${zip}" packer
          sudo install -m 0755 "${tmp}/packer" /usr/local/bin/packer
          packer version

      # Only the qcow2 push below needs GHCR; fetch-artifacts.sh builds
      # nke-agent from this checkout's source and pulls nothing from GHCR.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # Self-timeout, 30s inside the job's real timeout-minutes deadline (see
      # "Record job start time" above), so a hang here dumps the serial
      # console log -- the same file "Upload FDE/non-FDE install console
      # logs" archives -- straight into this step's own output before
      # exiting, instead of relying on GitHub's hard kill to leave anything
      # legible behind.
      - name: Build the FDE node image
        if: matrix.build_fde
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$(( ${{ steps.start_time.outputs.epoch }} + ${{ matrix.timeout_minutes }} * 60 - 30 ))
          remaining=$(( deadline - $(date +%s) ))
          if (( remaining <= 0 )); then
            echo "::error::no time left before the job's ${{ matrix.timeout_minutes }}m timeout; skipping the FDE build"
            exit 1
          fi
          status=0
          timeout --signal=TERM "${remaining}s" \
            make -C os-image/packer os-image-fde ARCH=${{ matrix.arch }} || status=$?
          if [[ "${status}" -eq 124 ]]; then
            echo "::error::FDE build did not finish within ${remaining}s (job timeout minus a 30s buffer)"
            echo "::group::os-image/packer/build-logs (dumped before exiting on self-timeout)"
            for f in os-image/packer/build-logs/*.log; do
              [[ -f "${f}" ]] || continue
              echo "--- ${f} ---"
              cat "${f}"
            done
            echo "::endgroup::"
          fi
          exit "${status}"

      # Full acceptance run: LUKS2+TPM-sealed, wrong-TPM-fails,
      # reboot-auto-unlocks. No manual/scripted console interaction needed —
      # the image auto-unlocks its own first boot via a build-time luks.key=
      # GRUB parameter (see os-image/docs/full-disk-encryption.md). Only run
      # where the FDE image was actually built (see matrix.build_fde above).
      - name: Validate FDE TPM unlock (demo-fde.sh)
        if: matrix.build_fde
        working-directory: os-image
        run: ./demo-fde.sh

      # Same self-timeout pattern as "Build the FDE node image" above.
      - name: Build the non-FDE node image
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$(( ${{ steps.start_time.outputs.epoch }} + ${{ matrix.timeout_minutes }} * 60 - 30 ))
          remaining=$(( deadline - $(date +%s) ))
          if (( remaining <= 0 )); then
            echo "::error::no time left before the job's ${{ matrix.timeout_minutes }}m timeout; skipping the non-FDE build"
            exit 1
          fi
          status=0
          timeout --signal=TERM "${remaining}s" \
            make -C os-image/packer os-image-non-fde ARCH=${{ matrix.arch }} || status=$?
          if [[ "${status}" -eq 124 ]]; then
            echo "::error::non-FDE build did not finish within ${remaining}s (job timeout minus a 30s buffer)"
            echo "::group::os-image/packer/build-logs (dumped before exiting on self-timeout)"
            for f in os-image/packer/build-logs/*.log; do
              [[ -f "${f}" ]] || continue
              echo "--- ${f} ---"
              cat "${f}"
            done
            echo "::endgroup::"
          fi
          exit "${status}"

      - name: Boot-smoke the non-FDE qcow2
        run: |
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            make -C os-image boot-smoke ARCH=arm64 \
              OVMF_CODE=/usr/share/AAVMF/AAVMF_CODE.fd \
              OVMF_VARS_TEMPLATE=/usr/share/AAVMF/AAVMF_VARS.fd
          else
            make -C os-image boot-smoke ARCH=amd64 OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          fi

      # Runs regardless of outcome: this runner has no VNC/monitor access to
      # inspect a stuck or failed FDE/non-FDE build interactively, so the
      # guest's own serial console (boot + autoinstall output, see
      # console=ttyS0 in nke-node-fde.pkr.hcl / nke-node-non-fde.pkr.hcl) is
      # the only way to see what happened. No-op if the dir is empty/missing
      # (e.g. a failure before either build reached prepare-installer-iso).
      # Arch-suffixed: upload-artifact rejects two jobs in the same run
      # uploading under the same name, and each matrix leg has its own logs.
      - name: Upload FDE/non-FDE install console logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fde-install-console-logs-${{ matrix.arch }}
          path: os-image/packer/build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Compress the qcow2s for publish
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.build_fde }}" == "true" ]]; then
            fde_src="$(ls os-image/packer/output-fde/*.qcow2)"
            qemu-img convert -p -c -O qcow2 "${fde_src}" dist/nke-node-fde.qcow2
            qemu-img info dist/nke-node-fde.qcow2
          fi
          non_fde_src="$(ls os-image/packer/output-non-fde/*.qcow2)"
          qemu-img convert -p -c -O qcow2 "${non_fde_src}" dist/nke-node-non-fde.qcow2
          qemu-img info dist/nke-node-non-fde.qcow2

      # --artifact-platform is still marked experimental in the ORAS CLI. It is
      # load-bearing: without it the manifest has no platform in its config and
      # `oras pull --platform linux/${{ matrix.arch }}` cannot select this disk.
      # Tags are arch-suffixed (see this workflow's header comment) rather
      # than one multi-platform manifest shared across matrix legs.
      - name: Push the qcow2s to GHCR
        if: github.event.inputs.dry_run != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ALIASES: ${{ steps.meta.outputs.aliases }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          read -ra aliases <<< "${ALIASES}"
          tags=""
          for alias in "${aliases[@]}"; do
            tags="${tags:+${tags},}${alias}-${ARCH}"
          done

          variants=(non-fde)
          if [[ "${{ matrix.build_fde }}" == "true" ]]; then
            variants+=(fde)
          fi

          for variant in "${variants[@]}"; do
            case "${variant}" in
              fde) repo="${REPO_FDE}" ;;
              non-fde) repo="${REPO_NON_FDE}" ;;
            esac
            ( cd dist && oras push "${repo}:${tags}" \
                --artifact-type application/vnd.nvidia.nke.node.qcow2.v1 \
                --artifact-platform "linux/${ARCH}" \
                --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.version=${VERSION}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.title=nke-node-${variant}.qcow2" \
                "nke-node-${variant}.qcow2:application/vnd.qemu.qcow2" )
          done

      - name: Show published manifests
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          oras manifest fetch --pretty "${REPO_NON_FDE}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          if [[ "${{ matrix.build_fde }}" == "true" ]]; then
            oras manifest fetch --pretty "${REPO_FDE}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          fi

      # amd64 only: see this workflow's header comment on why the GitHub
      # Release doesn't (yet) carry an arm64 qcow2 -- fanning release-asset
      # attachment in across matrix legs is separate follow-up work.
      - name: Prepare release assets
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          cp os-image/bin/nke-os-image-check dist/nke-os-image-check
          ( cd dist && sha256sum nke-node-fde.qcow2 nke-node-non-fde.qcow2 nke-os-image-check > checksums.txt )
          echo "::group::checksums"
          cat dist/checksums.txt
          echo "::endgroup::"

      - name: Create GitHub Release
        if: matrix.arch == 'amd64' && startsWith(github.ref, 'refs/tags/os-image/')
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: os-image ${{ steps.meta.outputs.version }}
          draft: true
          body: |
            os-image ${{ steps.meta.outputs.version }}: the FDE and non-FDE Packer
            node images, built and validated against nke-agent
            `${{ steps.meta.outputs.agent_version }}` (built from source at this
            commit; Ubuntu 26.04, linux/amd64). An arm64 non-FDE image also
            publishes to GHCR (see below) but isn't attached to this release yet.

            Pull the qcow2s with oras (not docker):

            ```
            oras pull ghcr.io/dsx-ai-factory/nke/os-image-fde:${{ steps.meta.outputs.version }}-amd64 --platform linux/amd64
            oras pull ghcr.io/dsx-ai-factory/nke/os-image-non-fde:${{ steps.meta.outputs.version }}-amd64 --platform linux/amd64
            oras pull ghcr.io/dsx-ai-factory/nke/os-image-non-fde:${{ steps.meta.outputs.version }}-arm64 --platform linux/arm64
            ```

            **FDE security note**: this image's `LUKS_PASSPHRASE` is the shared,
            documented build-time placeholder (`changeit`), baked into both a LUKS
            passphrase slot and GRUB's `luks.key=` kernel parameter until a node's
            first real boot completes a verified TPM bind (see
            `os-image/docs/full-disk-encryption.md`). Anyone with console/physical
            access to an unbound node can read it and unlock the volume with it.
            Verify a node closed that window with `luks-tpm-verify` before trusting
            TPM-only unlock in production.

            The GitHub Release attaches `nke-os-image-check` and checksums covering
            both qcow2s and the checker binary. The disks themselves are the OCI
            artifacts above; they are too large to attach here.
          files: |
            dist/nke-os-image-check
            dist/checksums.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: false
          generate_release_notes: false

      - name: Publish the release
        if: matrix.arch == 'amd64' && startsWith(github.ref, 'refs/tags/os-image/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);

            const { data: rel } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });

            const names = rel.assets
              .filter(a => a.state === 'uploaded' && a.size > 0)
              .map(a => a.name)
              .sort();
            const want = ['checksums.txt', 'nke-os-image-check'];
            for (const n of want) {
              if (!names.includes(n)) {
                core.setFailed(
                  `Release ${release_id} is missing ${n} (has [${names.join(', ') || 'nothing'}]). ` +
                  `It is left as an unpublished draft.`);
                return;
              }
            }

            if (rel.draft) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, draft: false, make_latest: 'false',
              });
            }
            core.info(`Published ${context.ref.replace('refs/tags/', '')} with ${names.length} assets.`);
