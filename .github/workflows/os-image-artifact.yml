name: OS Image Artifact

# Builds the Packer reference node qcow2 on an os-image/v* tag, boots it for the
# smoke test, and only then publishes. The GitHub Release is created here (not
# in release.yml) so a failed bake or smoke test never cuts a release.
#
# The payload is an OCI artifact, not a container image:
#
#   ghcr.io/nvidia/nke/os-image:v0.1.0
#     `-- platform linux/amd64   layer: nke-node.qcow2
#
#   oras pull ghcr.io/nvidia/nke/os-image:v0.1.0 --platform linux/amd64
#
# Distinct from image.yml, which compiles controller Dockerfiles and pushes
# nothing. Distinct from image-nvcr.yml, which publishes the controller
# container. This is the Ubuntu node disk the site controller boots.
on:
  push:
    tags:
      - "os-image/v[0-9]+.[0-9]+.[0-9]+"
      - "os-image/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      nke_agent_version:
        description: "Agent GHCR tag to bake (.deb preferred). Example: v0.3.0 or edge"
        required: false
        default: "edge"
        type: string
      dry_run:
        description: "Build and validate everything, but skip the GHCR push. The tag trigger always publishes; this only applies to a manual run."
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them.
  group: OS Image Artifact-${{ github.ref }}
  # Never cancel a publish midway: a half-pushed qcow2 would leave a tag
  # pointing at a truncated layer.
  cancel-in-progress: false

env:
  REPO: ghcr.io/nvidia/nke/os-image
  PACKER_SHA256: "cfefdea4ac580eba7b254ef34d25b756d4961741004e3e701a1476594d13e64a"

jobs:
  publish:
    if: github.repository == 'NVIDIA/nke'
    name: Build, verify, and publish
    # Packer QEMU needs /dev/kvm. linux-amd64-cpu16 (a container-based pool)
    # never exposed it, forcing every bake onto QEMU's tcg software emulation
    # — confirmed directly: a full FDE bake took 1h39m under tcg vs a few
    # minutes locally under real KVM, and tcg's much slower, less predictable
    # timing was implicated in several failures (a GRUB boot-menu race, an
    # intermittent overlayfs kernel oops under curtin's install). This label
    # is expected to expose /dev/kvm; "Enable KVM access" below fails the job
    # immediately if that assumption turns out wrong, rather than silently
    # falling back to the ~10x-slower emulated path the way this job used to.
    runs-on: linux-amd64-gpu-l4-latest-1
    # Sized for real KVM: base bake + FDE bake + demo-fde.sh + non-FDE bake +
    # two boot-smokes, each a few minutes, with real headroom. If this ever
    # regresses to tcg somehow, the KVM gate below fails fast instead of
    # burning the timeout finding out.
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      NKE_AGENT_VERSION: ${{ github.event.inputs.nke_agent_version || 'edge' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "oras_version=$(make --no-print-directory print-ORAS_VERSION)"
            echo "packer_version=$(make --no-print-directory print-PACKER_VERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ steps.versions.outputs.oras_version }}

      - name: Resolve version and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/os-image/* ]]; then
            version="${GITHUB_REF_NAME#os-image/}"
          else
            version="$(git describe --match 'os-image/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
            version="${version#os-image/}"
          fi

          aliases=("sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            aliases+=("${version}")
          fi

          {
            echo "version=${version}"
            echo "aliases=${aliases[*]}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing ${version} as: ${aliases[*]}"
          echo "Baking nke-agent ${NKE_AGENT_VERSION}"

      - name: Build and test nke-os-image-check
        working-directory: os-image
        run: |
          set -euo pipefail
          make test
          make build

      - name: Install QEMU, cloud-localds, swtpm, OVMF, 7z, and xorriso
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils genisoimage unzip swtpm ovmf p7zip-full xorriso
          qemu-system-x86_64 --version | head -1
          qemu-img --version | head -1
          swtpm --version

      # A gate, deliberately: this runner label is chosen specifically for
      # /dev/kvm (see the comment on runs-on above). A missing device means
      # something about the runner pool changed and every subsequent step
      # would silently fall back to tcg (packer/Makefile and boot-smoke.sh
      # both probe and fall back on their own) -- better to fail here in
      # seconds than rediscover it 1-2 hours into a tcg bake. Same pattern
      # NVIDIA/OpenShell uses for its own KVM-backed e2e VM tests.
      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::This runner did not expose /dev/kvm (expected on linux-amd64-gpu-l4-latest-1)"
            lscpu
            grep -m1 -E '^(flags|Features)' /proc/cpuinfo || true
            ls -la /dev
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --settle --name-match=kvm
          ls -l /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-
          echo "::notice::/dev/kvm present and writable; building with hardware acceleration"

      - name: Install Packer
        env:
          PACKER_VERSION: ${{ steps.versions.outputs.packer_version }}
          PACKER_SHA256: ${{ env.PACKER_SHA256 }}
        run: |
          set -euo pipefail
          zip="packer_${PACKER_VERSION}_linux_amd64.zip"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${zip}" \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/${zip}"
          actual="$(sha256sum "${tmp}/${zip}" | awk '{print $1}')"
          if [[ "${actual}" != "${PACKER_SHA256}" ]]; then
            echo "::error::checksum mismatch for ${zip}: got ${actual}, expected ${PACKER_SHA256}"
            exit 1
          fi
          unzip -d "${tmp}" "${tmp}/${zip}" packer
          sudo install -m 0755 "${tmp}/packer" /usr/local/bin/packer
          packer version

      # Needed even in a dry run: fetch-artifacts.sh (run by every `make
      # os-image*` build below) pulls nke-agent/spire-agent from the same
      # registry via oras, not just the final push.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Build the node image
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make -C os-image/packer os-image NKE_AGENT_VERSION="${NKE_AGENT_VERSION}"

      - name: Boot-smoke the qcow2
        run: make -C os-image boot-smoke

      # FDE and non-FDE are opt-in installer-based variants (see
      # os-image/nke-node-fde.pkr.hcl, nke-node-non-fde.pkr.hcl) — built and
      # validated here so a regression in either blocks publish of the base
      # image too, same as boot-smoke above. Neither is published: they have
      # no stated consumer yet, so this is build+validate only, discarded at
      # the end of the job like every other Packer output.
      - name: Build the FDE node image
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make -C os-image/packer os-image-fde NKE_AGENT_VERSION="${NKE_AGENT_VERSION}"

      # Full acceptance run: LUKS2+TPM-sealed, wrong-TPM-fails,
      # reboot-auto-unlocks. No manual/scripted console interaction needed —
      # the image auto-unlocks its own first boot via a build-time luks.key=
      # GRUB parameter (see os-image/docs/full-disk-encryption.md).
      - name: Validate FDE TPM unlock (demo-fde.sh)
        working-directory: os-image
        run: ./demo-fde.sh

      - name: Build the non-FDE node image
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make -C os-image/packer os-image-non-fde NKE_AGENT_VERSION="${NKE_AGENT_VERSION}"

      - name: Boot-smoke the non-FDE qcow2
        run: |
          make -C os-image boot-smoke \
            QCOW="${GITHUB_WORKSPACE}/os-image/packer/output-non-fde/nke-node-non-fde" \
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd

      # Runs regardless of outcome: this runner has no VNC/monitor access to
      # inspect a stuck or failed FDE/non-FDE build interactively, so the
      # guest's own serial console (boot + autoinstall output, see
      # console=ttyS0 in nke-node-fde.pkr.hcl / nke-node-non-fde.pkr.hcl) is
      # the only way to see what happened. No-op if the dir is empty/missing
      # (e.g. a failure before either build reached prepare-installer-iso).
      - name: Upload FDE/non-FDE install console logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fde-install-console-logs
          path: os-image/packer/build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Compress the qcow2 for publish
        id: disk
        run: |
          set -euo pipefail
          src="os-image/packer/output/nke-node"
          if [[ ! -f "${src}" ]]; then
            echo "::error::Packer did not write ${src}"
            ls -la os-image/packer/output || true
            exit 1
          fi
          mkdir -p dist
          qemu-img convert -p -c -O qcow2 "${src}" dist/nke-node.qcow2
          qemu-img info dist/nke-node.qcow2
          cp os-image/bin/nke-os-image-check dist/nke-os-image-check
          ( cd dist && sha256sum nke-node.qcow2 nke-os-image-check > checksums.txt )
          echo "::group::checksums"
          cat dist/checksums.txt
          echo "::endgroup::"
          echo "qcow=dist/nke-node.qcow2" >> "${GITHUB_OUTPUT}"

      # --artifact-platform is still marked experimental in the ORAS CLI. It is
      # load-bearing: without it the manifest has no platform in its config and
      # `oras pull --platform linux/amd64` cannot select this disk.
      - name: Push the qcow2 to GHCR
        if: github.event.inputs.dry_run != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ALIASES: ${{ steps.meta.outputs.aliases }}
        run: |
          set -euo pipefail
          read -ra aliases <<< "${ALIASES}"
          tags=""
          for alias in "${aliases[@]}"; do
            tags="${tags:+${tags},}${alias}"
          done

          ( cd dist && oras push "${REPO}:${tags}" \
              --artifact-type application/vnd.nvidia.nke.node.qcow2.v1 \
              --artifact-platform linux/amd64 \
              --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.version=${VERSION}" \
              --annotation "org.opencontainers.image.licenses=Apache-2.0" \
              --annotation "org.opencontainers.image.title=nke-node.qcow2" \
              nke-node.qcow2:application/vnd.qemu.qcow2 )

      - name: Show published manifest
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          oras manifest fetch --pretty "${REPO}:sha-${GITHUB_SHA}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/os-image/')
        id: release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: os-image ${{ steps.meta.outputs.version }}
          draft: true
          body: |
            Reference node OS image ${{ steps.meta.outputs.version }} (Ubuntu 26.04, linux/amd64).

            Baked nke-agent: `${{ env.NKE_AGENT_VERSION }}`.

            Pull the qcow2 with oras (not docker):

            ```
            oras pull ghcr.io/nvidia/nke/os-image:${{ steps.meta.outputs.version }} --platform linux/amd64
            ```

            The GitHub Release attaches `nke-os-image-check` and checksums. The disk
            itself is the OCI artifact above; it is too large to attach here.
          files: |
            dist/nke-os-image-check
            dist/checksums.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: false
          generate_release_notes: false

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/os-image/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);

            const { data: rel } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });

            const names = rel.assets
              .filter(a => a.state === 'uploaded' && a.size > 0)
              .map(a => a.name)
              .sort();
            const want = ['checksums.txt', 'nke-os-image-check'];
            for (const n of want) {
              if (!names.includes(n)) {
                core.setFailed(
                  `Release ${release_id} is missing ${n} (has [${names.join(', ') || 'nothing'}]). ` +
                  `It is left as an unpublished draft.`);
                return;
              }
            }

            if (rel.draft) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, draft: false, make_latest: 'false',
              });
            }
            core.info(`Published ${context.ref.replace('refs/tags/', '')} with ${names.length} assets.`);
