#
# Regenerates the files a Go dependency bump invalidates, and commits them onto
# the Dependabot branch, so a bot pull request arrives complete instead of
# arriving broken.
#
# Dependabot maintains go.mod and go.sum and nothing else. This repository has
# three more artefacts derived from those files, and Dependabot knows about none
# of them:
#
#   go.work.sum                  #82 and #83 both failed
#                                `Check go.work and go.work.sum are current`
#   vendor/                      #84 added a root vendor tree,
#                                which puts the workspace in -mod=vendor, so a
#                                go.mod change without it stops every build.
#                                #90 is red on exactly this today.
#   THIRD_PARTY_NOTICES.md       attribution goes stale and the
#   (one per redistributed       failure surfaces on main after the merge
#    binary: agent, controller,
#    cli)
#
# `make work-sync` regenerates the first two plus every module's go.mod and
# go.sum; `make notices` in each of the three module directories regenerates the
# attribution files.
#
# Copied from NVIDIA/NVSentinel's .github/workflows/dependabot-gomod-fixup.yml,
# which has been doing this for go.mod and go.sum since 2026-08 and is the only
# implementation of this pattern in the organisation. The shape is theirs. What
# is widened here is the set of files the guards permit, and that widening is
# the whole of the risk -- read the two guards below before anything else.
#
# WHY pull_request_target, WHICH IS NORMALLY AN ANTI-PATTERN
#
# A workflow triggered by a Dependabot pull request gets a READ-ONLY token, so
# it cannot push. pull_request_target runs in the base repository's context with
# a writable token instead. The danger of that event is that it is usually
# paired with checking out untrusted pull-request code, which then runs with
# secrets in scope.
#
# That danger is excluded here by the fourth condition in `if:` below:
#
#     github.event.pull_request.head.repo.full_name == github.repository
#
# Dependabot branches live INSIDE this repository. A fork can never satisfy that
# condition, so the code checked out below is always code that is already in
# NVIDIA/nke. Removing that line turns this workflow into a credential leak.
# Do not remove that line.
#
# Dependabot force-pushes when it rebases, which discards this commit. That is
# handled rather than prevented: `synchronize` is in the trigger list, so the
# force-push re-runs this workflow and the fixup is reapplied.
#
# THE ONE SECRET THIS JOB CARRIES
#
# NKE_INTERNAL_RO_TOKEN reads the internal module controller/go.mod depends on.
# It is a fine-grained token scoped to Contents: read-only on that one
# repository, so it cannot write anywhere, and it is exposed only to the
# regeneration step -- see the comment on GIT_CONFIG_COUNT there.
#
# Note the ordering that makes this safe: GUARD 1 runs BEFORE the secret is in
# scope, so by the time the token exists the branch has already been proven to
# contain nothing but go.mod and go.sum changes. Keep it in that order.
#
# The token is a fine-grained PAT and therefore EXPIRES. When it does, every
# Dependabot pull request starts failing on `make work-sync` with
# `could not read Username for 'https://github.com'` again. That is the symptom
# to recognise; the fix is to reissue the token, not to debug the bump.

name: Dependabot Fixup

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Dependabot Fixup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  fixup:
    name: Regenerate the files a bump invalidates
    # All four conditions matter. See the header for why the third-from-last is
    # load-bearing for security rather than for correctness.
    if: >
      github.repository == 'dsx-ai-factory/nke' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/go_modules/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      # GUARD 1 of 2, before running anything.
      #
      # Dependabot writes only go.mod and go.sum for a gomod update. Anything
      # else on the branch means the branch is not what it claims to be, and
      # this workflow must not run generators over it. This is deliberately
      # NARROWER than the guard after the run: it describes what Dependabot is
      # allowed to have written, not what we are allowed to write.
      - name: Guard — the branch must contain only Go module changes
        id: dependency-only
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const disallowed = files
              .map((file) => file.filename)
              .filter((name) => !/(^|\/)go\.(mod|sum)$/.test(name));

            if (disallowed.length > 0) {
              core.notice(`Skipping fixup: this pull request changes non-module files: ${disallowed.join(', ')}`);
              core.setOutput('skip', 'true');
              return;
            }

            core.setOutput('skip', 'false');

      - name: Checkout the Dependabot branch
        if: steps.dependency-only.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # persist-credentials: false, then an explicit token on the push
          # below. Leaving the checkout credentials in .git/config would make
          # every later step able to push, including anything a generator runs.
          persist-credentials: false

      - name: Set up Go
        if: steps.dependency-only.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Deliberately the same source notices-check.yml reads. This job
          # WRITES the files that job VERIFIES, so if the two resolved different
          # Go versions the fixup could produce a file the check then rejects.
          #
          # That job moved from agent/go.mod to go.work when it started checking
          # the controller: go-licenses embeds golang.org/x/tools/go/packages and
          # must be built with the SAME toolchain `go list` runs under, and a
          # member module's floor is not the workspace's. This follows it.
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Regenerate the derived files
        if: steps.dependency-only.outputs.skip != 'true'
        env:
          # setup-go pins GOTOOLCHAIN=local. A bump can raise a member module's
          # `go` directive above the workspace's own -- observed on #83 --
          # and `go work sync` then fails outright rather
          # than repairing it. auto lets Go fetch the newer toolchain so the
          # repair can happen, which is the whole point of this job.
          GOTOOLCHAIN: auto

          # controller/go.mod requires github.com/dsx-ai-factory/cluster-api-provider-nico,
          # which is an internal repository. Every other job in this repository is
          # offline -- a committed vendor/ tree means they never resolve a module --
          # so this is the only job that reaches the network for the module graph,
          # and it is the only one that needs credentials. #108 is the failure this
          # fixes:
          #
          #   git ls-remote ... exit status 128:
          #   fatal: could not read Username for 'https://github.com'
          #
          # GOPRIVATE keeps the internal path off proxy.golang.org and
          # sum.golang.org, which cannot serve it in any case; the rewrite below is
          # what gets git past the prompt.
          GOPRIVATE: github.com/dsx-ai-factory/*

          # GIT_CONFIG_COUNT rather than `git config --global`. A global write
          # would leave the token in ~/.gitconfig for every LATER step of this
          # job, which is the same objection the header raises against leaving
          # checkout credentials in .git/config. These variables are scoped to
          # this step and touch no file on disk.
          #
          # The rewrite is scoped to github.com/dsx-ai-factory/ rather than github.com/ so
          # the token is not attached to requests for public modules. It also
          # cannot capture the push in the final step: that URL carries its own
          # userinfo, so it does not have the `https://github.com/dsx-ai-factory/` prefix
          # this matches on.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.NKE_INTERNAL_RO_TOKEN }}@github.com/dsx-ai-factory/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/dsx-ai-factory/
        run: |
          set -euo pipefail
          # Regenerates go.work, go.work.sum, every module's go.mod and go.sum,
          # and vendor/. One command, because they are one consistent set.
          make work-sync
          # Attribution is per module, and notices-check.yml verifies one file
          # per redistributed binary. Every module it VERIFIES has to be
          # regenerated here, or the bump lands with the rest of the derived set
          # repaired and attribution stale -- which is how main went red on
          # #124 and #125, both on controller/THIRD_PARTY_NOTICES.md, while this
          # job reported success.
          #
          make notices

      # GUARD 2 of 2, after running the generators and before committing.
      #
      # This is the widened list, and it is the diff from NVSentinel's version,
      # which permits go.mod and go.sum only. Every entry is a file this job
      # regenerates on purpose. A generator that writes anything else -- source,
      # a workflow, a Dockerfile -- fails the job rather than committing.
      - name: Guard — refuse to commit anything but the derived files
        if: steps.dependency-only.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to regenerate; the bump was already complete."
            exit 0
          fi
          # --others --exclude-standard alongside the diff: vendoring ADDS
          # directories when a dependency gains one, and `git diff` says nothing
          # about a path git is not tracking. #91 makes the same point.
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          bad="$(printf '%s\n' "$changed" | grep -Ev \
            -e '(^|/)go\.(mod|sum)$' \
            -e '^go\.work(\.sum)?$' \
            -e '^vendor/' \
            -e '^agent/THIRD_PARTY_NOTICES\.md$' \
            -e '^controller/THIRD_PARTY_NOTICES\.md$' \
            -e '^cli/THIRD_PARTY_NOTICES\.md$' \
            -e '^os-image/THIRD_PARTY_NOTICES\.md$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Refusing to commit files outside the derived set:"
            printf '%s\n' "$bad" | sed 's/^/    /'
            exit 1
          fi
          printf '%s\n' "$changed" | sed 's/^/  regenerated: /'

      - name: Commit onto the Dependabot branch
        if: steps.dependency-only.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pathspecs, not `git add -A`. The guard above already refused
          # anything outside this set, so this is belt and braces -- but it
          # means a future edit that loosens the guard still cannot commit an
          # arbitrary file by accident.
          git add -- \
            ':(glob)**/go.mod' ':(glob)**/go.sum' \
            go.work go.work.sum \
            vendor \
            agent/THIRD_PARTY_NOTICES.md \
            controller/THIRD_PARTY_NOTICES.md \
            cli/THIRD_PARTY_NOTICES.md \
            os-image/THIRD_PARTY_NOTICES.md

          git commit -m "build: regenerate workspace, vendor and notices for this bump"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
