#
# Unit-test lane for the agent module. Mirrors `make test` in agent/
# (`go test ./...`) and only runs when agent (or this workflow) changes, so
# unrelated monorepo PRs are not blocked by it.
#
# GitHub-hosted runners, not the self-hosted linux-*-cpu16 pool, deliberately.
# Self-hosted runners do not receive pull_request events -- see the header of
# lint.yml -- so using them would cost coverage of fork and Dependabot pull
# requests. The agent module resolves from the committed root vendor/ tree
# (workspace mode), so this needs no NVIDIA runner and no credentials.
#
# Go Build already compiles the workspace; this job is the missing `go test`
# half for agent/.

name: Agent Unit Tests

# The two path lists are duplicated by hand. github.com has supported YAML
# anchors since August 2025, but GitHub Enterprise Server does not, and merge
# keys are still unsupported everywhere. Keep the two lists identical.
on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'go.work'
      - 'go.work.sum'
      - 'vendor/**'
      - '.github/workflows/agent-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - 'go.work'
      - 'go.work.sum'
      - 'vendor/**'
      - '.github/workflows/agent-test.yml'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a run on main; the newer workflows here all guard this.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Workspace mode (default) so tests resolve from the committed vendor/
      # tree. go.work carries the toolchain that satisfies every module.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Run unit tests
        working-directory: agent
        # Same command as `make test`. No -race here; enabling the race
        # detector should be an explicit follow-up.
        run: make test
