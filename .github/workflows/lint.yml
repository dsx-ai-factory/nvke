name: Lint

# Nothing here needs an NVIDIA runner: the whole workspace resolves from the
# committed vendor/ tree, so merge-gate.yml calls this on the real pull_request
# event, including fork and Dependabot pull requests. The standalone push
# trigger is post-merge coverage on main; naming the mirrored PR branches here
# too would run the same lint jobs a second time.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Lint-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Do not cancel a run on main: back-to-back merges would otherwise
  # discard this check's result for the intermediate commit, leaving a
  # commit on main that nothing ever verified. Same guard as the other
  # workflows here.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This workflow works one module at a time, as it did before the repository
# gained a root go.work. GOWORK=off keeps it that way. It is also required:
# actions/setup-go pins GOTOOLCHAIN=local, and the Go version installed from a
# module's go.mod is older than the one go.work asks for, so leaving the
# workspace on fails with "go.work requires go >= 1.26.0".
env:
  GOWORK: "off"

jobs:
  lint:
    # Keep the name stable for readers of the aggregate gate and its history.
    name: golangci-lint
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Run golangci-lint
        working-directory: agent
        run: make lint

  lint-controller:
    name: golangci-lint (controller)
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    # make lint gives golangci-lint a 20m budget on this module; leave headroom
    # for an uncached run.
    timeout-minutes: 25
    permissions:
      contents: read
    # Unlike the module-at-a-time jobs, this one runs in WORKSPACE mode
    # (GOWORK back to its default, overriding the workflow-level "off"): the
    # controller depends on github.com/NVIDIA/cluster-api-provider-nico, which
    # is INTERNAL visibility until it is open-sourced, so its packages are only
    # reachable through the committed root vendor/ tree — and vendor is a
    # workspace-level construct here. go-version-file is go.work for the same
    # reason: workspace mode requires the workspace's Go.
    env:
      GOWORK: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          # go.work.sum holds only the hashes NOT already in a member's go.sum,
          # so the versions actually linked often appear in it zero times. Keyed
          # on it alone, a dependency bump leaves the key unchanged and restores
          # a stale cache. Same block as go-build.yml.
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Run golangci-lint
        working-directory: controller
        run: make lint

  lint-cli:
    name: golangci-lint (cli)
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    # cli depends only on public modules, so it lints one module at a time like
    # agent and nico-vms (workflow-level GOWORK=off applies). It is its own
    # module, so no other lint job reaches it.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: |
            cli/go.sum
            **/go.sum

      - name: Run golangci-lint
        working-directory: cli
        run: make lint

  lint-nico-mock:
    name: golangci-lint (nico-mock)
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    # A nested module: `go list ./...` in controller/ does not reach it, so
    # controller's own lint job cannot cover it and this is the only thing that
    # does. Every dependency is public, so it lints one module at a time like
    # agent and nico-vms (workflow-level GOWORK=off applies).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/hack/nico-mock/go.mod
          cache: true
          cache-dependency-path: |
            controller/hack/nico-mock/go.sum
            **/go.sum

      - name: Run golangci-lint
        working-directory: controller/hack/nico-mock
        run: make lint

  # controller/api has no Makefile of its own, unlike every other module here,
  # so this job runs golangci-lint directly rather than through `make lint`.
  # It is the generated oapi-codegen client plus its models; it lints clean
  # today and this job is what keeps it that way.
  lint-api:
    name: golangci-lint (controller/api)
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    # WORKSPACE mode, for the same reason the controller job above uses it, and
    # arrived at the hard way: this job failed with "inconsistent vendoring in
    # controller/api" listing fourteen of its own direct requirements.
    #
    # controller/api has no .golangci.yml, so golangci-lint walks up and finds
    # controller/.golangci.yml, which sets `modules-download-mode: vendor`. That
    # setting is right for controller/ and is inherited here by accident. With
    # the workflow-level GOWORK=off, -mod=vendor then resolves against the root
    # vendor/ tree while treating controller/api as a lone main module, and the
    # tree is a workspace-level construct whose explicit markers do not describe
    # any single member. Turning the workspace back on makes the two agree.
    env:
      GOWORK: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.work, not controller/api/go.mod: workspace mode requires the
      # workspace's Go, and setup-go pins GOTOOLCHAIN=local so the installed
      # version is the only one available. Same block as the controller job.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Pinned to the version controller/ and cli/ already use, so the whole
      # workspace reports against one linter release.
      - name: Run golangci-lint
        working-directory: controller/api
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 10m

  lint-nico-vms:
    name: golangci-lint (nico-vms)
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    # nico-vms builds from public dependencies only, so it lints one module
    # at a time like agent (workflow-level GOWORK=off applies).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/nico-vms/go.mod
          cache: true
          cache-dependency-path: controller/nico-vms/go.sum

      - name: Run golangci-lint
        working-directory: controller/nico-vms
        run: make lint

  lint-os-image:
    name: golangci-lint (os-image)
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: os-image/go.mod
          cache: true
          cache-dependency-path: |
            os-image/go.sum
            **/go.sum

      - name: Run golangci-lint
        working-directory: os-image
        run: make lint
