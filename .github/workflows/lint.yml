name: Lint

# Nothing here needs an NVIDIA runner: the whole workspace resolves from the
# committed vendor/ tree, so merge-gate.yml calls this on the real pull_request
# event, including fork and Dependabot pull requests. The standalone push
# trigger is post-merge coverage on main; naming the mirrored PR branches here
# too would run the same lint jobs a second time.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Lint-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Do not cancel a run on main: back-to-back merges would otherwise
  # discard this check's result for the intermediate commit, leaving a
  # commit on main that nothing ever verified. Same guard as the other
  # workflows here.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This workflow works one module at a time, as it did before the repository
# gained a root go.work. GOWORK=off keeps it that way. It is also required:
# actions/setup-go pins GOTOOLCHAIN=local, and the Go version installed from a
# module's go.mod is older than the one go.work asks for, so leaving the
# workspace on fails with "go.work requires go >= 1.26.0".
env:
  GOWORK: "off"

jobs:
  # One matrix, not seven near-identical jobs. They differed in five values --
  # the directory, GOWORK, the go-version file, the cache key and the timeout --
  # and six of the seven already ran `make lint`. The seventh, controller/api,
  # open-coded a golangci-lint install because it had no Makefile; it has one
  # now, so every entry runs the same command.
  #
  # The matrix keeps the parallelism: GitHub still schedules one runner per
  # entry, so the wall clock is unchanged.
  lint:
    name: golangci-lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    env:
      # Workspace mode for the four modules that lint against the root vendor/
      # tree -- controller, controller/api, controller/deploy/charts and
      # capd-reboot-controller; module mode for the rest, which resolve their
      # own go.mod. Empty means "use the default", overriding the
      # workflow-level off.
      GOWORK: ${{ matrix.gowork }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # controller is the long pole at about nine minutes, hence 25.
          - name: controller
            dir: controller
            goversion: go.work
            gowork: ""
            timeout: 25
          - name: controller/api
            dir: controller/api
            goversion: go.work
            gowork: ""
            timeout: 15
          - name: controller/deploy/charts
            dir: controller/deploy/charts
            goversion: go.work
            gowork: ""
            timeout: 15
          - name: provisioned-provider
            dir: cluster-api-provider-provisioned
            goversion: cluster-api-provider-provisioned/go.mod
            gowork: "off"
            timeout: 15
          - name: agent
            dir: agent
            goversion: agent/go.mod
            gowork: "off"
            timeout: 15
          - name: cli
            dir: cli
            goversion: cli/go.mod
            gowork: "off"
            timeout: 15
          - name: nico-sim
            dir: controller/nico-sim
            goversion: controller/nico-sim/go.mod
            gowork: "off"
            timeout: 15
          - name: controller/test/e2e
            dir: controller/test/e2e
            goversion: controller/test/e2e/go.mod
            gowork: "off"
            timeout: 15
          - name: capd-reboot-controller
            dir: controller/hack/capd-reboot-controller
            goversion: go.work
            gowork: ""
            timeout: 15
          - name: os-image
            dir: os-image
            goversion: os-image/go.mod
            gowork: "off"
            timeout: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # **/go.sum for every entry. Two jobs previously keyed on their own go.sum
      # alone, with no reason recorded, so they would restore a stale cache after
      # a cross-module dependency bump.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.goversion }}
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Run golangci-lint
        working-directory: ${{ matrix.dir }}
        run: make lint
