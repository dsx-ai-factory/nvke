#
# Fails when go.work, go.work.sum or vendor/ is stale.
#
# `make work-check` asserts six things, and each one has a failure this
# repository can actually produce:
#
#   1. go.work and go.work.sum are tracked. `git diff` reports nothing for an
#      untracked path, so without this the whole check passes in silence.
#   2. go.work lists exactly the modules the Makefile expects.
#   3. go.work carries no replace directive. `make work-full` writes one for
#      work inside NVIDIA; committed, it would repoint a dependency for every
#      module in the workspace while the module list still looked right.
#   4. Every go.mod in the tree is classified in the Makefile, as either a
#      workspace member or an excluded module. Every module is a member today
#      and PRIVATE_MODULES is empty, but the check is on both lists rather than
#      on one: a new module in neither would never be built or synced, and
#      nothing else in CI would report it.
#   5. A full refresh changes nothing. This is the ordinary staleness case: a
#      dependency bump lands in one module, and the other modules then build
#      against a version none of their go.mod files admits to.
#   6. vendor/ matches the go.mod files above it, tracked files and new ones
#      both. A root vendor tree puts the workspace in -mod=vendor, so a stale
#      one does not degrade the build, it stops it -- and #84 added the tree
#      with no check, so main broke exactly this way on 2026-08-13.
#
# This runs on a public runner, and go.work now lists every module in the
# repository -- #76 removed the carbide SDK, so there is nothing left to leave
# out. The one internal dependency, github.com/dsx-ai-factory/cluster-api-provider-nico,
# is carried in the committed vendor/ tree, so builds and the static checks here
# need no credentials.
#
# Only the freshness re-derivation in step 5 does, because `go work vendor`
# resolves that module for real rather than reading the vendor tree. `make
# work-check` probes for it and skips that block when it is unreachable.
#
# On this repository the job now carries a read-only token for that module, so
# the probe succeeds and step 5 runs. It did not before, and the job went green
# on every run having skipped the one assertion its name is about. See the step
# for what the credential is and how a fork degrades. Drop both when
# cluster-api-provider-nico is public. See docs/go-workspace.md.
name: Go Workspace Check

# The two path lists are duplicated by hand. github.com has supported YAML
# anchors since August 2025, but GitHub Enterprise Server does not, and merge
# keys are still unsupported everywhere. Keep the two lists identical.
# workflow_call is what merge-gate.yml uses to call this as a reusable workflow.
# Its own `pull_request:` trigger is gone: pull requests reach it through the
# gate, so it runs once per pull request rather than twice.
#
# A called workflow does not apply its own `paths:` filter, so on a pull request
# this runs whatever changed. That is deliberate -- see the note in
# merge-gate.yml. The filter below still applies to `push`.
on:
  push:
    branches: [main]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'vendor/**'
      - 'Makefile'
      - '.github/workflows/go-work-check.yml'
  workflow_call:
    secrets:
      NKE_INTERNAL_RO_TOKEN:
        description: >-
          Read-only token for the private cluster-api-provider-nico module.
          Optional: without it the full re-derivation takes its documented
          skip branch, which is what a fork pull request already gets.
        required: false
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so every workflow merge-gate.yml calls would
  # compute the same group and cancel each other -- 8 of 9 calls died that way,
  # reported to the gate as failures with no jobs and no error message.
  group: Go Workspace Check-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Do not cancel a run on main; the newer workflows here all guard this.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  work-check:
    name: Check go.work and go.work.sum are current
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    # Raised from 10: step 5 now runs, and it downloads the whole module graph
    # and re-vendors 191 modules. 36s locally with a warm cache.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          # go.work.sum holds only the hashes NOT already in a member's go.sum,
          # so the versions actually linked often appear in it zero times. Keyed
          # on it alone, a dependency bump leaves the key unchanged and restores
          # a stale cache.
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # The credential is what makes step 5 run. Without it the probe in
      # `make work-check` cannot reach cluster-api-provider-nico, so the job
      # printed its skip notice on every run and went green having checked only
      # the four static assertions -- while its name claimed the workspace was
      # current. The staleness case it exists to catch was never tested.
      #
      # Same three variables as dependabot-fixup.yml, for the same reasons.
      # GOPRIVATE keeps the internal path off proxy.golang.org and sum.golang.org,
      # which cannot serve it. The rewrite gets git past the username prompt, and
      # is scoped to github.com/dsx-ai-factory/ so the token is not sent to public hosts.
      # GIT_CONFIG_COUNT keeps it to this step and out of ~/.gitconfig.
      #
      # A pull request from a fork gets no secrets, so the rewrite is empty
      # there, the probe fails and the job takes the skip branch as before. That
      # is the intended degradation: an outside contributor cannot reach the
      # module either, and the four static assertions still run for them.
      - name: Verify the workspace is current
        env:
          GOPRIVATE: github.com/dsx-ai-factory/*
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.NKE_INTERNAL_RO_TOKEN }}@github.com/dsx-ai-factory/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/dsx-ai-factory/
        run: make work-check
