name: Qualify triage

# Names why the jobs of a qualification run failed, from release/triage.yaml,
# prints the result in the run summary, and, for a beta tag, replies with it in
# the tag's Slack thread. It can also start the failed jobs again, once (see
# ONE RE-RUN). It deletes nothing and takes no Forge machine itself.
#
# TWO WAYS TO RUN. When a Qualify e2e run on a beta tag finishes with a failure,
# this runs on its own, but only if the repository variable QUALIFY_TRIAGE_POST
# is "true": that variable is the switch, and unset it is off. By hand, a
# dispatch with a run id triages that run. It prints what it would post and
# posts only when `post` is set, so a rule can be checked against an old failure
# with no side effect.
#
# ONE RE-RUN. When every failed job of a tag run's first attempt is a failure
# whose rule says rerun-failed, this starts the run's failed jobs again, once,
# and says so in the thread. Anything a person should read keeps the whole run
# from being re-run, and so does a second failure. It acts only if the variable
# QUALIFY_TRIAGE_RERUN of this environment is "true", which is a different
# switch from the one for posting, or a dispatch sets `rerun`. Without either it
# prints what it would do. A re-run started with this workflow's token does not
# start this workflow again, so a second failure is not triaged on its own.
#
# THE THREAD. The qualification saves its Slack thread as the run artifact
# notify-state-<run id>. This downloads it and only ever replies: a run with no
# saved thread, or one older than the artifact's retention, posts nothing, because
# triage cannot start a thread of its own. The conversation is the tag, so the
# reply lands under the tag's other messages.
#
# ONE RUN, ONE ATTEMPT. A re-run finishes as another completion of the same run.
# Each completion reads only its own attempt, so a retry is not reported twice.
# A manual run with no attempt prints every attempt in its summary, because a
# re-run that passed hides the attempt that failed.
#
# UNTRUSTED INPUT. This workflow runs from the default branch with the
# repository's secrets, so it acts only on a run of a tag push, whose tag the
# release rules protect, and never on a run of a pull request. A run's branch
# name, a job's name and its log text are all treated as data: they reach the
# scripts through the environment, are checked or escaped there, and are never
# interpolated into a command.
on:
  workflow_run:
    workflows: [Qualify e2e]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: The id of the workflow run to triage, such as the number in its URL.
        type: string
        required: true
      attempt:
        description: Only this attempt. Empty is the run's latest attempt in a Slack post, and every attempt in the summary.
        type: string
        required: false
        default: ''
      post:
        description: Post the findings in the run's Slack thread, a beta tag run only. Off prints what would be posted.
        type: boolean
        required: false
        default: false
      rerun:
        description: Re-run the failed jobs once, if every one is a failure a re-run has fixed before. Off prints what would be done.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # Lists a run's jobs, downloads their logs, and downloads the saved thread.
  actions: read

# A re-run is another completion with its own attempt. Never cancel one that is
# posting.
concurrency:
  group: qualify-triage-${{ github.event.workflow_run.id || inputs.run-id }}-${{ github.event.workflow_run.run_attempt || inputs.attempt || 'latest' }}
  cancel-in-progress: false

jobs:
  triage:
    name: Classify the failed jobs
    if: >-
      github.repository_id == '1323115536' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'))
    # The bot token for Slack is a secret of this environment, as it is for the
    # qualification's own plan job, which uses it unattended.
    environment: ci-shared
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Starting the failed jobs again writes to Actions. Nothing else here does.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Build triage
        run: go build -o "${RUNNER_TEMP}/triage" ./release/cmd/triage

      - name: Check the rules
        run: '"${RUNNER_TEMP}/triage" validate --rules release/triage.yaml'

      # Everything after this reads the run from the API, not from the event
      # payload, and only a validated tag is ever written to an output.
      - name: Read the run
        id: run
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ATTEMPT: ${{ inputs.attempt }}
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INPUT_POST: ${{ inputs.post }}
          VAR_POST: ${{ vars.QUALIFY_TRIAGE_POST }}
          INPUT_RERUN: ${{ inputs.rerun }}
          VAR_RERUN: ${{ vars.QUALIFY_TRIAGE_RERUN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          [[ "${RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::the run id is not a number"; exit 1; }
          [[ -z "${INPUT_ATTEMPT}" || "${INPUT_ATTEMPT}" =~ ^[0-9]+$ ]] || { echo "::error::the attempt is not a number"; exit 1; }

          IFS=$'\t' read -r head event attempt url < <(
            gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" \
              --jq '[.head_branch, .event, .run_attempt, .html_url] | @tsv'
          )

          # A beta tag run: a push whose branch is a version tag.
          tag=""
          if [[ "${event}" == push && "${head}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            tag="${head}"
          fi

          # A tag's thread is only posted to when told to: by the variable for
          # an automatic run, by `post` for a manual one.
          post=false
          if [[ -n "${tag}" ]]; then
            if [[ "${EVENT_NAME}" == workflow_run && "${VAR_POST}" == true ]]; then post=true; fi
            if [[ "${EVENT_NAME}" == workflow_dispatch && "${INPUT_POST}" == true ]]; then post=true; fi
          fi

          # The re-run has its own switch: posting says what happened, and
          # re-running changes it.
          rerun=false
          if [[ -n "${tag}" ]]; then
            if [[ "${EVENT_NAME}" == workflow_run && "${VAR_RERUN}" == true ]]; then rerun=true; fi
            if [[ "${EVENT_NAME}" == workflow_dispatch && "${INPUT_RERUN}" == true ]]; then rerun=true; fi
          fi

          # An automatic run reads the attempt that finished, from the event and
          # not the API: a re-run started before this step runs makes the API's
          # latest attempt the new one, which has no failed jobs yet. A manual
          # run reads what it was given, else every attempt for the summary and
          # the latest for a post.
          want_attempt="${INPUT_ATTEMPT}"
          if [[ "${EVENT_NAME}" == workflow_run ]]; then
            [[ "${EVENT_ATTEMPT}" =~ ^[0-9]+$ ]] || { echo "::error::the event's attempt is not a number"; exit 1; }
            want_attempt="${EVENT_ATTEMPT}"
          fi

          {
            echo "run-id=${RUN_ID}"
            echo "tag=${tag}"
            echo "url=${url}"
            echo "post=${post}"
            echo "rerun=${rerun}"
            echo "post-attempt=${want_attempt:-${attempt}}"
            echo "summary-attempt=${want_attempt}"
          } >> "${GITHUB_OUTPUT}"

      - name: Classify
        env:
          RUN_ID: ${{ steps.run.outputs.run-id }}
          ATTEMPT: ${{ steps.run.outputs.summary-attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          TRIAGE="${RUNNER_TEMP}/triage" RULES=release/triage.yaml \
            release/hack/triage-run.sh "${RUN_ID}" | tee -a "${GITHUB_STEP_SUMMARY}"

      # A dry run needs the thread too: a reply is only rendered when there is a
      # thread to reply in. Downloading it takes no secret. A run with no saved
      # thread, or an expired one, previews nothing; the summary above still
      # names every failure.
      - name: Restore the thread
        if: steps.run.outputs.tag != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notify-state-${{ steps.run.outputs.run-id }}
          path: ${{ runner.temp }}/notify-state
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}

      # A notification is a courtesy: it must not turn a diagnosis into a
      # failure. The token reaches this step and no other, and only for a real
      # post.
      - name: Reply in the tag's thread
        if: steps.run.outputs.tag != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          RUN_ID: ${{ steps.run.outputs.run-id }}
          ATTEMPT: ${{ steps.run.outputs.post-attempt }}
          RUN_URL: ${{ steps.run.outputs.url }}
          DRY_RUN: ${{ steps.run.outputs.post == 'true' && 'false' || 'true' }}
          NOTIFY_STATE_KEY: ${{ steps.run.outputs.tag }}
          STATE_DIR: ${{ runner.temp }}/notify-state
          SLACK_BOT_TOKEN: ${{ steps.run.outputs.post == 'true' && secrets.NOTIFY_SLACK_BOT_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          FORMAT=jsonl TRIAGE="${RUNNER_TEMP}/triage" RULES=release/triage.yaml \
            release/hack/triage-run.sh "${RUN_ID}" | release/hack/triage-post.sh

      # The one retry. It runs after the reply, so the thread has the diagnosis
      # before it hears about the re-run, and it is not allowed to fail the run:
      # a re-run that did not start leaves the summary saying why. The token
      # that writes to Actions is the workflow's own, and the Slack token reaches
      # this step only for a real post, as it does in the one above.
      - name: Re-run the failed jobs once
        if: steps.run.outputs.tag != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          RUN_ID: ${{ steps.run.outputs.run-id }}
          ATTEMPT: ${{ steps.run.outputs.post-attempt }}
          RUN_URL: ${{ steps.run.outputs.url }}
          DRY_RUN: ${{ steps.run.outputs.rerun == 'true' && 'false' || 'true' }}
          NOTIFY_DRY_RUN: ${{ steps.run.outputs.post == 'true' && 'false' || 'true' }}
          NOTIFY: go run ./release/cmd/notify
          NOTIFY_STATE_KEY: ${{ steps.run.outputs.tag }}
          STATE_DIR: ${{ runner.temp }}/notify-state
          SLACK_BOT_TOKEN: ${{ steps.run.outputs.post == 'true' && secrets.NOTIFY_SLACK_BOT_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          FORMAT=jsonl TRIAGE="${RUNNER_TEMP}/triage" RULES=release/triage.yaml \
            release/hack/triage-run.sh "${RUN_ID}" | release/hack/triage-rerun.sh | tee -a "${GITHUB_STEP_SUMMARY}"
