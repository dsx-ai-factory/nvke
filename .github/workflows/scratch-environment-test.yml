name: SCRATCH environment conditional test

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Whether the gated job should require approval
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  conditional:
    name: conditional (gate=${{ inputs.gate }})
    runs-on: ubuntu-latest
    environment: ${{ (inputs.gate == true) && 'forge' || '' }}
    steps:
      - run: echo "ran without manual approval if you see this quickly"
