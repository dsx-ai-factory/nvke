name: OS Image EFI

# Builds qcow-imager.efi and uploads it as a workflow artifact. Nothing is
# published: this proves the artifact can be built from source in this repo,
# which it previously could not. See os-image/efi/README.md.
#
# Every step is a `make -C os-image/efi` target a developer runs by hand, so a
# red run here reproduces locally. The build itself lives in
# NVIDIA/infra-controller, pinned by commit in os-image/efi/Makefile.
#
# Advisory, not a merge-gate member: it needs an NVIDIA self-hosted runner and
# takes about twenty minutes. Do not add it to merge-gate.yml.
#
# x86_64 only. build-efi-arm64 works under qemu-user emulation, but that would
# roughly double an already twenty-minute job for an artifact nothing consumes
# yet, and the only arm64 label this repo may use is a container-based pool
# that cannot host mkosi at all.
on:
  push:
    branches:
      - main
      # The mirror branch, not `pull_request`: the org forbids pull_request
      # events on self-hosted runners, and this job needs one.
      - "pull-request/[0-9]+"
    paths:
      - "os-image/efi/**"
      # Without this, a change to the lane's own definition does not run it.
      - .github/workflows/os-image-efi.yml
  workflow_dispatch:
    inputs:
      infra_controller_commit:
        description: "Override the pinned NVIDIA/infra-controller commit. Empty uses the Makefile pin."
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  # A literal name, NOT ${{ github.workflow }}, which resolves to the caller's
  # name inside a called workflow.
  group: OS Image EFI-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-efi:
    if: github.repository == 'dsx-ai-factory/nke'
    name: Build qcow-imager.efi (x86_64)
    # Not for /dev/kvm -- mkosi builds a Unified Kernel Image and boots
    # nothing. It is for the host shape: mkosi needs unprivileged user
    # namespaces, and on Ubuntu 24.04 that means turning off two AppArmor
    # sysctls. This pool is an ephemeral single-tenant VM with passwordless
    # sudo, so `sysctl -w` works. linux-amd64-cpu16 is container-based with a
    # read-only /proc/sys, where the setup step cannot work at all.
    runs-on: linux-amd64-gpu-l4-latest-1
    # A cold build is about twenty minutes, half of it mkosi's own tools image.
    # Nothing is cached between runs, so every run is cold.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the build host
        run: make -C os-image/efi setup-host

      # Fails naming the missing piece, rather than letting mkosi fail twenty
      # minutes in naming a keyring file.
      - name: Check the host can build
        run: |
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          PATH="${HOME}/.cargo/bin:${PATH}" make -C os-image/efi check-deps

      - name: Build qcow-imager.efi
        run: |
          make -C os-image/efi build-efi-x86 \
            ${IC_COMMIT_OVERRIDE:+IC_COMMIT="${IC_COMMIT_OVERRIDE}"}
        env:
          IC_COMMIT_OVERRIDE: ${{ github.event.inputs.infra_controller_commit }}

      # mkosi exiting 0 having produced something that is not a bootable EFI
      # would otherwise be uploaded and only noticed by whoever tried to boot it.
      - name: Verify the output is a bootable EFI binary
        run: |
          set -euo pipefail
          efi=os-image/efi/output/x86_64/qcow-imager.efi
          [ -s "${efi}" ] || { echo "::error::${efi} is missing or empty"; exit 1; }
          described=$(file -b "${efi}")
          echo "${described}"
          case "${described}" in
            *"PE32+ executable (EFI application)"*x86-64*) ;;
            *) echo "::error::${efi} is not an x86-64 EFI application: ${described}"; exit 1 ;;
          esac
          sha256sum "${efi}"

      - name: Upload qcow-imager.efi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qcow-imager-efi-x86_64
          path: os-image/efi/output/x86_64/qcow-imager.efi
          if-no-files-found: error
          retention-days: 7
