#
# Required merge gate for documentation changes. Runs without secrets; no
# publishing. Advisory publishing and the API reference render are in api-docs.yml.

name: Fern Docs CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'cli/docs/**'
      - 'controller/docs/**'
      - 'tools/check-docs-mdx'
      - '.github/workflows/fern-docs-ci.yml'
  ## --- OPTION: NVIDIA copy-PR-bot trigger ---
  ## Replace the pull_request block above with:
  # push:
  #   branches:
  #     - "pull-request/[0-9]+"
  #   paths:
  #     - 'docs/**'
  #     - 'fern/**'
  #     - 'cli/docs/**'
  #     - 'controller/docs/**'
  #     - 'tools/check-docs-mdx'
  #     - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check MDX safety
        run: |
          paths=()
          for d in docs fern cli/docs controller/docs; do
            [ -d "$d" ] && paths+=("$d")
          done
          python3 tools/check-docs-mdx \
            --exclude 'docs/qualification/*' \
            --exclude '*/AGENTS.md' \
            "${paths[@]}"

      - name: Check the site definition
        working-directory: fern
        run: npx -y fern-api@latest check

      - name: Check MDX validity
        working-directory: fern
        run: npx -y fern-api@latest docs md check
