#
# Lints and renders the Helm chart.
#
# Nothing checked the chart before this. It is packaged and pushed by the
# internal pipeline, so a broken template reached a registry before anyone read
# an error.
#
# Two steps, because they catch different things. `helm lint` reads Chart.yaml
# and the chart structure. `helm template` renders every manifest, which is what
# catches a bad range, a missing value, or an indentation error inside a
# template -- lint alone passes all of those.
#
# GitHub-hosted, not the self-hosted pool: helm needs no NVIDIA runner, and
# self-hosted runners do not receive fork or Dependabot pull_request events.

name: Chart

# workflow_call is what merge-gate.yml uses to call this as a reusable workflow.
# Its own `pull_request:` trigger is gone: pull requests reach it through the
# gate, so it runs once per pull request rather than twice.
#
# A called workflow does not apply its own `paths:` filter, so on a pull request
# this runs whatever changed. That is deliberate -- see the note in
# merge-gate.yml. The filter below still applies to `push`.
on:
  push:
    branches: [main]
    paths:
      - 'controller/deploy/charts/**'
      - 'controller/hack/chart-*-assertions.*'
      - 'make/checks.mk'
      - 'make/versions.mk'
      - 'Makefile'
      - '.github/actions/setup-kubeconform/**'
      - '.github/workflows/chart.yml'
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so every workflow merge-gate.yml calls would
  # compute the same group and cancel each other -- 8 of 9 calls died that way,
  # reported to the gate as failures with no jobs and no error message.
  group: Chart-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CHART: controller/deploy/charts/controller

jobs:
  chart:
    name: lint and render
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version pins come from make/versions.mk, so `make show-versions` and CI
      # cannot disagree.
      - name: Read pinned tool versions
        id: versions
        run: |
          echo "helm_version=$(make --no-print-directory print-HELM_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      # Install kubeconform before running the fail-closed chart target.
      - name: Set up kubeconform
        uses: ./.github/actions/setup-kubeconform

      # One entry point covers linting, rendered-manifest validation, apiAuth,
      # tenant RBAC, and package-version assertions locally and in CI.
      - name: Check the chart
        run: make chart-check
