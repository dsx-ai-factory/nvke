#
# Lints and renders the Helm chart.
#
# Nothing checked the chart before this. It is packaged and pushed by the
# internal pipeline, so a broken template reached a registry before anyone read
# an error.
#
# Two steps, because they catch different things. `helm lint` reads Chart.yaml
# and the chart structure. `helm template` renders every manifest, which is what
# catches a bad range, a missing value, or an indentation error inside a
# template -- lint alone passes all of those.
#
# GitHub-hosted, not the self-hosted pool: helm needs no NVIDIA runner, and
# self-hosted runners do not receive fork or Dependabot pull_request events.

name: Chart

# workflow_call is what merge-gate.yml uses to call this as a reusable workflow.
# Its own `pull_request:` trigger is gone: pull requests reach it through the
# gate, so it runs once per pull request rather than twice.
#
# A called workflow does not apply its own `paths:` filter, so on a pull request
# this runs whatever changed. That is deliberate -- see the note in
# merge-gate.yml. The filter below still applies to `push`.
on:
  push:
    branches: [main]
    paths:
      - 'controller/deploy/charts/**'
      - '.github/workflows/chart.yml'
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so every workflow merge-gate.yml calls would
  # compute the same group and cancel each other -- 8 of 9 calls died that way,
  # reported to the gate as failures with no jobs and no error message.
  group: Chart-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CHART: controller/deploy/charts/controller

jobs:
  chart:
    name: lint and render
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Lint
        run: helm lint "${CHART}"

      - name: Render
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/rendered.yaml"
          helm template cwe "${CHART}" > "${out}"
          # A chart that renders to nothing passes `helm template` silently.
          count=$(grep -c '^kind:' "${out}" || true)
          if [ "${count}" -eq 0 ]; then
            echo "::error::the chart rendered no resources"
            exit 1
          fi
          echo "rendered ${count} resources"
          echo "### Chart renders ${count} resources" >> "${GITHUB_STEP_SUMMARY}"

      # Helm never parses its own output, so `helm lint` and `helm template`
      # both pass on a manifest Kubernetes would reject. A duplicate
      # app.kubernetes.io/name in the ServiceMonitor selector survived both for
      # exactly that reason. kubeconform parses what was rendered.
      - name: Validate the rendered manifests
        shell: bash
        run: |
          set -euo pipefail
          # Recomputed, not inherited: a shell variable set in the Render step
          # does not survive into this one. Same expression as there.
          out="${RUNNER_TEMP}/rendered.yaml"
          ver=v0.7.0
          curl -sSfL --retry 3 \
            "https://github.com/yannh/kubeconform/releases/download/${ver}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" kubeconform
          # -strict rejects duplicate keys and unknown fields. ServiceMonitor is
          # a CRD, so its schema comes from the datreeio catalogue; -ignore-missing-schemas
          # keeps an unpublished CRD from failing the build while still
          # validating everything with a schema.
          "${RUNNER_TEMP}/kubeconform" \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${out}"

      # Nothing asserted the tenant RBAC before: the tenantaccess unit tests read
      # a fixture, not the chart, so a missing rule only showed up in the CAPD
      # E2E suite, which skips this scenario on a pull request.
      #
      # Add a case below whenever an activity calls a new tenant API.
      - name: Assert the tenant ClusterRole grants what the activities need
        shell: bash
        run: |
          set -euo pipefail
          # nke-rbac renders only with a trust domain, and that needs the OIDC
          # and tenant-access flags. All three are off by default.
          helm template cwe "${CHART}" \
            --set spiffe.trustDomain=example.test \
            --set nkeOIDCAuth.enabled=true \
            --set tenantAccess.enabled=true \
            > "${RUNNER_TEMP}/rendered-rbac.yaml"
          python3 - "${RUNNER_TEMP}/rendered-rbac.yaml" <<'PY'
          import sys, yaml

          # The RBAC sits inside a ConfigMap value, so it is parsed twice.
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          cms = [d for d in docs if d.get("kind") == "ConfigMap" and d["metadata"]["name"] == "nke-rbac"]
          if not cms:
              sys.exit("::error::no nke-rbac ConfigMap in the rendered chart")
          inner = list(yaml.safe_load_all(cms[0]["data"]["manifest.yaml"]))
          roles = {
              (d.get("kind"), d["metadata"]["name"]): d
              for d in inner if d and d.get("kind") in ("ClusterRole", "Role")
          }

          cr = roles.get(("ClusterRole", "nke:cwe"))
          if cr is None:
              sys.exit("::error::no nke:cwe ClusterRole in the nke-rbac manifest")

          def granted(rule_set, resource, verb):
              for r in rule_set:
                  if resource in (r.get("resources") or []) and verb in (r.get("verbs") or []):
                      return True
              return False

          # resource, verb, and the activity that breaks without it.
          required = [
              ("nodes",         "patch",  "node updates"),
              ("nodes",         "delete", "node teardown"),
              ("nodes/status",  "patch",  "ApplyNodeCondition"),
              ("pods/eviction", "create", "node drain"),
          ]
          missing = [
              f"{res} ({verb}) — needed by {why}"
              for res, verb, why in required
              if not granted(cr.get("rules") or [], res, verb)
          ]
          if missing:
              for m in missing:
                  print(f"::error::nke:cwe ClusterRole is missing {m}")
              sys.exit(1)
          print(f"nke:cwe ClusterRole grants all {len(required)} required resource/verb pairs")
          PY

      # Chart.yaml carries version and appVersion 0.0.0 and says in a comment
      # that CI overrides both at package time. Nothing verified that, so a
      # packaging path that dropped the flags would ship 0.0.0 to whoever
      # installs it. This runs the documented recipe and fails if the
      # placeholder survives.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # A build version, not a release one. This job proves the flags work;
          # a release would pass the tag without its leading v, as Chart.yaml
          # describes.
          version="0.0.0-${GITHUB_SHA::12}"

          helm package "${CHART}" \
            --version "${version}" \
            --app-version "${version}" \
            --destination "${RUNNER_TEMP}/chart-dist"

          tgz=$(ls "${RUNNER_TEMP}"/chart-dist/*.tgz)
          packaged=$(tar -xOf "${tgz}" --wildcards '*/Chart.yaml' | grep '^version:' | awk '{print $2}' | tr -d '"')

          if [ "${packaged}" = "0.0.0" ]; then
            echo "::error::the packaged chart is version 0.0.0; --version did not apply"
            exit 1
          fi
          echo "packaged ${tgz##*/} at version ${packaged}"
          echo "### Chart packages as \`${packaged}\`" >> "${GITHUB_STEP_SUMMARY}"
