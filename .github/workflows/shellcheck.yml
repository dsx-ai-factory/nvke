#
# Lints the shell scripts, and tests release/hack/next-tag.sh, the one that
# versions releases.
#
# actionlint already runs shellcheck, but only over `run:` blocks inside
# workflow YAML. The 100 standalone .sh files in this tree had nothing checking
# them, and three real bugs were sitting in them -- including a dependency
# check in a runbook script that is compiled into the controller binary and
# executed on nodes, and that never detected a missing tool. All three parsed
# fine under `bash -n`; only shellcheck saw them.
#
# Runs on ubuntu-latest with the pinned shellcheck release.
#
# Deliberately NOT path-filtered, for the reason recorded in actionlint.yml: a
# filtered check does not report on a pull request that misses the filter, and
# a required check that never reports leaves that pull request waiting forever.
# See .github/workflows/README.md.

name: Shellcheck

# All pull requests, including forks and Dependabot, reach this through
# merge-gate.yml. The standalone push trigger is post-merge coverage on main;
# naming mirror or Dependabot branches here too would run it a second time.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so every workflow merge-gate.yml calls would
  # compute the same group and cancel each other -- 8 of 9 calls died that way,
  # reported to the gate as failures with no jobs and no error message.
  group: Shellcheck-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    if: github.repository_id == '1323115536'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-SHELLCHECK_VERSION)"
          sha256="$(make --no-print-directory print-SHELLCHECK_SHA256)"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          # No retry at all until now: a 504 from the release CDN failed the job
          # on the first response. Same form as setup-kind and setup-crane.
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 \
            -o "${tmp}/${archive}" "${url}"
          echo "${sha256}  ${tmp}/${archive}" | sha256sum --check
          tar -xJf "${tmp}/${archive}" -C "${tmp}"
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${tmp}/shellcheck-v${version}/shellcheck" "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # -S error, not -S warning. The tree is clean at error severity as of
      # this commit, so the gate starts green and any new error-level bug fails
      # the build. It is NOT clean at warning severity: 31 findings remain,
      # mostly SC2155 (declare and assign separately), SC2010 (ls | grep) and
      # SC2128 (array expanded without an index). Those are worth fixing, but
      # folding 29 edits into the change that introduces the check would bury
      # the three real bugs it was written for. The step below prints the live
      # count, so this number does not have to be trusted as it drifts.
      #
      # Raise this to -S warning once that backlog is cleared. The runbook
      # scripts under controller/internal/runbook/scripts/ are the ones to
      # clear first: they ship inside the controller binary and run on nodes.
      # Find scripts by extension and by shebang. `*.sh` alone missed 11 tracked
      # scripts, one of which a Go test runs
      # (controller/hack/capd-kindest-node/scripts/cloud-init-status-shim).
      #
      # Built once and read by both steps below, which previously kept identical
      # `find` lines by hand.
      - name: Lint shell scripts
        run: make lint-shell

      # release/hack/next-tag.sh decides the version every nightly beta and
      # release candidate is tagged with, and a wrong one is pushed rather than
      # reported. Tested here rather than in a gate member of its own: it is a
      # shell script, and this job already gates every pull request.
      - name: Test release/hack/next-tag.sh
        run: make next-tag-test

      # Reported, not enforced, so the size of the backlog is visible without
      # gating on it. Remove when the gate above moves to -S warning.
      - name: Report the warning-level backlog
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          n=$(./hack/shell-scripts.sh | tr -dc '\\0' | wc -c | tr -d ' ')
          # `|| true` is required. shellcheck exits non-zero on any finding, and
          # the runner invokes this step with `bash -e -o pipefail`, so without
          # it a non-empty backlog fails the step that counts the backlog.
          count=$( { ./hack/shell-scripts.sh | xargs -0 shellcheck --severity=warning --format=gcc 2>/dev/null || true; } | wc -l | tr -d ' ')
          {
            echo "## shellcheck"
            echo
            echo "Gate: \`--severity=error\` over ${n} scripts."
            echo
            echo "Not yet enforced: **${count}** finding(s) at \`--severity=warning\`."
          } >> "${GITHUB_STEP_SUMMARY}"
