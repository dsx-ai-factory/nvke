#
# e2e coverage for "nkectl bootstrap site" specifically, separate from
# Controller Unit Tests' `cli` matrix entry: `make -C cli test` is `go test
# ./...`, this is `make -C cli test-e2e-bootstrap`, a self-contained
# integration run driven by cli/e2e/bootstrap/run.sh. cli/e2e/ may grow other
# e2e/<command>/ suites the same way as nkectl gains more commands worth
# covering this way -- each gets its own workflow rather than growing this
# one into a multi-command suite.
#
# Unlike controller/test/e2e (excluded from the pull-request lane in
# controller-test.yml because it needs a live cluster in KUBECONFIG), this
# suite stands up everything it needs itself: fake node containers today
# (three kindest/node + nke-agent, `make -C cli nodes-up`), growing to an
# ephemeral Kind cluster as `nkectl bootstrap site` gains real stages.
# ubuntu-latest ships Docker, so no self-hosted runner is needed for that
# either.
#
# nke-agent itself comes from this repo's own GHCR artifact feed (see
# agent-artifact.yml), not a separate registry -- `packages: read` plus the
# job's own GITHUB_TOKEN is enough to pull it, since this repository is
# GitHub-internal and an anonymous pull would 401.
#
# Required from the start (wired into merge-gate.yml's `gate`), deliberately:
# cli/e2e/bootstrap/run.sh's stages are added one at a time alongside the
# bootstrap-site code they exercise, so the job is expected to stay green
# throughout rather than going red until some later change makes it pass.
name: nkectl bootstrap e2e

# See go-build.yml for why the push path list is duplicated by hand instead of
# shared with workflow_call, and why workflow_call carries no filter.
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/nkectl-bootstrap-e2e.yml'
  workflow_call:
  workflow_dispatch: {}

permissions: {}

concurrency:
  # See go-build.yml for why the sha is only in the group on main, and why the
  # group name is a literal rather than ${{ github.workflow }}.
  group: nkectl bootstrap e2e-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    # Generous margin: building the node image's CNI bundle fetch (an S3
    # download baked into the image so nodes need no outbound access at test
    # time) took ~23 minutes end to end in one observed run.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Same version agent-artifact.yml uses to push nke-agent; pinned so a
      # newer default does not silently change how the artifact is read.
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Run nkectl bootstrap e2e
        working-directory: cli
        run: make test-e2e-bootstrap
