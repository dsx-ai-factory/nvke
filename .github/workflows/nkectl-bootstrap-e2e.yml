#
# e2e coverage for "nkectl bootstrap site" specifically, separate from
# Controller Unit Tests' `cli` matrix entry: `make -C cli test` is `go test
# ./...`, this is `make -C cli test-e2e-bootstrap`, a self-contained
# integration run driven by cli/e2e/bootstrap/run.sh. cli/e2e/ may grow other
# e2e/<command>/ suites the same way as nkectl gains more commands worth
# covering this way -- each gets its own workflow rather than growing this
# one into a multi-command suite.
#
# Unlike controller/test/e2e (excluded from the pull-request lane in
# controller-test.yml because it needs a live cluster in KUBECONFIG), this
# suite stands up everything it needs itself: fake node containers
# (cli/e2e/bootstrap/substrate, `make -C cli nodes-up`) and, since the
# cli/internal/bootstrapengine port (NKX-14787), a real ephemeral Kind
# cluster that `nkectl bootstrap site` creates and tears down itself.
# ubuntu-latest ships Docker, so no self-hosted runner is needed for that;
# `kind` itself is not preinstalled and is set up below the same way
# capd-e2e.yml does it (helm/kind-action, install_only).
#
# Runs on the Docker provider (see run.sh) rather than nerdctl: that is the
# path actually verified end to end on this runner image. nerdctl/containerd
# rootless+cgroup-v2 provisioning on ubuntu-latest is tracked as a follow-up
# on NKX-14787, not yet validated here — see run.sh's comment for the exact
# rollback rationale.
#
# The fixture's node image is a thin derivation of
# controller/hack/capd-kindest-node's CAPD node image (see
# cli/e2e/bootstrap/substrate/node/Dockerfile), built here with nke-agent
# compiled from this checkout's own agent/ module -- no external registry or
# credentials needed beyond the public bundle host that image already uses.
#
# Required from the start (wired into merge-gate.yml's `gate`), deliberately:
# cli/e2e/bootstrap/run.sh's stages are added one at a time alongside the
# bootstrap-site code they exercise, so the job is expected to stay green
# throughout rather than going red until some later change makes it pass.
#
# Since cli/internal/cwedeploy (NKX-13889), the job also deploys Postgres,
# Temporal and CWE onto the ephemeral cluster and asserts CWE reports healthy
# on /readyz -- see run.sh's Stage 2. The CWE image comes from
# image-nvcr.yml, which publishes nvcr.io/<NKE_NGC_ORG>/controller:edge on
# every push to main; there is no other canonical build of it yet (the
# GitLab spike this was ported from, cloud-workflow-engine!995, has not
# merged, so there is nothing there to pull either). This job logs in to
# nvcr.io using the same `nvcr` environment and NGC_REGISTRY_TOKEN_NKE secret
# image-nvcr.yml uses, and pulls the image on the runner's Docker daemon --
# nkectl itself never authenticates to a registry; it only `kind
# load`s an image already present locally (see cmd/nkectl/bootstrap.go's
# ensureImageAvailable). `edge` is a moving tag, not a version pin; this is a
# known rough edge until controller/v* release tags exist and this can pin a
# real version instead (see NKX-13889).
name: nkectl bootstrap e2e

# See go-build.yml for why the push path list is duplicated by hand instead of
# shared with workflow_call, and why workflow_call carries no filter.
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'agent/**'
      - 'controller/hack/capd-kindest-node/**'
      - '.github/workflows/nkectl-bootstrap-e2e.yml'
  workflow_call:
  workflow_dispatch: {}

permissions: {}

concurrency:
  # See go-build.yml for why the sha is only in the group on main, and why the
  # group name is a literal rather than ${{ github.workflow }}.
  group: nkectl bootstrap e2e-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    # Grants secrets.NGC_REGISTRY_TOKEN_NKE and vars.NKE_NGC_ORG, same as
    # image-nvcr.yml -- this job only reads from nvcr.io, it never publishes.
    environment: nvcr
    # Generous margin: building the CAPD base node image (TPM tooling, SPIRE
    # bundle fetch, local agent compile) plus the thin derivation on top has
    # not yet been timed end to end in this CI lane.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Same pinned version as capd-e2e.yml: cli/internal/cwedeploy shells
      # out to `helm` directly, so this action installs the binary rather
      # than the Helm chart-testing tooling `helm/kind-action` below would
      # otherwise pull in.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.2

      # Same pinned version and install pattern as capd-e2e.yml, for the same
      # reason: install_only, since this suite drives kind itself rather than
      # delegating cluster creation to the action.
      - name: Set up Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.36.0
          install_only: true

      # `$oauthtoken` is NGC's literal username, not a variable reference.
      # Same login image-nvcr.yml performs to publish; this job only pulls.
      - name: Log in to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NKE }}

      # Pulled here, once, on the runner's own Docker daemon -- nkectl itself
      # never talks to a registry. cmd/nkectl/bootstrap.go's
      # ensureImageAvailable finds this image already cached and `kind
      # load`s it straight into the ephemeral cluster.
      - name: Resolve and pull the CWE image
        id: cwe-image
        shell: bash
        env:
          NKE_NGC_ORG: ${{ vars.NKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NKE_NGC_ORG}" ]]; then
            echo "::error::NKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi
          image="nvcr.io/${NKE_NGC_ORG}/controller:edge"
          echo "Pulling ${image} (published by image-nvcr.yml on every push to main)"
          docker pull "${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Run nkectl bootstrap e2e
        working-directory: cli
        env:
          NKECTL_CWE_IMAGE: ${{ steps.cwe-image.outputs.image }}
        run: make test-e2e-bootstrap
