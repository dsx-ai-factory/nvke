# CAPD integration test using controller and agent source from this commit.
# Pull-request mirror branches run a bounded core lifecycle. Main, scheduled,
# and manual runs retain the comprehensive two-mode suite.
#
# The body lives in backend-e2e.yml, shared with nico-e2e.yml. This file is the
# CAPD trigger and configuration, nothing more.
#
# Self-hosted runners do not receive pull_request events. copy-pr-bot mirrors a
# vetted pull request head to pull-request/<number>; the push of that same commit
# is the security boundary and trigger used by the other self-hosted checks.
# Run this gate only when controller, agent, or root Makefile changes can affect
# the CAPD lifecycle exercised here.

name: CAPD E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - "controller/**"
      - "agent/**"
      - Makefile
      # Without these, a change to the suite's own workflow or to the shared
      # body does not run it.
      - .github/workflows/capd-e2e.yml
      - .github/workflows/backend-e2e.yml
      - .github/workflows/e2e-pr-path-filter.yml
      # The CWE-facing CLI. hack/ci/nkectl-smoke.sh drives nkectl against this
      # lane's CWE, so a change here has something to break. Keep in step with
      # cwe_facing in e2e-pr-path-filter.yml, which suppresses the rest of cli/.
      - "cli/cmd/**"
      - "cli/internal/clients/**"
      - "cli/internal/clusterstate/**"
      - "cli/internal/cwe/**"
      - "cli/internal/providers/**"
      - "cli/internal/sitecluster/**"
      - "cli/internal/util/**"
  # Also twice a day, so a break the paths above filtered out, or one a flake
  # hid, still surfaces within twelve hours. A schedule ignores those paths, so
  # these runs always exercise the whole suite.
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      use-nke-stack:
        description: Deploy from the nke-stack umbrella chart instead of Tilt.
        required: false
        type: boolean
        default: false
      stack-chart:
        description: >-
          OCI reference of an nke-stack umbrella chart, e.g.
          oci://ghcr.io/<org>/nke/charts/nke-stack. Leave empty to deploy with
          Tilt, which is what scheduled and push-triggered runs do.
        required: false
        type: string
        default: ''
      stack-version:
        description: Chart version. Required when stack-chart is set.
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: CAPD E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/e2e-pr-path-filter.yml
    permissions:
      pull-requests: read

  # Pull requests use the dedicated one-control-plane/one-worker core row and
  # the ordinary node-pool path. The measured setup plus create/readiness/delete
  # path leaves enough room for a sub-15-minute target without weakening the
  # comprehensive main and scheduled coverage below.
  #
  # Non-PR runs use both control-plane provisioning modes on one runner and
  # cluster, in sequence. The
  # flag (PROVISION_CONTROL_PLANE_WITH_CONTROL_PLANE_CONTROLLER) is deployment-wide
  # and each mode rejects the other's config, so a single CWE can't serve both at
  # once. The script runs cp-controller flag-on first, then flips the flag off with
  # a light redeploy for the node-pool leg.
  #
  # cp-controller runs first so the newer path fails fast: if it breaks, the script
  # aborts before spending ~an hour on the node-pool leg and never reuses a dirty
  # cluster. The node-pool leg runs only after cp-controller passes and the cluster
  # is confirmed empty. `health` rides along with each leg (flag-on and flag-off).
  capd-e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
          - arch: arm64
            runner: linux-arm64-cpu16
    uses: ./.github/workflows/backend-e2e.yml
    permissions:
      contents: read
    secrets:
      NKE_INTERNAL_RO_TOKEN: ${{ secrets.NKE_INTERNAL_RO_TOKEN }}
    with:
      backend: capd
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      # Mirror branches select only the bounded core entry and health probes.
      # Ignored under single-runner-control-plane-modes on comprehensive runs:
      # the CI script drives
      # each leg's label filter itself (cp-controller+health first, then
      # node-pool+health+authn). This value mirrors the node-pool leg's filter to
      # satisfy the required input and document what that leg runs. `health` and
      # the authn specs ride along there -- both need a deployed, enforcing NKE.
      # authn-spire is excluded (needs SPIRE pod attestation not wired in CAPD).
      label-filter: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'pull-request/') && 'core-docker || health' || '((capd || health) && !cp-controller) || (authn && !authn-spire) || authn-permissive' }}
      providers: '["capi_core", "bgp-containers", "capd", "capd-reboot-controller"]'
      # Keep diagnostic headroom above the 15-minute pull-request target. Full
      # runs still need room for two modes and every extended CAPD scenario.
      timeout-minutes: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'pull-request/') && 20 || 150 }}
      # Turn "authentication is not deployed" from a per-spec skip into a failure:
      # the authn specs run on the node-pool leg, and without this a broken auth
      # deployment would leave them silently skipped and the job green.
      require-authn: ${{ github.event_name != 'push' || !startsWith(github.ref_name, 'pull-request/') }}
      nkectl-smoke: true
      needs-capnico-source: true
      single-runner-control-plane-modes: ${{ github.event_name != 'push' || !startsWith(github.ref_name, 'pull-request/') }}
      # Only ever set by a manual dispatch: `inputs` is empty on push and
      # schedule, so those runs keep the Tilt deploy.
      use-nke-stack: ${{ inputs.use-nke-stack || false }}
      stack-chart: ${{ inputs.stack-chart || '' }}
      stack-version: ${{ inputs.stack-version || '' }}
