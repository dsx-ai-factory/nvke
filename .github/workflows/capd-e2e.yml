# CAPD integration test using controller and agent source from this commit.
# Pull-request mirror branches run a bounded core lifecycle. Main, scheduled,
# and manual runs retain the comprehensive two-mode suite.
#
# The body lives in backend-e2e.yml, shared with nico-e2e.yml. This file is the
# CAPD trigger and configuration, nothing more.
#
# Self-hosted runners do not receive pull_request events. copy-pr-bot mirrors a
# vetted pull request head to pull-request/<number>; the push of that same commit
# is the security boundary and trigger used by the other self-hosted checks.
# Run this gate only when controller, agent, or root Makefile changes can affect
# the CAPD lifecycle exercised here.

name: CAPD E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - "controller/**"
      - "auth/**"
      - "agent/**"
      - Makefile
      # Without these, a change to the suite's own workflow or to the shared
      # body does not run it.
      # The deploy path this lane installs. Without it a change to the tree
      # that defines the management plane triggers nothing, and the lane that
      # would have caught the break runs on some later, unrelated push.
      - "controller/deploy/**"
      - "deploy/**"
      - .github/workflows/capd-e2e.yml
      - .github/workflows/backend-e2e.yml
      - .github/workflows/e2e-pr-path-filter.yml
      - hack/e2e-path-filter.py
      # Installs the pinned kind and kubectl the suite runs on.
      - .github/actions/setup-kind/**
      # The controller-facing CLI. hack/ci/nvkectl-smoke.sh drives nvkectl against this
      # lane's controller, so a change here has something to break. The rest of
      # cli/ cannot break against the controller and does not run this lane.
      #
      # Both halves of the command tree: cmd/ is the shim holding main and the
      # contract test, and internal/nvkectl is the tree itself. The smoke drives
      # config set-site, config view, create cluster and delete nodepool, all of
      # which live in the latter, so cmd/ alone would skip this lane for a change
      # to any of them.
      - "cli/cmd/**"
      - "cli/internal/nvkectl/**"
      - "cli/internal/clients/**"
      - "cli/internal/clusterstate/**"
      - "cli/internal/controller/**"
      - "cli/internal/providers/**"
      - "cli/internal/bootstrap/sitecluster/**"
      - "cli/internal/telemetry/**"
      - "cli/internal/util/**"
  # Also twice a day, so a break the paths above filtered out, or one a flake
  # hid, still surfaces within twelve hours. A schedule ignores those paths, so
  # these runs always exercise the whole suite.
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      use-nke-stack:
        description: >-
          Deploy from the generated capd-e2e deploy path. This is the default on
          push and schedule; set false here to fall back to Tilt.
        required: false
        type: boolean
        default: true
      stack-chart:
        description: >-
          OCI reference of an nke-stack umbrella chart, e.g.
          oci://ghcr.io/<org>/nke/charts/nke-stack. Leave empty to build the
          chart from the working tree, which is what every routine run does.
        required: false
        type: string
        default: ''
      stack-version:
        description: Chart version. Required when stack-chart is set.
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: CAPD E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/e2e-pr-path-filter.yml
    permissions:
      contents: read
      pull-requests: read

  # Pull requests use the dedicated one-control-plane/one-worker core row. The
  # measured setup plus create/readiness/delete path leaves enough room for a
  # sub-15-minute target without weakening the comprehensive main and scheduled
  # coverage below.
  capd-e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
          - arch: arm64
            runner: linux-arm64-cpu16
    uses: ./.github/workflows/backend-e2e.yml
    permissions:
      contents: read
    with:
      backend: capd
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      # Mirror branches select only the bounded core entry and health probes.
      # Full runs select every CAPD entry plus `health` and the authn specs, both
      # of which need a deployed, enforcing NVKE. authn-spire is excluded (needs
      # SPIRE pod attestation not wired in CAPD). Keep the full expression in
      # step with e2e_suite_filter in hack/backend-e2e-lib.sh.
      # CAPD nodes are containers, with no TPM and no GPU, so a spec that needs
      # either is excluded whatever else selects it.
      label-filter: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'pull-request/') && '(core-docker || health) && !tpm-attestation && !gpu' || '((capd || health) || (authn && !authn-spire) || authn-permissive) && !tpm-attestation && !gpu' }}
      providers: '["capi_core", "bgp-containers", "capd", "capd-reboot-controller"]'
      # copy-pr-bot mirrors PRs onto pull-request/<n> for self-hosted runners.
      # Mirrored runs select the smaller core/health suite; 30 minutes leaves
      # room for arm64 diagnostics and action cleanup after that suite finishes.
      # Full runs cover the extended CAPD scenarios, so they retain their
      # 150-minute allowance.
      timeout-minutes: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'pull-request/') && 30 || 150 }}
      # Turn "authentication is not deployed" from a per-spec skip into a failure:
      # the authn specs run in the full runs, and without this a broken auth
      # deployment would leave them silently skipped and the job green.
      require-authn: ${{ github.event_name != 'push' || !startsWith(github.ref_name, 'pull-request/') }}
      nvkectl-smoke: true
      needs-capnico-source: true
      # Default on every trigger; a dispatch can still opt out.
      #
      # Written as "not a dispatch OR the input" rather than `inputs.x || true`:
      # in GitHub expressions `false || true` is true, so the `|| true` form
      # would swallow an explicit false and leave no way back to Tilt.
      use-nke-stack: ${{ github.event_name != 'workflow_dispatch' || inputs.use-nke-stack }}
      stack-chart: ${{ inputs.stack-chart || '' }}
      stack-version: ${{ inputs.stack-version || '' }}
