# Full CAPD integration test using controller and agent source from this commit.
#
# The body lives in backend-e2e.yml, shared with nico-e2e.yml. This file is the
# CAPD trigger and configuration, nothing more.
#
# Self-hosted runners do not receive pull_request events. copy-pr-bot mirrors a
# vetted pull request head to pull-request/<number>; the push of that same commit
# is the security boundary and trigger used by the other self-hosted checks.
# Run this gate only when controller, agent, or root Makefile changes can affect
# the CAPD lifecycle exercised here.

name: CAPD E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - "controller/**"
      - "agent/**"
      - Makefile
      # Without these, a change to the suite's own workflow or to the shared
      # body does not run it.
      - .github/workflows/capd-e2e.yml
      - .github/workflows/backend-e2e.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: CAPD E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  capd-e2e:
    uses: ./.github/workflows/backend-e2e.yml
    permissions:
      contents: read
    with:
      backend: capd
      # One filter for pull requests and main. Excluding post-ready, scale and
      # reboot on a pull request meant a break in those only showed up on main,
      # in a job nothing requires.
      #
      # `health` rides along: those specs need a cluster running CWE, which this
      # lane has already built by the time the suite starts. So do the
      # authentication specs: this is the only job with a deployed NKE, and the
      # chart deploys it enforcing. authn-spire is excluded -- it needs the SPIRE
      # agent to attest a pod the spec creates, which is not demonstrated in the
      # CAPD runner yet.
      #
      # authn-permissive rides along too. It puts the deployment into permissive
      # mode itself and puts it back, so it needs this lane rather than one of
      # its own.
      label-filter: capd || health || (authn && !authn-spire) || authn-permissive
      providers: '["capi_core", "bgp-containers", "capd", "capd-reboot-controller"]'
      timeout-minutes: 90
      # Turns "authentication is not deployed" from a per-spec skip into a
      # failure. -ginkgo.fail-on-empty catches a filter that matches nothing; it
      # cannot catch specs that matched, ran, and skipped themselves. Without
      # this, breaking the deployment leaves the job green with every authn spec
      # skipped, which in a CI log reads the same as a spec that never existed.
      require-authn: true
