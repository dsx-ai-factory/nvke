# Mirror-branch pushes can contain base-branch updates as well as the pull
# request changes. GitHub's push path filter then starts backend E2E workflows
# for a pull request that changes only paths that do not affect backend E2E.
# Use the pull request file list as the authoritative source before allocating
# a self-hosted E2E runner.

name: E2E pull request path filter

on:
  workflow_call:
    inputs:
      relevant_paths:
        description: >-
          Optional extended regex. When set, a mirror-branch run needs at
          least one changed file matching it; the default exclusion list is
          not consulted. For lanes whose inputs are a short list of paths.
        required: false
        default: ""
        type: string
    outputs:
      run_e2e:
        description: Whether the caller must run its E2E job.
        value: ${{ jobs.filter.outputs.run_e2e }}

permissions: {}

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run_e2e: ${{ steps.changed-files.outputs.run_e2e }}
    steps:
      - name: Check pull request paths
        id: changed-files
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RELEVANT_PATHS: ${{ inputs.relevant_paths }}
        shell: bash
        run: |
          run_e2e=true

          if [[ "$REF_NAME" =~ ^pull-request/([0-9]+)$ ]]; then
            pr_number="${BASH_REMATCH[1]}"
            changed_files="$(
              gh api --paginate \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
                --jq '.[].filename'
            )"

            if [[ -n "$RELEVANT_PATHS" ]]; then
              if [[ -n "$changed_files" ]] && grep -qE "$RELEVANT_PATHS" <<< "$changed_files"; then
                echo "Pull request ${pr_number} touches the lane's inputs: running E2E."
              else
                run_e2e=false
                echo "Skipping E2E for pull request ${pr_number}: no changed file matches ${RELEVANT_PATHS}."
              fi
              echo "run_e2e=${run_e2e}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The CLI hack/ci/nvkectl-smoke.sh exercises against a live controller. Keep
            # in step with what the smoke asserts on; capd-e2e.yml mirrors it as
            # push globs. The rest of cli/ cannot break against the controller, and skips.
            cwe_facing='^cli/(cmd/|internal/(clients|clusterstate|controller|providers|bootstrap/sitecluster|telemetry|util)/)'
            e2e_unrelated='(^|/)docs/|^cli/|^cluster-api-provider-provisioned/'

            if [[ -n "$changed_files" ]] && ! grep -qEv "$e2e_unrelated" <<< "$changed_files"; then
              if grep -qE "$cwe_facing" <<< "$changed_files"; then
                echo "Pull request ${pr_number} touches the controller-facing CLI: running backend E2E."
              else
                run_e2e=false
                echo "Skipping backend E2E for pull request ${pr_number}: all changed files are under excluded paths."
              fi
            fi
          fi

          echo "run_e2e=${run_e2e}" >> "$GITHUB_OUTPUT"
