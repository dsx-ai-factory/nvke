name: Nightly beta tag

# Tags a commit on main as the next vX.Y.Z-beta.N every night. The tag push is
# what starts the beta builds (agent, agent debs, controller image and chart,
# provisioned provider, os-image, nvkectl) that publish to NVCR and S3, and for
# os-image GHCR; this workflow only creates the tag.
#
# The version comes from hack/next-tag.sh, which only prints it. This workflow
# chooses the commit, creates the tag and pushes it.
#
# The push must NOT use GITHUB_TOKEN. Events caused by GITHUB_TOKEN never start
# other workflows, so the beta builds would silently not run. It uses an
# installation token for the release bot GitHub App (RELEASE_BOT_CLIENT and its
# private key, RELEASE_BOT_SECRET), minted per run with contents: write on this
# repository only. The App must be a bypass actor on the "Protect release
# tags" ruleset, which restricts creating v* tags.
#
# A beta that passes its own qualification becomes a release candidate. When a
# Qualify e2e run started by a beta tag push succeeds at scope golden-path and
# stage full, the rc job tags the same commit as the next vX.Y.Z-rc.N, which
# release.yml publishes as a pre-release. Until the NVKE_AUTO_RC repository
# variable is true, it only says what it would tag.
on:
  schedule:
    # Nightly 02:00 UTC. Scheduled runs always use the default branch.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the tag that would be created, without creating it.
        type: boolean
        default: false
      commit:
        description: >-
          A commit SHA on main to tag, whatever its publishers reported. Empty
          selects the newest commit whose publishers all passed.
        type: string
        default: ''
  workflow_run:
    workflows: [Qualify e2e]
    types: [completed]

permissions:
  contents: read
  # The selection step reads main's own workflow runs to find a commit the
  # publishers already agreed on, and the rc job reads the qualification run's
  # jobs and artifacts.
  actions: read

# One beta allocation at a time; a queued run waits rather than racing for the
# same version. Every Qualify e2e run that finishes starts this workflow, so each
# of those gets a group of its own: GitHub keeps one pending run per group and
# cancels it when the next arrives, which would let a pull request's
# qualification cancel a queued nightly. Two betas of one version qualifying at
# the same moment race for the same rc.N; the second push is refused and its job
# fails.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('nightly-rc-{0}', github.event.workflow_run.id) || 'nightly-beta-tag' }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag main
    if: github.repository_id == '1323115536' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT }}
          private-key: ${{ secrets.RELEASE_BOT_SECRET }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The script reads every tag and the history back to the latest GA tag.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          # Credentials stay configured: the next step pushes with them.
          persist-credentials: true

      # Tagging the tip of main unconditionally is wrong twice over. A tip whose
      # own publishers failed yields a beta nothing can qualify, and the rebuild
      # spends an hour rediscovering what main already reported. And on a night
      # when nothing landed, the tip already carries last night's beta, so a
      # second tag republishes byte-identical artifacts under a new version and
      # hands qualification a second name for a build it already passed.
      - name: Select the commit to tag
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          # The five that run on every push to main. `OS Image Artifact` is
          # deliberately absent: it is path-filtered, so most commits never
          # report it and requiring it would reject every one of them.
          required=(
            "Image NVCR"
            "Image Provisioned NVCR"
            "Chart Publish NVCR"
            "Agent Artifact"
            "Agent Artifact NVCR"
          )

          selected=""

          # A commit given by hand is tagged whatever its publishers reported,
          # but only from main, because a beta tag enters forge-nightly with no
          # reviewer, and only once it carries the publishers' beta triggers.
          if [ -n "${COMMIT}" ]; then
            if ! [[ "${COMMIT}" =~ ^[0-9a-f]{7,40}$ ]] \
              || ! selected="$(git rev-parse --verify --quiet "${COMMIT}^{commit}")"; then
              echo "::error::The commit input is not a commit SHA in this repository."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${selected}" main; then
              echo "::error::${selected:0:9} is not on main."
              exit 1
            fi
            if ! git cat-file -e "${selected}:.github/workflows/nightly-beta-tag.yml" 2>/dev/null; then
              echo "::error::${selected:0:9} predates the beta publishers, so its tag would start nothing."
              exit 1
            fi
            echo "${selected:0:9}: given by hand; its publishers are not checked."
          fi

          while [ -z "${selected}" ] && read -r sha; do
            # The publishers' beta triggers landed with this file, so a commit
            # without it would take a tag that starts nothing -- and every
            # commit older than it predates them too.
            if ! git cat-file -e "${sha}:.github/workflows/nightly-beta-tag.yml" 2>/dev/null; then
              echo "${sha:0:9}: predates the beta publishers"
              break
            fi

            # branch=main, because a tag push is a push too. These five also run
            # on the component tags, and a tag is cut after the merge, so the
            # newest run at a tagged commit is the tag's -- which would let a
            # green controller/v* run stand in for a failed main one.
            runs="$(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${sha}&branch=main&event=push&per_page=100")"
            ok=1
            for name in "${required[@]}"; do
              # Newest run by start time, so a re-run supersedes the attempt it
              # replaced rather than both counting.
              conclusion="$(printf '%s' "${runs}" | jq -r --arg n "${name}" \
                '[.workflow_runs[] | select(.name == $n)]
                 | sort_by(.run_started_at) | last | .conclusion // "missing"')"
              if [ "${conclusion}" != "success" ]; then
                echo "${sha:0:9}: ${name} is ${conclusion}"
                ok=0
                break
              fi
            done
            if [ "${ok}" = 1 ]; then
              selected="${sha}"
              break
            fi
          done < <(git rev-list --max-count=30 main)

          if [ -z "${selected}" ]; then
            echo "No commit in the last 30 on main has a full set of green publishers." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "selected=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Anchored, because git's glob would also accept a hand-made tag like
          # v1.2.3-beta.x, which next-tag.sh never allocates and the publishers
          # never match -- skipping on one would silently cost a night.
          existing="$(git tag --points-at "${selected}" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' | head -n1 || true)"
          if [ -n "${existing}" ]; then
            if [ -n "${COMMIT}" ]; then
              echo "::error::${existing} already names ${selected:0:9}."
              exit 1
            fi
            echo "${existing} already names ${selected:0:9}; nothing new to tag." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "selected=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Selected ${selected:0:9}, $(git rev-list --count "${selected}..main") commit(s) behind main." \
            | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "selected=true" >> "${GITHUB_OUTPUT}"
          echo "sha=${selected}" >> "${GITHUB_OUTPUT}"

      - name: Create and push the beta tag
        if: steps.select.outputs.selected == 'true'
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          SELECTED_SHA: ${{ steps.select.outputs.sha }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          # next-tag.sh takes any committish: passing the selected commit rather
          # than main keeps the feat/fix scan to the history being tagged. It
          # exits 3 when that history has no feat or fix to release.
          status=0
          tag="$(hack/next-tag.sh "${SELECTED_SHA}" beta)" || status=$?
          if [ "${status}" = 3 ]; then
            echo "Nothing releasable at ${SELECTED_SHA:0:9}: no feat or fix since the latest GA tag." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            if [ -n "${COMMIT}" ]; then
              echo "::error::${SELECTED_SHA:0:9} was given by hand, and has nothing to release."
              exit 1
            fi
            exit 0
          fi
          [ "${status}" = 0 ] || exit "${status}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Would tag ${SELECTED_SHA} as ${tag}." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git tag "${tag}" "${SELECTED_SHA}"
          git push origin "refs/tags/${tag}"
          echo "Pushed ${tag} at ${SELECTED_SHA}." | tee -a "${GITHUB_STEP_SUMMARY}"

  # Only the run a beta tag push started counts. A dispatch can override what it
  # qualifies, and a pull request's run qualifies the pull request.
  rc:
    name: Tag a qualified beta as a release candidate
    if: >-
      github.repository_id == '1323115536' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT }}
          private-key: ${{ secrets.RELEASE_BOT_SECRET }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # next-tag.sh reads every tag and the history back to the latest GA tag.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          # Credentials stay configured: the push step uses them.
          persist-credentials: true

      - name: Check the qualification
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # A push run's head_branch is the tag that started it.
          BETA: ${{ github.event.workflow_run.head_branch }}
          BETA_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          skip() {
            echo "$1" | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "selected=false" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if ! [[ "${BETA}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-beta\.[0-9]+$ ]]; then
            skip "Qualify e2e run ${RUN_ID} was not started by a beta tag; nothing to do."
          fi
          version="${BASH_REMATCH[1]}"
          if [ "$(git rev-parse --verify --quiet "refs/tags/${BETA}^{commit}" || true)" != "${BETA_SHA}" ]; then
            echo "::error::${BETA} does not name ${BETA_SHA:0:9}, the commit run ${RUN_ID} qualified."
            exit 1
          fi

          # What the run qualified is read from the run itself, not from the
          # QUALIFY_E2E_* variables, which may have changed since it started.
          gh run download "${RUN_ID}" --repo "${REPOSITORY}" \
            --name "qualify-plan-${RUN_ID}" --dir "${RUNNER_TEMP}/plan"
          qualified="$(jq -r .version "${RUNNER_TEMP}/plan/plan.json")"
          scope="$(jq -r .scope "${RUNNER_TEMP}/plan/plan.json")"
          [ "${qualified}" = "${BETA}" ] || skip "Run ${RUN_ID} qualified ${qualified}, not ${BETA}."
          [ "${scope}" = golden-path ] || skip "Run ${RUN_ID} qualified scope ${scope}; a release candidate needs golden-path."

          # Each stream uploads forge-site-<stage>-<stream>-<run>-<attempt>.
          # Every attempt counts: a re-run of the failed streams keeps the
          # artifacts of the streams that had already passed.
          stages="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].name | select(startswith("forge-site-")) | split("-")[2]' | sort -u | paste -sd ' ' -)"
          [ "${stages}" = full ] || skip "Run ${RUN_ID} ran at stage ${stages:-none}; a release candidate needs full."

          # A tag push cannot ask for a dry run, but a dry run's streams pass
          # without running the suite, so one must never count.
          dry="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | endswith("(dry run)")) | .name' | wc -l | tr -d ' ')"
          [ "${dry}" = 0 ] || skip "Run ${RUN_ID} was a dry run."

          existing="$(git tag --points-at "${BETA_SHA}" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | head -n1 || true)"
          [ -z "${existing}" ] || skip "${existing} already names ${BETA_SHA:0:9}; nothing new to tag."
          if git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
            skip "${version} is already released, so ${BETA} is no candidate for it."
          fi

          # next-tag.sh reads the version from the history the beta was numbered
          # from, so the two agree unless a GA tag has been cut since.
          status=0
          rc="$(hack/next-tag.sh "${BETA_SHA}" rc)" || status=$?
          if [ "${status}" != 0 ] && [ "${status}" != 3 ]; then
            exit "${status}"
          fi
          if [ "${status}" = 3 ] || [ "${rc%-rc.*}" != "${version}" ]; then
            skip "${version} is no longer the next release, so ${BETA} is no candidate for it."
          fi

          echo "${BETA} passed run ${RUN_ID}; ${BETA_SHA:0:9} becomes ${rc}." | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "selected=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${rc}" >> "${GITHUB_OUTPUT}"

      - name: Create and push the release candidate tag
        if: steps.check.outputs.selected == 'true'
        shell: bash
        env:
          AUTO_RC: ${{ vars.NVKE_AUTO_RC }}
          RC: ${{ steps.check.outputs.tag }}
          BETA_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "${AUTO_RC}" != "true" ]; then
            echo "Would tag ${BETA_SHA} as ${RC}; NVKE_AUTO_RC is not true." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git tag "${RC}" "${BETA_SHA}"
          git push origin "refs/tags/${RC}"
          echo "Pushed ${RC} at ${BETA_SHA}." | tee -a "${GITHUB_STEP_SUMMARY}"
