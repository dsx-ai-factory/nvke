#
# Reports when a pull request title is not a Conventional Commit.
#
# Advisory. The `commit_message_pattern` rule on `main` is what blocks a merge:
# this repository squash-merges, so the title becomes the commit subject, and
# that rule rejects a subject which does not match. It fires in the merge box
# though, where only the person merging sees it. This puts the same verdict on
# the pull request, for the author, while the title is cheap to fix.
#
# `types` and `scopes` restate the rule's pattern. Read the live rule with:
#
#   gh api repos/dsx-ai-factory/nke/rules/branches/main \
#     --jq '.[] | select(.type=="commit_message_pattern").parameters.pattern'
#
# Keep the two in step. The action anchors each entry with ^...$, so `scopes`
# constrains the characters without naming every scope.

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  # A literal name, not ${{ github.workflow }}. See merge-gate.yml.
  group: PR Title Check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    if: github.repository == 'dsx-ai-factory/nke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            [a-z0-9/_.-]+
