#
# Keeps `needs-triage` on every open issue that has no `priority/*` label and
# is not waiting on its reporter (`needs-info`), and routes a new issue to its
# area from the form's Component field. When the reporter comments on a
# `needs-info` issue, it removes `needs-info`, which returns the issue to
# triage. A `needs-info` issue with no reply is reminded at 14 days and closed
# at 30; the reporter's next comment reopens it. The process is
# docs/issue-triage.md.
#
# Advisory, like the other needs-* labels, and the same shape as
# test-gate-check.yml: events clear, the hourly sweep reconciles. The forms add
# `needs-triage` themselves, so `opened` matters only for an issue opened
# without a form. Issues only: a pull request carries no triage or priority
# label.

name: Issue Triage Check

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  schedule:
    # Twenty-five to, clear of the :10/:40 test-gate sweep, the :15/:45
    # CI-failure sweep and the e2e queue sweeper's ten-minute marks.
    - cron: '35 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  triage:
    name: Reconcile needs-triage
    # A labeled or unlabeled event matters only for a priority or needs-info
    # label; the form labels and this workflow's own area label would otherwise
    # run it again for nothing. A comment matters only when it is the
    # reporter's, on an issue waiting on them.
    if: >-
      github.repository_id == '1323115536' &&
      (contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) ||
       (github.event_name == 'issues' &&
        (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
         startsWith(github.event.label.name, 'priority/') ||
         github.event.label.name == 'needs-info')) ||
       (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.comment.user.login == github.event.issue.user.login &&
        contains(github.event.issue.labels.*.name, 'needs-info')))
    # On the job, not the workflow: a form-created issue fires `opened` plus one
    # `labeled` per initial label, and a workflow-level group would let a label
    # run cancel the `opened` run that does the routing even though its own
    # job skips. The `opened` run is alone in its group; priority label runs
    # on one issue supersede each other; a reporter's replies queue in their
    # own group; sweeps queue behind one another.
    concurrency:
      group: ${{ github.event.issue.number && format('Issue Triage Check-{0}-{1}', github.event.issue.number, (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && 'label') || github.event.action) || 'Issue Triage Check-sweep' }}
      cancel-in-progress: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 10
    steps:
      - name: Label issues that need triage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Octokit retries 5xx and dropped connections; 4xx still fail at once.
          retries: 3
          script: |
            // The labels exist already. Recreate needs-triage as #e11d21 and
            // the priorities as #ad4c00, #663f0b and #ddac19 if one is ever
            // deleted, since addLabels would otherwise invent a colour.
            const NEEDS_TRIAGE = 'needs-triage';
            const NEEDS_INFO = 'needs-info';
            const PRIORITY_PREFIX = 'priority/';

            // A needs-info issue gets one reminder, then closes. The reporter
            // reopens it by commenting with the details.
            const REMIND_DAYS = 14;
            const CLOSE_DAYS = 30;
            const DAY_MS = 24 * 60 * 60 * 1000;
            const BOT = 'github-actions[bot]';
            // Markers count only on this workflow's own comments, so a
            // commenter cannot suppress a reminder or close by quoting one.
            const REMINDER_MARK = '<!-- needs-info-reminder -->';
            const CLOSE_MARK = '<!-- needs-info-timeout -->';
            // The close date comes from when needs-info was added, so a late
            // first reminder still states the real date.
            const reminderText = (issue, closeOn) => `${REMINDER_MARK}
            @${issue.user.login}, this issue is waiting on the details asked for above. If they don't arrive by ${closeOn}, this issue will be closed. You can still add them after that: commenting reopens it.`;
            const closeText = `${CLOSE_MARK}
            Closing because the details asked for above haven't arrived in ${CLOSE_DAYS} days. Comment here with them and this issue reopens and goes back to triage.`;
            const botPosted = (comments, mark) =>
              comments.some((c) => c.user?.login === BOT && (c.body ?? '').includes(mark));

            // The Component options in .github/ISSUE_TEMPLATE/*.yml, lower
            // case, to the area labels in .github/labeler.yml. An option that
            // is missing here routes nowhere and the triager picks the area.
            const AREA_BY_COMPONENT = new Map([
              ['controller', 'area/controller'],
              ['node agent or updater', 'area/agent'],
              ['nvkectl cli', 'area/cli'],
              ['cluster api provider (provisioned)', 'area/controller'],
              ['helm charts or deployment', 'area/chart'],
              ['nico-sim (development simulator)', 'area/controller'],
              ['os image or image checker', 'area/os-image'],
              ['nvke telemetry pipeline (nktp)', 'area/nktp'],
              ['build, packaging, or release automation', 'area/ci-build'],
              ['documentation', 'area/docs'],
            ]);

            const names = (issue) => issue.labels.map((l) => (typeof l === 'string' ? l : l.name));

            function areaFor(issue) {
              const labels = names(issue);
              if (labels.some((l) => l.startsWith('area/'))) {
                return null;
              }
              const match = (issue.body ?? '').match(/^###\s+Component\s*$\r?\n+([^\r\n]+)/m);
              if (match) {
                return AREA_BY_COMPONENT.get(match[1].trim().toLowerCase()) ?? null;
              }
              // The documentation form has no Component field.
              return labels.includes('documentation') ? 'area/docs' : null;
            }

            async function addLabel(issue, name) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: [name],
              });
            }

            async function removeLabel(issue, name) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issue.number,
                  name,
                });
              } catch (error) {
                // 404 means someone removed it by hand first.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            // When needs-info was last added, from the issue's events.
            async function needsInfoSince(issue) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                ...context.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const added = events
                .filter((e) => e.event === 'labeled' && e.label?.name === NEEDS_INFO)
                .map((e) => e.created_at)
                .sort()
                .pop();
              return added ? new Date(added) : null;
            }

            // Reminds once at REMIND_DAYS and closes at CLOSE_DAYS. Returns
            // 'answered' when it found a reply and removed needs-info,
            // 'closed' when it closed the issue, and null otherwise.
            // needs-info stays on a closed issue so the reporter's comment
            // can reopen it.
            async function followUp(issue) {
              // A sweep can run alongside the run for a reporter's reply, or
              // a maintainer can re-add needs-info. Read the issue, then the
              // date of its current needs-info, then the comments since,
              // before acting on any of them.
              const fresh = (await github.rest.issues.get({ ...context.repo, issue_number: issue.number })).data;
              if (fresh.state !== 'open' || !names(fresh).includes(NEEDS_INFO)) {
                return null;
              }
              const since = await needsInfoSince(issue);
              if (!since) {
                return null;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: issue.number,
                since: since.toISOString(),
                per_page: 100,
              });
              // The reporter has replied, but the run for that reply failed
              // or predates this workflow. Do what it would have done.
              if (comments.some((c) => c.user?.login === issue.user.login)) {
                await removeLabel(issue, NEEDS_INFO);
                return 'answered';
              }
              const days = (Date.now() - since.getTime()) / DAY_MS;
              if (days < REMIND_DAYS) {
                return null;
              }
              if (days >= CLOSE_DAYS) {
                // The marker keeps a retry after a failed close from posting
                // a second comment.
                if (!botPosted(comments, CLOSE_MARK)) {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: closeText });
                }
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });
                return 'closed';
              }
              if (!botPosted(comments, REMINDER_MARK)) {
                const closeOn = new Date(since.getTime() + CLOSE_DAYS * DAY_MS).toISOString().slice(0, 10);
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: reminderText(issue, closeOn) });
                tally.reminded += 1;
              }
              return null;
            }

            // One event names one issue, read live rather than from the
            // payload so a label that moved since the event is seen. A sweep
            // reads every open issue; the list endpoint returns pull requests
            // too, so drop those.
            const event = context.payload.issue;
            const issues = event
              ? [(await github.rest.issues.get({ ...context.repo, issue_number: event.number })).data]
              : (await github.paginate(github.rest.issues.listForRepo, {
                  ...context.repo,
                  state: 'open',
                  per_page: 100,
                })).filter((issue) => !issue.pull_request);

            const failures = [];
            const tally = { added: 0, cleared: 0, routed: 0, answered: 0, reminded: 0, timedOut: 0, reopened: 0, unchanged: 0 };
            for (const issue of issues) {
              if (issue.pull_request) {
                continue;
              }
              let labels = names(issue);

              // The reporter answered an issue this workflow closed for lack
              // of detail: reopen it, and the code below returns it to triage.
              if (issue.state === 'closed' &&
                  context.eventName === 'issue_comment' &&
                  labels.includes(NEEDS_INFO) &&
                  issue.closed_by?.login === BOT &&
                  context.payload.comment.user.login === issue.user.login) {
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'open' });
                issue.state = 'open';
                tally.reopened += 1;
                core.info(`#${issue.number}: reporter answered after time-out, reopened`);
              }
              if (issue.state !== 'open') {
                continue;
              }

              // The reporter answered a request for more detail, so the issue
              // is the triagers' turn again.
              if (context.eventName === 'issue_comment' &&
                  labels.includes(NEEDS_INFO) &&
                  context.payload.comment.user.login === issue.user.login) {
                await removeLabel(issue, NEEDS_INFO);
                labels = labels.filter((l) => l !== NEEDS_INFO);
                tally.answered += 1;
                core.info(`#${issue.number}: reporter answered, ${NEEDS_INFO} removed`);
              }

              if (labels.includes(NEEDS_INFO)) {
                // One issue's API failure must not stop the sweep; the job
                // still fails at the end so the error is seen.
                let outcome = null;
                try {
                  outcome = await followUp(issue);
                } catch (error) {
                  failures.push(`#${issue.number}: ${error.message}`);
                  core.warning(`#${issue.number}: needs-info follow-up failed: ${error.message}`);
                }
                if (outcome === 'closed') {
                  tally.timedOut += 1;
                  core.info(`#${issue.number}: closed after ${CLOSE_DAYS} days in ${NEEDS_INFO}`);
                  continue;
                }
                if (outcome === 'answered') {
                  labels = labels.filter((l) => l !== NEEDS_INFO);
                  tally.answered += 1;
                  core.info(`#${issue.number}: reporter had replied, ${NEEDS_INFO} removed`);
                }
              }

              // Routing happens once, on open. A later sweep must not put back
              // an area a triager took off.
              if (context.payload.action === 'opened') {
                const area = areaFor(issue);
                if (area) {
                  await addLabel(issue, area);
                  tally.routed += 1;
                  core.info(`#${issue.number}: routed to ${area}`);
                }
              }

              // An issue waiting on its reporter is not waiting on triage.
              const wanted = !labels.some((l) => l.startsWith(PRIORITY_PREFIX)) &&
                !labels.includes(NEEDS_INFO);
              const has = labels.includes(NEEDS_TRIAGE);
              if (wanted && !has) {
                await addLabel(issue, NEEDS_TRIAGE);
                tally.added += 1;
              } else if (!wanted && has) {
                await removeLabel(issue, NEEDS_TRIAGE);
                tally.cleared += 1;
              } else {
                tally.unchanged += 1;
              }
            }

            core.info(`${issues.length} checked: ${tally.added} added, ${tally.cleared} cleared, ${tally.routed} routed, ${tally.answered} answered, ${tally.reminded} reminded, ${tally.timedOut} timed out, ${tally.reopened} reopened, ${tally.unchanged} unchanged`);
            if (failures.length > 0) {
              core.setFailed(`${failures.length} needs-info follow-up(s) failed: ${failures.join('; ')}`);
            }
