# Focused CAPD coverage for the DSX identity exchange boundary. Unlike the
# general CAPD workflow, this lane is not affected by nvkectl or other CLI-only
# changes. Workflow-plumbing paths remain included so changes to the lane itself
# cannot bypass its E2E check.

name: CAPD DSX identity exchange E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - "controller/**"
      - "auth/**"
      - "agent/**"
      - .github/workflows/capd-dsx-identity-exchange-e2e.yml
      - .github/workflows/backend-e2e.yml
      - .github/workflows/e2e-pr-path-filter.yml
      - hack/e2e-path-filter.py
      # Installs the pinned kind and kubectl the suite runs on.
      - .github/actions/setup-kind/**
  # Twice a day, like every other e2e lane. A schedule ignores the paths above,
  # so a break they filtered out, or one a flake hid, still surfaces within
  # twelve hours. :30 past, continuing the ladder the other lanes use -- 2,14
  # is taken at :00 CAPD, :15 NICo, :30 bringup, :45 gofail; 3,15 at :00
  # nvkectl-bootstrap and nico-vms, :15 local-entrypoint.
  schedule:
    - cron: '30 3,15 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: CAPD DSX identity exchange E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/e2e-pr-path-filter.yml
    permissions:
      contents: read
      pull-requests: read

  # Keep the ordinary direct-SPIRE CAPD lane as a control. This small lifecycle
  # uses the real exec plugin, a real local JWT-SVID and a real tenant apiserver.
  capd-dsx-identity-exchange:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    # Same two pools capd-e2e uses. Neither needs /dev/kvm.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
          - arch: arm64
            runner: linux-arm64-cpu16
    uses: ./.github/workflows/backend-e2e.yml
    permissions:
      contents: read
    with:
      backend: capd-dsx-identity
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      label-filter: identity-exchange
      providers: '["capi_core", "bgp-containers", "capd", "capd-reboot-controller", "dsx-identity-exchange"]'
      install-cni-after-init: true
      needs-capnico-source: true
      timeout-minutes: 75
