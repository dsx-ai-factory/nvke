#
# Reports Go dependency vulnerabilities that this code actually calls. Results
# go to Security -> Code scanning under the "govulncheck" category.
#
# This job gates, but only on the narrow question.
#
# In SARIF mode govulncheck exits 0 whether or not it finds anything, and that
# SARIF carries everything it can see, including packages that are only
# imported. Gating on all of it would bury a new regression in a backlog: this
# module has 26 open SARIF alerts today. So the upload still reports everything,
# and a separate step asks the smaller question -- does this code CALL a
# vulnerable symbol? govulncheck exits 3 for that, 0 when clean.
#
# That set is zero for this module today, measured on 2026-08-13, so the gate
# costs nothing to switch on. It is also the set that matters. GO-2026-6061 was
# reachable from cmd/agent/main.go through agent.startSecureServer to
# grpc.Server.Serve, and it reached main behind a green check because this job
# reported it without failing on it. See #89.
#
# The gate runs after the upload so that a failure still leaves the findings in
# the Security tab rather than losing them with the job.
#
# Only the agent module is covered. controller/ requires two non-public
# modules — the carbide SDK, reached through the Forge provider, and
# cluster-api-provider-nico — so it cannot build on a public runner.
# .github/workflows/lint.yml states the same thing. Widen GO_MODULE when
# the controller builds from public dependencies.

name: govulncheck

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  schedule:
    # Monday 06:30 UTC. New advisories land without the code changing.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Go module to scan, relative to the repository root.
  GO_MODULE: agent
  # This workflow scans one module at a time, as it did before the repository
  # gained a root go.work. GOWORK=off keeps it that way. It is also required:
  # actions/setup-go pins GOTOOLCHAIN=local, and the Go version installed from a
  # module's go.mod is older than the one go.work asks for, so leaving the
  # workspace on fails with "go.work requires go >= 1.26.0".
  GOWORK: "off"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read          # upload-sarif reads the workflow run
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Deliberately NOT go-version-file. The `go` directive in go.mod is a
          # floor, not a pin, and setup-go pins GOTOOLCHAIN=local to whatever it
          # installs -- so reading go.mod scans the OLDEST Go the module allows,
          # which is a toolchain nobody ships. agent/Dockerfile.nke-builder
          # builds the released agent with golang:1.26.6.
          #
          # That gap is not cosmetic. On 2026-08-13 the floor was go 1.26.0, and
          # scanning it reported 16 reachable standard-library vulnerabilities,
          # every one of them "Fixed in: go1.26.1". The same scan on 1.26.5
          # reports none.
          #
          # `stable` tracks the newest released Go, but the setup-go manifest
          # can lag a release by hours or days. Pinning the patch here and in
          # the Dockerfiles keeps the scan and the shipped binary in sync, and
          # means a new advisory is visible immediately rather than waiting for
          # the manifest to catch up. Bump when the next patch ships.
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: ${{ env.GO_MODULE }}/go.sum

      - name: Install govulncheck
        # golang.org/x/vuln v1.6.0 needs go >= 1.25.0. `stable` satisfies that,
        # so this no longer needs GOTOOLCHAIN=auto to install.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        id: scan
        shell: bash
        working-directory: ${{ env.GO_MODULE }}
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/govulncheck.raw.sarif"
          out="${RUNNER_TEMP}/govulncheck.sarif"
          govulncheck -format sarif ./... > "${raw}"
          # Fail loudly rather than skip the upload and report a green check.
          if [ ! -s "${raw}" ]; then
            echo "::error::govulncheck produced no SARIF at ${raw}"
            exit 1
          fi
          # GitHub validates SARIF with uniqueItems on properties.tags, and
          # govulncheck can list the same CVE alias twice on one rule, which
          # gets the whole upload rejected as invalid. Only reachable when
          # there are findings, which is why the one clean repository in the
          # fleet never hit it.
          jq '(.runs[]?.tool?.driver?.rules[]?.properties?.tags) |= unique' \
            "${raw}" > "${out}"
          echo "sarif=${out}" >> "${GITHUB_OUTPUT}"

      - name: Summarise
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/govulncheck.sarif"
          {
            echo "## govulncheck — module \`${GO_MODULE}\`"
            echo
            if [ ! -s "${f}" ]; then
              echo "No SARIF produced. The scan did not finish."
            else
              echo "$(jq '[.runs[].results[]] | length' "${f}") result(s). Details in **Security -> Code scanning**, category \`govulncheck\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload SARIF
        # Guarded on a step output, not hashFiles(): hashFiles() only resolves
        # paths under GITHUB_WORKSPACE, so against RUNNER_TEMP it silently
        # returns '' and skips the upload while the job still reports green.
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          checkout_path: ${{ github.workspace }}/${{ env.GO_MODULE }}
          category: govulncheck

      - name: Fail on a reachable vulnerability
        # Runs last on purpose: the SARIF upload above must happen even when
        # this fails, or a red check would also lose the findings.
        #
        # A second scan rather than a re-read of the SARIF, because the SARIF
        # does not separate "imported" from "called". The module cache is warm
        # from the first run, so this is cheap.
        #
        # Exit 3 is a called vulnerability, 0 is clean, 1 is the tool failing.
        # Letting the step exit non-zero handles all three.
        shell: bash
        working-directory: ${{ env.GO_MODULE }}
        run: govulncheck ./...
