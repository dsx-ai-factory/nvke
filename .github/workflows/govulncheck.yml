#
# Reports Go dependency vulnerabilities that this code actually calls. Results
# go to Security -> Code scanning under a "govulncheck-<module>" category.
#
# Every module in the workspace is scanned. It used to be agent/ alone, because
# controller/ required the carbide SDK and could not build on a public runner.
# #76 replaced that SDK with the public ncx-infra-controller-rest, so the whole
# workspace builds from public dependencies and the exclusion no longer has a
# reason. The build and the lint were widened; this was the piece left behind,
# which meant the majority of the repository was compiled, linted and never
# scanned.
#
# The matrix comes from go.work rather than a list kept here. A module added to
# the workspace is scanned without anyone remembering to edit this file -- the
# failure mode of a hand-kept list is silence, not an error.
#
# This job gates, but only on the narrow question.
#
# In SARIF mode govulncheck exits 0 whether or not it finds anything, and that
# SARIF carries everything it can see, including packages that are only
# imported. Gating on all of it would bury a new regression in a backlog. So the
# upload still reports everything, and a separate step asks the smaller question
# -- does this code CALL a vulnerable symbol? govulncheck exits 3 for that, 0
# when clean.
#
# That set was zero for six of the seven modules present on 2026-08-13. The
# matrix now also discovers the imported nkectl module. It is also the set that
# matters.
# GO-2026-6061 was reachable from cmd/agent/main.go through
# agent.startSecureServer to grpc.Server.Serve, and it reached main behind a
# green check because this job reported it without failing on it. See #89.
#
# controller/forge-vms is waived rather than gated:
#
#   GO-2026-4736  github.com/osrg/gobgp/v3 v3.37.0  Fixed in: N/A
#
# It is reachable for real -- internal/bgp/speaker.go calls ParseBGPMessage on
# the wire path -- and it cannot be bumped away. The advisory lists gobgp,
# gobgp/v3 and gobgp/v4 all as `introduced: 0` with no fixed version, so there
# is no release to move to. It needs an upstream fix or a documented VEX Not
# Affected, neither of which is a CI change.
#
# The waiver is written so it cannot outlive its reason: a waived module that
# comes back CLEAN fails this job and asks to be un-waived. An exclusion nobody
# is forced to revisit is how the previous single-module scope survived long
# after the dependency that justified it was gone.
#
# The gate runs after the upload so that a failure still leaves the findings in
# the Security tab rather than losing them with the job.
#
# The workspace stays ON, unlike the previous single-module version of this
# file. That is what makes the scan hermetic: the committed vendor/ tree
# supplies every dependency, so no module is downloaded and the scan measures
# exactly what `make build` compiles. It is also why go-version is pinned rather
# than read from a go.mod -- see the comment on that step.

name: govulncheck

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  schedule:
    # Monday 06:30 UTC. New advisories land without the code changing.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover-modules:
    name: Discover workspace modules
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the module list from go.work
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # The use(...) block, one ./path per line. Reading go.work keeps this
          # in step with the workspace by construction. `go list -m` would need
          # a toolchain on a job that otherwise needs none.
          mods=$(sed -n '/^use (/,/^)/p' go.work \
            | sed -n 's#^[[:space:]]*\./##p' \
            | sed 's/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort)

          if [ -z "$mods" ]; then
            echo "::error::no modules found in go.work; the use() block did not parse"
            exit 1
          fi

          # id is the category suffix and the job name: SARIF categories must be
          # distinct or each upload overwrites the last, which would silently
          # leave only one module's findings in the Security tab.
          json=$(printf '%s\n' "$mods" \
            | jq -R '{dir: ., id: (. | gsub("/"; "-"))}' \
            | jq -sc .)

          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "Scanning $(printf '%s\n' "$mods" | wc -l) modules:"
          printf '%s\n' "$mods" | sed 's/^/  /'

  govulncheck:
    name: govulncheck (${{ matrix.module.dir }})
    needs: [discover-modules]
    runs-on: linux-amd64-cpu16
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read          # upload-sarif reads the workflow run
      security-events: write
    strategy:
      # One vulnerable module must not hide the state of the others.
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pin the version the Dockerfiles build with, so the scan reports on
          # the toolchain we ship. Not go-version-file: a go directive is a
          # floor, so it scans the oldest Go allowed -- and this workspace's
          # floors range from 1.25.4 to 1.26.5, which would give eight modules
          # five different answers to the same question. Not `stable`: setup-go
          # resolves it from GitHub's manifest, which lags, so it can be older
          # than what we ship. Keep this in step with the Dockerfiles.
          #
          # This is not cosmetic. On 2026-08-13 the same controller/ tree
          # reported 7 reachable standard-library vulnerabilities under 1.26.5
          # and 0 under 1.26.6.
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.work.sum

      - name: Install govulncheck
        # golang.org/x/vuln v1.6.0 needs go >= 1.25.0, which the pin above
        # satisfies, so this needs no GOTOOLCHAIN=auto.
        #
        # No GOPROXY=off here, unlike the scan steps below: this fetches the
        # tool, which is deliberately not vendored. `go install pkg@version`
        # ignores the surrounding workspace, so it resolves the tool's own
        # dependencies rather than the repository's build list.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        id: scan
        shell: bash
        working-directory: ${{ matrix.module.dir }}
        env:
          # The workspace supplies vendor/, so nothing is downloaded. GOPROXY=off
          # asserts that rather than hoping: if a dependency is ever missing from
          # the vendor tree, this fails loudly instead of quietly reaching the
          # network and scanning a different build list from the one we ship.
          GOPROXY: "off"
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/govulncheck.raw.sarif"
          out="${RUNNER_TEMP}/govulncheck.sarif"
          govulncheck -format sarif ./... > "${raw}"
          # Fail loudly rather than skip the upload and report a green check.
          if [ ! -s "${raw}" ]; then
            echo "::error::govulncheck produced no SARIF at ${raw}"
            exit 1
          fi
          # GitHub validates SARIF with uniqueItems on properties.tags, and
          # govulncheck can list the same CVE alias twice on one rule, which
          # gets the whole upload rejected as invalid. Only reachable when
          # there are findings, which is why the one clean repository in the
          # fleet never hit it.
          jq '(.runs[]?.tool?.driver?.rules[]?.properties?.tags) |= unique' \
            "${raw}" > "${out}"
          echo "sarif=${out}" >> "${GITHUB_OUTPUT}"

      - name: Summarise
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/govulncheck.sarif"
          {
            echo "## govulncheck — module \`${{ matrix.module.dir }}\`"
            echo
            if [ ! -s "${f}" ]; then
              echo "No SARIF produced. The scan did not finish."
            else
              echo "$(jq '[.runs[].results[]] | length' "${f}") result(s). Details in **Security -> Code scanning**, category \`govulncheck-${{ matrix.module.id }}\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload SARIF
        # Guarded on a step output, not hashFiles(): hashFiles() only resolves
        # paths under GITHUB_WORKSPACE, so against RUNNER_TEMP it silently
        # returns '' and skips the upload while the job still reports green.
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          checkout_path: ${{ github.workspace }}/${{ matrix.module.dir }}
          category: govulncheck-${{ matrix.module.id }}

      - name: Fail on a reachable vulnerability
        # Runs last on purpose: the SARIF upload above must happen even when
        # this fails, or a red check would also lose the findings.
        #
        # A second scan rather than a re-read of the SARIF, because the SARIF
        # does not separate "imported" from "called". The module cache is warm
        # from the first run, so this is cheap.
        #
        # Exit 3 is a called vulnerability, 0 is clean, anything else is the
        # tool failing.
        shell: bash
        working-directory: ${{ matrix.module.dir }}
        env:
          GOPROXY: "off"
          # Modules whose reachable set is known non-empty with no fix
          # available. Space-separated, and every entry needs a reason in the
          # header of this file. Waived is not ignored: the SARIF above still
          # reports everything, and the check below still runs.
          GATE_WAIVED: "controller/forge-vms"
        run: |
          set +e
          govulncheck ./...
          rc=$?
          set -e

          waived=false
          for m in ${GATE_WAIVED}; do
            [ "$m" = "${{ matrix.module.dir }}" ] && waived=true
          done

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::govulncheck failed to run (exit ${rc}), which is not a finding either way"
            exit "$rc"
          fi

          if [ "$waived" = false ]; then
            [ "$rc" -eq 0 ] && exit 0
            echo "::error::${{ matrix.module.dir }} calls a vulnerable symbol. Fix it, or waive it in GATE_WAIVED with a reason in this file's header."
            exit 3
          fi

          # Waived from here down.
          if [ "$rc" -eq 3 ]; then
            echo "::warning::${{ matrix.module.dir }} is waived from this gate and still has a reachable vulnerability. See the header of this file."
            exit 0
          fi

          # rc == 0 on a waived module: the reason for the waiver is gone.
          # Failing here is what stops the exclusion outliving its cause.
          echo "::error::${{ matrix.module.dir }} is clean but still listed in GATE_WAIVED. Remove it from that list and delete its note from this file's header."
          exit 1
