---
# License enforcement for all Go modules in the monorepo.
#
# A discover-modules setup job finds every go.mod (excluding vendor/ and
# testdata/), then two matrix jobs fan out over its outputs so new components
# are covered automatically without workflow edits.
#
#   license-check — go-licenses (github.com/google/go-licenses) verifies all
#     transitive dependency licenses are permissive (no restricted/reciprocal/
#     forbidden/unknown types).  This is the same underlying tool used in the
#     existing GitLab CI pipeline; no proprietary wrapper is required here.
#     It covers every module.  controller used to be excluded because the check
#     resolved dependencies over the network and could not reach the INTERNAL
#     github.com/NVIDIA/cluster-api-provider-nico; it now reads the committed
#     vendor tree, which carries that module, so nothing is excluded and no
#     credential is needed.
#
#   header-check — `make file-license-check` verifies every source file carries
#     the required copyright header via addlicense.  This runs over the *full*
#     module list, including the modules excluded above: the target invokes
#     addlicense as `go run <pkg>@<version>`, which ignores the current module's
#     dependencies, so it needs no access to private imports.
#
# Release gate: the release workflow calls this workflow via workflow_call and
# gates publish jobs on it via `needs`.  See .github/workflows/release.yml.
name: License Checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      # The shipped LICENSE/NOTICE copies derive from the root files and from
      # the Makefile that copies them, so all three trigger the check that
      # compares them.
      - 'LICENSE'
      - 'NOTICE'
      - 'Makefile'
      - 'controller/licenses/**'
      - 'controller/deploy/charts/cloud-workflow-engine/LICENSE'
      - 'controller/deploy/charts/cloud-workflow-engine/NOTICE'
      - '.github/workflows/license.yml'
  # No `pull_request:` trigger. Pull requests reach this through merge-gate.yml,
  # which calls it as a reusable workflow, so it runs once rather than twice.
  # release.yml also calls it, which is why workflow_call was already here.
  workflow_call:

# Every job here only reads the checkout. Declared rather than inherited: a
# called workflow with no permissions block takes the caller's, and release.yml
# calls this one, so without this it would run with that job's grant.
permissions: {}

# The group is a fixed literal, NOT ${{ github.workflow }}. In a called
# workflow that context resolves to the CALLER's name, so release.yml and this
# file would share a group on a tag push: the caller holds it, the called
# workflow queues behind its own caller, and the release never finishes.
#
# Not cancelled on a tag either. release.yml calls this as its publish gate,
# and cancelling the gate fails the release.
concurrency:
  group: license-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# header-check works one module at a time, as this whole workflow did before the
# repository gained a root go.work. GOWORK=off keeps it that way, and is
# required: that job reads the Go version from the module's own go.mod, which is
# older than go.work asks for, so leaving the workspace on fails with
# "go.work requires go >= 1.26.0".
#
# license-check turns it back on for itself. It has to: it reads the vendor tree
# at the workspace root, and with GOWORK=off there is no main module there, so
# every pattern fails with
#
#   pattern ./agent/...: directory prefix agent does not contain main module
#   or its selected dependencies
#
# That job reads its Go version from go.work instead, so the version mismatch
# above cannot bite it. See the job for both.
env:
  GOWORK: "off"

jobs:
  discover-modules:
    name: Discover Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find Go modules
        id: find
        run: |
          all=$(find . -name go.mod \
            -not -path '*/vendor/*' \
            -not -path '*/testdata/*' \
            -exec dirname {} \; \
            | sort)

          # Every module, with no exclusion. controller used to be dropped here
          # because go-licenses resolved dependencies over the network and could
          # not reach the INTERNAL cluster-api-provider-nico. The check now runs
          # from the vendor tree instead, which carries that module, so it needs
          # no credential and no exclusion. See the check job below.
          modules=$(printf '%s\n' "$all" | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

          # Header checks are no longer discovered per module. They run once,
          # from the repository root, against one template -- see the
          # header-check job below for why the per-module shape could not catch
          # a header that named the wrong licence.
          echo "dependency-license modules: $modules"

  license-check:
    name: License check (${{ matrix.module }})
    needs: [discover-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Undoes the workflow-level GOWORK=off for this job only. Empty means
    # "find go.work normally", which is what reading the root vendor tree
    # needs. header-check keeps the workflow-level value.
    env:
      GOWORK: ""
    strategy:
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.work, not the module's go.mod. The check below runs from the
      # repository root with the workspace on, and setup-go pins
      # GOTOOLCHAIN=local. A `go` directive is a floor, so reading a module that
      # says 1.25.4 installs exactly that, and every command then stops with
      #
      #   go: go.work requires go >= 1.26.5
      #       (running go 1.25.4; GOTOOLCHAIN=local)
      #
      # go.work carries the highest floor of any member, so it satisfies all of
      # them. Same reasoning as go-build.yml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          # go.work.sum holds only the hashes NOT already in a member's go.sum,
          # so keying on it alone restores a stale cache after a bump.
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Runs from the repository root, not from the module, and names the module
      # as a package pattern. go-licenses requires its root directory to CONTAIN
      # the vendor tree it reads, and this repository vendors once at the
      # workspace root, above every module. From inside a module it finds no
      # vendor tree, resolves each dependency over the network, and cannot reach
      # the INTERNAL cluster-api-provider-nico -- which is why controller was
      # excluded from this matrix rather than fixed.
      #
      # Reading the vendor tree is also the more accurate test: it checks the
      # dependencies that are committed and built, rather than whatever a fresh
      # resolution returns today.
      #
      # controller/hack/generate-notices does the same thing for the same reason
      # and has been generating the shipped attribution since #142.
      - name: Check dependency licenses
        # GOTOOLCHAIN=local prevents Go from downloading a golang.org/toolchain
        # module for stdlib, which confuses go-licenses into treating standard
        # library packages as unrecognised external packages.
        env:
          GOTOOLCHAIN: local
          MODULE: ${{ matrix.module }}
        run: |
          go install github.com/google/go-licenses/v2@latest
          # cluster-api-provider-nico is first-party NVIDIA code carried in
          # vendor/, not a third-party dependency, and it ships no LICENSE of its
          # own. Same ignore list as controller/Makefile's license-policy-check.
          go-licenses check "./${MODULE#./}/..." \
            --disallowed_types=restricted,reciprocal,forbidden,unknown \
            --ignore github.com/NVIDIA/nke \
            --ignore github.com/NVIDIA/cluster-api-provider-nico

  # One job for the whole repository, not one per module.
  #
  # The per-module matrix this replaces could not catch the defect it existed to
  # prevent. addlicense only ADDS a header to a file that has none, so
  # `make file-license-check` passes on a file already stamped with the WRONG
  # licence -- which is how 830 files carried a proprietary identifier in an
  # Apache-2.0 repository with every module green, including six under agent/,
  # whose template had said Apache-2.0 all along.
  #
  # make license-header-check asserts both things: a header exists, and it names
  # Apache-2.0. It reads one template, hack/license-header.tmpl, so the modules
  # cannot disagree about the answer.
  header-check:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true

      - name: Verify license headers
        run: make license-header-check

  shipped-licenses:
    name: Shipped LICENSE and NOTICE copies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Go needed: the target is a copy and a diff. The controller image and
      # the Helm chart each read LICENSE and NOTICE from a copy inside their own
      # build context, because Docker cannot reach outside one and the root files
      # sit outside `controller/`. A copy is a thing that goes stale, and until
      # now nothing asserted these had not -- the chart's pair was committed by
      # hand and merely happened to match.
      - name: Verify the shipped copies match the root files
        run: make licenses-check
