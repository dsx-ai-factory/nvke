#
# Cancels queued e2e runs that can no longer matter: main runs of superseded
# commits, and pull-request mirror runs whose pull request is merged or closed.
#
# The lanes keep one concurrency group per commit on main (README.md,
# "Concurrency"), so GitHub never cancels a queued run when newer merges
# arrive. On a busy day that leaves dozens of two-hour legs queued for commits
# that are no longer the head, and the head waits hours for its first result.
#
# The sweeper keeps every running leg, because a leg that has started still
# produces a result, and the newest `keep` queued runs per lane. It cancels the
# older queued ones. Those commits keep every other check, and a lane can be
# dispatched on one of them by hand when its result is wanted.
#
# The same pool serves the pull-request mirror branches (`pull-request/<n>`,
# pushed by copy-pr-bot), and a queued run there outlives its pull request: once
# the PR is merged or closed its result changes nothing, yet the two-hour legs
# still wait in line ahead of main. The sweeper cancels those too.
#
# Gofail and NKTP are left out: they run on hosted and cpu8 runners and finish
# in minutes.
name: E2E queue sweeper

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: Queued main runs to keep per lane, newest first
        type: number
        default: 2
      dry-run:
        description: Only list the runs that would be cancelled
        type: boolean
        default: false

permissions: {}

concurrency:
  group: E2E queue sweeper
  cancel-in-progress: true

jobs:
  sweep:
    if: github.repository_id == '1323115536'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: ${{ inputs.keep || 2 }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - name: Cancel the superseded queued runs
        run: |
          set -euo pipefail
          # gh api with retries: a 5xx from GitHub must not end the pass.
          api() {
            local try out
            for try in 1 2 3; do
              if out="$(gh api "$@")"; then printf '%s\n' "${out}"; return 0; fi
              echo "gh api failed (try ${try} of 3)" >&2
              sleep $((try * 5))
            done
            return 1
          }
          lanes=(
            capd-e2e.yml
            nico-e2e.yml
            capd-dsx-identity-exchange-e2e.yml
            local-entrypoint-e2e.yml
            nico-vms-e2e.yml
            nvkectl-bootstrap-e2e.yml
            kubeadm-bringup-e2e.yml
          )
          cancelled=0
          for lane in "${lanes[@]}"; do
            # Queued push runs on main, newest first; the first KEEP stay.
            while read -r id sha created; do
              [ -n "${id}" ] || continue
              # A run still reads "queued" while one leg waits and another runs.
              running="$(api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" \
                           --jq '[.jobs[] | select(.status == "in_progress")] | length')"
              [ "${running}" = 0 ] || continue
              echo "${lane}: cancel ${id} (${sha}, queued since ${created})"
              if [ "${DRY_RUN}" != true ]; then
                api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null || echo "  cancel failed, the next pass retries"
              fi
              cancelled=$((cancelled + 1))
            done < <(api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${lane}/runs" \
                       -f branch=main -f event=push -f status=queued -f per_page=100 \
                       --jq '.workflow_runs | sort_by(.created_at) | reverse
                             | .[] | "\(.id) \(.head_sha[0:9]) \(.created_at)"' \
                     | tail -n +"$((KEEP + 1))")
          done
          echo "superseded queued runs: ${cancelled} (dry run: ${DRY_RUN}, keep: ${KEEP})"
      - name: Cancel the queued runs of merged and closed pull requests
        run: |
          set -euo pipefail
          # gh api with retries: a 5xx from GitHub must not end the pass.
          api() {
            local try out
            for try in 1 2 3; do
              if out="$(gh api "$@")"; then printf '%s\n' "${out}"; return 0; fi
              echo "gh api failed (try ${try} of 3)" >&2
              sleep $((try * 5))
            done
            return 1
          }
          lanes=(
            capd-e2e.yml
            nico-e2e.yml
            capd-dsx-identity-exchange-e2e.yml
            local-entrypoint-e2e.yml
            nico-vms-e2e.yml
            nvkectl-bootstrap-e2e.yml
            kubeadm-bringup-e2e.yml
          )
          declare -A state
          cancelled=0
          for lane in "${lanes[@]}"; do
            # Queued runs on the copy-pr-bot mirror branches, one PR number each.
            while read -r id branch created; do
              [ -n "${id}" ] || continue
              pr="${branch#pull-request/}"
              if [ -z "${state[${pr}]:-}" ]; then
                state[${pr}]="$(api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .state 2>/dev/null || echo unknown)"
              fi
              [ "${state[${pr}]}" = closed ] || continue
              echo "${lane}: cancel ${id} (#${pr} is closed, queued since ${created})"
              if [ "${DRY_RUN}" != true ]; then
                api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null || echo "  cancel failed, the next pass retries"
              fi
              cancelled=$((cancelled + 1))
            done < <(api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${lane}/runs" \
                       -f status=queued -f per_page=100 \
                       --jq '.workflow_runs[] | select(.head_branch | startswith("pull-request/"))
                             | "\(.id) \(.head_branch) \(.created_at)"')
          done
          echo "queued runs of closed pull requests: ${cancelled} (dry run: ${DRY_RUN})"
