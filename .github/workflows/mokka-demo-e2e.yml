#
# Simulated GPU nodes with Mokka on a CPU runner: brings up the CAPD stack the
# local entrypoint brings up, stops before its suite
# (LOCAL_NKE_E2E_DEPLOY_ONLY), creates one CAPD workload cluster, and runs
# hack/mokka-demo/demo.sh through hack/mokka-demo/ci.sh: a node pool whose labels
# select Mokka, GPU Operator, and a pod that requests a GPU.
#
# The setup steps match local-entrypoint-e2e.yml, which explains each of them.
# Advisory, like every other E2E lane: not a merge-gate member.

name: Mokka demo E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - hack/mokka-demo/**
      - controller/hack/local-backend-e2e.sh
      - .github/workflows/mokka-demo-e2e.yml
      - .github/workflows/e2e-pr-path-filter.yml
      - hack/e2e-path-filter.py
      - .github/actions/setup-kind/**
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: Mokka demo E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/e2e-pr-path-filter.yml
    permissions:
      contents: read
      pull-requests: read

  mokka-demo:
    needs: changes
    name: Mokka demo on a CAPD workload cluster (amd64)
    if: github.repository_id == '1323115536' && needs.changes.outputs.run_e2e == 'true'
    runs-on: linux-amd64-cpu16
    permissions:
      contents: read
    # About 15 minutes of setup, up to 40 for tilt ci, then the cluster and the demo.
    timeout-minutes: 120
    env:
      # Post-init CNI: the exit trap stops the bundle mirror, which nodes
      # created after the entrypoint returns would otherwise need.
      INSTALL_CNI_AFTER_INIT: "true"
      LOCAL_NKE_E2E_DEPLOY_ONLY: "true"
      NODE_REBOOT_SOFT_REBOOT_ENABLED: false
      NKE_E2E_DOCKERHUB_MIRROR: mirror.gcr.io
      # Placeholders the Tiltfile requires; nothing here is a credential.
      DGXC_TENANT_USER: local-e2e
      DGXC_TENANT_PASSWORD: example-password
      CNPG_SUPERUSER_PASSWORD: example-password
      CNPG_CLOUD_PASSWORD: example-password
      CNPG_TEMPORAL_PASSWORD: example-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev

      - name: Install the Open vSwitch module files
        run: |
          uname -a
          sudo apt-get install -y -qq kmod
          modules="${RUNNER_TEMP}/nvke-host-kernel-modules"
          sudo bash controller/hack/ci/prepare-host-kernel-modules.sh "${modules}"
          echo "NKE_E2E_HOST_MODULES_DIR=${modules}/lib/modules" >> "${GITHUB_ENV}"

      - name: Configure runner inotify capacity
        run: |
          raise_minimum() {
            local key="$1" minimum="$2" current
            current="$(sysctl -n "${key}")"
            echo "${key}=${current} (required minimum ${minimum})"
            if (( current < minimum )); then
              sudo sysctl -w "${key}=${minimum}"
              current="$(sysctl -n "${key}")"
            fi
            (( current >= minimum )) || { echo "${key} stayed below ${minimum}" >&2; exit 1; }
          }
          raise_minimum fs.inotify.max_user_instances 1024
          raise_minimum fs.inotify.max_user_watches 1048576

      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "helm_version=$(make --no-print-directory print-HELM_VERSION)"
            echo "kind_version=$(make --no-print-directory print-KIND_VERSION)"
            echo "kubectl_version=$(make --no-print-directory print-KUBECTL_VERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Set up Kind and kubectl
        uses: ./.github/actions/setup-kind
        with:
          kind_version: ${{ steps.versions.outputs.kind_version }}
          kubectl_version: ${{ steps.versions.outputs.kubectl_version }}

      - name: Route helm OCI pulls through the mirror
        run: |
          real="$(command -v helm)"
          sudo mv "${real}" /usr/local/bin/helm-real
          sudo install -m 0755 controller/hack/ci/helm-dockerhub-mirror.sh "${real}"
          helm version --short

      - name: Install Tilt
        run: |
          version="$(grep -oE 'TILT_VERSION:=v[0-9.]+' controller/hack/ci/backend-e2e.sh \
            | head -1 | sed 's/.*:=v//')"
          [[ -n "${version}" ]] || { echo "could not read the pinned Tilt version" >&2; exit 1; }
          tmp="$(mktemp -d)"
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 \
            -o "${tmp}/tilt.tgz" \
            "https://github.com/tilt-dev/tilt/releases/download/v${version}/tilt.${version}.linux.x86_64.tar.gz"
          tar -xzf "${tmp}/tilt.tgz" -C "${tmp}" tilt
          sudo install -m 0755 "${tmp}/tilt" /usr/local/bin/tilt
          tilt version

      - name: Bring up the CAPD stack
        env:
          LOCAL_NKE_E2E_KUBECONFIG: ${{ runner.temp }}/management.kubeconfig
        run: ./hack/local-backend-e2e.sh
        working-directory: controller

      - name: Run the Mokka demo
        env:
          MANAGEMENT_KUBECONFIG: ${{ runner.temp }}/management.kubeconfig
          STATE_DIR: ${{ runner.temp }}/mokka-demo
        run: hack/mokka-demo/ci.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mokka-demo-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          # Logs and state only: no kubeconfig and no token cache.
          path: |
            controller/.local/backend-e2e/
            ${{ runner.temp }}/mokka-demo/*.txt
            ${{ runner.temp }}/mokka-demo/*.json
            ${{ runner.temp }}/mokka-demo/*.log
          if-no-files-found: ignore
          retention-days: 7
