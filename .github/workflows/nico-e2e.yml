# NICo containers integration test. Pull-request mirror branches run a bounded
# core lifecycle. Main, scheduled, and manual runs retain the comprehensive
# two-mode suite. The body lives in backend-e2e.yml, shared with capd-e2e.yml;
# this file is the NICo trigger and configuration.
#
# The nico-containers spec was one of 60 Ginkgo specs no workflow selected. It
# needs CAPNICo, which lives in dsx-ai-factory/cluster-api-provider-nico.
# The provider repository is public; checking out its source needs no
# repository-specific token.
#
# nico-sim's nico-containers backend provisions kind-style node containers, so
# this needs no real infrastructure and reuses the CAPD kindest node image the
# CAPD lane already builds.
#
# NOT in merge-gate.yml, and deliberately so. This lane needs an NVIDIA runner
# runner, so it remains behind the vetted mirror branch trust boundary even
# though the pull-request workload is now bounded.
#
# Self-hosted runners do not receive pull_request events, so this triggers on the
# copy-pr-bot mirror branch like the CAPD lane. That also puts the run on a push
# to an in-repo branch for the existing runner trust boundary.

name: NICo E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - "controller/**"
      - "auth/**"
      - "agent/**"
      - Makefile
      # The deploy path this lane installs. Without it a change to the tree
      # that defines the management plane triggers nothing, and the lane that
      # would have caught the break runs on some later, unrelated push.
      - "controller/deploy/**"
      - "deploy/**"
      - .github/workflows/nico-e2e.yml
      - .github/workflows/backend-e2e.yml
      - .github/workflows/e2e-pr-path-filter.yml
      - hack/e2e-path-filter.py
      # Installs the pinned kind and kubectl the suite runs on.
      - .github/actions/setup-kind/**
  # Also twice a day, so a break the paths above filtered out, or one a flake
  # hid, still surfaces within twelve hours. A schedule ignores those paths, so
  # these runs always exercise the whole suite.
  schedule:
    - cron: '15 2,14 * * *'
  workflow_dispatch:
    inputs:
      use-nke-stack:
        description: >-
          Deploy the management plane from controller/deploy/capnico-e2e with
          deploy/nvke-deploy.sh. This is the default on every trigger, as on the CAPD
          lane; set false here to fall back to Tilt.
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: NICo E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A mirror-branch push carries base-branch commits as well as the pull
  # request's own, so the push paths above fire for a pull request that touches
  # none of them. This re-reads the pull request's file list and skips the lane
  # when none of those files is on the paths above. The CAPD lane
  # has gated this way since #466; this one did not, so a docs-only pull request
  # was still paying 73 minutes on two architectures.
  changes:
    uses: ./.github/workflows/e2e-pr-path-filter.yml
    permissions:
      contents: read
      pull-requests: read

  # Both architectures, as the CAPD lane has run since #399. CAPNICo builds for
  # arm64 already: its Dockerfile takes TARGETARCH and its own image workflow
  # publishes an arm64 leg on this same runner label.
  nico-e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
          - arch: arm64
            runner: arc-arm64-cpu16
    uses: ./.github/workflows/backend-e2e.yml
    permissions:
      contents: read
    with:
      backend: nico
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      # Mirror branches select only the bounded core entry and health probes.
      # Comprehensive runs use the same expression as the CAPD lane. Health and
      # authn hit the
      # management-cluster controller, not the tenant backend, so this lane already
      # pays for them. authn-spire is out because it needs SPIRE pod attestation
      # the container-backed backends do not wire up. The label filter keeps this
      # job focused on the nico-containers specs; nico-vms uses its own job below. Keep the full
      # expression in step with e2e_suite_filter in hack/backend-e2e-lib.sh.
      # nico-containers machines are containers, with no TPM and no GPU.
      label-filter: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'pull-request/') && '(core-nico || health) && !tpm-attestation && !gpu' || '((nico-containers || health) || (authn && !authn-spire) || authn-permissive) && !tpm-attestation && !gpu' }}
      # The nico provider installs CAPNICo, starts nico-sim by default, and
      # brings its own node image step. capi_core is required.
      providers: '["capi_core", "bgp-containers", "nico"]'
      # copy-pr-bot mirrors PRs onto pull-request/<n> for self-hosted runners.
      # Mirrored runs select the smaller core/health suite; 30 minutes leaves
      # room for arm64 diagnostics and action cleanup after that suite finishes.
      # Full runs cover the extended NICo container scenarios, so they retain
      # their 240-minute allowance.
      timeout-minutes: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'pull-request/') && 30 || 240 }}
      # Without this, a broken auth deployment turns the authn specs into
      # skips and the lane stays green having tested nothing new.
      require-authn: ${{ github.event_name != 'push' || !startsWith(github.ref_name, 'pull-request/') }}
      # Same controller and the same REST API as CAPD, so this asserts nothing new about
      # nvkectl. It is on because it costs a minute on a lane that already runs,
      # and it catches a controller deployment difference the CAPD lane would not see.
      nvkectl-smoke: true
      needs-capnico-source: true
      # Default on every trigger; a dispatch can still opt out, the same form
      # the CAPD lane uses. Written as "not a dispatch OR the input" rather
      # than `inputs.x || true`: in GitHub expressions `false || true` is true,
      # so the `|| true` form would swallow an explicit false and leave no way
      # back to Tilt.
      #
      # Tilt is the fallback for one thing the deploy path does not replace:
      # it supervises nico-sim as a serve_cmd, where run-nico-sim.sh starts the
      # process and leaves it. A simulator that dies mid-suite shows up as
      # specs timing out rather than as a resource error.
      use-nke-stack: ${{ github.event_name != 'workflow_dispatch' || inputs.use-nke-stack }}
