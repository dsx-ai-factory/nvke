name: CLI S3 Publish

# Publishes nvkectl binaries to S3, fronted by the same CloudFront distribution
# agent/scripts/upload-s3-apt-intake.sh already uses for the agent .deb --
# confirmed live and unauthenticated. Uses scripts/upload-s3-flat.sh, a
# generic uploader, not that apt-specific one (it shells to dpkg-deb and
# writes an apt-publisher index.json; nvkectl is neither a .deb nor
# apt-consumed).
#
# Needs a new `s3-publish` GitHub Environment (Settings -> Environments),
# not a reuse of `apt-intake` -- that name and scope are conceptually
# apt-specific. Required environment vars:
#
#   S3_PUBLISH_S3_URI             variable  e.g. s3://nke-prod-assets/nvke-packages
#   S3_PUBLISH_AWS_ROLE_ARN       variable  role ARN with write access to the
#                                           nvkectl/* prefix under that URI
#   S3_PUBLISH_AWS_REGION         variable  optional, defaults to us-west-2
#   S3_PUBLISH_CLOUDFRONT_DOMAIN  variable  domain fronting that bucket, used
#                                           to verify the upload is actually
#                                           reachable (e.g. d1veq6e8nuk2fy.cloudfront.net)
#
# The role's permission policy needs nvke-packages/nvkectl/* -- see
# artifacts.md section 19 for the exact IAM diff. Until that widening lands,
# this workflow will fail at the upload step with an access-denied error, not
# silently do nothing.
#
# A bare vX.Y.Z-beta.N tag publishes to nvkectl/releases/<describe>/ from the
# `s3-publish-non-prod` environment, which must define the same S3_PUBLISH_*
# variables. <describe> is the cli/v* describe version that release.yml stamps
# into nvkectl.

# Called by release.yml after its build, so a cli/v* tag produces one set of
# binaries rather than four independent ones, and this runs behind the licence
# gate release.yml already enforces. The tag trigger is gone for that reason.
#
# workflow_dispatch still works and still builds: dist_artifact is empty there,
# so the build step below runs instead of the download.
on:
  workflow_call:
    inputs:
      dist_artifact:
        description: Artifact holding the binaries release.yml built. Empty means build here.
        type: string
        required: false
        default: ""
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: CLI S3 Publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository_id == '1323115536' &&
      (startsWith(github.ref, 'refs/tags/cli/v') ||
       (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')))
    name: Publish to S3
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/cli/v') && 's3-publish' || 's3-publish-non-prod' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read  # upload-sarif reads the workflow run
      security-events: write  # the malware scan uploads SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A beta release is named by `git describe`, which needs the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Resolve release
        id: meta
        shell: bash
        env:
          S3_URI: ${{ vars.S3_PUBLISH_S3_URI }}
          ROLE_ARN: ${{ vars.S3_PUBLISH_AWS_ROLE_ARN }}
          REGION: ${{ vars.S3_PUBLISH_AWS_REGION }}
          CF_DOMAIN: ${{ vars.S3_PUBLISH_CLOUDFRONT_DOMAIN }}
          ENV_NAME: ${{ startsWith(github.ref, 'refs/tags/cli/v') && 's3-publish' || 's3-publish-non-prod' }}
        run: |
          set -euo pipefail
          if [[ -z "${S3_URI}" ]]; then
            echo "::error::S3_PUBLISH_S3_URI is not set in the ${ENV_NAME} environment"
            exit 1
          fi
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "::error::S3_PUBLISH_AWS_ROLE_ARN is not set in the ${ENV_NAME} environment"
            exit 1
          fi
          if [[ -z "${CF_DOMAIN}" ]]; then
            echo "::error::S3_PUBLISH_CLOUDFRONT_DOMAIN is not set in the ${ENV_NAME} environment"
            exit 1
          fi

          # The job-level if admits only cli/v* and bare vX.Y.Z-beta.N tags. A
          # beta publishes from the non-prod environment under the cli/v* describe
          # version, the same one release.yml stamps into nvkectl.
          if [[ "${GITHUB_REF_NAME}" == cli/v* ]]; then
            release="${GITHUB_REF_NAME#cli/}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            release="$(git describe --match 'cli/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
            release="${release#cli/}"
          else
            echo "::error::${GITHUB_REF_NAME} is neither cli/vX.Y.Z nor vX.Y.Z-beta.N"
            exit 1
          fi

          {
            echo "s3_uri=${S3_URI}"
            echo "role_arn=${ROLE_ARN}"
            echo "region=${REGION:-us-west-2}"
            echo "release=${release}"
            echo "cf_domain=${CF_DOMAIN}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing nvkectl release ${release} to ${S3_URI}"

      # One build per release. release.yml builds and checksums; this consumes
      # exactly those bytes, so checksums.txt describes what ships here too.
      - name: Download the release build
        if: inputs.dist_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.dist_artifact }}
          path: dist

      - name: Build binaries
        if: inputs.dist_artifact == ''
        run: make -C cli build-cross DIST="${GITHUB_WORKSPACE}/dist"

      - name: Malware scan
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'dist'
          category: 'clamav-cli-s3'
          output_file: 'clamav-cli-s3.sarif'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.meta.outputs.role_arn }}
          aws-region: ${{ steps.meta.outputs.region }}

      - name: Upload to S3
        shell: bash
        env:
          S3_URI: ${{ steps.meta.outputs.s3_uri }}
          RELEASE: ${{ steps.meta.outputs.release }}
        run: |
          set -euo pipefail
          # Both binary names are published for one release, so the download
          # links and scripts that know the old name keep working.
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            for bin in "nvkectl-${platform}" "nkectl-${platform}"; do
              S3_PREFIX="nvkectl/releases/${RELEASE}/${platform}" \
                ./scripts/upload-s3-flat.sh "dist/${bin}"
            done
          done

      - name: Verify upload
        shell: bash
        env:
          CF_DOMAIN: ${{ steps.meta.outputs.cf_domain }}
          S3_URI: ${{ steps.meta.outputs.s3_uri }}
          RELEASE: ${{ steps.meta.outputs.release }}
        run: |
          set -euo pipefail
          # head-object, not curl on the CloudFront URL: that domain sits
          # behind a WAF IP allowlist that GitHub-hosted runners are never
          # on (confirmed live -- a real upload 403's from here every time),
          # so an HTTP check can never pass from CI. head-object uses this
          # job's own IAM role instead, so it verifies the same fact --
          # the object is really there -- without needing network access
          # to the CDN itself.
          bucket="${S3_URI#s3://}"
          bucket="${bucket%%/*}"
          s3_path="${S3_URI#s3://*/}"
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            for bin in "nvkectl-${platform}" "nkectl-${platform}"; do
              key="${s3_path}/nvkectl/releases/${RELEASE}/${platform}/${bin}"
              aws s3api head-object --bucket "${bucket}" --key "${key}" >/dev/null
              url="https://${CF_DOMAIN}/${key}"
              echo "OK s3://${bucket}/${key} (${url})"
            done
          done
