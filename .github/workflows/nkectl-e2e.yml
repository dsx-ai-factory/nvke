#
# nkectl's own e2e lane, separate from Controller Unit Tests' `cli` matrix
# entry: `make -C cli test` is `go test ./...`, this is `make -C cli
# test-e2e`, a self-contained integration run driven by cli/e2e/run.sh.
#
# Unlike controller/test/e2e (excluded from the pull-request lane in
# controller-test.yml because it needs a live cluster in KUBECONFIG), this
# suite stands up everything it needs itself -- currently nothing beyond the
# nkectl binary, growing to a Kind cluster and fake node containers as
# `nkectl bootstrap site` gains real stages. ubuntu-latest ships Docker, so no
# self-hosted runner is needed for that either.
#
# Required from the start (wired into merge-gate.yml's `gate`), deliberately:
# cli/e2e/run.sh's stages are added one at a time alongside the bootstrap-site
# code they exercise, so the job is expected to stay green throughout rather
# than going red until some later change makes it pass.
name: nkectl e2e

# See go-build.yml for why the push path list is duplicated by hand instead of
# shared with workflow_call, and why workflow_call carries no filter.
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/nkectl-e2e.yml'
  workflow_call:
  workflow_dispatch: {}

permissions: {}

concurrency:
  # See go-build.yml for why the sha is only in the group on main, and why the
  # group name is a literal rather than ${{ github.workflow }}.
  group: nkectl e2e-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Run nkectl e2e
        working-directory: cli
        run: make test-e2e
