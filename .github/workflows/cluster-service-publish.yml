name: Cluster Service Publish

# Component onboarding to the existing NVCR environment and digest inventory.
# No PR or mirror-branch event can publish. All three images and the chart come
# from this run; the chart is released only after image promotion and SBOMs.
on:
  push:
    branches: [main]
    paths:
      - 'management-engine/**'
      - 'controller/api/**'
      - 'make/tool-versions.mk'
      - 'release/hack/describe-version.sh'
      - '.github/actions/record-digest/**'
      - '.github/actions/verify-attestation/**'
      - '.github/workflows/cluster-service-publish.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch: {}

permissions: {}
env:
  ARTIFACT_DIR: dist/cluster-service-artifacts

concurrency:
  group: Cluster Service Publish-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_id == '1323115536' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    name: Build (${{ matrix.runtime }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
          - arch: arm64
            runner: linux-arm64-cpu16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate publication ref
        run: management-engine/hack/publish.sh version
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - name: Build and push by digest
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
          ARCH: ${{ matrix.arch }}
        run: make -C management-engine release-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-service-${{ matrix.runtime }}-digest-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DIR }}/${{ matrix.runtime }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  index:
    name: Attest index (${{ matrix.runtime }})
    needs: [build]
    runs-on: linux-amd64-cpu8
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}
      - uses: ./.github/actions/setup-crane
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cluster-service-${{ matrix.runtime }}-digest-*
          merge-multiple: true
          path: ${{ env.ARTIFACT_DIR }}
      - name: Assemble both architectures
        id: index
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
        run: management-engine/hack/publish.sh index
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: false
      - name: Publish the version only after attestation
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
        run: management-engine/hack/publish.sh tag
      - uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.index.outputs.image }}:${{ steps.index.outputs.version }}
          component: cluster-service-${{ matrix.runtime }}-nvke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-service-nvke-receipt-${{ matrix.runtime }}
          path: ${{ env.ARTIFACT_DIR }}/${{ matrix.runtime }}.json
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: SBOM (${{ matrix.runtime }}, ${{ matrix.arch }})
    needs: [build]
    runs-on: linux-amd64-cpu8
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-service-${{ matrix.runtime }}-digest-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Resolve scan inputs
        id: scan
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          digest=$(cat "${ARTIFACT_DIR}/${RUNTIME}-${ARCH}.txt")
          echo "image=nvcr.io/${NVKE_NGC_ORG}/cluster-service-${RUNTIME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "syft=$(make --no-print-directory print-SYFT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.scan.outputs.image }}
          format: spdx-json
          syft-version: ${{ steps.scan.outputs.syft }}
          artifact-name: cluster-service-${{ matrix.runtime }}-${{ matrix.arch }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

  promote-dsx:
    name: Promote to DSX (${{ matrix.runtime }})
    if: github.repository_id == '1323115536' && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.'))
    needs: [index, sbom]
    runs-on: linux-amd64-cpu8
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - uses: ./.github/actions/setup-crane
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-service-nvke-receipt-${{ matrix.runtime }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Read the candidate digest
        id: candidate
        run: echo "digest=$(jq -er '.digest' "${ARTIFACT_DIR}/${RUNTIME}.json")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/verify-attestation
        with:
          image: nvcr.io/${{ vars.NVKE_NGC_ORG }}/cluster-service-${{ matrix.runtime }}
          digest: ${{ steps.candidate.outputs.digest }}
          signer-workflow: ${{ github.repository }}/.github/workflows/cluster-service-publish.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the verified index without rebuilding
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
          DSX_NGC_ORG_TEAM: ${{ vars.DSX_NGC_ORG_TEAM }}
          DSX_NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_DSX }}
        run: management-engine/hack/publish.sh promote
      - uses: ./.github/actions/record-digest
        with:
          references: nvcr.io/${{ vars.DSX_NGC_ORG_TEAM }}/cluster-service-${{ matrix.runtime }}@${{ steps.candidate.outputs.digest }}
          component: cluster-service-${{ matrix.runtime }}-dsx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-service-dsx-receipt-${{ matrix.runtime }}
          path: ${{ env.ARTIFACT_DIR }}/${{ matrix.runtime }}.json
          if-no-files-found: error
          retention-days: 90

  chart:
    name: Publish chart (${{ matrix.destination }})
    needs: [index, sbom, promote-dsx]
    # Betas publish only to NVKE, matching the existing NVCR publishers.
    if: ${{ !cancelled() && needs.index.result == 'success' && needs.sbom.result == 'success' && (needs.promote-dsx.result == 'success' || (needs.promote-dsx.result == 'skipped' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.'))) }}
    runs-on: ubuntu-latest
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.') && '["nvke"]' || '["nvke","dsx"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve package inputs
        id: package
        env:
          ORG_TEAM: ${{ vars[matrix.destination == 'dsx' && 'DSX_NGC_ORG_TEAM' || 'NVKE_NGC_ORG'] }}
        run: |
          set -euo pipefail
          test -n "$ORG_TEAM"
          version=$(management-engine/hack/publish.sh version)
          {
            echo "version=${version}"
            echo "chart_version=${version#v}"
            echo "repository=nvcr.io/${ORG_TEAM}"
            echo "helm=$(make --no-print-directory print-HELM_VERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ steps.package.outputs.helm }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cluster-service-${{ matrix.destination }}-receipt-*
          merge-multiple: true
          path: ${{ env.ARTIFACT_DIR }}
      - name: Package chart for NVCR
        id: chart
        shell: bash
        env:
          CHART: management-engine/chart
          APP_VERSION: ${{ steps.package.outputs.version }}
          CHART_VERSION: ${{ steps.package.outputs.chart_version }}
          REPOSITORY: ${{ steps.package.outputs.repository }}
          IMAGE_PULL_SECRET: ${{ matrix.destination == 'dsx' && 'ngc-dsx-registry-creds' || 'svc-nke-ngc-imagepull' }}
        run: |
          set -euo pipefail
          for pair in manager:manager tenantAPI:tenant-api operatorAPI:operator-api; do
            key=${pair%:*}
            runtime=${pair#*:}
            image="${REPOSITORY}/cluster-service-${runtime}"
            receipt="${ARTIFACT_DIR}/${runtime}.json"
            jq -e --arg revision "$GITHUB_SHA" --arg version "$APP_VERSION" --arg image "$image" '
              .revision == $revision and .version == $version and .image == $image and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.architectures | sort) == ["amd64", "arm64"]' "$receipt" >/dev/null
            digest=$(jq -er '.digest' "$receipt")
            sed -i "/^${key}:/,/^[^ ]/ { s#^    repository: .*#    repository: ${image}@${digest}#; s#^    tag: .*#    tag: \"\"#; }" "$CHART/values.yaml"
            sed -i "/^${key}:/a\\  imagePullSecrets:\\n  - name: ${IMAGE_PULL_SECRET}" "$CHART/values.yaml"
          done
          helm dependency build "$CHART" --skip-refresh
          inputs=(--set manager.nvkeController.endpoint=https://backend.example.invalid --set manager.infrastructureTemplateConfigMap=templates --set metrics.enabled=false)
          helm lint "$CHART" "${inputs[@]}"
          helm package "$CHART" --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination "$RUNNER_TEMP"
          package="$RUNNER_TEMP/cluster-service-${CHART_VERSION}.tgz"
          helm template cluster-service "$package" "${inputs[@]}" --namespace cluster-service-system --set tenantAPI.enabled=true --set tenantAPI.namespace=tenant-example --set operatorAPI.enabled=true > "$RUNNER_TEMP/rendered.yaml"
          for runtime in manager tenant-api operator-api; do
            image=$(jq -er '.image + "@" + .digest' "${ARTIFACT_DIR}/${runtime}.json")
            grep -Fq "image: \"${image}\"" "$RUNNER_TEMP/rendered.yaml" || { echo "::error::chart does not reference $image"; exit 1; }
          done
          echo "chart_package=$package" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets[matrix.destination == 'dsx' && 'NGC_REGISTRY_TOKEN_DSX' || 'NGC_REGISTRY_TOKEN_NVKE'] }}
      - name: Log Helm into the same destination
        env:
          NGC_TOKEN: ${{ secrets[matrix.destination == 'dsx' && 'NGC_REGISTRY_TOKEN_DSX' || 'NGC_REGISTRY_TOKEN_NVKE'] }}
        run: |
          # shellcheck disable=SC2016
          printf '%s' "$NGC_TOKEN" | helm registry login nvcr.io --username '$oauthtoken' --password-stdin
      - name: Push chart
        env:
          REPOSITORY: ${{ steps.package.outputs.repository }}
          CHART_PACKAGE: ${{ steps.chart.outputs.chart_package }}
        run: helm push "$CHART_PACKAGE" "oci://${REPOSITORY}"
      - uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.package.outputs.repository }}/cluster-service:${{ steps.package.outputs.chart_version }}
          component: cluster-service-chart-${{ matrix.destination }}
