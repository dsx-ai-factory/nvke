name: Cluster Service Publish

# Component onboarding to the existing NVCR environment and digest inventory.
# No PR or mirror-branch event can publish. All three images and the chart come
# from this run; the chart is released only after image promotion and SBOMs.
on:
  push:
    branches: [main]
    paths:
      - 'management-engine/**'
      - 'controller/api/**'
      - 'make/tool-versions.mk'
      - '.github/actions/record-digest/**'
      - '.github/actions/verify-attestation/**'
      - '.github/workflows/cluster-service-publish.yml'
    tags:
      - 'management-engine/v[0-9]*'
  workflow_dispatch: {}

permissions: {}
concurrency:
  group: Cluster Service Publish-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_id == '1323115536' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/management-engine/'))
    name: Build (${{ matrix.runtime }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
      NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
      ARTIFACT_DIR: ${{ github.workspace }}/dist/cluster-service-artifacts
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
          - arch: arm64
            runner: linux-arm64-cpu16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publication ref
        run: management-engine/hack/publish.sh version
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - name: Build and push by digest
        env:
          ARCH: ${{ matrix.arch }}
        run: make -C management-engine release-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-service-${{ matrix.runtime }}-digest-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DIR }}/${{ matrix.runtime }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  index:
    name: Attest index (${{ matrix.runtime }})
    needs: [build]
    runs-on: linux-amd64-cpu8
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
      NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
      ARTIFACT_DIR: ${{ github.workspace }}/dist/cluster-service-artifacts
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}
      - uses: ./.github/actions/setup-crane
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cluster-service-${{ matrix.runtime }}-digest-*
          merge-multiple: true
          path: ${{ env.ARTIFACT_DIR }}
      - name: Assemble both architectures
        id: index
        run: management-engine/hack/publish.sh index
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: false
      - name: Publish the version only after attestation
        run: management-engine/hack/publish.sh tag
      - uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.index.outputs.image }}:${{ steps.index.outputs.version }}
          component: cluster-service-${{ matrix.runtime }}-nvke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-service-nvke-receipt-${{ matrix.runtime }}
          path: ${{ env.ARTIFACT_DIR }}/${{ matrix.runtime }}.json
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: SBOM (${{ matrix.runtime }}, ${{ matrix.arch }})
    needs: [build]
    runs-on: linux-amd64-cpu8
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
      NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
      ARTIFACT_DIR: ${{ github.workspace }}/dist/cluster-service-artifacts
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-service-${{ matrix.runtime }}-digest-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Resolve scan inputs
        id: scan
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          digest=$(cat "${ARTIFACT_DIR}/${RUNTIME}-${ARCH}.txt")
          echo "image=nvcr.io/${NVKE_NGC_ORG}/cluster-service-${RUNTIME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "syft=$(make --no-print-directory print-SYFT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.scan.outputs.image }}
          format: spdx-json
          syft-version: ${{ steps.scan.outputs.syft }}
          artifact-name: cluster-service-${{ matrix.runtime }}-${{ matrix.arch }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

  promote-dsx:
    name: Promote to DSX (${{ matrix.runtime }})
    needs: [index, sbom]
    runs-on: linux-amd64-cpu8
    environment: nvcr
    env:
      RUNTIME: ${{ matrix.runtime }}
      NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
      ARTIFACT_DIR: ${{ github.workspace }}/dist/cluster-service-artifacts
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [manager, tenant-api, operator-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      - uses: ./.github/actions/setup-crane
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-service-nvke-receipt-${{ matrix.runtime }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Read the candidate digest
        id: candidate
        run: echo "digest=$(jq -er '.digest' "${ARTIFACT_DIR}/${RUNTIME}.json")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/verify-attestation
        with:
          image: nvcr.io/${{ env.NVKE_NGC_ORG }}/cluster-service-${{ matrix.runtime }}
          digest: ${{ steps.candidate.outputs.digest }}
          signer-workflow: ${{ github.repository }}/.github/workflows/cluster-service-publish.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the verified index without rebuilding
        env:
          DSX_NGC_ORG_TEAM: ${{ vars.DSX_NGC_ORG_TEAM }}
          DSX_NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_DSX }}
        run: management-engine/hack/publish.sh promote
      - uses: ./.github/actions/record-digest
        with:
          references: nvcr.io/${{ vars.DSX_NGC_ORG_TEAM }}/cluster-service-${{ matrix.runtime }}@${{ steps.candidate.outputs.digest }}
          component: cluster-service-${{ matrix.runtime }}-dsx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-service-dsx-receipt-${{ matrix.runtime }}
          path: ${{ env.ARTIFACT_DIR }}/${{ matrix.runtime }}.json
          if-no-files-found: error
          retention-days: 90

  chart:
    name: Publish chart (${{ matrix.destination }})
    needs: [index, promote-dsx]
    runs-on: ubuntu-latest
    environment: nvcr
    env:
      NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
      ARTIFACT_DIR: ${{ github.workspace }}/dist/cluster-service-artifacts
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: nvke
            org: NVKE_NGC_ORG
            token: NGC_REGISTRY_TOKEN_NVKE
            pull-secret: svc-nke-ngc-imagepull
          - destination: dsx
            org: DSX_NGC_ORG_TEAM
            token: NGC_REGISTRY_TOKEN_DSX
            pull-secret: ngc-dsx-registry-creds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Resolve package inputs
        id: package
        env:
          ORG_TEAM: ${{ vars[matrix.org] }}
        run: |
          set -euo pipefail
          test -n "$ORG_TEAM"
          version=$(management-engine/hack/publish.sh version)
          {
            echo "version=${version}"
            echo "chart_version=${version#v}"
            echo "repository=nvcr.io/${ORG_TEAM}"
            echo "helm=$(make --no-print-directory print-HELM_VERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.package.outputs.helm }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cluster-service-${{ matrix.destination }}-receipt-*
          merge-multiple: true
          path: ${{ env.ARTIFACT_DIR }}
      - name: Stage the chart with matching digest-pinned images
        env:
          VERSION: ${{ steps.package.outputs.version }}
          IMAGE_REPOSITORY: ${{ steps.package.outputs.repository }}
          IMAGE_PULL_SECRET: ${{ matrix.pull-secret }}
          RECEIPTS: ${{ env.ARTIFACT_DIR }}
          OUTPUT: ${{ runner.temp }}/cluster-service-chart
          REVISION: ${{ github.sha }}
        run: make -C management-engine release-package
      - name: Lint, render and package
        env:
          CHART: ${{ runner.temp }}/cluster-service-chart
        run: |
          set -euo pipefail
          inputs=(--set manager.nvkeController.endpoint=https://backend.example.invalid --set manager.infrastructureTemplateConfigMap=templates)
          helm lint "$CHART" "${inputs[@]}"
          helm template cluster-service "$CHART" "${inputs[@]}" --namespace cluster-service-system --set metrics.enabled=false > "$RUNNER_TEMP/default.yaml"
          helm template cluster-service "$CHART" "${inputs[@]}" --namespace cluster-service-system --set metrics.enabled=false --set tenantAPI.enabled=true --set tenantAPI.namespace=tenant-example --set operatorAPI.enabled=true > "$RUNNER_TEMP/apis.yaml"
          helm package "$CHART" --destination "$RUNNER_TEMP"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets[matrix.token] }}
      - name: Log Helm into the same destination
        env:
          NGC_TOKEN: ${{ secrets[matrix.token] }}
        run: |
          # shellcheck disable=SC2016
          printf '%s' "$NGC_TOKEN" | helm registry login nvcr.io --username '$oauthtoken' --password-stdin
      - uses: ./.github/actions/setup-crane
      - name: Push the chart without replacing an existing version
        env:
          REPOSITORY: ${{ steps.package.outputs.repository }}
          VERSION: ${{ steps.package.outputs.chart_version }}
        run: |
          set -euo pipefail
          tags=$(crane ls "${REPOSITORY}/cluster-service")
          if grep -Fxq "$VERSION" <<< "$tags"; then
            mkdir -p "$RUNNER_TEMP/published"
            helm pull "oci://${REPOSITORY}/cluster-service" --version "$VERSION" --destination "$RUNNER_TEMP/published"
            go -C management-engine run ./hack/releasepackage -compare "$RUNNER_TEMP/cluster-service-${VERSION}.tgz" -other "$RUNNER_TEMP/published/cluster-service-${VERSION}.tgz"
          else
            helm push "$RUNNER_TEMP/cluster-service-${VERSION}.tgz" "oci://${REPOSITORY}"
          fi
      - uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.package.outputs.repository }}/cluster-service:${{ steps.package.outputs.chart_version }}
          component: cluster-service-chart-${{ matrix.destination }}
