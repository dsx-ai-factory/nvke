# Contributors and resolution
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "ffffff"
  description: This will not be worked on

# Pull request state (set by workflows)
- name: needs-ci-fix
  color: "e11d21"
  description: Indicates a PR with a failed check on its head commit; fix the red check and push a new head.
- name: needs-dco
  color: "e11d21"
  description: Indicates a PR with commits lacking a DCO sign-off; fix with git commit -s or a remediation commit.
- name: needs-ok-to-test
  color: "e11d21"
  description: Indicates a PR head that copy-pr-bot has not mirrored; a vetter must comment /ok to test <SHA>.
- name: needs-rebase
  color: "e11d21"
  description: Indicates a PR that no longer merges cleanly into main; rebase onto main and force-push.
- name: needs-signed-commits
  color: "e11d21"
  description: Indicates a PR with commits lacking a verified signature; sign them and force-push.
- name: needs-workflow-approval
  color: "e11d21"
  description: Indicates a PR whose workflows GitHub holds for approval; a maintainer clicks Approve and run.

# Dependabot
- name: dependencies
  color: "0366d6"
