#
# The repository's issue and pull request labels. workflows/label-sync.yml
# creates a label listed here that is missing, and updates the colour and
# description of one that differs. It never deletes or renames a label, so a
# label created in the GitHub UI and not listed here is left as it is.
#
# Change a label by changing this file. A description is at most 100
# characters; GitHub shows it when a reader hovers over the label.

# Kind
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: feature
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: question
  color: "d876e3"
  description: Further information is requested

# Triage state (docs/issue-triage.md)
- name: needs-triage
  color: "e11d21"
  description: Indicates an issue no maintainer has set a priority on yet. Nothing for the reporter to do.
- name: needs-info
  color: "e11d21"
  description: Indicates an issue that cannot be triaged until the reporter adds the detail asked for.

# Priority (docs/issue-triage.md)
- name: priority/P0
  color: "ad4c00"
  description: Data loss, an unusable cluster or node, a security problem, or no workaround. Fix within 30 days.
- name: priority/P1
  color: "663f0b"
  description: Significant impact with a workaround. Fix within 183 days.
- name: priority/P2
  color: "ddac19"
  description: Everything else. No fix commitment.

