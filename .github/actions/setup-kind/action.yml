#
# Installs kind and kubectl at pinned versions and verifies their sha256.
# Replaces helm/kind-action, whose curl runs without -f: an egress error page
# gets saved as the checksum file and the job dies before the suite starts.

name: Set up Kind and kubectl
description: Download kind and kubectl at pinned versions, verify sha256, add them to PATH

inputs:
  kind_version:
    description: kind release tag, for example v0.32.0
    required: true
  kubectl_version:
    description: kubectl release tag, for example v1.36.3
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KIND_VERSION: ${{ inputs.kind_version }}
        KUBECTL_VERSION: ${{ inputs.kubectl_version }}
      run: |
        set -euo pipefail
        arch=$(uname -m)
        case "${arch}" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
        bin="${RUNNER_TEMP}/kind-bin"
        mkdir -p "${bin}"
        cd "${bin}"
        # No --retry-delay: it replaces curl's exponential backoff with a flat
        # wait. See install-k8s-community.sh for what that cost.
        fetch() { curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 -o "$1" "$2"; }
        # Committed digests, not the .sha256 files beside each artifact: those
        # are served by the same host, so they share its compromise boundary.
        # make/tool-versions.mk owns the version and the digest together.
        case "${arch}" in
          amd64) kind_want="$(make -C "${GITHUB_WORKSPACE}" --no-print-directory print-KIND_SHA256_AMD64)"; kubectl_want="$(make -C "${GITHUB_WORKSPACE}" --no-print-directory print-KUBECTL_SHA256_AMD64)" ;;
          arm64) kind_want="$(make -C "${GITHUB_WORKSPACE}" --no-print-directory print-KIND_SHA256_ARM64)"; kubectl_want="$(make -C "${GITHUB_WORKSPACE}" --no-print-directory print-KUBECTL_SHA256_ARM64)" ;;
          *) echo "no committed kind/kubectl digest for ${arch}" >&2; exit 1 ;;
        esac
        fetch kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${arch}"
        echo "${kind_want}  kind" | sha256sum -c
        fetch kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${arch}/kubectl"
        echo "${kubectl_want}  kubectl" | sha256sum -c
        chmod +x kind kubectl
        echo "${bin}" >> "${GITHUB_PATH}"
