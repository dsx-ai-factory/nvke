#
# Avoid Ubuntu mirror availability in the required internal-config check.
# Use Debian's dynamically linked ripgrep with an independently pinned PCRE2,
# preserving the packages' copyright files. Run no maintainer scripts or sudo.
# Only the checker step receives the library path; other tools keep theirs.

name: Set up ripgrep
description: Verify and extract pinned ripgrep and PCRE2 packages for Linux amd64

outputs:
  library-path:
    description: PCRE2 directory to supply through LD_LIBRARY_PATH in the checker step
    value: ${{ steps.install.outputs.library-path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then
          echo "::error::setup-ripgrep has committed packages only for Linux amd64"
          exit 1
        fi
        pin() {
          local value
          value="$(env -u "$1" make -C "${GITHUB_WORKSPACE}" --no-print-directory "print-$1")"
          if [ -z "${value}" ]; then
            echo "::error::$1 resolved empty from make/tool-versions.mk" >&2
            return 1
          fi
          printf '%s\n' "${value}"
        }
        snapshot="$(pin RIPGREP_DEBIAN_SNAPSHOT)"
        version="$(pin RIPGREP_DEB_VERSION)"
        pcre2_version="$(pin PCRE2_DEB_VERSION)"
        prefix="$(mktemp -d "${RUNNER_TEMP}/ripgrep.XXXXXX")"
        base="https://snapshot.debian.org/archive/debian/${snapshot}/pool/main"

        curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 -o "${prefix}/rg.deb" \
          "${base}/r/rust-ripgrep/ripgrep_${version}_amd64.deb"
        echo "$(pin RIPGREP_SHA256_AMD64)  ${prefix}/rg.deb" | sha256sum -c -
        curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 -o "${prefix}/pcre2.deb" \
          "${base}/p/pcre2/libpcre2-8-0_${pcre2_version}_amd64.deb"
        echo "$(pin PCRE2_SHA256_AMD64)  ${prefix}/pcre2.deb" | sha256sum -c -
        dpkg-deb --extract "${prefix}/rg.deb" "${prefix}"
        dpkg-deb --extract "${prefix}/pcre2.deb" "${prefix}"
        rm "${prefix}/rg.deb" "${prefix}/pcre2.deb"
        library="${prefix}/usr/lib/x86_64-linux-gnu"

        # The Rust bindings report their build-time PCRE2 header version.
        # Ask the loaded library itself for its runtime version instead.
        # PCRE2_CONFIG_VERSION is 11 in the upstream pcre2.h API.
        python3 - "${library}/libpcre2-8.so.0" "${pcre2_version%%-*}" <<'PY'
        import ctypes
        import sys

        library = ctypes.CDLL(sys.argv[1])
        library.pcre2_config_8.argtypes = (ctypes.c_uint32, ctypes.c_void_p)
        library.pcre2_config_8.restype = ctypes.c_int
        version = ctypes.create_string_buffer(128)
        result = library.pcre2_config_8(11, version)
        actual = version.value.decode().partition(" ")[0]
        if result <= 0 or actual != sys.argv[2]:
            sys.exit(f"unexpected PCRE2 runtime version: {actual}")
        print(f"PCRE2 runtime: {actual}")
        PY
        printf 'ab\n' | LD_LIBRARY_PATH="${library}" "${prefix}/usr/bin/rg" --pcre2 --quiet '(?<=a)b'
        echo "${prefix}/usr/bin" >> "${GITHUB_PATH}"
        echo "library-path=${library}" >> "${GITHUB_OUTPUT}"
