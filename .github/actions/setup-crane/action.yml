#
# Installs crane at a pinned version and verifies its sha256. Downloads the
# released binary instead of `go install`ing the module: a pinned module
# version can go temporarily unresolvable through an internal Go proxy mirror
# even when the tag is real and the public proxy serves it fine -- that broke
# `promote-ghcr` and `promote-dsx` in image-nvcr.yml on 2026-09-11.

name: Set up crane
description: Download crane at a pinned version, verify sha256, add it to PATH

inputs:
  crane_version:
    description: >-
      go-containerregistry release tag, for example v0.21.9. Empty reads
      CRANE_VERSION from make/tool-versions.mk, which is where the pin lives.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        CRANE_VERSION: ${{ inputs.crane_version }}
      run: |
        set -euo pipefail
        # One definition, in make/tool-versions.mk, so a bump there reaches CI.
        #
        # env -u, not a plain call: this step exports CRANE_VERSION, and an
        # empty input exports it empty. tool-versions.mk assigns with ?=, which
        # make skips when the name is already set in the environment -- empty
        # counts as set. print-CRANE_VERSION then echoes nothing, the URL
        # becomes .../download/v/ and every fetch 404s.
        if [ -z "${CRANE_VERSION}" ]; then
          CRANE_VERSION="v$(env -u CRANE_VERSION make -C "${GITHUB_WORKSPACE}" --no-print-directory print-CRANE_VERSION)"
        fi
        # Fail on the pin, not six retries later on a 404.
        if [ "${CRANE_VERSION}" = "v" ]; then
          echo "::error::crane version resolved empty from make/tool-versions.mk"
          exit 1
        fi
        arch=$(uname -m)
        case "${arch}" in aarch64) arch=arm64 ;; esac
        os=$(uname -s)
        archive="go-containerregistry_${os}_${arch}.tar.gz"
        base="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}"
        bin="${RUNNER_TEMP}/crane-bin"
        mkdir -p "${bin}"
        cd "${bin}"
        # No --retry-delay: it replaces curl's exponential backoff with a flat
        # wait. See install-k8s-community.sh for what that cost.
        fetch() { curl -fsSL --retry 8 --retry-all-errors --retry-max-time 240 -o "$1" "$2"; }
        fetch "${archive}" "${base}/${archive}"
        # A committed digest, not the release's own checksums.txt: that file is
        # served by the host that serves the artifact, so it shares the same
        # compromise boundary. make/tool-versions.mk owns both lines.
        case "${arch}" in
          x86_64) want="$(make -C "${GITHUB_WORKSPACE}" --no-print-directory print-CRANE_SHA256_AMD64)" ;;
          arm64)  want="$(make -C "${GITHUB_WORKSPACE}" --no-print-directory print-CRANE_SHA256_ARM64)" ;;
          *) echo "no committed crane digest for ${arch}" >&2; exit 1 ;;
        esac
        echo "${want}  ${archive}" | sha256sum -c
        tar -xzf "${archive}" crane
        chmod +x crane
        echo "${bin}" >> "${GITHUB_PATH}"
