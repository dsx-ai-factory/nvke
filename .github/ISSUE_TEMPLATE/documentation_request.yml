name: Documentation Request
description: Report a documentation issue or request new documentation
title: "[Docs]: "
labels: ["documentation", "needs-triage"]

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and found no duplicates
          required: true

  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - Correction or update to existing docs
        - New documentation needed
        - Documentation is unclear or incomplete
    validations:
      required: true

  - type: dropdown
    id: requester_impact
    attributes:
      label: Impact to you
      description: Choose the option closest to your situation. Maintainers assess priority during triage.
      options:
        - Prevents me from using the project
        - Significantly impairs my work
        - Causes confusion or extra work
        - Minor suggestion
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation link (if correcting existing docs)
      placeholder: "https://github.com/dsx-ai-factory/nvke/blob/main/docs/..."

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the documentation problem or what documentation is missing.
      placeholder: |
        For corrections: what is wrong and what should it say?
        For new docs: what topic needs to be documented and why?
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed change (optional)
      description: If you have a specific suggestion for the documentation change, describe it here.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's [Code of Conduct](https://github.com/dsx-ai-factory/nvke/blob/main/CODE_OF_CONDUCT.md)
          required: true
