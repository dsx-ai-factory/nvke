# The NICo API access CAPNICo reads. Rendered only when nvkectl passes nicoCredentials (the seed); a site creates this Secret itself.
{{- $c := index .Values "capnico" -}}
{{- $n := "" -}}
{{- if $c }}{{ $n = index $c "nicoCredentials" }}{{ end -}}
{{- if $n }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: nico-credentials
  namespace: capnico-system
stringData:
  endpoint: {{ index $n "endpoint" | quote }}
  orgID: {{ index $n "orgID" | quote }}
  token: {{ index $n "token" | quote }}
  apiName: {{ index $n "apiName" | quote }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nico-credentials-external
  namespace: capnico-system
data:
  note: created by the operator
{{- end }}
