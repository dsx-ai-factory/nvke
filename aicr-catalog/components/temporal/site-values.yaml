# Merged from deploy/nico/temporal/values.yaml and overlay.yaml (comments dropped; read those for the reasons).
fullnameOverride: temporal
server:
  configMapsToMount: sprig
  setConfigFilePath: true
  config:
    persistence:
      driver: sql
      default:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-postgresql.postgres.svc.cluster.local
          port: 5432
          database: temporal
          user: postgres
          maxConns: 10
          maxIdleConns: 5
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-postgresql.postgres.svc.cluster.local
          port: 5432
          database: temporal_visibility
          user: postgres
          maxConns: 10
          maxIdleConns: 5
  metrics:
    serviceMonitor:
      enabled: true
cassandra:
  enabled: false
mysql:
  enabled: false
postgresql:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
elasticsearch:
  enabled: false
schema:
  createDatabase:
    enabled: true
  setup:
    enabled: true
  update:
    enabled: true
