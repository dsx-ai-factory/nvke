# The login the controller renders into the user data of the nodes CAPNICo creates. Only with the NICo provider.
{{- $c := index .Values "nvke-seed-config" -}}
{{- $d := "" -}}
{{- if $c }}{{ $d = index $c "dgxcTenant" }}{{ end -}}
{{- if $d }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: dgxc-tenant-credentials
  namespace: nke-controller
stringData:
  user: {{ index $d "user" | quote }}
  password: {{ index $d "password" | quote }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dgxc-tenant-credentials-unused
  namespace: nke-controller
data:
  provider: provisioned
{{- end }}
