# Merged from deploy/nico/controller/values.yaml and overlay.yaml (comments dropped; read those for the reasons).
namespaceOverride: nke-controller
apiAuth:
  enabled: false
  permissive: false
supportedInfraProviders: nico,infra
capi:
  rbac:
    create: true
tenantAccess:
  enabled: true
nvkeOIDCAuth:
  enabled: false
  issuerURL: https://nke.site-controller.internal
  caBundleSecret:
    namespace: spire-server
    name: oidc-provider-upstream-ca
    key: ca.crt
cni:
  installAfterInit: true
env:
- name: NODE_AGENT_PORT
  value: '15005'
fullnameOverride: nke-controller
nameOverride: nke-controller
serviceAccount:
  name: nke-controller
nvkeSystemNamespace:
  create: false
image:
  repository: ghcr.io/dsx-ai-factory/nvke/nke-controller
  tag: v0.2.0-rc.2
  pullPolicy: IfNotPresent
imagePullSecrets: []
metrics:
  networkPolicy:
    enabled: true
    additionalNamespaces:
    - nktp
serviceMonitor:
  enabled: true
  name: nke-controller-metrics
tracing:
  enabled: true
  serviceName: nvke-controller
  endpoint: nktp-daemonset-collector.nktp.svc.cluster.local:4317
  insecure: true
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: nke-controller
  postgresUser: postgres
  sslMode: disable
service:
  port: 8080
  nodePort: 30080
secrets:
  dgxcTenantCredSecretName: dgxc-tenant-credentials
nodeAgent:
  spireAttestationMethod: tpm
temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233
  cloudWorkflow:
    namespace: nke-controller
    queue: nke-controller-tasks
profiles:
  path: /profiles
  image:
    enabled: true
spiffe:
  enabled: true
  endpointSocket: unix:///spiffe-workload-api/spire-agent.sock
  spire:
    serverNamespace: spire-server
    className: spire-mgmt-spire
    tpmPubhashesConfigMapName: tpm-pubhashes
    serverPort: '30440'
identity:
  fieldManagerName: nke-controller
  fieldManagerRebootMachineName: nke-controller-reboot-machine
  fieldManagerMachineHealthIssueName: nke-controller-machine-health-issue
  managedByLabelValue: nke-controller
teleport:
  managedByLabelValue: nke-controller
  tokenNamePrefix: nke-controller-
