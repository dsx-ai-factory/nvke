# The matrix a release can be qualified against: the streams that exist and
# the named selections over them that decide how much of the matrix a given
# run covers. What is qualified is in qualification.yaml, and how each
# component resolves to a version is in registry.yaml.
#
# The streams below are the ones that exist: the Forge lanes on GB200 and L40S
# capacity, the Forge perf lane on the NVKE Scale site's CPU machines, and the
# DSX lane on the DSX datahall's GPU trays.
# A policy naming capabilities no runner has produces plans that nothing can
# schedule, so a stream is added with the runner that backs it.

apiVersion: nvke.nvidia.com/v1alpha1
kind: QualificationPolicy
metadata:
  name: nvke
  description: The streams a release can be qualified against and the scopes over them.
spec:
  scopes:
    # Only Ubuntu 24.04 on GB200, on every arch and minor that has a stream for
    # it.
    golden-path:
      selector: {ubuntu: "24.04", gpu: gb200}
    # Ubuntu 24.04 on L40S. One stream, amd64, and the only GPU shape site-1
    # offers. The qualify-e2e-l40s label selects this instead of golden-path.
    l40s:
      selector: {ubuntu: "24.04", gpu: l40s}

    # The DSX datahall on its own. The dsx stream declares no gpu, so
    # golden-path does not reach it, even though the hardware is accelerator
    # hardware: the datahall advertises no GPU model, so a stream asking for
    # one resolves to nothing. A provider selector is the only one that
    # separates the two lanes, which is what this scope is for.
    dsx:
      selector: {provider: dsx}

    # One datahall each. `dsx` selects on provider alone, so it now fans out to
    # both DSX streams; these name one, which is what a run against a single
    # datahall wants -- bringing a new one up, or keeping a known-good lane off
    # hardware that is still being proven.
    dsx-amd64:
      selector: {provider: dsx, arch: amd64}
    dsx-arm64:
      selector: {provider: dsx, arch: arm64}

    # The performance stream on the NVKE Scale Forge site, on its own. Its
    # tenant has more workers than a qualification's and a run holds the site
    # for hours, so it is reached only by naming this scope.
    perf:
      selector: {profile: perf}

    # Every Forge stream. What the weekly run covers, and adding a Forge minor
    # is adding a stream rather than editing this.
    #
    # It selects on provider rather than carrying no selector, which is what it
    # used to do, because `full` also decides the stage: a dispatch defaults to
    # stage full, and a scope that matched every stream put a lane into every
    # weekly run that could only fail, whatever the versions under test.
    #
    # So this is not "every stream" but "every stream a full run can finish".
    # A DSX tenant spec now exists --- nicoDSXTenant --- so the obstacle is no
    # longer that the suite cannot build one. It is that no DSX tenant has yet
    # reached provisioned on the lane: every run so far has stalled in
    # NodePreflight, the node healthy and its agent reachable, with cloud-init
    # reporting a runcmd that failed. Taking the selector off before that is
    # green would put a known-red lane into every weekly run, which is the
    # thing this selector exists to prevent. It comes off when the lane
    # finishes a tenant, not when the spec exists.
    #
    # The perf stream is a Forge stream too and is left out, so the weekly run
    # does not hold the NVKE Scale site. The perf scope selects it.
    full:
      selector: {provider: forge}
      exclude: {profile: perf}

  # A stream names capabilities, not the infrastructure that satisfies them.
  # Which runner label, site, or subnet a capability resolves to is an
  # environment knob and belongs to the e2e suite's own config, so that the
  # suite stays runnable by hand and by a second organisation.
  #
  # `arch` is the architecture of the site and control-plane node. GPU workers
  # can differ, and the GPU model decides theirs, so `arch` does not say which
  # node images a run needs.
  #
  # A stream is named <provider>-<gpu>-<arch>-ubuntu-<series>-kube-<minor>, so
  # two streams that differ only in GPU model do not share a name. A stream
  # that declares no gpu omits that segment rather than inventing a value for
  # it --- the DSX lane below is named dsx-amd64-..., and a `none` there would
  # read as a capability no stream selects on. A stream that declares a
  # machineType takes that segment in the gpu's place, because the machine type
  # is a capability the stream selects machines by: the perf stream below is
  # named forge-cpu-amd64-... A stream with a profile ends its name with it.
  # The name is the key of everything recorded for a stream.
  #
  # `parameters` are the settings of a stream's run: the environment file it
  # runs against, the workers its tenant gets and the suite's timeout. They
  # configure the run and nothing selects on them, which is why they are not
  # capabilities. Only the fields declared in Parameters are accepted, and a
  # stream that names none runs as the others do.
  streams:
    - name: forge-gb200-amd64-ubuntu-24.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: amd64, ubuntu: "24.04", kube: "1.36"}
    - name: forge-gb200-arm64-ubuntu-24.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: arm64, ubuntu: "24.04", kube: "1.36"}
    - name: forge-gb200-amd64-ubuntu-26.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: amd64, ubuntu: "26.04", kube: "1.36"}
    - name: forge-gb200-arm64-ubuntu-26.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: arm64, ubuntu: "26.04", kube: "1.36"}
    - name: forge-l40s-amd64-ubuntu-24.04-kube-1.36
      capabilities: {provider: forge, gpu: l40s, arch: amd64, ubuntu: "24.04", kube: "1.36"}
    - name: forge-l40s-amd64-ubuntu-26.04-kube-1.36
      capabilities: {provider: forge, gpu: l40s, arch: amd64, ubuntu: "26.04", kube: "1.36"}

    # The NVKE Scale Forge site, which sits in another org and offers CPU
    # machines only: the site node, the control plane and the workers all land
    # on its high memory CPU type. The tenant has three workers, and the suite
    # may run for 215 minutes, which the timeouts around it are derived from.
    - name: forge-cpu-amd64-ubuntu-24.04-kube-1.36-perf
      capabilities: {provider: forge, machineType: cpu, arch: amd64, ubuntu: "24.04", kube: "1.36", profile: perf}
      parameters: {environment: forge-perf, tenantWorkers: 3, suiteTimeoutMinutes: 215}

    # The DSX datahall, which is amd64 throughout. No gpu: the datahall
    # declares no GPU model, so a stream asking for an accelerator here
    # resolves to nothing even though the trays are GPU hardware.
    #
    # amd64 because that is what the hardware is, not a choice --- every
    # machine the datahall owns is a Lenovo SR675 V3 OVX, AMD EPYC carrying
    # eight L40S. The arm64 stream below is that second site and second
    # stream: a different datahall, with its own ids and its own API host.
    #
    # kube 1.36 matches the Forge streams. The recorded DSX exercise reached
    # CoreDNS on a 1.34.2 tenant, so 1.36 is unproven on this substrate.
    - name: dsx-amd64-ubuntu-24.04-kube-1.36
      capabilities: {provider: dsx, arch: amd64, ubuntu: "24.04", kube: "1.36"}

    # The second DSX datahall, arm64 because every machine it owns is a Vera
    # Rubin NVL72 tray on an Olympus CPU. No gpu for the same reason as above:
    # the datahall declares no GPU model, so a stream asking for an accelerator
    # resolves to nothing here even though the trays are accelerator hardware.
    #
    # 26.04 where the datahall above is 24.04, so the two DSX streams differ in
    # series as well as arch. The image is there: os-image-artifact builds and
    # publishes 26.04 for both arches on every beta, under
    # nvke-packages/os-image/releases/<version>/<arch>/. Proven on 2026-11-02:
    # run 41481335380 took this stream through stage full --- site controller,
    # stack and a two-node tenant --- at 51 of 51 specs.
    - name: dsx-arm64-ubuntu-26.04-kube-1.36
      capabilities: {provider: dsx, arch: arm64, ubuntu: "26.04", kube: "1.36"}
