# Who is told about NVKE beta qualification, at which stage, and with what words.
# Changing any of that is an edit here and not to a workflow: a job only runs
# `notify trigger <event>`. `notify validate` checks this file and lists the
# --data keys each notification reads.
#
# Template values:
#   .Context.*  the run, from a fixed allowlist of GITHUB_* values
#               (internal/notify/githubctx): repository, workflow, run_id,
#               run_number, run_attempt, ref_name, ref_type, sha, sha_short,
#               actor, event_name, server_url, job, run_url, commit_url
#   .Event.*    what the job passed with --data
# A template names one key at a time; {{.}}, {{$}} and .Context or .Event on their
# own are rejected, because they would print every value.
# Every value is escaped for Slack before it is rendered, so a branch name or an
# error line cannot become a mention or a link. Link as <{{.Context.run_url}}|text>.
#
# commit_url and sha_short describe the commit the workflow ran on. The tag cut
# does not: the nightly tags a commit it selected, which need not be the one it
# ran on, so tag-cut links the commit it is passed.
#
# A thread starts with the first message of a conversation. The conversation is
# the beta tag for a tag run, so the tag cut and the qualification it starts
# share one thread; any other run has a thread of its own.

subscribers:
  - id: nvke-qualification-pipeline
    name: "#nvke-qualification-pipeline"
    channels:
      slack:
        # By ID, which survives a rename.
        channel_id: "C0CF37FNXV1"

notifications:
  - name: tag-cut
    title: "🏷️ NVKE beta {{.Event.tag}} cut"
    severity: info
    message_template: |
      Tagged commit <{{.Context.server_url}}/{{.Context.repository}}/commit/{{.Event.commit}}|{{.Event.commit_short}}> · <{{.Context.run_url}}|nightly run #{{.Context.run_number}}>

  - name: qualification-started
    title: "🚀 NVKE qualification started: {{.Context.ref_name}}"
    severity: info
    message_template: |
      <{{.Context.run_url}}|Run #{{.Context.run_number}}> started by {{.Context.event_name}} ({{.Context.actor}}) · commit <{{.Context.commit_url}}|{{.Context.sha_short}}>

  - name: plan-resolved
    title: "📋 Plan resolved"
    severity: info
    message_template: |
      NVKE version *{{.Event.nvke_version}}* · scope *{{.Event.scope}}* · {{.Event.stream_count}} stream(s) · resolved by *{{.Event.resolution}}* · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

  # Only fires for a run that waits on a reviewer. A beta tag qualifies
  # unattended in forge-nightly and never reaches this.
  - name: awaiting-approval
    title: "⏳ Waiting for approval"
    severity: warning
    message_template: |
      A reviewer has to approve the `forge` environment before any stream starts · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

  - name: artifacts-ready
    title: "📦 Artifacts ready"
    severity: info
    message_template: |
      Every artifact the plan names is published · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

  - name: artifacts-timeout
    title: "⌛ Artifacts missing"
    severity: error
    message_template: |
      Gave up waiting for `{{.Event.artifact}}`. No machine was taken · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

  - name: stream-started
    title: "▶️ Stream started"
    severity: info
    message_template: |
      Stream *{{.Event.stream}}* · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

  - name: stream-passed
    title: "✅ Stream passed"
    severity: success
    message_template: |
      Stream *{{.Event.stream}}* passed · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

  - name: stream-failed
    title: "❌ Stream failed"
    severity: error
    message_template: |
      Stream *{{.Event.stream}}* failed at stage `{{.Event.stage}}` · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

  - name: completed
    title: "🏁 Qualification {{.Event.verdict}}"
    severity: info
    message_template: |
      {{.Event.summary}} · <{{.Context.run_url}}|Run #{{.Context.run_number}}>

subscriptions:
  # Progress and results. No mention.
  - subscriber: nvke-qualification-pipeline
    events:
      - name: "qualification:tag-cut"
        notification: tag-cut
      - name: "qualification:started"
        notification: qualification-started
      - name: "qualification:plan-resolved"
        notification: plan-resolved
      - name: "qualification:awaiting-approval"
        notification: awaiting-approval
      - name: "qualification:artifacts-ready"
        notification: artifacts-ready
      - name: "qualification:stream-started"
        notification: stream-started
      - name: "qualification:stream-passed"
        notification: stream-passed
      - name: "qualification:completed"
        notification: completed

  # Failures. Add an on-call group here to page it, as
  #   additional_mentions: ["<!subteam^S0123456789|@group-name>"]
  # which pings on these two events only.
  - subscriber: nvke-qualification-pipeline
    events:
      - name: "qualification:artifacts-timeout"
        notification: artifacts-timeout
      - name: "qualification:stream-failed"
        notification: stream-failed
