# How each component resolves to a version. This file holds the rule that
# finds a version and never a version itself, so nothing here goes stale when
# something is tagged or bumped.
#
# A component's name is also its key in the e2e suite's -e2e.versions flag, so
# the plan can hand the suite what it resolved without a mapping in between.
#
# tagPrefix is explicit because a name and its tag genuinely disagree:
# capi-provisioned is tagged cluster-api-provider-provisioned/v*, and nvke
# carries no prefix because its directory is the repository root.

apiVersion: nvke.nvidia.com/v1alpha1
kind: QualificationRegistry
metadata:
  name: nvke
  description: How each component resolves to a version.
spec:
  # Where artifacts are published. A component names a source in its resolve.with,
  # so the location is stated once and appears in no other file.
  sources:
    - {name: artifact-cdn, base: https://d1veq6e8nuk2fy.cloudfront.net}
    # Where the images are pulled from. It holds every build, so a commit
    # between releases has something to pull. The org names one organization's
    # registry rather than anything about NVKE, so a run supplies it and an
    # unset variable fails here rather than against the registry later.
    - {name: artifact-registry, base: "oci://nvcr.io/${QUALIFY_E2E_NGC_ORG}"}

  # gitTagOrCommitDescribe resolves from the tags under the prefix, or describes a named
  # commit when a run names one. A commit between releases carries no tag, so the
  # tags would answer with the newest release rather than what was built there.
  #
  # repository is the component's name under the artifact-registry source, and is
  # given only for the ones published there. os-image is reached through
  # os-image-amd64 and os-image-arm64 below, which build CDN URLs instead.
  components:
    # The subject stays gitTag. Its version is what the run is called and what a
    # qualification is recorded against, so it is a release that was cut and
    # never a description of a commit. The components are what a run resolves at
    # a commit; the thing being qualified is still a version.
    - {name: nvke,     resolve: {strategy: gitTag, with: {tagPrefix: ""}}}
    - {name: os-image, resolve: {strategy: gitTagOrCommitDescribe, with: {tagPrefix: "os-image/"}}}
    - name: controller
      resolve:
        strategy: gitTagOrCommitDescribe
        with: {tagPrefix: "controller/", source: artifact-registry, repository: nvke-controller}
    # No repository, although nvkectl is published to the same registry. Its
    # artifact is tagged per platform from the aliases, "sha-<commit>-linux-amd64"
    # and not the version, so the version does not name it and a url built from
    # one would point at nothing.
    - name: cli
      resolve:
        strategy: gitTagOrCommitDescribe
        with: {tagPrefix: "cli/"}
    - name: capi-provisioned
      resolve:
        strategy: gitTagOrCommitDescribe
        with:
          tagPrefix: "cluster-api-provider-provisioned/"
          source: artifact-registry
          repository: cluster-api-provider-provisioned

    # A run needs the image and its bootloader for every architecture, whatever
    # the stream's own. Each is named by the key the e2e suite reads and resolves
    # to a URL. The image is built from the os-image release, and the bootloader
    # is declared because nothing derives it.
    - name: os-image-amd64
      resolve:
        strategy: osImage
        with: {from: os-image, arch: amd64, variant: non-fde, source: artifact-cdn, path: nvke-packages}
    - name: os-image-arm64
      resolve:
        strategy: osImage
        with: {from: os-image, arch: arm64, variant: non-fde, source: artifact-cdn, path: nvke-packages}
    - {name: os-image-bootloader-amd64, resolve: {strategy: url, with: {source: artifact-cdn}}}
    - {name: os-image-bootloader-arm64, resolve: {strategy: url, with: {source: artifact-cdn}}}

    # What an image carries is read from the lock files its release commits, at
    # the os-image tag the combination resolved. A node installs these from the
    # image's own apt repository, so the lock files are the versions it can
    # offer.
    - name: kube
      resolve:
        strategy: lockedPackage
        with: {lockDir: os-image/packages/kubeadm-distro/lock, from: os-image}
    - name: cni-ovn
      resolve:
        strategy: lockedPackage
        with: {lockDir: os-image/packages/cni-ovn/lock, from: os-image}

    # Read from make/tool-versions.mk, which owns every tool pin.
    - {name: kind,             resolve: {strategy: makeVar, with: {var: KIND_VERSION}}}
    - {name: clusterctl,       resolve: {strategy: makeVar, with: {var: CAPI_VERSION}}}
    - {name: nerdctl,          resolve: {strategy: makeVar, with: {var: NERDCTL_VERSION}}}
