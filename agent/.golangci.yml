version: "2"

run:
  concurrency: 8
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - decorder
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - exhaustive
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosmopolitan
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - loggercheck
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - nonamedreturns
    - predeclared
    - promlinter
    - reassign
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testableexamples
    - unconvert
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
    - zerologlint
  disable:
    - exhaustruct
    - godox
    - nlreturn
    - noctx       # TODO: fix and re-enable - requires adding context to exec.Command and net.Dial calls
    - perfsprint  # TODO: fix and re-enable - string concatenation in loops
    - revive      # TODO: fix and re-enable - various style issues (naming, unused params, etc.)
    - testpackage
    - wrapcheck
    # TODO: fix and re-enable the following linters
    # Tracked in https://github.com/dsx-ai-factory/nvke/issues/938
    - contextcheck   # 20 issues - context propagation
    - dupl           # 3 issues - 6 near-identical funcs in internal/k8s/cmds.go; wants a real refactor, not a near-free fix
    - errorlint      # 34 issues - error wrapping
    - gocritic       # 73 issues - various code style
    - godot          # 45 issues - comment punctuation
    - gosec          # 18 issues - security issues
    - govet          # 41 issues - mostly shadow declarations
    - grouper        # 18 issues - declaration grouping
    - musttag        # 1 issue - struct tag requirements
    - protogetter    # 124 issues - proto field access
    - staticcheck    # 16 issues - deprecated proto fields + style; QF1001/QF1003/QF1007 already clean (no findings)
    - tagliatelle    # 5 issues - would change public JSON field names
    - unparam        # 12 issues - unused parameters
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/pkg/errors
              desc: use stdlib instead
    dupl:
      threshold: 100
    funlen:
      lines: 500
      statements: -1
      ignore-comments: true
    goconst:
      min-len: 2
    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G115
    staticcheck:
      checks:
        - "all"
    govet:
      disable:
        - fieldalignment
      enable-all: true
    grouper:
      const-require-grouping: true
      import-require-grouping: true
      var-require-single-var: true
      var-require-grouping: false
    misspell:
      locale: US
    tagalign:
      align: false
      sort: true
      order:
        - embed
        - help
        - name
        - prefix
        - envprefix
        - enum
        - env
        - default
      strict: true
    varnamelen:
      min-name-length: 1
    wsl:
      allow-assign-and-call: true
      allow-assign-and-anything: true
      allow-trailing-comment: false
      allow-cuddle-declarations: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - forcetypeassert
          - gochecknoglobals
          - goconst
          - gocritic
          - gosec
          - grouper
          - wrapcheck
          - wsl
        path: (.+)_test\.go
      - linters:
          - dupl
          - perfsprint
        path: testcases
      - linters:
          - staticcheck
        text: 'ST1003:'
    paths:
      - pkg/workflow/cluster
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  # TODO: fix and re-enable the remaining formatters
  # - gofmt     # 1 issue
  # - goimports # 4 issues
  # - gci       # 6 issues - import grouping
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
    gci:
      sections:
        - standard
        - dot
        - default
        - prefix(k8s.io,sigs.k8s.io)
        - prefix(github.com/NVIDIA/)
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/NVIDIA
        - github.com/dsx-ai-factory/nvke
        - github.com/dsx-ai-factory/nvke/agent
  exclusions:
    generated: lax
    paths:
      - pkg/workflow/cluster
      - third_party$
      - builtin$
      - examples$
