syntax = "proto3";

package proto;

option go_package = "github.com/dsx-ai-factory/nvke/agent/pkg/agent/proto";

service NodeAgent {
  rpc GetKubeadmStatus(KubeadmStatusRequest) returns (KubeadmStatusResponse) {}

  // InspectKubernetesCertificates reads the fixed kubeadm credential inventory.
  // It never mutates files or returns certificate/key contents or identities.
  rpc InspectKubernetesCertificates(InspectKubernetesCertificatesRequest) returns (InspectKubernetesCertificatesResponse) {}

  // ScheduleNodeReboot waits up to five minutes for apt/dpkg locks to clear,
  // then starts a detached reboot so the RPC can return before the node exits.
  rpc ScheduleNodeReboot(ScheduleNodeRebootRequest) returns (ScheduleNodeRebootResponse) {}

  // GetNodeBootInfo returns typed boot identity and timing information used by
  // callers to confirm that a requested reboot completed.
  rpc GetNodeBootInfo(GetNodeBootInfoRequest) returns (GetNodeBootInfoResponse) {}

  rpc ExecuteKubeadmInit(KubeadmInitRequest) returns (KubeadmInitStatusResponse) {}

  rpc ExecuteKubeadmJoin(KubeadmJoinRequest) returns (KubeadmJoinStatusResponse) {}

  rpc ExecuteKubeadmReset(KubeadmResetRequest) returns (KubeadmResetStatusResponse) {}

  // ReconfigureKubeletAPIServer updates the server endpoint in the local
  // kubelet.conf, restarts kubelet, and verifies the service is active. The
  // config update is atomic and convergent. If kubelet cannot be restarted
  // after a config change, the agent restores the original config and tries to
  // restore the service before returning a structured failure outcome.
  rpc ReconfigureKubeletAPIServer(ReconfigureKubeletAPIServerRequest) returns (ReconfigureKubeletAPIServerResponse) {}

  // ReconfigureSpireAgent points the node's SPIRE agent at a new SPIRE server.
  // It rewrites server_address and server_port in the agent config and in the
  // boot-time SPIRE environment file, restarts spire-agent, and waits until the
  // agent serves an X.509 SVID issued after the restart. The agent may exit
  // once while it re-attests to the new server; systemd restarts it. Repeating
  // the call with the same server is safe.
  rpc ReconfigureSpireAgent(ReconfigureSpireAgentRequest) returns (ReconfigureSpireAgentResponse) {}

  // GetSpireAgentStatus reports the SPIRE server the node's agent config points
  // at and whether the agent holds a valid X.509 SVID from that server.
  rpc GetSpireAgentStatus(GetSpireAgentStatusRequest) returns (GetSpireAgentStatusResponse) {}

  // StartOpenVSwitchReconciliation durably accepts an asynchronous host-network
  // reconciliation that moves the default-route interface's existing network
  // configuration onto an Open vSwitch bridge named br<interface>. The
  // operation_id is an idempotency key, so losing this RPC response while the
  // default route moves does not start duplicate work.
  rpc StartOpenVSwitchReconciliation(StartOpenVSwitchReconciliationRequest) returns (StartOpenVSwitchReconciliationResponse) {}

  // GetOpenVSwitchReconciliationStatus returns the persisted state of a
  // previously accepted Open vSwitch reconciliation.
  rpc GetOpenVSwitchReconciliationStatus(GetOpenVSwitchReconciliationStatusRequest) returns (GetOpenVSwitchReconciliationStatusResponse) {}

  // KubeadmUpgradeApply upgrades the Kubernetes control plane and its add-ons
  // to target_version. The request is accepted only on a control-plane node.
  // Retrying the same target is safe because kubeadm upgrade apply is
  // idempotent and is run again to finish any incomplete add-on convergence.
  rpc KubeadmUpgradeApply(KubeadmUpgradeApplyRequest) returns (KubeadmUpgradeApplyResponse) {}

  // ReconcileKubeVip atomically converges the kube-vip static-pod manifest for
  // NVKE's active/active BGP control-plane mode. The fixed mode disables every
  // Kubernetes API-backed kube-vip feature. For kube-vip v1.2.0 compatibility,
  // the pod receives a kubeconfig with no client credential; this RPC never
  // reads, creates, or mounts the host's admin.conf or super-admin.conf.
  rpc ReconcileKubeVip(ReconcileKubeVipRequest) returns (ReconcileKubeVipResponse) {}

  // StartKubernetesCertificateRenewal starts a V1 asynchronous control-plane
  // certificate renewal operation. The operation_id is an idempotency key.
  // Callers that require forced renewal or strict etcd membership validation
  // must use StartKubernetesCertificateRenewalV2.
  rpc StartKubernetesCertificateRenewal(StartKubernetesCertificateRenewalRequest) returns (StartKubernetesCertificateRenewalResponse) {}

  // StartKubernetesCertificateRenewalV2 starts an asynchronous control-plane
  // certificate renewal operation with forced-renewal and exact etcd-membership
  // semantics. Its distinct method name lets callers detect V1-only agents
  // before any renewal operation is accepted.
  rpc StartKubernetesCertificateRenewalV2(StartKubernetesCertificateRenewalV2Request) returns (StartKubernetesCertificateRenewalV2Response) {}

  // GetKubernetesCertificateRenewalStatus returns the current status for a
  // previously started certificate renewal operation.
  rpc GetKubernetesCertificateRenewalStatus(GetKubernetesCertificateRenewalStatusRequest) returns (GetKubernetesCertificateRenewalStatusResponse) {}

  // RemoveEtcdMember removes a remote member through the local kubeadm etcd
  // endpoint. It rejects removal of the local member, attempts to transfer
  // leadership to the local member before removing a leader, and treats an
  // absent target as success.
  rpc RemoveEtcdMember(RemoveEtcdMemberRequest) returns (RemoveEtcdMemberResponse) {}

  // StartK8sControlPlaneNodeGracefulShutdown starts an asynchronous
  // control-plane node graceful shutdown operation. The operation_id is an
  // idempotency key; retrying with the same operation_id returns the existing
  // operation instead of starting duplicate work.
  rpc StartK8sControlPlaneNodeGracefulShutdown(StartK8sControlPlaneNodeGracefulShutdownRequest) returns (StartK8sControlPlaneNodeGracefulShutdownResponse) {}

  // GetK8sControlPlaneNodeGracefulShutdownStatus returns the current status for
  // a previously started asynchronous control-plane node graceful shutdown.
  rpc GetK8sControlPlaneNodeGracefulShutdownStatus(GetK8sControlPlaneNodeGracefulShutdownStatusRequest) returns (GetK8sControlPlaneNodeGracefulShutdownStatusResponse) {}

  // StartKubeVipRestore starts an asynchronous restore for kube-vip on a node
  // previously prepared by StartK8sControlPlaneNodeGracefulShutdown. It
  // restores the kube-vip static pod manifest and waits for the VIP to appear
  // on loopback again. The operation_id is an idempotency key; retrying with the
  // same operation_id returns the existing operation instead of starting
  // duplicate work.
  rpc StartKubeVipRestore(StartKubeVipRestoreRequest) returns (StartKubeVipRestoreResponse) {}

  // InstallCNI deploys packaged CNI charts or manifests into the cluster (helm install /
  // kubectl apply). It assumes the charts/manifest Debian package is already installed
  // on this node — use InstallPackages (or apt) for nvke-cni-ovn-charts-<stream>,
  // nvke-cni-calico-manifests-<stream>, and optional image packages (when not pulling
  // exclusively from a tenant registry).
  //
  // OVN resolves the chart tree from /etc/dgx/ovn-kubernetes when present else from the
  // installed charts package. Calico follows the Helm or static manifest layout under
  // the manifests package install path.
  //
  // cni_variant UNSPECIFIED is treated as OVN. version selects the Debian stream suffix
  // used to derive the charts package logical name only (defaults match cni-packages).
  rpc InstallCNI(InstallCNIRequest) returns (InstallCNIResponse) {}

  rpc UpdateAndFetchKubeAdmJoinStrings(KubeadmJoinStringRequest) returns (KubeadmJoinStringResponse) {}

  rpc GetKubeconfig(KubeconfigRequest) returns (KubeconfigResponse) {}

  rpc ExecuteScript(ExecuteScriptRequest) returns (ExecuteScriptResponse) {}

  rpc GetKubeadmJoinString(KubeadmJoinStringRequest) returns (KubeadmJoinStringResponse) {}

  rpc InitializeKubernetesAPIEncryption(InitializeKubernetesAPIEncryptionRequest) returns (InitializeKubernetesAPIEncryptionResponse) {}

  // PromoteKubernetesAPIEncryptionProviders reorders encryption providers from
  // identity-then-secretbox (existing-cluster bootstrap) to secretbox-then-identity
  // on this node, then waits for the local apiserver to reload the config.
  // Run on every control-plane node after phase-1 InitializeKubernetesAPIEncryption;
  // then call StartEtcdEncryptionAtRestObjectsRewrite once and poll
  // GetEtcdEncryptionAtRestObjectsRewriteStatus until the operation succeeds.
  rpc PromoteKubernetesAPIEncryptionProviders(PromoteKubernetesAPIEncryptionProvidersRequest) returns (PromoteKubernetesAPIEncryptionProvidersResponse) {}

  // UpdateEncryptionConfig applies a single key-rotation mutation to the local
  // EncryptionConfiguration file, then blocks until the local apiserver
  // confirms a successful reload of the new config. The call returns only
  // after the new config is active in the apiserver's memory.
  //
  // The call is idempotent and safe to retry on DeadlineExceeded: a WAL-style
  // state file is written before the config is touched, so a crash or a
  // timed-out call can be resumed without re-applying the mutation.
  //
  // Once the WAL entry is written it is removed only when the reload is
  // confirmed. Every later failure retains it (and possibly the written
  // config), and other mutations fail until the same operation is retried.
  //
  // Error codes:
  //   FailedPrecondition — encryption-config.yaml is missing (run
  //                        InitializeKubernetesAPIEncryption first); a WAL entry
  //                        from a different operation exists (retry that
  //                        operation first); the apiserver has not yet loaded the
  //                        current config; or the config or WAL ownership
  //                        changed, or the config became unreadable, before or
  //                        during confirmation.
  //   DeadlineExceeded,
  //   Canceled         — reload was not confirmed before the deadline or
  //                      cancellation; the call is safe to retry.
  //   Unavailable      — apiserver metrics stayed unavailable, so the reload
  //                      cannot be confirmed; retry after they recover.
  //   other codes      — invalid request, non-control-plane node, invalid
  //                      config or mutation, or a local I/O failure.
  rpc UpdateEncryptionConfig(UpdateEncryptionConfigRequest) returns (UpdateEncryptionConfigResponse) {}

  // Looks up a storage key name in the local configuration without returning key material.
  rpc GetEtcdEncryptionKeyIdentity(GetEtcdEncryptionKeyIdentityRequest) returns (GetEtcdEncryptionKeyIdentityResponse) {}

  // StartEtcdEncryptionAtRestObjectsRewrite starts an asynchronous rewrite of
  // Kubernetes API objects so they are persisted with the current etcd
  // encryption-at-rest configuration. The operation_id is an idempotency key;
  // retrying with the same operation_id returns the existing operation instead
  // of starting duplicate work. An agent only runs one rewrite operation at
  // a time.
  rpc StartEtcdEncryptionAtRestObjectsRewrite(StartEtcdEncryptionAtRestObjectsRewriteRequest) returns (StartEtcdEncryptionAtRestObjectsRewriteResponse) {}

  // GetEtcdEncryptionAtRestObjectsRewriteStatus returns the current status for
  // a previously started asynchronous rewrite operation.
  rpc GetEtcdEncryptionAtRestObjectsRewriteStatus(GetEtcdEncryptionAtRestObjectsRewriteStatusRequest) returns (GetEtcdEncryptionAtRestObjectsRewriteStatusResponse) {}

  rpc RemovePlainTextSecondaryEncryptionEntry(RemovePlainTextSecondaryEncryptionEntryRequest) returns (RemovePlainTextSecondaryEncryptionEntryResponse) {}

  rpc UploadFileBundle(stream FileChunk) returns (UploadStatus) {}

  // WriteNodeAgentConfig replaces /etc/agent/config.yaml with the given YAML
  // (NodeSpec) using an atomic write and serializes concurrent callers on this agent.
  rpc WriteNodeAgentConfig(WriteNodeAgentConfigRequest) returns (WriteNodeAgentConfigResponse) {}

  // ReconfigureNodeAgentArgs replaces AGENT_ARGS in the agent's own environment
  // file, which is otherwise written once at bootstrap and never again. The
  // agent reads its arguments only at startup, so this changes nothing until it
  // restarts; the response reports whether that restart is still pending. The
  // write is deliberately not accompanied by a restart, because restarting the
  // agent breaks the caller's connection to the node and has to be coordinated.
  rpc ReconfigureNodeAgentArgs(ReconfigureNodeAgentArgsRequest) returns (ReconfigureNodeAgentArgsResponse) {}

  rpc StreamExecuteScript(ExecuteScriptRequest) returns (stream ScriptOutputChunk) {}

  rpc InstallBundle(InstallBundleRequest) returns (InstallBundleResponse) {}

  rpc GetBundleStatus(GetBundleStatusRequest) returns (GetBundleStatusResponse) {}

  rpc InstallCollection(InstallCollectionRequest) returns (InstallCollectionResponse) {}

  // Debian package management

  // StartNodeAgentUpgrade persists an idempotent node-agent replacement
  // request and starts the independent nvke-agent-updater systemd service. The
  // caller must poll GetNodeAgentUpgradeStatus because a successful package
  // replacement restarts this gRPC server.
  rpc StartNodeAgentUpgrade(StartNodeAgentUpgradeRequest) returns (StartNodeAgentUpgradeResponse) {}

  // GetNodeAgentUpgradeStatus returns durable updater state that survives an
  // nvke-agent restart.
  rpc GetNodeAgentUpgradeStatus(GetNodeAgentUpgradeStatusRequest) returns (GetNodeAgentUpgradeStatusResponse) {}

  rpc InstallPackages(InstallPackagesRequest) returns (InstallPackagesResponse) {}

  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse) {}

  rpc RemovePackages(RemovePackagesRequest) returns (RemovePackagesResponse) {}

  rpc GetSupportBundle(GetSupportBundleRequest) returns (GetSupportBundleResponse) {}

  rpc ExecuteKubeadmPreflight(KubeadmPreflightRequest) returns (KubeadmPreflightResponse) {}

  // ExecuteNodePreflight runs optional node readiness checks and optional kubeadm preflight.
  // Set check_cloud_init_status to wait for cloud-init bootstrap to complete, or use checks
  // for caller-defined file_exists assertions (e.g. legacy sentinel files).
  // When kubeadm_preflight is set, the caller supplies rendered kubeadm config YAML and the agent
  // runs kubeadm phase preflight on this node.
  // Like ExecuteKubeadmPreflight, invalid requests and execution failures return gRPC OK with
  // status = "error" and error_message rather than an RPC error status.
  rpc ExecuteNodePreflight(ExecuteNodePreflightRequest) returns (ExecuteNodePreflightResponse) {}

  // Installs the signing key, writes sources.list.d (deb_uri + suite + components), optional pin, apt-get update.
  rpc ConfigureAptRepo(ConfigureAptRepoRequest) returns (ConfigureAptRepoResponse) {}

  // Removes the keyring, NVKE apt preferences, and a matching sources.list.d entry so
  // apt update succeeds afterward. By default removes <keyring_name>.list; override with
  // sources_list_basename when the file name differs.
  rpc RemoveAptRepo(RemoveAptRepoRequest) returns (RemoveAptRepoResponse) {}

  // PatchAPIServerManifest applies an allowlisted, convergent change to the
  // kube-apiserver static-pod manifest on a control-plane node and verifies the
  // apiserver stays Ready, self-restoring on failure. strategic_merge_patches
  // handle the keyed sections (volumes, volumeMounts); flag_ops handle the
  // keyless command/args flag list. files are staged before the manifest edit;
  // remove_files are unlinked after readiness is confirmed.
  //
  // Convergent and idempotent: the agent reads the live manifest, applies the
  // patch and flag_ops in memory, and snapshots/writes only if the result
  // differs. A re-run against an already-applied manifest returns OUTCOME_UNCHANGED.
  //
  // Two-lane contract: every state the agent can leave the node in — APPLIED,
  // UNCHANGED, FAILED_RESTORED, FAILED_NOT_RESTORED — is reported in
  // response.outcome with a NIL gRPC error, so whether the node was left in its
  // pre-call state (FAILED_RESTORED) or in an unconfirmed state needing
  // intervention (FAILED_NOT_RESTORED) survives the wire; the caller decides
  // what to do with that. A gRPC error is returned only when the request could
  // not be attempted and the node was not modified:
  //   FailedPrecondition — not a control-plane node, or the apiserver static-pod
  //                        manifest is missing or unparseable.
  //   InvalidArgument    — the request failed validation (non-absolute or
  //                        non-canonical file path, content over 1 MiB, or a
  //                        malformed flag op).
  rpc PatchAPIServerManifest(PatchAPIServerManifestRequest) returns (PatchAPIServerManifestResponse) {}
}

message GetSupportBundleRequest {
  // Optional list of additional absolute file paths to include in the bundle (e.g. /var/log/myapp.log).
  repeated string additional_files = 1;
}

message GetSupportBundleResponse {
  bytes bundle_tgz = 1;
  string error_message = 2;
}

message KubeadmStatusRequest {}

message KubeadmStatusResponse {
  string kubeadm_status = 1;
  string kubeadm_phase = 2;
  string cni_install_status = 3;
  string kubeadm_current_message = 4;
  repeated string kubeadm_completed_phases = 5;
  string agent_version = 6;
  reserved 7;
}

message File {
  // Absolute filesystem path where the file should be written.
  string path = 1;
  // File contents. The agent limits each file to 1 MiB.
  bytes content = 2;
  // Unix permission bits. Values outside 0 through 0777 are rejected.
  uint32 mode = 3;
  // Owner in user:group format, for example root:root.
  string owner = 4;
}

message PatchAPIServerManifestRequest {
  // Strategic-merge patches applied in order to the kube-apiserver static-pod
  // manifest (a core/v1 Pod). Used for keyed sections — volumes, volumeMounts,
  // env — which strategic-merge reconciles idempotently by their merge key.
  // Repeated so a change that is awkward or impossible to express as one patch
  // can be split across several. Empty entries are ignored. Optional.
  repeated bytes strategic_merge_patches = 1;

  // Convergent operations on the apiserver flag list (container command/args),
  // which strategic-merge cannot reconcile because it is a keyless string list.
  // Applied after the strategic-merge patches. Optional.
  repeated FlagOp flag_ops = 2;

  // Files staged on disk before the manifest edit, so volume-mount targets exist
  // when the apiserver restarts. Each path must be absolute and canonical (no
  // root restriction, matching the init/join file-write RPCs); each file is
  // limited to 1 MiB.
  repeated File files = 3;

  // Absolute, canonical paths unlinked after the manifest no longer references
  // them and the apiserver is confirmed Ready. Absence is not an error.
  repeated string remove_files = 4;
}

// FlagOp is a convergent mutation of a single kube-apiserver flag.
message FlagOp {
  oneof op {
    SetFlag set = 1;
    RemoveFlag remove = 2;
  }
}

// SetFlag ensures --<name>=<value> is present exactly once with this value,
// replacing an existing --<name> whose value differs. Idempotent.
message SetFlag {
  // Flag name without the leading dashes, e.g. "authentication-config".
  string name = 1;
  string value = 2;
}

// RemoveFlag strips every occurrence of --<name>[=...] from the command and args.
message RemoveFlag {
  // Flag name without the leading dashes.
  string name = 1;
}

message PatchAPIServerManifestResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The manifest and/or staged files changed and the apiserver verified Ready.
    OUTCOME_APPLIED = 1;
    // The node already matched the desired state; nothing was written or snapshotted.
    OUTCOME_UNCHANGED = 2;
    // The apply failed and the manifest was restored from the snapshot and
    // re-verified Ready. The node is back in its pre-call state.
    OUTCOME_FAILED_RESTORED = 3;
    // The apply failed and the restore could not be confirmed. The node is in an
    // unconfirmed state and needs manual intervention.
    OUTCOME_FAILED_NOT_RESTORED = 4;
  }
  Outcome outcome = 1;
  // Populated only on FAILED_* outcomes.
  string error_message = 2;
  // Path of the retained pre-mutation manifest snapshot, for forensics. Empty
  // when no snapshot was taken (UNCHANGED, or a files-only change).
  string backup_manifest_path = 3;
}

message KubeadmInitRequest {
  string pod_network_cidr = 1;
  string service_cidr = 2;
  string control_plane_endpoint = 3;
  string extraApiCertSans = 4;
  repeated string extra_args = 5;
  // When no_cni_install is false, used for the legacy in-init CNI install (InstallCNIPlugin path).
  // Otherwise use InstallCNI (or InstallCNIPlugin) after init.
  string tigera_operator_manifest = 6 [deprecated = true];
  // When no_cni_install is false, used for the legacy in-init CNI install.
  string tigera_custom_resource_manifest = 7 [deprecated = true];
  // Deprecated: ignored; use InstallCNI after init.
  bool use_cilium_cni = 8 [deprecated = true];
  string init_config = 9;
  bool api_encryption_enabled = 10;
  string api_encryption_key = 11;
  repeated string objects_to_encrypt = 12;
  // Deprecated: ignored; use InstallCNI after init.
  bool use_ovn_k8s_cni = 13 [deprecated = true];
  // When no_cni_install is false, passed to the legacy in-init CNI install.
  map<string, string> cni_config = 14 [deprecated = true];

  // When no_cni_install is false, selects ovn / tigera / calico for the legacy in-init install.
  string cni_plugin_name = 15 [deprecated = true];
  // When no_cni_install is false, Tigera/Calico version for the legacy in-init install.
  string tigera_version = 16 [deprecated = true];

  // When no_cni_install is false, OVN plugin version for the legacy in-init install.
  string ovn_version = 17 [deprecated = true];

  // When no_cni_install is false, skip the legacy in-init CNI install (e.g. custom manifest only).
  bool skip_cni_plugin_install = 18 [deprecated = true];

  bool use_staging = 19;
  repeated File files = 20;
  // When false (default), after a successful init the agent may install CNI using the legacy
  // InstallCNIPlugin path and the fields above (unless skip_cni_plugin_install is set).
  // When true, CNI is not installed during init; use InstallCNI (recommended) or InstallCNIPlugin after init.
  bool no_cni_install = 21;
  // Kubernetes control-plane version for kubeadm static-pod images (e.g. v1.31.9).
  // Used only when init_config is empty (CLI kubeadm init path): implies --kubernetes-version.
  // Canonical form uses a leading v. When empty, the agent tries kubeadm version -o short from the binary on PATH.
  // When init_config is non-empty, set kubernetesVersion inside ClusterConfiguration instead (NVKE controller kubeadm templates already do).
  string kubernetes_version = 22;
  // Empty preserves the legacy bootstrap name. Must match the existing storage identity on joins/replacements.
  string api_encryption_key_name = 23;
}

message KubeadmInitStatusRequest {}

message KubeadmInitStatusResponse {
  string kubeadm_init_status = 1;
  string controlplane_join_string = 2;
  string worker_join_string = 3;
  string status = 4;
  string phase = 5;
  string role = 6;
  string error_message = 7;
}

message KubeadmJoinRequest {
  string kubeadm_join_string = 1;
  string join_config = 2;
  string api_encryption_key = 3;
  string certificate_key = 4;
  repeated File files = 5;
  string api_encryption_key_name = 6;
}

message KubeadmJoinStatusRequest {}

message KubeadmJoinStatusResponse {
  string kubeadm_join_status = 1;
  string error_message = 2;
  string status = 3;
  string phase = 4;
  string role = 5;
}

message KubeadmResetRequest {
  string reset_config = 1;
  // skip_phases is a list of kubeadm reset phase names to skip.
  // Each entry is appended as `--skip-phases=<entry>` to the kubeadm reset
  // command. Multiple entries result in multiple flags. Typical use:
  //   skip_phases = ["remove-etcd-member"]
  // for the CP teardown path where the cluster-side etcd member removal has
  // already been performed by an executor node, so the local kubeadm reset
  // should not try to remove the local etcd member again (that call hangs
  // because the local etcd is no longer in the raft quorum).
  repeated string skip_phases = 2;
}

message KubeadmResetStatusResponse {
  string status = 1;
  string phase = 2;
  string role = 3;
  string error_message = 4;
}

enum NodeAgentOperationPhase {
  NODE_AGENT_OPERATION_PHASE_UNSPECIFIED = 0;
  NODE_AGENT_OPERATION_PHASE_RUNNING = 1;
  NODE_AGENT_OPERATION_PHASE_SUCCEEDED = 2;
  NODE_AGENT_OPERATION_PHASE_FAILED = 3;
}

message NodeAgentOperationStatus {
  string operation_id = 1;
  NodeAgentOperationPhase phase = 2;
  string step = 3;
  string error_message = 4;
}

message StartK8sControlPlaneNodeGracefulShutdownRequest {
  string operation_id = 1;
  bool stop_kube_apiserver = 2;
}

message StartK8sControlPlaneNodeGracefulShutdownResponse {
  NodeAgentOperationStatus operation = 1;
}

message GetK8sControlPlaneNodeGracefulShutdownStatusRequest {
  string operation_id = 1;
}

message GetK8sControlPlaneNodeGracefulShutdownStatusResponse {
  NodeAgentOperationStatus operation = 1;
}

enum InstallMethod {
  Kubectl = 0;
  Helm = 1;
}

enum CniVariant {
  // Default for InstallCNI: treated as OVN when version is empty (default Debian stream suffix, e.g. 2.4.2).
  CNI_VARIANT_UNSPECIFIED = 0;
  CNI_VARIANT_OVN = 1;
  CNI_VARIANT_CALICO = 2;
}

// Historical: InstallCNI used to distinguish image vs charts debs via cni_apt_role.
enum CniAptRole {
  CNI_APT_ROLE_UNSPECIFIED = 0;
  CNI_APT_ROLE_IMAGES = 1;
  CNI_APT_ROLE_CHARTS = 2;
}

// Legacy request shape used by the in-init CNI path during KubeadmInit when
// no_cni_install is false. Stand-alone InstallCNIPlugin RPC was removed; use
// InstallCNI for post-init installs.
message InstallCNIPluginRequest {
  string plugin_name = 1;
  string plugin_url = 2;
  string tigera_operator_manifest = 3;
  string tigera_custom_resource_manifest = 4;
  string pod_network_cidr = 5;
  string service_cidr = 6;
  map<string, string> cni_config = 7;
  string plugin_version = 8;
  string bundle_url = 9;
}

message InstallCNIRequest {
  // OVN or CALICO; when UNSPECIFIED the agent uses OVN (stream selects nvke-cni-ovn-charts-<stream>, etc.).
  CniVariant cni_variant = 1;
  // Selects Debian stream suffix in the charts/manifest package name used to locate bundled
  // charts on disk (leading "v" stripped). Empty uses defaults matching cni-packages (OVN 2.4.2,
  // Calico 3.30.1). Non-empty duplicates the suffix for an optional apt pin suffix (foobar=VERSION)
  // in the logical package spec string for logging/compatibility — install the pinned deb separately.
  string version = 2;
  // Deprecated — ignored except cni_apt_role IMAGES, which returns invalid argument from InstallCNI.
  CniAptRole cni_apt_role = 3 [deprecated = true];
  // Deprecated — ignored (InstallCNI always applies to the cluster from a control-plane node).
  bool apply_to_cluster = 4 [deprecated = true];
  // Optional; used as helm --set for OVN (and optional Calico chart) when deploying charts.
  string pod_network_cidr = 5;
  string service_cidr = 6;
  // Optional; extra helm --set key/values (OVN and Calico chart deploy paths).
  map<string, string> cni_config = 7;
  // Calico charts only: optional Tigera operator / custom-resources YAML overrides under manifests/.
  string tigera_operator_manifest = 8;
  string tigera_custom_resource_manifest = 9;
  // Deprecated — ignored. InstallCNI never runs apt; install debs via InstallPackages first.
  bool skip_apt = 10 [deprecated = true];
