// UpdateEncryptionConfig messages

message AddSecondaryKeyOperation {
  string new_key = 1; // base64-encoded 32-byte secretbox key
  string key_name = 2; // empty retains legacy auto-derived naming
}

message PromotePrimaryKeyOperation {
  string new_key = 1; // base64-encoded key to move to the primary (first) position
  string key_name = 2; // when supplied, verifies the stored identity; never renames a live key
}

message RemoveOldKeysOperation {
  string primary_key = 1; // the key to retain; all other keys are removed
  string key_name = 2; // when supplied, verifies the retained storage identity
}

message UpdateEncryptionConfigRequest {
  oneof operation {
    AddSecondaryKeyOperation add_secondary_key = 1;
    PromotePrimaryKeyOperation promote_primary_key = 2;
    RemoveOldKeysOperation remove_old_keys = 3;
  }
}

// UpdateEncryptionConfigResponse is empty on success. On failure the gRPC
// status code follows the UpdateEncryptionConfig contract; a written WAL entry
// is retained for a retry of the same operation.
message UpdateEncryptionConfigResponse {}

