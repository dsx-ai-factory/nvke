    // No certificate was inside the requested renewal window.
    OUTCOME_UNCHANGED = 1;
    // Certificates were renewed and all static control-plane pods restarted.
    OUTCOME_RENEWED = 2;
    // The operation failed before static-pod manifests were moved.
    OUTCOME_FAILED_BEFORE_RESTART = 3;
    // The operation failed after manifests were moved, but all manifests were restored.
    OUTCOME_FAILED_RESTORED = 4;
    // The operation failed and one or more manifests could not be restored.
