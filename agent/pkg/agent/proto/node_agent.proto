enum KubeadmPreflightRole {
  // Values are prefixed with the enum name so they do not register bare
  // top-level symbols (e.g. proto.INIT) in the global protobuf registry, which
  // collided with other packages using `package proto;` (notably Teleport's
  // gravitational/teleport/api/client/proto). Follows the protobuf enum style
  // guide. The numeric values are unchanged, so this is wire-compatible.
  KUBEADM_PREFLIGHT_ROLE_INIT = 0;
  KUBEADM_PREFLIGHT_ROLE_JOIN = 1;
}

message KubeadmPreflightRequest {
  // Kubeadm configuration file contents (YAML)
  string config = 1;
  // Whether this is an init or join preflight check
  KubeadmPreflightRole role = 2;
}

message PreflightCheckResult {
  string name = 1;
  // "error" or "warning"
  string severity = 2;
  string message = 3;
}

message KubeadmPreflightResponse {
  // "success" if all checks passed, "error" if any check failed
  string status = 1;
  string error_message = 2;
  // Individual preflight check results (errors and warnings)
  repeated PreflightCheckResult results = 3;
  // Raw output from kubeadm
  string raw_output = 4;
}

message ExecuteNodePreflightRequest {
  // Optional caller-defined node readiness checks (e.g. file_exists for sentinel files).
  repeated NodePreflightCheck checks = 1;
  // Optional kubeadm init/join preflight for this node.
  optional KubeadmPreflightRequest kubeadm_preflight = 2;
  // When set, the agent runs `cloud-init status --long` and passes when its
  // status line reads "status: done". "status: running" yields notready;
  // "status: error" yields error. The lines after the status line are
  // reported, not evaluated.
  CheckCloudInitStatus check_cloud_init_status = 3;
}

// CheckCloudInitStatus requests cloud-init bootstrap completion via `cloud-init status`.
message CheckCloudInitStatus {}

message NodePreflightCheck {
  // Caller-defined identifier for this check (e.g. "sentinel-file").
  // When empty, the agent derives a name from the check type and path.
  string name = 1;
  oneof check {
    FileExistsPreflightCheck file_exists = 2;
  }
}

message FileExistsPreflightCheck {
  // Absolute path on the node filesystem.
  string path = 1;
}

message ExecuteNodePreflightResponse {
  // "ready" when all requested checks passed, "notready" when a node check failed,
  // "error" when kubeadm preflight failed or the request was invalid.
  // Invalid requests return gRPC OK with status = "error" and error_message set.
  string status = 1;
  repeated NodePreflightResult results = 2;
  KubeadmPreflightResponse kubeadm_preflight = 3;
  // Human-readable summary of what failed when status is "notready" or "error".
  // Empty when status is "ready".
  string error_message = 4;
}

message NodePreflightResult {
  string name = 1;
  bool passed = 2;
  string message = 3;
}

message ConfigureAptRepoRequest {
  // Used in apt preferences Pin: release o=<repo_name> when repo_priority is non-zero.
  // Should match the Origin field in the repository InRelease/Release file.
  string repo_name = 1;
  string repo_signing_key = 2;
  int32 repo_priority = 3;
  // Basename for the keyring file (no directories, no ".gpg" suffix). The agent writes
  // /etc/apt/keyrings/<keyring_name>.gpg so callers can set signed-by= to match upstream docs.
  string keyring_name = 4;
  // Repository root URL for the deb line (e.g. https://bucket.s3.region.amazonaws.com/nke-apt-dev).
  // Required together with suite; the agent writes /etc/apt/sources.list.d/<file>.list.
  string deb_uri = 5;
  // Suite/codename (e.g. noble, jammy).
  string suite = 6;
  // Space-separated components (e.g. "main"). If empty, defaults to "main".
  string components = 7;
  // Optional basename for the sources list file (must end with .list). If empty, uses <keyring_name>.list.
  string sources_list_basename = 8;
}

message ConfigureAptRepoResponse {
  string status = 1;
  string error_message = 2;
  string raw_output = 3;
}

message RemoveAptRepoRequest {
  // Same keyring_name as passed to ConfigureAptRepo.
  string keyring_name = 1;
  // Basename under /etc/apt/sources.list.d (must end with .list). If empty, the agent
  // removes <keyring_name>.list when present.
  string sources_list_basename = 2;
}

message RemoveAptRepoResponse {
  string status = 1;
  string error_message = 2;
  string raw_output = 3;
}

