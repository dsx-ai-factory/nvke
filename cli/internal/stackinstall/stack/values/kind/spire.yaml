# What the seed changes about spire. Layered over values/spire.yaml.
#
# The tpmDirect node attestor stays on. A kind node has no TPM, but the seed's
# own workloads attest with k8sPSAT, and the TPM allowlist is read only for
# nodes the controller provisions.
spiffe-oidc-discovery-provider:
  # One node. A second replica only sits Pending.
  replicaCount: 1
