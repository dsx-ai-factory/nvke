# What the seed changes about the controller. Layered over
# values/controller.yaml.
#
# SPIRE stays on and the attestation method stays tpm. A kind node has no TPM,
# but nothing on the seed attests by TPM. The seed's own workloads attest with
# k8sPSAT. The TPM allowlist is read only for nodes the controller provisions.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
