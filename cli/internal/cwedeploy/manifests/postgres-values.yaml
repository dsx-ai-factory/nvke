# Values for the Bitnami postgresql chart, backing both CWE's own database and
# Temporal's persistence store on the ephemeral bootstrap Kind cluster.
#
# Ported from controller/deploy/helm-values/postgres.yaml, which is the same
# chart driven the same way for local Tilt development (controller/Tiltfile).
# Kept in cli/ as an embedded copy rather than read from controller/ at
# runtime: cli is a separate Go module and nkectl ships as a standalone
# binary, so it cannot assume a monorepo checkout is available next to it at
# runtime. auth.password is supplied on the `helm upgrade --install`
# command line, not hardcoded here, same as the source file.
auth:
  username: postgres
  database: postgres

primary:
  persistence:
    enabled: false
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
  initdb:
    scripts:
      init-cwe.sql: |
        CREATE DATABASE "cloud-workflow";
      init-temporal.sql: |
        CREATE DATABASE temporal;
        CREATE DATABASE temporal_visibility;
