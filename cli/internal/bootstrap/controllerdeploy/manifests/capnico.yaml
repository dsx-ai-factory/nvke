# CAPNICo v0.1.0, the PUBLIC infrastructure-components.yaml release asset:
#
#   gh release download v0.1.0 \
#     --repo dsx-ai-factory/cluster-api-provider-nico \
#     -p infrastructure-components.yaml
#
# A manifest, not a helm item, and not built from source. A site has no provider
# checkout, and the published chart needs a `helm registry login ghcr.io` this
# path does not assume. The release asset needs only the image, which is
# public on GHCR or comes from the release by digest.
#
# The most useful finding from that run: CAPNICo needs neither GitLab nor NGC
# org access. The management-software CI fetches the same
# manifest from a GitLab generic package and repoints the image at
# nvcr.io/j7sbcjl3qgta only because sites hold that org's credentials -- not
# because the public path does not exist.
#
# ONE EDIT against the upstream asset, the one of ci/capnico's three that
# still matters here:
#
#  1. the manager's args. Upstream defaults the reboot and repair annotations
#     to nico.nvidia.com/*; the controller writes nvke.nvidia.com/*. A mismatch is not an
#     error anywhere -- every reboot and repair request is silently ignored.
#  2. nothing else: the image is pulled from ghcr.io, whose package is public
#     (an anonymous token fetches the manifest), or comes from a release by
#     digest. A site whose registry needs a credential adds its own pull
#     secret here.
#
# The third edit ci/capnico applies -- repointing the image at nvcr.io -- is
# deliberately NOT made.
#
# To bump: take infrastructure-components.yaml from the new release, re-apply
# both edits, and move controller/go.mod's ref with it.

apiVersion: v1
kind: Namespace
metadata:
  name: capnico-system
---
