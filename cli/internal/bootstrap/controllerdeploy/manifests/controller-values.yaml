# Values for controller/deploy/charts/controller on the ephemeral
# bootstrap Kind cluster. Adapted from controller/hack/tilt-controller-chart-values.yaml
# (the chart's own local-dev override), trimmed to what this single-purpose
# ephemeral deployment needs. SPIFFE is enabled at runtime after the SPIRE
# umbrella chart installs its server, agent, CSI driver, and controller
# manager. OIDC and ServiceMonitor stay disabled on the vanilla Kind cluster.
#
# image.* is NOT set here -- Engine.Deploy passes it via --set-string from
# Config.CWEImage, since an image reference (and whether it needs `kind load`'d
# in first) is a runtime decision, not a static value. profiles.path is set the
# same way.
#
# appDb.postgresPassword is not set here. Engine.Deploy generates it per run and
# passes it in a 0600 values file after this one, so it is neither hardcoded nor
# on the helm command line. postgres-values.yaml and temporal-values.yaml work
# the same way.
#
# The four names below are controllerdeploy's cweNamespace. nameOverride sets the pod
# label controller-nodeport.yaml selects on, and the chart pins serviceAccount.name
# rather than deriving it, so both are set here alongside the fullname.
fullnameOverride: nvke-controller
nameOverride: nvke-controller
namespaceOverride: nvke-controller
serviceAccount:
  name: nvke-controller

metrics:
  networkPolicy:
    enabled: false
serviceMonitor:
  enabled: false

# Point the probes at the same /readyz this package polls externally, so the
# in-cluster probe and the CLI's own health wait agree on what "healthy"
# means: DB Ping + Temporal CheckHealth both succeeding (see
# controller/internal/server/health.go).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: nvke-controller
  postgresUser: postgres
  sslMode: disable

secrets:
  dgxcTenantCredSecretName: ""

temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233

spiffe:
  enabled: true

nvkeOIDCAuth:
  enabled: false

# Cluster API. A site cluster is a CAPI cluster whose infrastructure provider
# is cluster-api-provider-provisioned, so the NVKE controller runs its CAPI controllers and gets
# the RBAC to write the objects. Engine.Deploy installs CAPI itself, before this
# release, so the controllers exist by the time the NVKE controller writes anything.
#
capi:
  enabled: true
  rbac:
    create: true
