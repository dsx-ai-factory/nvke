# Publishes the controller API to the host that ran `nvkectl bootstrap site`.
#
# The command deploys the controller and then calls its REST API to create the tier-0
# cluster. A ClusterIP is not a route the host has, and the chart's Service
# template has no nodePort field to set, so this is a second Service beside the
# chart's own -- the same shape, and for the same reasons, as
# spire-server-nodeport.yaml: two Services may select the same pods, the chart
# keeps its ClusterIP for everything inside the cluster, and neither knows about
# the other.
#
# Two values have to agree with things outside this file:
#
#   selector   the labels the controller chart puts on its pods. The release name
#              and nameOverride in controller-values.yaml fix both, so these are stable.
#   port       Config.CWEPort in controllerdeploy.go. internal/nvkectl/bootstrap.go uses the
#              same value for both sides of the kind cluster's port mapping.
#
# The namespace is deliberately absent: it is applied into the namespace
# controllerdeploy installs the controller in.

apiVersion: v1
kind: Service
metadata:
  name: nvke-controller-external
  labels:
    app.kubernetes.io/name: nvke-controller
    app.kubernetes.io/managed-by: nvkectl
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nvke-controller
    app.kubernetes.io/instance: nvke-controller
  ports:
    - name: http
      protocol: TCP
      # The chart names its container port "http"; resolving by name rather than
      # number means this keeps working if the chart moves it.
      targetPort: http
      port: {{ .Port }}
      nodePort: {{ .Port }}
