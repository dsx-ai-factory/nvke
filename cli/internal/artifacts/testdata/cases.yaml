#
# Expected validator result per file: ok, or a substring of the error.
# platform defaults to linux/amd64. Each file under cases/ breaks one rule of
# valid.json, except the valid-* files and minimal-hand-written.json, which are
# the valid shapes. minimal-hand-written.json lists its artifacts under
# artifacts; the others use nvkr's key, outputs. nvkr/ holds unmodified nvkr
# release exports with no NVKE artifact.

- file: valid.json
  expect: ok
- file: valid.json
  platform: linux/arm64
  expect: ok
- file: cases/minimal-hand-written.json
  expect: ok
- file: cases/valid-nico-absent.json
  expect: ok
- file: cases/valid-local-path-absent.json
  expect: ok
- file: cases/valid-extra-artifacts-and-keys.json
  expect: ok
- file: nvkr/helm-export.json
  expect: 'required artifact "cwe" is missing'
- file: nvkr/exec-export.json
  expect: 'required artifact "cwe" is missing'
- file: cases/not-json.json
  expect: 'not valid JSON'
- file: cases/null.json
  expect: 'not a JSON object'
- file: cases/trailing-content.json
  expect: 'content after the JSON object'
- file: cases/both-list-keys.json
  expect: 'has both "artifacts" and "outputs"'
- file: cases/duplicate-artifact-name.json
  expect: 'artifact "cwe": appears twice'
- file: cases/missing-required-artifact.json
  expect: 'required artifact "spire" is missing'
- file: cases/nico-without-prereqs.json
  expect: 'artifact "nico-prereqs" is required when "nico" is present'
- file: cases/image-wrong-kind.json
  expect: 'artifact "cwe": kind "executable", want "oci"'
- file: cases/chart-wrong-kind.json
  expect: 'artifact "spire": kind "oci", want "helm-oci"'
- file: cases/reference-missing.json
  expect: 'artifact "cwe": reference is missing'
- file: cases/reference-without-digest.json
  expect: 'artifact "cwe": reference has no digest'
- file: cases/image-platform-missing.json
  expect: 'artifact "cwe": no manifest for platform linux/amd64'
- file: cases/image-index-platform-missing.json
  expect: 'artifact "cwe": no manifest for platform linux/amd64'
- file: cases/chart-without-version.json
  expect: 'artifact "temporal": chartVersion is missing'
- file: cases/chart-version-out-of-range.json
  expect: 'artifact "postgresql": chartVersion "17.0.0" is outside the supported range'
