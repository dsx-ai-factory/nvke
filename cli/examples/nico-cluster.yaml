# Example CreateClusterRequest for a real NICo site, provisioned by CAPNICo.
#
# Usage: nkectl create cluster -f examples/nico-cluster.yaml
#
# Prerequisites:
#   - CAPNICo installed on the site controller: nkectl get providers reports
#     nico as CONFIGURED
#   - A NICo site, VPC, VPC prefix, instance type, SSH key group, and an
#     allocation against the instance type. An instance type with no allocation
#     looks healthy and provisions nothing.
#
# Every UUID below is site-specific. Replace all of them. The profile names are
# placeholders too: fleet profile content is maintained outside this repository
# and supplied at deploy time. List what your site serves with the API's
# /api/osProfiles and /api/configProfiles endpoints; nkectl has no command for
# them yet.
#
# The cluster's top-level `nico` or `infra` sets its provider, and the control
# plane and every node pool must carry that same payload; any other is rejected.
# This path uses `nico`; the local mock uses `infra` — see nico-mock-cluster.yaml.

name: my-cluster
controlPlaneKubernetesVersion: 1.34.2
cniPlugin: calico
etcdEncrypted: false

nico:
  orgID: dipfedrcvjiw
  siteID: 00000000-0000-0000-0000-000000000000
  vpcID: 00000000-0000-0000-0000-000000000000

# instanceTypePreference is an ordered list, unlike a worker pool's single
# instanceTypeID: index 0 is the first choice. A control-plane node that cannot
# get capacity moves through the list until one type provisions, and then stays
# on that type.
controlPlaneConfig:
  desiredCount: 3
  systemReservedMemory: "1Gi"
  nico:
    instanceTypePreference:
      - 00000000-0000-0000-0000-000000000000
      - 11111111-1111-1111-1111-111111111111
    vpcPrefixIDs:
      - 00000000-0000-0000-0000-000000000000
    sshKeyGroupIDs:
      - 00000000-0000-0000-0000-000000000000
    osProfile: nke-260625-24.04-x86-fde
    configProfile: default-cp

nodePools:
  - name: worker
    nodeNamePrefix: w
    desiredNodeCount: 2
    controlPlane: false
    systemReservedMemory: "1Gi"
    nico:
      instanceTypeID: 00000000-0000-0000-0000-000000000000
      vpcPrefixIDs:
        - 00000000-0000-0000-0000-000000000000
      sshKeyGroupIDs:
        - 00000000-0000-0000-0000-000000000000
      osProfile: nke-260625-24.04-x86-fde
      configProfile: default-worker
