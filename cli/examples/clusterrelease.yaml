#
# A control-plane release for `nvkectl create clusterrelease -f clusterrelease.yaml`.
#
# machineImageRef and machineInit are immutable once published. To change
# either, publish a new name. The only thing that changes in place is
# lifecycle, through `nvkectl deprecate clusterrelease <name>`.
metadata:
  name: example-ubuntu-24.04-amd64
  annotations:
    # These two annotations state which Kubernetes version the machineInit
    # userDataTemplate below supports. They describe that template only.
    #   "" and "true":        the template takes the version from the controller, through
    #                         {{ .KubernetesVersion }}, so it supports any version.
    #   "1.34.2" and "false": the template is written for that one version.
    internal.nke.nvidia.com/machine-init-kubernetes-version: "1.34.2"
    internal.nke.nvidia.com/machine-init-kubernetes-version-injected: "false"
spec:
  machineImageRef:
    name: example-ubuntu-24.04-amd64
  machineInit:
    # A Go template rendered per machine. It must begin with a cloud-init
    # header.
    userDataTemplate: |
      #cloud-config
      # SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
      # SPDX-License-Identifier: Apache-2.0

      autoinstall:
        version: 1
        identity:
          hostname: {{ .Hostname }}
          username: {{ .Username }}
          password: "{{ .HashedPassword }}"
        keyboard:
          layout: us
        locale: en_US.UTF-8
        ssh:
          allow-pw: true
          install-server: true
        storage:
          layout:
            name: lvm
        user-data:
          package_update: true
      {{ if .Files }}
          write_files:
      {{ range .Files }}
            - path: {{ quote .Path }}
              owner: {{ quote .Owner }}
              permissions: {{ quote .Permissions }}
      {{- if .Encoding }}
              encoding: {{ quote .Encoding }}
      {{- end }}
              content: {{ quote .Content }}
      {{ end }}
      {{ else }}
          write_files: []
      {{ end }}
          runcmd:
            - |
                set -eu
                echo "deb [trusted=yes] https://apt.example.com/nvke stable main" > /etc/apt/sources.list.d/nke.list
                apt-get update
                install -d -m 0755 /etc/default
                DEBIAN_FRONTEND=noninteractive apt-get install -y nke-agent nke-kubeadm-distro-1.34.2 {{ .CNIImagePackage }} {{ .CNIChartsPackage }}
                systemctl enable nke-agent
                systemctl restart nke-agent
                install -d -m 0755 /run/cluster-api
                touch /run/cluster-api/bootstrap-success.complete
