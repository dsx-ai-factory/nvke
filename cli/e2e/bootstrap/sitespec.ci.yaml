# Inventory fixture for `make -C cli test-e2e-bootstrap` and the
# "nkectl bootstrap e2e" CI workflow. See examples/sitespec.yaml for the
# annotated field reference.
#
# Node IPs match the deterministic addressing the substrate package assigns
# (cli/e2e/bootstrap/substrate, subnet 172.26.0.0/24 starting at .10) — this
# file lands ahead of dispatch actually dialing them because the
# walking-skeleton e2e run does not reach the nodes yet.
#
# nodeAgentPort is set explicitly, not left to the default, so the fixture keeps
# stating the port it expects. Set it on your own hosts to match the
# `--secure-server-port` their agents run with. See
# docs/site-bootstrap/configuration.md.

clusterName: "nke-e2e"

cluster:
  # Pre-provisioned control-plane nodes. No node has a distinct role.
  nodes:
    - name: "node1"
      ip: "172.26.0.10"
    - name: "node2"
      ip: "172.26.0.11"
    - name: "node3"
      ip: "172.26.0.12"

  # Each node also carries a tpmEkThumbprint, the SHA-256 of its TPM
  # endorsement key, which is what the SPIRE server's allowlist is keyed on.
  # They are not committed here: a fake node's TPM is created along with its
  # container, so run.sh fills them in against whichever hosts are running and
  # passes the rendered file to `bootstrap site`.

  # Kubernetes version to install — plain semantic version, no leading "v".
  # Match the kubeadm and kubelet version in the CAPD node image.
  k8sVersion: "1.34.8"

  # CNI plugin: "calico" or "ovn-kubernetes".
  cniName: "calico"
  # Match the Calico manifests package built for the fake node image by run.sh.
  cniVersion: "3.30.1"

  # Pod and service network CIDRs.
  #
  # CWE's own defaults, deliberately: it only accepts non-default CIDRs with the
  # ovn-kubernetes CNI plugin, and this fixture runs calico. Neither overlaps
  # the 172.26.0.0/24 the fake nodes are on.
  podCidr: "192.168.0.0/16"
  serviceCidr: "10.96.0.0/12"

  # Fake node containers run with limited memory; the kubelet default exceeds
  # their capacity and refuses to start without this override.
  kubeletConfig:
    systemReservedMemory: "512Mi"

  # See the note above DefaultNodeAgentPort is stale — the real default is
  # wrong for this fixture's node image, so it is overridden here.
  nodeAgentPort: "15005"

# Container registry for the bootstrap engine image and chart. The version
# (image/chart tag) is baked into the nkectl build, so it is not set here.
registry:
  bootstrapRepo: "nvcr.io/org/cloud-workflow-engine"
  bootstrapChart: "cloud-workflow-engine"
  # apiKey is a credential and is never committed. The runner supplies it
  # through REGISTRY_API_KEY. SPIRE needs none of its own: it installs from
  # the SPIFFE project's public charts.
