# Three pre-provisioned nodes for the nkectl bootstrap-site e2e suite.
# nkectl bootstraps these by IP with no provider dependency, matching the
# node/IP shape in inventory.ci.yaml.
#
# A later change attaches the ephemeral Kind bootstrap cluster to this network
# (KIND_ADDITIONAL_NETWORKS=nkectl-e2e-nodes) so the CWE worker running inside
# it can reach nke-agent on each node container.
#
# Usage:
#   K8S_VERSION=1.32.0 NODE_AGENT_TAG=edge \
#     docker compose -f e2e/bootstrap/docker-compose.yaml -p nkectl-e2e up -d

services:
  node1:
    image: kindest/node-agent:v${K8S_VERSION:-1.32.0}-${NODE_AGENT_TAG:-local}
    hostname: node1
    container_name: nkectl-e2e-node1
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    tty: true
    init: false
    networks:
      nkectl-e2e-nodes:
        ipv4_address: 172.26.0.10
    volumes:
      - /lib/modules:/lib/modules:ro
      - nkectl-e2e-node1-var:/var
      - nkectl-e2e-node1-containerd:/var/lib/containerd
      # Mask /proc/swaps: kubelet's IsSwapOn() runs before failSwapOn takes
      # effect; in a nested Docker container it inherits the host's swap
      # setting.
      - /dev/null:/proc/swaps:ro
    tmpfs:
      - /tmp
      - /run
    environment:
      - NODE_NAME=node1
    restart: unless-stopped

  node2:
    image: kindest/node-agent:v${K8S_VERSION:-1.32.0}-${NODE_AGENT_TAG:-local}
    hostname: node2
    container_name: nkectl-e2e-node2
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    tty: true
    init: false
    networks:
      nkectl-e2e-nodes:
        ipv4_address: 172.26.0.11
    volumes:
      - /lib/modules:/lib/modules:ro
      - nkectl-e2e-node2-var:/var
      - nkectl-e2e-node2-containerd:/var/lib/containerd
      - /dev/null:/proc/swaps:ro
    tmpfs:
      - /tmp
      - /run
    environment:
      - NODE_NAME=node2
    restart: unless-stopped

  node3:
    image: kindest/node-agent:v${K8S_VERSION:-1.32.0}-${NODE_AGENT_TAG:-local}
    hostname: node3
    container_name: nkectl-e2e-node3
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    tty: true
    init: false
    networks:
      nkectl-e2e-nodes:
        ipv4_address: 172.26.0.12
    volumes:
      - /lib/modules:/lib/modules:ro
      - nkectl-e2e-node3-var:/var
      - nkectl-e2e-node3-containerd:/var/lib/containerd
      - /dev/null:/proc/swaps:ro
    tmpfs:
      - /tmp
      - /run
    environment:
      - NODE_NAME=node3
    restart: unless-stopped

networks:
  nkectl-e2e-nodes:
    name: nkectl-e2e-nodes   # explicit name prevents Docker Compose adding the project prefix
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24

volumes:
  nkectl-e2e-node1-var:
  nkectl-e2e-node1-containerd:
  nkectl-e2e-node2-var:
  nkectl-e2e-node2-containerd:
  nkectl-e2e-node3-var:
  nkectl-e2e-node3-containerd:
