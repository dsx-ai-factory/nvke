# nke-agent systemd drop-in: serve CNI bundles from the loopback file server
# (nke-bundle-server.service) instead of the nke-dev S3 bucket.
#
# The agent's CNI install path does a plain HTTP GET against ${IndexFileURL}
# and then ${BundleServerURL}/<path-from-index>. Both must be overridden —
# setting only the index URL leaves BundleServerURL at its S3 default.
#
# Without this the nodes need outbound DNS + S3 reachability during kubeadm
# init, which CI's Docker does not reliably give a nested container: the
# inherited resolver is unreachable from the compose bridge, so the bundle
# fetch fails and the CNI install errors out after kubeadm init has already
# succeeded.

[Unit]
After=nke-bundle-server.service
Wants=nke-bundle-server.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/nke-agent -disable-mtls -index-file-url http://127.0.0.1:8080/nke_bundles/ubuntu_22_index.json -bundle-server-url http://127.0.0.1:8080/
