---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    cluster.x-k8s.io/provider: infrastructure-provisioned
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: provisionedclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: ProvisionedCluster
    listKind: ProvisionedClusterList
    plural: provisionedclusters
    shortNames:
    - pc
    singular: provisionedcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - description: Hosts that no machine holds
      jsonPath: .status.availableHosts
      name: Hosts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProvisionedCluster is the Schema for the provisionedclusters
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProvisionedClusterSpec defines the desired state of ProvisionedCluster.

              The spec holds no control plane endpoint. CWE owns the control plane VIP
              through the controlPlaneVIP field of its own cluster API, and CWE configures
              kube-vip on each control plane node.
            properties:
              hosts:
                description: |-
                  Hosts is the inventory. The provider gives one host to each machine.

                  Treat the inventory as fixed after the cluster is created. Size it for
                  the cluster that you want.
                items:
                  description: |-
                    ProvisionedHost describes one host that already exists on the network.
                    The host is on, the operating system is installed, and the network already
                    assigned its IP address. No controller creates or changes the host.
                  properties:
                    hostname:
                      description: |-
                        Hostname is the DNS hostname of the host. It must be unique in the cluster.
                        It does not become the Kubernetes Node name: CWE generates the Node name
                        and passes it to kubeadm.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    ipAddress:
                      description: |-
                        IPAddress is the IP address that the network already assigned to this
                        host. The provider uses its canonical form in the provider ID and copies
                        it to the status of the machine that holds the host. CWE uses it to reach
                        the node agent.
                      maxLength: 45
                      minLength: 1
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      description: |-
                        Labels select this host. A machine that sets spec.hostSelector only uses
                        a host whose labels contain every entry of that selector.
                      type: object
                    tpmEkPubHash:
                      description: |-
                        TPMEKPubHash is the SHA-256 hash that identifies this host's TPM
                        endorsement public key. When set, the provider connects the owning CAPI
                        Machine to the TPM-attested SPIRE agent on this host.
                      pattern: ^[0-9a-f]{64}$
                      type: string
                  required:
                  - hostname
                  - ipAddress
                  type: object
                minItems: 1
                type: array
            required:
            - hosts
            type: object
          status:
            description: |-
              ProvisionedClusterStatus defines the observed state of
              ProvisionedCluster.
            properties:
              allocatedHosts:
                description: |-
                  AllocatedHosts reports which machine holds each host.

                  The provider computes this list from the ProvisionedMachine objects on
                  every reconcile. It exists for operators. No controller reads it, and the
                  provider never uses it to decide an allocation.
                items:
                  description: HostAllocation reports one host that a machine holds.
                  properties:
                    hostName:
                      description: HostName is the name of the host in the inventory.
                      type: string
                    machineName:
                      description: MachineName is the name of the ProvisionedMachine
                        that holds the host.
                      type: string
                  required:
                  - hostName
                  - machineName
                  type: object
                type: array
              availableHosts:
                description: |-
                  AvailableHosts is the count of hosts that no machine holds.

                  Deliberately not omitempty: an exhausted inventory reports 0, and dropping
                  the field would make "no host is free" look identical to "the provider has
                  not reported yet" — which is exactly the moment an operator needs to tell
                  them apart.
                format: int32
                type: integer
              conditions:
                description: Conditions describes the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              initialization:
                description: Initialization reports the state that the Cluster API
                  contract requires.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      Provisioned is true when the inventory is valid. The core Cluster API
                      machine controller waits for this field before it acts on any machine of
                      the cluster.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
