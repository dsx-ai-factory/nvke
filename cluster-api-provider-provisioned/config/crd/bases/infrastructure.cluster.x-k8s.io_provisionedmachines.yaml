---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    cluster.x-k8s.io/provider: infrastructure-provisioned
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: provisionedmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: ProvisionedMachine
    listKind: ProvisionedMachineList
    plural: provisionedmachines
    shortNames:
    - pm
    singular: provisionedmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - jsonPath: .status.hostName
      name: Host
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProvisionedMachine is the Schema for the provisionedmachines
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProvisionedMachineSpec defines the desired state of ProvisionedMachine.
            properties:
              hostSelector:
                additionalProperties:
                  type: string
                description: |-
                  HostSelector limits which hosts this machine can use. The provider only
                  uses a host whose labels contain every entry of this selector.
                type: object
              providerID:
                description: |-
                  ProviderID binds this machine to one host of the inventory. The provider
                  sets it once, in the form provisioned://<cluster-name>/<ip-address>.
                  The provider never changes it and never clears it.

                  This field is the record of the allocation. The provider derives the set
                  of used hosts from the providerID of every machine of the cluster, so the
                  binding survives a restart of the provider and needs no lease.
                maxLength: 512
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: providerID is immutable once set
              rule: '!has(oldSelf.providerID) || (has(self.providerID) && self.providerID
                == oldSelf.providerID)'
          status:
            description: |-
              ProvisionedMachineStatus defines the observed state of
              ProvisionedMachine.
            properties:
              addresses:
                description: |-
                  Addresses contain the hostname and internal IP address from the inventory.
                  Cluster API copies them to the Machine, and the controller reads the internal IP to
                  find the node agent.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions describes the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hostName:
                description: HostName is the hostname of the host that this machine
                  holds.
                type: string
              initialization:
                description: Initialization reports the state that the Cluster API
                  contract requires.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      Provisioned is true when the machine holds a host. Nothing is created, so
                      the machine is provisioned as soon as the binding exists.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
