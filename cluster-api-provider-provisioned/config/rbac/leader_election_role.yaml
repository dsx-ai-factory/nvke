apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioned-leader-election
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
