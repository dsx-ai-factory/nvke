{{- $component := index .Values "postgresql" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: {{ $component.auth.username | quote }}
  password: {{ $component.auth.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: {{ .Release.Namespace }}
data:
  init.sql: |
    CREATE DATABASE "controller";
    CREATE DATABASE temporal;
    CREATE DATABASE temporal_visibility;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ $component.image.repository }}{{- if $component.image.digest }}@{{ $component.image.digest }}{{- else }}:{{ $component.image.tag }}{{- end }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          env:
            # postgres:18 moved the image default to
            # /var/lib/postgresql/18/docker and now refuses to start when it
            # finds a mount at the old path. Pin PGDATA back so the data
            # directory stays on the volume mounted below.
            - name: PGDATA
              value: /var/lib/postgresql/data
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: password
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U ${POSTGRES_USER}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ $component.storage.size }}
        - name: init
          configMap:
            name: postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
