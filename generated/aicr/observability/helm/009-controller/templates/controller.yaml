apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller
    spec:
      serviceAccountName: controller
      containers:
        - name: controller
          # ghcr.io/dsx-ai-factory/nke/controller:v0.1.1-rc.5
          image: "ghcr.io/dsx-ai-factory/nke/controller@sha256:5102494f8e3d2daf74074600a9ea6121ead777151c8393128cc239a3dcb7275a"
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_CONNECTION_STRING
              value: "postgres://postgres:postgres@postgresql.postgresql.svc.cluster.local:5432/controller?sslmode=disable"
            - name: CNPG_SUPERUSER_PASSWORD
              value: "postgres"
            - name: TEMPORAL_HOST_PORT
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: PROFILES_DIR
              value: "/profiles"
            - name: SPIFFE_ENABLED
              value: "true"
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///spiffe-workload-api/spire-agent.sock"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: controller
spec:
  selector:
    app.kubernetes.io/name: controller
  ports:
    - name: http
      port: 8080
      targetPort: http
