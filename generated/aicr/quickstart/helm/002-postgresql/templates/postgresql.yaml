apiVersion: v1
kind: Secret
metadata:
  name: postgresql
  namespace: postgresql
type: Opaque
stringData:
  username: "postgres"
  password: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: postgresql
data:
  init.sql: |
    CREATE DATABASE "controller";
    CREATE DATABASE temporal;
    CREATE DATABASE temporal_visibility;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      containers:
        - name: postgresql
          image: "docker.io/library/postgres@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: password
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U ${POSTGRES_USER}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: init
          configMap:
            name: postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: postgresql
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
