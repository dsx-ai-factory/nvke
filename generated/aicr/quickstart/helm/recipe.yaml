apiVersion: aicr.run/v1alpha2
componentRefs:
  - chart: cert-manager
    name: cert-manager
    namespace: cert-manager
    source: https://charts.jetstack.io
    type: Helm
    valuesFile: components/cert-manager/values.yaml
    version: v1.15.1
  - dependencyRefs:
      - postgresql
      - temporal
      - spire
    manifestFiles:
      - components/controller/manifests/controller.yaml
    name: controller
    namespace: controller
    source: ""
    type: Helm
    valuesFile: components/controller/values.yaml
  - manifestFiles:
      - components/postgresql/manifests/postgresql.yaml
    name: postgresql
    namespace: postgresql
    source: ""
    type: Helm
    valuesFile: components/postgresql/values.yaml
  - chart: spire
    dependencyRefs:
      - cert-manager
      - spire-crds
    name: spire
    namespace: spire-server
    source: https://spiffe.github.io/helm-charts-hardened
    type: Helm
    valuesFile: components/spire/values.yaml
    version: 0.27.1
  - chart: spire-crds
    manifestFiles:
      - components/spire/manifests/namespaces.yaml
    name: spire-crds
    namespace: spire-server
    source: https://spiffe.github.io/helm-charts-hardened
    type: Helm
    version: 0.5.0
  - chart: temporal
    dependencyRefs:
      - postgresql
    name: temporal
    namespace: temporal
    source: https://go.temporal.io/helm-charts
    type: Helm
    valuesFile: components/temporal/values.yaml
    version: 0.54.0
constraints:
  - name: K8s.server.version
    value: '>= 1.30'
criteria:
  service: kind
deploymentOrder:
  - cert-manager
  - postgresql
  - spire-crds
  - spire
  - temporal
  - controller
kind: RecipeResult
metadata:
  appliedOverlays:
    - base
    - monitoring-hpa
    - kind
  version: 0.18.0
