# Extends the quick-start Kind profile with a standard Kubernetes observability
# stack. The custom platform criterion is registered by this external catalog.
kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: kind-observability

spec:
  base: kind

  criteria:
    service: kind
    platform: observability

  componentRefs:
    - name: prometheus-operator-crds
      valuesFile: components/prometheus-operator-crds/values.yaml

    - name: kube-prometheus-stack
      valuesFile: components/kube-prometheus-stack/values.yaml
      dependencyRefs:
        - prometheus-operator-crds
