# Replaces AICR's embedded Kind overlay for this isolated NKE management-stack
# catalog. The external base defines the complete stack; this leaf supplies the
# target criteria and Kubernetes version floor.
kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: kind

spec:
  base: base

  criteria:
    service: kind

  constraints:
    - name: K8s.server.version
      value: ">= 1.30"
