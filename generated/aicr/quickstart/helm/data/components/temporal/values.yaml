server:
  config:
    persistence:
      driver: sql
      default:
        driver: sql
        sql:
          driver: postgres12
          host: postgresql.postgresql.svc.cluster.local
          port: 5432
          database: temporal
          user: postgres
          password: postgres
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: postgresql.postgresql.svc.cluster.local
          port: 5432
          database: temporal_visibility
          user: postgres
          password: postgres

cassandra:
  enabled: false
mysql:
  enabled: false
postgresql:
  enabled: false
elasticsearch:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false

schema:
  createDatabase:
    enabled: true
  setup:
    enabled: true
  update:
    enabled: true
