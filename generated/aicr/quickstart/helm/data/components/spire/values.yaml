global:
  spire:
    clusterName: nke-aicr
    trustDomain: nke.local
    caSubject:
      country: US
      organization: NVIDIA
      commonName: NKE SPIRE CA
    recommendations:
      enabled: true
    namespaces:
      create: false
  installAndUpgradeHooks:
    enabled: false
  deleteHooks:
    enabled: false

spire-server:
  controllerManager:
    className: spire-mgmt-spire
  nodeAttestor:
    k8sPSAT:
      enabled: true
    tpmDirect:
      enabled: false

spiffe-oidc-discovery-provider:
  enabled: true
  tls:
    spire:
      enabled: true
