{{- $component := index .Values "controller" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller
    spec:
      serviceAccountName: controller
      containers:
        - name: controller
          image: "{{ $component.image.repository }}{{- if $component.image.digest }}@{{ $component.image.digest }}{{- else }}:{{ $component.image.tag }}{{- end }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          env:
            - name: DB_CONNECTION_STRING
              value: {{ $component.databaseURL | quote }}
            - name: CNPG_SUPERUSER_PASSWORD
              value: {{ $component.databasePassword | quote }}
            - name: TEMPORAL_HOST_PORT
              value: {{ $component.temporalAddress | quote }}
            - name: PROFILES_DIR
              value: {{ $component.profilesDirectory | quote }}
            - name: SPIFFE_ENABLED
              value: {{ $component.spiffe.enabled | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: {{ $component.spiffe.endpointSocket | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: controller
  ports:
    - name: http
      port: 8080
      targetPort: http
