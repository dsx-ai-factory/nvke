apiVersion: aicr.run/v1alpha2
kind: ComponentRegistry
components:
  # This entry intentionally replaces AICR's embedded cert-manager definition
  # to retain the NKE-qualified chart version.
  - name: cert-manager
    displayName: cert-manager
    helm:
      defaultRepository: https://charts.jetstack.io
      defaultChart: jetstack/cert-manager
      defaultVersion: v1.15.1
      defaultNamespace: cert-manager

  - name: spire-crds
    displayName: SPIRE CRDs
    helm:
      defaultRepository: https://spiffe.github.io/helm-charts-hardened
      defaultChart: spire-crds
      defaultVersion: 0.5.0
      defaultNamespace: spire-server

  - name: spire
    displayName: SPIRE
    helm:
      defaultRepository: https://spiffe.github.io/helm-charts-hardened
      defaultChart: spire
      defaultVersion: 0.27.1
      defaultNamespace: spire-server

  - name: postgresql
    displayName: PostgreSQL
    helm:
      defaultRepository: ""
      defaultNamespace: postgresql

  - name: temporal
    displayName: Temporal
    helm:
      defaultRepository: https://go.temporal.io/helm-charts
      defaultChart: temporal
      defaultVersion: 0.54.0
      defaultNamespace: temporal

  - name: controller
    displayName: NKE Controller
    helm:
      defaultRepository: ""
      defaultNamespace: controller
