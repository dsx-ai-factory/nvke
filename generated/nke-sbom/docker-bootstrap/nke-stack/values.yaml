# Bootstrap overlay for nke-stack: the ephemeral kind cluster `nkectl bootstrap
# site` creates on the machine it is provisioning, uses to drive kubeadm on that
# same host, and then deletes.
#
# Ported from cli/internal/cwedeploy/manifests/cwe-values.yaml, which is the
# shape this path installs today as four separate releases. Two consequences of
# the cluster being thrown away run through everything here: nothing is
# persisted, and nothing is observed.
#
# The image, the generated database password, the trust domain derived from the
# kind cluster name and profiles.image.* stay --set at run time. Only the
# command knows them, and an image reference is a runtime decision rather than a
# static value.

# No monitoring on a cluster whose lifetime is one bootstrap. Both keys: leaving
# global.monitoring.enabled true with the stack off renders ServiceMonitors
# against CRDs that are not there, which fails the install outright.
global:
  monitoring:
    enabled: false
prometheus-operator-crds:
  enabled: false
kube-prometheus-stack:
  enabled: false

postgresql:
  # Top level, NOT nested under `primary:`. That nesting is Bitnami's; the
  # in-repo chart this composition ships has no `primary` key, so the nested
  # form is an unknown value helm silently drops. It happened to be harmless
  # here only because the chart already defaults this to false.
  persistence:
    # The volume dies with the cluster, so asking for one only risks a PVC
    # that never binds.
    enabled: false

controller:
  # ProvisionedCluster, not NicoCluster: the host this cluster runs on already
  # exists, so the infrastructure provider adopts it rather than creating one.
  supportedInfraProviders: infra

  # A site cluster is a CAPI cluster, so CWE writes CAPI objects and needs the
  # RBAC for them. The chart default is false, and without it the controllers
  # start normally while every provisioning write is forbidden.
  capi:
    enabled: true
    rbac:
      create: true

  # The bootstrap reaches the API from the host, through the NodePort kind maps
  # to a host port, rather than from inside the cluster.
  service:
    port: 30080

  # Probes point at the same /readyz the CLI polls externally, so the in-cluster
  # probe and the command's own health wait agree on what healthy means: a
  # database ping and a Temporal health check both succeeding.
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # No OIDC on a vanilla kind cluster: nothing outside it presents a token.
  nkeOIDCAuth:
    enabled: false
  serviceMonitor:
    enabled: false
  metrics:
    networkPolicy:
      enabled: false

  # Nodes are provisioned before the cluster exists and join afterwards, so the
  # CNI is installed once they have.
  cni:
    installAfterInit: true
