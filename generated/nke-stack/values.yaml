# GENERATED by controller/cmd/composition-gen from controller/deploy/composition. Do not edit.
#
# INSTALL CONTRACT: Release.Namespace MUST be "temporal". That component's core
# templates have no namespaceOverride path, so the release namespace is pinned to
# the one name it cannot move away from and every other component carries an
# explicit override. Namespaces other than the release namespace must pre-exist:
# helm --create-namespace creates only the release namespace.

# Deploy phases, derived from the dependsOn edges in the composition.
#
# Helm does not order subcharts and never waits mid-release, so a single install
# races. Installing phase by phase, each with --wait, reproduces the ordering
# controller/Tiltfile gets from resource_deps. Components within a phase are
# independent and install together.
#
# Descriptive metadata: no template reads this. build/nke-stack.sh install and
# any other consumer drive the sequence from it.
phases:
  - name: datastore
    components: [postgresql, cert-manager, spire-crds, prometheus-operator-crds]
  - name: identity
    components: [kube-prometheus-stack, temporal, spire]
    # Not owned by this chart; supplied by controller/deploy/k8s/oidc-upstream-ca.yaml.
    # Checked explicitly because helm --wait only waits on workloads.
    requires:
      - kind: certificate
        name: oidc-provider-upstream-ca
        namespace: spire-server
        condition: Ready
  - name: controller
    components: [controller]

# Release-wide values: Helm merges `global` into every subchart at every
# depth, so these belong to the composition rather than to any one component.
global:
  deleteHooks:
    enabled: false
  installAndUpgradeHooks:
    enabled: false
  monitoring:
    enabled: true
  spire:
    jwtIssuer: https://nke.site-controller.internal
    recommendations:
      enabled: true
      strictMode: false
    trustDomain: example.org

# ─── postgresql ──────────────────────────────────────────────────────────
postgresql:
  # ─── postgresql ──────────────────────────────────────────────────────────────
  # Shared by cloud-workflow-engine and temporal. auth.password is not set here;
  # supply it at install time and pass the same value to temporal's two sql
  # password fields, which is what the Tiltfile does with one generated secret.
  #
  # This is the in-repo chart (controller/deploy/charts/postgresql), not the
  # Bitnami one -- see registry.yaml for why. Most of what the Bitnami values
  # configured is now the chart's own default, so only the deployment-specific
  # settings remain here.
  enabled: true
  namespaceOverride: postgres
  # Pin the service name so the FQDN temporal and cloud-workflow-engine resolve
  # stays correct regardless of what the release is called. Both dial
  # postgres-postgresql.postgres.svc.cluster.local from their own values, so this
  # is a contract with them. It is also the name the Bitnami chart produced under
  # release "postgres", which is why the swap needs no change on either consumer.
  fullnameOverride: postgres-postgresql
  auth:
    username: postgres
    database: postgres

# ─── cert-manager ────────────────────────────────────────────────────────
cert-manager:
  # ─── cert-manager ────────────────────────────────────────────────────────────
  # CRDs ship with the chart so Issuer/Certificate resources can be applied
  # immediately -- spire's OIDC provider leaf certificate depends on it.
  enabled: true
  namespace: cert-manager
  crds:
    enabled: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1

  # ─── spire ───────────────────────────────────────────────────────────────────
  # Site identity (clusterName, trustDomain, jwtIssuer), the TPM attestor
  # checksum, and the OIDC leaf's IP SANs are all deployment-specific and are
  # supplied at install time, exactly as controller/Tiltfile passes them.

# ─── spire-crds ──────────────────────────────────────────────────────────
# Enabled with no configuration.
spire-crds:
  enabled: true

# ─── prometheus-operator-crds ────────────────────────────────────────────
# Enabled with no configuration.
prometheus-operator-crds:
  enabled: true

# ─── kube-prometheus-stack ───────────────────────────────────────────────
kube-prometheus-stack:
  # ─── kube-prometheus-stack ───────────────────────────────────────────────────
  # Prometheus, Alertmanager, Grafana, node-exporter and kube-state-metrics. This
  # is what makes global.monitoring.enabled meaningful: without an operator the
  # monitoring.coreos.com CRDs do not exist and every ServiceMonitor the other
  # components render fails the install outright.
  #
  # Adopted from the AICR bundle's 004-kube-prometheus-stack component
  # (generated/aicr/observability/helm), which is the qualified configuration.
  enabled: true
  namespaceOverride: monitoring

  # CRDs come from the prometheus-operator-crds component instead. Helm does not
  # upgrade CRDs installed as part of a chart, so keeping them in their own
  # release is what makes them upgradable.
  crds:
    enabled: false

  # Pinned so the operator-derived names stay stable regardless of the release
  # name -- the operator creates StatefulSets as <workload>-<cr-name>, and the
  # chart renders CR names as <fullname>-<workload>. Under this umbrella the
  # release is nke-stack, which would otherwise rename all of them. Same reason
  # postgresql and temporal carry fullnameOverride.
  fullnameOverride: kube-prometheus

  prometheus:
    prometheusSpec:
      retention: 15d
      # Scrape ServiceMonitors from every namespace, and do not restrict to ones
      # this release created -- the components being scraped are sibling
      # subcharts with their own labels.
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelectorNilUsesHelmValues: false
      storageSpec:
        emptyDir:
          medium: ""
          sizeLimit: 10Gi
      resources:
        limits:
          cpu: 2
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
      tolerations:
        - operator: Exists

  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      tolerations:
        - operator: Exists

  grafana:
    enabled: true
    fullnameOverride: grafana
    # Development credential. A real deployment overrides this at install time;
    # nothing here is a secret that survives to a site.
    adminPassword: admin
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    tolerations:
      - operator: Exists

  prometheusOperator:
    tolerations:
      - operator: Exists
    admissionWebhooks:
      patch:
        tolerations:
          - operator: Exists

  nodeExporter:
    enabled: true

  prometheus-node-exporter:
    fullnameOverride: prometheus-node-exporter
    tolerations:
      - operator: Exists

  kube-state-metrics:
    fullnameOverride: kube-state-metrics
    tolerations:
      - operator: Exists

  thanosRuler:
    thanosRulerSpec:
      tolerations:
        - operator: Exists

# ─── temporal ────────────────────────────────────────────────────────────
temporal:
  # ─── temporal ────────────────────────────────────────────────────────────────
  # Owns the release namespace (see the header). The persistence host below is an
  # FQDN into postgresql's namespace, so it stays correct across the split.
  enabled: true
  # Pin the service names so temporal-frontend.temporal.svc.cluster.local stays
  # correct regardless of the release name. controller/Tiltfile installs this
  # chart as release "temporal"; inside one umbrella the release is nke-stack,
  # which would rename every service and break the host cloud-workflow-engine
  # dials. Same reason postgresql carries fullnameOverride above.
  fullnameOverride: temporal
  server:
    configMapsToMount: sprig
    setConfigFilePath: true
    config:
      persistence:
        driver: sql
        default:
          driver: sql
          sql:
            driver: postgres12
            host: postgres-postgresql.postgres.svc.cluster.local
            port: 5432
            database: temporal
            user: postgres
            maxConns: 10
            maxIdleConns: 5
        visibility:
          driver: sql
          sql:
            driver: postgres12
            host: postgres-postgresql.postgres.svc.cluster.local
            port: 5432
            database: temporal_visibility
            user: postgres
            maxConns: 10
            maxIdleConns: 5
  cassandra:
    enabled: false
  mysql:
    enabled: false
  # temporal bundles its own postgresql; the composition supplies one instead.
  postgresql:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
  elasticsearch:
    enabled: false
  schema:
    createDatabase:
      enabled: true
    setup:
      enabled: true
    update:
      enabled: true

  # ─── spire-crds ──────────────────────────────────────────────────────────────
  # Cluster-scoped CRDs only; namespace placement does not apply.

# ─── spire ───────────────────────────────────────────────────────────────
spire:
  # ─── spire ───────────────────────────────────────────────────────────────────
  # Site identity (clusterName, trustDomain, jwtIssuer), the TPM attestor
  # checksum, and the OIDC leaf's IP SANs are all deployment-specific and are
  # supplied at install time, exactly as controller/Tiltfile passes them.
  enabled: true
  # Each spire subchart resolves its namespace as: its own namespaceOverride,
  # else the global.spire.namespaces.* layout (only consulted when
  # global.spire.recommendations.enabled is true), else the release namespace.
  # controller/Tiltfile installs spire with `--namespace spire-server`, so every
  # resource lands there; the overrides below reproduce that from inside a
  # release whose namespace is temporal. The namespace must already exist --
  # helm's --create-namespace only creates the release namespace.
  # spire-agent and spiffe-csi-driver deliberately carry NO namespaceOverride:
  # they fall through to spire-system under the recommended layout. Both need
  # hostNetwork/hostPID and privileged, which the restricted PodSecurity label
  # on spire-server rejects outright. Pinning them to spire-server is what
  # nke-spire 0.1.0 did, and 0.1.1 had to undo after the DaemonSets failed to
  # create.
  spiffe-csi-driver: {}
  spire-agent:
    serviceAccount:
      # Pin the ServiceAccount name. The chart derives it as
      # "<Release.Name>-agent" unless this is set -- fullnameOverride does NOT
      # affect it -- and the server's PSAT allowlist has to name it exactly.
      # Pinning here keeps the allowlist correct whether this chart is installed
      # standalone or nested under another release; nke-spire hardcodes
      # nke-site-controller-agent instead, which holds for one release name only.
      name: spire-agent
    server:
      # Where the agent dials the server, which is a separate key from where
      # the agent's own resources land. Without it the agent derives
      # "<release>-server.<release namespace>" and dials into temporal, where
      # no server Service exists -- the agent then fails attestation with
      # "no children to pick from" and the DaemonSet never becomes Available.
      namespaceOverride: spire-server
  spire-server:
    namespaceOverride: spire-server
    # The bundle ConfigMap the agent mounts must land where the agent runs, or
    # the agent sits at Init:0/2 forever (nke-spire 0.1.2).
    bundlePublisher:
      k8sConfigMap:
        namespace: spire-system
    adminIDs:
      - spiffe://example.org/nke-service/cloud-workflow-engine
    controllerManager:
      className: spire-mgmt-spire
      identities:
        clusterSPIFFEIDs:
          default:
            # cloud-workflow-engine workloads use a dedicated nke-service
            # identity. Keep the fallback from racing it during reconciliation.
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - cloud-workflow-engine
    nodeAttestor:
      k8sPSAT:
        # The agent moved to spire-system, so the server must accept it from
        # there: the default allowlist is empty and attestation fails with
        # "is not an allowed service account". Stable because spire-agent's
        # fullnameOverride pins the ServiceAccount name (nke-spire 0.1.3 hit
        # this and pinned the release name instead).
        serviceAccountAllowList: ["spire-system:spire-agent"]
      tpmDirect:
        enabled: true
    extraVolumes:
      - name: tpm-pubhashes
        configMap:
          name: tpm-pubhashes
          optional: true
    extraVolumeMounts:
      - name: tpm-pubhashes
        mountPath: /run/spire/data/tpm-direct/hashes
        readOnly: true
  spiffe-oidc-discovery-provider:
    enabled: true
    namespaceOverride: spire-server
    replicaCount: 2
    tls:
      spire:
        enabled: false
      certManager:
        enabled: true
        issuer:
          # The composition's consumer owns the Issuer
          # (controller/deploy/k8s/oidc-upstream-ca.yaml).
          create: false
        certificate:
          duration: 2160h
          privateKey:
            algorithm: ECDSA
            size: 256
          dnsNames:
            - nke.site-controller.internal
            - localhost
          issuerRef:
            group: cert-manager.io
            kind: Issuer
            name: nke-oidc-upstream-ca
    config:
      # The provider rejects requests whose Host header is absent here. Literal
      # IPs tenants hit are appended at install time -- kube-apiserver fetches
      # the discovery URL by IP, not by the logical issuer host.
      additionalDomains:
        - "nke.site-controller.internal"
        - "localhost"
        - "127.0.0.1"

  # ─── cloud-workflow-engine ───────────────────────────────────────────────────
  # image.repository/tag are left at the chart's own defaults. The nvcr-published
  # chart already carries nvcr.io/j7sbcjl3qgta/nke-controller and the
  # svc-nke-ngc-imagepull secret -- chart-publish-nvcr.yml rewrites both at
  # package time -- so pulling the chart from nvcr gets a matching image without
  # any override here.
  #
  # An installer can still repoint them, which the CAPD e2e depends on: it builds
  # the controller at HEAD and loads it into kind, so it overrides repository and
  # tag and never pulls from a registry. Keeping cloud-workflow-engine a subchart
  # with live values is what makes that possible.

# ─── controller ──────────────────────────────────────────────────────────
controller:
  # ─── cloud-workflow-engine ───────────────────────────────────────────────────
  # image.repository/tag are left at the chart's own defaults. The nvcr-published
  # chart already carries nvcr.io/j7sbcjl3qgta/nke-controller and the
  # svc-nke-ngc-imagepull secret -- chart-publish-nvcr.yml rewrites both at
  # package time -- so pulling the chart from nvcr gets a matching image without
  # any override here.
  #
  # An installer can still repoint them, which the CAPD e2e depends on: it builds
  # the controller at HEAD and loads it into kind, so it overrides repository and
  # tag and never pulls from a registry. Keeping cloud-workflow-engine a subchart
  # with live values is what makes that possible.
  enabled: true
  namespaceOverride: cloud-workflow-engine

